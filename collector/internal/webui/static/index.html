    background: rgba(49,130,246,0.10); color: var(--accent-blue); font-size: 0.85rem; font-weight: 700;
  }
  .plan-subscribe-btn {
    padding: 0.65rem 1.4rem; border: 1px solid var(--accent-blue); background: var(--accent-blue);
    color: #fff; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
  }
  .plan-subscribe-btn:hover { background: var(--accent-blue-deep); border-color: var(--accent-blue-deep); }

  /* ---------- 모바일 반응형 최소 대응 ----------
     그리드류(dash-tiles/checkbox-grid/detail-meta 등)는 이미
     auto-fit/auto-fill이라 미디어쿼리 없이도 좁은 화면에서 알아서
     열이 줄어든다. 여기서는 그걸로 안 풀리는 것들만: 헤더/카드
     여백 축소, 필터 폼 한 줄 배치. */
  @media (max-width: 640px) {
    .site-header { padding: 1rem; }
    main { padding: 1.5rem 1rem 3rem; }
    .header-right { gap: 0.85rem; }
    .header-links, .auth-nav { gap: 0.85rem; font-size: 0.85rem; }

    .detail-card, .ai-summary-card, .ai-participation-card, .review-item,
    .auth-card, .license-confirm-form, .profile-completeness-card {
      padding: 1.1rem;
    }
    .home-hero { padding: 1.75rem 1.25rem; }
    .home-hero-title { font-size: 1.25rem; }

    .filters { padding: 0.85rem; }
    .filters input[name="q"] { flex-basis: 100%; min-width: 0; }
    .filters select[name="region"], .filters input[name="industry"] { flex: 1; min-width: 0; }
    .filters select[name="sort"] { flex-basis: 100%; }
    .filters button { flex: 1; }

    .review-actions { flex-wrap: wrap; }
  }

  /* ---------- 터치 타겟 최소 44px (터치 입력 기기 한정) ----------
     hover 위주로 설계된 작은 아이콘류(용어설명 버튼 등)는 터치에서도
     원래 크기를 유지한다 — 부차적인 정보 트리거라 44px로 키우면
     오히려 본문 레이아웃을 깨뜨린다. 실제로 반복 조작하는 버튼/링크/
     입력 요소만 대상으로 한다. */
  @media (pointer: coarse) {
    .filters button, .auth-form button, .profile-form button,
    .license-toolbar button, .review-btn, .btn,
    .pipeline-review-btn, .field-verify-btn, .home-cta-primary,
    .home-cta-secondary, .calendar-add-link, .checklist-status-select,
    .plan-subscribe-btn, #checkout-pay-btn, #logout-btn {
      min-height: 44px;
    }
    .bookmark-btn, .mobile-menu-toggle {
      min-width: 44px; min-height: 44px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .header-links a, .auth-nav a, .link-btn, .back-link, .home-browse-link,
    .official-link, .pipeline-review-link, .ai-next-action {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
    }
    .auth-form input, .profile-form input, .filters input {
      min-height: 44px;
    }
    input[type="checkbox"] { width: 1.3rem; height: 1.3rem; }
  }

  /* ---------- 참여판단 보고서(인쇄/PDF 저장용) ----------
     별도 PDF 라이브러리 없이 브라우저 인쇄 대화상자의 "PDF로 저장"을
     이용한다 — @media print가 사이드바/탭바/헤더/.no-print 요소를
     숨기고 .report-page만 종이 한 장처럼 보이게 만든다. */
  .report-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-lg); gap: var(--space-sm); flex-wrap: wrap; }
  .report-page {
    max-width: 760px; margin: 0 auto; background: #fff; border: 1px solid var(--border);
    border-radius: var(--radius-card); padding: var(--space-xl); box-shadow: var(--shadow-soft);
  }
  .report-doc-title { margin: 0; font-size: var(--text-caption); font-weight: 700; color: var(--accent-blue); letter-spacing: 0.05em; }
  .report-notice-title { margin: 0.3rem 0 var(--space-lg); font-size: 1.4rem; font-weight: 700; color: var(--navy); line-height: 1.4; }
  .report-section { margin-top: var(--space-xl); padding-top: var(--space-lg); border-top: 1px solid var(--border); }
  .report-section-title { margin: 0 0 var(--space-sm); font-size: 1rem; font-weight: 700; color: var(--ink); }
  .report-grade-head { display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap; }
  .report-grade-score { font-size: var(--text-caption); color: var(--ink-soft); }
  .report-grade-reason { margin: 0.6rem 0 0; font-size: var(--text-caption); color: var(--ink-soft); }
  .report-table { width: 100%; border-collapse: collapse; margin-top: var(--space-md); font-size: var(--text-caption); }
  .report-table th, .report-table td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  .report-table th { color: var(--ink-soft); font-weight: 600; }
  .report-summary-list { margin: 0; padding-left: 1.2rem; }
  .report-summary-list li { margin-bottom: 0.4rem; }
  .report-meta-caption { margin: var(--space-sm) 0 0; font-size: 0.78rem; color: var(--ink-soft); }
  .report-condition-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-md); }
  .report-condition-name { margin: 0 0 0.35rem; font-size: 0.92rem; color: var(--ink); }
  .report-footer-note { margin-top: var(--space-xl); padding-top: var(--space-md); border-top: 1px solid var(--border); font-size: 0.78rem; color: var(--ink-soft); }

  @media print {
    .sidebar, .tabbar, .site-header, .no-print { display: none !important; }
    body { background: #fff; }
    main { max-width: none !important; margin: 0 !important; padding: 0 !important; }
    .report-page { border: none; box-shadow: none; padding: 0; max-width: none; }
  }

  /* ---------- 부팅 오버레이(app-booting) — 정적 HTML이 그려진 시점부터
     await loadMe(); route(); 가 끝나 최종 레이아웃(사이드바 유무 등)이
     확정되는 순간까지, 앱 셸이 잘못된 상태로 잠깐 보였다 사라지는
     깜빡임(FOUC)을 막는다. <body>에 이 클래스가 정적으로 박혀있어
     JS가 실행되기 전부터 이미 적용된 상태로 첫 페인트가 일어나고,
     route()가 최종 레이아웃 클래스를 다 정한 뒤에야 JS가 클래스를
     제거한다. ---------- */
  body.app-booting #global-profile-banner,
  body.app-booting .site-header,
  body.app-booting .sidebar,
  body.app-booting .tabbar,
  body.app-booting main#app {
    visibility: hidden;
  }
  .app-boot-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }
  body.app-booting .app-boot-overlay {
    display: flex;
  }
  .app-boot-spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--accent-blue);
    border-radius: 50%;
    animation: app-boot-spin 0.7s linear infinite;
  }
  @keyframes app-boot-spin {
    to { transform: rotate(360deg); }
  }

  /* ---------- 랜딩페이지(비로그인 첫 화면) — 지금 앱(로그인 후 대시보드)
     과 완전히 독립된 레이아웃. body.is-landing일 때 기존 앱 셸(사이드바/
     헤더/탭바/전역 프로필 배너)을 숨기고 #app을 전체 폭으로 연다 —
     @media print이 인쇄 시 같은 요소들을 숨기는 것과 같은 원리를 화면
     표시에도 적용했다. 섹션 내부 너비는 .landing-container가 관리하므로
     main의 기본 max-width/padding은 여기서 전부 해제한다. */
  body.is-landing .sidebar,
  body.is-landing .site-header,
  body.is-landing .tabbar,
  body.is-landing #global-profile-banner {
    display: none !important;
  }

const app = document.getElementById('app');

function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content; }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

// ---------- 모달 / 바텀시트 공용 헬퍼 ----------
// 데스크톱에선 중앙 모달, 좁은 화면에선 하단 바텀시트로 보이는 같은
// 컴포넌트(.modal-overlay/.modal-panel의 미디어쿼리가 위치만 바꿈).
// openModal()이 반환하는 patternel(모달 body 컨테이너)에 호출한 쪽이
// 폼을 채우고 이벤트를 바인딩한다 — renderXxx 함수들이 h()로 리스트를
// 그리는 것과 같은 패턴.
function openModal(title, bodyHtml, opts) {
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'active-modal-overlay';
  overlay.appendChild(h(`
    <div class="modal-panel">
      <div class="modal-header">
        <h3 class="modal-title">${escapeHtml(title)}</h3>
        <button type="button" class="modal-close-btn" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body"></div>
    </div>
  `));
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
  overlay.querySelector('.modal-body').appendChild(h(bodyHtml));
  // disableBackdropClose — 여러 단계를 이어가는 흐름(온보딩 카드 모달 등)
  // 에서는 바깥을 실수로 클릭해 전체 진행이 날아가는 걸 막기 위해 배경
  // 클릭으로 닫히는 기본 동작을 끌 수 있다(닫기 버튼(X)은 그대로 동작).
  if (!(opts && opts.disableBackdropClose)) {
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  }
  overlay.querySelector('.modal-close-btn').addEventListener('click', closeModal);
  window.__modalOnClose = (opts && opts.onClose) || null;
  return overlay.querySelector('.modal-body');
}
function closeModal() {
  const overlay = document.getElementById('active-modal-overlay');
  if (!overlay) return;
  overlay.remove();
  document.body.style.overflow = '';
  const onClose = window.__modalOnClose;
  window.__modalOnClose = null;
  if (onClose) onClose();
}

function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return '-';
  return d.toISOString().slice(0, 10);
}

function formatBudget(n) {
  if (n === null || n === undefined) return '-';
  return Number(n).toLocaleString('ko-KR') + '원';
}

function formatDateTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return '-';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatFileSize(bytes) {
  if (bytes === null || bytes === undefined) return '';
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + 'KB';
  return (bytes / 1024 / 1024).toFixed(1) + 'MB';
}

function statusBadgeHtml(status) {
  const label = STATUS_LABELS[status] || status || '-';
  const cls = status === 'reannounced' ? 'status-badge--warn'
    : (status === 'closed' || status === 'cancelled') ? 'status-badge--muted' : '';
  const inner = status === 'reannounced' ? glossaryHtml('재공고', label) : escapeHtml(label);
  return `<span class="status-badge ${cls}">${inner}</span>`;

// 마감일을 사각 배지(pill)로 표시: D-5 이내는 위험색, 지난 공고는 무채색.
function ddayInfo(iso) {
  if (!iso) return { label: '-', cls: 'dday-badge--muted' };
  const d = new Date(iso);
  if (isNaN(d)) return { label: '-', cls: 'dday-badge--muted' };
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(d);
  target.setHours(0, 0, 0, 0);
  const diffDays = Math.round((target - today) / 86400000);
  if (diffDays < 0) return { label: '마감', cls: 'dday-badge--muted' };
  if (diffDays === 0) return { label: 'D-DAY', cls: 'dday-badge--danger' };
  if (diffDays <= 5) return { label: 'D-' + diffDays, cls: 'dday-badge--danger' };
  return { label: 'D-' + diffDays, cls: '' };
}

function ddayBadgeHtml(iso, extraClass) {
  const info = ddayInfo(iso);
  return `<span class="dday-badge mono ${info.cls} ${extraClass || ''}">${escapeHtml(info.label)}</span>`;
}

function bookmarkButtonHtml(noticeId, isBookmarked) {
  return `<button type="button" class="bookmark-btn${isBookmarked ? ' is-bookmarked' : ''}" ` +
    `data-notice-id="${escapeAttr(noticeId)}" data-bookmarked="${isBookmarked ? 'true' : 'false'}" ` +
    `aria-pressed="${isBookmarked ? 'true' : 'false'}" aria-label="관심공고 등록/해제" title="관심공고">` +
    `${isBookmarked ? '★' : '☆'}</button>`;
}

// container 안의 모든 .bookmark-btn에 클릭 핸들러를 붙인다. 부모 .row-card의
// "상세로 이동" 클릭을 막기 위해 stopPropagation을 쓰고, 비로그인이면 로그인
// 페이지로 보낸다(기존 다른 버튼들과 동일한 패턴). opts.onUnbookmark(noticeId, btn)는
// 해제 성공 시 호출 — 관심공고 목록 페이지에서 카드를 즉시 제거하는 데 쓴다.
function wireBookmarkButtons(container, opts) {
  container.querySelectorAll('.bookmark-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!currentUser) {
        location.hash = '#/auth/login';
        return;
      }
      const noticeId = btn.dataset.noticeId;
      const next = btn.dataset.bookmarked !== 'true';
      btn.disabled = true;
      try {
        await apiRequest('PUT', '/api/notices/' + encodeURIComponent(noticeId) + '/bookmark', { bookmarked: next });
        btn.dataset.bookmarked = next ? 'true' : 'false';
        btn.setAttribute('aria-pressed', next ? 'true' : 'false');
        btn.classList.toggle('is-bookmarked', next);
        btn.textContent = next ? '★' : '☆';
        if (!next && opts && opts.onUnbookmark) opts.onUnbookmark(noticeId, btn);
      } catch (err) {
        if (err.status === 401) location.hash = '#/auth/login';
      } finally {
        btn.disabled = false;
      }
    });
  });
}

let tooltipCounter = 0;
function tooltipIconHtml(icon, text, ariaLabel, extraClass) {
  tooltipCounter++;
  const id = 'tip-' + tooltipCounter;
  return `<span class="glossary">` +
    `<button type="button" class="glossary-btn ${extraClass || ''}" aria-expanded="false" aria-describedby="${id}" aria-label="${escapeAttr(ariaLabel)}">${icon}</button>` +
    `<span class="glossary-tooltip" id="${id}" role="tooltip">${escapeHtml(text)}</span>` +
    `</span>`;
}
function glossaryHtml(term, label) {
  const def = GLOSSARY[term];
  const display = label || term;
  if (!def) return escapeHtml(display);
  return escapeHtml(display) + tooltipIconHtml('?', def, term + ' 용어 설명', '');
}

function closeAllGlossary() {
  document.querySelectorAll('.glossary.is-open').forEach(el => {
    el.classList.remove('is-open');

    if (btn) btn.setAttribute('aria-expanded', 'false');
  });
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('.glossary-btn');
  if (btn) {
    e.stopPropagation();
    const wrap = btn.closest('.glossary');
    const willOpen = !wrap.classList.contains('is-open');
    closeAllGlossary();
    if (willOpen) {
      wrap.classList.add('is-open');
      btn.setAttribute('aria-expanded', 'true');
    }
    return;
  }
  closeAllGlossary();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeAllGlossary();
});

const ELIGIBILITY_RESULT_LABELS = {
  met: '충족',
  not_met: '미충족',
  needs_confirmation: '확인 필요',
  insufficient_data: '자료 부족',
};

function eligResultHtml(result) {
  const label = ELIGIBILITY_RESULT_LABELS[result] || result;
  if (result === 'needs_confirmation') return glossaryHtml('확인 필요', label);
  if (result === 'insufficient_data') return glossaryHtml('자료 부족', label);
  return escapeHtml(label);
}

function eligCategoryHtml(category) {
  if (category === '업종') return glossaryHtml('업종 판정', category);
  return escapeHtml(category);
}

async function apiRequest(method, url, body) {
  const opts = { method };
  if (body !== undefined) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(url, opts);
  let data = null;
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) {
    const code = data && data.error;
    const err = new Error((code && ERROR_MESSAGES[code]) || ('요청 실패 (' + res.status + ')'));
    err.code = code;
    err.status = res.status;
    err.data = data; // 코드-메시지 매핑에 없는 추가 정보(예: 환불 거부 사유의 사용 이력 요약)가 필요한 호출부용
    throw err;
  }
  return data;
}

let currentUser = null;
let currentProfile = null;

// ---------- 브랜드명(관리자 #/admin/company-info에서 편집) ----------
// 지금은 가칭 "공공사업 AI 비서"라 나중에 실제 브랜드명이 정해지면
// 코드 곳곳을 일일이 고치지 않고 이 값 하나만 바꾸면 되게 만들었다.
// DEFAULT_BRAND_NAME은 fetch 자체가 실패했을 때(네트워크 오류 등)
// 화면이 빈 문자열로 깨지지 않게 하는 최후의 폴백 — 정상 동작 시에는
// 항상 DB의 company_info.brand_name(NOT NULL) 값을 쓴다.
const DEFAULT_BRAND_NAME = '공공사업 AI 비서';
let currentBrandName = DEFAULT_BRAND_NAME;

// applyBrandName — document.title과 .brand-name-text 클래스가 붙은 모든
// 요소(헤더 로고, 사이드바 로고, 랜딩페이지 로고/푸터 저작권 표시)의
// 텍스트를 한 번에 갱신한다. 동기 함수라 렌더 함수가 새 DOM을 만든
// 직후 바로 다시 호출해도 저렴하다(랜딩페이지가 매번 그렇게 함 —
// fetch를 새로 안 하고 이미 알고 있는 currentBrandName을 새 DOM에
// 즉시 적용).
function applyBrandName(name) {
  currentBrandName = (name && name.trim()) || DEFAULT_BRAND_NAME;
  document.title = currentBrandName;
  document.querySelectorAll('.brand-name-text').forEach(el => {
    el.textContent = currentBrandName;
  });
  // 스크린샷 alt 텍스트 중 브랜드명이 들어가는 것들(랜딩 히어로/스포트라이트
  // 대시보드 이미지) — HTML을 새로 그릴 때는 이미 currentBrandName으로
  // 채워 넣지만, 그 뒤(예: loadBrandName의 fetch가 나중에 도착)에도 stale
  // 값이 안 남게 여기서 한 번 더 맞춰준다.
  document.querySelectorAll('[data-brand-alt-suffix]').forEach(el => {
    el.alt = currentBrandName + el.getAttribute('data-brand-alt-suffix');
  });
}

// loadBrandName — 앱 부팅 시(loadMe()와 별개로, 로그인 여부와 무관하게)
// 한 번 호출해 브랜드명을 읽어온다. 공개 API라 비로그인 방문자도
// 정상적으로 최신 브랜드명을 본다.
async function loadBrandName() {
  try {
    const data = await apiRequest('GET', '/api/company-info');
    applyBrandName(data.brandName);
  } catch (err) {
    applyBrandName(null);
  }
}

async function loadMe() {
  try {
    const data = await apiRequest('GET', '/api/me');
    currentUser = data.user;
    currentProfile = data.companyProfile;
  } catch (err) {
    currentUser = null;
    currentProfile = null;
  }
  renderHeader();
  if (currentUser) refreshUnreadNotificationCount();
  renderGlobalProfileBanner();
}

// setNotificationBadge — 사이드바/탭바의 "알림" 아이콘 위에 안읽음
// 개수를 작은 배지로 겹쳐 그린다(0이면 배지 자체를 지운다). 두 nav 모두
// data-path="#/notifications"인 아이템 안의 아이콘 wrapper를 찾아서 붙인다.
function setNotificationBadge(count) {
  document.querySelectorAll('[data-path="#/notifications"]').forEach(item => {
    const iconWrap = item.querySelector('.sidebar-menu-icon, .tabbar-icon');
    if (!iconWrap) return;
    let badge = iconWrap.querySelector('.nav-badge');
    if (count > 0) {
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'nav-badge';
        iconWrap.appendChild(badge);
      }
      badge.textContent = count > 99 ? '99+' : String(count);
    } else if (badge) {
      badge.remove();
    }
  });
}

async function refreshUnreadNotificationCount() {
  try {
    const data = await apiRequest('GET', '/api/me/notifications/unread-count');
    setNotificationBadge(data.count || 0);
  } catch (err) { /* 배지 하나 실패했다고 화면을 막을 일은 아님 — 조용히 무시 */ }
}

      <a href="#/pipeline">진행 중 사업</a>
      <a href="#/calendar">캘린더</a>
      <a href="#/me/bookmarks">관심공고</a>
      <a href="#/me/profile">내 프로필</a>
      <a href="#/me/licenses">면허·인증</a>
      <a href="#/growth">성장분석</a>
      <a href="#/me/subscription">내 구독</a>

    nav.innerHTML = '';

      <a href="#/auth/login">로그인</a>
      <a href="#/auth/signup">회원가입</a>

  renderSidebar();
  renderTabbar();
}

// ---------- 홈: AI 대시보드 ----------
// #/의 첫 화면. 로그인 상태·프로필 등록 여부는 /api/dashboard 응답 자체로
// 판단한다(401 → 마케팅 CTA, hasProfile:false → 온보딩 CTA) — currentUser
// 전역값은 loadMe()가 비동기로 채우는 중일 수 있어 신뢰하지 않는다.
async function renderHome(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/dashboard');
  } catch (err) {
    if (err.status === 401) {
      renderLandingPage(container);
      return;
    }
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  if (!data.hasProfile) {
    renderOnboardingHero(container);
    return;
  }

  renderDashboard(container, data);
}

// ---------- 홈 진입 오버레이 오케스트레이션 ----------
// 팝업(관리자 CMS 5번)과 배너 레이어(1번)는 둘 다 화면 전체를 덮는
// 오버레이라 동시에 뜨면 서로 가린다 — 팝업(관리자가 시의성 있게 등록한
// 공지)을 우선하고, 오늘 안 닫은 팝업이 없을 때만 배너를 보여준다.
// renderLandingPage/renderOnboardingHero/renderDashboard는 이 함수
// 하나만 호출한다.
async function renderHomeOverlay() {
  const shownPopup = await tryRenderPopupLayer();
  if (!shownPopup) {
    await renderHomeBannerSlide();
  }
}

// simpleMarkdownToHtml — 팝업 콘텐츠용 최소 마크다운(굵게, 링크 자동
// 인식, 줄바꿈)만 지원한다. 복잡한 리치텍스트 에디터 라이브러리는
// 스펙에서 명시적으로 지양 — 반드시 escapeHtml로 먼저 이스케이프한
// 뒤 최소 태그만 허용해 관리자가 입력한 텍스트로 인한 XSS를 막는다.
function simpleMarkdownToHtml(text) {
  let out = escapeHtml(text);
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/\n/g, '<br>');
  return out;
}

// legalMarkdownToHtml — 이용약관/개인정보처리방침처럼 제목(#~###)·목록(-)·
// 표(|...|)·인용(>)이 있는 긴 문서용 마크다운 렌더러. simpleMarkdownToHtml
// (팝업용, 굵게+줄바꿈+URL만 지원)보다 풍부하지만 여전히 라이브러리 없이
// 직접 구현한 최소 파서다 — legal_documents_seed.go의 시드 콘텐츠 구조에
// 맞춰 딱 필요한 문법만 지원한다(중첩 목록, 인라인 코드 등은 미지원).
function legalMarkdownToHtml(text) {
  function inlineFormat(s) {
    let out = escapeHtml(s);
    out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    return out;
  }
  const lines = text.split('\n');
  const out = [];
  let inList = false;
  let tableRows = [];
  let tableRowIndex = 0;
  function closeList() { if (inList) { out.push('</ul>'); inList = false; } }
  function closeTable() {
    if (tableRows.length) { out.push('<table class="legal-doc-table">' + tableRows.join('') + '</table>'); tableRows = []; tableRowIndex = 0; }
  }
  for (const line of lines) {
    const trimmed = line.trim();
    if (/^###\s+/.test(trimmed)) { closeList(); closeTable(); out.push(`<h3>${inlineFormat(trimmed.replace(/^###\s+/, ''))}</h3>`); continue; }
    if (/^##\s+/.test(trimmed)) { closeList(); closeTable(); out.push(`<h2>${inlineFormat(trimmed.replace(/^##\s+/, ''))}</h2>`); continue; }
    if (/^#\s+/.test(trimmed)) { closeList(); closeTable(); out.push(`<h1>${inlineFormat(trimmed.replace(/^#\s+/, ''))}</h1>`); continue; }
    if (/^>\s?/.test(trimmed)) { closeList(); closeTable(); out.push(`<blockquote>${inlineFormat(trimmed.replace(/^>\s?/, ''))}</blockquote>`); continue; }
    if (/^-\s+/.test(trimmed)) {
      closeTable();
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push(`<li>${inlineFormat(trimmed.replace(/^-\s+/, ''))}</li>`);
      continue;
    }
    if (/^\|.*\|$/.test(trimmed)) {
      closeList();
      const cells = trimmed.slice(1, -1).split('|').map(c => c.trim());
      if (cells.every(c => /^-+$/.test(c))) { continue; } // 헤더 구분선(|---|---|) 무시
      const tag = tableRowIndex === 0 ? 'th' : 'td';
      tableRows.push('<tr>' + cells.map(c => `<${tag}>${inlineFormat(c)}</${tag}>`).join('') + '</tr>');
      tableRowIndex++;
      continue;
    }
    closeList();
    closeTable();
    if (trimmed === '---') { out.push('<hr>'); continue; }
    if (trimmed === '') { continue; }
    out.push(`<p>${inlineFormat(trimmed)}</p>`);
  }
  closeList();
  closeTable();
  return out.join('\n');
}

// renderLegalDocument — #/terms, #/privacy(공개, 로그인 불필요). 회원가입
// 2단계의 "보기" 링크가 새 탭으로 여기를 연다. docType은 'terms'|'privacy'.
async function renderLegalDocument(container, docType) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));
  let data;
  try {
    data = await apiRequest('GET', `/api/legal-documents/${docType}`);
  } catch (err) {
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="legal-doc-page">
      <p class="license-card-meta">버전 ${escapeHtml(data.version)} · 시행일 ${escapeHtml(data.effectiveDate)}</p>
      <div class="legal-doc-content">${legalMarkdownToHtml(data.content)}</div>
    </div>
  `));
}

// tryRenderPopupLayer — 활성 팝업 중 오늘 아직 "하루 보지 않기"로 안 닫은
// 첫 번째 것을 오버레이로 띄운다. 뭔가 보여줬으면 true를 돌려줘
// renderHomeOverlay가 배너를 건너뛰게 한다.
async function tryRenderPopupLayer() {
  let items;
  try {
    const data = await apiRequest('GET', '/api/popups');
    items = data.items || [];
  } catch (err) {
    return false;
  }
  const today = todayDateString();
  const popup = items.find(p => localStorage.getItem(`popup_dismissed_${p.id}_${today}`) !== '1');
  if (!popup) return false;

  document.getElementById('banner-layer-overlay')?.remove();
  const overlay = document.createElement('div');
  overlay.id = 'banner-layer-overlay';
  overlay.className = 'banner-layer-overlay';
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
  overlay.innerHTML = `
    <div class="popup-layer-card">
      ${popup.imageUrl ? `<img src="${escapeAttr(popup.imageUrl)}" alt="" class="popup-layer-image">` : ''}
      <div class="popup-layer-body">
        <h3 class="popup-layer-title">${escapeHtml(popup.title)}</h3>
        <div class="popup-layer-content">${simpleMarkdownToHtml(popup.content)}</div>
      </div>
      <div class="popup-layer-footer">
        <label class="checkbox-label"><input type="checkbox" id="popup-dismiss-today-input"> 오늘 하루 보지 않기</label>
        <button type="button" class="btn btn-secondary btn-sm" id="popup-close-btn">닫기</button>
      </div>
    </div>
  `;
  overlay.querySelector('#popup-close-btn').addEventListener('click', () => {
    if (overlay.querySelector('#popup-dismiss-today-input').checked) {
      localStorage.setItem(`popup_dismissed_${popup.id}_${today}`, '1');
    }
    document.body.style.overflow = '';
    overlay.remove();
  });
  return true;
}

// ---------- 배너 레이어(홈 화면 진입 시 오버레이 팝업, 관리자 CMS 1번) ----------
// renderLandingPage/renderOnboardingHero/renderDashboard 세 곳 모두에서
// 호출한다 — 홈 화면에 진입할 때마다(로그인/프로필 유무 무관) 화면
// 전체를 덮는 오버레이로 뜬다. 페이지 안 인라인 요소가 아니라
// document.body에 직접 붙는 전역 레이어라(#app이 route()에 갈아끼워져도
// 무관), 여러 홈 변형 함수가 중복 호출해도 이미 떠 있으면 하나만
// 남도록 매번 기존 오버레이를 먼저 제거한다. 실패(네트워크 오류 등)해도
// 조용히 무시한다 — 핵심 기능이 아니므로 에러 문구를 띄우지 않는다.
//
// "오늘 하루 보지 않기" — 닫기(×) 버튼을 누르면 localStorage에 오늘
// 날짜를 저장하고, 같은 날 안에는 다시 렌더링 자체를 건너뛴다(API 호출도
// 안 함 — 어차피 안 보여줄 걸 굳이 가져올 이유가 없음). 이 웹앱은
// artifact가 아니라 일반 서비스라 localStorage 사용에 제약이 없다.
const BANNER_DISMISS_KEY = 'home_banner_dismissed_date';
function todayDateString() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
async function renderHomeBannerSlide() {
  document.getElementById('banner-layer-overlay')?.remove();
  if (localStorage.getItem(BANNER_DISMISS_KEY) === todayDateString()) return;

  let items;
  try {
    const data = await apiRequest('GET', '/api/banners');
    items = data.items || [];
  } catch (err) {
    return;
  }
  if (!items.length) return;

  const overlay = document.createElement('div');
  overlay.id = 'banner-layer-overlay';
  overlay.className = 'banner-layer-overlay';
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
  renderBannerSlideInto(overlay, items);
}

function renderBannerSlideInto(overlay, items) {
  let current = 0;
  const hasMultiple = items.length > 1;
  overlay.innerHTML = `
    <div class="banner-slide">
      <div class="banner-slide-track">
        ${items.map(b => `
          <a class="banner-slide-item" ${b.linkUrl ? `href="${escapeAttr(b.linkUrl)}"` : `href="#" onclick="return false;"`}>
            <img src="${escapeAttr(b.imageUrl)}" alt="${escapeAttr(b.title)}" loading="lazy">
          </a>
        `).join('')}
      </div>
      <button type="button" class="banner-slide-close" aria-label="오늘 하루 보지 않기">&times;</button>
      ${hasMultiple ? `
        <button type="button" class="banner-slide-arrow banner-slide-arrow--prev" aria-label="이전 배너">&lsaquo;</button>
        <button type="button" class="banner-slide-arrow banner-slide-arrow--next" aria-label="다음 배너">&rsaquo;</button>
        <div class="banner-slide-dots">
          ${items.map((_, i) => `<button type="button" class="banner-slide-dot" data-index="${i}" aria-label="${i + 1}번째 배너로 이동"></button>`).join('')}
        </div>
      ` : ''}
    </div>
  `;
  const track = overlay.querySelector('.banner-slide-track');
  const dots = Array.from(overlay.querySelectorAll('.banner-slide-dot'));
  let timer = null;

  function update() {
    track.style.transform = `translateX(-${current * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle('is-active', i === current));
  }
  function go(delta) {
    current = (current + delta + items.length) % items.length;
    update();
  }
  update();

  // 닫기는 X 버튼으로만 — 배경(오버레이) 클릭으로는 안 닫히게 해서
  // "뒤 선택 못하게" 요구사항을 그대로 지킨다.
  overlay.querySelector('.banner-slide-close').addEventListener('click', () => {
    localStorage.setItem(BANNER_DISMISS_KEY, todayDateString());
    if (timer) clearInterval(timer);
    document.body.style.overflow = '';
    overlay.remove();
  });
  if (!hasMultiple) return;

  overlay.querySelector('.banner-slide-arrow--prev').addEventListener('click', () => go(-1));
  overlay.querySelector('.banner-slide-arrow--next').addEventListener('click', () => go(1));
  dots.forEach((d, i) => d.addEventListener('click', () => { current = i; update(); }));

  const AUTO_ADVANCE_MS = 5000;
  timer = setInterval(() => go(1), AUTO_ADVANCE_MS);
  overlay.addEventListener('mouseenter', () => clearInterval(timer));
  overlay.addEventListener('mouseleave', () => { timer = setInterval(() => go(1), AUTO_ADVANCE_MS); });
}

// ---------- 전역 프로필 미완성 안내 배너 ----------
// #app 밖의 #global-profile-banner에 렌더링되어 route()가 화면을 갈아
// 끼워도 사라지지 않는다(사용자 피드백: "메인에만 있는게 아니다, 최상단에
// 계속 있어야 한다"). loadMe()(로그인/로그아웃/부팅 시)와 route()(모든
// 페이지 이동)가 매번 호출해 항상 최신 상태를 반영한다. 회사 프로필을
// 저장하는 모달(#/me/profile의 수정 폼)처럼 해시가 안 바뀌는 곳은 저장
// 성공 직후 직접 호출한다.
//
// 완성도%는 /api/me/profile-completeness(기존 API, 스펙 요구사항대로
// 재사용)를 직접 호출해서 얻는다 — dashboard.go의 growthSummary를
// 재사용하던 이전 버전은 홈 화면에서만 동작해 전역으로 못 썼다. 지역/
// 업종/기업규모(온보딩 3개 필수항목)는 이 API 응답에 없어서(선택
// 카테고리만 채점, company_profile_completeness.go) currentProfile(이미
// loadMe()가 채워둔 값)에서 직접 확인한다 — 별도 API 호출 불필요.
async function renderGlobalProfileBanner() {
  const slot = document.getElementById('global-profile-banner');
  if (!slot) return;
  if (!currentUser || !currentProfile) { slot.innerHTML = ''; return; }

  const missingRequired = !(currentProfile.region && (currentProfile.industry || []).length && currentProfile.companySize);
  let pct = 0;
  try {
    const data = await apiRequest('GET', '/api/me/profile-completeness');
    pct = data.overallCompleteness || 0;
  } catch (err) {
    slot.innerHTML = '';
    return;
  }
  if (!missingRequired && pct >= 100) { slot.innerHTML = ''; return; }

  const text = missingRequired
    ? '필수 정보를 입력해주세요. 지역·업종·기업규모를 등록해야 맞춤 공고 추천과 AI 분석을 받을 수 있습니다.'
    : `기업 프로필을 완성하면 더 정확한 분석을 받을 수 있습니다. (현재 ${pct}%)`;
  slot.innerHTML = `
    <div class="profile-incomplete-banner ${missingRequired ? 'profile-incomplete-banner--urgent' : ''}">
      <span class="profile-incomplete-banner-text">${escapeHtml(text)}</span>
      <a href="#/me/profile" class="profile-incomplete-banner-cta">프로필 완성하기 →</a>
    </div>
  `;
}

// initLandingRevealAnimations — 스크롤하며 섹션이 하나씩 부드럽게
// 나타나는 효과. 외부 애니메이션 라이브러리 없이 IntersectionObserver +
// CSS transition만으로 구현(이 프로젝트의 "차트도 순수 SVG, 슬라이더도
// 순수 CSS/JS" 원칙과 동일한 방향). 뷰포트에 한 번 들어오면 그걸로 끝 —
// 스크롤을 위아래로 왔다갔다해도 다시 숨겨지지 않는다(반짝임 방지).
function initLandingRevealAnimations(container) {
  const targets = container.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) {
    targets.forEach(el => el.classList.add('is-visible'));
    return;
  }
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  targets.forEach(el => observer.observe(el));
}

// renderLandingPricing — 요금제 데이터는 /api/billing/config(공개 API,
// #/billing/plans의 renderPricingPlans와 같은 출처)를 그대로 재사용해
// 두 화면의 가격/기능 정보가 어긋나지 않게 한다. 랜딩페이지는 항상
// 비로그인 상태이므로 "구독하기" 대신 전부 "가입하기"(#/auth/signup)로
// 보낸다 — 결제는 로그인 후 #/billing/plans에서 진행.
async function renderLandingPricing(gridEl) {
  let config;
  try {
    config = await apiRequest('GET', '/api/billing/config');
  } catch (err) {
    gridEl.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
    return;
  }
  gridEl.innerHTML = config.plans.map(p => `
    <div class="landing-plan-card${p.plan === 'pro' ? ' landing-plan-card--highlight' : ''}">
      <h3 class="landing-plan-name">${escapeHtml(p.name)}</h3>
      <p class="landing-plan-price">${p.amount > 0 ? escapeHtml(formatBudget(p.amount)) + '<small>/월</small>' : '무료'}</p>
      <ul class="landing-plan-features">${(PLAN_FEATURES[p.plan] || []).map(f => `<li>${escapeHtml(f)}</li>`).join('')}</ul>
      <a href="#/auth/signup" class="home-cta-primary">가입하기</a>
    </div>
  `).join('');
}

// COMPANY_INFO_FOOTER_FIELDS — 푸터 회사정보 블록에 실제로 들어가는 7개

// 제외). "전부 비어있으면 블록 자체를 숨김" 판단도 이 7개 기준이다.
const COMPANY_INFO_FOOTER_FIELDS = ['companyName', 'businessRegistrationNumber', 'representativeName', 'address', 'mainPhone', 'contactEmail', 'patentNumber'];

// renderLandingCompanyInfo — GET /api/company-info(공개)를 읽어 푸터
// 회사정보 블록과 "제휴 문의" 카드의 이메일 줄을 채운다. 항목별로 비어
//있으면(null) 그 줄 자체를 안 만든다("라벨만 남는" 상태 방지) — 예를
// 들어 대표전화만 있고 이메일이 없으면 "대표전화: 02-1234-5678" 한
// 줄만 나오지 "· 이메일: " 같은 꼬리표가 안 남는다. 7개 필드가 전부
// 비어있으면 footerInfoEl 자체를 비워(CSS :empty로 자동 숨김) 블록
// 전체가 사라진다.
async function renderLandingCompanyInfo() {
  const footerInfoEl = document.getElementById('landing-footer-info');
  const partnershipLineEl = document.getElementById('landing-partnership-email-line');
  let info;
  try {
    info = await apiRequest('GET', '/api/company-info');
  } catch (err) {
    return; // 실패해도 조용히 무시 — 핵심 기능 아님, 빈 상태 그대로 둠
  }

  // 이 fetch는 이미 브랜드명(info.brandName)도 함께 받아왔으니, 별도
  // 요청 없이 헤더/사이드바/로고까지 한 번에 최신화한다(loadBrandName이
  // 부트 시점에 이미 한 번 호출하지만, 여기서 또 불러도 멱등이라 무해).
  applyBrandName(info.brandName);

  const hasAnyFooterField = COMPANY_INFO_FOOTER_FIELDS.some(k => info[k]);
  if (footerInfoEl) {
    if (!hasAnyFooterField) {
      footerInfoEl.innerHTML = '';
    } else {
      const lines = [];
      lines.push(info.companyName
        ? `<strong>${escapeHtml(currentBrandName)}</strong> (운영사: ${escapeHtml(info.companyName)})`
        : `<strong>${escapeHtml(currentBrandName)}</strong>`);
      const line2 = [
        info.businessRegistrationNumber ? `사업자등록번호: ${escapeHtml(info.businessRegistrationNumber)}` : '',
        info.representativeName ? `대표: ${escapeHtml(info.representativeName)}` : '',
        info.patentNumber ? `특허출원번호: ${escapeHtml(info.patentNumber)}` : '',
      ].filter(Boolean);
      if (line2.length) lines.push(line2.join(' · '));
      if (info.address) lines.push(`주소: ${escapeHtml(info.address)}`);
      const line4 = [
        info.mainPhone ? `대표전화: ${escapeHtml(info.mainPhone)}` : '',
        info.contactEmail ? `이메일: ${escapeHtml(info.contactEmail)}` : '',
      ].filter(Boolean);
      if (line4.length) lines.push(line4.join(' · '));
      footerInfoEl.innerHTML = lines.join('<br>');
    }
  }

  if (partnershipLineEl) {
    partnershipLineEl.textContent = info.partnershipEmail ? `문의: ${info.partnershipEmail}` : '';
  }
}

// (Phase UX-01, 2026-08-04). 파일 업로드 → POST /api/me/business-registration/
// extract(company_documents.go의 6개 카테고리와 같은 candidate 패턴 — DB엔

// PUT /api/me/company-profile(handleUpsertCompanyProfile 그대로 재사용,
// region/industry는 AI가 채운 값을 프리필)로 저장 → #/onboarding/complete.
//
// 2026-08-04 추가 요청으로 이 화면은 이제 하드 게이트다("안 하면 절대
// 이동 불가", route()의 COMPANY_PROFILE_EXEMPT_ROUTES 참고) — 휴대폰/이메일
// 인증 화면과 같은 강제성이라 사이드바를 숨기고(is-auth) "나중에 하기"
// 스킵 버튼은 없앴다. 대신 AI 추출이 반복 실패하거나 사용자가 그냥 직접
// 입력하고 싶을 때를 위해 "직접 입력하기" 링크로 빈 확인폼을 열어준다 —
// 업로드 자체를 강제하는 게 아니라 "회사 정보를 등록해야 한다"는 게
// 핵심이라, 수동 입력도 항상 열어둔다.
function renderBusinessRegistrationOnboarding(container) {
  document.body.classList.add('is-auth');
  document.body.classList.remove('is-landing');
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="detail-card onboarding-shell">
      <p class="home-hero-eyebrow" style="text-align:center">공공사업 AI 비서</p>
      <h2 style="text-align:center">사업자등록증을 분석하여<br>귀사에 맞는 사업을 찾아드립니다</h2>
      <ul class="home-hero-checklist" style="align-items:center">
        <li>✓ 회사정보 자동생성</li>
        <li>✓ 업종 자동분석</li>
        <li>✓ 추천공고 생성</li>
      </ul>
      <p class="license-card-meta" style="text-align:center">약 30초 정도 소요됩니다. PDF, JPG, PNG, WEBP 파일을 올려주세요.</p>
      <div id="biz-reg-upload-area">
        <input type="file" id="biz-reg-file-input" accept=".pdf,.jpg,.jpeg,.png,.webp">
        <div id="biz-reg-upload-status"></div>
        <div id="biz-reg-upload-error" class="error" style="display:none"></div>
      </div>
      <div id="biz-reg-form-slot"></div>
      <p class="auth-switch"><a href="#" id="biz-reg-manual-entry-link">직접 입력하기</a></p>
    </div>
  `));

  const fileInput = document.getElementById('biz-reg-file-input');
  const statusBox = document.getElementById('biz-reg-upload-status');
  const errorBox = document.getElementById('biz-reg-upload-error');
  const formSlot = document.getElementById('biz-reg-form-slot');

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    errorBox.style.display = 'none';
    formSlot.innerHTML = '';
    fileInput.disabled = true;
    statusBox.innerHTML = bizRegAnalysisStepsHtml(1);
    try {
      const data = await uploadCompanyRecordDocument('/api/me/business-registration/extract', file);
      statusBox.innerHTML = '';
      renderBusinessRegistrationSummaryCard(formSlot, data.candidate || {});
    } catch (err) {
      statusBox.innerHTML = '';
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    } finally {
      fileInput.disabled = false;
    }
  });

  document.getElementById('biz-reg-manual-entry-link').addEventListener('click', (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    renderBusinessRegistrationEditForm(formSlot, {});
  });
}

// bizRegAnalysisStepsHtml — 업로드 직후 보여줄 실제 단계 체크리스트.
// 백엔드는 완전 동기 호출 1건(POST .../extract)이라 서버가 중간 단계를
// 알려줄 방법이 없다 — "사업자번호를 찾았습니다" 같은 세부 단계를 타이머로
// 순환시키면 그게 곧 가짜 진행률이 되므로, 클라이언트가 실제로 아는 상태
// 전이 3개(업로드 검증됨 → fetch 진행 중 → 응답 도착)만 표시한다.
function bizRegAnalysisStepsHtml(currentIdx) {
  const steps = ['문서를 확인했습니다', 'AI가 사업자등록증을 분석하고 있습니다', '결과를 준비합니다'];
  const rows = steps.map((label, i) => {
    const state = i < currentIdx ? 'is-done' : (i === currentIdx ? 'is-current' : 'is-pending');
    const icon = i < currentIdx ? '✓' : (i === currentIdx ? '●' : '○');
    return `<div class="biz-reg-step ${state}"><span class="biz-reg-step-icon">${icon}</span><span>${escapeHtml(label)}</span></div>`;
  }).join('');
  return `<div class="biz-reg-steps">${rows}</div>`;
}

// renderBusinessRegistrationSummaryCard — AI 추출 직후 첫 화면(Phase UX-02,
// 2026-08-04). 필드 전체를 늘어놓은 편집폼 대신, 사용자가 즉시 맞다/아니다만
// 판단할 수 있게 핵심 3개(상호·지역·업종)만 한 줄 요약으로 보여준다 —
// "수정하기"를 눌러야만 renderBusinessRegistrationEditForm(전체 편집폼)이
// 나온다.
function renderBusinessRegistrationSummaryCard(formSlot, candidate) {
  const c = candidate || {};
  formSlot.innerHTML = '';
  const companyLabel = c.companyName || '상호 미확인';
  const regionLabel = c.region || '지역 미확인';
  const industryLabel = (c.industry && c.industry.length) ? c.industry.join(', ') : '업종 미확인';
  formSlot.appendChild(h(`
    <div class="license-confirm-form">
      <h4>회사 정보를 찾았습니다</h4>
      <p class="biz-reg-summary-line">${escapeHtml(companyLabel)} · ${escapeHtml(regionLabel)} · ${escapeHtml(industryLabel)}</p>
      <div id="biz-reg-summary-error" class="error" style="display:none"></div>
      <div class="license-toolbar">
        <button type="button" class="btn btn-secondary" id="biz-reg-edit-btn">수정하기</button>
        <button type="button" class="btn btn-primary" id="biz-reg-confirm-btn">네, 맞습니다</button>
      </div>
    </div>
  `));

  document.getElementById('biz-reg-edit-btn').addEventListener('click', () => {
    renderBusinessRegistrationEditForm(formSlot, c);
  });
  document.getElementById('biz-reg-confirm-btn').addEventListener('click', async () => {
    const errorBox = document.getElementById('biz-reg-summary-error');
    errorBox.style.display = 'none';
    try {
      await submitBusinessRegistrationProfile({
        businessRegistrationNumber: c.businessRegistrationNumber || null,
        companyName: c.companyName || null,
        representativeName: c.representativeName || null,
        address: c.address || null,
        businessType: c.businessType || [],
        region: c.region || null,
        industry: c.industry || [],
      });
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// renderBusinessRegistrationEditForm — 이전엔 AI 추출 직후 바로 이 전체
// 폼이 나왔지만, Phase UX-02부터는 "수정하기"를 눌렀을 때만(또는 AI 추출
// 없이 직접 입력할 때) 나온다.
function renderBusinessRegistrationEditForm(formSlot, candidate) {
  const c = candidate || {};
  formSlot.innerHTML = '';
  formSlot.appendChild(h(`
    <div class="license-confirm-form">
      <h4>회사 정보를 확인해주세요</h4>
      <p class="license-card-meta">실제 사업자등록증과 다르면 직접 수정할 수 있습니다.</p>
      <form id="biz-reg-confirm-form" class="profile-form">
        <label>사업자등록번호<input type="text" name="businessRegistrationNumber" value="${escapeAttr(c.businessRegistrationNumber || '')}"></label>
        <label>상호<input type="text" name="companyName" value="${escapeAttr(c.companyName || '')}" required></label>
        <label>대표자<input type="text" name="representativeName" value="${escapeAttr(c.representativeName || '')}"></label>
        <label>주소<input type="text" name="address" value="${escapeAttr(c.address || '')}"></label>
        <label>업태(쉼표로 구분)<input type="text" name="businessType" value="${escapeAttr((c.businessType || []).join(', '))}"></label>
        <label>지역
          <select name="region" class="select-input">
            ${REGION_OPTIONS.map(r => `<option value="${escapeAttr(r)}" ${r === c.region ? 'selected' : ''}>${escapeHtml(r)}</option>`).join('')}
          </select>
        </label>
        <label>업종(복수 선택 가능)
          <div class="checkbox-grid">
            ${INDUSTRY_GROUPS.map(g => `
              <label class="checkbox-label"><input type="checkbox" name="industry" value="${escapeAttr(g)}" ${(c.industry || []).includes(g) ? 'checked' : ''}> ${escapeHtml(g)}</label>
            `).join('')}
          </div>
        </label>
        <div id="biz-reg-confirm-error" class="error" style="display:none"></div>
        <div class="license-toolbar">
          <button type="submit" class="btn btn-primary">예, 맞습니다</button>
        </div>
      </form>
    </div>
  `));

  const form = document.getElementById('biz-reg-confirm-form');
  const errorBox = document.getElementById('biz-reg-confirm-error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    const businessType = (fd.get('businessType') || '').split(',').map(s => s.trim()).filter(Boolean);
    const industry = fd.getAll('industry');
    try {
      await submitBusinessRegistrationProfile({
        businessRegistrationNumber: fd.get('businessRegistrationNumber') || null,
        companyName: fd.get('companyName') || null,
        representativeName: fd.get('representativeName') || null,
        address: fd.get('address') || null,
        businessType,
        region: fd.get('region') || null,
        industry,
      });
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// submitBusinessRegistrationProfile — 요약카드("네, 맞습니다")와 편집폼
// 제출 둘 다 여기로 모인다. handleUpsertCompanyProfile(PUT /api/me/
// company-profile)를 그대로 재사용한다 — company_documents.go의 6개
// 카테고리와 동일하게 후보는 브라우저 JS 상태에만 있다가 이 호출 한 번에
// 그대로 저장된다(별도 confirm 엔드포인트 없음).
async function submitBusinessRegistrationProfile(payload) {
  const data = await apiRequest('PUT', '/api/me/company-profile', payload);
  currentProfile = data.companyProfile;
  location.hash = '#/onboarding/complete';
}

// ==================== 온보딩 정보요청 흐름(Phase UX-03→09 누적) ====================
// renderOnboardingComplete 아래에 남은 정보요청 항목을 보여준다. 판정
// 로직(eligibility.go/scoring.go)은 전혀 안 건드리고, 이미 있는 실데이터
// 소스만 쓴다:
//  - eligibilitySummary.missingFieldCounts(dashboard.go) — 지역/업종/
//    기업규모 중 실제로 빈 필드가 몇 건의 판정을 막고 있는지(카드 설명
//    문구에만 씀 — "AI 분석 커버리지" %와는 별개 지표).
//  - company_profiles 스칼라 필드 자체의 존재 여부(업력/직원수/매출액).
//  - documentRequirementGaps(Phase UX-02) — 실적/보유면허/인증/
//    직접생산확인은 판정기준 자체가 없으므로, "이 서류를 요구하는 공고
//    N건" 안내만(없는 걸 있는 것처럼 보여주지 않는다).
//
// Phase UX-09(2026-08-05) 재설계 핵심 — 직전 Phase UX-08의 "체크리스트"
// (남은 항목을 한 화면에 전부 보여줌)가 오히려 이탈율/피로도를 높인다는
// 피드백으로 다시 "카드 한 번에 하나씩만" 순서대로 보여주는 방식으로
// 되돌렸다(단, Phase UX-06/07의 옛 큐와는 세부가 다름 — 아래 참고):
//  (1) 화면엔 항상 "지금 입력할 항목 하나"만 크게 보이고, 상단엔 텍스트
//      대신 점/N-of-M 진행 표시(stepIndicatorHtml 재사용)만 최소로.
//      PC/모바일 구분 없이 완전히 인라인 렌더링(모달도, 별도 라우트도
//      없음 — Phase UX-06/07의 PC모달·모바일라우트 분기를 이번에
//      완전히 걷어냄, 화면이 하나뿐이라 필요가 없어짐).
//  (2) 색상 톤 순화 — 이전(UX-08)엔 50% 미만을 빨강+"분석이 어렵습니다"
//      경고 톤으로 표현했는데, 이번엔 0~49%를 중립적인 파란색+격려 톤
//      ("조금만 더 채우면 정확한 분석이 가능해요")으로, 50%↑만 녹색으로
//      구분한다.
//  (3) 필수(지역/업종/기업규모 — ONBOARDING_REQUIRED_FIELD_KEYS)는
//      [건너뛰기] 자체가 없다(반드시 등록해야 다음 카드로). 그 외는
//      전부 선택 — [등록]/[건너뛰기]. 면허/인증/직접생산확인처럼
//      "보유 여부" 개념인 항목(ONBOARDING_POSSESSION_FIELD_KEYS)은
//      [보유 - 등록하기]/[미보유 - 다음으로]로 라벨을 명확히 한다.
//  (4) 커버리지 가중치 재설계(company_profile_completeness.go) — 필수
//      3개에 각각 20%(합 60%)를 줘서, 선택 항목을 하나도 안 채워도
//      필수 3개만 다 채우면 항상 50% 게이트를 넘는다("선택 항목을
//      건너뛰어서 막히는" 상황 자체가 구조적으로 안 생김).
// Phase UX-08에서 만든 renderOnboardingFinalConfirm(최종 확인 화면)과
// showOnboardingItemSavedToast(등록 직후 전/후 %델타 토스트)는 그대로
// 재사용한다.

// documentRequirementGapPromptText — Phase UX-05(2026-08-04). dashboard.go의
// documentRequirementGaps는 이제 noticeCount==0인 항목도 내려준다(그
// 카테고리 데이터가 아직 없다는 뜻이지 영향 건수를 몰라도 되는 건 아님) —
// noticeCount가 있으면 실제 영향 건수를, 없으면 건수 주장 없이 "아직
// 등록하지 않았습니다"로 정직하게 표현한다. 대시보드 홈 카드
// (renderDocumentRequirementGapsHtml)와 온보딩 카드 큐 둘 다 공유.
function documentRequirementGapPromptText(label, noticeCount) {
  return noticeCount > 0
    ? `${label} 정보가 없어 ${noticeCount}건의 요구서류를 아직 확인하지 못했습니다.`
    : `${label} 정보가 아직 없습니다. 등록하면 관련 공고 판정에 활용됩니다.`;
}

// ONBOARDING_CARD_DEFS — Phase UX-06(2026-08-04) 재설계. 카드 후보 전체
// 목록과 고정 순서(사용자 스펙 그대로): 기업규모(비어있으면) → 업력 →
// 직원수 → 매출액 → 수행실적 → 보유면허 → 인증 → 직접생산확인. 지역/업종은
// 보통 사업자등록증 OCR로 이미 채워지지만 비어있을 수 있어 맨 앞에 둔다.
// 세 갈래:
//  - judged(지역/업종/기업규모): eligibilitySummary.missingFieldCounts로
//    등록 후 진짜 "+N건" 델타를 낼 수 있다(판정기준이 있어서).
//  - presence(업력/직원수/매출액): company_profiles 스칼라 필드가 그냥
//    비어있는지만 본다 — 이 필드들엔 애초에 판정기준도 없고
//    required_documents 매칭 대상도 아니라, 건수 주장 없이 "정보 없음"만
//    보여준다.
//  - general(수행실적/보유면허/인증/직접생산확인): documentRequirementGaps
//    (required_documents 키워드매칭, count==0도 포함 —
//    [[feedback-document-requirement-gap-zero-count-excluded]] 원칙).
// count 유무로 후보 자체를 거르지 않는다 — 실제로 비어있으면 전부 큐에
// 넣는다(최대 3장 cap은 이번에 폐지 — 사용자가 "최소 5개 이상" 요구).
const ONBOARDING_CARD_DEFS = [
  { fieldKey: 'region', type: 'judged', label: '사업장 지역' },
  { fieldKey: 'industry', type: 'judged', label: '업종' },
  { fieldKey: 'companySize', type: 'judged', label: '기업 규모' },
  { fieldKey: 'businessAgeYears', type: 'presence', label: '업력' },
  { fieldKey: 'employeeCount', type: 'presence', label: '직원 수' },
  { fieldKey: 'revenueAmount', type: 'presence', label: '매출액' },
  { fieldKey: 'trackRecord', type: 'general', label: '수행실적' },
  { fieldKey: 'license', type: 'general', label: '보유 면허' },
  { fieldKey: 'certification', type: 'general', label: '인증' },
  { fieldKey: 'directProduction', type: 'general', label: '직접생산확인' },
];

function buildOnboardingCardQueue(data) {
  const eg = data.eligibilitySummary || { missingFields: [], missingFieldCounts: {} };
  const missingSet = new Set(eg.missingFields || []);
  const counts = eg.missingFieldCounts || {};
  const gapsByCategory = {};
  (data.documentRequirementGaps || []).forEach(g => { gapsByCategory[g.category] = g; });
  const p = currentProfile || {};

  const queue = [];
  ONBOARDING_CARD_DEFS.forEach(def => {
    if (def.type === 'judged') {
      if (missingSet.has(def.fieldKey)) {
        queue.push({ type: 'judged', fieldKey: def.fieldKey, label: def.label, count: counts[def.fieldKey] || 0 });
      }
    } else if (def.type === 'presence') {
      if (p[def.fieldKey] == null) {
        queue.push({ type: 'presence', fieldKey: def.fieldKey, label: def.label, count: 0 });
      }
    } else {
      const g = gapsByCategory[def.fieldKey];
      if (g) {
        queue.push({ type: 'general', fieldKey: def.fieldKey, label: def.label, count: g.noticeCount });
      }
    }
  });
  return queue;
}

// onboardingCardPromptText — 카드 유형별 프롬프트 문구.
function onboardingCardPromptText(card) {
  if (card.type === 'judged') {
    return card.count > 0
      ? `${card.label}을(를) 등록하면 추천공고 ${card.count}건을 더 정확하게 분석할 수 있습니다.`
      : `${card.label} 정보가 없어 정확한 판정이 어렵습니다.`;
  }
  if (card.type === 'presence') {
    return `${card.label} 정보가 아직 없습니다. 등록하면 AI 분석에 활용됩니다.`;
  }
  return documentRequirementGapPromptText(card.label, card.count);
}

const ONBOARDING_QUICK_FORM_TITLES = {
  region: '사업장 지역 등록', industry: '업종 등록', companySize: '기업 규모 등록',
  businessAgeYears: '업력 등록', employeeCount: '직원 수 등록', revenueAmount: '매출액 등록',
  trackRecord: '수행실적 등록', license: '보유 면허 등록', certification: '인증 등록',
  directProduction: '직접생산확인 등록',
};
// 온보딩 카드의 [등록]은 항상 "직접 입력" 경로다(문서 업로드는 이 카드
// 큐 흐름 밖) — 그래서 실적/면허/인증은 renderTrackRecordForm/
// renderLicenseConfirmForm(13개/8개 필드짜리 정식 등록 폼, 문서 업로드
// AI확인 경로에서 여전히 그대로 씀)을 재사용하지 않고, 핵심 2~3개
// 필드만 받는 전용 미니폼(renderTrackRecordQuickForm/
// renderLicenseQuickForm)을 새로 쓴다 — 나머지 세부항목은
// #/me/profile·#/me/licenses의 정식 화면에서 나중에 채운다.
const ONBOARDING_QUICK_FORM_RENDERERS = {
  region: renderRegionQuickForm,
  industry: renderIndustryQuickForm,
  companySize: renderCompanySizeQuickForm,
  businessAgeYears: renderBusinessAgeQuickForm,
  employeeCount: renderEmployeeCountQuickForm,
  revenueAmount: renderRevenueAmountQuickForm,
  trackRecord: renderTrackRecordQuickForm,
  license: (slot, onSaved, onBack) => renderLicenseQuickForm(slot, 'license', onSaved, onBack),
  certification: (slot, onSaved, onBack) => renderLicenseQuickForm(slot, 'certification', onSaved, onBack),
  directProduction: renderDirectProductionQuickForm,
};

// ONBOARDING_MIN_COMPLETENESS — 2026-08-05 온보딩 재설계(사용자 확정):
// AI 분석 커버리지가 이 값 미만이면 온보딩 완료(다음 화면 이동)를 막는다.
// 서버(company_profile_completeness.go의 onboardingMinCompleteness)와
// 같은 기준선 — 프론트는 UX(완료 버튼 잠금)일 뿐 신뢰 경계가 아니고,
// 실제 게이트는 서버가 POST /api/me/onboarding/complete에서 다시 계산해
// 확인한다.
const ONBOARDING_MIN_COMPLETENESS = 50;

// ONBOARDING_FIELDKEY_TO_COMPLETENESS_CATEGORY — 온보딩 카드 fieldKey를
// GET /api/me/profile-completeness의 categories 맵 키로 매핑(수행실적/
// 면허/인증은 이름이 복수형이라 살짝 다름).
const ONBOARDING_FIELDKEY_TO_COMPLETENESS_CATEGORY = {
  region: 'region', industry: 'industry', companySize: 'companySize',
  businessAgeYears: 'businessAgeYears', employeeCount: 'employeeCount', revenueAmount: 'revenueAmount',
  trackRecord: 'trackRecords', license: 'licenses', certification: 'certifications',
  directProduction: 'directProduction',
};

// ONBOARDING_REQUIRED_FIELD_KEYS — 반드시 채워야 다음 단계로 진행 가능한
// 3개("회사라면 누구나 있는 기본 정보", 사용자 확정). 이 카드들은
// [건너뛰기] 자체를 안 보여준다. company_profile_completeness.go의
// requiredCompletenessCategoryKeys(가중치 20%씩, 합 60%)와 반드시 같은
// 3개를 가리켜야 한다 — 이 3개만 채우면 선택 항목 없이도 항상
// ONBOARDING_MIN_COMPLETENESS(50%)를 넘도록 서버 공식이 설계돼 있다.
const ONBOARDING_REQUIRED_FIELD_KEYS = new Set(['region', 'industry', 'companySize']);

// onboardingExitButtonHtml/wireOnboardingExitButton — 카드/인라인폼/최종
// 확인 화면 우측 상단 "나중에 하기" 버튼(2026-08-05). 사업자등록증 화면
// (renderBusinessRegistrationOnboarding, 하드 게이트라 스킵 자체가 없음)
// 에는 붙이지 않는다. 확인 모달은 이 코드베이스 전역의 기존 관례(삭제/
// 해지 등 11곳 이상)를 그대로 따라 커스텀 모달 없이 confirm()을 쓴다.
function onboardingExitButtonHtml() {
  return '<button type="button" class="onboarding-exit-btn" id="onboarding-exit-btn">나중에 하기</button>';
}
function wireOnboardingExitButton() {
  const btn = document.getElementById('onboarding-exit-btn');
  if (!btn) return;
  btn.addEventListener('click', () => {
    if (!confirm('지금까지 입력한 내용은 저장되며, 나중에 기업프로필에서 이어서 작성할 수 있습니다. 나가시겠습니까?')) return;
    // 이미 등록한 항목은 각 미니폼 저장 시점에 이미 서버에 반영돼 있어
    // 그대로 유지된다(buildOnboardingCardQueue가 이미 채워진 필드는
    // 다음에 다시 들어와도 알아서 걸러내므로 별도 이어하기 로직 불필요).
    // sessionStorage 스누즈 플래그로 route()의 4번째 게이트가 이번
    // 로그인 세션 동안은 다시 붙잡지 않게 하고, 로그아웃 시 이 플래그를
    // 지워 "다음 로그인 시 다시 온보딩부터"를 보장한다(필수 3개를 하나도
    // 안 채운 초기상태였다면 큐가 처음부터 그대로 다시 보인다).
    sessionStorage.setItem('onboarding_snoozed', '1');
    location.hash = '#/';
  });
}

// ONBOARDING_POSSESSION_FIELD_KEYS — "보유/미보유" 개념인 선택 항목(면허/
// 인증/직접생산확인). 일반 [건너뛰기] 대신 [보유 - 등록하기]/[미보유 -
// 다음으로]로 라벨을 명확히 해서, "미보유"를 선택해도 페널티 없이
// 자연스럽게 다음으로 넘어간다는 걸 화면에서 바로 보여준다(사용자 확정).
const ONBOARDING_POSSESSION_FIELD_KEYS = new Set(['license', 'certification', 'directProduction']);

// onboardingCoverageBarHtml — "AI 분석 커버리지" %를 온보딩 전 화면
// 상단에 항상 표시. 2026-08-05 색상/톤 정정(사용자 확인 — 0%에서
// 시작해 등록할수록 상승하는 방향 자체는 원래 맞았고, 톤만 순화):
// 0~49%는 위압적인 빨강 대신 중립적인 파랑("아직 진행 중", 경고 아님),
// 50~100%만 녹색(목표 달성 강조). 미만일 때 문구도 "분석이 어렵습니다"
// 같은 겁주는 톤 대신 격려 톤으로.
function onboardingCoverageBarHtml(overallCompleteness) {
  const pct = Math.max(0, Math.min(100, overallCompleteness));
  const isLow = overallCompleteness < ONBOARDING_MIN_COMPLETENESS;
  return `
    <div class="onboarding-coverage-bar ${isLow ? 'onboarding-coverage-bar--low' : 'onboarding-coverage-bar--ok'}">
      <div class="onboarding-coverage-bar-head">
        <span class="onboarding-coverage-bar-title">AI 분석 커버리지</span>
        <span class="onboarding-coverage-bar-pct">${overallCompleteness}%</span>
      </div>
      <div class="onboarding-coverage-bar-track"><div class="onboarding-coverage-bar-fill" style="width:${pct}%"></div></div>
      ${isLow ? '<p class="onboarding-coverage-hint">조금만 더 채우면 정확한 분석이 가능해요.</p>' : ''}
    </div>
  `;
}

// renderOnboardingComplete — #/onboarding/complete. 2026-08-05 재설계
// (Phase UX-09): 카드를 한 번에 하나씩만 순서대로 보여준다(체크리스트
// 방식은 이탈율/피로도가 높다는 피드백으로 폐기). 몰입형 온보딩에 따라
// is-auth(사이드바 숨김)는 그대로 유지.
async function renderOnboardingComplete(container) {
  document.body.classList.add('is-auth');
  document.body.classList.remove('is-landing');
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let dashboardData, completenessData;
  try {
    [dashboardData, completenessData] = await Promise.all([
      apiRequest('GET', '/api/dashboard'),
      apiRequest('GET', '/api/me/profile-completeness'),
    ]);
  } catch (err) {
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }
  const queue = buildOnboardingCardQueue(dashboardData);
  renderOnboardingCardStep(container, queue, 0, completenessData);
}

// renderOnboardingCardStep — 큐에서 딱 하나(queue[index])만 화면에 크게
// 보여준다. 다른 항목은 전혀 안 보여줌("사용자는 지금 이것만 신경쓰면
// 됨", 사용자 확정). 상단엔 %바(순화된 톤) + 최소 진행 표시(점/N-of-M,
// stepIndicatorHtml 재사용)만 — 항목 목록 텍스트는 없앴다. 필수(지역/
// 업종/기업규모)는 [건너뛰기] 자체가 없고, 나머지는 있음. 면허/인증/
// 직접생산확인은 "보유/미보유" 두 버튼으로 라벨을 바꾼다. 커버리지가
// 이미 50% 이상이면(필수 3개만 채워도 가중치 60%라 자동으로 이 조건을
// 만족) 카드 아래 "지금까지 정보로 완료하기"를 추가로 보여줘 남은
// 선택 항목을 억지로 다 거치지 않고 바로 최종 확인으로 갈 수 있게 한다.
function renderOnboardingCardStep(container, queue, index, completenessData) {
  const overall = completenessData.overallCompleteness;
  if (index >= queue.length) {
    renderOnboardingFinalConfirm(container, completenessData);
    return;
  }
  const card = queue[index];
  const isRequired = ONBOARDING_REQUIRED_FIELD_KEYS.has(card.fieldKey);
  const isPossession = ONBOARDING_POSSESSION_FIELD_KEYS.has(card.fieldKey);
  const canFinishEarly = overall >= ONBOARDING_MIN_COMPLETENESS;

  container.innerHTML = '';
  container.appendChild(h(`
    <div class="detail-card onboarding-shell" style="text-align:center">
      ${onboardingExitButtonHtml()}
      ${onboardingCoverageBarHtml(overall)}
      <div style="margin:1rem 0">${stepIndicatorHtml(index, queue.length, `${queue.length}개 중 ${index + 1}번째`)}</div>
      <h2 style="margin-bottom:0.25rem">${escapeHtml(card.label)} ${isRequired ? '<span class="onboarding-required-badge">필수</span>' : '<span class="onboarding-optional-badge">선택</span>'}</h2>
      <p class="license-card-meta">${escapeHtml(onboardingCardPromptText(card))}</p>
      <div id="onboarding-card-action-area" style="margin-top:1rem"></div>
      ${canFinishEarly ? '<button type="button" class="btn btn-secondary btn-block" id="onboarding-finish-early-btn" style="margin-top:1rem">지금까지 정보로 완료하기</button>' : ''}
    </div>
  `));

  const actionArea = document.getElementById('onboarding-card-action-area');
  // 건너뛰기/미보유는 서버 왕복이 없어 즉시 다음 카드로 넘어가면 너무
  // 급전환처럼 보인다(사용자 확인) — showOnboardingTransition으로 최소
  // 표시시간(600ms)만큼 스피너를 보여준 뒤 다음 카드로. container 전체가
  // 아니라 actionArea만 바꿔서 카드 틀(나가기 버튼/커버리지 바/진행
  // 표시)은 그대로 유지한다(등록 경로의 토스트도 같은 방식으로 카드 틀을
  // 유지하는 것과 일관되게).
  const goNext = () => {
    showOnboardingTransition(actionArea, Promise.resolve(), 600).then(() => {
      renderOnboardingCardStep(container, queue, index + 1, completenessData);
    });
  };
  if (isPossession) {
    actionArea.appendChild(h(`
      <div class="home-hero-actions">
        <button type="button" class="btn btn-primary" id="onboarding-card-has-btn">보유 - 등록하기</button>
        <button type="button" class="btn btn-secondary" id="onboarding-card-none-btn">미보유 - 다음으로</button>
      </div>
    `));
    document.getElementById('onboarding-card-has-btn').addEventListener('click', () => openOnboardingCardForm(container, queue, index, completenessData));
    document.getElementById('onboarding-card-none-btn').addEventListener('click', goNext);
  } else {
    actionArea.appendChild(h(`
      <div class="home-hero-actions">
        <button type="button" class="btn btn-primary" id="onboarding-card-register-btn">등록</button>
        ${isRequired ? '' : '<button type="button" class="btn btn-secondary" id="onboarding-card-skip-btn">건너뛰기</button>'}
      </div>
    `));
    document.getElementById('onboarding-card-register-btn').addEventListener('click', () => openOnboardingCardForm(container, queue, index, completenessData));
    const skipBtn = document.getElementById('onboarding-card-skip-btn');
    if (skipBtn) skipBtn.addEventListener('click', goNext);
  }
  const finishBtn = document.getElementById('onboarding-finish-early-btn');
  if (finishBtn) finishBtn.addEventListener('click', () => renderOnboardingFinalConfirm(container, completenessData));
  wireOnboardingExitButton();
}

// openOnboardingCardForm — 카드의 미니폼을 그 자리에 인라인으로 그린다
// (모달도, 모바일 전용 라우트도 없음 — 화면이 하나뿐이라 Phase UX-06/07
// 의 PC모달·모바일라우트 분기가 이번 재설계로 완전히 불필요해졌다).
// 저장 성공 시 전/후 %델타 토스트(showOnboardingItemSavedToast, Phase
// UX-08 그대로 재사용)를 보여준 뒤 다음 카드로 자동 진행.
function openOnboardingCardForm(container, queue, index, completenessData) {
  const card = queue[index];
  const before = completenessData.overallCompleteness;
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="detail-card onboarding-shell">
      ${onboardingExitButtonHtml()}
      ${onboardingCoverageBarHtml(before)}
      <div style="margin:1rem 0">${stepIndicatorHtml(index, queue.length, `${queue.length}개 중 ${index + 1}번째`)}</div>
      <h3>${escapeHtml(ONBOARDING_QUICK_FORM_TITLES[card.fieldKey] || card.label)}</h3>
      <div id="onboarding-inline-form-slot"></div>
    </div>
  `));
  wireOnboardingExitButton();
  const formSlot = document.getElementById('onboarding-inline-form-slot');
  const renderForm = ONBOARDING_QUICK_FORM_RENDERERS[card.fieldKey];
  renderForm(formSlot, () => {
    showOnboardingItemSavedToast(formSlot, before, (freshCompleteness) => {
      renderOnboardingCardStep(container, queue, index + 1, freshCompleteness || completenessData);
    });
  }, null);
}

// showOnboardingTransition — 카드 전환(등록 직후/건너뛰기 직후) 사이에
// 스피너+"공공사업 분석중..."을 최소 minMs만큼 보여준다(2026-08-05).
// 실제 작업(work)이 더 오래 걸리면 그 시간 그대로, 이미 빠르게 끝나도
// 최소 시간은 채워 급전환처럼 안 보이게 한다. work의 결과를 그대로
// 반환(실패해도 이 함수 자체는 던지지 않도록 호출부에서 이미 처리됨).
async function showOnboardingTransition(container, work, minMs) {
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="onboarding-transition-loading">
      <div class="onboarding-transition-spinner"></div>
      <p class="license-card-meta">공공사업 분석중...</p>
    </div>
  `));
  const minDelay = new Promise(resolve => setTimeout(resolve, minMs));
  const [result] = await Promise.all([work, minDelay]);
  return result;
}

// showOnboardingItemSavedToast — 저장 성공 직후 스피너("분석중...")로
// GET /api/me/profile-completeness 재조회를 감싸 자연스러운 전환을
// 보여준 뒤, AI 분석 커버리지 전/후 실델타를 잠깐 보여주고 다음 카드로
// 넘어간다. onDone에는 재조회한 completenessData를 그대로 넘겨 호출부가
// 다시 조회하지 않아도 되게 한다(재조회 실패 시 null).
async function showOnboardingItemSavedToast(toastContainer, before, onDone) {
  const completenessData = await showOnboardingTransition(
    toastContainer,
    apiRequest('GET', '/api/me/profile-completeness').catch(() => null),
    700
  );
  const after = completenessData ? completenessData.overallCompleteness : before;
  const delta = after - before;
  const deltaText = delta > 0 ? ` (+${delta}%p)` : (delta < 0 ? ` (${delta}%p)` : ' (변동 없음)');
  toastContainer.innerHTML = '';
  toastContainer.appendChild(h(`<p class="license-card-meta" style="text-align:center;font-weight:700;padding:1rem 0">✓ 등록 완료 — AI 분석 커버리지 ${before}% → ${after}%${deltaText}</p>`));
  setTimeout(() => onDone(completenessData), 1300);
}

// renderOnboardingFinalConfirm — AI 분석 커버리지 50% 이상 달성 후
// [완료]를 눌렀을 때 보여주는 최종 확인 화면(사용자 스펙 5번). 확인하면
// 서버가 다시 한번 50% 이상인지 검증한 뒤(POST /api/me/onboarding/complete
// — 클라이언트 판단을 그대로 믿지 않는 이 프로젝트의 일관된 원칙)
// onboarding_completed_at을 찍고 대시보드로 이동한다.
function renderOnboardingFinalConfirm(container, completenessData) {
  const p = currentProfile || {};
  const fmtMoney = (v) => (v == null ? '-' : `${Number(v).toLocaleString()}원`);
  const fmtList = (v) => ((v || []).length ? v.join(', ') : '-');
  const rows = [
    ['지역', p.region || '-'],
    ['업종', fmtList(p.industry)],
    ['기업 규모', p.companySize || '-'],
    ['업력', p.businessAgeYears != null ? `${p.businessAgeYears}년` : '-'],
    ['직원 수', p.employeeCount != null ? `${p.employeeCount}명` : '-'],
    ['매출액', fmtMoney(p.revenueAmount)],
  ];
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="detail-card onboarding-shell">
      ${onboardingExitButtonHtml()}
      <h2 style="text-align:center">등록하신 정보를 확인해주세요</h2>
      ${onboardingCoverageBarHtml(completenessData.overallCompleteness)}
      <div class="profile-summary-list" style="margin-top:1rem">
        ${rows.map(([label, value]) => `
          <div class="profile-summary-row">
            <span class="profile-summary-label">${escapeHtml(label)}</span>
            <span class="profile-summary-value">${escapeHtml(value)}</span>
          </div>
        `).join('')}
      </div>
      <div id="onboarding-final-confirm-error" class="error" style="display:none;margin-top:0.75rem"></div>
      <button type="button" class="btn btn-primary btn-block" id="onboarding-final-confirm-btn" style="margin-top:1rem">이 정보로 분석을 시작합니다</button>
      <button type="button" class="btn btn-secondary btn-block" id="onboarding-final-back-btn" style="margin-top:0.5rem">더 등록하기</button>
    </div>
  `));
  document.getElementById('onboarding-final-back-btn').addEventListener('click', () => renderOnboardingComplete(container));
  const errorBox = document.getElementById('onboarding-final-confirm-error');
  document.getElementById('onboarding-final-confirm-btn').addEventListener('click', async () => {
    errorBox.style.display = 'none';
    try {
      await apiRequest('POST', '/api/me/onboarding/complete', {});
      await loadMe();
      location.hash = '#/';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// companyProfileUpdatePayload — PUT /api/me/company-profile는 부분수정이
// 아니라 항상 전체 컬럼을 덮어쓰는 UPDATE라(auth.go), 미니 등록폼처럼
// 필드 하나만 물어보는 화면도 currentProfile 전체를 다시 실어 보내야
// 나머지 필드가 NULL로 덮어써지는 사고를 막는다. overrides로 바뀐
// 필드만 얹어서 반환.
function companyProfileUpdatePayload(overrides) {
  const p = currentProfile || {};
  return Object.assign({
    businessRegistrationNumber: p.businessRegistrationNumber || null,
    companyName: p.companyName || null,
    representativeName: p.representativeName || null,
    address: p.address || null,
    businessType: p.businessType || [],
    region: p.region || null,
    industry: p.industry || [],
    businessAgeYears: p.businessAgeYears != null ? p.businessAgeYears : null,
    revenueAmount: p.revenueAmount != null ? p.revenueAmount : null,
    employeeCount: p.employeeCount != null ? p.employeeCount : null,
    companySize: p.companySize || null,
    licenses: p.licenses || [],
    certifications: p.certifications || [],
    directProductionCert: !!p.directProductionCert,
    maxPerformanceAmount: p.maxPerformanceAmount != null ? p.maxPerformanceAmount : null,
    creditRating: p.creditRating || null,
    phoneNumber: p.phoneNumber || null,
  }, overrides);
}

// 하한값"으로 역매핑한다 — 정확히 일치하는 값만 선택되는 게 아니라, 몇
// 명이든 자기 구간을 찾아 보여준다.
function employeeCountRangeValueFor(count) {
  if (count == null) return '';
  let selected = '';
  EMPLOYEE_COUNT_RANGE_OPTIONS.forEach(o => {
    if (count >= Number(o.value)) selected = o.value;

  return selected;
}

// PIPELINE_STATUS_LIST — notice_pipeline_entries.status의 9단계, DB
// CHECK 제약과 정확히 같은 값·순서(company_pipeline.go validPipelineStatuses).
const PIPELINE_STATUS_LIST = ['검토전', '참여검토', '승인대기', '준비중', '제출완료', '낙찰', '탈락', '보류', '제외'];
const PIPELINE_ACTIVE_STATUSES = ['검토전', '참여검토', '승인대기', '준비중'];
const CHECKLIST_STATUS_LIST = ['보유', '갱신필요', '신규작성', '발급필요', '확인필요'];

// 진행 순서가 있는 5단계(happy path)만 스텝 인디케이터로 표시하고,
// 낙찰/탈락/보류/제외처럼 흐름을 벗어난 종결 상태는 "N단계 중 M번째"가
// 의미 없으므로 톤 배지로 대체 표시한다.
const PIPELINE_MAIN_STEPS = ['검토전', '참여검토', '승인대기', '준비중', '제출완료'];
const PIPELINE_TERMINAL_BADGE_TONE = { '낙찰': 'badge--success', '탈락': 'badge--danger', '보류': 'badge--warn', '제외': 'badge--gray' };

// 상태 단순화: select에 9개를 평평하게 늘어놓으면 매번 어디를 눌러야
// 할지 고민해야 한다 — 현재 상태에서 실제로 갈 만한 "다음 단계"만 먼저
// 보여주고, 나머지는 <optgroup>으로 접어 뒤에 둔다(값 자체는 그대로
// 9개 다 선택 가능 — 잘못 바꾼 상태를 되돌리는 것까지 막지는 않는다).
const PIPELINE_NEXT_STATUS_MAP = {
  '검토전': ['참여검토', '보류', '제외'],
  '참여검토': ['승인대기', '준비중', '보류', '제외'],
  '승인대기': ['준비중', '보류', '제외'],
  '준비중': ['제출완료', '보류', '제외'],
  '제출완료': ['낙찰', '탈락'],
  '보류': ['검토전', '참여검토', '준비중', '제외'],
  '낙찰': [],
  '탈락': [],
  '제외': [],
};

function pipelineStatusSelectHtml(currentStatus) {
  const nextOptions = (PIPELINE_NEXT_STATUS_MAP[currentStatus] || []).filter(s => s !== currentStatus);
  const otherOptions = PIPELINE_STATUS_LIST.filter(s => s !== currentStatus && !nextOptions.includes(s));
  const optionHtml = (s) => `<option value="${escapeAttr(s)}" ${s === currentStatus ? 'selected' : ''}>${escapeHtml(s)}</option>`;
  const groups = [];
  groups.push(`<optgroup label="현재 상태">${optionHtml(currentStatus)}</optgroup>`);
  if (nextOptions.length) {
    groups.push(`<optgroup label="다음 단계">${nextOptions.map(optionHtml).join('')}</optgroup>`);
  }
  if (otherOptions.length) {
    groups.push(`<optgroup label="기타">${otherOptions.map(optionHtml).join('')}</optgroup>`);
  }
  return `<select name="status" class="select-input">${groups.join('')}</select>`;
}

// stepIndicatorHtml — 점+선 스텝 인디케이터 공용 헬퍼. 파이프라인 상태
// 표시와 프로필 수정 모달의 단계 표시 양쪽에서 재사용한다.
function stepIndicatorHtml(currentIdx, total, label) {
  const dots = Array.from({ length: total }).map((_, i) => {
    const dotCls = i < currentIdx ? 'is-done' : (i === currentIdx ? 'is-current' : '');
    const lineCls = i < currentIdx ? 'is-done' : '';
    const dot = `<span class="step-indicator-dot ${dotCls}"></span>`;
    const line = i < total - 1 ? `<span class="step-indicator-line ${lineCls}"></span>` : '';
    return dot + line;
  }).join('');
  return `<span class="step-indicator">${dots}<span class="step-indicator-label">${escapeHtml(label)}</span></span>`;
}

function pipelineStepIndicatorHtml(status) {
  const terminalTone = PIPELINE_TERMINAL_BADGE_TONE[status];
  if (terminalTone) {
    return `<span class="badge ${terminalTone}">${escapeHtml(status)}</span>`;
  }
  const idx = PIPELINE_MAIN_STEPS.indexOf(status);
  return stepIndicatorHtml(idx, PIPELINE_MAIN_STEPS.length, status);
}

// renderDashboard — "오늘 할 일" 홈 화면. data는 handleDashboard(신규 응답
// 모양: summary + priorityItems)의 결과를 그대로 받는다. 예전 3버킷
// 집계(readyCount 등)는 더 이상 없다 — 이 응답을 쓰는 화면은 여기뿐이라
// 하위호환을 유지할 이유가 없었다.
function renderDashboard(container, data) {
  document.body.classList.remove('is-landing');
  container.innerHTML = '';
  // 프로필 미완성 안내는 이제 #global-profile-banner(전역, #app 밖)가
  // 담당한다 — route()가 매 페이지 이동마다 renderGlobalProfileBanner()를
  // 호출하므로 여기서 따로 그릴 필요가 없다.
  renderHomeOverlay();

  const s = data.summary;
  // filter는 renderPipelineList가 읽는 쿼리 파라미터 값(dashboard.go 요약
  // 집계와 반드시 같은 정의를 쓴다 — 카드 숫자와 클릭 후 목록 건수가
  // 어긋나면 안 됨. AI 분석 카드만 목적지가 다르다(#/ai-usage).
  const tiles = [
    { label: '참여검토 대기', count: s.reviewPendingCount, cls: 'dash-tile--review', href: '#/pipeline?filter=reviewPending' },
    { label: '마감임박', count: s.deadlineSoonCount, cls: 'dash-tile--not-recommended', href: '#/pipeline?filter=deadlineSoon' },
    { label: '서류확인필요', count: s.needsDocumentCount, cls: '', href: '#/pipeline?filter=needsDocument' },
    { label: '담당자미지정', count: s.unassignedCount, cls: '', href: '#/pipeline?filter=unassigned' },
  ];
  const aiLimitLabel = s.aiAnalysisLimit < 0 ? '무제한' : s.aiAnalysisLimit;
  const aiCountLabel = s.aiAnalysisLimit < 0 ? `${s.aiAnalysisUsedCount}건` : `${s.aiAnalysisUsedCount}/${aiLimitLabel}건`;
  const tilesHtml = tiles.map(t => `
    <div class="dash-tile ${t.cls} dash-tile--clickable" data-href="${escapeAttr(t.href)}">
      <div class="dash-tile-count">${t.count}건</div>
      <div class="dash-tile-label">${escapeHtml(t.label)}</div>
    </div>
  `).join('') + `
    <div class="dash-tile dash-tile--clickable" data-href="#/ai-usage">
      <div class="dash-tile-count">${aiCountLabel}</div>
      <div class="dash-tile-label">AI 분석 (이번달)</div>
    </div>
  `;

  const items = data.priorityItems || [];
  const itemsHtml = items.length
    ? `<div class="home-list">${items.map(homeListRowHtml).join('')}</div>`
    : '<p class="empty">오늘 처리할 업무가 없습니다. 잘하고 계세요.</p>';

  const automationHtml = renderAutomationSummaryHtml(data.automationSummary);
  const growthHtml = renderGrowthSummaryHtml(data.growthSummary);
  const eligibilityHtml = renderEligibilitySummaryHtml(data.eligibilitySummary, data.growthSummary && data.growthSummary.overallCompleteness);
  const requirementGapsHtml = renderDocumentRequirementGapsHtml(data.documentRequirementGaps);

  container.appendChild(h(`
    <div class="dash-greeting">
      <p class="dash-greeting-eyebrow">안녕하세요.</p>
      <h2 class="dash-greeting-title">오늘 확인할 업무입니다.</h2>
    </div>
    <div class="dash-brief-card">
      <p class="dash-brief-text">${escapeHtml(data.briefing || '')}</p>
    </div>
    <div class="dash-tiles">${tilesHtml}</div>
    <p class="license-card-meta">${glossaryHtml('AI 분석')} 카드는 이번달 AI 자동분석 사용 현황입니다.</p>
    <h3 class="dash-section-title">오늘 해야 할 일 (${items.length}건)</h3>
    ${itemsHtml}
    ${growthHtml}
    ${eligibilityHtml}
    ${requirementGapsHtml}
    ${automationHtml}
  `));

  container.querySelectorAll('.dash-tile--clickable').forEach(tile => {
    tile.addEventListener('click', () => { location.hash = tile.dataset.href; });
  });
  wireHomeListNav(container);
}

// renderAutomationSummaryHtml — "이번 달 자동화 성과". 절감시간은 실측이
// 아니라 가정이므로(과장 금지 원칙, Phase 7과 동일) 서버가 내려주는

// 크게, 근거 문장은 작게 아래에 둔다(디자인 시스템: 숫자 위계).

// ELIGIBILITY_MISSING_FIELD_LABELS — dashboard.go의 eligibilitySummary.
// missingFields(지역/업종/기업규모 중 회사 프로필에 실제로 비어있는 값)를
// 화면 문구용 한글 라벨로 바꾼다. renderEligibilitySummaryHtml/
// renderOnboardingComplete 둘 다 공유.
const ELIGIBILITY_MISSING_FIELD_LABELS = { region: '사업장 지역', industry: '업종', companySize: '기업 규모' };

// eligibilityConfidenceTier — Phase UX-04(2026-08-04). 회사 정보가 너무
// 적으면(overallCompleteness<30%) 개별 판정(즉시참여/조건보완/참여어려움)이
// 사실상 근거가 얕은 추측이 되므로, 판정 로직(scoreNoticeForCompany) 자체는
// 그대로 두고 "표시 레이어"에서만 전부 "확인 필요"로 묶어 보여준다 —
// 판정을 새로 만드는 게 아니라 이미 있는 결과를 신뢰도에 따라 다르게
// 보여줄 뿐. 30~70%/70%+ 두 구간은 기존 필드별 insufficient_data
// 메커니즘이 이미 자연스럽게 "일부만 판정→대부분 판정"으로 정밀도가
// 올라가는 효과를 내고 있어 별도 로직이 필요 없다(사용자 확인 완료 —
// 임의의 새 임계값 로직을 더 만들지 않기로 함).
function eligibilityConfidenceTier(overallCompleteness) {
  if (overallCompleteness == null) return 'full';
  return overallCompleteness < 30 ? 'low' : 'full';
}

// eligibilitySummaryRowsHtml — renderEligibilitySummaryHtml(대시보드 카드)와
// renderOnboardingComplete(온보딩 완료 화면) 둘 다 같은 3버킷 표시를 쓰므로
// 신뢰도 기반 표시 전환 로직을 여기 하나로 공유한다.
function eligibilitySummaryRowsHtml(eg, overallCompleteness) {
  const total = eg.ready + eg.needsReview + eg.notRecommended + eg.insufficientData;
  if (eligibilityConfidenceTier(overallCompleteness) === 'low') {
    return `
      <p class="low-confidence-note">⚠️ 등록된 회사 정보가 적어 판정 정확도가 낮습니다. 정보를 등록하면 더 정확한 판정을 받을 수 있어요.</p>
      <div class="profile-summary-list">
        <div class="profile-summary-row"><span>🔵 확인 필요</span><strong>${total}건</strong></div>
      </div>
    `;
  }
  return `
    <div class="profile-summary-list">
      <div class="profile-summary-row"><span>✅ 즉시 참여 가능</span><strong>${eg.ready}건</strong></div>
      <div class="profile-summary-row"><span>🟡 조건 보완 후 참여 가능</span><strong>${eg.needsReview}건</strong></div>
      <div class="profile-summary-row"><span>🔴 현재 참여 어려움</span><strong>${eg.notRecommended}건</strong></div>
    </div>
  `;
}

// renderEligibilitySummaryHtml — Phase UX-01(2026-08-04) 4버킷 판정 집계
// 카드(dashboard.go의 computeEligibilityBucketSummary — scoreNoticeForCompany를
// 그대로 재사용, 판정 로직 자체는 안 건드림). "판정 불가" 건은 missingFields
// 근거로 "입력하기" CTA까지 함께 보여준다 — 지역/업종/기업규모만 실제
// 판정기준이 있어 정확한 건수를 낼 수 있고(사용자 확인 완료), 실적/인증/
// 재무는 이 카드에 안 넣는다(정확한 건수를 낼 판정기준이 없음).
function renderEligibilitySummaryHtml(eg, overallCompleteness) {
  if (!eg) return '';
  const total = eg.ready + eg.needsReview + eg.notRecommended + eg.insufficientData;
  const missingLabels = (eg.missingFields || []).map(f => ELIGIBILITY_MISSING_FIELD_LABELS[f] || f);
  const isLowConfidence = eligibilityConfidenceTier(overallCompleteness) === 'low';
  return `
    <div class="detail-card">
      <h3>추천공고 판정 현황</h3>
      <p class="license-card-meta">현재 활성화된 공고 ${total}건 기준</p>
      ${eligibilitySummaryRowsHtml(eg, overallCompleteness)}
      ${!isLowConfidence && eg.insufficientData > 0 && missingLabels.length ? `
        <p class="license-card-meta">${escapeHtml(missingLabels.join('·'))} 정보가 없어 ${eg.insufficientData}건을 정확하게 판정하지 못했습니다. <a href="#/me/profile">입력하기 &rarr;</a></p>
      ` : ''}
    </div>
  `;
}

// renderDocumentRequirementGapsHtml — Phase UX-02(2026-08-04) "부족한 정보
// 안내" 카드. dashboard.go computeDocumentRequirementGaps가 required_documents
// (공고별 실제 제출서류)를 키워드 매칭해 낸 실제 건수만 쓴다 — eligibility.go
// 판정엔진에 없는 카테고리(실적/인증/직접생산확인)라 "판정"이 아니라 "이
// 서류를 요구하는 공고 수"로 표현한다(임의의 숫자 없음, 계산 불가하면
// 이 카드 자체가 렌더링 안 됨).
function renderDocumentRequirementGapsHtml(gaps) {
  if (!gaps || !gaps.length) return '';
  const rows = gaps.map(g => `
    <p class="license-card-meta">${escapeHtml(documentRequirementGapPromptText(g.label, g.noticeCount))} <a href="${escapeAttr(g.ctaHref)}">${escapeHtml(g.label)} 등록하기 &rarr;</a></p>
  `).join('');
  return `
    <div class="detail-card">
      <h3>등록하면 더 정확해져요</h3>
      ${rows}
    </div>
  `;
}

// homeListRowHtml — 원형 아이콘 + 제목/부제 + D-day 배지 + 화살표(토스
// 스타일 행 리스트). 부제는 "기관 · 상태" 대신 서버가 내려주는 reason
// (사유)을 그대로 써서 왜 이 항목이 여기 있는지 바로 알 수 있게 한다.
// 행 전체가 ctaHref로 이동한다(kind별 이동 규칙은 서버가 이미 확정해

function homeListRowHtml(item) {
  const org = item.organizationName || '-';
  const subtitle = item.reason ? `${org} · ${item.reason}` : org;
  const dday = ddayInfo(item.applicationEndAt);
  const isUrgent = dday.cls.includes('danger');
  const icon = LIST_ROW_ICONS[item.kind] || LIST_ROW_ICONS.pipeline;
  return `
    <div class="home-list-row${isUrgent ? ' home-list-row--urgent' : ''}" data-cta-href="${escapeAttr(item.ctaHref || '')}">

        <div class="home-list-subtitle">${escapeHtml(subtitle)}</div>
