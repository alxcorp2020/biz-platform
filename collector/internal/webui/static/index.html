// g2b 원문 JSON(raw_documents.raw_content)에서 그때그때 파싱한 상세 필드.
// 지역제한은 이 데이터 소스(목록조회 API)에 판단기준 텍스트만 있고 구체적인
// 지역명 목록 자체가 없어, 표로 꾸미지 않고 있는 그대로(판단기준 문구 또는
// "확인 불가")를 보여준다 — 없는 데이터를 있는 것처럼 표로 만들지 않는다.
function renderNoticeDetailInfo(container, detail) {
  container.innerHTML = '';
  if (!detail) {
    container.appendChild(h('<p class="section-empty">원문 상세 데이터를 확인할 수 없습니다.</p>'));
    return;
  }
  const rows = [];
  if (detail.noticeKind) rows.push(['공고종류', escapeHtml(detail.noticeKind)]);
  if (detail.contractMethod) rows.push(['계약방법', escapeHtml(detail.contractMethod)]);
  if (detail.awardMethod) {
    let v = escapeHtml(detail.awardMethod);
    if (detail.awardMethodDetail) v += `<span class="detail-sub">${escapeHtml(detail.awardMethodDetail)}</span>`;
    rows.push(['낙찰방법', v]);
  }
  if (detail.awardLowerLimitRate) rows.push(['낙찰하한율', `<span class="mono">${escapeHtml(detail.awardLowerLimitRate)}%</span>`]);
  if (detail.rebidAllowed !== null && detail.rebidAllowed !== undefined) {
    rows.push(['재입찰 허용', detail.rebidAllowed ? '허용' : '불허']);
  }
  if (detail.estimatedPrice != null) rows.push(['추정가격', `<span class="mono">${formatBudget(detail.estimatedPrice)}</span>`]);
  if (detail.vat != null) rows.push(['부가가치세', `<span class="mono">${formatBudget(detail.vat)}</span>`]);
  if (detail.officerName) {
    let v = escapeHtml(detail.officerName);
    if (detail.officerPhone) v += ` <span class="mono">${escapeHtml(detail.officerPhone)}</span>`;
    rows.push(['담당자', v]);
  }
  if (detail.qualificationDeadlineAt) rows.push(['입찰참가자격등록 마감', `<span class="mono">${formatDateTime(detail.qualificationDeadlineAt)}</span>`]);
  if (detail.applicationStartAt) rows.push(['입찰서 제출 시작', `<span class="mono">${formatDateTime(detail.applicationStartAt)}</span>`]);
  if (detail.applicationEndAt) rows.push(['입찰서 제출 마감', `<span class="mono">${formatDateTime(detail.applicationEndAt)}</span>`]);
  if (detail.bidOpeningAt) rows.push(['개찰일시', `<span class="mono">${formatDateTime(detail.bidOpeningAt)}</span>`]);

  const dl = rows.map(([label, value]) => `<div><dt>${escapeHtml(label)}</dt><dd>${value}</dd></div>`).join('');

  const industryText = detail.industryRestricted === true ? '있음'
    : detail.industryRestricted === false ? '없음' : '정보 없음';
  const regionText = detail.regionRestrictionBasis
    ? `있음 (판단기준: ${escapeHtml(detail.regionRestrictionBasis)})`
    : '이 데이터만으로는 확인 불가 — 원문 공고 확인 필요';

  container.appendChild(h(`
    <dl class="detail-meta">${dl}</dl>
    <div class="restriction-summary">
      <div><span class="restriction-label">업종제한</span><span class="restriction-value">${industryText}</span></div>
      <div><span class="restriction-label">지역제한</span><span class="restriction-value">${regionText}</span></div>
    </div>
  `));
}

function renderAttachments(container, items) {
  container.innerHTML = '';
  if (!items.length) {
    container.appendChild(h('<p class="section-empty">첨부파일이 없습니다.</p>'));
    return;
  }
  const rows = items.map(it => {
    const sizeText = formatFileSize(it.fileSizeBytes);
    const statusBadge = it.downloadStatus !== 'completed'
      ? `<span class="status-badge status-badge--muted">${escapeHtml(it.downloadStatus)}</span>`
      : '';
    const nameHtml = it.downloadUrl
      ? `<a href="${escapeAttr(it.downloadUrl)}" target="_blank" rel="noopener">${escapeHtml(it.originalFilename)}</a>`
      : escapeHtml(it.originalFilename);
    return `
      <li class="attachment-item">
        <span class="attachment-name">${nameHtml}</span>
        <span class="attachment-meta mono">${escapeHtml((it.fileType || '').toUpperCase())} ${sizeText}</span>
        ${statusBadge}
      </li>`;
  }).join('');
  container.appendChild(h(`<ul class="attachment-list">${rows}</ul>`));
}

const CONDITION_CATEGORY_LABELS = { general: '일반' };
const NO_DOCUMENT_LIST_LABEL = '(본문에 목록 없음 - 별첨/타 문서 참조)';

// 규칙 기반(1차)과 AI 보완(2차) 결과를 한 목록에 같이 보여준다 — AI 보완이
// 있다고 규칙 기반 원본(특히 review_required)을 화면에서 지우면 정보를
// 숨기는 셈이라, 대신 배지로 출처를 구분한다.
function extractionMethodBadgeHtml(method) {
  if (method === 'ai') {
    return '<span class="extraction-method-badge extraction-method-badge--ai">AI 보완</span>';
  }
  return '<span class="extraction-method-badge extraction-method-badge--rule">규칙 기반</span>';
}

// 첨부문서 분석이 아직 안 된 공고(신규 수집 공고 대부분)에는 목록 자체가
// 없다는 사실을 숨기지 않고 그대로 보여준다 — 섹션을 숨기면 이 기능이
// 있는지조차 모르게 되므로, 안내 문구로 상태를 알린다.
function renderEligibilityConditions(container, items) {
  container.innerHTML = '';
  if (!items.length) {
    container.appendChild(h('<p class="section-empty">아직 분석되지 않았습니다.</p>'));
    return;
  }
  const rows = items.map(it => `
    <li class="condition-item">
      <div class="condition-head">
        <span class="condition-category">${escapeHtml(CONDITION_CATEGORY_LABELS[it.category] || it.category)}</span>
        ${extractionMethodBadgeHtml(it.extractionMethod)}
        ${it.reviewStatus === 'review_required' ? reviewRequiredWarningHtml() : ''}
      </div>
      <p class="condition-name">${escapeHtml(it.conditionName)}</p>
      <blockquote class="source-quote">${escapeHtml(it.sourceText)}</blockquote>
    </li>
  `).join('');
  container.appendChild(h(`<ul class="condition-list">${rows}</ul>`));
}

// readiness는 handleGetNotice가 함께 내려주는 {total, checked} 집계 — 로그인/
// 프로필 여부와 무관하게 항상 값이 온다(비로그인이면 checked는 전부 false).
// 체크박스 토글은 PUT /api/notices/{id}/documents/{id}/checklist를 호출하고,
// 진행률 숫자는 서버 재조회 없이 로컬에서 +1/-1로 갱신한다(리스트에 포함된
// "본문에 목록 없음" 참조행은 total에는 잡히지만 체크 대상이 아니라 DOM
// 재계산과 어긋날 수 있어, 서버가 준 total을 고정값으로 쓴다).
function renderRequiredDocuments(container, items, noticeId, readiness) {
  container.innerHTML = '';
  if (!items.length) {
    container.appendChild(h('<p class="section-empty">아직 분석되지 않았습니다.</p>'));
    return;
  }

  const hasReadiness = !!readiness && readiness.total > 0;
  let checkedCount = hasReadiness ? readiness.checked : 0;
  const total = hasReadiness ? readiness.total : 0;
  const progressHtml = hasReadiness ? `
    <div class="doc-progress">
      <div class="doc-progress-bar"><div class="doc-progress-fill" id="doc-progress-fill" style="width:${Math.round((checkedCount / total) * 100)}%"></div></div>
      <span class="doc-progress-label" id="doc-progress-label">서류 준비 ${checkedCount}/${total}</span>
    </div>` : '';

  const rows = items.map(it => {
    if (it.documentName === NO_DOCUMENT_LIST_LABEL) {
      return `
        <li class="document-item document-item--reference">
          <div class="document-head">${extractionMethodBadgeHtml(it.extractionMethod)}</div>
          <p class="document-reference-note">☞ 원문 확인 필요 — 본문에 서류 목록이 없어 별첨/타 문서를 참조해야 합니다.</p>
        </li>`;
    }
    return `
      <li class="document-item">
        <div class="document-head">${extractionMethodBadgeHtml(it.extractionMethod)}</div>
        <label class="document-check">
          <input type="checkbox" data-document-id="${escapeAttr(it.id)}" ${it.checked ? 'checked' : ''}>
          <span class="document-name">${escapeHtml(it.documentName)}</span>
        </label>
      </li>`;
  }).join('');

  container.appendChild(h(`${progressHtml}<p class="error doc-checklist-error" style="display:none"></p><ul class="document-list">${rows}</ul>`));

  const errBox = container.querySelector('.doc-checklist-error');
  container.querySelectorAll('input[data-document-id]').forEach(cb => {
    cb.addEventListener('change', async () => {
      const documentId = cb.dataset.documentId;
      const checked = cb.checked;
      cb.disabled = true;
      if (errBox) errBox.style.display = 'none';
      try {
        await apiRequest('PUT', '/api/notices/' + encodeURIComponent(noticeId) + '/documents/' + encodeURIComponent(documentId) + '/checklist', { checked });
        checkedCount += checked ? 1 : -1;
        const fill = document.getElementById('doc-progress-fill');
        const label = document.getElementById('doc-progress-label');
        if (fill) fill.style.width = Math.round((checkedCount / total) * 100) + '%';
        if (label) label.textContent = `서류 준비 ${checkedCount}/${total}`;
      } catch (err) {
        cb.checked = !checked;
        if (err.status === 401) {
          location.hash = '#/auth/login';
        } else if (errBox) {
          errBox.textContent = err.message;
          errBox.style.display = '';
        }
      } finally {
        cb.disabled = false;
      }
    });
  });
}

const PARTICIPATION_BUCKET_LABELS = {
  ready: '참여 추천',
  needs_review: '확인 필요',
  not_recommended: '참여 비추천',
};

// GRADE_LABELS — 5단계 종합판정(participationScore.grade). 기존 3단계
// bucket을 대체하지 않고 보완하는 세분화 등급이다.
const GRADE_LABELS = {
  recommended: '참여 권장',
  conditional: '조건부 참여 가능',
  joint_venture_review: '공동수급 검토',
  needs_confirmation: '확인 필요',
  not_recommended: '참여 곤란',
};
// GRADE_BADGE_TONE — .ai-bucket-badge(크기)와 조합해서 쓰는 공용 배지
// 색상 톤(Phase 1의 .badge--*). ready/needs_review는 예전 3버킷 값도
// 함께 들어올 수 있어 매핑에 남겨둔다.
const GRADE_BADGE_TONE = {
  recommended: 'badge--success', ready: 'badge--success',
  conditional: 'badge--blue',
  joint_venture_review: 'badge--warn', needs_review: 'badge--warn',
  not_recommended: 'badge--danger',
  needs_confirmation: 'badge--gray',
};
function gradeBadgeHtml(grade, label) {
  return `<span class="ai-bucket-badge ${GRADE_BADGE_TONE[grade] || 'badge--gray'}">${escapeHtml(label)}</span>`;
}

// "핵심 요약" — analyzer/ai_summarize.py(claude-sonnet-5)가 배치로 미리
// 생성해둔 3줄 요약을 그대로 보여준다(Go/프론트 어느 쪽도 실시간으로 Claude를
// 호출하지 않음). 아직 생성되지 않은 공고가 대부분일 수 있으므로 기존 다른
// 섹션들과 같은 톤("아직 분석되지 않았습니다")으로 그 상태를 그대로 알린다.
function renderAISummary(container, summary) {
  container.innerHTML = '';
  if (!summary || !summary.lines || !summary.lines.length) {
    container.appendChild(h('<p class="section-empty">아직 요약이 생성되지 않았습니다.</p>'));
    return;
  }
  const items = summary.lines.map(line => `<li>${escapeHtml(line)}</li>`).join('');
  container.appendChild(h(`
    <div class="ai-summary-card">
      <ul class="ai-summary-list">${items}</ul>
      <p class="ai-summary-meta">AI 요약 · ${escapeHtml(summary.model || '')} · ${formatDateTime(summary.generatedAt)}</p>
    </div>
  `));
}

// 공고 상세 첫 화면에 자동으로 뜨는 "AI 참여 분석" — data.participationScore
// (handleGetNotice가 로그인+회사 프로필 기준으로 이미 계산해 응답에 포함)를
// 그대로 렌더링한다. 별도 버튼/클릭 없음 — 예전 "우리 회사 적합성 확인" 버튼은
// 이 섹션으로 통합되어 제거되었다. AI는 "가능/불가능"을 단정하지 않고
// "추천/확인 필요/비추천"으로만 표현한다(최종 결정은 사용자 몫).
function renderParticipationSection(container, score, isMinimalProfile) {
  container.innerHTML = '';

  if (!currentUser) {
    container.appendChild(h(`
      <div class="ai-participation-card ai-participation-card--cta">
        <p class="ai-participation-cta-text">로그인하고 회사 정보를 등록하면 AI가 이 공고의 참여 가능성을 분석해 드립니다.</p>
        <a href="#/auth/login" class="home-cta-primary">로그인하고 확인하기</a>
      </div>
    `));
    return;
  }
  if (!score) {
    container.appendChild(h(`
      <div class="ai-participation-card ai-participation-card--cta">
        <p class="ai-participation-cta-text">회사 정보를 등록하면 AI가 이 공고의 참여 가능성을 분석해 드립니다.</p>
        <a href="#/me/profile" class="home-cta-primary">회사 정보 등록하기</a>
      </div>
    `));
    return;
  }

  const gradeLabel = GRADE_LABELS[score.grade] || score.grade;
  const missing = score.categories.filter(c => c.result !== 'met');
  // dataGapSide === 'notice'는 공고 자체에 데이터가 없는 경우(사용자가 고칠 수
  // 없음 — g2b 수집 데이터의 구조적 한계)라 "자료 부족"이 아니라 "정보 없음"으로
  // 구분해서 보여준다. 'company'는 기업 프로필을 채우면 해결되는 경우다.
  const missingHtml = missing.length
    ? `<ul class="ai-missing-list">${missing.map(c => {
        const isNoticeGap = c.dataGapSide === 'notice';
        const resultLabel = isNoticeGap ? '정보 없음' : eligResultHtml(c.result);
        // 동적 질문 힌트(최소 버전): 회사 쪽 정보 공백(dataGapSide==='company')이라
        // 판정이 애매한 경우에만 "채우면 해결됨" 안내+링크를 붙인다 — 공고 쪽
        // 데이터 공백(notice)은 프로필을 채워도 해결되지 않으므로 보여주지 않는다.
        const hintHtml = c.result === 'insufficient_data' && c.dataGapSide === 'company'
          ? '<p class="elig-hint">이 정보가 있으면 더 정확히 판정됩니다. <a href="#/me/profile">기업 프로필에서 채우기 &rarr;</a></p>'
          : '';
        return `
        <li class="elig-item${isNoticeGap ? ' elig-item--notice-gap' : ''}">
          <div class="elig-head">
            <span class="elig-category">${eligCategoryHtml(c.category)}</span>
            <span class="elig-result elig-result--${escapeHtml(c.result)}">${resultLabel}</span>
          </div>
          <p class="elig-reason">${escapeHtml(c.reason)}</p>
          ${hintHtml}
        </li>`;
      }).join('')}</ul>`
    : '<p class="ai-missing-empty">확인된 조건이 모두 충족되었습니다.</p>';

  // "회사 정보 보완하기"는 기업 프로필을 채우면 실제로 해결되는 경우에만
  // 보여준다 — 공고 쪽 데이터 공백(dataGapSide==='notice')은 프로필을 채워도
  // 해결되지 않으므로 이 링크를 보여주면 잘못된 안내가 된다.
  const nextAction = missing.some(c => c.dataGapSide === 'company')
    ? '<a href="#/me/profile" class="ai-next-action">회사 정보 보완하기 &rarr;</a>'
    : '';

  container.appendChild(h(`
    <div class="ai-participation-card ai-participation-card--${escapeHtml(score.grade)}">
      <div class="ai-participation-head">
        ${gradeBadgeHtml(score.grade, gradeLabel)}
        <span class="ai-participation-score">${score.totalCount}개 중 ${score.metCount}개 충족</span>
      </div>
      ${score.gradeReason ? `<p class="ai-grade-reason">${escapeHtml(score.gradeReason)}</p>` : ''}
      ${isMinimalProfile ? `<p class="ai-minimal-profile-notice">간이 판정입니다 — 정확도를 높이려면 <a href="#/me/profile">프로필을 더 채워주세요</a>.</p>` : ''}
      <p class="ai-participation-subtitle">부족한 조건</p>
      ${missingHtml}
      ${nextAction}
      <p class="ai-disclaimer">⚠ 등록된 회사 정보와 공고 정보만으로 계산한 참고용 분석입니다. 최종 참여 여부는 원문 공고를 직접 확인한 후 결정하세요.</p>
    </div>
  `));
}

// renderChangeImpact — 공고에 가장 최근 생긴 변경(region/industry/
// budget_amount 중 참여 가능성에 실제로 영향을 주는 필드)이 우리 회사
// 참여 가능성을 어떻게 바꿨는지 보여준다. data.changeImpact는 해당하는
// 변경이 없거나(다른 필드만 바뀜) 비로그인/프로필 미등록이면 null이라
// 이 경우 섹션 자체를 렌더링하지 않는다(handleGetNotice가 이미 판단).
function renderChangeImpact(container, impact) {
  container.innerHTML = '';
  if (!impact) return;

  const beforeLabel = GRADE_LABELS[impact.before.grade] || impact.before.grade;
  const afterLabel = GRADE_LABELS[impact.after.grade] || impact.after.grade;
  const fieldsHtml = impact.changedFields.map(f => `<li>${escapeHtml(f.summary)}</li>`).join('');

  container.appendChild(h(`
    <div class="ai-participation-card change-impact-card ai-participation-card--${escapeHtml(impact.after.grade)}">
      <p class="ai-participation-subtitle">이번 변경이 우리 회사에 미치는 영향</p>
      <div class="change-impact-transition">
        ${gradeBadgeHtml(impact.before.grade, '변경 전: ' + beforeLabel)}
        <span class="change-impact-arrow">&rarr;</span>
        ${gradeBadgeHtml(impact.after.grade, '변경 후: ' + afterLabel)}
      </div>
      <ul class="change-impact-list">${fieldsHtml}</ul>
      ${impact.after.gradeReason ? `<p class="ai-grade-reason">${escapeHtml(impact.after.gradeReason)}</p>` : ''}
      <p class="ai-disclaimer">⚠ 등록된 회사 정보와 공고 정보만으로 계산한 참고용 분석입니다. 최종 참여 여부는 원문 공고를 직접 확인한 후 결정하세요.</p>
    </div>
  `));
}

// renderAwardHistory — "동일 발주기관 과거 낙찰 이력". count=0(수집기
// 미연동 또는 아직 수집된 이력이 없는 발주기관)이면 조용히 빈 상태
// 문구만 보여준다 — data.organizationAwardHistory가 애초에 null일 수도
// 있다(공고에 발주기관명 자체가 없는 경우).
function renderAwardHistory(container, history, hasCompetitiveOverlap) {
  container.innerHTML = '';
  if (!history || history.count === 0) {
    container.appendChild(h('<p class="empty">아직 수집된 낙찰 이력이 없습니다.</p>'));
    return;
  }

  const avgText = history.averageRate != null
    ? `평균 낙찰률 ${history.averageRate.toFixed(1)}%`
    : '평균 낙찰률 정보 없음';
  const overlapNote = hasCompetitiveOverlap
    ? '<p class="ai-minimal-profile-notice">우리 회사의 수행실적과 겹치는 발주기관·분야입니다 — 경쟁 강도 참고.</p>'
    : '';
  const rows = history.items.map(it => `
    <tr>
      <td>${escapeHtml(it.title || '-')}</td>
      <td>${escapeHtml(it.winnerName || '-')}</td>
      <td class="mono">${it.awardAmount != null ? formatBudget(it.awardAmount) : '-'}</td>
      <td class="mono">${it.awardRate != null ? it.awardRate.toFixed(1) + '%' : '-'}</td>
      <td class="mono">${escapeHtml(it.openedAt || '-')}</td>
    </tr>
  `).join('');

  container.appendChild(h(`
    <p class="license-card-meta">최근 ${history.items.length}건 표시 (전체 ${history.count}건) · ${escapeHtml(avgText)}</p>
    ${overlapNote}
    <div class="table-scroll"><table>
      <thead><tr><th>공고명</th><th>낙찰자</th><th>낙찰금액</th><th>낙찰률</th><th>개찰일</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  `));
}

// renderSignup — 2단계 온보딩(CTO 평가 TOP10 3번, 3분 이내 가입 목표).
// 1단계: 이메일/비번 -> 계정 생성. 2단계: 지역/업종/기업규모 3개만
// 필수 입력 -> 저장 즉시 홈(추천 리스트)으로 이동. 나머지 상세 프로필
// (면허/인증/재무/실적/인력)은 여기서 다루지 않고 "회사 정보" 화면의
// 완성도 카드에서 나중에 채우도록 유도한다(#/me/profile은 그대로 유지).
// pendingInviteToken — 로그인/가입 전에 팀 초대 링크(#/invite?token=...)로
// 들어온 경우 그 토큰을 잠깐 담아둔다. 가입/로그인 성공 직후 이 값이
// 있으면 자동으로 초대를 수락한다("받은 사람이 가입/로그인하면 자동
// 합류" 스펙) — 가입이면 회사 정보 등록(2단계)도 건너뛴다(이미 있는
// 회사에 합류하는 것이지 새로 만드는 게 아니므로).
let pendingInviteToken = null;

async function acceptPendingInviteIfAny() {
  if (!pendingInviteToken) return;
  const token = pendingInviteToken;
  pendingInviteToken = null;
  try {
    await apiRequest('POST', '/api/invitations/' + encodeURIComponent(token) + '/accept', {});
    await loadMe();
  } catch (err) {
    // 실패해도(예: 자리 다 참, 이메일 불일치) 로그인/가입 자체는 이미
    // 성공했으니 홈으로는 보낸다 — 에러는 콘솔에만 남긴다.
    console.error('초대 자동 수락 실패:', err.message);
  }
}

function renderSignup(container) {
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="auth-card">
      <h2>회원가입</h2>
      <div class="wizard-step-indicator">${stepIndicatorHtml(0, 2, '이메일·비밀번호')}</div>
      <form id="signup-form" class="auth-form">
        <label>이메일<input type="email" name="email" required></label>
        <label>비밀번호 (최소 8자)<input type="password" name="password" minlength="8" required></label>
        <div id="signup-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-block">다음</button>
      </form>
      <p class="auth-switch">이미 계정이 있으신가요? <a href="#/auth/login">로그인</a></p>
    </div>
  `));
  const form = document.getElementById('signup-form');
  const errorBox = document.getElementById('signup-error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    try {
      const data = await apiRequest('POST', '/api/auth/signup', {
        email: fd.get('email'), password: fd.get('password'),
      });
      currentUser = { id: data.id, email: data.email, role: 'user', plan: 'free' };

        location.hash = '#/';
      } else {
        renderSignupProfileStep(container);
      }
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// renderSignupProfileStep — 2단계: 지역/업종/기업규모 3개만. 이 3개만으로
// 이미 있는 규칙엔진(scoring.go)이 지역+업종 판정을 낼 수 있으므로, 완료
// 즉시 가치(추천 공고 리스트)를 보여줄 수 있다는 게 핵심.
function renderSignupProfileStep(container) {
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="auth-card">
      <h2>회사 정보</h2>
      <div class="wizard-step-indicator">${stepIndicatorHtml(1, 2, '회사 정보')}</div>
      <p class="auth-step-hint">이 3가지만 있으면 바로 맞춤 추천 공고를 볼 수 있어요. 면허·인증·재무 등 나머지 정보는 나중에 채워도 됩니다.</p>
      <form id="signup-profile-form" class="auth-form">
        <label>사업자 지역<input type="text" name="region" required placeholder="예: 서울, 부산, 전국"></label>
        <div class="field-group">
          <span class="field-group-label">업종 (겸업 시 여러 개 선택 가능)</span>
          <div class="checkbox-grid">
            ${INDUSTRY_GROUPS.map(g => `
              <label class="checkbox-label"><input type="checkbox" name="industry" value="${escapeAttr(g)}"> ${escapeHtml(g)}</label>
            `).join('')}
          </div>
        </div>
        <label>기업 규모<input type="text" name="companySize" required placeholder="소기업/소상공인/중기업 등"></label>
        <div id="signup-profile-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-block">완료하고 추천 공고 보기</button>
      </form>
    </div>
  `));
  const form = document.getElementById('signup-profile-form');
  const errorBox = document.getElementById('signup-profile-error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    const industry = fd.getAll('industry');
    if (!industry.length) {
      errorBox.textContent = '업종을 하나 이상 선택해주세요.';

// eligibility.go의 industryGroups와 순서·값 모두 일치해야 한다.
const INDUSTRY_GROUPS = [
  'ICT/SW', '연구/조사/컨설팅', '설계/감리/CM', '행사/홍보/미디어',
  '시설관리/유지보수', '환경/폐기물', '생활서비스', '전문서비스', '교육', '기타',
];

function fillProfileForm(form, profile) {
  if (!profile) return;
  form.businessType.value = (profile.businessType || []).join(', ');
  form.region.value = profile.region || '';
  const selectedIndustry = new Set(profile.industry || []);
  form.querySelectorAll('input[name="industry"]').forEach(cb => {
    cb.checked = selectedIndustry.has(cb.value);
  });
  form.businessAgeYears.value = profile.businessAgeYears ?? '';
  form.revenueAmount.value = profile.revenueAmount ?? '';
  form.employeeCount.value = profile.employeeCount ?? '';
  form.companySize.value = profile.companySize || '';
  form.licenses.value = (profile.licenses || []).join(', ');
  form.certifications.value = (profile.certifications || []).join(', ');
  form.directProductionCert.checked = !!profile.directProductionCert;
  form.maxPerformanceAmount.value = profile.maxPerformanceAmount ?? '';
  form.creditRating.value = profile.creditRating || '';
}

// 관심공고(마이페이지). 해제 시 renderReviewList가 승인/반려 후
// card.remove()하는 것과 같은 패턴으로 새로고침 없이 카드를 즉시 지운다.
async function renderBookmarks(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/me/bookmarks');
  } catch (err) {
    if (err.status === 401) {
      location.hash = '#/auth/login';
      return;
    }
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  container.innerHTML = '';
  const emptyHtml = '<p class="empty">아직 등록한 관심공고가 없습니다. 공고 목록에서 별표를 눌러 등록해보세요.</p>';
  if (!data.items.length) {
    container.appendChild(h(emptyHtml));
    return;
  }

  const rows = data.items.map(n => {
    const dday = ddayInfo(n.applicationEndAt);
    const valueClass = dday.cls.includes('danger') ? 'row-card-value--danger'
      : (dday.label === '-' ? 'row-card-value--muted' : '');
    return `
    <div class="row-card notice-row" data-id="${escapeAttr(n.id)}">
      <div class="row-card-main">
        <div class="row-card-title">${escapeHtml(n.title)}</div>
        <div class="row-card-subtitle">
          ${noticeTypeBadgeHtml(n.noticeType)} ${escapeHtml(n.organizationName || '-')} · ${escapeHtml(n.region || '-')} · ${escapeHtml(n.industry || '-')} ·
          <span class="mono">${formatBudget(n.budgetAmount)}</span> · ${statusBadgeHtml(n.status)}
        </div>
      </div>
      <div class="row-card-side">
        ${bookmarkButtonHtml(n.id, true)}
        <span class="row-card-value ${valueClass}">${escapeHtml(dday.label)}</span>
        <span class="row-card-arrow">›</span>
      </div>
    </div>
  `;
  }).join('');
  container.appendChild(h(`<div class="notice-list">${rows}</div>`));

  container.querySelectorAll('.notice-row').forEach(row => {
    row.addEventListener('click', () => {
      location.hash = '#/notices/' + row.dataset.id;
    });
  });
  wireBookmarkButtons(container, {
    onUnbookmark: (noticeId, btn) => {
      const card = btn.closest('.notice-row');
      if (card) card.remove();
      if (!container.querySelector('.notice-row')) {
        container.innerHTML = '';
        container.appendChild(h(emptyHtml));
      }
    },
  });
}

// renderProfileCompletenessCard — 기업 프로필 화면 상단 요약 카드.
// 프로필이 아직 없는 신규 사용자는 /api/me/profile-completeness가
// company_profile_required(400)를 반환하므로 조용히 카드를 생략한다
// (에러 박스를 보여주면 "기본 정보" 탭이 처음 방문하는 화면이라는 사실과
// 안 맞음 — 아직 아무것도 등록 안 한 게 에러는 아니다).
async function renderProfileCompletenessCard(container) {
  container.innerHTML = '';
  let data;
  try {
    data = await apiRequest('GET', '/api/me/profile-completeness');
  } catch (err) {
    return;
  }

  const order = ['basic', 'industry', 'licenses', 'certifications', 'financials', 'trackRecords', 'personnel'];
  const rowsHtml = order.map(key => {
    const c = data.categories[key];
    if (!c) return '';
    return `
      <div class="completeness-row">
        <span class="completeness-label">${escapeHtml(c.label)}</span>
        <div class="completeness-bar"><div class="completeness-bar-fill" style="width:${c.completeness}%"></div></div>
        <span class="completeness-pct">${c.completeness}%</span>
      </div>
    `;
  }).join('');

  container.appendChild(h(`
    <div class="detail-card profile-completeness-card">
      <div class="completeness-summary">
        <div class="completeness-summary-item">
          <span class="completeness-summary-value">${data.overallCompleteness}%</span>
          <span class="completeness-summary-label">전체 완성도</span>
        </div>
        <div class="completeness-summary-item">
          <span class="completeness-summary-value">${data.matchConfidence}%</span>
          <span class="completeness-summary-label">매칭 신뢰도</span>
        </div>
        <div class="completeness-summary-item">
          <span class="completeness-summary-value">${data.needsVerificationCount}건</span>
          <span class="completeness-summary-label">검증 필요 항목</span>
        </div>
      </div>
      <div class="completeness-rows">${rowsHtml}</div>
    </div>
  `));
}

async function renderProfile(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let me;
  try {
    me = await apiRequest('GET', '/api/me');
  } catch (err) {
    location.hash = '#/auth/login';
    return;
  }
  currentUser = me.user;
  currentProfile = me.companyProfile;
  renderHeader();

  container.innerHTML = '';
  container.appendChild(h(`
    <h2>기업 프로필</h2>
    <div id="profile-completeness-section"></div>
    <div class="profile-tabs">
      <button type="button" class="profile-tab-btn is-active" data-tab="basic">기본 정보</button>
      <button type="button" class="profile-tab-btn" data-tab="financials">재무정보</button>
      <button type="button" class="profile-tab-btn" data-tab="track-records">수행실적</button>
      <button type="button" class="profile-tab-btn" data-tab="personnel">인력정보</button>
      <button type="button" class="profile-tab-btn" data-tab="contacts">담당자 관리</button>

// 알림 설정(email/phone/sms)은 팀기능으로 조직 단위(currentProfile)로
// 옮겨졌다 — currentUser엔 더 이상 없다. owner만 바꿀 수 있어 member면
// 토글/입력을 읽기 전용으로 보여준다(서버도 owner_only로 막지만, 프론트에서
// 미리 disabled 처리해 "저장 눌렀다가 403 보는" 경험을 없앤다).
function renderProfileBasicTab(container) {
  const p = currentProfile || {};
  const isOwner = p.role === 'owner';
  const disabledAttr = isOwner ? '' : 'disabled';
  const orgNote = isOwner ? '' : '<p class="license-card-meta">알림 설정은 팀 관리자만 변경할 수 있습니다.</p>';

  container.innerHTML = '';
  container.appendChild(h(`
    <div class="detail-card">
      <label class="checkbox-label">
        <input type="checkbox" id="email-notifications-toggle" ${p.emailNotificationsEnabled ? 'checked' : ''} ${disabledAttr}>
        이메일 알림 받기 (제출마감 D-3/D-1, 추천 공고 다이제스트, 담당자 상태변경)
      </label>
      <span id="email-notifications-status" class="license-card-meta"></span>
    </div>
    <div class="detail-card">
      <label>휴대폰 번호 (SMS 수신용, 조직 공용)
        <input type="tel" id="phone-number-input" value="${escapeAttr(p.phoneNumber || '')}" placeholder="01012345678" ${disabledAttr}>
      </label>
      ${isOwner ? '<button type="button" class="btn btn-secondary btn-sm" id="phone-number-save-btn">번호 저장</button>' : ''}
      <label class="checkbox-label" style="margin-top:0.75rem">
        <input type="checkbox" id="sms-notifications-toggle" ${p.smsNotificationsEnabled ? 'checked' : ''} ${disabledAttr}>
        SMS 알림 받기 (제출마감 D-3/D-1, 담당자 상태변경 — 추천 공고 다이제스트는 이메일에서만 제공됩니다)
      </label>
      <span id="sms-notifications-status" class="license-card-meta"></span>
      ${orgNote}
    </div>
    <div id="profile-summary-section"></div>
  `));

  const notificationsToggle = document.getElementById('email-notifications-toggle');
  const notificationsStatus = document.getElementById('email-notifications-status');
  if (isOwner) {
    notificationsToggle.addEventListener('change', async () => {
      const enabled = notificationsToggle.checked;
      notificationsToggle.disabled = true;
      try {
        await apiRequest('PATCH', '/api/me/notification-settings', { emailNotificationsEnabled: enabled });
        currentProfile.emailNotificationsEnabled = enabled;
        notificationsStatus.textContent = '저장되었습니다.';
      } catch (err) {
        notificationsToggle.checked = !enabled;
        notificationsStatus.textContent = err.message;
      } finally {
        notificationsToggle.disabled = false;
      }
    });

    const phoneInput = document.getElementById('phone-number-input');
    const phoneSaveBtn = document.getElementById('phone-number-save-btn');
    const smsToggle = document.getElementById('sms-notifications-toggle');
    const smsStatus = document.getElementById('sms-notifications-status');
    phoneSaveBtn.addEventListener('click', async () => {
      smsStatus.textContent = '';
      phoneSaveBtn.disabled = true;
      const phone = phoneInput.value.trim();
      try {
        await apiRequest('PATCH', '/api/me/notification-settings', { phoneNumber: phone });
        currentProfile.phoneNumber = phone;
        smsStatus.textContent = '전화번호가 저장되었습니다.';
      } catch (err) {
        smsStatus.textContent = err.message;
      } finally {
        phoneSaveBtn.disabled = false;
      }
    });
    smsToggle.addEventListener('change', async () => {
      const enabled = smsToggle.checked;
      smsToggle.disabled = true;
      try {
        await apiRequest('PATCH', '/api/me/notification-settings', { smsNotificationsEnabled: enabled });
        currentProfile.smsNotificationsEnabled = enabled;
        smsStatus.textContent = '저장되었습니다.';
      } catch (err) {
        smsToggle.checked = !enabled;
        smsStatus.textContent = err.message;
      } finally {
        smsToggle.disabled = false;
      }
    });
  }

  renderProfileSummaryCard(document.getElementById('profile-summary-section'));
}

// renderProfileSummaryCard — 12개 필드를 한 화면에 몰아두던 기존 폼을
// 읽기 전용 요약(제목:값 목록) + 강조 버튼 1개("정보 수정")로 바꾼다.
// 실제 수정은 openProfileEditModal의 3단계 모달 폼에서 이뤄진다.
function renderProfileSummaryCard(container) {
  const p = currentProfile || {};
  const fmtMoney = (v) => (v == null ? '-' : `${Number(v).toLocaleString()}원`);
  const fmtList = (v) => ((v || []).length ? v.join(', ') : '-');
  const rows = [
    ['업태', fmtList(p.businessType)],
    ['지역', p.region || '-'],
    ['업종', fmtList(p.industry)],
    ['업력', p.businessAgeYears != null ? `${p.businessAgeYears}년` : '-'],
    ['기업 규모', p.companySize || '-'],
    ['매출액', fmtMoney(p.revenueAmount)],
    ['직원 수', p.employeeCount != null ? `${p.employeeCount}명` : '-'],
    ['최근 3년 최대 실적', fmtMoney(p.maxPerformanceAmount)],
    ['신용등급', p.creditRating || '-'],
    ['보유 면허', fmtList(p.licenses)],
    ['보유 인증', fmtList(p.certifications)],
    ['직접생산확인', p.directProductionCert ? '보유' : '-'],
  ];
  const isOwner = p.role === 'owner';
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="detail-card">
      <div class="profile-summary-list">
        ${rows.map(([label, value]) => `
          <div class="profile-summary-row">
            <span class="profile-summary-label">${escapeHtml(label)}</span>
            <span class="profile-summary-value">${escapeHtml(value)}</span>
          </div>
        `).join('')}
      </div>
      ${isOwner
        ? '<button type="button" class="btn btn-primary btn-block" id="profile-edit-btn">정보 수정</button>'
        : '<p class="license-card-meta">기업 정보 수정은 팀 관리자만 할 수 있습니다.</p>'}
    </div>
  `));
  if (isOwner) {
    document.getElementById('profile-edit-btn').addEventListener('click', () => openProfileEditModal(container));
  }
}

// openProfileEditModal — 12개 필드를 3단계(기본정보/재무·실적/면허·인증)로
// 쪼갠 모달 폼. 필드는 전부 같은 <form> 안에 있고 wizard-step으로 보이는
// 것만 CSS로 바꾸므로(display:none), FormData는 어느 단계에 있든 항상
// 전체 값을 담는다 — 기존 제출 로직을 그대로 재사용할 수 있는 이유.
function openProfileEditModal(summaryContainer) {
  const stepLabels = ['기본 정보', '재무·실적정보', '면허·인증'];
  const bodyHtml = `
    <div id="wizard-step-indicator" class="wizard-step-indicator"></div>
    <form id="profile-form" class="profile-form">
      <div class="wizard-step" data-step="0">
        <label>업태 (쉼표로 구분, 겸업 시 여러 개 등록 가능)<input type="text" name="businessType"></label>
        <label>지역<input type="text" name="region"></label>
        <div class="field-group">
          <span class="field-group-label">업종 (겸업 시 여러 개 선택 가능 — 하나라도 일치하면 적합 판정)</span>
          <div class="checkbox-grid">
            ${INDUSTRY_GROUPS.map(g => `
              <label class="checkbox-label"><input type="checkbox" name="industry" value="${escapeAttr(g)}"> ${escapeHtml(g)}</label>
            `).join('')}
          </div>
        </div>
        <label>업력(년)<input type="number" step="0.1" name="businessAgeYears"></label>
        <label>기업 규모<input type="text" name="companySize" placeholder="소기업/소상공인/중기업 등"></label>
      </div>
      <div class="wizard-step" data-step="1">
        <label>매출액(원)<input type="number" name="revenueAmount"></label>
        <label>직원 수<input type="number" name="employeeCount"></label>
        <div class="field-verify-row">
          <button type="button" id="employee-count-verify-btn" class="field-verify-btn">4대보험 가입자명부로 확인</button>
          <span id="employee-count-confidence-badge"></span>
        </div>
        <input type="file" id="employee-count-file-input" accept=".pdf,.jpg,.jpeg,.png" style="display:none">
        <div id="employee-count-confirm-slot"></div>
        <label>최근 3년 최대 실적(원)<input type="number" name="maxPerformanceAmount"></label>
        <label>신용등급<input type="text" name="creditRating"></label>
      </div>
      <div class="wizard-step" data-step="2">
        <label>보유 면허 (쉼표로 구분)<input type="text" name="licenses"></label>
        <label>보유 인증 (쉼표로 구분)<input type="text" name="certifications"></label>
        <label class="checkbox-label"><input type="checkbox" name="directProductionCert"> ${glossaryHtml('직접생산확인', '직접생산확인증명 보유')}</label>
        <div id="profile-error" class="error" style="display:none"></div>
        <div id="profile-success" class="success" style="display:none"></div>
      </div>
      <div class="wizard-nav">
        <button type="button" class="btn btn-secondary" id="wizard-prev">이전</button>
        <button type="button" class="btn btn-primary" id="wizard-next">다음</button>
        <button type="submit" class="btn btn-primary" id="wizard-submit" style="display:none">저장</button>
      </div>
    </form>
  `;
  openModal('기업 프로필 수정', bodyHtml);

  const form = document.getElementById('profile-form');
  fillProfileForm(form, currentProfile);
  renderEmployeeCountBadge();

  let wizardStep = 0;
  const steps = Array.from(form.querySelectorAll('.wizard-step'));
  const indicatorEl = document.getElementById('wizard-step-indicator');
  const prevBtn = document.getElementById('wizard-prev');
  const nextBtn = document.getElementById('wizard-next');
  const submitBtn = document.getElementById('wizard-submit');

  function updateWizardStep() {
    steps.forEach((el, i) => { el.style.display = i === wizardStep ? '' : 'none'; });
    indicatorEl.innerHTML = stepIndicatorHtml(wizardStep, steps.length, stepLabels[wizardStep]);
    prevBtn.style.display = wizardStep === 0 ? 'none' : '';
    nextBtn.style.display = wizardStep === steps.length - 1 ? 'none' : '';
    submitBtn.style.display = wizardStep === steps.length - 1 ? '' : 'none';
  }
  prevBtn.addEventListener('click', () => { wizardStep -= 1; updateWizardStep(); });
  nextBtn.addEventListener('click', () => { wizardStep += 1; updateWizardStep(); });
  updateWizardStep();

  const employeeCountFileInput = document.getElementById('employee-count-file-input');
  const employeeCountConfirmSlot = document.getElementById('employee-count-confirm-slot');
  document.getElementById('employee-count-verify-btn').addEventListener('click', () => employeeCountFileInput.click());
  employeeCountFileInput.addEventListener('change', async () => {
    const file = employeeCountFileInput.files[0];
    employeeCountFileInput.value = '';
    if (!file) return;
    employeeCountConfirmSlot.innerHTML = '';
    employeeCountConfirmSlot.appendChild(h('<div class="loading">문서를 분석하는 중...</div>'));
    let uploadData;
    try {
      uploadData = await uploadCompanyRecordDocument('/api/me/company-profile/employee-verification/documents', file);
    } catch (err) {
      employeeCountConfirmSlot.innerHTML = '';
      employeeCountConfirmSlot.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
      return;
    }
    renderEmployeeCountConfirmForm(employeeCountConfirmSlot, uploadData.candidate, uploadData.documentId, form);
  });

  const errorBox = document.getElementById('profile-error');
  const successBox = document.getElementById('profile-success');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    successBox.style.display = 'none';
    const fd = new FormData(form);
    const toNum = (v) => (v === '' || v === null ? null : Number(v));
    const toList = (v) => (v || '').split(',').map(s => s.trim()).filter(Boolean);
    const payload = {
      businessType: toList(fd.get('businessType')),
      region: fd.get('region') || null,
      industry: fd.getAll('industry'),
      businessAgeYears: toNum(fd.get('businessAgeYears')),
      revenueAmount: toNum(fd.get('revenueAmount')),
      employeeCount: toNum(fd.get('employeeCount')),
      companySize: fd.get('companySize') || null,
      licenses: toList(fd.get('licenses')),
      certifications: toList(fd.get('certifications')),
      directProductionCert: fd.get('directProductionCert') === 'on',
      maxPerformanceAmount: toNum(fd.get('maxPerformanceAmount')),
      creditRating: fd.get('creditRating') || null,
    };
    try {
      const data = await apiRequest('PUT', '/api/me/company-profile', payload);
      currentProfile = data.companyProfile;
      closeModal();
      renderProfileSummaryCard(summaryContainer);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// renderEmployeeCountBadge — currentProfile.employeeCountConfidence가 있을
// 때만(4대보험 가입자명부로 확인한 적 있음) confidenceBadgeHtml(면허·인증
// 때 만든 A~D 배지 재사용)을 보여준다.
function renderEmployeeCountBadge() {
  const badge = document.getElementById('employee-count-confidence-badge');
  if (!badge) return;
  badge.innerHTML = currentProfile && currentProfile.employeeCountConfidence
    ? confidenceBadgeHtml(currentProfile.employeeCountConfidence)
    : '';
}

// renderEmployeeCountConfirmForm — 4대보험 가입자명부에서 AI가 읽은 총
// 가입자 수 하나만 확인하는 최소 폼. 확인 즉시 저장되고(별도 "직원 수"
// 저장 버튼을 또 누를 필요 없음) 기본정보 폼의 employeeCount 입력값도
// 함께 갱신한다 — 개인명단은 애초에 응답에 없다(백엔드가 추출 안 함).
function renderEmployeeCountConfirmForm(slot, candidate, documentId, profileForm) {
  const c = candidate || {};
  slot.innerHTML = '';
  slot.appendChild(h(`
    <div class="license-confirm-form">
      <h4>AI가 읽은 총 가입자 수를 확인해주세요</h4>
      <form id="employee-count-confirm-form" class="profile-form">
        <label>총 가입자 수<input type="text" name="totalSubscriberCount" value="${escapeAttr(c.totalSubscriberCount || '')}" required></label>
        <div id="employee-count-confirm-error" class="error" style="display:none"></div>
        <div class="license-toolbar">
          <button type="submit">확인 및 저장</button>
          <button type="button" id="employee-count-confirm-cancel" class="secondary">취소</button>
        </div>
      </form>
    </div>
  `));

  const form = document.getElementById('employee-count-confirm-form');
  const errorBox = document.getElementById('employee-count-confirm-error');
  document.getElementById('employee-count-confirm-cancel').addEventListener('click', () => { slot.innerHTML = ''; });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    const payload = {
      totalSubscriberCount: fd.get('totalSubscriberCount'),
      sourceDocumentId: documentId || null,
    };
    try {
      const data = await apiRequest('POST', '/api/me/company-profile/employee-verification', payload);
      currentProfile.employeeCountConfidence = data.confidence;
      currentProfile.employeeCountVerifiedAt = new Date().toISOString();
      const employeeCountInput = profileForm.querySelector('input[name="employeeCount"]');

// uploadCompanyRecordDocument는 면허·인증 업로드와 같은 raw fetch(멀티파트라
// apiRequest의 JSON 강제 인코딩을 못 씀) 패턴을 재무/실적/인력 3곳이 공유한다.
async function uploadCompanyRecordDocument(uploadPath, file) {
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch(uploadPath, { method: 'POST', body: fd });
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const code = data && data.error;
    const err = new Error((code && ERROR_MESSAGES[code]) || ('요청 실패 (' + res.status + ')'));
    err.status = res.status;
    throw err;
  }
  return data;
}

// plainSelectHtml — 값 목록 하나로 <select>를 만드는 공용 헬퍼(증빙서류
// 종류처럼 "선택 안 함" + 고정 값 목록만 있으면 되는 경우). withEmpty가
// true면 맨 앞에 빈 옵션을 추가한다(값 목록 자체엔 넣지 않아도 됨).
function plainSelectHtml(name, options, selected, withEmpty) {
  const opts = withEmpty ? ['', ...options] : options;
  return `<select name="${name}">${opts.map(v =>
    `<option value="${escapeAttr(v)}" ${v === (selected || '') ? 'selected' : ''}>${escapeHtml(v || '선택 안 함')}</option>`
  ).join('')}</select>`;
}

// ---------- 담당자 관리 ----------
// 참여 검토(파이프라인 생성) 시 assignee_name/email/phone을 자동으로
// 채우는 데 쓰이는 기본 담당자를 여기서 지정한다. member는 읽기 전용으로
// 본다(disableOwnerOnlyButtons가 추가/수정/삭제/기본지정 버튼을 막는다).
async function renderContactsTab(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/me/contacts');
  } catch (err) {
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }
  const items = data.items || [];

  container.innerHTML = '';
  container.appendChild(h(`
    <p class="license-card-meta">여기 등록해두면 "참여 검토" 시 담당자 정보가 자동으로 채워집니다. 기본 담당자 1명을 지정할 수 있습니다.</p>
    <div class="license-toolbar">
      <button type="button" id="contact-add-btn" class="btn btn-secondary btn-sm">담당자 추가</button>
    </div>
    <div id="contact-form-slot"></div>
    <div class="license-list" id="contact-list"></div>
  `));

  const listEl = document.getElementById('contact-list');
  if (!items.length) {
    listEl.appendChild(h('<p class="empty">아직 등록한 담당자가 없습니다. 등록해두면 참여 검토 시 자동으로 채워집니다.</p>'));
  } else {
    items.forEach(item => listEl.appendChild(h(contactCardHtml(item))));
  }

  const formSlot = document.getElementById('contact-form-slot');
  document.getElementById('contact-add-btn').addEventListener('click', () => {
    renderContactForm(formSlot, null, () => renderContactsTab(container));
  });

  listEl.querySelectorAll('.contact-edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = items.find(i => i.id === btn.dataset.id);
      renderContactForm(formSlot, item, () => renderContactsTab(container));
    });
  });
  listEl.querySelectorAll('.contact-delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('이 담당자를 삭제하시겠습니까?')) return;
      try {
        await apiRequest('DELETE', '/api/me/contacts/' + encodeURIComponent(btn.dataset.id));
        renderContactsTab(container);
      } catch (err) {
        alert(err.message);
      }
    });
  });
  listEl.querySelectorAll('.contact-set-default-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const item = items.find(i => i.id === btn.dataset.id);
      if (!item) return;
      try {
        await apiRequest('PATCH', '/api/me/contacts/' + encodeURIComponent(item.id), {
          name: item.name, email: item.email, phone: item.phone, isDefault: true,
        });
        renderContactsTab(container);
      } catch (err) {
        alert(err.message);
      }
    });
  });
  disableOwnerOnlyButtons(container);
}

const CONFIDENCE_LABELS = { A: 'A · 공식확인', B: 'B · 서류검증', C: 'C · 직접입력', D: 'D · AI추출' };

function confidenceBadgeHtml(confidence) {
  const label = CONFIDENCE_LABELS[confidence] || confidence;
  return `<span class="confidence-badge confidence-badge--${escapeAttr((confidence || '').toLowerCase())}">${escapeHtml(label)}</span>`;
}

function licenseCardHtml(item) {
  const metaParts = [];

  if (item.issuingAuthority) metaParts.push(escapeHtml(item.issuingAuthority));

      </div>

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!file) return;

    formSlot.innerHTML = '';
    formSlot.appendChild(h('<div class="loading">문서를 분석하는 중...</div>'));

    const fd = new FormData();
    fd.append('file', file);

    try {
      const res = await fetch('/api/me/company-profile/documents', { method: 'POST', body: fd });
      data = await res.json().catch(() => null);
      if (!res.ok) {
        const code = data && data.error;
        const err = new Error((code && ERROR_MESSAGES[code]) || ('요청 실패 (' + res.status + ')'));

  document.getElementById('ip-upload-btn').addEventListener('click', () => ipFileInput.click());

  ipFileInput.addEventListener('change', async () => {

    ipFormSlot.innerHTML = '';
    ipFormSlot.appendChild(h('<div class="loading">문서를 분석하는 중...</div>'));

      return;
    }
    ipFormSlot.innerHTML = '';
    renderIPConfirmForm(ipFormSlot, uploadData.candidate, uploadData.documentId, () => renderLicenses(container));
  });
  disableOwnerOnlyButtons(container);
}

    const payload = {
      category: fd.get('category'),
      name: fd.get('name'),
      registrationNumber: fd.get('registrationNumber') || null,
      issuingAuthority: fd.get('issuingAuthority') || null,
      issuedAt: fd.get('issuedAt') || null,
      expiresAt: fd.get('expiresAt') || null,
      applicableIndustry: fd.get('applicableIndustry') || null,
      status: fd.get('status'),
      sourceDocumentId: documentId || null,
    };
    const endpoint = target === 'certification' ? '/api/me/certifications' : '/api/me/licenses';
    try {
      await apiRequest('POST', endpoint, payload);
      formSlot.innerHTML = '';
      onSaved();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

function renderReviewList(listEl, items) {
  listEl.innerHTML = '';
  if (!items.length) {
    listEl.appendChild(h('<p class="empty">검토 대기 항목이 없습니다.</p>'));
    return;
  }
  const rows = items.map(it => `
    <div class="review-item" data-id="${escapeAttr(it.id)}" data-type="${escapeAttr(it.type)}">
      <div class="review-item-head">
        <span class="review-type-badge">${escapeHtml(REVIEW_TYPE_LABELS[it.type] || it.type)}</span>
        <a class="review-notice-link" href="#/notices/${escapeAttr(it.noticeId)}" target="_blank" rel="noopener">${escapeHtml(it.noticeTitle)} &rarr;</a>
      </div>
      <p class="condition-name">${escapeHtml(it.conditionName || it.documentName || '')}</p>
      <blockquote class="source-quote">${escapeHtml(it.sourceText || '(원문 없음)')}</blockquote>
      <div class="review-actions">
        <button type="button" class="review-btn review-btn--confirm" data-action="confirm">승인</button>
        <button type="button" class="review-btn review-btn--reject" data-action="reject">반려</button>
      </div>
    </div>
  `).join('');
  listEl.appendChild(h(rows));

  listEl.querySelectorAll('.review-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const card = btn.closest('.review-item');
      const id = card.dataset.id;
      const type = card.dataset.type;
      const action = btn.dataset.action;
      const endpoint = type === 'eligibility_condition'
        ? '/api/review/eligibility-conditions/' + encodeURIComponent(id)
        : '/api/review/required-documents/' + encodeURIComponent(id);

      card.querySelectorAll('.review-btn').forEach(b => b.disabled = true);
      try {
        await apiRequest('POST', endpoint, { action });
        card.remove();
        const countEl = document.getElementById('review-count');
        const remaining = listEl.querySelectorAll('.review-item').length;
        if (countEl) countEl.textContent = remaining + '건';
        if (remaining === 0) {
          listEl.appendChild(h('<p class="empty">검토 대기 항목이 없습니다.</p>'));
        }
      } catch (err) {
        card.querySelectorAll('.review-btn').forEach(b => b.disabled = false);
        let errEl = card.querySelector('.review-item-error');
        if (!errEl) {
          errEl = document.createElement('p');
          errEl.className = 'review-item-error';
          card.appendChild(errEl);
        }
        errEl.textContent = err.message;
      }
    });
  });
}

const PLAN_STATUS_LABELS = { active: '이용 중', pending: '결제 대기', cancelled: '해지됨', expired: '만료됨' };
const PLAN_STATUS_BADGE_TONE = { active: 'badge--success', pending: 'badge--warn', cancelled: 'badge--gray', expired: 'badge--gray' };
// 백엔드(GET /api/billing/config)는 가격/한도 숫자만 주고, 마케팅 문구
// (기획서 기준 기능 bullet)는 여기서 따로 관리한다.
const PLAN_FEATURES = {
  free: ['파이프라인 3건', 'AI 정밀분석 없음'],
  basic: ['파이프라인 무제한', 'AI 분석 월 5건'],
  pro: ['AI 분석 월 20건', '실적매칭 가능'],

};

async function renderPricingPlans(container) {

  try {
    config = await apiRequest('GET', '/api/billing/config');
  } catch (err) {
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  let currentPlan = null;
  if (currentUser) {
    try {
      const sub = await apiRequest('GET', '/api/me/subscription');
      // status가 active일 때만 "현재 플랜"으로 표시 — pending(체크아웃만
      // 하고 결제 미완료)인 동안 badge를 보여주면 마치 이미 구독 중인
      // 것처럼 착각하게 된다.
      if (sub.status === 'active') currentPlan = sub.plan;

    const isCurrent = currentPlan === p.plan;
    const features = (PLAN_FEATURES[p.plan] || []).map(f => `<li>${escapeHtml(f)}</li>`).join('');

      actionHtml = currentUser ? '' : '<a href="#/auth/signup" class="home-cta-secondary">무료로 시작하기</a>';
    } else {
      actionHtml = `<button type="button" class="plan-subscribe-btn" data-plan="${escapeAttr(p.plan)}">구독하기</button>`;
    }

      <div class="plan-card${isCurrent ? ' plan-card--current' : ''}">
        <h3 class="plan-card-name">${escapeHtml(p.name)}</h3>
        <p class="plan-card-price">${p.amount > 0 ? formatBudget(p.amount) + '/월' : '무료'}</p>
        <ul class="plan-card-features">${features}</ul>
        ${actionHtml}
      </div>

  }).join('');

  container.innerHTML = '';
  container.appendChild(h(`<h2>요금제</h2><div class="plan-grid">${cards}</div>`));

  container.querySelectorAll('.plan-subscribe-btn').forEach(btn => {

      location.hash = '#/billing/checkout?plan=' + encodeURIComponent(btn.dataset.plan);
    });

}

async function renderBillingCheckout(container) {
  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  const plan = params.get('plan');

  if (!currentUser) { location.hash = '#/auth/login'; return; }
  if (!['basic', 'pro', 'business'].includes(plan)) {
    container.innerHTML = '';
    container.appendChild(h('<p class="error">잘못된 요금제입니다. <a href="#/billing/plans">요금제로 돌아가기</a></p>'));
    return;
  }

  container.innerHTML = '';
  container.appendChild(h('<div class="loading">결제 준비 중...</div>'));

  let config, checkout;
  try {
    config = await apiRequest('GET', '/api/billing/config');
    checkout = await apiRequest('POST', '/api/billing/checkout', { plan });
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  if (!config.tossClientKey) {
    container.innerHTML = '';
    container.appendChild(h('<p class="error">결제 기능은 테스트 키 발급 후 이용 가능합니다.</p>'));
    return;
  }

  container.innerHTML = '';
  container.appendChild(h(`
    <a href="#/billing/plans" class="back-link">&larr; 요금제로 돌아가기</a>
    <div class="detail-card">
      <p class="detail-eyebrow">${escapeHtml(checkout.orderName)}</p>
      <h2>${formatBudget(checkout.amount)} / 월</h2>
      <div id="checkout-error" class="error" style="display:none"></div>
      <button type="button" id="checkout-pay-btn" class="home-cta-primary">결제하기</button>
    </div>
  `));

  const errorBox = document.getElementById('checkout-error');
  const payBtn = document.getElementById('checkout-pay-btn');
  // API 개별 연동(결제창) — 결제위젯 연동 키가 나오기 전까지는 이 방식을
  // 쓴다. tossPayments 자체엔 requestPayment가 없고, .payment({customerKey})가
  // 반환하는 객체에 있다(공식 샘플: tosspayments/tosspayments-sample,
  // go-react/frontend/src/pages/payment/PaymentCheckout.jsx 확인).
  // customerKey는 이메일처럼 유추 가능한 값이면 안 되므로 불투명 UUID(회사
  // 프로필 id)를 쓴다 — checkout 응답에 이미 포함되어 있음.
  const tossPayments = TossPayments(config.tossClientKey);
  const payment = tossPayments.payment({ customerKey: checkout.customerKey });

  payBtn.addEventListener('click', async () => {
    errorBox.style.display = 'none';
    payBtn.disabled = true;
    try {
      // 승인 절차(서버가 paymentKey/orderId/amount로 confirm 호출)는 위젯
      // 방식과 완전히 동일 — POST /v1/payments/confirm 하나뿐이라 백엔드는
      // 그대로 재사용.
      //
      // 토스가 successUrl/failUrl에 쿼리를 붙일 때 이미 우리 URL에 '#'이
      // 있으면(해시 라우팅) 그 쿼리는 location.search가 아니라
      // location.hash 뒤에 붙는다 — renderBillingSuccess/Fail이 그렇게
      // 파싱한다(route()의 hash.split('?') 관례와 동일).
      await payment.requestPayment({
        method: 'CARD',
        amount: { currency: 'KRW', value: checkout.amount },
        orderId: checkout.orderId,
        orderName: checkout.orderName,
        customerName: currentUser.email,
        customerEmail: currentUser.email,
        successUrl: location.origin + location.pathname + '#/billing/success',
        failUrl: location.origin + location.pathname + '#/billing/fail',
        card: { useEscrow: false, flowMode: 'DEFAULT', useCardPoint: false, useAppCardOnly: false },
      });
    } catch (err) {
      payBtn.disabled = false;
      errorBox.textContent = err.message || '결제 요청 중 오류가 발생했습니다.';
      errorBox.style.display = 'block';
    }
  });
}

// parseRedirectParams — 토스 결제창 successUrl/failUrl 리다이렉트 파라미터를
// 읽는다. 실제로 어디에 붙어 돌아오는지 구현체마다 다를 수 있어(URL 스펙대로
// '#' 앞 쿼리스트링(location.search)에 넣을 수도, 우리 URL에 이미 '#'이 있어
// 그 뒤에 이어붙일 수도 있음 — 실사용에서 전자로 확인됨) 둘 다 확인한다.
// location.search를 우선하고, hash 뒤에 붙은 값으로 못 찾은 키만 보충한다.
function parseRedirectParams() {
  const params = new URLSearchParams(location.search);
  const hashQuery = location.hash.split('?')[1];
  if (hashQuery) {
    new URLSearchParams(hashQuery).forEach((v, k) => {
      if (!params.has(k)) params.set(k, v);
    });
  }
  return params;
}

async function renderBillingSuccess(container) {
  const params = parseRedirectParams();
  const paymentKey = params.get('paymentKey');
  const orderId = params.get('orderId');
  const amount = params.get('amount');

  container.innerHTML = '';
  if (!paymentKey || !orderId || !amount) {
    container.appendChild(h('<p class="error">결제 정보가 올바르지 않습니다. <a href="#/billing/plans">요금제로 돌아가기</a></p>'));
    return;
  }
  container.appendChild(h('<div class="loading">결제 승인 처리 중...</div>'));

  try {
    const result = await apiRequest('POST', '/api/billing/confirm', { paymentKey, orderId, amount: Number(amount) });
    container.innerHTML = '';
    if (result.scheduled) {
      // 다운그레이드는 즉시 적용되지 않는다 — 결제는 완료됐지만 지금
      // 이용 중인 상위 플랜 혜택을 현재 만료일까지 그대로 유지하고,
      // 그 이후 새 플랜으로 자동 전환된다.
      container.appendChild(h(`
        <div class="detail-card" style="text-align:center">
          <p class="detail-eyebrow">결제 완료 (예약됨)</p>
          <h2>${escapeHtml(PLAN_DISPLAY_NAMES[result.pendingPlan] || result.pendingPlan)} 플랜으로 전환 예약되었습니다</h2>
          <p class="ai-participation-subtitle">
            현재 이용 중인 ${escapeHtml(PLAN_DISPLAY_NAMES[result.currentPlan] || result.currentPlan)} 플랜 혜택은
            ${result.effectiveAt ? escapeHtml(formatDateTime(result.effectiveAt)) : '만료일'}까지 그대로 유지되고,
            그 이후 자동으로 전환됩니다.
          </p>
          <a href="#/me/subscription" class="home-cta-primary">내 구독 확인하기</a>
        </div>
      `));
      return;
    }
    container.appendChild(h(`
      <div class="detail-card" style="text-align:center">
        <p class="detail-eyebrow">결제 완료</p>
        <h2>${escapeHtml(PLAN_DISPLAY_NAMES[result.plan] || result.plan)} 플랜 구독이 시작되었습니다</h2>
        <p class="ai-participation-subtitle">다음 결제 예정일: ${escapeHtml(formatDateTime(result.expiresAt))}</p>
        <a href="#/me/subscription" class="home-cta-primary">내 구독 확인하기</a>
      </div>
    `));
  } catch (err) {
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">결제 승인에 실패했습니다: ${escapeHtml(err.message)}</p><a href="#/billing/plans">요금제로 돌아가기</a>`));
  }
}

async function renderMySubscription(container) {

  try {

    }

  }

  const statusLabel = PLAN_STATUS_LABELS[data.status] || data.status;
  const planName = PLAN_DISPLAY_NAMES[data.plan] || data.plan;
  // status가 active가 아니면(결제 대기/해지/만료) 아래 한도는 이미 Free
  // 기준으로 내려온다(백엔드가 effective plan으로 계산) — 그런데 heading엔
  // 여전히 선택했던(또는 예전) plan 이름이 나오므로, 착각하지 않도록
  // 상태별로 정확한 안내를 붙인다("결제 대기"와 "만료"는 원인이 다르므로

    pending: '아직 결제가 완료되지 않아',
    expired: '구독 기간이 만료되어',
    cancelled: '구독이 해지되어',
  }[data.status];
  const notActiveNote = notActiveReason
    ? `<p class="ai-minimal-profile-notice">${escapeHtml(notActiveReason)} 적용되지 않았습니다 — 아래 한도는 현재 실제로 적용 중인 Free 기준입니다.</p>`
    : '';
  // 예약된 다운그레이드 — 즉시 업그레이드/예약 다운그레이드 정책. 결제는
  // 이미 완료됐지만 지금 플랜 혜택은 만료일까지 유지되고 그 이후 자동 전환.
  const pendingDowngradeNote = data.pendingPlan ? `
    <div class="ai-minimal-profile-notice">
      <p>${escapeHtml(data.pendingPlanName || data.pendingPlan)} 플랜으로 전환이 예약되어 있습니다
        (${data.expiresAt ? escapeHtml(formatDateTime(data.expiresAt)) : '만료일'}부터 적용).
        그 전까지는 현재 ${escapeHtml(planName)} 플랜 혜택을 그대로 이용할 수 있습니다.</p>

    </div>
  ` : '';

  container.innerHTML = '';
  container.appendChild(h(`
    <h2>내 구독</h2>
    <div class="detail-card">
      <span class="badge ${PLAN_STATUS_BADGE_TONE[data.status] || 'badge--gray'}">${escapeHtml(statusLabel)}</span>
      <h2>${escapeHtml(planName)} 플랜</h2>
      ${notActiveNote}
      ${pendingDowngradeNote}
      <dl class="detail-meta">
        <div><dt>시작일</dt><dd>${data.startedAt ? escapeHtml(formatDateTime(data.startedAt)) : '-'}</dd></div>

        <div><dt>파이프라인 한도</dt><dd>${data.maxPipelineEntries < 0 ? '무제한' : data.maxPipelineEntries + '건'}</dd></div>

      </dl>
      <a href="#/billing/plans" class="home-cta-secondary" style="margin-top:1rem;display:inline-block">요금제 변경</a>
    </div>
    <div class="detail-card" id="team-section"></div>
    <div class="detail-card" id="payment-history-section"></div>
    <div class="detail-card" id="reports-section"></div>
  `));

  const cancelDowngradeBtn = document.getElementById('cancel-downgrade-btn');
  if (cancelDowngradeBtn) {
    cancelDowngradeBtn.addEventListener('click', async () => {
      if (!confirm('예약된 플랜 전환을 취소하시겠습니까?')) return;
      try {
        await apiRequest('POST', '/api/billing/cancel-downgrade', {});
        renderMySubscription(container);
      } catch (err) {
        alert(err.message);
      }
    });
  }

  // effectivePlanFromRow와 같은 판단: status가 active이고 plan이 business일
  // 때만 팀 3명 — 그 외(pending/expired/cancelled 또는 다른 플랜)는 본인 1명뿐.
  const isEffectiveBusiness = data.plan === 'business' && data.status === 'active';
  renderTeamSection(document.getElementById('team-section'), isEffectiveBusiness ? 3 : 1);
  renderPaymentHistorySection(document.getElementById('payment-history-section'));
  renderReportsSection(document.getElementById('reports-section'));

// renderPaymentHistorySection — 결제 내역(payment_log) 최신순 목록. 팀
// 관리/리포트와 같은 이유로 구독 관리 화면에 임베드했다.
async function renderPaymentHistorySection(container) {
  container.innerHTML = '<div class="loading">불러오는 중...</div>';
  let data;
  try {
    data = await apiRequest('GET', '/api/me/payment-history');
  } catch (err) {
    container.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
    return;
  }
  const items = data.items || [];
  if (!items.length) {
    container.innerHTML = '<h3>결제 내역</h3><p class="empty">아직 결제 이력이 없습니다.</p>';
    return;
  }
  const rows = items.map(it => {
    const statusTone = it.status === '승인' ? 'badge--success' : (it.status === '취소' ? 'badge--gray' : 'badge--danger');
    return `
      <div class="license-card">
        <div class="license-card-main">
          <div class="license-card-name">${escapeHtml(it.planName || it.plan || '-')} <span class="badge ${statusTone}">${escapeHtml(it.status)}</span></div>
          <div class="license-card-meta">${escapeHtml(formatDateTime(it.requestedAt))} · <span class="mono">${formatBudget(it.amount)}</span></div>
        </div>
      </div>
    `;
  }).join('');
  container.innerHTML = `<h3>결제 내역</h3><div class="license-list">${rows}</div>`;
}

// renderReportsSection — 주간/월간 자동 리포트 목록. renderTeamSection과
// 같은 이유로 새 최상위 메뉴 대신 구독 관리 화면에 임베드했다(사이드바/
// 탭바 5개 고정 제약 유지).
async function renderReportsSection(container) {
  container.innerHTML = '<div class="loading">불러오는 중...</div>';
  let data;
  try {
    data = await apiRequest('GET', '/api/reports');
  } catch (err) {
    container.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
    return;
  }
  const items = data.items || [];
  if (!items.length) {
    container.innerHTML = '<h3>리포트</h3><p class="empty">아직 생성된 리포트가 없습니다(매주 월요일/매월 1일 09:00에 자동 생성됩니다).</p>';
    return;
  }
  container.innerHTML = `<h3>리포트</h3><div class="license-list">${items.map(reportCardHtml).join('')}</div>`;
}

function reportCardHtml(item) {
  const label = item.periodType === 'monthly' ? '월간' : '주간';
  const s = item.summary;
  const teamHtml = (s.teamActivity || []).length
    ? `<div class="license-card-meta">${s.teamActivity.map(t => `${escapeHtml(t.assigneeName)} ${t.processedCount}건`).join(' · ')}</div>`
    : '';
  return `
    <div class="license-card">
      <div class="license-card-main">
        <div class="license-card-name">${label} 리포트 · ${escapeHtml(item.periodStart)} ~ ${escapeHtml(item.periodEnd)}</div>
        <div class="license-card-meta">
          신규추천 ${s.newRecommendedCount}건 · 참여검토시작 ${s.pipelineStartedCount}건 · 제출완료 ${s.pipelineCompletedCount}건 ·
          종료 ${s.pipelineClosedCount}건 · 마감임박 ${s.deadlineSoonCount}건 · 마감경과 ${s.deadlinePassedCount}건 · AI분석 ${s.aiAnalysisUsedCount}건
        </div>
        ${teamHtml}
      </div>
    </div>
  `;
}

// ---------- 성장분석(#/growth) ----------
// 완성도·파이프라인 성과 추이는 새 스냅샷 없이 reports 테이블(주간/월간
// 배치가 이미 채움)을 그대로 시간순으로 보여준다 — 리포트 기능 이전에
// 가입한 회사는 리포트가 쌓이기 전까지 이 표가 비어 있을 수 있다(정상,
// 배치가 돌면서 자연히 채워짐).
async function renderGrowthAnalytics(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/growth-analytics');
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    if (err.status === 400) {
      container.appendChild(h('<p class="empty">기업 프로필을 먼저 등록해주세요. <a href="#/me/profile">프로필 등록하기</a></p>'));
      return;
    }
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  const trendRows = (data.trend || []).map(t => `
    <tr>
      <td>${escapeHtml(t.periodType === 'monthly' ? '월간' : '주간')} ${escapeHtml(t.periodStart)}</td>
      <td>${t.profileCompletenessScore}%</td>
      <td>${t.pipelineStartedCount}</td>
      <td>${t.pipelineCompletedCount}</td>
      <td>${t.pipelineClosedCount}</td>
    </tr>
  `).join('');
  const trendHtml = (data.trend || []).length ? `
    <div class="detail-card">
      <h3>완성도·파이프라인 성과 추이</h3>
      <p class="license-card-meta">매주 월요일/매월 1일 생성되는 리포트를 시간순으로 모은 값입니다.</p>
      <div style="overflow-x:auto">
        <table class="growth-trend-table">
          <thead><tr><th>기간</th><th>프로필 완성도</th><th>참여검토 시작</th><th>제출완료</th><th>종료</th></tr></thead>
          <tbody>${trendRows}</tbody>
        </table>
      </div>
    </div>
  ` : `
    <div class="detail-card">
      <h3>완성도·파이프라인 성과 추이</h3>
      <p class="empty">아직 쌓인 리포트가 없습니다. 매주 월요일/매월 1일 자동 생성되면 여기 표시됩니다.</p>
    </div>
  `;

  const maxGradeCount = Math.max(1, ...(data.gradeDistribution || []).map(g => g.count));
  const gradeRows = (data.gradeDistribution || []).map(g => `
    <div class="growth-bar-row">
      <span class="growth-bar-label">${escapeHtml(GRADE_LABELS[g.grade] || g.grade)}</span>
      <span class="growth-bar-track"><span class="growth-bar-fill" style="width:${(g.count / maxGradeCount * 100).toFixed(0)}%"></span></span>
      <span class="growth-bar-value">${g.count}건</span>
    </div>
  `).join('');

  const roi = data.roi || {};
  const ratioLabel = roi.ratio != null ? (roi.ratio * 100).toFixed(0) + '%' : '계산 불가';

  container.innerHTML = '';
  container.appendChild(h(`
    <h2>성장분석</h2>
    ${trendHtml}
    <div class="detail-card">
      <h3>AI 참여판정 등급 분포</h3>
      <p class="license-card-meta">현재 열려있는 공고 전체를 지금 기준으로 다시 채점한 결과입니다(실시간 스냅샷).</p>
      ${gradeRows || '<p class="empty">채점할 공고가 없습니다.</p>'}
    </div>
    <div class="detail-card">
      <h3>ROI (낙찰금액 대비 비용)</h3>
      <p class="license-card-meta">낙찰 시 직접 입력한 금액과 실제 결제한 구독료를 비교합니다. 공고 예산액이 아니라 실제 계약금액 기준입니다.</p>
      <div class="growth-roi-grid">
        <div class="growth-roi-tile">
          <div class="growth-roi-tile-value mono">${formatBudget(roi.totalAwardedAmount)}</div>
          <div class="growth-roi-tile-label">총 낙찰금액 (${roi.awardedCount || 0}건)</div>
        </div>
        <div class="growth-roi-tile">
          <div class="growth-roi-tile-value mono">${formatBudget(roi.totalPaidAmount)}</div>
          <div class="growth-roi-tile-label">총 결제금액</div>
        </div>
        <div class="growth-roi-tile">
          <div class="growth-roi-tile-value mono">${escapeHtml(ratioLabel)}</div>
          <div class="growth-roi-tile-label">낙찰금액 / 결제금액</div>
        </div>
      </div>
      ${roi.awardedCount === 0 ? '<p class="license-card-meta">낙찰 건에 금액을 입력하지 않으면 계산되지 않습니다 — 진행 중 사업 상세에서 상태를 "낙찰"로 바꿀 때 낙찰 금액을 입력해주세요.</p>' : ''}
    </div>
  `));
}

// ---------- 관리자(#/admin) — users.role='system_admin' 전용 ----------
// 접근 자체는 백엔드(requireSystemAdmin)가 403으로 막지만, 프론트에서도
// 403/401을 명확한 안내로 보여준다(로그인 화면으로 튕기거나 "권한 없음"
// 문구) — system_admin이 아닌 사용자가 URL을 직접 쳐서 들어와도 빈
// 화면이나 계속 도는 로딩바 대신 이유를 알 수 있게.
async function renderAdminDashboard(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/admin/dashboard');
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    if (err.status === 403) {
      container.appendChild(h('<p class="error">관리자 권한이 필요합니다.</p>'));
      return;
    }
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  const tiles = [
    { label: '전체 회원', value: data.totalMembers + '명' },
    { label: '이번달 신규가입', value: data.newMembersThisMonth + '명' },
    { label: '이번달 결제 매출', value: formatBudget(data.revenueThisMonthKRW) },
    { label: '이번달 AI 분석 사용', value: data.aiAnalysisThisMonth + '건' },
  ];
  const tilesHtml = tiles.map(t => `
    <div class="dash-tile">
      <div class="dash-tile-count">${escapeHtml(t.value)}</div>
      <div class="dash-tile-label">${escapeHtml(t.label)}</div>
    </div>
  `).join('');

  const planOrder = ['free', 'basic', 'pro', 'business'];
  const dist = data.planDistribution || {};
  const maxPlanCount = Math.max(1, ...planOrder.map(p => dist[p] || 0));
  const planBars = planOrder.map(p => `
    <div class="growth-bar-row">
      <span class="growth-bar-label">${escapeHtml(PLAN_DISPLAY_NAMES[p] || p)}</span>
      <span class="growth-bar-track"><span class="growth-bar-fill" style="width:${((dist[p] || 0) / maxPlanCount * 100).toFixed(0)}%"></span></span>
      <span class="growth-bar-value">${dist[p] || 0}명</span>
    </div>
  `).join('');

  const paymentRows = (data.recentPayments || []).map(adminPaymentCardHtml).join('');

  container.innerHTML = '';
  container.appendChild(h(`
    <h2>관리자 대시보드</h2>
    <div class="dash-tiles">${tilesHtml}</div>
    <div class="detail-card">
      <h3>플랜별 회원 분포</h3>
      <p class="license-card-meta">계정이 소속된 조직(구독 단위)의 플랜 기준입니다 — 같은 조직 팀원은 모두 같은 플랜으로 집계됩니다.</p>
      ${planBars}
    </div>
    <div class="detail-card">
      <h3>최근 결제 내역 (전체 회원)</h3>
      <p class="license-card-meta">실제 Anthropic API 사용 비용(달러)은 이 화면에 없습니다 — <a href="https://platform.claude.com" target="_blank" rel="noopener">Claude Console(platform.claude.com)</a>에서 확인하세요.</p>
      <div class="license-list">${paymentRows || '<p class="empty">결제 이력이 없습니다.</p>'}</div>
      <a href="#/admin/members" class="official-link">전체 회원 관리 &rarr;</a>
    </div>
    <div class="detail-card">
      <h3>운영 정보</h3>
      <div class="license-toolbar" style="flex-wrap:wrap">
        <a href="#/admin/tech-spec" class="btn btn-secondary btn-sm">기술 스펙</a>
        <a href="#/admin/integrations" class="btn btn-secondary btn-sm">외부 연동/API 현황</a>
      </div>
    </div>
    <div class="detail-card" id="admin-changelog-section"></div>
    <div class="detail-card" id="admin-system-status-section"></div>
  `));

  renderAdminSystemStatus(document.getElementById('admin-system-status-section'));
  renderAdminChangelogSection(document.getElementById('admin-changelog-section'));
}

// renderAdminChangelogSection — collector/CHANGELOG.md를 서버가 이미
// 날짜별 섹션+항목으로 구조화해 내려주므로(admin_meta.go의 parseChangelog),
// 여기서는 마크다운을 다시 파싱하지 않고 그대로 리스트로 그린다.
async function renderAdminChangelogSection(container) {
  container.innerHTML = '<h3>업데이트 로그</h3><div class="loading">불러오는 중...</div>';
  let data;
  try {
    data = await apiRequest('GET', '/api/admin/changelog');
  } catch (err) {
    container.innerHTML = `<h3>업데이트 로그</h3><p class="error">${escapeHtml(err.message)}</p>`;
    return;
  }
  const entries = data.entries || [];
  const entriesHtml = entries.map(e => `
    <div class="changelog-entry">
      <div class="changelog-date">${escapeHtml(e.date)}</div>
      <ul class="changelog-items">
        ${(e.items || []).map(item => `<li>${escapeHtml(item)}</li>`).join('')}
      </ul>
    </div>
  `).join('');
  container.innerHTML = `
    <h3>업데이트 로그</h3>
    <p class="license-card-meta">collector/CHANGELOG.md 기준 — 큰 기능 단위로만 기록합니다.</p>
    ${entriesHtml || '<p class="empty">기록된 업데이트가 없습니다.</p>'}
  `;
}

function adminPaymentCardHtml(p) {
  const statusTone = p.status === '승인' ? 'badge--success' : (p.status === '취소' ? 'badge--gray' : 'badge--danger');
  return `
    <div class="license-card">
      <div class="license-card-main">
        <div class="license-card-name">${escapeHtml(p.email)} · ${escapeHtml(p.planName || p.plan || '-')} <span class="badge ${statusTone}">${escapeHtml(p.status)}</span></div>
        <div class="license-card-meta">${escapeHtml(formatDateTime(p.requestedAt))} · <span class="mono">${formatBudget(p.amount)}</span></div>
      </div>
    </div>
  `;
}

// renderAdminSystemStatus — 기존엔 curl로만 실행 가능했던 관리자 배치
// (알림/파이프라인 자동전환/낙찰이력 수집/예약 다운그레이드 적용)를
// 버튼으로 수동 실행. 전부 매일 09:00 KST에 자동으로도 돈다 — 여기 버튼은
// "지금 바로" 확인하고 싶을 때만 쓰는 보조 수단.
function renderAdminSystemStatus(container) {
  const actions = [
    { path: '/api/admin/run-notifications', label: '이메일/SMS 알림 배치 실행' },
    { path: '/api/admin/run-pipeline-auto-transitions', label: '파이프라인 자동전환 실행' },
    { path: '/api/admin/run-award-history-ingestion', label: '낙찰이력 수집 실행' },
    { path: '/api/admin/run-scheduled-downgrades', label: '예약된 플랜 다운그레이드 적용' },
  ];
  container.innerHTML = `
    <h3>시스템 상태</h3>
    <p class="license-card-meta">매일 09:00 KST에 자동 실행되는 배치를 지금 바로 수동 실행합니다.</p>
    <div class="license-toolbar" style="flex-wrap:wrap">
      ${actions.map(a => `<button type="button" class="btn btn-secondary btn-sm admin-action-btn" data-path="${escapeAttr(a.path)}">${escapeHtml(a.label)}</button>`).join('')}
    </div>
    <div id="admin-action-result"></div>
  `;
  const resultBox = document.getElementById('admin-action-result');
  container.querySelectorAll('.admin-action-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      resultBox.innerHTML = '<div class="loading">실행 중...</div>';
      try {
        const result = await apiRequest('POST', btn.dataset.path, {});
        resultBox.innerHTML = `<p class="success">완료: ${escapeHtml(JSON.stringify(result))}</p>`;
      } catch (err) {
        resultBox.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
      }
      btn.disabled = false;
    });
  });
}

// renderAdminMembers — 전체 회원 목록(검색/필터). 필터 상태를 쿼리
// 파라미터로 hash에 반영해 뒤로가기/새로고침에도 유지되게 한다(공고
// 목록 필터와 같은 관례).
async function renderAdminMembers(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  const qParam = params.get('q') || '';
  const planParam = params.get('plan') || '';

  let data;
  try {
    const query = new URLSearchParams();
    if (qParam) query.set('q', qParam);
    if (planParam) query.set('plan', planParam);
    data = await apiRequest('GET', '/api/admin/members' + (query.toString() ? '?' + query.toString() : ''));
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    if (err.status === 403) {
      container.appendChild(h('<p class="error">관리자 권한이 필요합니다.</p>'));
      return;
    }
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  const items = data.items || [];
  const rows = items.map(m => `
    <div class="row-card admin-member-row" data-id="${escapeAttr(m.id)}">
      <div class="row-card-main">
        <div class="row-card-title">${escapeHtml(m.email)}</div>
        <div class="row-card-subtitle">${escapeHtml(m.planName)} · 가입 ${escapeHtml(formatDate(m.createdAt))} · 마지막 로그인 ${m.lastLoginAt ? escapeHtml(formatDateTime(m.lastLoginAt)) : '기록 없음'}</div>
      </div>
      <span class="row-card-arrow">›</span>
    </div>
  `).join('');

  container.innerHTML = '';
  container.appendChild(h(`
    <a href="#/admin" class="back-link">&larr; 관리자 대시보드로</a>
    <h2>회원 관리</h2>
    <form id="admin-member-filter-form" class="profile-form" style="flex-direction:row;flex-wrap:wrap;gap:0.5rem;align-items:flex-end">
      <label style="flex:1;min-width:180px">이메일 검색<input type="text" name="q" value="${escapeAttr(qParam)}" placeholder="이메일 일부 입력"></label>
      <label style="min-width:140px">플랜<select name="plan">
        <option value="">전체</option>
        ${['free', 'basic', 'pro', 'business'].map(p => `<option value="${p}" ${planParam === p ? 'selected' : ''}>${escapeHtml(PLAN_DISPLAY_NAMES[p])}</option>`).join('')}
      </select></label>
      <button type="submit" class="btn btn-primary btn-sm">검색</button>
    </form>
    <p class="license-card-meta">${items.length}명</p>
    <div class="notice-list">${rows || '<p class="empty">조건에 맞는 회원이 없습니다.</p>'}</div>
  `));

  document.getElementById('admin-member-filter-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const q = (fd.get('q') || '').trim();
    const plan = fd.get('plan') || '';
    const query = new URLSearchParams();
    if (q) query.set('q', q);
    if (plan) query.set('plan', plan);
    location.hash = '#/admin/members' + (query.toString() ? '?' + query.toString() : '');
  });

  container.querySelectorAll('.admin-member-row').forEach(row => {
    row.addEventListener('click', () => { location.hash = '#/admin/members/' + row.dataset.id; });
  });
}

// renderAdminMemberDetail — 읽기 전용(수정 기능 없음, 요청 범위 밖).
// 결제이력/파이프라인은 이 계정이 속한 조직 전체 데이터 — 개인이 아니라
// 조직 단위 데이터라서(팀기능 원칙). 파이프라인 카드는 일부러 pipelineListRowHtml을
// 재사용하지 않는다 — 그건 클릭 시 #/pipeline/{id}로 이동하는데, 관리자
// 계정은 그 조직 멤버가 아니라서 접근 권한 검사(handleGetPipelineEntry)에
// 걸려 404가 뜬다 — 그래서 클릭 불가능한 순수 카드로만 보여준다.
async function renderAdminMemberDetail(container, id) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/admin/members/' + encodeURIComponent(id));
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    if (err.status === 403) {
      container.appendChild(h('<p class="error">관리자 권한이 필요합니다.</p>'));
      return;
    }
    if (err.status === 404) {
      container.appendChild(h('<p class="error">회원을 찾을 수 없습니다.</p>'));
      return;
    }
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  const paymentRows = (data.paymentHistory || []).map(p => `
    <div class="license-card">
      <div class="license-card-main">
        <div class="license-card-name">${escapeHtml(p.planName || p.plan || '-')} <span class="badge ${p.status === '승인' ? 'badge--success' : (p.status === '취소' ? 'badge--gray' : 'badge--danger')}">${escapeHtml(p.status)}</span></div>
        <div class="license-card-meta">${escapeHtml(formatDateTime(p.requestedAt))} · <span class="mono">${formatBudget(p.amount)}</span></div>
      </div>
    </div>
  `).join('');

  const pipelineRows = (data.pipelineEntries || []).map(entry => `
    <div class="license-card">
      <div class="license-card-main">
        <div class="license-card-name">${escapeHtml(entry.noticeTitle)} ${pipelineStepIndicatorHtml(entry.status)}</div>
        <div class="license-card-meta">${escapeHtml(entry.organizationName || '-')} · 담당자 ${escapeHtml(entry.assigneeName || '미지정')} · 마감 ${entry.submissionDeadline ? escapeHtml(entry.submissionDeadline) : '-'}</div>
      </div>
    </div>
  `).join('');

  container.innerHTML = '';
  container.appendChild(h(`
    <a href="#/admin/members" class="back-link">&larr; 회원 목록으로</a>
    <div class="detail-card">
      <p class="detail-eyebrow">${escapeHtml(data.role)}</p>
      <h2>${escapeHtml(data.email)}</h2>
      <dl class="detail-meta">
        <div><dt>가입일</dt><dd>${escapeHtml(formatDateTime(data.createdAt))}</dd></div>
        <div><dt>마지막 로그인</dt><dd>${data.lastLoginAt ? escapeHtml(formatDateTime(data.lastLoginAt)) : '기록 없음'}</dd></div>
        <div><dt>플랜</dt><dd>${escapeHtml(data.planName)}</dd></div>
      </dl>
    </div>
    <div class="detail-card">
      <h3>결제 이력</h3>
      <div class="license-list">${paymentRows || '<p class="empty">결제 이력이 없습니다.</p>'}</div>
    </div>
    <div class="detail-card">
      <h3>파이프라인 현황</h3>
      <div class="license-list">${pipelineRows || '<p class="empty">파이프라인 이력이 없습니다.</p>'}</div>
    </div>
  `));
}

// renderAdminIntegrations — #/admin/integrations. 목록 자체는 백엔드에

// 실제 키 값은 어떤 경우에도 응답에 포함되지 않는다.
async function renderAdminIntegrations(container) {
  container.innerHTML = '';

  let data;
  try {
    data = await apiRequest('GET', '/api/admin/integrations');
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }

    if (err.status === 403) {
      container.appendChild(h('<p class="error">관리자 권한이 필요합니다.</p>'));
