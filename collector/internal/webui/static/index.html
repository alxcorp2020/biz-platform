  .completeness-label { flex: 0 0 4.5rem; font-size: 0.85rem; color: var(--ink-soft); }
  .completeness-bar {
    flex: 1; height: 8px; border-radius: 999px; background: var(--bg-soft); overflow: hidden;
  }
  .completeness-bar-fill { height: 100%; background: var(--accent-blue); border-radius: 999px; }
  .completeness-pct { flex: 0 0 2.5rem; text-align: right; font-size: 0.82rem; font-weight: 600; color: var(--ink); }

  .elig-hint { margin: 0.4rem 0 0; font-size: 0.82rem; color: var(--ink-soft); }
  .elig-hint a { font-weight: 600; }

  .field-verify-row {
    display: flex; align-items: center; gap: 0.6rem; margin: -0.5rem 0 0.5rem;
  }
  .field-verify-btn {
    padding: 0.3rem 0.7rem; border: 1px solid var(--border); background: var(--surface);
    color: var(--navy); border-radius: 6px; cursor: pointer; font-size: 0.78rem; font-weight: 600;
  }
  .field-verify-btn:hover { background: var(--bg-soft); }

  /* ---------- 요금제 / 결제 ---------- */
  .plan-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: var(--space-lg);
    margin: var(--space-lg) 0 var(--space-xl);
  }
  .plan-card {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: var(--space-sm); padding: var(--space-xl) var(--space-lg); border: 1px solid var(--border);
    border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow-soft);
  }
  .plan-card--current { border-color: var(--accent-blue); border-width: 2px; }
  .plan-card-name { margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--navy); }
  .plan-card-price { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--ink); }
  .plan-card-features { list-style: none; margin: 0.5rem 0 1rem; padding: 0; font-size: 0.88rem; color: var(--ink-soft); }
  .plan-card-features li { padding: 0.35rem 0; }
  .plan-current-badge {
    display: inline-block; padding: 0.35rem 0.9rem; border-radius: 999px;
    background: rgba(49,130,246,0.10); color: var(--accent-blue); font-size: 0.85rem; font-weight: 700;
  }
  .plan-subscribe-btn {
    padding: 0.65rem 1.4rem; border: 1px solid var(--accent-blue); background: var(--accent-blue);
    color: #fff; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
  }
  .plan-subscribe-btn:hover { background: var(--accent-blue-deep); border-color: var(--accent-blue-deep); }

  /* ---------- 모바일 반응형 최소 대응 ----------
     그리드류(dash-tiles/checkbox-grid/detail-meta 등)는 이미
     auto-fit/auto-fill이라 미디어쿼리 없이도 좁은 화면에서 알아서
     열이 줄어든다. 여기서는 그걸로 안 풀리는 것들만: 헤더/카드
     여백 축소, 필터 폼 한 줄 배치. */
  @media (max-width: 640px) {
    .site-header { padding: 1rem; }
    main { padding: 1.5rem 1rem 3rem; }
    .header-right { gap: 0.85rem; }
    .header-links, .auth-nav { gap: 0.85rem; font-size: 0.85rem; }

    .detail-card, .ai-summary-card, .ai-participation-card, .review-item,
    .auth-card, .license-confirm-form, .profile-completeness-card {
      padding: 1.1rem;
    }
    .home-hero { padding: 1.75rem 1.25rem; }
    .home-hero-title { font-size: 1.25rem; }

    .filters { padding: 0.85rem; }
    .filters input[name="q"] { flex-basis: 100%; min-width: 0; }
    .filters select[name="region"], .filters input[name="industry"] { flex: 1; min-width: 0; }
    .filters .dropdown-select-trigger { flex-basis: 100%; }
    .filters button { flex: 1; }

    .review-actions { flex-wrap: wrap; }
  }

  /* ---------- 터치 타겟 최소 44px (터치 입력 기기 한정) ----------
     hover 위주로 설계된 작은 아이콘류(용어설명 버튼 등)는 터치에서도
     원래 크기를 유지한다 — 부차적인 정보 트리거라 44px로 키우면
     오히려 본문 레이아웃을 깨뜨린다. 실제로 반복 조작하는 버튼/링크/
     입력 요소만 대상으로 한다. */
  @media (pointer: coarse) {
    .filters button, .auth-form button, .profile-form button,
    .license-toolbar button, .review-btn, .btn,
    .pipeline-review-btn, .field-verify-btn, .home-cta-primary,
    .home-cta-secondary, .calendar-add-link, .checklist-status-select,
    .plan-subscribe-btn, #checkout-pay-btn, #logout-btn {
      min-height: 44px;
    }
    .mobile-menu-toggle {
      min-width: 44px; min-height: 44px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .header-links a, .auth-nav a, .link-btn, .back-link, .home-browse-link,
    .official-link, .pipeline-review-link, .ai-next-action {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
    }
    .auth-form input, .profile-form input, .filters input {
      min-height: 44px;
    }
    input[type="checkbox"] { width: 1.3rem; height: 1.3rem; }
  }

  /* ---------- 참여판단 보고서(인쇄/PDF 저장용) ----------
     별도 PDF 라이브러리 없이 브라우저 인쇄 대화상자의 "PDF로 저장"을
     이용한다 — @media print가 사이드바/탭바/헤더/.no-print 요소를
     숨기고 .report-page만 종이 한 장처럼 보이게 만든다. */
  .report-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-lg); gap: var(--space-sm); flex-wrap: wrap; }
  .report-page {
    max-width: 760px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-card); padding: var(--space-xl); box-shadow: var(--shadow-soft);
  }
  .report-doc-title { margin: 0; font-size: var(--text-caption); font-weight: 700; color: var(--accent-blue); letter-spacing: 0.05em; }
  .report-notice-title { margin: 0.3rem 0 var(--space-lg); font-size: 1.4rem; font-weight: 700; color: var(--navy); line-height: 1.4; }
  .report-section { margin-top: var(--space-xl); padding-top: var(--space-lg); border-top: 1px solid var(--border); }
  .report-section-title { margin: 0 0 var(--space-sm); font-size: 1rem; font-weight: 700; color: var(--ink); }
  .report-grade-head { display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap; }
  .report-grade-score { font-size: var(--text-caption); color: var(--ink-soft); }
  .report-grade-reason { margin: 0.6rem 0 0; font-size: var(--text-caption); color: var(--ink-soft); }
  .report-table { width: 100%; border-collapse: collapse; margin-top: var(--space-md); font-size: var(--text-caption); }
  .report-table th, .report-table td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  .report-table th { color: var(--ink-soft); font-weight: 600; }
  .report-summary-list { margin: 0; padding-left: 1.2rem; }
  .report-summary-list li { margin-bottom: 0.4rem; }
  .report-meta-caption { margin: var(--space-sm) 0 0; font-size: 0.78rem; color: var(--ink-soft); }
  .report-condition-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-md); }
  .report-condition-name { margin: 0 0 0.35rem; font-size: 0.92rem; color: var(--ink); }
  .report-footer-note { margin-top: var(--space-xl); padding-top: var(--space-md); border-top: 1px solid var(--border); font-size: 0.78rem; color: var(--ink-soft); }

  @media print {
    /* 인쇄물(리포트 등)은 다크 모드여도 항상 밝은 팔레트로 — 활성 테마와
       무관하게 색 변수를 라이트 값으로 되돌린다. */
    :root, :root[data-theme="dark"] {
      --navy: #14213D; --navy-deep: #0B1526; --ink: #1A1A1A; --ink-soft: #5F6672;
      --bg: #FFFFFF; --bg-soft: #F5F6F8; --surface: #FFFFFF; --surface-soft: #F5F5F7;
      --border: #E2E5EA; --success: #1F8A5F; --warn: #C4841D; --danger: #C0392B;
      color-scheme: light;
    }
    .sidebar, .tabbar, .site-header, .no-print { display: none !important; }
    body { background: #fff; color: #1A1A1A; }
    main { max-width: none !important; margin: 0 !important; padding: 0 !important; }
    .report-page { border: none; box-shadow: none; padding: 0; max-width: none; }
  }

  /* ---------- 부팅 오버레이(app-booting) — 정적 HTML이 그려진 시점부터
     await loadMe(); route(); 가 끝나 최종 레이아웃(사이드바 유무 등)이
     확정되는 순간까지, 앱 셸이 잘못된 상태로 잠깐 보였다 사라지는
     깜빡임(FOUC)을 막는다. <body>에 이 클래스가 정적으로 박혀있어
     JS가 실행되기 전부터 이미 적용된 상태로 첫 페인트가 일어나고,
     route()가 최종 레이아웃 클래스를 다 정한 뒤에야 JS가 클래스를
     제거한다. ---------- */
  body.app-booting .site-header,

    position: fixed;
    inset: 0;
    z-index: 9999;
    align-items: center;
    justify-content: center;

  /* ---------- 랜딩페이지(비로그인 첫 화면) — 지금 앱(로그인 후 대시보드)
     과 완전히 독립된 레이아웃. body.is-landing일 때 기존 앱 셸(사이드바/
     헤더/탭바/전역 프로필 배너)을 숨기고 #app을 전체 폭으로 연다 —
     @media print이 인쇄 시 같은 요소들을 숨기는 것과 같은 원리를 화면
     표시에도 적용했다. 섹션 내부 너비는 .landing-container가 관리하므로
     main의 기본 max-width/padding은 여기서 전부 해제한다. */
  body.is-landing .sidebar,

<body class="app-booting">
<!-- await loadMe(); route(); 가 끝날 때까지만 보이는 부팅 오버레이.

<script>
const app = document.getElementById('app');

function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content; }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }
// safeExternalHttpUrl — 외부 이동 링크(href)로 쓸 수 있는 http/https URL만
// 통과시킨다. javascript:·data: 등 스킴은 null 반환(XSS/피싱 회피, B-2 §9).
// 지원사업 "사업 신청하기" CTA(application_url)에 사용.
function safeExternalHttpUrl(u) {
  if (!u || typeof u !== 'string') return null;
  const trimmed = u.trim();
  try {
    const parsed = new URL(trimmed);
    if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return trimmed;
  } catch (e) { /* 상대경로/파싱불가 → 링크로 쓰지 않음 */ }
  return null;
}

// ---------- 모달 / 바텀시트 공용 헬퍼 ----------
// 데스크톱에선 중앙 모달, 좁은 화면에선 하단 바텀시트로 보이는 같은
// 컴포넌트(.modal-overlay/.modal-panel의 미디어쿼리가 위치만 바꿈).
// openModal()이 반환하는 patternel(모달 body 컨테이너)에 호출한 쪽이
// 폼을 채우고 이벤트를 바인딩한다 — renderXxx 함수들이 h()로 리스트를
// 그리는 것과 같은 패턴.
function openModal(title, bodyHtml, opts) {
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'active-modal-overlay';
  overlay.appendChild(h(`
    <div class="modal-panel">
      <div class="modal-header">
        <h3 class="modal-title">${escapeHtml(title)}</h3>
        <button type="button" class="modal-close-btn" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body"></div>
    </div>
  `));
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
  overlay.querySelector('.modal-body').appendChild(h(bodyHtml));
  // disableBackdropClose — 여러 단계를 이어가는 흐름(온보딩 카드 모달 등)
  // 에서는 바깥을 실수로 클릭해 전체 진행이 날아가는 걸 막기 위해 배경
  // 클릭으로 닫히는 기본 동작을 끌 수 있다(닫기 버튼(X)은 그대로 동작).
  if (!(opts && opts.disableBackdropClose)) {
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  }
  overlay.querySelector('.modal-close-btn').addEventListener('click', closeModal);
  window.__modalOnClose = (opts && opts.onClose) || null;
  return overlay.querySelector('.modal-body');
}
function closeModal() {
  const overlay = document.getElementById('active-modal-overlay');
  if (!overlay) return;
  overlay.remove();
  document.body.style.overflow = '';
  const onClose = window.__modalOnClose;
  window.__modalOnClose = null;
  if (onClose) onClose();
}

// openConfirmModal — 브라우저 기본 confirm()을 대체하는 공용 확인 모달.
// title/message/액션버튼(취소·확인) 슬롯 구조로 openModal()을 감싼다.
// onConfirm은 async 함수를 지원한다 — 실패하면(reject) 모달을 닫지 않고
// 에러 메시지를 모달 안에 보여준 뒤 다시 시도할 수 있게 버튼을 살린다
// (저장/삭제 API 호출을 onConfirm에 그대로 넣는 용도를 염두에 둔 설계).
function openConfirmModal(opts) {
  const {
    title = '확인',
    message = '',
    confirmLabel = '확인',
    cancelLabel = '취소',
    tone = 'primary', // 'primary' | 'danger'
    onConfirm,
  } = opts || {};
  const body = openModal(title, `
    <p class="modal-message">${escapeHtml(message)}</p>
    <div id="modal-confirm-error" class="error" style="display:none"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="modal-confirm-cancel-btn">${escapeHtml(cancelLabel)}</button>
      <button type="button" class="btn ${tone === 'danger' ? 'btn-danger' : 'btn-primary'}" id="modal-confirm-ok-btn">${escapeHtml(confirmLabel)}</button>
    </div>
  `);
  body.querySelector('#modal-confirm-cancel-btn').addEventListener('click', closeModal);
  const okBtn = body.querySelector('#modal-confirm-ok-btn');
  okBtn.addEventListener('click', async () => {
    if (!onConfirm) { closeModal(); return; }
    okBtn.disabled = true;
    try {
      await onConfirm();
      closeModal();
    } catch (err) {
      const errBox = body.querySelector('#modal-confirm-error');
      errBox.textContent = err.message;
      errBox.style.display = 'block';
      okBtn.disabled = false;
    }
  });
}

// openListPickerModal — 트리거 버튼 옆에 작은 <select>를 펼치던 기존
// 방식("선택 UI가 불명확하다"는 피드백, 2026-08-07)을 모달 목록으로
// 바꾼다. items는 이미 조회해둔 배열, labelFn(item)이 각 줄 표시
// 텍스트를, onSelect(item)이 선택 시 동작을 맡는다(모달은 선택 즉시
// 스스로 닫는다 — 호출부가 따로 closeModal()을 부르지 않아도 됨).
function openListPickerModal(title, items, labelFn, onSelect) {
  const listHtml = items.map((it, i) => `
    <button type="button" class="dropdown-menu-item list-picker-item" data-index="${i}">${escapeHtml(labelFn(it))}</button>
  `).join('');
  const body = openModal(title, `<div class="list-picker">${listHtml}</div>`);
  body.querySelectorAll('.list-picker-item').forEach(btn => {
    btn.addEventListener('click', () => {
      onSelect(items[Number(btn.dataset.index)]);
      closeModal();
    });
  });
}

// ---------- 토스트(공용) ----------
// showToast(message, type) — type: 'success' | 'error' | 'info'(기본).
// 3초 후 자동으로 사라진다. 여러 개 동시 호출 시 쌓인다(컨테이너가
// column-reverse라 새 토스트가 항상 맨 아래/화면과 가장 가까운 자리에
// 붙는다). 페이지 이동으로 컨테이너가 통째로 없어질 일이 없도록
// #app 밖(body 직속)에 붙인다.
const TOAST_DURATION_MS = 3000;
function getToastContainer() {
  let el = document.getElementById('toast-container');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast-container';
    document.body.appendChild(el);
  }
  return el;
}
function showToast(message, type) {
  const container = getToastContainer();
  const toast = document.createElement('div');
  toast.className = `toast toast--${type === 'success' || type === 'error' ? type : 'info'}`;
  toast.textContent = message;
  container.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('is-visible'));
  setTimeout(() => {
    toast.classList.remove('is-visible');
    toast.addEventListener('transitionend', () => toast.remove(), { once: true });
  }, TOAST_DURATION_MS);
}

// ---------- 드롭다운(공용) ----------
// openDropdown(triggerEl, menuHtml, opts) — 트리거 버튼 바로 아래에 뜨는
// 메뉴. 바깥 클릭이나 Escape로 닫히고, 한 번에 하나만 열려있다(다른 걸
// 열면 이전 게 자동으로 닫힘). opts.align: 'left'(기본, 트리거 왼쪽
// 기준 정렬) | 'right'(트리거 오른쪽 기준 정렬 — 화면 오른쪽 끝에
// 가까운 트리거용). 반환값(메뉴 엘리먼트)에 호출한 쪽이 클릭 핸들러를
// 붙인다(renderXxx가 h()로 만든 리스트에 이벤트를 붙이는 기존 패턴과 동일).
let activeDropdown = null;
function closeActiveDropdown() {
  if (!activeDropdown) return;
  activeDropdown.menuEl.remove();
  document.removeEventListener('click', activeDropdown.outsideHandler, true);
  activeDropdown = null;
}
function openDropdown(triggerEl, menuHtml, opts) {
  const reopening = activeDropdown && activeDropdown.triggerEl === triggerEl;
  closeActiveDropdown();
  if (reopening) return null; // 같은 트리거를 다시 클릭하면 토글(닫기)로만 동작

  const menu = document.createElement('div');
  menu.className = 'dropdown-menu';
  menu.appendChild(h(menuHtml));
  document.body.appendChild(menu);

  const rect = triggerEl.getBoundingClientRect();
  const menuRect = menu.getBoundingClientRect();
  const align = (opts && opts.align) || 'left';
  const spaceBelow = window.innerHeight - rect.bottom;
  const spaceAbove = rect.top;
  // 아래쪽에 메뉴 높이만큼 공간이 없고, 위쪽에 공간이 더 넉넉하면 위로
  // 펼친다(화면 하단 근처 트리거에서 메뉴가 화면 밖으로 나가 클릭 불가능해지는 문제 방지).
  const openUpward = spaceBelow < menuRect.height + 6 && spaceAbove > spaceBelow;
  if (openUpward) {
    menu.style.bottom = (window.innerHeight - rect.top + 6) + 'px';
    menu.style.top = 'auto';
  } else {
    menu.style.top = (rect.bottom + 6) + 'px';
    menu.style.bottom = 'auto';
  }
  if (align === 'right') {
    menu.style.left = Math.max(8, rect.right - menuRect.width) + 'px';
  } else {
    menu.style.left = Math.min(rect.left, window.innerWidth - menuRect.width - 8) + 'px';
  }

  // 트리거를 누른 바로 그 클릭이 곧바로 "바깥 클릭"으로 잡혀 즉시 닫히는
  // 걸 막기 위해 다음 이벤트 루프에서 리스너를 등록한다.
  const outsideHandler = (e) => {
    if (!menu.contains(e.target) && e.target !== triggerEl && !triggerEl.contains(e.target)) {
      closeActiveDropdown();
    }
  };
  setTimeout(() => document.addEventListener('click', outsideHandler, true), 0);
  activeDropdown = { menuEl: menu, outsideHandler, triggerEl };
  return menu;
}

// ---------- 모달/드롭다운 공용 Escape 처리 ----------
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('active-modal-overlay')) { closeModal(); return; }
    if (activeDropdown) closeActiveDropdown();
    return;
  }
  // "/" — 공고 검색창 빠른 포커스(파워유저용). 이미 입력창/모달에 타이핑
  // 중이거나 수정키가 눌린 상태면 무시해서 본문에 "/"를 정상 입력할 수 있게 한다.
  if (e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const el = document.activeElement;
    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable)) return;
    const search = document.querySelector('#filter-form input[name="q"]');
    if (search) { e.preventDefault(); search.focus(); search.select(); }
  }
});

// updateSidebarActiveState — route()가 바뀔 때마다 호출(로그인 상태는

// 각각 목록 메뉴가 활성 상태로 보이도록 접두어로 비교한다.
function updateSidebarActiveState() {

function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return '-';
  return d.toISOString().slice(0, 10);
}

function formatBudget(n) {
  if (n === null || n === undefined) return '-';
  return Number(n).toLocaleString('ko-KR') + '원';
}

function formatDateTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return '-';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// 한국어 일시 표시(2026-08-11, Phase 1 UI). 기존 KST 수정 로직/DB 변환은 절대 건드리지
// 않는다 — formatDateTime과 동일하게 브라우저 로컬(KST) 필드만 읽어 표시 형식만 바꾼다.
// formatKoreanDate  → "2026년 08월 11일(화)"
// formatKoreanTime  → "오후 2시 07분"(시 앞자리는 안 채우고, 분은 두 자리)
// formatKoreanDateTime → 위 둘을 한 줄로 결합
const KOREAN_WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
function formatKoreanDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return '-';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}년 ${pad(d.getMonth() + 1)}월 ${pad(d.getDate())}일(${KOREAN_WEEKDAYS[d.getDay()]})`;
}
function formatKoreanTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const h = d.getHours();
  const ampm = h < 12 ? '오전' : '오후';
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return `${ampm} ${h12}시 ${String(d.getMinutes()).padStart(2, '0')}분`;
}
function formatKoreanDateTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return '-';
  return `${formatKoreanDate(iso)} ${formatKoreanTime(iso)}`;
}

function formatFileSize(bytes) {
  if (bytes === null || bytes === undefined) return '';
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + 'KB';
  return (bytes / 1024 / 1024).toFixed(1) + 'MB';
}

// 마감일을 사각 배지(pill)로 표시: D-5 이내는 위험색, 지난 공고는 무채색.
function ddayInfo(iso) {
  if (!iso) return { label: '-', cls: 'dday-badge--muted' };
  const d = new Date(iso);
  if (isNaN(d)) return { label: '-', cls: 'dday-badge--muted' };
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(d);
  target.setHours(0, 0, 0, 0);
  const diffDays = Math.round((target - today) / 86400000);
  if (diffDays < 0) return { label: '마감', cls: 'dday-badge--muted' };
  if (diffDays === 0) return { label: 'D-DAY', cls: 'dday-badge--danger' };
  if (diffDays <= 5) return { label: 'D-' + diffDays, cls: 'dday-badge--danger' };
  return { label: 'D-' + diffDays, cls: '' };
}

function ddayBadgeHtml(iso, extraClass) {
  const info = ddayInfo(iso);
  return `<span class="dday-badge mono ${info.cls} ${extraClass || ''}">${escapeHtml(info.label)}</span>`;
}

function closeAllGlossary() {
  document.querySelectorAll('.glossary.is-open').forEach(el => {
    el.classList.remove('is-open');
    const btn = el.querySelector('.glossary-btn');
    if (btn) btn.setAttribute('aria-expanded', 'false');
  });
}

// 모바일 좁은 화면에서 중앙정렬 툴팁이 좌/우 경계를 벗어나 잘리는 문제 방지.
// .glossary-tooltip은 항상 레이아웃에 존재(visibility만 토글)해 열리기 전에도
// getBoundingClientRect()로 실제 위치를 측정할 수 있다.
function positionGlossaryTooltip(wrap) {
  if (!wrap) return;
  const tooltip = wrap.querySelector('.glossary-tooltip');
  if (!tooltip) return;
  tooltip.style.removeProperty('--tip-shift');
  const rect = tooltip.getBoundingClientRect();
  const margin = 8;
  let shift = 0;
  if (rect.left < margin) {
    shift = margin - rect.left;
  } else if (rect.right > window.innerWidth - margin) {
    shift = (window.innerWidth - margin) - rect.right;
  }
  if (shift !== 0) tooltip.style.setProperty('--tip-shift', shift + 'px');
}
document.addEventListener('mouseover', (e) => {
  const btn = e.target.closest('.glossary-btn');
  if (btn) positionGlossaryTooltip(btn.closest('.glossary'));
});
document.addEventListener('focusin', (e) => {
  const btn = e.target.closest('.glossary-btn');
  if (btn) positionGlossaryTooltip(btn.closest('.glossary'));
});

document.addEventListener('click', (e) => {
  const btn = e.target.closest('.glossary-btn');
  if (btn) {
    e.stopPropagation();
    const wrap = btn.closest('.glossary');
    const willOpen = !wrap.classList.contains('is-open');
    closeAllGlossary();
    if (willOpen) {
      positionGlossaryTooltip(wrap);
      wrap.classList.add('is-open');
      btn.setAttribute('aria-expanded', 'true');
    }
    return;
  }
  closeAllGlossary();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeAllGlossary();
});

async function apiRequest(method, url, body) {
  const opts = { method };
  if (body !== undefined) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(url, opts);
  let data = null;
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) {
    const code = data && data.error;
    const err = new Error((code && ERROR_MESSAGES[code]) || ('요청 실패 (' + res.status + ')'));
    err.code = code;
    err.status = res.status;
    err.data = data; // 코드-메시지 매핑에 없는 추가 정보(예: 환불 거부 사유의 사용 이력 요약)가 필요한 호출부용
    throw err;
  }
  return data;
}

let currentUser = null;
let currentProfile = null;

// ---------- 다크 모드 ----------
// 색 변수만 뒤집는 방식(:root[data-theme="dark"]). <head>의 조기 스크립트가
// 첫 페인트 전에 이미 적용하므로, 여기 헬퍼는 계정정보 토글에서 쓴다.
function getStoredTheme() {
  try { return localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'; } catch { return 'light'; }
}
function applyTheme(theme) {
  const dark = theme === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#0F1216' : '#3182F6');
  try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch { /* 저장 실패해도 현재 세션엔 적용됨 */ }
}

// ---------- 브랜드명(관리자 #/admin/company-info에서 편집) ----------
// 지금은 가칭 "공공사업 AI 비서"라 나중에 실제 브랜드명이 정해지면
// 코드 곳곳을 일일이 고치지 않고 이 값 하나만 바꾸면 되게 만들었다.
// DEFAULT_BRAND_NAME은 fetch 자체가 실패했을 때(네트워크 오류 등)
// 화면이 빈 문자열로 깨지지 않게 하는 최후의 폴백 — 정상 동작 시에는
// 항상 DB의 company_info.brand_name(NOT NULL) 값을 쓴다.
const DEFAULT_BRAND_NAME = '공공사업 AI 비서';
let currentBrandName = DEFAULT_BRAND_NAME;

// applyBrandName — document.title과 .brand-name-text 클래스가 붙은 모든
// 요소(헤더 로고, 사이드바 로고, 랜딩페이지 로고/푸터 저작권 표시)의
// 텍스트를 한 번에 갱신한다. 동기 함수라 렌더 함수가 새 DOM을 만든
// 직후 바로 다시 호출해도 저렴하다(랜딩페이지가 매번 그렇게 함 —
// fetch를 새로 안 하고 이미 알고 있는 currentBrandName을 새 DOM에
// 즉시 적용).
function applyBrandName(name) {
  currentBrandName = (name && name.trim()) || DEFAULT_BRAND_NAME;
  document.title = currentBrandName;
  document.querySelectorAll('.brand-name-text').forEach(el => {
    el.textContent = currentBrandName;
  });
  // 스크린샷 alt 텍스트 중 브랜드명이 들어가는 것들(랜딩 히어로/스포트라이트
  // 대시보드 이미지) — HTML을 새로 그릴 때는 이미 currentBrandName으로
  // 채워 넣지만, 그 뒤(예: loadBrandName의 fetch가 나중에 도착)에도 stale
  // 값이 안 남게 여기서 한 번 더 맞춰준다.
  document.querySelectorAll('[data-brand-alt-suffix]').forEach(el => {
    el.alt = currentBrandName + el.getAttribute('data-brand-alt-suffix');
  });
}

// loadBrandName — 앱 부팅 시(loadMe()와 별개로, 로그인 여부와 무관하게)
// 한 번 호출해 브랜드명을 읽어온다. 공개 API라 비로그인 방문자도
// 정상적으로 최신 브랜드명을 본다.
async function loadBrandName() {
  try {
    const data = await apiRequest('GET', '/api/company-info');
    applyBrandName(data.brandName);
  } catch (err) {
    applyBrandName(null);
  }
}

async function loadMe() {
  try {
    const data = await apiRequest('GET', '/api/me');
    currentUser = data.user;
    currentProfile = data.companyProfile;
  } catch (err) {
    currentUser = null;
    currentProfile = null;
  }
  renderHeader();
  if (currentUser) refreshUnreadNotificationCount();
}

// setNotificationBadge — 사이드바/탭바의 "알림" 아이콘 위에 안읽음
// 개수를 작은 배지로 겹쳐 그린다(0이면 배지 자체를 지운다). 두 nav 모두
// data-path="#/notifications"인 아이템 안의 아이콘 wrapper를 찾아서 붙인다.
function setNotificationBadge(count) {
  document.querySelectorAll('[data-path="#/notifications"]').forEach(item => {
    const iconWrap = item.querySelector('.sidebar-menu-icon, .tabbar-icon');
    if (!iconWrap) return;
    let badge = iconWrap.querySelector('.nav-badge');
    if (count > 0) {
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'nav-badge';
        iconWrap.appendChild(badge);
      }
      badge.textContent = count > 99 ? '99+' : String(count);
    } else if (badge) {
      badge.remove();
    }
  });
}

// #/dashboard(회원 전용 진입점)의 화면. ⚠️2026-08-05: 예전엔 이 함수가
// #/(비로그인/로그인 공용) 자체의 핸들러였는데, "홈이 랜딩페이지와
// 대시보드 두 역할을 겸해 혼란스럽다"는 이유로 분리했다 — #/는 이제
// route()에서 로그인 여부만 보고 즉시 랜딩페이지 또는 #/dashboard로
// 리다이렉트하고(가능하면 이 함수를 아예 안 부름), 실제 대시보드
// 렌더링은 이 함수(#/dashboard 전용)와 route() 최하단 fallback(알 수
// 없는 경로)만 담당한다. 401 처리는 route()의 상단 게이트가 이미
// #/dashboard를 비로그인 접근에서 막아주므로 정상 흐름에서는 거의 안
// 일어나지만, currentUser가 클라이언트에 남아있는데 세션 쿠키만 만료된
// 경우처럼 방어적으로 필요해 로그인 화면으로 보낸다(과거처럼 랜딩페이지를
// #/dashboard URL 아래 인라인 렌더하지 않음 — 주소와 화면이 어긋나는
// 걸 피하기 위함).
async function renderHome(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/dashboard');
  } catch (err) {
    if (err.status === 401) {
      location.hash = '#/auth/login';
      return;
    }
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  if (!data.hasProfile) {
    renderOnboardingHero(container);
    return;
  }

  renderDashboard(container, data);
}

// simpleMarkdownToHtml — 팝업 콘텐츠용 최소 마크다운(굵게, 링크 자동
// 인식, 줄바꿈)만 지원한다. 복잡한 리치텍스트 에디터 라이브러리는
// 스펙에서 명시적으로 지양 — 반드시 escapeHtml로 먼저 이스케이프한
// 뒤 최소 태그만 허용해 관리자가 입력한 텍스트로 인한 XSS를 막는다.
function simpleMarkdownToHtml(text) {
  let out = escapeHtml(text);
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/\n/g, '<br>');
  return out;
}

// legalMarkdownToHtml — 이용약관/개인정보처리방침처럼 제목(#~###)·목록(-)·
// 표(|...|)·인용(>)이 있는 긴 문서용 마크다운 렌더러. simpleMarkdownToHtml
// (팝업용, 굵게+줄바꿈+URL만 지원)보다 풍부하지만 여전히 라이브러리 없이
// 직접 구현한 최소 파서다 — legal_documents_seed.go의 시드 콘텐츠 구조에
// 맞춰 딱 필요한 문법만 지원한다(중첩 목록, 인라인 코드 등은 미지원).
function legalMarkdownToHtml(text) {
  function inlineFormat(s) {
    let out = escapeHtml(s);
    out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    return out;
  }
  const lines = text.split('\n');
  const out = [];
  let inList = false;
  let tableRows = [];
  let tableRowIndex = 0;
  function closeList() { if (inList) { out.push('</ul>'); inList = false; } }
  function closeTable() {
    if (tableRows.length) { out.push('<table class="legal-doc-table">' + tableRows.join('') + '</table>'); tableRows = []; tableRowIndex = 0; }
  }
  for (const line of lines) {
    const trimmed = line.trim();
    if (/^###\s+/.test(trimmed)) { closeList(); closeTable(); out.push(`<h3>${inlineFormat(trimmed.replace(/^###\s+/, ''))}</h3>`); continue; }
    if (/^##\s+/.test(trimmed)) { closeList(); closeTable(); out.push(`<h2>${inlineFormat(trimmed.replace(/^##\s+/, ''))}</h2>`); continue; }
    if (/^#\s+/.test(trimmed)) { closeList(); closeTable(); out.push(`<h1>${inlineFormat(trimmed.replace(/^#\s+/, ''))}</h1>`); continue; }
    if (/^>\s?/.test(trimmed)) { closeList(); closeTable(); out.push(`<blockquote>${inlineFormat(trimmed.replace(/^>\s?/, ''))}</blockquote>`); continue; }
    if (/^-\s+/.test(trimmed)) {
      closeTable();
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push(`<li>${inlineFormat(trimmed.replace(/^-\s+/, ''))}</li>`);
      continue;
    }
    if (/^\|.*\|$/.test(trimmed)) {
      closeList();
      const cells = trimmed.slice(1, -1).split('|').map(c => c.trim());
      if (cells.every(c => /^-+$/.test(c))) { continue; } // 헤더 구분선(|---|---|) 무시
      const tag = tableRowIndex === 0 ? 'th' : 'td';
      tableRows.push('<tr>' + cells.map(c => `<${tag}>${inlineFormat(c)}</${tag}>`).join('') + '</tr>');
      tableRowIndex++;
      continue;
    }
    closeList();
    closeTable();
    if (trimmed === '---') { out.push('<hr>'); continue; }
    if (trimmed === '') { continue; }
    out.push(`<p>${inlineFormat(trimmed)}</p>`);
  }
  closeList();
  closeTable();
  return out.join('\n');
}

// tryRenderPopupLayer — 활성 팝업 중 오늘 아직 "하루 보지 않기"로 안 닫은
// 첫 번째 것을 오버레이로 띄운다. 뭔가 보여줬으면 true를 돌려줘
// renderHomeOverlay가 배너를 건너뛰게 한다.
async function tryRenderPopupLayer() {
  let items;
  try {
    const data = await apiRequest('GET', '/api/popups');
    items = data.items || [];
  } catch (err) {
    return false;
  }
  const today = todayDateString();
  const popup = items.find(p => localStorage.getItem(`popup_dismissed_${p.id}_${today}`) !== '1');
  if (!popup) return false;

  document.getElementById('banner-layer-overlay')?.remove();
  const overlay = document.createElement('div');
  overlay.id = 'banner-layer-overlay';
  overlay.className = 'banner-layer-overlay';
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
  overlay.innerHTML = `
    <div class="popup-layer-card">
      ${popup.imageUrl ? `<img src="${escapeAttr(popup.imageUrl)}" alt="" class="popup-layer-image">` : ''}
      <div class="popup-layer-body">
        <h3 class="popup-layer-title">${escapeHtml(popup.title)}</h3>
        <div class="popup-layer-content">${simpleMarkdownToHtml(popup.content)}</div>
      </div>
      <div class="popup-layer-footer">
        <label class="checkbox-label"><input type="checkbox" id="popup-dismiss-today-input"> 오늘 하루 보지 않기</label>
        <button type="button" class="btn btn-secondary btn-sm" id="popup-close-btn">닫기</button>
      </div>
    </div>
  `;
  overlay.querySelector('#popup-close-btn').addEventListener('click', () => {
    if (overlay.querySelector('#popup-dismiss-today-input').checked) {
      localStorage.setItem(`popup_dismissed_${popup.id}_${today}`, '1');
    }
    document.body.style.overflow = '';
    overlay.remove();
  });
  return true;
}

// ---------- 배너 레이어(홈 화면 진입 시 오버레이 팝업, 관리자 CMS 1번) ----------
// renderLandingPage/renderOnboardingHero/renderDashboard 세 곳 모두에서
// 호출한다 — 홈 화면에 진입할 때마다(로그인/프로필 유무 무관) 화면
// 전체를 덮는 오버레이로 뜬다. 페이지 안 인라인 요소가 아니라
// document.body에 직접 붙는 전역 레이어라(#app이 route()에 갈아끼워져도
// 무관), 여러 홈 변형 함수가 중복 호출해도 이미 떠 있으면 하나만
// 남도록 매번 기존 오버레이를 먼저 제거한다. 실패(네트워크 오류 등)해도
// 조용히 무시한다 — 핵심 기능이 아니므로 에러 문구를 띄우지 않는다.
//
// "오늘 하루 보지 않기" — 닫기(×) 버튼을 누르면 localStorage에 오늘
// 날짜를 저장하고, 같은 날 안에는 다시 렌더링 자체를 건너뛴다(API 호출도
// 안 함 — 어차피 안 보여줄 걸 굳이 가져올 이유가 없음). 이 웹앱은
// artifact가 아니라 일반 서비스라 localStorage 사용에 제약이 없다.
const BANNER_DISMISS_KEY = 'home_banner_dismissed_date';
function todayDateString() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
async function renderHomeBannerSlide() {
  document.getElementById('banner-layer-overlay')?.remove();
  if (localStorage.getItem(BANNER_DISMISS_KEY) === todayDateString()) return;

  let items;
  try {
    const data = await apiRequest('GET', '/api/banners');
    items = data.items || [];
  } catch (err) {
    return;
  }
  if (!items.length) return;

  const overlay = document.createElement('div');
  overlay.id = 'banner-layer-overlay';
  overlay.className = 'banner-layer-overlay';
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
  renderBannerSlideInto(overlay, items);
}

function renderBannerSlideInto(overlay, items) {
  let current = 0;
  const hasMultiple = items.length > 1;
  overlay.innerHTML = `
    <div class="banner-slide">
      <div class="banner-slide-track">
        ${items.map(b => `
          <a class="banner-slide-item" ${b.linkUrl ? `href="${escapeAttr(b.linkUrl)}"` : `href="#" onclick="return false;"`}>
            <img src="${escapeAttr(b.imageUrl)}" alt="${escapeAttr(b.title)}" loading="lazy">
          </a>
        `).join('')}
      </div>
      <button type="button" class="banner-slide-close" aria-label="오늘 하루 보지 않기">&times;</button>
      ${hasMultiple ? `
        <button type="button" class="banner-slide-arrow banner-slide-arrow--prev" aria-label="이전 배너">&lsaquo;</button>
        <button type="button" class="banner-slide-arrow banner-slide-arrow--next" aria-label="다음 배너">&rsaquo;</button>
        <div class="banner-slide-dots">
          ${items.map((_, i) => `<button type="button" class="banner-slide-dot" data-index="${i}" aria-label="${i + 1}번째 배너로 이동"></button>`).join('')}
        </div>
      ` : ''}
    </div>
  `;
  const track = overlay.querySelector('.banner-slide-track');
  const dots = Array.from(overlay.querySelectorAll('.banner-slide-dot'));
  let timer = null;

  function update() {
    track.style.transform = `translateX(-${current * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle('is-active', i === current));
  }
  function go(delta) {
    current = (current + delta + items.length) % items.length;
    update();
  }
  update();

  // 닫기는 X 버튼으로만 — 배경(오버레이) 클릭으로는 안 닫히게 해서
  // "뒤 선택 못하게" 요구사항을 그대로 지킨다.
  overlay.querySelector('.banner-slide-close').addEventListener('click', () => {
    localStorage.setItem(BANNER_DISMISS_KEY, todayDateString());
    if (timer) clearInterval(timer);
    document.body.style.overflow = '';
    overlay.remove();
  });
  if (!hasMultiple) return;

  overlay.querySelector('.banner-slide-arrow--prev').addEventListener('click', () => go(-1));
  overlay.querySelector('.banner-slide-arrow--next').addEventListener('click', () => go(1));
  dots.forEach((d, i) => d.addEventListener('click', () => { current = i; update(); }));

  const AUTO_ADVANCE_MS = 5000;
  timer = setInterval(() => go(1), AUTO_ADVANCE_MS);
  overlay.addEventListener('mouseenter', () => clearInterval(timer));
  overlay.addEventListener('mouseleave', () => { timer = setInterval(() => go(1), AUTO_ADVANCE_MS); });
}

// ---------- 대시보드 프로필 미완성 안내 배너 ----------
// 2026-08-07부터 대시보드(홈) 화면 안에서만 렌더링된다(renderDashboard가
// 자기 컨테이너 안의 슬롯을 넘겨서 호출) — 이전에는 #app 밖 전역 슬롯에
// 렌더링돼 모든 화면 최상단에 항상 떠 있었지만, 모바일에서 화면 공간을
// 계속 잡아먹고 공고검색/캘린더 등 다른 작업에 방해가 된다는 피드백으로
// 대시보드 전용으로 되돌렸다. "AI 분석 커버리지가 낮다"는 정보는 대시보드
// 에서 요약을 볼 때만 필요하다는 판단.
//
// 완성도%는 /api/me/profile-completeness(기존 API)를 직접 호출해서
// 얻는다. 지역/업종/기업규모(온보딩 3개 필수항목)는 이 API 응답에
// 없어서(선택 카테고리만 채점, company_profile_completeness.go)
// currentProfile(이미 loadMe()가 채워둔 값)에서 직접 확인한다 — 별도
// API 호출 불필요.
async function renderDashboardProfileBanner(slot) {
  if (!slot) return;
  if (!currentUser || !currentProfile) { slot.innerHTML = ''; return; }

  // Phase 1 보정 §5: 지역·업종·기업규모(이게 없으면 추천/판정 자체가 불가능)가 결측일
  // 때만 안내한다. 단순히 완성도(%)가 낮다는 이유로는 경고 배너를 띄우지 않는다 —
  // 추천이 이미 나오는 사용자에게 "정보가 없어 추천을 못 받는다"는 모순 문구를 없앤다.
  const missingRequired = !(currentProfile.region && (currentProfile.industry || []).length && currentProfile.companySize);
  if (!missingRequired) { slot.innerHTML = ''; return; }
  slot.innerHTML = `
    <div class="profile-incomplete-banner profile-incomplete-banner--urgent">
      <span class="profile-incomplete-banner-text">필수 정보를 입력해주세요. 지역·업종·기업규모를 등록해야 맞춤 공고 추천과 AI 분석을 받을 수 있습니다.</span>
      <a href="#/me/company" class="profile-incomplete-banner-cta">회사정보 완성하기 →</a>
    </div>
  `;
}

// CONSUMER_RETAIL_INDUSTRY — 서버 public_bid_fit.go의 consumerRetailIndustry와
// 반드시 같은 문자열. 온보딩 업종 단계의 "일반 소비자 대상" 탈출구가 저장하는 값.
const CONSUMER_RETAIL_INDUSTRY = '일반 소비자 대상 업종';

// publicBidFitBannerHtml — 업태 기준 공공입찰 저관련 업종(음식·카페·미용 등)에게
// "공공입찰 추천이 매우 적을 수 있음"을 안내하고 소상공인 지원사업 쪽으로
// 유도한다(2026-08-08). fit은 currentProfile.publicBidFit 또는 OCR 후보의
// publicBidFit("none"/"low"/"normal"). normal이면 빈 문자열.
function publicBidFitBannerHtml(fit) {
  if (fit !== 'none' && fit !== 'low') return '';
  const strong = fit === 'none';
  const title = strong ? '이 업종은 공공입찰 공고가 매우 적을 수 있어요' : '이 업종은 공공입찰 공고가 적은 편이에요';
  const desc = strong
    ? '음식점·카페·미용실 등 일반 소비자 대상 업종은 나라장터 입찰 대상이 거의 없습니다. 대신 우리 앱에 모인 소상공인 지원사업 공고를 확인해보세요.'
    : '입찰 공고가 많지 않은 업종입니다. 소상공인 지원사업도 함께 확인해보세요.';
  // 인앱 지원사업(bizinfo 수집분) — 공고 검색의 지원사업 필터로 바로 이동(1순위 CTA).
  const inAppCta = `<a href="#/notices?noticeType=support_program" class="public-bid-fit-link public-bid-fit-link--primary">앱에서 지원사업 공고 보기 →</a>`;
  const links = [
    { label: '기업마당(정부 지원사업)', url: 'https://www.bizinfo.go.kr' },
    { label: '소상공인마당', url: 'https://www.sbiz.or.kr' },
    { label: '소상공인시장진흥공단', url: 'https://www.semas.or.kr' },
  ];
  const linksHtml = links.map(l =>
    `<a href="${l.url}" target="_blank" rel="noopener" class="public-bid-fit-link">${escapeHtml(l.label)}${newTabIconHtml()}</a>`
  ).join('');
  return `
    <div class="public-bid-fit-banner public-bid-fit-banner--${fit}">
      <div class="public-bid-fit-banner-head">
        <span class="public-bid-fit-banner-icon" aria-hidden="true">ℹ️</span>
        <div>
          <p class="public-bid-fit-banner-title">${escapeHtml(title)}</p>
          <p class="public-bid-fit-banner-desc">${escapeHtml(desc)}</p>
        </div>
      </div>
      <div class="public-bid-fit-banner-links">${inAppCta}${linksHtml}</div>
    </div>`;
}

// initLandingRevealAnimations — 스크롤하며 섹션이 하나씩 부드럽게
// 나타나는 효과. 외부 애니메이션 라이브러리 없이 IntersectionObserver +
// CSS transition만으로 구현(이 프로젝트의 "차트도 순수 SVG, 슬라이더도
// 순수 CSS/JS" 원칙과 동일한 방향). 뷰포트에 한 번 들어오면 그걸로 끝 —
// 스크롤을 위아래로 왔다갔다해도 다시 숨겨지지 않는다(반짝임 방지).
function initLandingRevealAnimations(container) {
  const targets = container.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) {
    targets.forEach(el => el.classList.add('is-visible'));
    return;
  }
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  targets.forEach(el => observer.observe(el));
}

// renderLandingPricing — 요금제 데이터는 /api/billing/config(공개 API,
// #/billing/plans의 renderPricingPlans와 같은 출처)를 그대로 재사용해
// 두 화면의 가격/기능 정보가 어긋나지 않게 한다. 카드의 CTA는 항상
// "가입하기"(#/auth/signup)로 보낸다 — 결제는 로그인 후 #/billing/plans
// 에서 진행. ⚠️2026-08-05: #/가 로그인 상태에서도 보이게 되면서(route()
// 참고) 이 가정이 "항상 비로그인"은 아니게 됐지만, 이번 변경 범위는
// 헤더 CTA 전환까지만 확정됐다 — 로그인 상태로 이 섹션까지 스크롤해
// "가입하기"를 눌러도 크게 깨지진 않는다(이미 로그인된 상태로 회원가입
// 화면에 진입할 뿐). 필요해지면 여기도 currentUser 분기 추가 검토.
async function renderLandingPricing(gridEl) {
  let config;
  try {
    config = await apiRequest('GET', '/api/billing/config');
  } catch (err) {
    gridEl.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
    return;
  }
  gridEl.innerHTML = config.plans.map(p => `
    <div class="landing-plan-card${p.plan === 'pro' ? ' landing-plan-card--highlight' : ''}">
      <h3 class="landing-plan-name">${escapeHtml(p.name)}</h3>
      <p class="landing-plan-price">${p.amount > 0 ? escapeHtml(formatBudget(p.amount)) + '<small>/월</small>' : '무료'}</p>
      <ul class="landing-plan-features">${(PLAN_FEATURES[p.plan] || []).map(f => `<li>${escapeHtml(f)}</li>`).join('')}</ul>
      <a href="#/auth/signup" class="home-cta-primary">가입하기</a>
    </div>
  `).join('');
}

// COMPANY_INFO_FOOTER_FIELDS — 푸터 회사정보 블록에 실제로 들어가는 7개
// 필드(partnershipEmail은 푸터가 아니라 "제휴 문의" 카드에 별도로 쓰여서
// 제외). "전부 비어있으면 블록 자체를 숨김" 판단도 이 7개 기준이다.
const COMPANY_INFO_FOOTER_FIELDS = ['companyName', 'businessRegistrationNumber', 'representativeName', 'address', 'mainPhone', 'contactEmail', 'patentNumber'];

// renderLandingCompanyInfo — GET /api/company-info(공개)를 읽어 푸터
// 회사정보 블록과 "제휴 문의" 카드의 이메일 줄을 채운다. 항목별로 비어
//있으면(null) 그 줄 자체를 안 만든다("라벨만 남는" 상태 방지) — 예를
// 들어 대표전화만 있고 이메일이 없으면 "대표전화: 02-1234-5678" 한
// 줄만 나오지 "· 이메일: " 같은 꼬리표가 안 남는다. 7개 필드가 전부
// 비어있으면 footerInfoEl 자체를 비워(CSS :empty로 자동 숨김) 블록
// 전체가 사라진다.
async function renderLandingCompanyInfo() {
  const footerInfoEl = document.getElementById('landing-footer-info');
  const partnershipLineEl = document.getElementById('landing-partnership-email-line');
  let info;
  try {
    info = await apiRequest('GET', '/api/company-info');
  } catch (err) {
    return; // 실패해도 조용히 무시 — 핵심 기능 아님, 빈 상태 그대로 둠
  }

  // 이 fetch는 이미 브랜드명(info.brandName)도 함께 받아왔으니, 별도
  // 요청 없이 헤더/사이드바/로고까지 한 번에 최신화한다(loadBrandName이
  // 부트 시점에 이미 한 번 호출하지만, 여기서 또 불러도 멱등이라 무해).
  applyBrandName(info.brandName);

  const hasAnyFooterField = COMPANY_INFO_FOOTER_FIELDS.some(k => info[k]);
  if (footerInfoEl) {
    if (!hasAnyFooterField) {
      footerInfoEl.innerHTML = '';
    } else {
      const lines = [];
      lines.push(info.companyName
        ? `<strong>${escapeHtml(currentBrandName)}</strong> (운영사: ${escapeHtml(info.companyName)})`
        : `<strong>${escapeHtml(currentBrandName)}</strong>`);
      const line2 = [
        info.businessRegistrationNumber ? `사업자등록번호: ${escapeHtml(info.businessRegistrationNumber)}` : '',
        info.representativeName ? `대표: ${escapeHtml(info.representativeName)}` : '',
        info.patentNumber ? `특허출원번호: ${escapeHtml(info.patentNumber)}` : '',
      ].filter(Boolean);
      if (line2.length) lines.push(line2.join(' · '));
      if (info.address) lines.push(`주소: ${escapeHtml(info.address)}`);
      const line4 = [
        info.mainPhone ? `대표전화: ${escapeHtml(info.mainPhone)}` : '',
        info.contactEmail ? `이메일: ${escapeHtml(info.contactEmail)}` : '',
      ].filter(Boolean);
      if (line4.length) lines.push(line4.join(' · '));
      footerInfoEl.innerHTML = lines.join('<br>');
    }
  }

  if (partnershipLineEl) {
    partnershipLineEl.textContent = info.partnershipEmail ? `문의: ${info.partnershipEmail}` : '';
  }
}

// ==================== 채팅형 온보딩(2026-08-05, 카드형 전면 재설계) ====================
// 카드형(Phase UX-03→UX-10)을 채팅형 대화 UI로 전면 교체 — 원상복구용
// 백업은 git tag onboarding-card-ux-backup-2026-08-05(커밋 3b6d36f)에
// 있다. 사업자등록증 유무를 첫 질문으로 물어보고("파일 첨부"/"직접
// 기재"), 이후 지역/업종/기업규모(필수)·업력/직원수/매출액/수행실적/
// 면허/인증/직접생산확인(선택)까지 전부 하나의 대화 로그 안에서 순차
// 진행한다. 사용자와 사전 확정한 설계(전체 시나리오 문서 검토 후 결정):
//  - 재진입 시 실제 채팅 로그를 서버에 저장하지 않는다 — 저장된 필드값
//    기준으로 이미 답한 항목은 로딩 없이 즉시 재구성(리플레이)하고
//    마지막 미답변 지점부터 라이브로 이어간다.
//  - ⚠️직원수/업력을 구간select로 받던 초기 결정은 2026-08-05에 뒤집혔다
//    — 구간 대표값이 정확한 수치처럼 저장되는 문제로 둘 다 폐지, 직원수는
//    숫자 직접입력, 업력은 개업일 기반 자동계산으로 전환(아래
//    ONBOARDING_CARD_DEFS/renderFoundingDateChatForm 주석 참고).
//  - 면허/인증/재무(매출액)/수행실적은 1차 구현에서 직접입력만 지원—
//    증빙파일 첨부는 2차로 미룬다. 사업자등록증 OCR과 4대보험 자동입력
//    (직원수)은 기존에 이미 있던 핵심 기능이라 그대로 유지한다.
//  - "재무"는 기존 온보딩 필드인 매출액(company_profiles.revenue_amount)
//    을 그대로 가리킨다 — 재무정보(company_financials, 결산연도 등
//    12개 필드짜리 정식 엔티티)는 예전부터 "온보딩엔 안 넣기로" 결정된
//    이력이 있어(성장분석 세션) 이번에도 범위 밖으로 유지.

// 채팅 로그/말풍선 공용 헬퍼. h()는 DocumentFragment를 반환하므로(2306행
// 근처 정의) appendChild 전에 firstElementChild로 실제 노드 참조를 미리
// 잡아둬야 한다 — append 후엔 프래그먼트 자체가 비워진다.
function chatLogEl() { return document.getElementById('onboarding-chat-log'); }
function scrollChatLogToBottom() {
  const el = chatLogEl();
  if (el) el.scrollTop = el.scrollHeight;
}
// appendBotBubbleRaw — 타이핑 효과 없이 즉시 전체 표시(로딩 인디케이터
// 등 "지금 이 순간의 상태"를 보여주는 버블용 — 로딩 점 애니메이션이
// 글자처럼 타이핑되면 오히려 부자연스럽다).
function appendBotBubbleRaw(html) {
  const log = chatLogEl();
  if (!log) return null;
  const frag = h(`<div class="chat-row chat-row--bot"><div class="chat-bubble chat-bubble--bot">${html}</div></div>`);
  const rowEl = frag.firstElementChild;
  log.appendChild(frag);
  scrollChatLogToBottom();
  return rowEl;
}

// CHAT_TYPING_MS_PER_CHAR — 글자당 타이핑 간격(2026-08-05 추가, 사용자
// 스펙: 20~30ms).
const CHAT_TYPING_MS_PER_CHAR = 24;

// chatTypingQueue — 모든 봇 말풍선의 타이핑 애니메이션을 전역 하나의
// 프로미스 체인으로 직렬화한다. ⚠️2026-08-05 재수정: 처음엔 말풍선마다
// 독립적인 setInterval을 호출 즉시 시작시켰는데, 예를 들어 인사말
// 두 번째 문장이 chatDelay(500)만 기다리고 뜨는 경우 첫 문장(타이핑에
// ~1000ms 이상 걸림)이 아직 끝나기 전에 두 번째 문장도 동시에 타이핑을
// 시작해버려 "여러 말풍선이 동시에 타이핑되는" 것처럼 보인다는 신고를
// 받았다 — 실제 카카오톡류 챗봇처럼 반드시 한 번에 하나씩만 타이핑되게
// 이 큐로 순서를 강제한다. appendBotBubble의 반환값(rowEl)을 쓰는
// 호출부가 없어(grep으로 확인) 굳이 동기 반환을 유지할 필요가 없었다.
let chatTypingQueue = Promise.resolve();

// appendBotBubble — 실제 봇 대화 말풍선(질문/피드백)에 타이핑 효과를
// 적용한다. html을 곧바로 innerHTML로 박아넣으면 태그 중간에서 잘려
// "<b>안녕하세" 같은 부서진 태그가 노출될 수 있어, 먼저 완성된 DOM
// 구조(태그는 전부 그대로)를 만들어두고 그 안의 텍스트 노드들만 순서대로
// 한 글자씩 채운다 — 구조 자체는 처음부터 완전하므로 부분 태그 노출
// 문제가 없다. 타이핑 중인 버블을 클릭하면 즉시 전체 표시로 건너뛴다.
function appendBotBubble(html) {
  chatTypingQueue = chatTypingQueue.then(() => new Promise((resolveTurn) => {
    const log = chatLogEl();
    if (!log) { resolveTurn(); return; }
    const rowFrag = h(`<div class="chat-row chat-row--bot"><div class="chat-bubble chat-bubble--bot"></div></div>`);
    const rowEl = rowFrag.firstElementChild;
    const bubbleEl = rowEl.querySelector('.chat-bubble');
    const contentFrag = h(`<span>${html}</span>`);
    const sourceRoot = contentFrag.firstElementChild;
    bubbleEl.appendChild(sourceRoot);

    const textNodes = [];
    (function collect(node) {
      node.childNodes.forEach((child) => {
        if (child.nodeType === Node.TEXT_NODE) textNodes.push(child);
        else collect(child);
      });
    })(sourceRoot);
    const fullTexts = textNodes.map((n) => n.data);
    textNodes.forEach((n) => { n.data = ''; });

    log.appendChild(rowFrag);
    scrollChatLogToBottom();

    const totalChars = fullTexts.reduce((sum, t) => sum + t.length, 0);
    if (totalChars === 0) { resolveTurn(); return; }

    bubbleEl.classList.add('chat-bubble--typing');
    let done = false;
    const finishNow = () => {
      if (done) return;
      done = true;
      if (rowEl._typingTimer) clearInterval(rowEl._typingTimer);
      textNodes.forEach((n, i) => { n.data = fullTexts[i]; });
      bubbleEl.classList.remove('chat-bubble--typing');
      scrollChatLogToBottom();
      resolveTurn();
    };
    bubbleEl.addEventListener('click', finishNow);

    let revealed = 0;
    rowEl._typingTimer = setInterval(() => {
      revealed += 1;
      let remaining = revealed;
      for (let i = 0; i < textNodes.length; i++) {
        const len = fullTexts[i].length;
        if (remaining >= len) { textNodes[i].data = fullTexts[i]; remaining -= len; }
        else if (remaining > 0) { textNodes[i].data = fullTexts[i].slice(0, remaining); remaining = 0; }
        else { textNodes[i].data = ''; }
      }
      scrollChatLogToBottom();
      if (revealed >= totalChars) finishNow();
    }, CHAT_TYPING_MS_PER_CHAR);
  }));
  return null;
}
function appendUserBubble(text) {
  appendUserBubbleHtml(escapeHtml(text));
}
function appendUserBubbleHtml(html) {
  const log = chatLogEl();
  if (!log) return null;
  const frag = h(`<div class="chat-row chat-row--user"><div class="chat-bubble chat-bubble--user">${html}</div></div>`);
  const rowEl = frag.firstElementChild;
  log.appendChild(frag);
  scrollChatLogToBottom();
  return rowEl;
}
function appendChatLoadingBubble(label) {
  return appendBotBubbleRaw(`<span class="chat-loading-dots"><span></span><span></span><span></span></span>${label ? ' ' + escapeHtml(label) : ''}`);
}
function removeChatRow(rowEl) {
  if (!rowEl) return;
  if (rowEl._typingTimer) clearInterval(rowEl._typingTimer);
  if (rowEl.parentNode) rowEl.parentNode.removeChild(rowEl);
}
function chatDelay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
function chatActionEl() { return document.getElementById('onboarding-chat-action'); }

// refreshOnboardingCoverageAndContinue — 저장 직후 completeness를 다시
// 조회해 상단 게이지를 갱신하고, 값이 실제로 바뀌었을 때만 "AI 분석
// 커버리지가 X% → Y%가 됐어요" 말풍선을 추가한 뒤 다음 단계로 넘어간다.
async function refreshOnboardingCoverageAndContinue(state, nextFn) {
  let fresh = null;
  try { fresh = await apiRequest('GET', '/api/me/profile-completeness'); } catch (err) { /* 재조회 실패해도 진행은 막지 않는다 */ }
  if (fresh) {
    const before = state.completeness.overallCompleteness;
    state.completeness = fresh;
    const slot = document.getElementById('onboarding-coverage-slot');
    if (slot) slot.innerHTML = onboardingCoverageBarHtml(fresh.overallCompleteness);
    if (fresh.overallCompleteness !== before) {
      const reachedGate = before < ONBOARDING_MIN_COMPLETENESS && fresh.overallCompleteness >= ONBOARDING_MIN_COMPLETENESS;
      appendBotBubble(`AI 분석 커버리지가 <b>${before}% → ${fresh.overallCompleteness}%</b>가 됐어요.${reachedGate ? ' 필수 정보를 모두 채우셨어요 🎉' : ''}`);
    }
  }
  nextFn(state);
}

// pushOnboardingBack/onboardingBackHandler — 공용 "이전 질문" 뒤로가기
// 스택(2026-08-05 추가). 첫 구현 때는 각 함수마다 "직전 화면이 뭔지"를
// 하드코딩해서 계산했는데(예: fieldIndex>0 ? ... : null), 사업자등록증
// 업로드/OCR결과확인/신원정보질문/필드큐 등 여러 하위 흐름을 오가다 보니
// 화면마다 빠뜨리는 경우가 계속 생겼다(실사용자 신고로 발견) — 대신
// "이 화면으로 오기 직전에 있던 화면을 다시 그리는 방법"을 매 전환마다
// state.backStack에 쌓아두고, [이전 질문]은 그 스택을 pop해서 그대로
// 다시 호출하기만 하면 되도록 통일했다. 스택이 비어있으면(맨 처음 질문)
// onBack이 null이라 버튼 자체가 안 뜬다.
function pushOnboardingBack(state, redrawPrevScreen) {
  state.backStack.push(redrawPrevScreen);
}
function onboardingBackHandler(state) {
  if (!state.backStack.length) return null;
  return () => {
    appendUserBubble('‹ 이전 질문');
    appendBotBubble('그럼 다시 여쭤볼게요.');
    const prev = state.backStack.pop();
    prev();
  };
}

// appendChatCardFooter — 2026-08-06, 온보딩 카드 공용 하단 푸터(이전/
// 건너뛰기). 예전엔 "이전 질문"(chat-chip, 카드마다 문구/스타일이 조금씩
// 다르게 하드코딩)과 "이전"(quick-form 안, btn-secondary — 완전히 다른
// 스타일)이 따로 있어서 카드 종류(파일첨부/선택형/폼)마다 위치·모양이
// 들쭉날쭉했다 — 이제 카드 콘텐츠를 그리는 함수는 onBack/onSkip 콜백만
// 넘기면 되고, 버튼 마크업 자체는 이 함수 하나가 항상 같은 자리(왼쪽
// 이전 · 오른쪽 건너뛰기)에 그린다. onBack/onSkip이 둘 다 없으면 아무것도
// 안 그린다(예: 맨 첫 질문).
function appendChatCardFooter(actionEl, onBack, onSkip) {
  if (!onBack && !onSkip) return;
  actionEl.insertAdjacentHTML('beforeend', `
    <div class="chat-card-footer">
      <div>${onBack ? '<button type="button" class="chat-footer-btn" id="chat-card-footer-back-btn">‹ 이전</button>' : ''}</div>
      <div>${onSkip ? '<button type="button" class="chat-footer-btn chat-footer-btn--skip" id="chat-card-footer-skip-btn">건너뛰기</button>' : ''}</div>
    </div>
  `);
  const backBtn = actionEl.querySelector('#chat-card-footer-back-btn');
  if (backBtn) backBtn.addEventListener('click', onBack);
  const skipBtn = actionEl.querySelector('#chat-card-footer-skip-btn');
  if (skipBtn) skipBtn.addEventListener('click', onSkip);
}

// renderOnboardingChat — #/onboarding/complete. 채팅형 온보딩 진입점.
// currentProfile이 아직 없는 신규 계정은 GET /api/dashboard·
// /api/me/profile-completeness가 둘 다 company_profile_required(400)로
// 거부한다(두 엔드포인트 전부 프로필 존재를 전제) — 그래서 프로필이
// 생기기 전에는 이 두 호출을 아예 하지 않고 0%로 시작, 회사 식별정보가
// 처음 저장된 뒤(ensureOnboardingFieldQueue)에야 조회한다.
async function renderOnboardingChat(container) {
  document.body.classList.add('is-auth');
  document.body.classList.remove('is-landing');
  container.innerHTML = '';

  const hasProfile = !!currentProfile;
  let completenessData = { overallCompleteness: 0 };
  if (hasProfile) {
    container.appendChild(h('<div class="loading">불러오는 중...</div>'));
    try {
      completenessData = await apiRequest('GET', '/api/me/profile-completeness');
    } catch (err) {
      container.innerHTML = '';
      container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
      return;
    }
  }

  container.innerHTML = '';
  container.appendChild(h(`
    <div class="detail-card onboarding-shell chat-shell">
      <div id="onboarding-coverage-slot">${onboardingCoverageBarHtml(completenessData.overallCompleteness)}</div>
      <div id="onboarding-chat-log" class="chat-log"></div>
      <div id="onboarding-chat-action" class="chat-action"></div>
    </div>
  `));

  const state = {
    container,
    completeness: completenessData,
    fieldQueue: null, // ensureOnboardingFieldQueue가 프로필이 생긴 뒤에 채운다.
    fieldIndex: 0,
    skipStreak: 0,
    warnedThisStreak: false,
    backStack: [], // pushOnboardingBack/onboardingBackHandler 참고.
  };

  if (hasProfile) {
    // 재진입(또는 이미 회사 식별정보를 일부/전부 채운 상태) — 인사말을
    // 처음부터 다시 묻지 않고 짧게 리플레이만 한 뒤 이어간다.
    appendBotBubble('안녕하세요! 다시 오셨네요 :) 이어서 진행할게요.');
    runOnboardingIdentityQueue(state);
    return;
  }

  appendBotBubble('안녕하세요! 공공사업 참여판단을 도와드릴게요 :)<br>몇 가지만 여쭤보고 바로 맞춤 공고를 찾아드릴게요.');
  await chatDelay(500);
  appendBotBubble('사업자등록증이 있어야 공공사업분석이 가능합니다.<br>준비되면 클릭해주세요!');
  renderOnboardingEntryChoiceAction(state);
}

function renderOnboardingEntryChoiceAction(state) {
  const actionEl = chatActionEl();
  actionEl.innerHTML = '';
  actionEl.appendChild(h(`
    <div class="chat-chip-row">
      <button type="button" class="chat-chip" id="onboarding-entry-upload-btn">📎 파일 첨부</button>
      <button type="button" class="chat-chip" id="onboarding-entry-manual-btn">✍️ 직접 기재</button>
    </div>
  `));
  document.getElementById('onboarding-entry-upload-btn').addEventListener('click', () => {
    appendUserBubble('📎 파일 첨부');
    pushOnboardingBack(state, () => renderOnboardingEntryChoiceAction(state));
    startOnboardingFileUploadFlow(state);
  });
  document.getElementById('onboarding-entry-manual-btn').addEventListener('click', () => {
    appendUserBubble('✍️ 직접 기재');
    pushOnboardingBack(state, () => renderOnboardingEntryChoiceAction(state));
    startOnboardingManualEntryIntro(state, false);
  });
}

// startOnboardingFileUploadFlow — 기존 business_registration.go의
// POST /api/me/business-registration/extract를 그대로 재사용(로직/엔드포인트
// 무변경, 화면 표현만 채팅 버블로 바뀜).
async function startOnboardingFileUploadFlow(state) {
  await chatDelay(300);
  appendBotBubble('사업자등록증 파일을 올려주세요.<br><span style="color:var(--ink-soft);font-size:0.85em">PDF, JPG, PNG, WEBP · 약 30초 소요</span>');
  const actionEl = chatActionEl();
  actionEl.innerHTML = '';
  const onBack = onboardingBackHandler(state);
  actionEl.appendChild(h(`
    <div>
      <input type="file" id="onboarding-biz-reg-file-input" accept=".pdf,.jpg,.jpeg,.png,.webp">
      <div id="onboarding-biz-reg-upload-error" class="error" style="display:none"></div>
    </div>
  `));
  appendChatCardFooter(actionEl, onBack, null);
  const fileInput = document.getElementById('onboarding-biz-reg-file-input');
  const errorBox = document.getElementById('onboarding-biz-reg-upload-error');
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    errorBox.style.display = 'none';
    fileInput.disabled = true;
    appendUserBubble(`📄 ${file.name} 첨부됨`);
    actionEl.innerHTML = '';
    const loadingRow = appendChatLoadingBubble();
    let data;
    try {
      data = await uploadCompanyRecordDocument('/api/me/business-registration/extract', file);
    } catch (err) {
      removeChatRow(loadingRow);
      appendBotBubble(`업로드에 실패했어요: ${escapeHtml(err.message)}`);
      startOnboardingFileUploadFlow(state);
      return;
    }
    removeChatRow(loadingRow);
    appendBotBubble('정상적으로 업로드되었습니다 :)');
    await chatDelay(300);
    const loadingRow2 = appendChatLoadingBubble('분석하고 있습니다...');
    await chatDelay(700);
    removeChatRow(loadingRow2);
    pushOnboardingBack(state, () => startOnboardingFileUploadFlow(state));
    showOnboardingBusinessRegResult(state, data.candidate || {});
  });
}

// showOnboardingBusinessRegResult — 이전 카드형의 renderBusinessRegistrationSummaryCard와
// 같은 정보(상호·지역·업종 요약)를 말풍선 카드로 보여준다. [직접 기재로
// 수정하기]는 경로 B(신원정보 질문 큐)로 넘어가되, currentProfile에
// OCR 후보값을 먼저 반영해 각 질문 폼이 프리필된 상태로 열리게 한다.
function showOnboardingBusinessRegResult(state, candidate) {
  const c = candidate || {};
  // 업종 정제(2026-08-08): OCR/AI가 업종을 "기타"로 판정했거나 비웠으면 관련성
  // 신호가 없는 값이라 저장하지 않고 비운다. 그러면 백엔드가 업종을 "missing"으로
  // 보고(scoreIndustry: 회사 업종 없음 → insufficient_data/company) 온보딩 필드
  // 큐가 업종 picker(직접 선택)를 띄운다 — 즉 "기타로 판정되면 직접 기재로 전환"이
  // 자연스럽게 이뤄진다. (조달 분류에 안 맞는 소매·요식업 등이 "기타"로 뭉뚱그려져
  // 무관 공고와 대량 매칭되던 문제 방지.)
  const rawIndustry = (c.industry || []).map(x => (x || '').trim()).filter(Boolean);
  const usableIndustry = rawIndustry.filter(x => x !== '기타');
  c.industry = usableIndustry;
  const companyLabel = c.companyName || '상호 미확인';
  const regionLabel = c.region || '지역 미확인';
  const industryLabel = usableIndustry.length ? usableIndustry.join(', ')
    : (rawIndustry.length ? '업종은 직접 선택할게요' : '업종 미확인');
  // businessAgeYears — 2026-08-05. 개업일을 따로 묻지 않고 사업자등록증
  // 추출값(c.foundingDate)에서 바로 계산해 요약에 보여준다. OCR이 개업일을
  // 못 읽었으면(빈 문자열) 그냥 안 보여준다 — 직접 기재 경로에서만 별도
  // 질문으로 물어본다(runOnboardingIdentityStep의 foundingDate 항목).
  const businessAge = computeBusinessAgeYears(c.foundingDate);
  const ageLabel = businessAge != null ? ` · 업력 약 ${businessAge}년` : '';
  appendBotBubble(`
    <div class="step-card-inline"><b>${escapeHtml(companyLabel)}</b><br>${escapeHtml(regionLabel)} · ${escapeHtml(industryLabel)}${escapeHtml(ageLabel)}</div>
    이렇게 확인했어요. 맞나요?
    ${publicBidFitBannerHtml(c.publicBidFit)}
  `);
  const actionEl = chatActionEl();
  actionEl.innerHTML = '';
  const onBack = onboardingBackHandler(state);
  actionEl.appendChild(h(`
    <div class="chat-chip-row">
      <button type="button" class="chat-chip" id="onboarding-bizreg-confirm-btn">✓ 맞습니다</button>
      <button type="button" class="chat-chip" id="onboarding-bizreg-edit-btn">✍️ 직접 기재로 수정하기</button>
    </div>
  `));
  appendChatCardFooter(actionEl, onBack, null);
  document.getElementById('onboarding-bizreg-confirm-btn').addEventListener('click', async () => {
    appendUserBubble('✓ 맞습니다');
    actionEl.innerHTML = '';
    const loadingRow = appendChatLoadingBubble();
    try {
      const data = await apiRequest('PUT', '/api/me/company-profile', {
        businessRegistrationNumber: c.businessRegistrationNumber || null,
        companyName: c.companyName || null,
        representativeName: c.representativeName || null,
        address: c.address || null,
        businessType: c.businessType || [],
        region: c.region || null,
        industry: c.industry || [],
        foundingDate: c.foundingDate || null,
      });
      currentProfile = data.companyProfile;
    } catch (err) {
      removeChatRow(loadingRow);
      appendBotBubble(`저장에 실패했어요: ${escapeHtml(err.message)}`);
      return;
    }
    removeChatRow(loadingRow);
    appendBotBubble('감사합니다! 등록했어요 :)');
    pushOnboardingBack(state, () => showOnboardingBusinessRegResult(state, c));
    await refreshOnboardingCoverageAndContinue(state, runOnboardingIdentityQueue);
  });
  document.getElementById('onboarding-bizreg-edit-btn').addEventListener('click', () => {
    appendUserBubble('✍️ 직접 기재로 수정하기');
    // 프로필이 아직 서버에 없으니(맞습니다를 안 눌렀으므로) OCR 후보값을
    // 임시로 currentProfile에 얹어 각 질문 폼이 프리필되게 한다 — 실제
    // 저장은 각 질문 답변마다 정상적으로 이루어진다.
    currentProfile = Object.assign({}, currentProfile, {
      businessRegistrationNumber: c.businessRegistrationNumber || null,
      companyName: c.companyName || null,
      representativeName: c.representativeName || null,
      address: c.address || null,
      businessType: c.businessType || [],
      region: c.region || null,
      industry: c.industry || [],
    });
    pushOnboardingBack(state, () => showOnboardingBusinessRegResult(state, c));
    startOnboardingManualEntryIntro(state, true);
  });
}

// startOnboardingManualEntryIntro — 경로 B 진입 인사말("사업자등록증이
// 없으시거나 직접 입력을 원하시는군요!"). isCorrection이면 OCR 결과를
// 고치러 온 것이라 문구만 다르게.
function startOnboardingManualEntryIntro(state, isCorrection) {
  chatDelay(300).then(() => {
    appendBotBubble(isCorrection
      ? '알겠습니다! 사업자 정보를 다시 확인할게요.<br>질문해도 될까요?'
      : '사업자등록증이 없으시거나 직접 입력을 원하시는군요!<br>사업자 정보 몇 가지만 여쭤볼게요. 질문해도 될까요?');
    const actionEl = chatActionEl();
    actionEl.innerHTML = '';
    const onBack = onboardingBackHandler(state);
    actionEl.appendChild(h(`
      <div class="chat-chip-row">
        <button type="button" class="chat-chip" id="onboarding-manual-proceed-btn">네, 진행할게요</button>
      </div>
    `));
    appendChatCardFooter(actionEl, onBack, null);
    document.getElementById('onboarding-manual-proceed-btn').addEventListener('click', () => {
      appendUserBubble('네, 진행할게요');
      pushOnboardingBack(state, () => startOnboardingManualEntryIntro(state, isCorrection));
      runOnboardingIdentityQueue(state, isCorrection);
    });
  });
}

// ---- 경로 B(직접 기재) 4문항 중 지역/업종을 뺀 3개: 상호명/사업자등록
// 번호/업태. 지역·업종·기업규모는 이미 있는 필수 필드큐(ONBOARDING_CARD_DEFS,
// 지역=presence/업종·기업규모=judged)를 그대로 재사용한다(중복 정의 안 함)
// — 즉 이 3개 + 필수 필드큐 3개를 합치면 사용자 스펙의 "4개 필수 질문 +
// 지역/업종/기업규모"가 정확히 나온다.
const BUSINESS_TYPE_OPTIONS = ['제조업', '도매 및 소매업', '건설업', '정보통신업', '서비스업'];

function renderBusinessTypeChatForm(container, onSaved) {
