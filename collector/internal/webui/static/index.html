<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 공공입찰 공고 — 공공사업 참여판단 데이터 플랫폼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16233F;
    --ink-soft: #5B6472;
    --paper: #EDE9DE;
    --paper-raise: #F6F4EC;
    --hairline: #CBC3AE;
    --seal: #A3342A;
    --seal-soft: #C75B4F;
    --ok: #2F6B4C;
    --warn: #B4791F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--seal); }

  /* ---------- Masthead ---------- */
  .masthead {
    background: var(--paper);
    border-bottom: 3px solid var(--ink);
    padding: 1.75rem 1.5rem 1.25rem;
  }
  .masthead-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .brand-link { text-decoration: none; color: inherit; }
  .masthead-eyebrow {
    margin: 0 0 0.35rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .masthead-title {
    margin: 0;
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: clamp(1.5rem, 4vw, 2.25rem);
    letter-spacing: -0.01em;
  }
  .auth-nav {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    padding-bottom: 0.3rem;
  }
  .auth-nav a, .link-btn {
    color: var(--seal);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .auth-nav a:hover, .link-btn:hover { border-bottom-color: var(--seal); }
  .link-btn { background: none; border: none; padding: 0; font: inherit; cursor: pointer; }

  main { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  /* ---------- Filters ---------- */
  .filters {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-bottom: 1.75rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--hairline);
  }
  .filters input {
    padding: 0.55rem 0.75rem;
    border: 1px solid var(--hairline);
    background: var(--paper-raise);
    color: var(--ink);
    border-radius: 2px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.9rem;
  }
  .filters input[name="q"] { flex: 1; min-width: 200px; }
  .filters button {
    padding: 0.55rem 1.25rem;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    border-radius: 2px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    letter-spacing: 0.05em;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 1.5rem;
    color: var(--seal);
    text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
  }

  /* ---------- Ledger list ---------- */
  .ledger { border-top: 1px solid var(--hairline); }
  .ledger-row {
    display: grid;
    grid-template-columns: 3rem 1fr auto;
    gap: 1.25rem;
    align-items: center;
    padding: 1.25rem 0;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
  }
  .ledger-row:hover { background: rgba(163, 52, 42, 0.05); }
  .ledger-num {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-soft);
    font-size: 0.85rem;
    border-right: 1px solid var(--hairline);
    align-self: stretch;
    display: flex;
    align-items: flex-start;
    padding-top: 0.15rem;
  }
  .ledger-main { min-width: 0; border-right: 1px solid var(--hairline); padding-right: 1.25rem; }
  .ledger-org {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 0.35rem;
  }
  .ledger-title {
    font-family: 'Source Serif 4', serif;
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.35;
    margin: 0 0 0.5rem;
    color: var(--ink);
  }
  .ledger-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .ledger-meta .dot { color: var(--hairline); }
  .ledger-seal { display: flex; justify-content: center; }

  .seal {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 2px solid var(--seal);
    color: var(--seal);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 0.72rem;
    transform: rotate(-7deg);
    mix-blend-mode: multiply;
    text-align: center;
    line-height: 1.15;
    flex-shrink: 0;
  }
  .seal--warn { border-color: var(--warn); color: var(--warn); }
  .seal--past { border-color: var(--ink-soft); color: var(--ink-soft); }
  .seal--inline {
    width: 44px;
    height: 44px;
    font-size: 0.6rem;
  }

  .status-badge {
    display: inline-block;
    padding: 0.1rem 0.5rem;
    border: 1px solid var(--hairline);
    border-radius: 2px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--ok);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .empty, .loading, .error {
    color: var(--ink-soft);
    padding: 3rem 0;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
  }
  .error { color: var(--seal); }

  /* ---------- Detail ---------- */
  .detail-card {
    border: 1px solid var(--hairline);
    background: var(--paper-raise);
    padding: 1.75rem;
    margin-bottom: 2rem;
  }
  .detail-card h2 {
    margin: 0.25rem 0 0;
    font-family: 'Source Serif 4', serif;
    font-size: 1.5rem;
    line-height: 1.35;
  }
  .detail-meta {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1rem;
    margin: 1.25rem 0 0;
    padding-top: 1.25rem;
    border-top: 1px solid var(--hairline);
  }
  .detail-meta dt {
    margin: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .detail-meta dd {
    margin: 0.3rem 0 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.92rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .official-link {
    display: inline-block;
    margin-top: 1rem;
    color: var(--seal);
    text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--seal-soft);
  }

  h3 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.1rem;
    margin: 0 0 0.75rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--hairline);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
  }
  th, td {
    text-align: left;
    padding: 0.6rem 0.5rem;
    border-bottom: 1px solid var(--hairline);
    vertical-align: top;
  }
  th {
    color: var(--ink-soft);
    font-weight: 500;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .importance-critical { color: var(--seal); font-weight: 600; }
  .importance-major { color: var(--warn); }
  .importance-minor { color: var(--ink-soft); }

  /* ---------- Eligibility check ---------- */
  .eligibility-check-btn {
    padding: 0.6rem 1.1rem;
    border: 1px solid var(--seal);
    background: var(--seal);
    color: var(--paper-raise);
    border-radius: 2px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    letter-spacing: 0.04em;
  }
  .eligibility-check-btn:hover { background: var(--seal-soft); border-color: var(--seal-soft); }
  .eligibility-check-btn:disabled { opacity: 0.6; cursor: default; }
  .eligibility-disclaimer {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--warn);
    border: 1px dashed var(--warn);
    padding: 0.6rem 0.8rem;
    margin: 1rem 0 0.5rem;
    background: rgba(180, 121, 31, 0.08);
  }
  .elig-overall {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.88rem;
  }
  .elig-list {
    border-top: 1px solid var(--hairline);
    margin: 0.75rem 0 0;
    padding: 0;
    list-style: none;
  }
  .elig-item {
    padding: 0.9rem 0;
    border-bottom: 1px solid var(--hairline);
  }
  .elig-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
  }
  .elig-category {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .elig-result {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 0.85rem;
  }
  .elig-result--met { color: var(--ok); }
  .elig-result--not_met { color: var(--seal); }
  .elig-result--needs_confirmation { color: var(--warn); }
  .elig-result--insufficient_data { color: var(--ink-soft); }
  .elig-reason {
    margin: 0.4rem 0 0;
    font-size: 0.85rem;
    color: var(--ink);
  }

  /* ---------- Auth / profile forms ---------- */
  .auth-card {
    max-width: 380px;
    margin: 0 auto;
    border: 1px solid var(--hairline);
    background: var(--paper-raise);
    padding: 2rem;
  }
  .auth-card h2 {
    margin-top: 0;
    font-family: 'Source Serif 4', serif;
    font-size: 1.4rem;
    text-align: center;
  }
  .auth-form, .profile-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .profile-form {
    max-width: 520px;
    margin: 0 auto;
  }
  .auth-form label, .profile-form label {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .checkbox-label {
    flex-direction: row !important;
    align-items: center;
    gap: 0.6rem !important;
    text-transform: none;
  }
  .field-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .field-group-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .checkbox-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 0.5rem 1rem;
    border: 1px solid var(--hairline);
    padding: 0.75rem;
    background: #fff;
  }
  .checkbox-grid .checkbox-label {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
  }
  .auth-form input, .profile-form input {
    padding: 0.6rem 0.7rem;
    border: 1px solid var(--hairline);
    background: #fff;
    color: var(--ink);
    border-radius: 2px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.95rem;
  }
  .auth-form button, .profile-form button {
    padding: 0.7rem 1rem;
    border: 1px solid var(--seal);
    background: var(--seal);
    color: var(--paper-raise);
    border-radius: 2px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    margin-top: 0.5rem;
  }
  .auth-form button:hover, .profile-form button:hover {
    background: var(--seal-soft);
    border-color: var(--seal-soft);
  }
  .auth-switch {
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-top: 1.25rem;
  }
  .success { color: var(--ok); font-size: 0.85rem; }
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <a href="#/" class="brand-link">
      <p class="masthead-eyebrow">공공사업 참여판단 데이터 플랫폼</p>
      <h1 class="masthead-title">오늘의 공공입찰 공고</h1>
    </a>
    <nav id="auth-nav" class="auth-nav"></nav>
  </div>
</header>
<main id="app"></main>

<script>
const app = document.getElementById('app');

function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content; }

function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return '-';
  return d.toISOString().slice(0, 10);
}

function formatBudget(n) {
  if (n === null || n === undefined) return '-';
  return Number(n).toLocaleString('ko-KR') + '원';
}

// 마감일을 원형 도장 배지로 표시: D-5 이내는 경고색, 마감 지나면 무채색.
function sealInfo(iso) {
  if (!iso) return { label: '-', cls: '' };
  const d = new Date(iso);
  if (isNaN(d)) return { label: '-', cls: '' };
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(d);
  target.setHours(0, 0, 0, 0);
  const diffDays = Math.round((target - today) / 86400000);
  if (diffDays < 0) return { label: '마감', cls: 'seal--past' };
  if (diffDays === 0) return { label: 'D-DAY', cls: 'seal--warn' };
  if (diffDays <= 5) return { label: 'D-' + diffDays, cls: 'seal--warn' };
  return { label: 'D-' + diffDays, cls: '' };
}

function sealBadgeHtml(iso, extraClass) {
  const info = sealInfo(iso);
  return `<div class="seal ${info.cls} ${extraClass || ''}">${escapeHtml(info.label)}</div>`;
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('요청 실패 (' + res.status + ')');
  return res.json();
}

const ERROR_MESSAGES = {
  invalid_email: '이메일 형식이 올바르지 않습니다.',
  password_too_short: '비밀번호는 최소 8자 이상이어야 합니다.',
  email_already_registered: '이미 가입된 이메일입니다.',
  invalid_credentials: '이메일 또는 비밀번호가 올바르지 않습니다.',
  unauthorized: '로그인이 필요합니다.',
  invalid_body: '요청 형식이 올바르지 않습니다.',
  query_failed: '서버 처리 중 오류가 발생했습니다.',
  internal_error: '서버 처리 중 오류가 발생했습니다.',
  notice_not_found: '공고를 찾을 수 없습니다.',
  company_profile_required: '기업 프로필이 없습니다. 먼저 기업 프로필을 등록해주세요.',
  invalid_industry_group: '알 수 없는 업종 분류입니다.',
};

const ELIGIBILITY_RESULT_LABELS = {
  met: '충족',
  not_met: '미충족',
  needs_confirmation: '확인 필요',
  insufficient_data: '데이터 부족',
};

async function apiRequest(method, url, body) {
  const opts = { method };
  if (body !== undefined) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(url, opts);
  let data = null;
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) {
    const code = data && data.error;
    const err = new Error((code && ERROR_MESSAGES[code]) || ('요청 실패 (' + res.status + ')'));
    err.code = code;
    err.status = res.status;
    throw err;
  }
  return data;
}

let currentUser = null;
let currentProfile = null;

async function loadMe() {
  try {
    const data = await apiRequest('GET', '/api/me');
    currentUser = data.user;
    currentProfile = data.companyProfile;
  } catch (err) {
    currentUser = null;
    currentProfile = null;
  }
  renderHeader();
}

function renderHeader() {
  const nav = document.getElementById('auth-nav');
  if (currentUser) {
    nav.innerHTML = '';
    nav.appendChild(h(`
      <a href="#/me/profile">내 프로필</a>
      <button type="button" id="logout-btn" class="link-btn">로그아웃</button>
    `));
    document.getElementById('logout-btn').addEventListener('click', async () => {
      try { await apiRequest('POST', '/api/auth/logout'); } catch (err) { /* ignore */ }
      currentUser = null;
      currentProfile = null;
      renderHeader();
      location.hash = '#/';
    });
  } else {
    nav.innerHTML = '';
    nav.appendChild(h(`
      <a href="#/auth/login">로그인</a>
      <a href="#/auth/signup">회원가입</a>
    `));
  }
}

function renderList(container) {
  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  container.innerHTML = '';
  container.appendChild(h(`
    <form class="filters" id="filter-form">
      <input type="text" name="q" placeholder="공고명 검색" value="${params.get('q') || ''}">
      <input type="text" name="region" placeholder="지역" value="${params.get('region') || ''}">
      <input type="text" name="industry" placeholder="업종" value="${params.get('industry') || ''}">
      <button type="submit">검색</button>
    </form>
    <div id="list-body" class="loading">불러오는 중...</div>
  `));

  document.getElementById('filter-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const p = new URLSearchParams();
    for (const [k, v] of fd.entries()) if (v) p.set(k, v);
    location.hash = '#/?' + p.toString();
  });

  const listBody = document.getElementById('list-body');
  const apiParams = new URLSearchParams();
  if (params.get('q')) apiParams.set('q', params.get('q'));
  if (params.get('region')) apiParams.set('region', params.get('region'));
  if (params.get('industry')) apiParams.set('industry', params.get('industry'));

  fetchJSON('/api/notices?' + apiParams.toString())
    .then(data => {
      if (!data.items || data.items.length === 0) {
        listBody.className = 'empty';
        listBody.textContent = '조건에 맞는 공고가 없습니다.';
        return;
      }
      const rows = data.items.map((n, i) => `
        <div class="ledger-row" data-id="${n.id}">
          <div class="ledger-num">${String(i + 1).padStart(3, '0')}</div>
          <div class="ledger-main">
            <div class="ledger-org">${escapeHtml(n.organizationName || '-')}</div>
            <div class="ledger-title">${escapeHtml(n.title)}</div>
            <div class="ledger-meta">
              <span>${escapeHtml(n.region || '-')}</span>
              <span class="dot">·</span>
              <span>${escapeHtml(n.industry || '-')}</span>
              <span class="dot">·</span>
              <span>${formatBudget(n.budgetAmount)}</span>
              <span class="dot">·</span>
              <span class="status-badge">${escapeHtml(n.status || '-')}</span>
            </div>
          </div>
          <div class="ledger-seal">${sealBadgeHtml(n.applicationEndAt)}</div>
        </div>
      `).join('');
      listBody.className = '';
      listBody.innerHTML = '';
      listBody.appendChild(h(`<div class="ledger">${rows}</div>`));
      listBody.querySelectorAll('.ledger-row').forEach(row => {
        row.addEventListener('click', () => {
          location.hash = '#/notices/' + row.dataset.id;
        });
      });
    })
    .catch(err => {
      listBody.className = 'error';
      listBody.textContent = err.message;
    });
}

function renderDetail(container, id) {
  container.innerHTML = '';
  container.appendChild(h(`
    <a href="#/" class="back-link">&larr; 목록으로</a>
    <div id="detail-body" class="loading">불러오는 중...</div>
  `));
  const body = document.getElementById('detail-body');

  fetchJSON('/api/notices/' + encodeURIComponent(id))
    .then(data => {
      const n = data.notice;
      const changes = data.changes || [];
      const changeRows = changes.length
        ? changes.map(c => `
            <tr>
              <td>${escapeHtml(c.field)}</td>
              <td>${escapeHtml(c.oldValue || '-')}</td>
              <td>${escapeHtml(c.newValue || '-')}</td>
              <td class="importance-${escapeHtml(c.importance || 'minor')}">${escapeHtml(c.importance || '-')}</td>
              <td>${formatDate(c.createdAt)}</td>
            </tr>
          `).join('')
        : '';

      body.className = '';
      body.innerHTML = '';
      body.appendChild(h(`
        <div class="detail-card">
          <p class="masthead-eyebrow">${escapeHtml(n.organizationName || '-')}</p>
          <h2>${escapeHtml(n.title)}</h2>
          <dl class="detail-meta">
            <div><dt>발주기관</dt><dd>${escapeHtml(n.organizationName || '-')}</dd></div>
            <div><dt>지역</dt><dd>${escapeHtml(n.region || '-')}</dd></div>
            <div><dt>업종</dt><dd>${escapeHtml(n.industry || '-')}</dd></div>
            <div><dt>상태</dt><dd>${escapeHtml(n.status || '-')}</dd></div>
            <div><dt>마감일</dt><dd>${sealBadgeHtml(n.applicationEndAt, 'seal--inline')}${formatDate(n.applicationEndAt)}</dd></div>
            <div><dt>예산</dt><dd>${formatBudget(n.budgetAmount)}</dd></div>
            <div><dt>버전</dt><dd>v${n.currentVersion}</dd></div>
          </dl>
          ${n.officialUrl ? `<a class="official-link" href="${escapeAttr(n.officialUrl)}" target="_blank" rel="noopener">원문 공고 보기 &rarr;</a>` : ''}
        </div>
        <h3>우리 회사 적합성 확인</h3>
        <div id="eligibility-section"></div>
        <h3>변경 이력</h3>
        ${changeRows
          ? `<table>
              <thead><tr><th>항목</th><th>이전 값</th><th>변경 값</th><th>중요도</th><th>일시</th></tr></thead>
              <tbody>${changeRows}</tbody>
            </table>`
          : '<p class="empty">변경 이력이 없습니다.</p>'}
      `));
      renderEligibilitySection(document.getElementById('eligibility-section'), id);
    })
    .catch(err => {
      body.className = 'error';
      body.textContent = err.message;
    });
}

function renderEligibilityResult(container, data) {
  const overall = data.overallResult;
  const itemsHtml = data.items.map(it => `
    <li class="elig-item">
      <div class="elig-head">
        <span class="elig-category">${escapeHtml(it.category)}</span>
        <span class="elig-result elig-result--${escapeHtml(it.result)}">${escapeHtml(ELIGIBILITY_RESULT_LABELS[it.result] || it.result)}</span>
      </div>
      <p class="elig-reason">${escapeHtml(it.reason)}</p>
    </li>
  `).join('');

  container.innerHTML = '';
  container.appendChild(h(`
    <div class="eligibility-disclaimer">⚠ ${escapeHtml(data.disclaimer)}</div>
    <p class="elig-overall">종합 결과:
      <span class="elig-result elig-result--${escapeHtml(overall)}">${escapeHtml(ELIGIBILITY_RESULT_LABELS[overall] || overall)}</span>
    </p>
    <ul class="elig-list">${itemsHtml}</ul>
  `));
}

function renderEligibilitySection(container, noticeId) {
  container.innerHTML = '';
  container.appendChild(h(`
    <button type="button" id="eligibility-btn" class="eligibility-check-btn">우리 회사 적합성 확인</button>
    <div id="eligibility-result"></div>
  `));

  document.getElementById('eligibility-btn').addEventListener('click', async () => {
    const btn = document.getElementById('eligibility-btn');
    const resultBox = document.getElementById('eligibility-result');

    if (!currentUser) {
      location.hash = '#/auth/login';
      return;
    }

    btn.disabled = true;
    btn.textContent = '확인 중...';
    resultBox.innerHTML = '';
    try {
      const data = await apiRequest('POST', '/api/notices/' + encodeURIComponent(noticeId) + '/evaluate');
      renderEligibilityResult(resultBox, data);
    } catch (err) {
      if (err.status === 401) {
        location.hash = '#/auth/login';
      } else if (err.code === 'company_profile_required') {
        resultBox.appendChild(h(
          '<p class="error">기업 프로필을 먼저 등록해야 합니다. <a href="#/me/profile">기업 프로필 등록하기</a></p>'
        ));
      } else {
        resultBox.className = 'error';
        resultBox.textContent = err.message;
      }
    } finally {
      btn.disabled = false;
      btn.textContent = '우리 회사 적합성 확인';
    }
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function renderSignup(container) {
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="auth-card">
      <h2>회원가입</h2>
      <form id="signup-form" class="auth-form">
        <label>이메일<input type="email" name="email" required></label>
        <label>비밀번호 (최소 8자)<input type="password" name="password" minlength="8" required></label>
        <div id="signup-error" class="error" style="display:none"></div>
        <button type="submit">가입하기</button>
      </form>
      <p class="auth-switch">이미 계정이 있으신가요? <a href="#/auth/login">로그인</a></p>
    </div>
  `));
  const form = document.getElementById('signup-form');
  const errorBox = document.getElementById('signup-error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    try {
      const data = await apiRequest('POST', '/api/auth/signup', {
        email: fd.get('email'), password: fd.get('password'),
      });
      currentUser = { id: data.id, email: data.email, role: 'user', plan: 'free' };
      currentProfile = null;
      renderHeader();
      location.hash = '#/me/profile';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

function renderLogin(container) {
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="auth-card">
      <h2>로그인</h2>
      <form id="login-form" class="auth-form">
        <label>이메일<input type="email" name="email" required></label>
        <label>비밀번호<input type="password" name="password" required></label>
        <div id="login-error" class="error" style="display:none"></div>
        <button type="submit">로그인</button>
      </form>
      <p class="auth-switch">계정이 없으신가요? <a href="#/auth/signup">회원가입</a></p>
    </div>
  `));
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('login-error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    try {
      const data = await apiRequest('POST', '/api/auth/login', {
        email: fd.get('email'), password: fd.get('password'),
      });
      currentUser = { id: data.id, email: data.email };
      renderHeader();
      await loadMe();
      location.hash = '#/';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// eligibility.go의 industryGroups와 순서·값 모두 일치해야 한다.
const INDUSTRY_GROUPS = [
  'ICT/SW', '연구/조사/컨설팅', '설계/감리/CM', '행사/홍보/미디어',
  '시설관리/유지보수', '환경/폐기물', '생활서비스', '전문서비스', '교육', '기타',
];

function fillProfileForm(form, profile) {
  if (!profile) return;
  form.businessType.value = (profile.businessType || []).join(', ');
  form.region.value = profile.region || '';
  const selectedIndustry = new Set(profile.industry || []);
  form.querySelectorAll('input[name="industry"]').forEach(cb => {
    cb.checked = selectedIndustry.has(cb.value);
  });
  form.businessAgeYears.value = profile.businessAgeYears ?? '';
  form.revenueAmount.value = profile.revenueAmount ?? '';
  form.employeeCount.value = profile.employeeCount ?? '';
  form.companySize.value = profile.companySize || '';
  form.licenses.value = (profile.licenses || []).join(', ');
  form.certifications.value = (profile.certifications || []).join(', ');
  form.directProductionCert.checked = !!profile.directProductionCert;
  form.maxPerformanceAmount.value = profile.maxPerformanceAmount ?? '';
  form.creditRating.value = profile.creditRating || '';
}

async function renderProfile(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let me;
  try {
    me = await apiRequest('GET', '/api/me');
  } catch (err) {
    location.hash = '#/auth/login';
    return;
  }
  currentUser = me.user;
  currentProfile = me.companyProfile;
  renderHeader();

  container.innerHTML = '';
  container.appendChild(h(`
    <div class="detail-card">
      <h2>기업 프로필</h2>
      <form id="profile-form" class="profile-form">
        <label>업태 (쉼표로 구분, 겸업 시 여러 개 등록 가능)<input type="text" name="businessType"></label>
        <label>지역<input type="text" name="region"></label>
        <div class="field-group">
          <span class="field-group-label">업종 (겸업 시 여러 개 선택 가능 — 하나라도 일치하면 적합 판정)</span>
          <div class="checkbox-grid">
            ${INDUSTRY_GROUPS.map(g => `
              <label class="checkbox-label"><input type="checkbox" name="industry" value="${escapeAttr(g)}"> ${escapeHtml(g)}</label>
            `).join('')}
          </div>
        </div>
        <label>업력(년)<input type="number" step="0.1" name="businessAgeYears"></label>
        <label>매출액(원)<input type="number" name="revenueAmount"></label>
        <label>직원 수<input type="number" name="employeeCount"></label>
        <label>기업 규모<input type="text" name="companySize" placeholder="소기업/소상공인/중기업 등"></label>
        <label>보유 면허 (쉼표로 구분)<input type="text" name="licenses"></label>
        <label>보유 인증 (쉼표로 구분)<input type="text" name="certifications"></label>
        <label class="checkbox-label"><input type="checkbox" name="directProductionCert"> 직접생산확인증명 보유</label>
        <label>최근 3년 최대 실적(원)<input type="number" name="maxPerformanceAmount"></label>
        <label>신용등급<input type="text" name="creditRating"></label>
        <div id="profile-error" class="error" style="display:none"></div>
        <div id="profile-success" class="success" style="display:none"></div>
        <button type="submit">저장</button>
      </form>
    </div>
  `));

  const form = document.getElementById('profile-form');
  const errorBox = document.getElementById('profile-error');
  const successBox = document.getElementById('profile-success');
  fillProfileForm(form, currentProfile);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    successBox.style.display = 'none';
    const fd = new FormData(form);
    const toNum = (v) => (v === '' || v === null ? null : Number(v));
    const toList = (v) => (v || '').split(',').map(s => s.trim()).filter(Boolean);
    const payload = {
      businessType: toList(fd.get('businessType')),
      region: fd.get('region') || null,
      industry: fd.getAll('industry'),
      businessAgeYears: toNum(fd.get('businessAgeYears')),
      revenueAmount: toNum(fd.get('revenueAmount')),
      employeeCount: toNum(fd.get('employeeCount')),
      companySize: fd.get('companySize') || null,
      licenses: toList(fd.get('licenses')),
      certifications: toList(fd.get('certifications')),
      directProductionCert: fd.get('directProductionCert') === 'on',
      maxPerformanceAmount: toNum(fd.get('maxPerformanceAmount')),
      creditRating: fd.get('creditRating') || null,
    };
    try {
      const data = await apiRequest('PUT', '/api/me/company-profile', payload);
      currentProfile = data.companyProfile;
      successBox.textContent = '저장되었습니다.';
      successBox.style.display = 'block';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

function route() {
  const hash = location.hash || '#/';
  const path = hash.split('?')[0];
  if (path === '#/auth/signup') { renderSignup(app); return; }
  if (path === '#/auth/login') { renderLogin(app); return; }
  if (path === '#/me/profile') { renderProfile(app); return; }
  const detailMatch = path.match(/^#\/notices\/(.+)$/);
  if (detailMatch) {
    renderDetail(app, decodeURIComponent(detailMatch[1]));
  } else {
    renderList(app);
  }
}

window.addEventListener('hashchange', route);
loadMe();
route();
</script>
