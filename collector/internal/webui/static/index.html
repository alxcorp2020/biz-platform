  const current = (p.businessType || [])[0] || '';
  const isOther = !!current && !BUSINESS_TYPE_OPTIONS.includes(current);
  container.innerHTML = '';
  container.appendChild(h(`
    <form id="quick-business-type-form" class="profile-form">
      <label>업태
        <select name="businessTypeOption" class="select-input" required>
          <option value="">선택해주세요</option>
          ${BUSINESS_TYPE_OPTIONS.map(o => `<option value="${escapeAttr(o)}" ${o === current ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('')}
          <option value="__other__" ${isOther ? 'selected' : ''}>기타(직접 입력)</option>
        </select>
      </label>
      <label id="quick-business-type-other-wrap" style="display:${isOther ? '' : 'none'}">직접 입력<input type="text" name="businessTypeOther" value="${escapeAttr(isOther ? current : '')}"></label>
      <div id="quick-business-type-error" class="error" style="display:none"></div>
      ${onboardingQuickFormButtonsHtml()}
    </form>
  `));
  const form = document.getElementById('quick-business-type-form');
  const otherWrap = document.getElementById('quick-business-type-other-wrap');
  form.businessTypeOption.addEventListener('change', () => {
    otherWrap.style.display = form.businessTypeOption.value === '__other__' ? '' : 'none';
  });
  const errorBox = document.getElementById('quick-business-type-error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    const sel = fd.get('businessTypeOption');
    const finalValue = sel === '__other__' ? (fd.get('businessTypeOther') || '').trim() : sel;
    if (!finalValue) {
      errorBox.textContent = '업태를 입력해주세요.';
      errorBox.style.display = 'block';
      return;
    }
    try {
      const data = await apiRequest('PUT', '/api/me/company-profile', companyProfileUpdatePayload({ businessType: [finalValue] }));
      currentProfile = data.companyProfile;
      onSaved();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// renderFoundingDateChatForm — 2026-08-05. 사업자등록증이 없는(직접 기재)
// 경로 전용 4번째 신원정보 질문. 업력을 직접 묻지 않고 개업일만 받아
// computeBusinessAgeYears로 역산해 저장한다 — OCR 경로(showOnboardingBusinessRegResult)와
// 동일한 계산식.
function renderFoundingDateChatForm(container, onSaved) {
  const today = new Date().toISOString().slice(0, 10);
  container.innerHTML = '';
  container.appendChild(h(`
    <form id="quick-founding-date-form" class="profile-form">
      <label>개업일<input type="date" name="foundingDate" max="${today}" required></label>
      <div id="quick-founding-date-error" class="error" style="display:none"></div>
      ${onboardingQuickFormButtonsHtml()}
    </form>
  `));
  const form = document.getElementById('quick-founding-date-form');
  const errorBox = document.getElementById('quick-founding-date-error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const val = new FormData(form).get('foundingDate');
    if (computeBusinessAgeYears(val) == null) {
      errorBox.textContent = '올바른 개업일을 입력해주세요.';
      errorBox.style.display = 'block';
      return;
    }
    try {
      const data = await apiRequest('PUT', '/api/me/company-profile', companyProfileUpdatePayload({ foundingDate: val }));
      currentProfile = data.companyProfile;
      onSaved();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

const ONBOARDING_IDENTITY_FIELD_DEFS = [
  { fieldKey: 'companyName', prompt: '상호명이 어떻게 되나요?', render: renderCompanyNameChatForm, echo: (p) => p.companyName || '' },
  { fieldKey: 'businessRegistrationNumber', prompt: '사업자등록번호가 어떻게 되나요?<br><span style="color:var(--ink-soft);font-size:0.85em">000-00-00000 형식으로 자동 변환돼요</span>', render: renderBusinessRegNumberChatForm, echo: (p) => p.businessRegistrationNumber || '' },
  { fieldKey: 'businessType', prompt: '업태가 어떻게 되나요?', render: renderBusinessTypeChatForm, echo: (p) => (p.businessType || [])[0] || '' },
  { fieldKey: 'foundingDate', prompt: '개업일이 언제인가요?<br><span style="color:var(--ink-soft);font-size:0.85em">업력을 자동으로 계산해드려요</span>', render: renderFoundingDateChatForm, echo: (p) => p.businessAgeYears != null ? `업력 약 ${p.businessAgeYears}년으로 계산했어요` : '' },
];

// buildOnboardingIdentityQueue(force) — force가 true면(경로 A OCR 결과를
// "직접 기재로 수정하기") 이미 값이 채워져 있어도 4개 전부 다시 묻는다.
// ⚠️2026-08-05 버그 수정: showOnboardingBusinessRegResult의 [직접 기재로
// 수정하기]가 OCR 후보값을 currentProfile에 미리 채워넣은 뒤(폼 프리필
// 목적) 이 함수를 그대로 호출했더니, "이미 채워졌으면 건너뛴다"는 이
// 필터 로직 때문에 큐가 통째로 비어버려 아무 질문도 안 뜨고 바로 다음
// 섹션(직원수 등)으로 넘어가버렸다 — 값이 있어도 "수정하러 온 것"이면
// 무조건 다시 물어봐야 한다는 게 이 force 플래그의 목적.
function buildOnboardingIdentityQueue(force) {
  if (force) return ONBOARDING_IDENTITY_FIELD_DEFS.slice();
  const p = currentProfile || {};
  return ONBOARDING_IDENTITY_FIELD_DEFS.filter(def => {
    if (def.fieldKey === 'businessType') return !(p.businessType && p.businessType.length);
    // foundingDate — 2026-08-06부터 company_profiles.founding_date로 실제
    // 저장되므로(예전엔 businessAgeYears로만 간접 반영) 이제 그 값으로
    // 바로 판단한다.
    if (def.fieldKey === 'foundingDate') return p.foundingDate == null;
    return !p[def.fieldKey];
  });
}

function runOnboardingIdentityQueue(state, force) {
  runOnboardingIdentityStep(state, buildOnboardingIdentityQueue(force), 0, force);
}

async function runOnboardingIdentityStep(state, queue, index, force) {
  if (index >= queue.length) {
    if (queue.length) {
      // 방금 신원정보(4문항 중 일부/전부)를 채웠을 때만 마무리 인사를
      // 보여준다 — 전부 이미 채워진 상태로 들어온 재진입에서는 생략.
      // 다음 화면(업종 재확인 또는 필드큐)에서 [이전 질문]을 누르면 이
      // 큐의 마지막 질문으로 돌아올 수 있도록 미리 쌓아둔다.
      pushOnboardingBack(state, () => runOnboardingIdentityStep(state, queue, queue.length - 1, force));
      await refreshOnboardingCoverageAndContinue(state, () => {
        appendBotBubble('감사합니다! 입력해주신 정보로 등록할게요 :)');
        if (force) {
          // 업종은 원래 공용 필수 필드큐(judged)가 자연스럽게 묻지만,
          // 그 큐는 "이미 채워졌으면 건너뛴다" 방식이라 OCR이 채워둔
          // 업종을 수정할 기회가 없다 — 수정 흐름에서는 명시적으로
          // 한 번 더 물어본다.
          runOnboardingIndustryCorrectionStep(state);
        } else {
          runOnboardingFieldQueue(state);
        }
      });
    } else {
      // 이 하위 큐 자체가 비어있었다(신원정보가 이미 전부 채워진 상태로
      // 들어옴) — 여기서는 아무것도 안 쌓는다. [이전 질문]을 누르면
      // 자연스럽게 이 신원정보 큐를 건너뛰고 그 이전 화면(예: 안내 인사말)
      // 으로 바로 돌아간다.
      runOnboardingFieldQueue(state);
    }
    return;
  }
  const def = queue[index];
  await chatDelay(350);
  appendBotBubble(`${def.prompt} <span class="onboarding-required-badge">필수</span>`);
  const actionEl = chatActionEl();
  actionEl.innerHTML = '';
  const onBack = index > 0
    ? () => {
        appendUserBubble('‹ 이전 질문');
        appendBotBubble('그럼 다시 여쭤볼게요.');
        runOnboardingIdentityStep(state, queue, index - 1, force);
      }
    : onboardingBackHandler(state);
  def.render(actionEl, () => {
    const echoText = def.echo(currentProfile || {});
    appendUserBubble(echoText);
    appendBotBubble(`<b>${escapeHtml(echoText)}</b>로 입력하셨네요! 감사합니다 :)`);
    runOnboardingIdentityStep(state, queue, index + 1, force);
  });
  appendChatCardFooter(actionEl, onBack, null);
}

// runOnboardingIndustryCorrectionStep — "직접 기재로 수정하기" 전용
// 4번째 질문(업종). 위 buildOnboardingIdentityQueue의 force 주석 참고.
function runOnboardingIndustryCorrectionStep(state) {
  chatDelay(350).then(() => {
    appendBotBubble('업종이 어떻게 되나요? (복수 선택 가능) <span class="onboarding-required-badge">필수</span>');
    const actionEl = chatActionEl();
    actionEl.innerHTML = '';
    const onBack = onboardingBackHandler(state);
    renderIndustryQuickForm(actionEl, () => {
      const p = currentProfile || {};
      const echo = (p.industry || []).join(', ');
      appendUserBubble(echo);
      appendBotBubble(`<b>${escapeHtml(echo)}</b>로 입력하셨네요! 감사합니다 :)`);
      pushOnboardingBack(state, () => runOnboardingIndustryCorrectionStep(state));
      runOnboardingFieldQueue(state);
    });
    appendChatCardFooter(actionEl, onBack, null);
  });
}

// ==================== 온보딩 정보요청 흐름(Phase UX-03→09 누적) ====================
// renderOnboardingComplete 아래에 남은 정보요청 항목을 보여준다. 판정
// 로직(eligibility.go/scoring.go)은 전혀 안 건드리고, 이미 있는 실데이터
// 소스만 쓴다:
//  - eligibilitySummary.missingFieldCounts(dashboard.go) — 지역/업종/
//    기업규모 중 실제로 빈 필드가 몇 건의 판정을 막고 있는지(카드 설명
//    문구에만 씀 — "AI 분석 커버리지" %와는 별개 지표).
//  - company_profiles 스칼라 필드 자체의 존재 여부(업력/직원수/매출액).
//  - documentRequirementGaps(Phase UX-02) — 실적/보유면허/인증/
//    직접생산확인은 판정기준 자체가 없으므로, "이 서류를 요구하는 공고
//    N건" 안내만(없는 걸 있는 것처럼 보여주지 않는다).
//
// Phase UX-09(2026-08-05) 재설계 핵심 — 직전 Phase UX-08의 "체크리스트"
// (남은 항목을 한 화면에 전부 보여줌)가 오히려 이탈율/피로도를 높인다는
// 피드백으로 다시 "카드 한 번에 하나씩만" 순서대로 보여주는 방식으로
// 되돌렸다(단, Phase UX-06/07의 옛 큐와는 세부가 다름 — 아래 참고):
//  (1) 화면엔 항상 "지금 입력할 항목 하나"만 크게 보이고, 상단엔 텍스트
//      대신 점/N-of-M 진행 표시(stepIndicatorHtml 재사용)만 최소로.
//      PC/모바일 구분 없이 완전히 인라인 렌더링(모달도, 별도 라우트도
//      없음 — Phase UX-06/07의 PC모달·모바일라우트 분기를 이번에
//      완전히 걷어냄, 화면이 하나뿐이라 필요가 없어짐).
//  (2) 색상 톤 순화 — 이전(UX-08)엔 50% 미만을 빨강+"분석이 어렵습니다"
//      경고 톤으로 표현했는데, 이번엔 0~49%를 중립적인 파란색+격려 톤
//      ("조금만 더 채우면 정확한 분석이 가능해요")으로, 50%↑만 녹색으로
//      구분한다.
//  (3) 필수(지역/업종/기업규모 — ONBOARDING_REQUIRED_FIELD_KEYS)는
//      [건너뛰기] 자체가 없다(반드시 등록해야 다음 카드로). 그 외는
//      전부 선택 — [등록]/[건너뛰기]. 면허/인증/직접생산확인처럼
//      "보유 여부" 개념인 항목(ONBOARDING_POSSESSION_FIELD_KEYS)은
//      [보유 - 등록하기]/[미보유 - 다음으로]로 라벨을 명확히 한다.
//  (4) 커버리지 가중치 재설계(company_profile_completeness.go) — 필수
//      3개에 각각 20%(합 60%)를 줘서, 선택 항목을 하나도 안 채워도
//      필수 3개만 다 채우면 항상 50% 게이트를 넘는다("선택 항목을
//      건너뛰어서 막히는" 상황 자체가 구조적으로 안 생김).
// Phase UX-08에서 만든 renderOnboardingFinalConfirm(최종 확인 화면)과
// showOnboardingItemSavedToast(등록 직후 전/후 %델타 토스트)는 그대로
// 재사용한다.

// documentRequirementGapPromptText — Phase UX-05(2026-08-04). dashboard.go의
// documentRequirementGaps는 이제 noticeCount==0인 항목도 내려준다(그
// 카테고리 데이터가 아직 없다는 뜻이지 영향 건수를 몰라도 되는 건 아님) —
// noticeCount가 있으면 실제 영향 건수를, 없으면 건수 주장 없이 "아직
// 등록하지 않았습니다"로 정직하게 표현한다. 대시보드 홈 카드
// (renderDocumentRequirementGapsHtml)와 온보딩 카드 큐 둘 다 공유.
function documentRequirementGapPromptText(label, noticeCount) {
  return noticeCount > 0
    ? `${label} 정보가 없어 ${noticeCount}건의 요구서류를 아직 확인하지 못했습니다.`
    : `${label} 정보가 아직 없습니다. 등록하면 관련 공고 판정에 활용됩니다.`;
}

// ONBOARDING_CARD_DEFS — Phase UX-06(2026-08-04) 재설계. 카드 후보 전체
// 목록과 고정 순서(사용자 스펙 그대로): 기업규모(비어있으면) → 직원수 →
// 매출액 → 수행실적 → 보유면허 → 인증 → 직접생산확인. 지역/업종은
// 보통 사업자등록증 OCR로 이미 채워지지만 비어있을 수 있어 맨 앞에 둔다.
// ⚠️2026-08-05: 업력은 여기서 완전히 빠졌다 — 구간select로 저장되던
// 근본 원인을 없애기 위해 질문 자체를 폐지하고, 개업일(사업자등록증
// OCR 또는 직접 기재 경로의 신원정보 큐)에서 자동 계산해 저장한다
// (showOnboardingBusinessRegResult/renderFoundingDateChatForm 참고).
// ⚠️2026-08-05(같은 날 2차): "지역"을 judged에서 presence로 전환했다 —
// eligibilitySummary.missingFieldCounts가 region을 "회사 쪽 데이터 부족"
// 으로 잡으려면 최소 한 건이라도 공고의 지역이 "전국"이 아닌 구체적인
// 지역명이어야 하는데, 실데이터 소스 3개(g2b/bizinfo/scsbid) 전부 구체
// 지역명을 준 적이 없어(g2b는 "전국"만 추론 가능하도록 막 고침 —
// [[project_g2b_region_mapping_fix]]) 이 판정이 구조적으로 절대 발동하지
// 않는다 — 그래서 온보딩 채팅에 "지역" 질문이 한 번도 안 뜨는 버그가
// 있었다. 판정 기반 카운트를 포기하고 직원수/매출액과 동일하게 "그냥
// 비어있으면 무조건 질문"하는 방식으로 바꿔 근본 해결(사용자 확정).
// 세 갈래:
//  - judged(업종/기업규모): eligibilitySummary.missingFieldCounts로
//    등록 후 진짜 "+N건" 델타를 낼 수 있다(판정기준이 있어서).
//  - presence(지역/직원수/매출액): company_profiles 스칼라 필드가 그냥
//    비어있는지만 본다 — 건수 주장 없이 "정보 없음"만 보여준다.
//  - general(수행실적/보유면허/인증/직접생산확인): documentRequirementGaps
//    (required_documents 키워드매칭, count==0도 포함 —
//    [[feedback-document-requirement-gap-zero-count-excluded]] 원칙).
// count 유무로 후보 자체를 거르지 않는다 — 실제로 비어있으면 전부 큐에
// 넣는다(최대 3장 cap은 이번에 폐지 — 사용자가 "최소 5개 이상" 요구).
const ONBOARDING_CARD_DEFS = [
  { fieldKey: 'region', type: 'presence', label: '사업장 지역' },
  { fieldKey: 'industry', type: 'judged', label: '업종' },
  { fieldKey: 'companySize', type: 'judged', label: '기업 규모' },
  { fieldKey: 'employeeCount', type: 'presence', label: '직원 수' },
  { fieldKey: 'revenueAmount', type: 'presence', label: '매출액' },
  { fieldKey: 'trackRecord', type: 'general', label: '수행실적' },
  { fieldKey: 'license', type: 'general', label: '보유 면허' },
  { fieldKey: 'certification', type: 'general', label: '인증' },
  { fieldKey: 'directProduction', type: 'general', label: '직접생산확인' },
];

function buildOnboardingCardQueue(data) {
  const eg = data.eligibilitySummary || { missingFields: [], missingFieldCounts: {} };
  const missingSet = new Set(eg.missingFields || []);
  const counts = eg.missingFieldCounts || {};
  const gapsByCategory = {};
  (data.documentRequirementGaps || []).forEach(g => { gapsByCategory[g.category] = g; });
  const p = currentProfile || {};

  const queue = [];
  ONBOARDING_CARD_DEFS.forEach(def => {
    if (def.type === 'judged') {
      if (missingSet.has(def.fieldKey)) {
        queue.push({ type: 'judged', fieldKey: def.fieldKey, label: def.label, count: counts[def.fieldKey] || 0 });
      }
    } else if (def.type === 'presence') {
      if (p[def.fieldKey] == null) {
        queue.push({ type: 'presence', fieldKey: def.fieldKey, label: def.label, count: 0 });
      }
    } else {
      const g = gapsByCategory[def.fieldKey];
      if (g) {
        queue.push({ type: 'general', fieldKey: def.fieldKey, label: def.label, count: g.noticeCount });
      }
    }
  });
  return queue;
}

// onboardingCardPromptText — 카드 유형별 프롬프트 문구.
function onboardingCardPromptText(card) {
  if (card.type === 'judged') {
    return card.count > 0
      ? `${card.label}을(를) 등록하면 추천공고 ${card.count}건을 더 정확하게 분석할 수 있습니다.`
      : `${card.label} 정보가 없어 정확한 판정이 어렵습니다.`;
  }
  if (card.type === 'presence') {
    if (card.fieldKey === 'revenueAmount') return '연매출액이 어떻게 되나요? 등록하면 AI 분석에 활용됩니다.';
    return `${card.label} 정보가 아직 없습니다. 등록하면 AI 분석에 활용됩니다.`;
  }
  return documentRequirementGapPromptText(card.label, card.count);
}

// 온보딩 카드의 [등록]은 항상 "직접 입력" 경로다(문서 업로드는 이 카드
// 큐 흐름 밖) — 그래서 실적/면허/인증은 renderTrackRecordForm/
// renderLicenseConfirmForm(13개/8개 필드짜리 정식 등록 폼, 문서 업로드
// AI확인 경로에서 여전히 그대로 씀)을 재사용하지 않고, 핵심 2~3개
// 필드만 받는 전용 미니폼(renderTrackRecordQuickForm/
// renderLicenseQuickForm)을 새로 쓴다 — 나머지 세부항목은
// #/me/saved-searches·#/me/saved-searches의 정식 화면에서 나중에 채운다.
const ONBOARDING_QUICK_FORM_RENDERERS = {
  region: renderRegionQuickForm,
  industry: renderIndustryQuickForm,
  companySize: renderCompanySizeQuickForm,
  employeeCount: renderEmployeeCountQuickForm,
  revenueAmount: renderRevenueAmountQuickForm,
  trackRecord: renderTrackRecordQuickForm,
  license: (slot, onSaved) => renderLicenseQuickForm(slot, 'license', onSaved),
  certification: (slot, onSaved) => renderLicenseQuickForm(slot, 'certification', onSaved),
  directProduction: renderDirectProductionQuickForm,
};

// ONBOARDING_MIN_COMPLETENESS — 2026-08-05 온보딩 재설계에서 50으로 확정했다가
// 같은 날 70으로 상향(사용자 확정, "나중에 하기" 버튼 폐지와 함께 온보딩을
// 더 꼼꼼히 받도록 강화). AI 분석 커버리지가 이 값 미만이면 온보딩 완료
// (다음 화면 이동)를 막는다. 서버(company_profile_completeness.go의
// onboardingMinCompleteness)와 같은 기준선 — 프론트는 UX(완료 버튼 잠금)일
// 뿐 신뢰 경계가 아니고, 실제 게이트는 서버가 POST /api/me/onboarding/complete
// 에서 다시 계산해 확인한다. ⚠️필수 3개(지역/업종/기업규모)만 채우면
// 60%인데 70% 문턱이 그보다 높아, 이제 필수 3개만으로는 온보딩을 끝낼
// 수 없다(의도된 정책).
const ONBOARDING_MIN_COMPLETENESS = 70;

// ONBOARDING_FIELDKEY_TO_COMPLETENESS_CATEGORY — 온보딩 카드 fieldKey를
// GET /api/me/profile-completeness의 categories 맵 키로 매핑(수행실적/
// 면허/인증은 이름이 복수형이라 살짝 다름).
const ONBOARDING_FIELDKEY_TO_COMPLETENESS_CATEGORY = {
  region: 'region', industry: 'industry', companySize: 'companySize',
  employeeCount: 'employeeCount', revenueAmount: 'revenueAmount',
  trackRecord: 'trackRecords', license: 'licenses', certification: 'certifications',
  directProduction: 'directProduction',
};

// ONBOARDING_REQUIRED_FIELD_KEYS — 반드시 채워야 다음 단계로 진행 가능한
// 3개("회사라면 누구나 있는 기본 정보", 사용자 확정). 이 카드들은
// [건너뛰기] 자체를 안 보여준다. company_profile_completeness.go의
// requiredCompletenessCategoryKeys(가중치 20%씩, 합 60%)와 반드시 같은
// 3개를 가리켜야 한다. ⚠️이 3개 가중치 합(60%)은 ONBOARDING_MIN_COMPLETENESS
// (70%)보다 낮다 — 필수 3개만으로는 게이트를 못 넘고, 선택 카테고리를
// 최소 하나 이상 더 채워야 한다(2026-08-05 문턱 상향으로 뒤집힌 원래
// 설계 의도, 의도된 정책).
const ONBOARDING_REQUIRED_FIELD_KEYS = new Set(['region', 'industry', 'companySize']);

// ONBOARDING_POSSESSION_FIELD_KEYS — "보유/미보유" 개념인 선택 항목(면허/
// 인증/직접생산확인). 일반 [건너뛰기] 대신 [보유 - 등록하기]/[미보유 -
// 다음으로]로 라벨을 명확히 해서, "미보유"를 선택해도 페널티 없이
// 자연스럽게 다음으로 넘어간다는 걸 화면에서 바로 보여준다(사용자 확정).
const ONBOARDING_POSSESSION_FIELD_KEYS = new Set(['license', 'certification', 'directProduction']);

// onboardingCoverageBarHtml — "AI 분석 커버리지" %를 온보딩 전 화면
// 상단에 항상 표시. 2026-08-05 색상/톤 정정(사용자 확인 — 0%에서
// 시작해 등록할수록 상승하는 방향 자체는 원래 맞았고, 톤만 순화):
// 0~49%는 위압적인 빨강 대신 중립적인 파랑("아직 진행 중", 경고 아님),
// 50~100%만 녹색(목표 달성 강조). 미만일 때 문구도 "분석이 어렵습니다"
// 같은 겁주는 톤 대신 격려 톤으로.
function onboardingCoverageBarHtml(overallCompleteness) {
  const pct = Math.max(0, Math.min(100, overallCompleteness));
  const isLow = overallCompleteness < ONBOARDING_MIN_COMPLETENESS;
  return `
    <div class="onboarding-coverage-bar ${isLow ? 'onboarding-coverage-bar--low' : 'onboarding-coverage-bar--ok'}">
      <div class="onboarding-coverage-bar-head">
        <span class="onboarding-coverage-bar-title">AI 분석 커버리지</span>
        <span class="onboarding-coverage-bar-pct">${overallCompleteness}%</span>
      </div>
      <div class="onboarding-coverage-bar-track"><div class="onboarding-coverage-bar-fill" style="width:${pct}%"></div></div>
      ${isLow ? '<p class="onboarding-coverage-hint">조금만 더 채우면 정확한 분석이 가능해요.</p>' : ''}
    </div>
  `;
}

// ensureOnboardingFieldQueue — GET /api/dashboard도 company_profile_required
// 를 요구하므로(프로필이 없으면 400), 회사 식별정보 큐를 통과해 프로필이
// 막 생긴 뒤에야 호출한다. 이미 조회했으면 다시 조회하지 않는다.
async function ensureOnboardingFieldQueue(state) {
  if (state.fieldQueue) return;
  let dashboardData;
  try {
    dashboardData = await apiRequest('GET', '/api/dashboard');
  } catch (err) {
    dashboardData = { eligibilitySummary: {}, documentRequirementGaps: [] };
  }
  state.fieldQueue = buildOnboardingCardQueue(dashboardData);
}

// runOnboardingFieldQueue — 지역/업종/기업규모(필수)·업력/직원수/매출액/
// 수행실적/면허/인증/직접생산확인(선택)을 채팅 턴으로 순서대로 진행한다.
// 기존 ONBOARDING_QUICK_FORM_RENDERERS(render*QuickForm)의 폼/저장 로직은
// 그대로 재사용하고, "카드 하나를 통째로 다시 그리기" 대신 "말풍선 추가 +
// 액션 영역만 갱신"으로 표현을 바꿨다. 커버리지가 이미 50% 이상이면
// (필수 3개만 채워도 가중치 60%라 자동 충족) 매 턴마다 "지금까지 정보로
// 완료하기"도 함께 보여준다.
async function runOnboardingFieldQueue(state) {
  await ensureOnboardingFieldQueue(state);
  const { fieldQueue, fieldIndex } = state;
  if (fieldIndex >= fieldQueue.length) {
    await chatDelay(300);
    renderOnboardingFinalConfirm(state.container, state.completeness);
    return;
  }
  const card = fieldQueue[fieldIndex];
  const isRequired = ONBOARDING_REQUIRED_FIELD_KEYS.has(card.fieldKey);
  const isPossession = ONBOARDING_POSSESSION_FIELD_KEYS.has(card.fieldKey);

  await chatDelay(350);
  appendBotBubble(`${escapeHtml(onboardingCardPromptText(card))} ${isRequired ? '<span class="onboarding-required-badge">필수</span>' : '<span class="onboarding-optional-badge">선택</span>'}`);

  const actionEl = chatActionEl();
  actionEl.innerHTML = '';

  // skipStreak 초기화는 여기서 하지 않는다 — 건너뛰기 경로(handleOnboardingSkip)
  // 도 결국 이 advance()를 거치는데, 여기서 무조건 0으로 되돌리면 연속
  // 건너뛰기가 절대 2번 누적되지 않는다(실제로 이 버그가 났었음). 대신
  // "실제로 값을 입력했다"고 확신할 수 있는 각 호출부(일반 필드 저장,
  // 보유 등록, 직원수 직접입력/4대보험 확인)에서 advance 호출 직전에
  // 각자 초기화한다.
  const advance = (feedbackHtml) => {
    state.fieldIndex += 1;
    refreshOnboardingCoverageAndContinue(state, () => {
      if (feedbackHtml) appendBotBubble(feedbackHtml);
      runOnboardingFieldQueue(state);
    });
  };
  // onBack — 필드큐 안에서는 로컬로(직전 필드 인덱스) 되돌리고, 첫
  // 필드 항목(fieldIndex===0)에서는 공용 뒤로가기 스택을 이용해 이
  // 큐로 들어오기 직전 화면(신원정보 큐 마지막 질문/업종 재확인/인사말
  // 등)으로 돌아간다 — 2026-08-05: 예전엔 fieldIndex===0일 때 onBack이
  // 그냥 null이라 [이전 질문] 버튼 자체가 안 뜨는 누락이 있었다.
  const onBack = fieldIndex > 0
    ? () => {
        appendUserBubble('‹ 이전 질문');
        appendBotBubble('그럼 다시 여쭤볼게요.');
        state.fieldIndex -= 1;
        runOnboardingFieldQueue(state);
      }
    : onboardingBackHandler(state);

  if (card.fieldKey === 'employeeCount') {
    renderOnboardingEmployeeCountAction(actionEl, state, card, isRequired, advance, onBack);
  } else if (card.fieldKey === 'revenueAmount') {
    renderOnboardingRevenueAction(actionEl, state, card, isRequired, advance, onBack);
  } else if (isPossession) {
    renderOnboardingPossessionAction(actionEl, card, state, advance, onBack);
  } else {
    renderOnboardingGenericFieldAction(actionEl, card, isRequired, state, advance, onBack);
  }

  if (state.completeness.overallCompleteness >= ONBOARDING_MIN_COMPLETENESS) {
    actionEl.appendChild(h('<button type="button" class="btn btn-secondary btn-block chat-finish-early-btn" style="margin-top:0.6rem">지금까지 정보로 완료하기</button>'));
    actionEl.querySelector('.chat-finish-early-btn').addEventListener('click', () => {
      appendUserBubble('지금까지 정보로 완료하기');
      renderOnboardingFinalConfirm(state.container, state.completeness);
    });
  }
}

// onboardingFieldEchoBubbles — 저장 직후 사용자 echo 말풍선/봇 피드백
// 문구를 만든다. region/industry/companySize는 companyProfileUpdatePayload로
// 저장돼 currentProfile에서 값을 그대로 읽어 정확한 echo를 만들 수 있지만,
// trackRecord는 별도 엔드포인트(POST /api/me/track-records)라 저장값이
// currentProfile에 없어 일반 확정 문구로 대체한다. businessAgeYears/
// revenueAmount는 각자 전용 액션(renderFoundingDateChatForm 계열/
// renderOnboardingRevenueAction)이 자체 echo를 만들어 이 공용 함수를
// 거치지 않는다.
function onboardingFieldEchoBubbles(card) {
  if (card.fieldKey === 'trackRecord') {
    return { userText: '수행실적 등록 완료', feedbackHtml: '수행실적을 등록해주셔서 감사합니다 :)' };
  }
  const p = currentProfile || {};
  const valueMap = {
    region: p.region || '',
    industry: (p.industry || []).join(', '),
    companySize: p.companySize || '',
  };
  const val = valueMap[card.fieldKey] || '';
  return { userText: val, feedbackHtml: `<b>${escapeHtml(val)}</b>으로 입력하셨네요! 감사합니다 :)` };
}

// renderOnboardingGenericFieldAction — 지역/업종/기업규모/업력/매출액/
// 수행실적 공용(직원수·보유계열은 각자 전용 함수). 폼 렌더링과 이전/
// 건너뛰기는 완전히 분리 — 폼은 [다음]만 그리고, 이전/건너뛰기는 공용
// 카드 푸터(appendChatCardFooter)가 폼 바깥에 붙인다.
function renderOnboardingGenericFieldAction(actionEl, card, isRequired, state, advance, onBack) {
  const renderForm = ONBOARDING_QUICK_FORM_RENDERERS[card.fieldKey];
  renderForm(actionEl, () => {
    const echo = onboardingFieldEchoBubbles(card);
    appendUserBubble(echo.userText);
    state.skipStreak = 0; // 실제로 값을 입력했으니 연속 건너뛰기 스트릭 초기화.
    advance(echo.feedbackHtml);
  });
  if (isRequired) {
    actionEl.appendChild(h('<p class="chat-required-note">필수 항목입니다</p>'));
    appendChatCardFooter(actionEl, onBack, null);
  } else {
    appendChatCardFooter(actionEl, onBack, () => handleOnboardingSkip(card, state, advance));
  }
}

// renderOnboardingPossessionAction — 면허/인증/직접생산확인("보유 여부"
// 개념) 공용. [보유 - 등록하기]는 해당 quick-form을, [미보유 - 다음으로]는
// 값 변동 없이 바로 다음으로("미보유"는 건너뛰기가 아니라 확정된 답이라
// skipStreak도 함께 초기화한다). onBack은 선택 화면(보유/미보유 버튼)의
// 공용 카드 푸터(appendChatCardFooter)에 붙이고, 등록 폼으로 들어가면
// 그 폼의 푸터는 필드큐를 되돌리는 대신 이 선택 화면(renderChoice)으로만
// 돌아간다(중첩 뒤로가기).
function renderOnboardingPossessionAction(actionEl, card, state, advance, onBack) {
  const renderChoice = () => {
    actionEl.innerHTML = '';
    actionEl.appendChild(h(`
      <div class="chat-chip-row">
        <button type="button" class="chat-chip" id="onboarding-possess-has-btn">보유 - 등록하기</button>
        <button type="button" class="chat-chip" id="onboarding-possess-none-btn">미보유 - 다음으로</button>
      </div>
    `));
    appendChatCardFooter(actionEl, onBack, null);
    document.getElementById('onboarding-possess-has-btn').addEventListener('click', () => {
      appendUserBubble('보유 - 등록하기');
      actionEl.innerHTML = '';
      const renderForm = ONBOARDING_QUICK_FORM_RENDERERS[card.fieldKey];
      renderForm(actionEl, () => {
        appendUserBubble(`${card.label} 등록 완료`);
        state.skipStreak = 0;
        advance(`${escapeHtml(card.label)}을(를) 등록해주셔서 감사합니다 :)`);
      });
      appendChatCardFooter(actionEl, renderChoice, null);
    });
    document.getElementById('onboarding-possess-none-btn').addEventListener('click', () => {
      appendUserBubble('미보유 - 다음으로');
      state.skipStreak = 0;
      advance(null);
    });
  };
  renderChoice();
}

// handleOnboardingSkip — 연속 2회 건너뛰기 시 1회만 경고(사용자 확정) —
// 이후 계속 건너뛰어도 재경고하지 않고, 최종 확인 화면에서 한 번 더
// 요약 안내한다(renderOnboardingFinalConfirm 쪽 별도 처리 없이도 이미
// 남은 항목이 요약 표에 "-"로 자연히 드러남).
function handleOnboardingSkip(card, state, advance) {
  appendUserBubble('건너뛰기');
  state.skipStreak += 1;
  if (state.skipStreak >= 2 && !state.warnedThisStreak) {
    state.warnedThisStreak = true;
    showOnboardingSkipWarning(state, advance);
    return;
  }
  appendBotBubble('네, 다음으로 넘어갈게요.');
  advance(null);
}
function showOnboardingSkipWarning(state, advance) {
  appendBotBubble('건너뛴 항목이 많아서 공공사업 분석 정확도가 낮아질 수 있어요.<br>지금이라도 채워보시겠어요?');
  const actionEl = chatActionEl();
  actionEl.innerHTML = '';
  actionEl.appendChild(h(`
    <div class="chat-chip-row">
      <button type="button" class="chat-chip" id="onboarding-skip-warn-fill-btn">지금 등록하기</button>
      <button type="button" class="chat-chip" id="onboarding-skip-warn-continue-btn">계속 건너뛰기</button>
    </div>
  `));
  document.getElementById('onboarding-skip-warn-fill-btn').addEventListener('click', () => {
    appendUserBubble('지금 등록하기');
    state.skipStreak = 0;
    runOnboardingFieldQueue(state); // fieldIndex는 아직 그대로라 방금 건너뛰려던 항목이 다시 나온다.
  });
  document.getElementById('onboarding-skip-warn-continue-btn').addEventListener('click', () => {
    appendUserBubble('계속 건너뛰기');
    advance(null);
  });
}

// renderOnboardingEmployeeCountAction — 직원수는 1순위 4대보험 파일첨부
// 자동입력, 2순위 직접 숫자입력(2026-08-05: 구간select 폐지, 정확한
// 숫자만) 두 갈래. 기존 employee-verification 엔드포인트
// (POST .../employee-verification/documents + POST .../employee-verification,
// company_employee_verification.go)를 그대로 재사용 — 온보딩 챗봇에
// 새로 연결하는 것 외 백엔드 변경 없음.
function renderOnboardingEmployeeCountAction(actionEl, state, card, isRequired, advance, onBack) {
  const renderChoice = () => {
    actionEl.innerHTML = '';
    actionEl.appendChild(h(`
      <div class="chat-chip-row">
        <button type="button" class="chat-chip" id="onboarding-employee-upload-btn">📎 4대보험 파일첨부로 자동입력</button>
        <button type="button" class="chat-chip" id="onboarding-employee-manual-btn">직접 입력</button>
      </div>
    `));
    appendChatCardFooter(actionEl, onBack, isRequired ? null : () => handleOnboardingSkip(card, state, advance));
    document.getElementById('onboarding-employee-upload-btn').addEventListener('click', () => {
      appendUserBubble('📎 4대보험 파일첨부로 자동입력');
      startOnboardingEmployeeVerificationUpload(actionEl, state, advance, renderChoice);
    });
    document.getElementById('onboarding-employee-manual-btn').addEventListener('click', () => {
      appendUserBubble('직접 입력');

// companyProfileUpdatePayload — PUT /api/me/company-profile는 부분수정이
// 아니라 항상 전체 컬럼을 덮어쓰는 UPDATE라(auth.go), 미니 등록폼처럼
// 필드 하나만 물어보는 화면도 currentProfile 전체를 다시 실어 보내야
// 나머지 필드가 NULL로 덮어써지는 사고를 막는다. overrides로 바뀐
// 필드만 얹어서 반환.
function companyProfileUpdatePayload(overrides) {
  const p = currentProfile || {};
  return Object.assign({
    businessRegistrationNumber: p.businessRegistrationNumber || null,
    companyName: p.companyName || null,
    representativeName: p.representativeName || null,
    address: p.address || null,
    businessType: p.businessType || [],
    region: p.region || null,
    industry: p.industry || [],
    // foundingDate — 2026-08-06, source of truth 전환(company_profiles.founding_date
    // 신규 컬럼). 서버가 이 값 기준으로 businessAgeYears를 매 조회마다
    // 다시 계산해 내려주므로, 여기선 그냥 현재 값을 다시 실어 보내기만
    // 하면 된다(다른 필드들과 동일한 "항상 전체 상태 재전송" 관례).
    foundingDate: p.foundingDate || null,
    businessAgeYears: p.businessAgeYears != null ? p.businessAgeYears : null,
    revenueAmount: p.revenueAmount != null ? p.revenueAmount : null,
    employeeCount: p.employeeCount != null ? p.employeeCount : null,
    companySize: p.companySize || null,
    licenses: p.licenses || [],
    certifications: p.certifications || [],
    directProductionCert: !!p.directProductionCert,
    maxPerformanceAmount: p.maxPerformanceAmount != null ? p.maxPerformanceAmount : null,
    creditRating: p.creditRating || null,
    phoneNumber: p.phoneNumber || null,
  }, overrides);
}

// attachIndustryPicker — 조달청 중분류 업종을 자동완성+칩으로 다중선택하는 공용
// 위젯(Phase 2b). mountEl 안에 칩·검색입력·숨은 input(name=fieldName)을 그린다.
// 폼 제출은 기존과 동일하게 fd.getAll(fieldName)으로 값을 받는다(숨은 input 재사용)
// — 그래서 각 폼의 제출 로직은 손대지 않는다. 레거시 10그룹 값도 칩으로 그대로
// 표시되어(마이그레이션 전 호환) 사용자가 필요 시 빼고 중분류로 다시 고를 수 있다.
function attachIndustryPicker(mountEl, initialValues, fieldName) {
  const selected = [];
  (initialValues || []).forEach(v => { v = (v || '').trim(); if (v && !selected.includes(v)) selected.push(v); });
  mountEl.classList.add('industry-picker');
  mountEl.innerHTML = `
    <div class="tag-input industry-picker-box">
      <span class="tag-pills"></span>
      <input type="text" class="tag-input-field industry-picker-search" placeholder="업종 검색 (예: 시스템, 설계, 청소)" autocomplete="off">
    </div>
    <div class="industry-picker-hidden"></div>`;
  const box = mountEl.querySelector('.industry-picker-box');
  const pills = mountEl.querySelector('.tag-pills');
  const search = mountEl.querySelector('.industry-picker-search');
  const hidden = mountEl.querySelector('.industry-picker-hidden');
  let menuEl = null;

  const syncHidden = () => { hidden.innerHTML = selected.map(v => `<input type="hidden" name="${escapeAttr(fieldName)}" value="${escapeAttr(v)}">`).join(''); };
  const renderPills = () => {
    pills.innerHTML = selected.map((v, i) => `<span class="tag-pill">${escapeHtml(v)}<button type="button" class="tag-pill-remove" data-i="${i}" aria-label="삭제">×</button></span>`).join('');
    pills.querySelectorAll('.tag-pill-remove').forEach(b => b.addEventListener('click', () => { selected.splice(Number(b.dataset.i), 1); renderPills(); syncHidden(); }));
  };
  const addValue = (v) => { v = (v || '').trim(); if (v && !selected.includes(v)) { selected.push(v); renderPills(); syncHidden(); } };
  const closeMenu = () => { if (menuEl) { menuEl.remove(); menuEl = null; } document.removeEventListener('click', onOutside, true); };
  function onOutside(e) { if (menuEl && !menuEl.contains(e.target) && e.target !== search) closeMenu(); }
  async function openMenu() {
    const q = search.value.trim();
    let data;
    try { data = await fetchJSON('/api/industry-taxonomy' + (q ? '?q=' + encodeURIComponent(q) : '')); } catch (e) { return; }
    closeMenu();
    const groups = (data.taxonomy || []).map(g => ({ large: g.large, mids: g.mids.filter(m => !selected.includes(m)) })).filter(g => g.mids.length);
    if (!groups.length) return;
    const menu = document.createElement('div');
    menu.className = 'dropdown-menu industry-picker-menu';
    menu.innerHTML = groups.map(g => `
      <div class="industry-picker-group">
        <button type="button" class="industry-picker-large" data-mids="${escapeAttr(g.mids.join('|'))}">${escapeHtml(g.large)} <span>전체 추가</span></button>
        ${g.mids.map(m => `<button type="button" class="dropdown-menu-item industry-picker-mid" data-v="${escapeAttr(m)}">${escapeHtml(m)}</button>`).join('')}
      </div>`).join('');
    document.body.appendChild(menu);
    const rect = box.getBoundingClientRect();
    menu.style.top = (rect.bottom + 4) + 'px';
    menu.style.left = rect.left + 'px';
    menu.style.minWidth = rect.width + 'px';
    menu.style.maxWidth = Math.min(560, window.innerWidth - 16) + 'px';
    menu.querySelectorAll('.industry-picker-mid').forEach(b => b.addEventListener('mousedown', (e) => { e.preventDefault(); addValue(b.dataset.v); openMenu(); }));
    menu.querySelectorAll('.industry-picker-large').forEach(b => b.addEventListener('mousedown', (e) => { e.preventDefault(); b.dataset.mids.split('|').forEach(addValue); openMenu(); }));
    menuEl = menu;
    setTimeout(() => document.addEventListener('click', onOutside, true), 0);
  }
  let timer = null;
  search.addEventListener('focus', openMenu);
  search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(openMenu, 180); });
  search.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
  renderPills();
  syncHidden();
}

// renderCompanySizeQuickForm — 2026-08-08: select box에서 버튼형(chat-chip)으로
// 전환. 5단계(소상공인~대기업)를 버튼으로 나열하고, 클릭하면 즉시 저장 후
// 다음으로 진행한다([다음] 버튼 불필요) — 면허/인증의 보유·미보유 버튼과
// 동일한 즉시선택 UX. 온보딩 전용(ONBOARDING_QUICK_FORM_RENDERERS)이라 이
// 변경은 기업정보 탭의 별도 select(라인 8599/11308)엔 영향 없다.
function renderCompanySizeQuickForm(container, onSaved) {
  const p = currentProfile || {};
  container.innerHTML = '';
  const wrap = h(`
    <div class="quick-company-size">
      <div class="chat-chip-row" id="quick-company-size-buttons">
        ${COMPANY_SIZE_OPTIONS.map(sz => `<button type="button" class="chat-chip${sz === p.companySize ? ' is-selected' : ''}" data-company-size="${escapeAttr(sz)}">${escapeHtml(sz)}</button>`).join('')}
      </div>
      <div id="quick-company-size-error" class="error" style="display:none"></div>
    </div>
  `);
  container.appendChild(wrap);
  // h()는 DocumentFragment를 돌려주고 appendChild가 그 자식들을 container로
  // 옮기며 fragment를 비운다 — 그래서 이벤트 리스너는 반드시 append 후 live
  // DOM(container)에서 재조회한 노드에 붙여야 한다(fragment에 붙이면 무효).
  const errorBox = container.querySelector('#quick-company-size-error');
  const buttons = container.querySelectorAll('button[data-company-size]');
  buttons.forEach(btn => {
    btn.addEventListener('click', async () => {
      errorBox.style.display = 'none';
      const size = btn.getAttribute('data-company-size');
      buttons.forEach(b => { b.classList.toggle('is-selected', b === btn); b.disabled = true; });
      try {
        const data = await apiRequest('PUT', '/api/me/company-profile', companyProfileUpdatePayload({ companySize: size }));
        currentProfile = data.companyProfile;
        onSaved();
      } catch (err) {
        buttons.forEach(b => { b.disabled = false; });
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });
  });
}

// PIPELINE_STATUS_LIST — notice_pipeline_entries.status의 6단계(2026-08-09 9→6
// 축소), DB CHECK 제약·company_pipeline.go validPipelineStatuses와 동일.
const PIPELINE_STATUS_LIST = ['검토중', '준비중', '제출완료', '낙찰', '탈락', '제외'];
// 칸반 컬럼 = 진행 흐름 3단계. 결과(낙찰/탈락)와 제외는 "종결됨" 섹션으로.
const PIPELINE_KANBAN_COLUMNS = ['검토중', '준비중', '제출완료'];
// 자동전환/우선업무 대상 = 아직 제출 전(검토중/준비중). 제출완료는 결과 대기라 제외.
const PIPELINE_ACTIVE_STATUSES = ['검토중', '준비중'];
const CHECKLIST_STATUS_LIST = ['보유', '갱신필요', '신규작성', '발급필요', '확인필요'];

// 진행 순서가 있는 3단계(happy path)만 스텝 인디케이터로 표시하고,
// 낙찰/탈락/제외처럼 흐름을 벗어난 종결 상태는 톤 배지로 대체 표시한다.
const PIPELINE_MAIN_STEPS = ['검토중', '준비중', '제출완료'];
const PIPELINE_TERMINAL_BADGE_TONE = { '낙찰': 'badge--success', '탈락': 'badge--danger', '제외': 'badge--gray' };

// 현재 상태에서 실제로 갈 만한 "다음 단계"만 먼저 보여주고, 나머지는
// <optgroup>으로 접어 뒤에 둔다(값 자체는 6개 다 선택 가능 — 되돌리기 허용).
const PIPELINE_NEXT_STATUS_MAP = {
  '검토중': ['준비중', '제출완료', '제외'],
  '준비중': ['제출완료', '검토중', '제외'],
  '제출완료': ['낙찰', '탈락'],
  '낙찰': [],
  '탈락': [],
  '제외': ['검토중'],
};

function pipelineStatusSelectHtml(currentStatus) {
  const nextOptions = (PIPELINE_NEXT_STATUS_MAP[currentStatus] || []).filter(s => s !== currentStatus);
  const otherOptions = PIPELINE_STATUS_LIST.filter(s => s !== currentStatus && !nextOptions.includes(s));
  const optionHtml = (s) => `<option value="${escapeAttr(s)}" ${s === currentStatus ? 'selected' : ''}>${escapeHtml(s)}</option>`;
  const groups = [];
  groups.push(`<optgroup label="현재 상태">${optionHtml(currentStatus)}</optgroup>`);
  if (nextOptions.length) {
    groups.push(`<optgroup label="다음 단계">${nextOptions.map(optionHtml).join('')}</optgroup>`);
  }
  if (otherOptions.length) {
    groups.push(`<optgroup label="기타">${otherOptions.map(optionHtml).join('')}</optgroup>`);
  }
  return `<select name="status" class="select-input">${groups.join('')}</select>`;
}

// stepIndicatorHtml — 점+선 스텝 인디케이터 공용 헬퍼. 파이프라인 상태
// 표시와 프로필 수정 모달의 단계 표시 양쪽에서 재사용한다.
function stepIndicatorHtml(currentIdx, total, label) {
  const dots = Array.from({ length: total }).map((_, i) => {
    const dotCls = i < currentIdx ? 'is-done' : (i === currentIdx ? 'is-current' : '');
    const lineCls = i < currentIdx ? 'is-done' : '';
    const dot = `<span class="step-indicator-dot ${dotCls}"></span>`;
    const line = i < total - 1 ? `<span class="step-indicator-line ${lineCls}"></span>` : '';
    return dot + line;
  }).join('');
  return `<span class="step-indicator">${dots}<span class="step-indicator-label">${escapeHtml(label)}</span></span>`;
}

function pipelineStepIndicatorHtml(status) {
  const terminalTone = PIPELINE_TERMINAL_BADGE_TONE[status];
  if (terminalTone) {
    return `<span class="badge ${terminalTone}">${escapeHtml(status)}</span>`;
  }
  const idx = PIPELINE_MAIN_STEPS.indexOf(status);
  return stepIndicatorHtml(idx, PIPELINE_MAIN_STEPS.length, status);
}

function wireUsefulLinksSection(container) {
  container.querySelectorAll('.useful-links-dropdown-trigger').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const group = DASHBOARD_EXTERNAL_LINK_GROUPS[Number(btn.dataset.groupIndex)];
      const menu = openDropdown(e.currentTarget, group.links.map(l => `
        <a class="dropdown-menu-item" href="${escapeAttr(l.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(l.name)}</a>
      `).join(''));
      if (!menu) return; // 같은 트리거를 다시 클릭 — 토글로 닫기만 하고 끝
      menu.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', () => closeActiveDropdown());
      });
    });
  });
}

// isAnalysisPendingRecommendation — 추천 공고가 "공고문 분석 대기"(사용자가 해결할 수
// 없는 시스템 상태)인지 판별. 서버가 내려주는 judgment.reasons 값('공고문 분석 대기',
// participation_judgment.go shortConditionReason)만 사용 — 새 상태값을 만들지 않는다.
// 질문(면허/인증)이 있으면 분석 대기가 아니다(분석이 끝나야 질문도 생기므로).
function isAnalysisPendingRecommendation(item) {
  const j = item && item.judgment;
  if (!j || (Array.isArray(j.questions) && j.questions.length > 0)) return false;
  return (j.reasons || []).indexOf('공고문 분석 대기') !== -1;
}

// recommendationHeroTier — 홈 HERO 우선순위(낮을수록 먼저). "AI가 지금 사용자가 행동할
// 수 있는 공고를 먼저 보여준다"는 규칙. 기존 judgment 데이터만 사용(추천/판정 로직 무변경).
//   0 참여 가능(ready) · 1 확인 필요+즉시 답변 가능(question) · 2 확인 필요+상세 확인 ·
//   3 분석 대기(시스템 처리 중) · 4 참여 어려움(notRecommended)
function recommendationHeroTier(item) {
  const j = item && item.judgment;
  if (!j) return 3;
  if (j.grade === 'ready') return 0;
  if (Array.isArray(j.questions) && j.questions.length > 0) return 1;
  if (isAnalysisPendingRecommendation(item)) return 3;
  if (j.grade === 'notRecommended') return 4;
  return 2;
}

// renderDashboard — "오늘 할 일" 홈 화면. data는 handleDashboard(신규 응답
// 모양: summary + priorityItems)의 결과를 그대로 받는다. 예전 3버킷
// 집계(readyCount 등)는 더 이상 없다 — 이 응답을 쓰는 화면은 여기뿐이라
// 하위호환을 유지할 이유가 없었다.
function renderDashboard(container, data) {
  document.body.classList.remove('is-landing');
  container.innerHTML = '';
  // 프로필 미완성 안내는 대시보드 전용(2026-08-07) — 인사말 바로 아래,
  // 숫자 타일 위에 renderDashboardProfileBanner로 렌더링한다.
  renderHomeOverlay();

  const s = data.summary;
  // filter는 renderPipelineList가 읽는 쿼리 파라미터 값(dashboard.go 요약
  // 집계와 반드시 같은 정의를 쓴다 — 카드 숫자와 클릭 후 목록 건수가
  // 어긋나면 안 됨. AI 분석 카드만 목적지가 다르다(#/ai-usage).
  // cta — Phase(대시보드 행동유도, 2026-08-06): 숫자만 나열하던 타일에
  // "다음에 뭘 눌러야 하는지"를 명시적 버튼 텍스트로 덧붙인다. 클릭 이동
  // 로직(data-href + 아래 dash-tile--clickable 리스너)은 기존 그대로
  // 재사용 — 타일 전체가 여전히 하나의 클릭 영역이고, cta는 그 위에
  // 얹는 시각적 라벨일 뿐 별도 이벤트 리스너를 새로 달지 않는다.
  // 상단 KPI 타일은 실제 "행동 대상" 3개만 남긴다(2026-08-09 정보우선순위 개편).
  // 담당자미지정은 팀 기능이라 진행중 사업 화면(파이프라인 필터)에, AI 분석
  // 사용량은 "회사정보" 카드 링크로 옮겨 메인 첫인상에서 약화한다 — API 데이터는
  // 그대로 유지하고 노출 위치/우선순위만 낮춘다. 이 타일들은 "오늘 할 일/추천
  // 공고" 아래 보조 스트립으로 배치한다(0건 카드가 첫 화면을 지배하지 않게).
  // Phase 1(2026-08-10 IA): 대시보드를 "행동 먼저" 구조로. ① 오늘 확인할 항목(분류
  // 요약) ② 가장 먼저 볼 공고(추천 1건) ③ 오늘 할 일(실제 todo) ④ 확인 필요(회사정보)
  // ⑤ 이번 달 자동 처리(접힘). 모든 수치는 기존 DTO에서만 산출(새 숫자 없음).
  // Phase 1 보정(2026-08-10): 제품 핵심 = "AI가 어떤 공고를 왜 추천했나". 홈 순서를
  // ① 인사 ② 가장 먼저 볼 공고(HERO) ③ 오늘 할 일 ④ 회사정보 ⑤ 자동 처리(접힘)로.
  // greeting/오늘할일 모순 제거: greeting을 recommendations·priorityItems 둘 다 반영해
  // "급한 일 없음"과 "오늘 할 일 N건"이 동시에 뜨지 않게 한다. 새 숫자 없음(기존 DTO).
  const recommendations = data.recommendations || [];
  const items = data.priorityItems || [];

  // ② 가장 먼저 볼 공고 HERO — "지금 행동할 수 있는 공고 먼저" 규칙(recommendationHeroTier).
  // Tier ASC → 같은 Tier 내 마감 임박순. recommendations는 서버가 이미 마감순 정렬이라
  // 안정정렬로 Tier만 재배치하면 Tier 내 마감순이 유지된다. 판정/추천 로직 무변경(기존 DTO만).
  const sortedRecs = recommendations.map((r, i) => ({ r, i })).sort((a, b) => (recommendationHeroTier(a.r) - recommendationHeroTier(b.r)) || (a.i - b.i)).map(x => x.r);
  const topPick = sortedRecs[0] || null;
  let topPickHtml = '';
  if (topPick) {
    const tier = recommendationHeroTier(topPick);
    const j = topPick.judgment || {};
    const gradeLabel = j.gradeLabel || '';
    const detailHref = topPick.ctaHref || ('#/notices/' + topPick.noticeId);
    // 홈 인라인 질문(상세와 동일한 judgment.questions 그대로 — 프론트 추론 없음).
    const heroQuestions = [];
    (j.questions || []).forEach(q => { (q.targets || []).forEach(name => heroQuestions.push({ kind: q.kind, category: q.category, name, condType: q.conditionType, reason: q.reason })); });
    const objJosa = w => { const ch = (w || '').slice(-1).charCodeAt(0); if (ch >= 0xAC00 && ch <= 0xD7A3) return ((ch - 0xAC00) % 28) ? '을' : '를'; return '을(를)'; };
    // Tier별 배지/아이브로우/본문/행동. 분석대기는 사용자가 해결할 수 없으므로 확인 버튼 없음.
    let badgeLabel, badgeTone, eyebrow, bodyHtml, actionsHtml, participate = '0';
    if (tier === 0) {
      badgeLabel = gradeLabel || '참여 가능'; badgeTone = 'pj-grade--ready'; eyebrow = '가장 먼저 볼 공고'; participate = '1';
      const rawReasons = (j.reasons || []).slice(0, 3);
      const reasonList = rawReasons.length ? rawReasons : ['지역·업종·기업규모 요건을 충족했습니다'];
      bodyHtml = `<div class="dash-hero-why"><span class="dash-hero-why-lbl">왜 추천했나요?</span><ul>${reasonList.map(r => `<li>✓ ${escapeHtml(r)}</li>`).join('')}</ul></div>`;
      actionsHtml = `<button type="button" class="btn btn-primary dash-hero-cta">참여할게요</button><a href="#/me/saved-searches" class="official-link">맞춤공고 전체 보기 &rarr;</a>`;
    } else if (tier === 1) {
      badgeLabel = gradeLabel || '확인 필요'; badgeTone = 'pj-grade--review'; eyebrow = '가장 먼저 확인하세요';
      bodyHtml = `
        <div class="dash-hero-why dash-hero-why--review"><span class="dash-hero-why-lbl">AI가 확인하지 못한 조건</span><p class="dash-hero-why-reason">${escapeHtml(heroQuestions[0].reason || '')}</p></div>
        <div class="dash-hero-questions">
          ${heroQuestions.map(q => `
            <div class="pj-question" data-kind="${escapeAttr(q.kind)}" data-category="${escapeAttr(q.category)}" data-name="${escapeAttr(q.name)}">
              <div class="pj-question-ask">회사에서 <strong>${escapeHtml(q.name)}</strong>${objJosa(q.name)} 보유하고 있나요?</div>
              <div class="pj-question-btns">
                <button type="button" class="pj-answer-btn pj-answer-btn--yes" data-answer="보유">보유</button>
                <button type="button" class="pj-answer-btn" data-answer="미보유">미보유</button>
                <button type="button" class="pj-answer-btn pj-answer-btn--skip" data-answer="모름">잘 모르겠어요</button>
              </div>
            </div>`).join('')}
        </div>`;
      actionsHtml = `<a href="${escapeAttr(detailHref)}" class="official-link">공고 상세 보기 &rarr;</a>`;
    } else if (tier === 3) {
      // 분석 대기 — 사용자가 해결할 수 없는 시스템 상태. [확인하기] 금지, 사실만 표시.
      badgeLabel = '분석 중'; badgeTone = 'pj-grade--review'; eyebrow = '가장 먼저 확인하세요';
      bodyHtml = `<div class="dash-hero-why dash-hero-why--review"><span class="dash-hero-why-lbl">AI가 공고문을 분석하고 있어요</span><p class="dash-hero-why-reason">공고문 분석이 완료되어야 참여 조건을 확인할 수 있어요.</p></div>`;
      actionsHtml = `<a href="${escapeAttr(detailHref)}" class="official-link">공고 상세 보기 &rarr;</a>`;
    } else {
      // Tier 2(상세 확인 필요) / 4(참여 어려움) — 상세로 이동해 확인.
      badgeLabel = gradeLabel || '확인 필요'; badgeTone = tier === 4 ? 'pj-grade--fail' : 'pj-grade--review'; eyebrow = '가장 먼저 확인하세요';
      const rawReasons = (j.reasons || []).slice(0, 3);
      bodyHtml = rawReasons.length ? `<div class="dash-hero-why dash-hero-why--review"><span class="dash-hero-why-lbl">AI가 확인하지 못한 조건</span><ul>${rawReasons.map(r => `<li>• ${escapeHtml(r)}</li>`).join('')}</ul></div>` : '';
      actionsHtml = `<button type="button" class="btn btn-primary dash-hero-cta">조건 확인하기</button><a href="#/me/saved-searches" class="official-link">맞춤공고 전체 보기 &rarr;</a>`;
    }
    topPickHtml = `
      <section class="dash-hero" data-notice-id="${escapeAttr(topPick.noticeId)}" data-participate="${participate}" data-cta-href="${escapeAttr(detailHref)}">
        <div class="dash-hero-eyebrow">${eyebrow}</div>
        <h3 class="dash-hero-title">${escapeHtml(topPick.title)}</h3>
        <div class="dash-hero-meta"><span>${escapeHtml(topPick.organizationName || '-')}</span>${ddayBadgeHtml(topPick.applicationEndAt)}<span class="pj-mini ${badgeTone}">${escapeHtml(badgeLabel)}</span></div>
        ${bodyHtml}
        <div class="dash-hero-actions">${actionsHtml}</div>
      </section>`;
  }

  // ③ 오늘 할 일 — 실제 처리 todo(파이프라인·면허만료·공고변경). 추천과 별개 모집단.
  const itemsHtml = items.length
    ? `<section class="dash-block"><div class="dash-block-head"><h3>오늘 할 일</h3></div><div class="home-list">${items.map(homeListRowHtml).join('')}</div></section>`
    : '';

  // ④ 판정을 막고 있는 회사정보 ⑤ 이번 달 AI가 대신 처리한 일(접힘)
  const companyInfoHtml = renderCompanyInfoCardHtml(data.growthSummary, data.documentRequirementGaps);
  const automationInner = renderAutomationSummaryHtml(data.automationSummary);
  const automationHtml = automationInner
    ? `<details class="dash-automation-collapse"><summary>이번 달 AI가 대신 처리한 일</summary>${automationInner}</details>`
    : '';

  // greeting — 추천과 할 일을 모두 반영(모순 방지). 추천이 있으면 그걸 먼저 말한다.
  const recCount = recommendations.length;
  const todoCount = items.length;
  let greetingTitle;
  if (recCount && todoCount) greetingTitle = `검토할 맞춤공고 ${recCount}건, 처리할 일 ${todoCount}건이 있어요`;
  else if (recCount) greetingTitle = `검토할 맞춤공고 ${recCount}건이 있어요`;
  else if (todoCount) greetingTitle = `오늘 처리할 일 ${todoCount}건이 있어요`;
  else greetingTitle = '오늘은 급하게 확인할 업무가 없어요';

  // §1 보정: 카드/섹션 사이 세로 간격을 개별 margin이 아니라 부모 컨테이너의 flex gap으로
  // 통일한다(dash-hero 등 <section>은 하단 margin이 없어 다음 .detail-card와 붙어 보였음).
  container.appendChild(h(`
    <div class="dashboard-stack">
      <div class="dash-greeting">
        <p class="dash-greeting-eyebrow">안녕하세요.</p>
        <h2 class="dash-greeting-title">${escapeHtml(greetingTitle)}</h2>
      </div>
      <div id="dashboard-profile-banner"></div>
      ${topPickHtml}
      ${publicBidFitBannerHtml((currentProfile || {}).publicBidFit)}
      ${itemsHtml}
      ${companyInfoHtml}
      ${automationHtml}
      ${usefulLinksSectionHtml()}
    </div>
  `));
  renderDashboardProfileBanner(document.getElementById('dashboard-profile-banner'));

  // HERO CTA — 참여 가능은 곧바로 준비중에 담기(맞춤공고와 동일 패턴, 새 API 없음),
  // 그 외는 공고 상세로 이동. 되돌리기는 워크스페이스의 "참여 취소".
  const heroEl = container.querySelector('.dash-hero');
  if (heroEl) {
    const btn = heroEl.querySelector('.dash-hero-cta');
    if (btn) btn.addEventListener('click', async () => {
      if (heroEl.dataset.participate !== '1') { location.hash = heroEl.dataset.ctaHref; return; }
      btn.disabled = true; const orig = btn.textContent; btn.textContent = '담는 중...';
      try {
        const entry = await apiRequest('POST', '/api/notices/' + encodeURIComponent(heroEl.dataset.noticeId) + '/pipeline', { targetStatus: '준비중' });
        location.hash = '#/pipeline/' + entry.id;
      } catch (err) {
        btn.disabled = false; btn.textContent = orig;
        if (err.status === 401) { location.hash = '#/auth/login'; return; }
        if (err.code === 'company_profile_required') { showToast('회사 정보를 먼저 등록해주세요.', 'error'); return; }
        if (err.code === 'pipeline_quota_exceeded') { showToast('진행 중 사업 등록 한도에 도달했습니다.', 'error'); return; }
        showToast(err.message || '참여 처리에 실패했습니다.', 'error');
      }
    });
    // HERO 인라인 REVIEW 질문 답변 — 공고 상세와 완전히 동일한 저장(POST /api/me/
    // licenses|certifications)·정책. 보유/미보유 저장 후 대시보드를 다시 받아 재렌더하면
    // 판정이 재계산돼 HERO가 즉시 갱신된다(§5/§7). "잘 모르겠어요"는 저장 없이 접기만.
    heroEl.querySelectorAll('.pj-question').forEach(qEl => {
      qEl.querySelectorAll('.pj-answer-btn').forEach(ansBtn => {
        ansBtn.addEventListener('click', async () => {
          const answer = ansBtn.dataset.answer;
          if (answer === '모름') {
            qEl.remove();
            // 남은 질문이 없으면 상세에서 이어서 확인할 수 있게 안내(REVIEW 유지).
            if (!heroEl.querySelector('.pj-question')) {
              const qWrap = heroEl.querySelector('.dash-hero-questions');
              if (qWrap) qWrap.innerHTML = '<p class="dash-hero-skip-note">나중에 공고 상세에서 다시 확인할 수 있어요.</p>';
            }
            return;
          }
          const kind = qEl.dataset.kind, category = qEl.dataset.category, name = qEl.dataset.name;
          qEl.querySelectorAll('.pj-answer-btn').forEach(b => b.disabled = true);
          const endpoint = kind === 'certification' ? '/api/me/certifications' : '/api/me/licenses';
          try {
            await apiRequest('POST', endpoint, { category, name, status: answer });
            showToast(answer === '보유' ? '보유로 저장했습니다 — 판정을 갱신합니다.' : '미보유로 저장했습니다.', 'success');
            const fresh = await apiRequest('GET', '/api/dashboard'); // 재판정
            renderDashboard(container, fresh); // 홈 재렌더 → HERO 즉시 갱신
          } catch (err) {
            qEl.querySelectorAll('.pj-answer-btn').forEach(b => b.disabled = false);
            if (err.code === 'owner_only') { showToast('면허·인증 등록은 대표 계정만 가능합니다.', 'error'); return; }
            if (err.status === 401) { location.hash = '#/auth/login'; return; }
            showToast(err.message || '저장에 실패했습니다.', 'error');
          }
        });
      });
    });
  }
  wireHomeListNav(container);
  wireUsefulLinksSection(container);
}

// renderAutomationSummaryHtml — "이번 달 자동화 성과". 절감시간은 실측이
// 아니라 가정이므로(과장 금지 원칙, Phase 7과 동일) 서버가 내려주는
// savedMinutesAssumption 문구를 항상 그대로 함께 보여준다 — 숫자만 크게
// 보여주고 근거를 숨기지 않는다. 핵심 숫자(절감시간)는 stat-highlight로
// 크게, 근거 문장은 작게 아래에 둔다(디자인 시스템: 숫자 위계).
// dashboardRecoSummaryHtml — "오늘의 맞춤공고"(2026-08-10 §3/§4). 대시보드에서는 전체
// 활성공고 판정 분포(eligibilitySummary)가 아니라 '실제 추천된 공고'(recommendations
// 모집단)만 쓴다. 같은 배열을 participationJudgment 기준(savedSearchRecoGroup)으로 프론트
// 집계해 참여 가능/확인 필요/분석 대기만 보여주고(0건 그룹 숨김), 목록은 맞춤공고 화면으로
// 넘긴다([맞춤공고 보기]). eligibilitySummary(전체 활성공고 표본)와 절대 혼합하지 않는다.
function dashboardRecoSummaryHtml(recommendations) {
  const recs = recommendations || [];
  if (!recs.length) {
    return `
      <div class="detail-card dash-reco-card">
        <div class="dash-reco-head"><h3>오늘의 맞춤공고</h3></div>
        <p class="license-card-meta">지금 조건에 맞는 새 추천 공고가 없어요.</p>
        <a href="#/me/saved-searches" class="official-link">맞춤공고 조건 보기 &rarr;</a>
      </div>`;
  }
  const counts = {};
  SS_RECO_GROUPS.forEach(g => { counts[g.key] = 0; });
  recs.forEach(it => { const k = savedSearchRecoGroup(it); counts[k] = (counts[k] || 0) + 1; });
  const chips = SS_RECO_GROUPS.filter(g => counts[g.key] > 0).map(g =>
    `<span class="dash-reco-chip"><span class="pj-mini ${g.tone}">${escapeHtml(g.label)}</span> <strong>${counts[g.key]}</strong></span>`).join('');
  return `
    <div class="detail-card dash-reco-card">
      <div class="dash-reco-head"><h3>오늘의 맞춤공고</h3><span class="dash-reco-total">${recs.length}건</span></div>
      <div class="dash-reco-summary">${chips}</div>
      <a href="#/me/saved-searches" class="official-link">맞춤공고 보기 &rarr;</a>
    </div>`;
}

// renderAutomationSummaryHtml — "이번 달 자동 처리"(2026-08-10 §5 재정리). 실제 측정
// 가능한 처리량(공고 분석·변경사항 추적)을 먼저 크게 보여주고, "예상 절감시간"은 추정임을
// 명시해 하단 보조로 둔다. analyzedCount는 dashboardNoticeScanLimit(500) 캡이므로 "표본
// 최대 500건"임을 함께 표기해 오해를 막는다. 우선검토 압축(narrowedCount)은 "추천 0건인데
// N시간 절감"처럼 읽히는 혼란을 줄이려 표시하지 않는다(데이터는 DTO에 그대로 유지).
function renderAutomationSummaryHtml(a) {
  if (!a) return '';
  // §8: 실제 처리 데이터가 하나도 없으면 카드 자체를 숨긴다(0/0 카드 생성 안 함).
  if (!a.analyzedCount && !a.changesTrackedCount) return '';
  const hours = Math.round(a.estimatedSavedMinutes / 60 * 10) / 10;
  return `
    <div class="detail-card dash-automation-card">
      <h3>이번 달 자동 처리</h3>
      <div class="dash-auto-stats">
        <div class="dash-auto-stat"><span class="dash-auto-num">${a.analyzedCount}건</span><span class="dash-auto-lbl">공고 분석</span></div>
        <div class="dash-auto-stat"><span class="dash-auto-num">${a.changesTrackedCount}건</span><span class="dash-auto-lbl">변경사항 추적</span></div>
      </div>
      <p class="license-card-meta dash-auto-caveat">예상 절감시간 약 <strong>${hours}시간</strong> (추정) · ${escapeHtml(a.savedMinutesAssumption)} · 이번 달 분석 표본 최대 500건 기준</p>
    </div>
  `;
}

// renderGrowthSummaryHtml — 성장 제안은 이번 단계에서 프로필 완성도 요약
// 카드 하나만 가볍게 둔다("영향받은 공고 N건"처럼 근거를 계산해 보여주는

function renderGrowthSummaryHtml(g) {
  if (!g) return '';
  // "AI 분석 커버리지 %"는 사용자가 돈을 내는 가치가 아니라 보조 지표라, 메인
  // 첫인상에서 약화한다(2026-08-09) — 회사정보 등록 정도로 문구를 바꾸고 위치도
  // 하단 보조영역으로 내린다. AI 사용내역 링크는 상단 타일에서 뺀 대신 여기에 둔다.

        <div class="stat-highlight-label">등록할수록 더 많은 공고를 정확하게 판정할 수 있어요</div>
      </div>
      <a href="#/me/company" class="official-link">회사정보 보완하기 &rarr;</a>

// renderCompanyInfoCardHtml — "회사정보 등록 정도"(%)와 "회사정보 보완"(부족 항목)을
// 하나의 카드로 합친다(2026-08-09, §13). 왜 등록해야 하는지(부족 항목 + 영향 건수)를
// %와 함께 한 곳에서 보여준다. g/gaps가 모두 없으면 렌더 생략.
// COMPANY_INFO_GAP_USAGE — 각 회사정보 항목이 '현재 판정에서 실제로 어떻게 쓰이는지'를
// 정직하게 적는다(2026-08-10 §4). 면허·인증만 참여 판정(buildParticipationJudgment)에
// 직접 반영되고, 직접생산은 boolean뿐이라 요구 시 확인 항목(항상 REVIEW), 수행실적은
// 판정 등급(grade)에는 쓰이지 않고 공동수급/참고 신호로만 쓰인다. 과장 금지.
// 회사정보 gap 카피(Phase 1 보정 §4): 개발자/정책 설명이 아니라 "사용자가 얻는 결과"
// 중심. 제목(행동) + 혜택 한 줄 + (있으면) 실데이터 영향 건수. 과장 금지 — 면허/인증은
// 판정에 직접 쓰이지만, 수행실적은 grade 미사용이라 "참고" 수준으로만 정직하게 적는다.
const COMPANY_INFO_GAP_COPY = {
  license: { title: '보유 면허를 등록해주세요', benefit: '면허가 필요한 공고를 자동으로 확인할 수 있어요.' },
  certification: { title: '인증 정보를 등록해주세요', benefit: '인증이 필요한 공고를 자동으로 확인할 수 있어요.' },
  directProduction: { title: '직접생산확인 정보를 등록해주세요', benefit: '직접생산을 요구하는 공고를 확인할 수 있어요.' },
  trackRecord: { title: '수행실적을 등록해주세요', benefit: '공동수급·세부 자격 검토에 활용돼요.' },
};
function companyInfoGapHtml(category, label, noticeCount) {
  const c = COMPANY_INFO_GAP_COPY[category] || { title: `${label}을(를) 등록해주세요`, benefit: '' };
  const impact = noticeCount > 0 ? `<span class="company-info-gap-impact">관련 공고 ${noticeCount}건</span>` : '';
  return `<li class="company-info-gap">
    <div class="company-info-gap-title">${escapeHtml(c.title)}${impact}</div>
    ${c.benefit ? `<div class="company-info-gap-benefit">${escapeHtml(c.benefit)}</div>` : ''}
  </li>`;
}

// renderCompanyInfoCardHtml — "판정을 더 정확하게 만들 수 있어요"(2026-08-10 §4).
// %(overallCompleteness)는 업무 목적이 아니라 보조 지표라 작은 한 줄로 약화하고, 실제로
// 부족한 항목(documentRequirementGaps)을 항목별 정직 문구와 함께 중심에 둔다.
// (2026-08-10 §8) 4개 항목을 전부 크게 나열하지 않고, 판정 개선 효과가 가장 큰 1개
// (관련 공고 수 desc)만 크게 노출한다. 나머지는 "다른 회사정보 N개 보기 ▾"로 접는다.
// noticeCount==0이면 "0개 공고" 같은 문구를 크게 쓰지 않는다(혜택 문구로 대체).
const COMPANY_INFO_GAP_CTA = { license: '면허 등록하기', certification: '인증 등록하기', directProduction: '직접생산확인 등록하기', trackRecord: '수행실적 등록하기' };
// 회사정보 판정 영향도 tier(§4, 낮을수록 판정에 직접적). 면허·인증=buildParticipationJudgment
// 직접 사용, 직접생산=요구 시 확인 항목, 수행실적=grade 미사용(공동수급·참고). 코드 기준 사실.
const COMPANY_INFO_IMPACT_TIER = { license: 0, certification: 0, directProduction: 1, trackRecord: 2 };
function renderCompanyInfoCardHtml(g, gaps) {
  const pct = g ? g.overallCompleteness : null;
  const list = (gaps || []).slice();
  if (!list.length) {
    if (pct == null) return '';
    return `
    <div class="detail-card dash-growth-card">
      <p class="license-card-meta">회사정보 등록 <strong>${pct}%</strong> · 필요한 회사정보를 모두 등록하셨습니다.</p>
      <a href="#/me/company" class="official-link">회사정보 보기 &rarr;</a>
    </div>`;
  }
  // 판정 영향도 우선(§4): 면허·인증(judgment 직접 사용) → 직접생산(확인 항목) → 수행실적
  // (grade 미사용). 같은 tier 안에서만 noticeCount 내림차순. 그래서 수행실적 noticeCount가
  // 아무리 커도 미등록 면허/인증보다 대표로 올라오지 않는다.
  const impactTier = c => (COMPANY_INFO_IMPACT_TIER[c] != null ? COMPANY_INFO_IMPACT_TIER[c] : 9);
  list.sort((a, b) => (impactTier(a.category) - impactTier(b.category)) || ((b.noticeCount || 0) - (a.noticeCount || 0)));
  const top = list[0];
  const rest = list.slice(1);
  const topCopy = COMPANY_INFO_GAP_COPY[top.category] || { title: `${top.label}을(를) 등록해주세요`, benefit: '' };
  // 제목(§6): 실제 판정에 쓰이는 항목(면허·인증·직접생산, tier<=1)이 하나라도 있으면 "판정을
  // 막고 있는 정보". 남은 게 수행실적(grade 미사용)뿐이면 "추가로 등록할 회사정보".
  const hasJudgmentGap = list.some(x => impactTier(x.category) <= 1);
  const cardTitle = hasJudgmentGap ? '판정을 막고 있는 정보' : '추가로 등록할 회사정보';
  // 대표 항목 설명: 판정 항목(tier<=1)이고 noticeCount>0일 때만 "N개 공고의 조건을 확정하지
  // 못하고 있어요"(§8, 실데이터). 그 외(수행실적 등)는 과장 없는 혜택 문구.
  const impactLine = (impactTier(top.category) <= 1 && top.noticeCount > 0)
    ? `${escapeHtml(top.label)} 정보가 없어 ${top.noticeCount}개 공고의 조건을 확정하지 못하고 있어요.`
    : escapeHtml(topCopy.benefit || '');
  const ctaLabel = COMPANY_INFO_GAP_CTA[top.category] || '회사정보 등록하기';
  const restHtml = rest.length
    ? `<details class="company-info-more"><summary>다른 회사정보 ${rest.length}개 보기</summary><ul class="company-info-gaps">${rest.map(x => companyInfoGapHtml(x.category, x.label, x.noticeCount)).join('')}</ul></details>`
    : '';
  // 73%(§7): 홈에서는 완성도 %를 표시하지 않는다(무엇을 등록하면 무엇이 되는지만).
  return `
    <div class="detail-card dash-growth-card">
      <h3>${cardTitle}</h3>
      <div class="company-info-top">
        <div class="company-info-top-title">${escapeHtml(topCopy.title)}</div>
        ${impactLine ? `<p class="company-info-top-benefit">${impactLine}</p>` : ''}
        <a href="#/me/company" class="btn btn-primary company-info-cta">${escapeHtml(ctaLabel)}</a>
      </div>
      ${restHtml}
    </div>
  `;
}

// ELIGIBILITY_MISSING_FIELD_LABELS — dashboard.go의 eligibilitySummary.
// missingFields(지역/업종/기업규모 중 회사 프로필에 실제로 비어있는 값)를
// 화면 문구용 한글 라벨로 바꾼다. renderEligibilitySummaryHtml/
// renderOnboardingComplete 둘 다 공유.
const ELIGIBILITY_MISSING_FIELD_LABELS = { region: '사업장 지역', industry: '업종', companySize: '기업 규모' };

// eligibilityConfidenceTier — Phase UX-04(2026-08-04). 회사 정보가 너무
// 적으면(overallCompleteness<30%) 개별 판정(즉시참여/조건보완/참여어려움)이
// 사실상 근거가 얕은 추측이 되므로, 판정 로직(scoreNoticeForCompany) 자체는
// 그대로 두고 "표시 레이어"에서만 전부 "확인 필요"로 묶어 보여준다 —
// 판정을 새로 만드는 게 아니라 이미 있는 결과를 신뢰도에 따라 다르게
// 보여줄 뿐. 30~70%/70%+ 두 구간은 기존 필드별 insufficient_data
// 메커니즘이 이미 자연스럽게 "일부만 판정→대부분 판정"으로 정밀도가
// 올라가는 효과를 내고 있어 별도 로직이 필요 없다(사용자 확인 완료 —
// 임의의 새 임계값 로직을 더 만들지 않기로 함).
function eligibilityConfidenceTier(overallCompleteness) {
  if (overallCompleteness == null) return 'full';
  return overallCompleteness < 30 ? 'low' : 'full';
}

// eligibilitySummaryRowsHtml — renderEligibilitySummaryHtml(대시보드 카드)와
// renderOnboardingComplete(온보딩 완료 화면) 둘 다 같은 3버킷 표시를 쓰므로
// 신뢰도 기반 표시 전환 로직을 여기 하나로 공유한다.
function eligibilitySummaryRowsHtml(eg, overallCompleteness) {
  const total = eg.ready + eg.needsReview + eg.notRecommended + eg.insufficientData;
  if (eligibilityConfidenceTier(overallCompleteness) === 'low') {
    return `
      <p class="low-confidence-note">⚠️ 등록된 회사 정보가 적어 판정 정확도가 낮습니다. 정보를 등록하면 더 정확한 판정을 받을 수 있어요.</p>
      <div class="profile-summary-list">
        <div class="profile-summary-row"><span>🔵 확인 필요</span><strong>${total}건</strong></div>
      </div>
    `;
  }
  // 라벨 통일(2026-08-09): 플랫폼 전체를 참여 가능/확인 필요/참여 어려움으로 통일.
  // 이 카드는 지역·업종·규모 3요소 기준이라 아래 캡션으로 근거를 밝혀 과신을 막는다.
  // 라벨 통일(2026-08-09): 플랫폼 전체 참여 가능/확인 필요/참여 어려움. 이 카드는
  // 지역·업종·규모 3요소 기준 자동 분류라 아래 캡션으로 근거를 명시한다(과신 방지).
  return `
    <div class="profile-summary-list">

      <div class="profile-summary-row"><span>🔴 참여 어려움</span><strong>${eg.notRecommended}건</strong></div>
    </div>

// renderEligibilitySummaryHtml — Phase UX-01(2026-08-04) 4버킷 판정 집계
// 카드(dashboard.go의 computeEligibilityBucketSummary — scoreNoticeForCompany를
// 그대로 재사용, 판정 로직 자체는 안 건드림). "판정 불가" 건은 missingFields
// 근거로 "입력하기" CTA까지 함께 보여준다 — 지역/업종/기업규모만 실제
// 판정기준이 있어 정확한 건수를 낼 수 있고(사용자 확인 완료), 실적/인증/
// 재무는 이 카드에 안 넣는다(정확한 건수를 낼 판정기준이 없음).
function renderEligibilitySummaryHtml(eg, overallCompleteness) {
  if (!eg) return '';
  const total = eg.ready + eg.needsReview + eg.notRecommended + eg.insufficientData;
  const missingLabels = (eg.missingFields || []).map(f => ELIGIBILITY_MISSING_FIELD_LABELS[f] || f);
  const isLowConfidence = eligibilityConfidenceTier(overallCompleteness) === 'low';
  return `
    <div class="detail-card">
      <h3>추천공고 판정 현황</h3>
      <p class="license-card-meta">활성 공고 ${total}건을 지역·업종·규모 기준으로 자동 분류 (면허·실적 등 세부 자격은 공고 상세에서 확인)</p>
      ${eligibilitySummaryRowsHtml(eg, overallCompleteness)}
      ${!isLowConfidence && eg.insufficientData > 0 && missingLabels.length ? `
        <p class="license-card-meta">${escapeHtml(missingLabels.join('·'))} 정보가 없어 ${eg.insufficientData}건을 정확하게 판정하지 못했습니다. <a href="#/me/company">입력하기 &rarr;</a></p>
      ` : ''}
    </div>
  `;
}

// renderDocumentRequirementGapsHtml — Phase UX-02(2026-08-04) "부족한 정보
// 안내" 카드. dashboard.go computeDocumentRequirementGaps가 required_documents
// (공고별 실제 제출서류)를 키워드 매칭해 낸 실제 건수만 쓴다 — eligibility.go
// 판정엔진에 없는 카테고리(실적/인증/직접생산확인)라 "판정"이 아니라 "이
// 서류를 요구하는 공고 수"로 표현한다(임의의 숫자 없음, 계산 불가하면
// 이 카드 자체가 렌더링 안 됨).
function renderDocumentRequirementGapsHtml(gaps) {
  if (!gaps || !gaps.length) return '';

// homeListRowHtml — 원형 아이콘 + 제목/부제 + D-day 배지 + 행동 버튼 +
// 화살표(토스 스타일 행 리스트). 부제는 "기관 · 상태" 대신 서버가
// 내려주는 reason(사유)을 그대로 써서 왜 이 항목이 여기 있는지 바로
// 알 수 있게 한다. ctaLabel(서버가 이미 계산한 "서류 확인"/"담당자
// 지정"/"검토하기")은 클릭 전에도 바로 보이도록 버튼으로 노출한다
// (대시보드 행동유도, 2026-08-06 — 이전엔 data-cta-href에만 담겨있어
// 클릭해봐야 뭘 하는 버튼인지 알 수 있었다). 행 전체가 ctaHref로
// 이동한다(kind별 이동 규칙은 서버가 이미 확정해 내려주므로 프론트는
// 다시 판단하지 않는다) — 버튼도 별도 리스너 없이 이 이동을 그대로
// 상속받는다.
// HOME_JUDGMENT_TONE — 추천 카드 판정 미니배지 색(공고 상세 pj-grade와 동일 톤).
const HOME_JUDGMENT_TONE = { ready: 'pj-grade--ready', needsReview: 'pj-grade--review', notRecommended: 'pj-grade--fail' };

function homeListRowHtml(item) {
  const org = item.organizationName || '-';
  // 추천 항목엔 상세와 동일한 판정(judgment)을 미니배지+짧은 이유로 보여준다.
  // 판정이 있으면 기존 "참여 여부 결정 필요" 일반 문구 대신 판정 이유를 쓴다.
  const j = item.judgment;
  const subtitle = j ? org : (item.reason ? `${org} · ${item.reason}` : org);
  let judgmentHtml = '';
  if (j) {
    const tone = HOME_JUDGMENT_TONE[j.grade] || 'pj-grade--review';
    // "참여 가능"(ready)은 REVIEW/FAIL 사유가 없어 reasons가 비는데, 등급 정의상
    // 지역·업종·기업규모 3요소가 모두 충족된 상태다(scoreNoticeForCompany 기준). 그래서
    // 근거가 없는 게 아니라 "충족했다"는 사실을 정직하게 한 줄로 보여준다(가짜 값 아님).
    const rawReasons = (j.reasons || []).slice(0, 2);
    const reasonText = rawReasons.length
      ? rawReasons.map(escapeHtml).join(' · ')
      : (j.grade === 'ready' ? '지역·업종·기업규모 요건을 충족했습니다' : '');
    judgmentHtml = `<div class="home-list-judgment"><span class="pj-mini ${tone}">${escapeHtml(j.gradeLabel || '')}</span>${reasonText ? `<span class="home-list-judgment-reasons">${reasonText}</span>` : ''}</div>`;
  }
  const dday = ddayInfo(item.applicationEndAt);
  const isUrgent = dday.cls.includes('danger');
  const icon = LIST_ROW_ICONS[item.kind] || LIST_ROW_ICONS.pipeline;
  return `
    <div class="home-list-row${isUrgent ? ' home-list-row--urgent' : ''}" data-cta-href="${escapeAttr(item.ctaHref || '')}">
      <span class="home-list-icon">${icon}</span>
      <div class="home-list-main">
        <div class="home-list-title">${escapeHtml(item.title)}</div>
        <div class="home-list-subtitle">${escapeHtml(subtitle)}</div>
        ${judgmentHtml}
      </div>
      <div class="home-list-side">
        ${ddayBadgeHtml(item.applicationEndAt)}
        ${item.ctaLabel ? `<button type="button" class="home-list-cta" tabindex="-1">${escapeHtml(item.ctaLabel)}</button>` : ''}
        <span class="home-list-arrow">&rsaquo;</span>
      </div>
    </div>
  `;
}

// wireHomeListNav — 행 클릭 시 서버가 정해준 ctaHref로 이동(kind별로

// ---------- 진행 중 사업 (#/pipeline) ----------
// PIPELINE_LIST_FILTERS — 대시보드 요약 카드(dashboard.go의 summary 집계와
// 정확히 같은 정의)에서 "#/pipeline?filter=키"로 들어왔을 때 적용할
// 조건. 전부 "종결되지 않은"(PIPELINE_ACTIVE_STATUSES) 항목만 대상으로
// 한다 — dashboard.go도 이 4개 카드 전부 active 상태만 센다.
const PIPELINE_LIST_FILTERS = {
  reviewPending: {
    label: '참여검토 대기',
    test: it => ['검토중'].includes(it.status),
  },
  deadlineSoon: {
    label: '마감임박',
    test: it => {
      if (!PIPELINE_ACTIVE_STATUSES.includes(it.status)) return false;
      const d = diffDaysFromToday(it.submissionDeadline);
      return d >= 0 && d <= 7;
    },
  },
  needsDocument: {
    label: '서류확인필요',
    test: it => PIPELINE_ACTIVE_STATUSES.includes(it.status) && (it.incompleteDocumentCount || 0) > 0,
  },
  unassigned: {
    label: '담당자미지정',
    test: it => PIPELINE_ACTIVE_STATUSES.includes(it.status) && !it.assigneeName,
  },
};

function diffDaysFromToday(iso) {
  if (!iso) return Infinity;
  const d = new Date(iso);
  if (isNaN(d)) return Infinity;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const target = new Date(d); target.setHours(0, 0, 0, 0);
  return Math.round((target - today) / 86400000);
}

async function renderPipelineList(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/pipeline');
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  const items = data.items || [];
  container.innerHTML = '';

  const filterKey = new URLSearchParams(location.hash.split('?')[1] || '').get('filter');
  const filter = PIPELINE_LIST_FILTERS[filterKey];

  if (filter) {
    const filtered = items.filter(filter.test);
    const bannerHtml = `
      <div class="pipeline-filter-banner">
        <span>필터: ${escapeHtml(filter.label)} (${filtered.length}건)</span>
        <a href="#/pipeline" class="official-link">전체보기 &rarr;</a>
      </div>
    `;
    container.appendChild(h(`<h2>진행 중 사업</h2>${bannerHtml}`));
    if (!filtered.length) {
      container.appendChild(h('<p class="empty">조건에 맞는 사업이 없습니다.</p>'));
      return;
    }
    container.appendChild(h(`<div class="notice-list">${filtered.map(pipelineListRowHtml).join('')}</div>`));
    container.querySelectorAll('.pipeline-row').forEach(row => {
      row.addEventListener('click', () => { location.hash = '#/pipeline/' + row.dataset.id; });
    });
    return;
  }

  if (!items.length) {
    container.appendChild(h(`
      <h2>진행 중 사업</h2>
      <p class="empty">아직 참여 검토 중인 사업이 없습니다. 공고 상세에서 "참여 검토"를 눌러 시작하세요.</p>
    `));
  } else {
    // 뷰(리스트/칸반/표)는 자기 컨테이너를 다시 그리므로(renderPipelineViews의
    // 뷰 전환 재호출), 담당자 관리가 지워지지 않도록 별도 하위 박스에 렌더한다.
    const viewsBox = document.createElement('div');
    container.appendChild(viewsBox);
    renderPipelineViews(viewsBox, items);
  }
  // 담당자 관리(IA 재정리 2026-08-10) — 담당자는 추천보다 "진행 중 사업 운영"과
  // 관련이 커 맞춤공고에서 여기로 옮겼다. 자주 여는 기능이 아니라 접힘(details).
  // renderContactsTab은 (container)만 받는 자족 CRUD라 그대로 재사용(데이터/API 무변경).
  const contactsWrap = h(`
    <details class="pipeline-contacts-collapse">
      <summary>담당자 관리</summary>
      <div id="pipeline-contacts-section"></div>
    </details>
  `);
  container.appendChild(contactsWrap);
  renderContactsTab(document.getElementById('pipeline-contacts-section'));
}

// renderPipelineViews — Phase 3: 리스트/칸반/표 뷰 토글의 공용 껍데기.
// items는 GET /api/pipeline 한 번으로 받은 걸 그대로 재사용하고(뷰를
// 바꿔도 재요청 없음), 모바일(≤640px)에서는 칸반/표가 쓸모없어(가로
// 공간 부족) 토글 자체를 숨기고 항상 리스트로 강제한다.
let pipelineViewMode = 'list';
let pipelineViewsLastIsMobile = null;

// 이 SPA는 라우트 전환마다 #app.innerHTML을 통째로 새로 그리는 방식이라
// (route() 참고) 화면 대부분은 리사이즈에 반응할 필요가 없다(모바일
// 진입 시 매번 새로 렌더링되므로 window.innerWidth를 그때 한 번만 읽으면
// 충분). 다만 칸반/표 뷰는 "이미 데스크톱 폭에서 그려진 화면을 그대로
// 좁혀도" 강제로 리스트로 안 바뀌는 게 이상하므로, 이 화면만 예외적으로
// 브레이크포인트를 넘을 때 다시 그리는 전역 리스너를 한 번 등록해둔다.
window.addEventListener('resize', () => {
  if ((location.hash || '#/').split('?')[0] !== '#/pipeline') return;
  const nowMobile = window.innerWidth <= 640;
  if (nowMobile === pipelineViewsLastIsMobile) return;
  renderPipelineList(app);
});

function renderPipelineViews(container, items) {
  container.innerHTML = '';
  const isMobile = window.innerWidth <= 640;
  pipelineViewsLastIsMobile = isMobile;
  const mode = isMobile ? 'list' : pipelineViewMode;

  container.appendChild(h(`
    <div class="pipeline-view-header">
      <h2>진행 중 사업</h2>
      ${isMobile ? '' : pipelineViewSwitchHtml(mode)}
    </div>
  `));

  const body = document.createElement('div');
  container.appendChild(body);

  if (mode === 'kanban') renderPipelineKanban(body, items);
  else if (mode === 'table') renderPipelineTable(body, items);
  else renderPipelineListView(body, items);

  container.querySelectorAll('.pipeline-view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      pipelineViewMode = btn.dataset.view;
      renderPipelineViews(container, items);
    });
  });
}

function pipelineViewSwitchHtml(mode) {
  const views = [['list', '리스트'], ['kanban', '칸반'], ['table', '표']];
  return `<div class="pipeline-view-switch">${views.map(([v, label]) =>
    `<button type="button" class="btn btn-secondary pipeline-view-btn${v === mode ? ' is-active' : ''}" data-view="${v}">${label}</button>`
  ).join('')}</div>`;
}

function renderPipelineListView(container, items) {
  const grouped = {};
  items.forEach(it => { (grouped[it.status] = grouped[it.status] || []).push(it); });

  const sectionsHtml = PIPELINE_STATUS_LIST.map(status => {
    const group = grouped[status] || [];
    if (!group.length) return '';
    return `
      <div class="pipeline-status-section">
        <h3 class="pipeline-status-section-title">${escapeHtml(status)} <span class="pipeline-status-section-count">${group.length}건</span></h3>
        <div class="notice-list">${group.map(pipelineListRowHtml).join('')}</div>
      </div>
    `;
  }).join('');

  container.innerHTML = sectionsHtml;

  container.querySelectorAll('.pipeline-row').forEach(row => {
    row.addEventListener('click', () => { location.hash = '#/pipeline/' + row.dataset.id; });
  });
}

// ---------- 파이프라인 칸반 뷰(Phase 3) ----------
// 진행중 4개 상태만 컬럼으로 쓰고, 종결 5개는 칸반 아래 접이식 섹션에
// 모아둔다(제출완료~제외까지 컬럼으로 늘어놓으면 폭이 9개라 실사용성이
// 떨어진다고 판단 — 요구사항 확정 시 사용자와 합의된 내용).
const PIPELINE_TERMINAL_STATUSES = PIPELINE_STATUS_LIST.filter(s => !PIPELINE_KANBAN_COLUMNS.includes(s));

// 2026-08-06: 리스트 뷰(pipelineListRowHtml)에 이어 칸반 카드에도 예산/
// 공고상태/공고유형배지를 추가 — noticeRowHtml/pipelineListRowHtml과
// 같은 포맷 함수 재사용. 칸반 카드는 폭이 좁아 지역/업종까지는 넣지
// 않고 요청받은 3개(예산·공고상태·입찰공고 배지)만 반영.
function pipelineKanbanCardHtml(entry) {
  const assignee = entry.assigneeName ? escapeHtml(entry.assigneeName) : '담당자 미지정';
  const gradeHtml = entry.aiGrade ? gradeBadgeHtml(entry.aiGrade, GRADE_LABELS[entry.aiGrade] || entry.aiGrade) : '';
  return `
    <div class="kanban-card" draggable="true" data-id="${escapeAttr(entry.id)}">
      <div class="kanban-card-title">${escapeHtml(entry.noticeTitle)}</div>
