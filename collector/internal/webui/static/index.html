  renderLicenseListInto(document.getElementById('ip-list'), ip.items, '아직 등록한 지식재산권 정보가 없습니다.', ipCardHtml);

  const formSlot = document.getElementById('license-form-slot');
  const fileInput = document.getElementById('license-file-input');

  document.getElementById('license-upload-btn').addEventListener('click', () => fileInput.click());
  document.getElementById('license-manual-btn').addEventListener('click', () => {
    renderLicenseConfirmForm(formSlot, null, null, () => renderLicenses(container));
  });

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!file) return;

    formSlot.innerHTML = '';
    formSlot.appendChild(h('<div class="loading">문서를 분석하는 중...</div>'));

    const fd = new FormData();
    fd.append('file', file);
    let data;
    try {
      const res = await fetch('/api/me/company-profile/documents', { method: 'POST', body: fd });
      data = await res.json().catch(() => null);
      if (!res.ok) {
        const code = data && data.error;
        const err = new Error((code && ERROR_MESSAGES[code]) || ('요청 실패 (' + res.status + ')'));
        err.status = res.status;
        throw err;
      }
    } catch (err) {
      formSlot.innerHTML = '';
      formSlot.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
      return;
    }

    formSlot.innerHTML = '';
    renderLicenseConfirmForm(formSlot, data.candidate, data.documentId, () => renderLicenses(container));
  });

  const ipFormSlot = document.getElementById('ip-form-slot');
  const ipFileInput = document.getElementById('ip-file-input');

  document.getElementById('ip-upload-btn').addEventListener('click', () => ipFileInput.click());
  document.getElementById('ip-manual-btn').addEventListener('click', () => {
    renderIPConfirmForm(ipFormSlot, null, null, () => renderLicenses(container));
  });

  ipFileInput.addEventListener('change', async () => {
    const file = ipFileInput.files[0];
    ipFileInput.value = '';
    if (!file) return;
    ipFormSlot.innerHTML = '';
    ipFormSlot.appendChild(h('<div class="loading">문서를 분석하는 중...</div>'));
    let uploadData;
    try {
      uploadData = await uploadCompanyRecordDocument('/api/me/intellectual-property/documents', file);
    } catch (err) {
      ipFormSlot.innerHTML = '';
      ipFormSlot.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
      return;
    }
    ipFormSlot.innerHTML = '';
    renderIPConfirmForm(ipFormSlot, uploadData.candidate, uploadData.documentId, () => renderLicenses(container));
  });
  disableOwnerOnlyButtons(container);
}

function ipCardHtml(item) {
  const parts = [];
  if (item.applicantName) parts.push(escapeHtml(item.applicantName));
  if (item.registrationNumber) parts.push('등록번호 ' + escapeHtml(item.registrationNumber));
  else if (item.applicationNumber) parts.push('출원번호 ' + escapeHtml(item.applicationNumber));
  if (item.expiresAt) parts.push('만료 ' + escapeHtml(item.expiresAt));
  return `
    <div class="license-card">
      <div class="license-card-main">
        <div class="license-card-name">${escapeHtml(item.title)} <span class="dot">·</span> ${escapeHtml(item.ipType)}</div>
        <div class="license-card-meta">${parts.join(' · ')}</div>
      </div>
      <div class="license-card-side">

        <span class="badge ${IP_STATUS_BADGE_TONE[item.status] || 'badge--gray'}">${escapeHtml(item.status)}</span>
      </div>
    </div>
  `;
}

  }

  }

function renderReviewList(listEl, items) {
  listEl.innerHTML = '';
  if (!items.length) {
    listEl.appendChild(h('<p class="empty">검토 대기 항목이 없습니다.</p>'));
    return;
  }
  const rows = items.map(it => `
    <div class="review-item" data-id="${escapeAttr(it.id)}" data-type="${escapeAttr(it.type)}">
      <div class="review-item-head">
        <span class="review-type-badge">${escapeHtml(REVIEW_TYPE_LABELS[it.type] || it.type)}</span>
        <a class="review-notice-link" href="#/notices/${escapeAttr(it.noticeId)}" target="_blank" rel="noopener">${escapeHtml(it.noticeTitle)} &rarr;</a>
      </div>
      <p class="condition-name">${escapeHtml(it.conditionName || it.documentName || '')}</p>
      <blockquote class="source-quote">${escapeHtml(it.sourceText || '(원문 없음)')}</blockquote>
      <div class="review-actions">
        <button type="button" class="review-btn review-btn--confirm" data-action="confirm">승인</button>
        <button type="button" class="review-btn review-btn--reject" data-action="reject">반려</button>
      </div>
    </div>
  `).join('');
  listEl.appendChild(h(rows));

  listEl.querySelectorAll('.review-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const card = btn.closest('.review-item');
      const id = card.dataset.id;
      const type = card.dataset.type;
      const action = btn.dataset.action;
      const endpoint = type === 'eligibility_condition'
        ? '/api/review/eligibility-conditions/' + encodeURIComponent(id)
        : '/api/review/required-documents/' + encodeURIComponent(id);

      card.querySelectorAll('.review-btn').forEach(b => b.disabled = true);
      try {
        await apiRequest('POST', endpoint, { action });
        card.remove();
        const countEl = document.getElementById('review-count');
        const remaining = listEl.querySelectorAll('.review-item').length;
        if (countEl) countEl.textContent = remaining + '건';
        if (remaining === 0) {
          listEl.appendChild(h('<p class="empty">검토 대기 항목이 없습니다.</p>'));
        }
      } catch (err) {
        card.querySelectorAll('.review-btn').forEach(b => b.disabled = false);
        let errEl = card.querySelector('.review-item-error');
        if (!errEl) {
          errEl = document.createElement('p');
          errEl.className = 'review-item-error';
          card.appendChild(errEl);
        }
        errEl.textContent = err.message;
      }
    });
  });
}

const PLAN_DISPLAY_NAMES = { free: 'Free', basic: 'Basic', pro: 'Pro', business: 'Business' };
const PLAN_STATUS_LABELS = { active: '이용 중', pending: '결제 대기', cancelled: '해지됨', expired: '만료됨' };
const PLAN_STATUS_BADGE_TONE = { active: 'badge--success', pending: 'badge--warn', cancelled: 'badge--gray', expired: 'badge--gray' };
// 백엔드(GET /api/billing/config)는 가격/한도 숫자만 주고, 마케팅 문구
// (기획서 기준 기능 bullet)는 여기서 따로 관리한다.
const PLAN_FEATURES = {
  free: ['파이프라인 3건', 'AI 분석 없음'],
  basic: ['파이프라인 무제한', 'AI 분석 월 5건'],
  pro: ['AI 분석 월 20건', '실적매칭 가능'],
  business: ['사용자 3명', 'AI 분석 월 60건'],
};

async function renderPricingPlans(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let config;
  try {
    config = await apiRequest('GET', '/api/billing/config');
  } catch (err) {
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  let currentPlan = null;
  if (currentUser) {
    try {
      const sub = await apiRequest('GET', '/api/me/subscription');
      // status가 active일 때만 "현재 플랜"으로 표시 — pending(체크아웃만
      // 하고 결제 미완료)인 동안 badge를 보여주면 마치 이미 구독 중인
      // 것처럼 착각하게 된다.
      if (sub.status === 'active') currentPlan = sub.plan;
    } catch (err) { /* 프로필 미등록 등 - 현재 플랜 강조 없이 진행 */ }
  }

  const cards = config.plans.map(p => {
    const isCurrent = currentPlan === p.plan;
    const features = (PLAN_FEATURES[p.plan] || []).map(f => `<li>${escapeHtml(f)}</li>`).join('');
    let actionHtml;
    if (isCurrent) {
      actionHtml = '<span class="plan-current-badge">현재 플랜</span>';
    } else if (!p.purchasable) {
      actionHtml = currentUser ? '' : '<a href="#/auth/signup" class="home-cta-secondary">무료로 시작하기</a>';
    } else {
      actionHtml = `<button type="button" class="plan-subscribe-btn" data-plan="${escapeAttr(p.plan)}">구독하기</button>`;
    }
    return `
      <div class="plan-card${isCurrent ? ' plan-card--current' : ''}">
        <h3 class="plan-card-name">${escapeHtml(p.name)}</h3>
        <p class="plan-card-price">${p.amount > 0 ? formatBudget(p.amount) + '/월' : '무료'}</p>
        <ul class="plan-card-features">${features}</ul>
        ${actionHtml}
      </div>
    `;
  }).join('');

  container.innerHTML = '';
  container.appendChild(h(`<h2>요금제</h2><div class="plan-grid">${cards}</div>`));

  container.querySelectorAll('.plan-subscribe-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!currentUser) { location.hash = '#/auth/login'; return; }
      location.hash = '#/billing/checkout?plan=' + encodeURIComponent(btn.dataset.plan);
    });
  });
}

async function renderBillingCheckout(container) {
  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  const plan = params.get('plan');

  if (!currentUser) { location.hash = '#/auth/login'; return; }
  if (!['basic', 'pro', 'business'].includes(plan)) {
    container.innerHTML = '';
    container.appendChild(h('<p class="error">잘못된 요금제입니다. <a href="#/billing/plans">요금제로 돌아가기</a></p>'));
    return;
  }

  container.innerHTML = '';
  container.appendChild(h('<div class="loading">결제 준비 중...</div>'));

  let config, checkout;
  try {
    config = await apiRequest('GET', '/api/billing/config');
    checkout = await apiRequest('POST', '/api/billing/checkout', { plan });
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  if (!config.tossClientKey) {
    container.innerHTML = '';
    container.appendChild(h('<p class="error">결제 기능은 테스트 키 발급 후 이용 가능합니다.</p>'));
    return;
  }

  container.innerHTML = '';
  container.appendChild(h(`
    <a href="#/billing/plans" class="back-link">&larr; 요금제로 돌아가기</a>
    <div class="detail-card">
      <p class="detail-eyebrow">${escapeHtml(checkout.orderName)}</p>
      <h2>${formatBudget(checkout.amount)} / 월</h2>
      <div id="checkout-error" class="error" style="display:none"></div>
      <button type="button" id="checkout-pay-btn" class="home-cta-primary">결제하기</button>
    </div>
  `));

  const errorBox = document.getElementById('checkout-error');
  const payBtn = document.getElementById('checkout-pay-btn');
  // API 개별 연동(결제창) — 결제위젯 연동 키가 나오기 전까지는 이 방식을
  // 쓴다. tossPayments 자체엔 requestPayment가 없고, .payment({customerKey})가
  // 반환하는 객체에 있다(공식 샘플: tosspayments/tosspayments-sample,
  // go-react/frontend/src/pages/payment/PaymentCheckout.jsx 확인).
  // customerKey는 이메일처럼 유추 가능한 값이면 안 되므로 불투명 UUID(회사
  // 프로필 id)를 쓴다 — checkout 응답에 이미 포함되어 있음.
  const tossPayments = TossPayments(config.tossClientKey);
  const payment = tossPayments.payment({ customerKey: checkout.customerKey });

  payBtn.addEventListener('click', async () => {
    errorBox.style.display = 'none';
    payBtn.disabled = true;
    try {
      // 승인 절차(서버가 paymentKey/orderId/amount로 confirm 호출)는 위젯
      // 방식과 완전히 동일 — POST /v1/payments/confirm 하나뿐이라 백엔드는
      // 그대로 재사용.
      //
      // 토스가 successUrl/failUrl에 쿼리를 붙일 때 이미 우리 URL에 '#'이
      // 있으면(해시 라우팅) 그 쿼리는 location.search가 아니라
      // location.hash 뒤에 붙는다 — renderBillingSuccess/Fail이 그렇게
      // 파싱한다(route()의 hash.split('?') 관례와 동일).
      await payment.requestPayment({
        method: 'CARD',
        amount: { currency: 'KRW', value: checkout.amount },
        orderId: checkout.orderId,
        orderName: checkout.orderName,
        customerName: currentUser.email,
        customerEmail: currentUser.email,
        successUrl: location.origin + location.pathname + '#/billing/success',
        failUrl: location.origin + location.pathname + '#/billing/fail',
        card: { useEscrow: false, flowMode: 'DEFAULT', useCardPoint: false, useAppCardOnly: false },
      });
    } catch (err) {
      payBtn.disabled = false;
      errorBox.textContent = err.message || '결제 요청 중 오류가 발생했습니다.';
      errorBox.style.display = 'block';
    }
  });
}

// parseRedirectParams — 토스 결제창 successUrl/failUrl 리다이렉트 파라미터를
// 읽는다. 실제로 어디에 붙어 돌아오는지 구현체마다 다를 수 있어(URL 스펙대로
// '#' 앞 쿼리스트링(location.search)에 넣을 수도, 우리 URL에 이미 '#'이 있어
// 그 뒤에 이어붙일 수도 있음 — 실사용에서 전자로 확인됨) 둘 다 확인한다.
// location.search를 우선하고, hash 뒤에 붙은 값으로 못 찾은 키만 보충한다.
function parseRedirectParams() {
  const params = new URLSearchParams(location.search);
  const hashQuery = location.hash.split('?')[1];
  if (hashQuery) {
    new URLSearchParams(hashQuery).forEach((v, k) => {
      if (!params.has(k)) params.set(k, v);
    });
  }
  return params;
}

  const amount = params.get('amount');

          <h2>${escapeHtml(PLAN_DISPLAY_NAMES[result.pendingPlan] || result.pendingPlan)} 플랜으로 전환 예약되었습니다</h2>

// 전부 이 함수를 쓴다 — 예전엔 3곳에 각각 복붙돼 있었음.
function paymentStatusToneClass(status) {
  if (status === '승인') return 'badge--success';
  if (status === '취소' || status === '환불') return 'badge--gray';
  return 'badge--danger'; // 실패
}

// ---------- 성장분석(#/growth) ----------
// 완성도·파이프라인 성과 추이는 새 스냅샷 없이 reports 테이블(주간/월간
// 배치가 이미 채움)을 그대로 시간순으로 보여준다 — 리포트 기능 이전에
// 가입한 회사는 리포트가 쌓이기 전까지 이 표가 비어 있을 수 있다(정상,
// 배치가 돌면서 자연히 채워짐).
// growthTrendFilter — Phase 7 2단계: 추이 차트 기간 필터(전체/6개월/3개월).
// 데이터는 이미 한 번에 다 받아오므로(재요청 없음) 필터 전환은 순수
// 프론트 재렌더링이다 — #/pipeline 뷰 토글과 같은 패턴.
let growthTrendFilter = 'all';
const GROWTH_TREND_FILTERS = [['all', '전체'], ['6m', '6개월'], ['3m', '3개월']];

function filterTrendPointsByPeriod(points, filter) {
  if (filter === 'all') return points;
  const months = filter === '3m' ? 3 : 6;
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - months);
  return points.filter(p => new Date(p.periodStart) >= cutoff);
}

      ${donutChartHtml(gradeSegments)}
      <div class="donut-legend">${gradeSegments.map(s => `
        <div class="donut-legend-row">
          <span class="donut-legend-dot" style="background:var(${s.colorVar})"></span>
          <span class="donut-legend-label">${escapeHtml(s.label)}</span>
          <span class="donut-legend-value">${s.count}건</span>
        </div>
      `).join('')}</div>
    </div>
  ` : '<p class="empty">채점할 공고가 없습니다.</p>';

  const roi = data.roi || {};
  const ratioLabel = roi.ratio != null ? (roi.ratio * 100).toFixed(0) + '%' : '계산 불가';

  container.innerHTML = '';
  container.appendChild(h(`
    <h2>성장분석</h2>
    <div id="growth-trend-section"></div>
    <div class="detail-card">
      <h3>AI 참여판정 등급 분포</h3>
      <p class="license-card-meta">현재 열려있는 공고 전체를 지금 기준으로 다시 채점한 결과입니다(실시간 스냅샷).</p>
      ${gradeDistributionHtml}
      <div id="growth-grade-trend-section"></div>
    </div>
    <div id="growth-benchmark-section"></div>
    <div class="detail-card">
      <h3>ROI (낙찰금액 대비 비용)</h3>
      ${roi.awardedCount === 0 ? `
        <p class="empty">아직 낙찰 실적이 없어요. 진행 중 사업에서 "낙찰"로 바꿀 때 낙찰 금액을 입력하면, 결제한 구독료 대비 ROI를 자동으로 계산해 드립니다.</p>
      ` : `
        <p class="license-card-meta">낙찰 시 직접 입력한 금액과 실제 결제한 구독료를 비교합니다. 공고 예산액이 아니라 실제 계약금액 기준입니다.</p>
        <div class="growth-roi-grid">
          <div class="growth-roi-tile">
            <div class="growth-roi-tile-value mono">${formatBudget(roi.totalAwardedAmount)}</div>
            <div class="growth-roi-tile-label">총 낙찰금액 (${roi.awardedCount || 0}건)</div>
          </div>
          <div class="growth-roi-tile">
            <div class="growth-roi-tile-value mono">${formatBudget(roi.totalPaidAmount)}</div>
            <div class="growth-roi-tile-label">총 결제금액</div>
          </div>
          <div class="growth-roi-tile">
            <div class="growth-roi-tile-value mono">${escapeHtml(ratioLabel)}</div>
            <div class="growth-roi-tile-label">낙찰금액 / 결제금액</div>
          </div>
        </div>
      `}
    </div>
  `));

  const allTrendPoints = data.trend || [];
  renderGrowthTrendSections(
    document.getElementById('growth-trend-section'),
    document.getElementById('growth-grade-trend-section'),
    allTrendPoints
  );
  renderGrowthBenchmarkSection(document.getElementById('growth-benchmark-section'), data.benchmark);
}

function renderGrowthTrendSections(trendContainer, gradeTrendContainer, allTrendPoints) {
  const trendPoints = filterTrendPointsByPeriod(allTrendPoints, growthTrendFilter);
  const filterHtml = `
    <div class="license-toolbar" style="margin-bottom:0.6rem">
      ${GROWTH_TREND_FILTERS.map(([v, label]) =>
        `<button type="button" class="btn btn-secondary btn-sm growth-filter-btn${v === growthTrendFilter ? ' btn-primary' : ''}" data-filter="${v}">${label}</button>`
      ).join('')}
    </div>
  `;

  let trendHtml;
  if (trendPoints.length >= 2) {
    const labels = trendPoints.map(t => t.periodStart.slice(5));
    const completenessChart = simpleLineChartHtml(labels, [
      { colorVar: '--accent-blue', values: trendPoints.map(t => t.profileCompletenessScore) },
    ], 100);
    const pipelineChart = simpleLineChartHtml(labels, [
      { colorVar: '--accent-blue', values: trendPoints.map(t => t.pipelineStartedCount) },
      { colorVar: '--success', values: trendPoints.map(t => t.pipelineCompletedCount) },
      { colorVar: '--ink-soft', values: trendPoints.map(t => t.pipelineClosedCount) },
    ]);
    trendHtml = `
      <div class="detail-card">
        <h3>AI 분석 커버리지·파이프라인 성과 추이</h3>
        <p class="license-card-meta">매주 월요일/매월 1일 생성되는 리포트를 시간순으로 모은 값입니다.</p>
        ${filterHtml}
        <p class="growth-chart-title">AI 분석 커버리지(%)</p>
        ${completenessChart}
        <p class="growth-chart-title">파이프라인 성과(건)</p>
        ${pipelineChart}
        <div class="growth-chart-legend">
          <span class="growth-chart-legend-item"><span class="donut-legend-dot" style="background:var(--accent-blue)"></span>참여검토 시작</span>
          <span class="growth-chart-legend-item"><span class="donut-legend-dot" style="background:var(--success)"></span>제출완료</span>
          <span class="growth-chart-legend-item"><span class="donut-legend-dot" style="background:var(--ink-soft)"></span>종료</span>
        </div>
      </div>
    `;
  } else if (allTrendPoints.length >= 1 && trendPoints.length < 2) {
    trendHtml = `
      <div class="detail-card">
        <h3>AI 분석 커버리지·파이프라인 성과 추이</h3>
        ${filterHtml}
        <p class="empty">선택한 기간에는 그래프를 그릴 만큼 리포트가 쌓이지 않았습니다 — 기간을 넓혀보세요.</p>
      </div>
    `;
  } else {
    trendHtml = `
      <div class="detail-card">
        <h3>AI 분석 커버리지·파이프라인 성과 추이</h3>
        <p class="empty">아직 쌓인 리포트가 없습니다. 매주 월요일/매월 1일 자동 생성되면 여기 표시됩니다.</p>
      </div>
    `;
  }
  trendContainer.innerHTML = trendHtml;

  // AI등급분포 추이 — reports.summary에 gradeDistribution을 저장하기
  // 시작한 이후의 리포트에만 값이 있다(그 전 리포트는 빈 배열/누락).
  const gradeTrendPoints = trendPoints.filter(t => t.gradeDistribution && t.gradeDistribution.length);
  let gradeTrendHtml = '<p class="license-card-meta" style="margin-top:0.75rem">등급분포 추이는 선택한 기간에 리포트가 2건 이상 쌓이면 그래프로 표시됩니다.</p>';
  if (gradeTrendPoints.length >= 2) {
    const labels = gradeTrendPoints.map(t => t.periodStart.slice(5));
    const grades = Object.keys(GRADE_LABELS);
    const series = grades.map(g => ({
      colorVar: GRADE_TONE_COLOR_VAR[GRADE_BADGE_TONE[g]] || '--ink-soft',
      values: gradeTrendPoints.map(t => (t.gradeDistribution.find(d => d.grade === g) || {}).count || 0),
    }));
    gradeTrendHtml = `
      <p class="growth-chart-title">등급분포 추이(건)</p>
      ${simpleLineChartHtml(labels, series)}
      <div class="growth-chart-legend">
        ${grades.map(g => `<span class="growth-chart-legend-item"><span class="donut-legend-dot" style="background:var(${GRADE_TONE_COLOR_VAR[GRADE_BADGE_TONE[g]] || '--ink-soft'})"></span>${escapeHtml(GRADE_LABELS[g])}</span>`).join('')}
      </div>
    `;
  }
  gradeTrendContainer.innerHTML = gradeTrendHtml;

  trendContainer.querySelectorAll('.growth-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      growthTrendFilter = btn.dataset.filter;
      renderGrowthTrendSections(trendContainer, gradeTrendContainer, allTrendPoints);
    });
  });
}

// renderGrowthBenchmarkSection — Phase 7 2단계: 전체 사용자 평균 대비 우리
// 회사 위치. 익명성 보호를 위해 지표별로 비교 대상 회사가 최소 5개
// 이상일 때만 평균을 보여준다(growth_analytics.go의 minBenchmarkCompanies와
// 동일 기준) — 회사 수가 적으면 "평균"이 사실상 특정 경쟁사 데이터를
// 노출할 수 있어서다.
function renderGrowthBenchmarkSection(container, benchmark) {
  if (!container || !benchmark) return;
  const metrics = [
    { key: 'profileCompleteness', label: 'AI 분석 커버리지', unit: '%', fmt: v => Math.round(v) },
    { key: 'pipelineConversion', label: '파이프라인 전환율(참여검토 → 제출완료)', unit: '%', fmt: v => Math.round(v * 100) },
  ];
  const rowsHtml = metrics.map(m => {
    const metric = benchmark[m.key];
    if (!metric) return '';
    const ourText = metric.ourValue != null ? `${m.fmt(metric.ourValue)}${m.unit}` : '데이터 없음';
    if (!metric.available) {
      return `
        <div class="growth-benchmark-row">
          <div class="growth-benchmark-label">${escapeHtml(m.label)}</div>
          <div class="growth-benchmark-our">우리 회사 ${ourText}</div>
          <p class="license-card-meta">비교 가능한 다른 회사가 아직 부족합니다(현재 ${metric.companyCount}개 · 최소 ${benchmark.minCompanyCount}개 필요) — 회원이 늘면 자동으로 표시됩니다.</p>
        </div>
      `;
    }
    const avgText = `${m.fmt(metric.averageValue)}${m.unit}`;
    const diff = metric.ourValue - metric.averageValue;
    const diffLabel = diff > 0 ? `평균보다 ${m.fmt(Math.abs(diff))}${m.unit} 높음` : diff < 0 ? `평균보다 ${m.fmt(Math.abs(diff))}${m.unit} 낮음` : '평균과 동일';
    const diffTone = diff > 0 ? 'badge--success' : diff < 0 ? 'badge--warn' : 'badge--gray';
    return `
      <div class="growth-benchmark-row">
        <div class="growth-benchmark-label">${escapeHtml(m.label)}</div>
        <div class="growth-benchmark-bars">
          <div class="growth-bar-row"><span class="growth-bar-label">우리 회사</span><span class="growth-bar-track"><span class="growth-bar-fill" style="width:${Math.min(100, m.fmt(metric.ourValue))}%;background:var(--accent-blue)"></span></span><span class="growth-bar-value">${ourText}</span></div>
          <div class="growth-bar-row"><span class="growth-bar-label">전체 평균</span><span class="growth-bar-track"><span class="growth-bar-fill" style="width:${Math.min(100, m.fmt(metric.averageValue))}%;background:var(--ink-soft)"></span></span><span class="growth-bar-value">${avgText}</span></div>
        </div>
        <span class="badge ${diffTone}">${escapeHtml(diffLabel)}</span>
        <p class="license-card-meta">비교 대상 ${metric.companyCount}개 회사(익명 집계, 개별 데이터는 노출하지 않습니다)</p>
      </div>
    `;
  }).join('');

  container.innerHTML = `
    <div class="detail-card">
      <h3>벤치마킹</h3>
      <p class="license-card-meta">전체 가입 회사의 익명 집계 평균과 우리 회사를 비교합니다. 개별 회사 데이터는 절대 노출하지 않습니다.</p>
      ${rowsHtml || '<p class="empty">비교할 수 있는 지표가 아직 없습니다.</p>'}
    </div>
  `;
}

// 403/401을 명확한 안내로 보여준다(로그인 화면으로 튕기거나 "권한 없음"
// 문구) — system_admin이 아닌 사용자가 URL을 직접 쳐서 들어와도 빈
// 화면이나 계속 도는 로딩바 대신 이유를 알 수 있게.

  container.innerHTML = '';

      container.appendChild(h('<p class="error">관리자 권한이 필요합니다.</p>'));

  const tiles = [

  const paymentRows = (data.recentPayments || []).map(adminPaymentCardHtml).join('');

  container.innerHTML = '';
  container.appendChild(h(`
    <h2>관리자 대시보드</h2>
    <div class="dash-tiles">${tilesHtml}</div>
    <div class="detail-card">

      ${planBars}
    </div>
    <div class="detail-card">
      <h3>최근 결제 내역 (전체 회원)</h3>
      <p class="license-card-meta">실제 Anthropic API 사용 비용(달러)은 이 화면에 없습니다 — <a href="https://platform.claude.com" target="_blank" rel="noopener">Claude Console(platform.claude.com)</a>에서 확인하세요.</p>
      ${paymentRows ? `<div class="notice-list">${paymentRows}</div>` : '<p class="empty">결제 이력이 없습니다.</p>'}
      <a href="#/admin/members" class="official-link">전체 회원 관리 &rarr;</a>
    </div>
    <div class="detail-card">
      <h3>운영 정보</h3>
      <div class="license-toolbar" style="flex-wrap:wrap">
        <a href="#/admin/tech-spec" class="btn btn-secondary btn-sm">기술 스펙</a>

// renderAdminSettingsSection — 재배포 없이 조절하는 런타임 설정
// (system_settings 테이블). 첫 항목은 Free 플랜 월간 알림성 이메일
// 한도뿐이지만 카드 자체는 "플랜 설정"으로 이름 붙여 다음 설정이
// 추가돼도 이 안에 같이 넣을 수 있게 열어뒀다.
async function renderAdminSettingsSection(container) {
  container.innerHTML = '<h3>플랜 설정</h3><div class="loading">불러오는 중...</div>';
  let data;
  try {
    data = await apiRequest('GET', '/api/admin/settings');
  } catch (err) {
    container.innerHTML = `<h3>플랜 설정</h3><p class="error">${escapeHtml(err.message)}</p>`;
    return;
  }
  container.innerHTML = `
    <h3>플랜 설정</h3>
    <label>Free 플랜 월간 알림성 이메일 한도(건)
      <p class="license-card-meta" style="margin-top:0.2rem">마감리마인더·상태변경·추천다이제스트·주간/월간 리포트 이메일에만 적용됩니다. 유료 플랜은 항상 무제한이고, 팀 초대 등 필수 이메일은 이 한도와 무관하게 항상 발송됩니다. 값을 바꾸면 다음 발송부터 바로 적용됩니다(재배포 불필요).</p>
      <input type="number" min="0" step="1" id="free-plan-email-limit-input" class="select-input" style="max-width:160px" value="${escapeAttr(String(data.freePlanEmailLimit))}">
    </label>
    <div class="license-toolbar" style="margin-top:0.6rem">
      <button type="button" class="btn btn-primary btn-sm" id="save-free-plan-email-limit-btn">저장</button>
    </div>
    <div id="admin-settings-result"></div>
    <hr style="margin:1.2rem 0">
    <label class="checkbox-label"><input type="checkbox" id="phone-verification-required-input" ${data.phoneVerificationRequired ? 'checked' : ''}> 회원가입 시 휴대폰 SMS 인증 사용</label>
    <p class="license-card-meta" style="margin-top:0.2rem">끄면 새 가입자의 휴대폰번호 입력이 선택 사항이 되고 SMS 인증 없이도 가입할 수 있습니다(이미 인증을 마친 기존 회원에는 영향 없음). 값을 바꾸면 다음 회원가입 시도부터 바로 적용됩니다(재배포 불필요).</p>
    <div class="license-toolbar" style="margin-top:0.6rem">
      <button type="button" class="btn btn-primary btn-sm" id="save-phone-verification-required-btn">저장</button>
    </div>
    <div id="phone-verification-required-result"></div>
  `;
  const resultBox = document.getElementById('admin-settings-result');
  document.getElementById('save-free-plan-email-limit-btn').addEventListener('click', async () => {
    const input = document.getElementById('free-plan-email-limit-input');
    const value = parseInt(input.value, 10);
    if (isNaN(value) || value < 0) {
      resultBox.innerHTML = '<p class="error">0 이상의 숫자를 입력해주세요.</p>';
      return;
    }
    try {
      await apiRequest('PUT', '/api/admin/settings/free-plan-email-limit', { value });
      resultBox.innerHTML = '';
      showToast(`저장했습니다 — Free 플랜 월간 이메일 한도가 ${value}건으로 적용됩니다.`, 'success');

// 가격, 팀원 한도를 재배포 없이 조정한다 — 저장 즉시 결제(checkout/confirm),
// 한도체크(checkAIAnalysisQuota 등), 요금제 화면(#/billing/plans, 랜딩페이지)
// 전부에 반영된다(effectivePlanInfo가 매번 DB에서 직접 읽음, 캐시 없음).
async function renderAdminPlanSettings(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));
  let data;
  try {
    data = await apiRequest('GET', '/api/admin/plan-settings');
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    if (err.status === 403) { container.appendChild(h('<p class="error">관리자 권한이 필요합니다.</p>')); return; }
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  container.innerHTML = '';
  container.appendChild(h(`
    <a href="#/admin" class="back-link">&larr; 관리자 대시보드로</a>
    <h2>플랜 한도/가격 설정</h2>
    <p class="license-card-meta">한도 필드에 -1을 입력하면 무제한입니다. 저장하면 재배포 없이 바로 반영됩니다(결제 금액도 포함 — 가격을 바꾸면 그 순간부터 신규 결제에 새 가격이 적용됩니다, 기존 구독자의 이미 낸 결제에는 영향 없음).</p>
    ${PLAN_SETTINGS_FIELDS.map(group => `
      <div class="detail-card">
        <h3>${escapeHtml(group.label)}</h3>
        <div class="profile-form">
          ${group.fields.map(f => `
            <label>${escapeHtml(f.label)}<input type="number" step="1" min="${f.min}" id="plan-setting-${f.key}" value="${escapeAttr(String(data[f.key]))}"></label>
          `).join('')}
        </div>
      </div>
    `).join('')}
    <div id="plan-settings-error" class="error" style="display:none"></div>
    <div class="license-toolbar">
      <button type="button" class="btn btn-primary" id="plan-settings-save-btn">저장</button>
    </div>
  `));

      for (const f of group.fields) {
        const raw = document.getElementById(`plan-setting-${f.key}`).value;

}

// 조건(status='sent'만 체크)에 안 걸려 자연스럽게 재시도되는 기존 동작을
// 그대로 따른다.
// adminNotificationFailuresPage — 모듈 스코프 현재 페이지 번호(0-base).
// 이 화면은 진입할 때마다 새로 그려지므로(다른 admin 섹션과 이동) 별도
// 초기화 없이 renderAdminSystemStatus 등 진입 시점에 0으로 재선언되지

// renderAdminAutomationHistory — 시스템(자동화)이 바꾼 파이프라인 상태 이력.
// 자동 제외/자동 낙찰/자동 탈락/공고 취소 자동처리 등을 DB 직접 조회 없이
// 관리자에서 확인한다. reason/trigger_type은 내부 코드 그대로 보여준다(운영용).
async function renderAdminAutomationHistory(container, page) {
  page = page || 0;
  const limit = 20;
  container.innerHTML = '<h3>자동화 상태변경 이력</h3><div class="loading">불러오는 중...</div>';
  let data;
  try {
    data = await apiRequest('GET', `/api/admin/automation-history?limit=${limit}&offset=${page * limit}`);
  } catch (err) {
    container.innerHTML = `<h3>자동화 상태변경 이력</h3><p class="error">${escapeHtml(err.message)}</p>`;
    return;
  }
  const items = data.items || [];

    container.innerHTML = '<h3>자동화 상태변경 이력</h3><p class="empty">아직 자동으로 변경된 상태가 없습니다.</p>';

  const totalPages = Math.max(1, Math.ceil(total / limit));
  const rowsHtml = items.map(it => `
    <tr>
      <td>${escapeHtml(formatDateTime(it.createdAt))}</td>
      <td>${escapeHtml(it.companyName || '-')}</td>
      <td>${escapeHtml(it.noticeTitle)}${it.externalNoticeId ? `<br><span class="license-card-meta mono">${escapeHtml(it.externalNoticeId)}</span>` : ''}</td>
      <td>${escapeHtml(it.fromStatus || '-')} → <b>${escapeHtml(it.toStatus)}</b></td>
      <td>${escapeHtml(it.reason || '-')}</td>
      <td class="mono">${escapeHtml(it.triggerType)}</td>
    </tr>
  `).join('');
  container.innerHTML = `
    <h3>자동화 상태변경 이력 (총 ${total}건)</h3>
    <p class="license-card-meta">시스템이 자동으로 변경한 상태만 표시합니다(자동 제외/낙찰/탈락/공고 취소 등).</p>
    <div class="pipeline-table-wrap">
      <table class="pipeline-table">
        <thead><tr><th>시각</th><th>회사</th><th>공고</th><th>상태 변경</th><th>사유</th><th>트리거</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
    <div class="license-toolbar" style="margin-top:0.75rem;align-items:center">
      <button type="button" class="btn btn-secondary btn-sm" id="automation-hist-prev" ${page <= 0 ? 'disabled' : ''}>이전</button>
      <span class="license-card-meta">${page + 1} / ${totalPages} 페이지</span>
      <button type="button" class="btn btn-secondary btn-sm" id="automation-hist-next" ${page >= totalPages - 1 ? 'disabled' : ''}>다음</button>
    </div>
  `;
  const prevBtn = document.getElementById('automation-hist-prev');
  const nextBtn = document.getElementById('automation-hist-next');
  if (prevBtn) prevBtn.addEventListener('click', () => renderAdminAutomationHistory(container, page - 1));
  if (nextBtn) nextBtn.addEventListener('click', () => renderAdminAutomationHistory(container, page + 1));
}

// renderAdminChangelogSection — collector/CHANGELOG.md를 서버가 이미
// 날짜별 섹션+항목으로 구조화해 내려주므로(admin_meta.go의 parseChangelog),
// 여기서는 마크다운을 다시 파싱하지 않고 그대로 리스트로 그린다.
//
// 2026-08-06 가독성 긴급수정: 하루에 항목이 여러 개 쌓이는 날(오늘처럼)이
// 늘면서 전체를 한 번에 쏟아내면 화면이 너무 길어졌다 — 기본은 "오늘"
// 날짜 섹션만 보여주고, "전체 로그 보기"를 누르면 나머지 날짜를
// <details>(네이티브 아코디언, 별도 JS 상태관리 없이 접기/펼치기)로
// 보여준다. 날짜 문자열은 서버가 이미 "YYYY-MM-DD" 그대로 내려주므로
// 브라우저 로컬 날짜를 같은 형식으로 만들어 문자열 비교만 하면 된다.
function todayDateStringForChangelog() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function changelogEntryHtml(e) {
  return `
    <div class="changelog-entry">
      <div class="changelog-date">${escapeHtml(e.date)}</div>
      <ul class="changelog-items">
        ${(e.items || []).map(item => `<li>${escapeHtml(item)}</li>`).join('')}
      </ul>
    </div>
  `;
}
async function renderAdminChangelogSection(container) {
  container.innerHTML = '<h3>업데이트 로그</h3><div class="loading">불러오는 중...</div>';
  let data;
  try {
    data = await apiRequest('GET', '/api/admin/changelog');
  } catch (err) {
    container.innerHTML = `<h3>업데이트 로그</h3><p class="error">${escapeHtml(err.message)}</p>`;
    return;
  }
  const entries = data.entries || [];
  const today = todayDateStringForChangelog();
  const todayEntries = entries.filter(e => e.date === today);
  const otherEntries = entries.filter(e => e.date !== today);

  const todayHtml = todayEntries.length
    ? todayEntries.map(e => changelogEntryHtml(e)).join('')
    : '<p class="empty">오늘 등록된 업데이트가 없습니다.</p>';
  const fullListHtml = otherEntries.map(e => `
    <details class="changelog-entry">
      <summary class="changelog-date" style="cursor:pointer">${escapeHtml(e.date)} (${(e.items || []).length}건)</summary>
      <ul class="changelog-items">
        ${(e.items || []).map(item => `<li>${escapeHtml(item)}</li>`).join('')}
      </ul>
    </details>
  `).join('');

  const totalDays = entries.length;
  container.innerHTML = `
    <div class="report-actions">
      <h3 style="margin:0">업데이트 로그 — 오늘(${escapeHtml(today)})</h3>
      ${otherEntries.length ? `<button type="button" class="btn btn-secondary btn-sm" id="changelog-show-all-btn">전체 로그 보기 (총 ${totalDays}일치)</button>` : ''}
    </div>
    <p class="license-card-meta">collector/CHANGELOG.md 기준 — 큰 기능 단위로만 기록합니다.</p>
    <div id="changelog-today">${todayHtml}</div>
    <div id="changelog-full" style="display:none;margin-top:1rem">${fullListHtml || '<p class="empty">더 이전 기록이 없습니다.</p>'}</div>
  `;
  const showAllBtn = document.getElementById('changelog-show-all-btn');
  if (showAllBtn) {
    showAllBtn.addEventListener('click', () => {
      const fullEl = document.getElementById('changelog-full');
      const showing = fullEl.style.display !== 'none';
      fullEl.style.display = showing ? 'none' : 'block';
      showAllBtn.textContent = showing ? `전체 로그 보기 (총 ${totalDays}일치)` : '전체 로그 접기';
    });
  }
}

function adminPaymentCardHtml(p) {

      <div class="row-card-main">

// renderAdminSystemStatus — 기존엔 curl로만 실행 가능했던 관리자 배치
// (알림/파이프라인 자동전환/낙찰이력 수집/예약 다운그레이드 적용/서류
// 추출)를 버튼으로 수동 실행. 대부분 매일 09:00 KST 자동 실행이고 서류
// 추출만 1시간 주기(공고 수집 직후 이어서 돌기 때문 — document_
// extraction.go 참고)라 문구를 "정기적으로"로 통일했다. 여기 버튼은
// "지금 바로" 확인하고 싶을 때만 쓰는 보조 수단.
function renderAdminSystemStatus(container) {
  const actions = [
    { path: '/api/admin/run-notifications', label: '이메일/SMS 알림 배치 실행' },
    { path: '/api/admin/run-pipeline-auto-transitions', label: '파이프라인 자동전환 실행' },
    { path: '/api/admin/run-award-history-ingestion', label: '낙찰이력 수집 실행' },
    { path: '/api/admin/run-deadline-schedule', label: '마감 알림 스케줄러 실행' },
    { path: '/api/admin/run-result-lookup', label: '개찰 결과조회 실행' },
    { path: '/api/admin/run-notice-datetime-backfill', label: '공고 일정(시각) 백필 실행' },
    { path: '/api/admin/run-procurement-class-backfill', label: '공공조달분류 백필 실행' },
    { path: '/api/admin/run-scheduled-downgrades', label: '예약된 플랜 다운그레이드 적용' },
    { path: '/api/admin/run-document-extraction', label: '제출서류/자격조건 추출 실행' },
  ];
  container.innerHTML = `
    <h3>시스템 상태</h3>
    <p class="license-card-meta">정기적으로 자동 실행되는 배치(알림/자동전환/낙찰이력/다운그레이드는 매일 09:00 KST, 서류 추출은 1시간마다)를 지금 바로 수동 실행합니다.</p>
    <div class="license-toolbar" style="flex-wrap:wrap">
      ${actions.map(a => `<button type="button" class="btn btn-secondary btn-sm admin-action-btn" data-path="${escapeAttr(a.path)}">${escapeHtml(a.label)}</button>`).join('')}
    </div>
    <div id="admin-action-result"></div>
    <h3 style="margin-top:1.5rem">테스트 웹 푸시 발송</h3>
    <p class="license-card-meta">특정 계정에 등록된 기기 전부로 실제 웹 푸시를 즉시 보내고, 기기별 성공/실패를 바로 보여줍니다("#/notifications 알림 받기 배너가 안 보인다" 류 신고 진단용).</p>
    <div class="filters">
      <input type="email" id="test-push-email" placeholder="테스트 대상 이메일" style="min-width:16rem">
      <button type="button" id="test-push-btn" class="btn btn-secondary btn-sm">발송</button>
    </div>
    <div id="test-push-result"></div>
  `;
  const resultBox = document.getElementById('admin-action-result');
  container.querySelectorAll('.admin-action-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      resultBox.innerHTML = '<div class="loading">실행 중...</div>';
      try {
        const result = await apiRequest('POST', btn.dataset.path, {});
        resultBox.innerHTML = `<p class="success">완료: ${escapeHtml(JSON.stringify(result))}</p>`;
      } catch (err) {
        resultBox.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
      }
      btn.disabled = false;
    });
  });

  const testPushBtn = document.getElementById('test-push-btn');
  const testPushResult = document.getElementById('test-push-result');
  testPushBtn.addEventListener('click', async () => {
    const email = document.getElementById('test-push-email').value.trim();
    if (!email) { testPushResult.innerHTML = '<p class="error">이메일을 입력해주세요.</p>'; return; }
    testPushBtn.disabled = true;
    testPushResult.innerHTML = '<div class="loading">발송 중...</div>';
    try {
      const data = await apiRequest('POST', '/api/admin/push/test', { email });
      const rows = (data.results || []).map(r => `
        <div class="license-card">
          <div class="license-card-main">
            <div class="license-card-name">${r.success ? '✅ 성공' : '❌ 실패'} <span class="badge ${r.success ? 'badge--success' : 'badge--gray'}">HTTP ${r.statusCode || '-'}</span></div>
            <div class="license-card-meta mono">${escapeHtml(r.endpoint)}</div>
            ${r.error ? `<div class="license-card-meta">${escapeHtml(r.error)}</div>` : ''}
          </div>
        </div>
      `).join('');
      testPushResult.innerHTML = `<p class="license-card-meta">${escapeHtml(data.targetEmail)} — 등록된 기기 ${(data.results || []).length}개</p><div class="license-list">${rows}</div>`;
    } catch (err) {
      testPushResult.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
    }
    testPushBtn.disabled = false;
  });
}

// renderAdminMembers — 전체 회원 목록(검색/필터). 필터 상태를 쿼리
// 파라미터로 hash에 반영해 뒤로가기/새로고침에도 유지되게 한다(공고
// 목록 필터와 같은 관례).
async function renderAdminMembers(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  const qParam = params.get('q') || '';
  const planParam = params.get('plan') || '';

  let data;
  try {
    const query = new URLSearchParams();
    if (qParam) query.set('q', qParam);
    if (planParam) query.set('plan', planParam);
    data = await apiRequest('GET', '/api/admin/members' + (query.toString() ? '?' + query.toString() : ''));
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    if (err.status === 403) {
      container.appendChild(h('<p class="error">관리자 권한이 필요합니다.</p>'));
      return;
    }
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  const items = data.items || [];
  const rows = items.map(m => `
    <div class="row-card admin-member-row" data-id="${escapeAttr(m.id)}">
      <span class="row-card-icon">${SIDEBAR_ICONS.user}</span>
      <div class="row-card-main">
        <div class="row-card-title">${escapeHtml(m.email)}</div>
        <div class="row-card-subtitle">${escapeHtml(m.planName)} · 가입 ${escapeHtml(formatDate(m.createdAt))} · 마지막 로그인 ${m.lastLoginAt ? escapeHtml(formatDateTime(m.lastLoginAt)) : '기록 없음'}</div>
      </div>
      <span class="row-card-arrow">›</span>
    </div>
  `).join('');

  container.innerHTML = '';
  container.appendChild(h(`
    <a href="#/admin" class="back-link">&larr; 관리자 대시보드로</a>
    <h2>회원 관리</h2>
    <form id="admin-member-filter-form" class="profile-form" style="flex-direction:row;flex-wrap:wrap;gap:0.5rem;align-items:flex-end">
      <label style="flex:1;min-width:180px">이메일 검색<input type="text" name="q" value="${escapeAttr(qParam)}" placeholder="이메일 일부 입력"></label>
      <label style="min-width:140px">플랜<select name="plan" class="select-input">
        <option value="">전체</option>
        ${['free', 'basic', 'pro', 'business'].map(p => `<option value="${p}" ${planParam === p ? 'selected' : ''}>${escapeHtml(PLAN_DISPLAY_NAMES[p])}</option>`).join('')}
      </select></label>
      <button type="submit" class="btn btn-primary btn-sm">검색</button>
    </form>
    <p class="license-card-meta">${items.length}명</p>
    <div class="notice-list">${rows || '<p class="empty">조건에 맞는 회원이 없습니다.</p>'}</div>
  `));

  document.getElementById('admin-member-filter-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const q = (fd.get('q') || '').trim();
    const plan = fd.get('plan') || '';
    const query = new URLSearchParams();
    if (q) query.set('q', q);
    if (plan) query.set('plan', plan);
    location.hash = '#/admin/members' + (query.toString() ? '?' + query.toString() : '');
  });

  container.querySelectorAll('.admin-member-row').forEach(row => {
    row.addEventListener('click', () => { location.hash = '#/admin/members/' + row.dataset.id; });
  });
}

// renderAdminMemberDetail — 조회는 대부분 읽기 전용이지만, 이번 확장으로
// "탈퇴 처리"와 "이번달 AI 분석 한도 임시조정" 두 가지 변경 작업이
// 추가됐다(admin_member_actions.go). 결제이력/파이프라인/담당자/팀원은
// 이 계정이 속한 조직 전체 데이터 — 개인이 아니라 조직 단위 데이터라서
// (팀기능 원칙). 파이프라인 카드는 일부러 pipelineListRowHtml을 재사용하지
// 않는다 — 그건 클릭 시 #/pipeline/{id}로 이동하는데, 관리자 계정은 그
// 조직 멤버가 아니라서 접근 권한 검사(handleGetPipelineEntry)에 걸려
// 404가 뜬다 — 그래서 클릭 불가능한 순수 카드로만 보여준다.
async function renderAdminMemberDetail(container, id) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/admin/members/' + encodeURIComponent(id));
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    if (err.status === 403) {
      container.appendChild(h('<p class="error">관리자 권한이 필요합니다.</p>'));
      return;
    }
    if (err.status === 404) {
      container.appendChild(h('<p class="error">회원을 찾을 수 없습니다.</p>'));
      return;
    }
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  const paymentRows = (data.paymentHistory || []).map(p => `
    <div class="license-card">
      <div class="license-card-main">
        <div class="license-card-name">${escapeHtml(p.planName || p.plan || '-')} <span class="badge ${paymentStatusToneClass(p.status)}">${escapeHtml(p.status)}</span></div>
        <div class="license-card-meta">${escapeHtml(formatDateTime(p.requestedAt))} · <span class="mono">${formatBudget(p.amount)}</span>${p.paymentMethodLabel ? ` · ${escapeHtml(p.paymentMethodLabel)}` : ''}</div>
      </div>
    </div>
  `).join('');

  const pipelineRows = (data.pipelineEntries || []).map(entry => `
    <div class="license-card">
      <div class="license-card-main">
        <div class="license-card-name">${escapeHtml(entry.noticeTitle)} ${pipelineStepIndicatorHtml(entry.status)}</div>
        <div class="license-card-meta">${escapeHtml(entry.organizationName || '-')} · 담당자 ${escapeHtml(entry.assigneeName || '미지정')} · 마감 ${entry.submissionDeadline ? escapeHtml(entry.submissionDeadline) : '-'}</div>
      </div>
    </div>
  `).join('');

  const contactRows = (data.companyContacts || []).map(c => `
    <div class="license-card">
      <div class="license-card-main">
        <div class="license-card-name">${escapeHtml(c.name)} ${c.isDefault ? '<span class="badge badge--blue">기본</span>' : ''}</div>
        <div class="license-card-meta">${[c.email, c.phone].filter(Boolean).map(escapeHtml).join(' · ') || '연락처 미등록'}</div>
      </div>
    </div>
  `).join('');

  const teamRows = (data.teamMembers || []).map(m => `
    <div class="license-card">
      <div class="license-card-main">
        <div class="license-card-name">${escapeHtml(m.email)} <span class="badge ${m.role === 'owner' ? 'badge--blue' : 'badge--gray'}">${m.role === 'owner' ? '소유자' : '팀원'}</span></div>
        <div class="license-card-meta">합류일 ${escapeHtml(formatDateTime(m.createdAt))}</div>
      </div>
    </div>
  `).join('');

  const deactivated = !!data.deactivatedAt;

  container.innerHTML = '';
  container.appendChild(h(`
    <a href="#/admin/members" class="back-link">&larr; 회원 목록으로</a>
    <div class="detail-card">
      <p class="detail-eyebrow">${escapeHtml(data.role)}${data.isOrgOwner ? ' · 조직 소유자' : ''}</p>
      <h2>${escapeHtml(data.email)} ${deactivated ? '<span class="badge badge--danger">탈퇴됨</span>' : ''}</h2>
      <dl class="detail-meta">
        <div><dt>가입일</dt><dd>${escapeHtml(formatDateTime(data.createdAt))}</dd></div>
        <div><dt>마지막 로그인</dt><dd>${data.lastLoginAt ? escapeHtml(formatDateTime(data.lastLoginAt)) : '기록 없음'}</dd></div>
        <div><dt>플랜</dt><dd>${escapeHtml(data.planName)}${data.subscriptionStatus ? ` (${escapeHtml(data.subscriptionStatus)})` : ''}</dd></div>
        <div><dt>이번달 AI 분석</dt><dd>${data.thisMonthAIAnalysisCount}건 / 한도 ${data.aiAnalysisLimit < 0 ? '무제한' : data.aiAnalysisLimit + '건'}${data.customAIAnalysisLimitActive ? ' <span class="badge badge--blue">임시조정 적용중</span>' : ''}</dd></div>
        <div><dt>이번달 파이프라인 생성</dt><dd>${data.thisMonthPipelineCreatedCount}건</dd></div>
      </dl>
    </div>
    <div class="detail-card">
      <h3>담당자</h3>
      <div class="license-list">${contactRows || '<p class="empty">등록된 담당자가 없습니다.</p>'}</div>
    </div>
    <div class="detail-card">
      <h3>팀원</h3>
      <div class="license-list">${teamRows || '<p class="empty">소속된 조직이 없거나 팀원이 없습니다.</p>'}</div>
    </div>
    <div class="detail-card">
      <h3>결제 이력</h3>
      <div class="license-list">${paymentRows || '<p class="empty">결제 이력이 없습니다.</p>'}</div>
    </div>
    <div class="detail-card">
      <h3>파이프라인 현황</h3>
      <div class="license-list">${pipelineRows || '<p class="empty">파이프라인 이력이 없습니다.</p>'}</div>
    </div>
    <div class="detail-card">
      <h3>이번달 AI 분석 한도 임시조정</h3>
      <p class="license-card-meta">이번 달에만 적용되며 다음 달이 되면 자동으로 플랜 기본 한도로 되돌아갑니다. 변경 이력은 감사로그에 남습니다.</p>
      ${data.customAIAnalysisLimitActive ? `<p class="license-card-meta">현재 적용 중: <strong>${data.customAIAnalysisLimit}건</strong> · 사유: ${escapeHtml(data.customAIAnalysisLimitReason || '-')}</p>` : ''}
      ${data.companyProfileId ? `
        <div class="profile-form">
          <label>이번달 한도(건, -1=무제한)<input type="number" step="1" min="-1" id="ai-limit-input" value="${data.customAIAnalysisLimitActive ? escapeAttr(String(data.customAIAnalysisLimit)) : ''}" placeholder="비워두면 플랜 기본값(${data.aiAnalysisLimit < 0 ? '무제한' : data.aiAnalysisLimit}건) 사용"></label>
          <label>조정 사유<input type="text" id="ai-limit-reason" value="${escapeAttr(data.customAIAnalysisLimitReason || '')}" placeholder="예: 실적 증빙 자료 재작업으로 임시 상향"></label>
          <div id="ai-limit-error" class="error" style="display:none"></div>
          <div class="license-toolbar">
            <button type="button" class="btn btn-primary btn-sm" id="ai-limit-save-btn">적용</button>
            ${data.customAIAnalysisLimitActive ? '<button type="button" class="btn btn-secondary btn-sm" id="ai-limit-clear-btn">해제</button>' : ''}
          </div>
        </div>
      ` : '<p class="empty">기업 프로필이 없어 한도 조정을 적용할 수 없습니다.</p>'}
    </div>
    <div class="detail-card">
      <h3>탈퇴 처리</h3>
      <p class="license-card-meta">계정을 비활성화하고 개인정보(이메일/비밀번호/전화번호)를 익명화합니다. 결제이력·감사기록·조직 데이터는 법적 보관을 위해 그대로 유지됩니다. <strong>되돌릴 수 없습니다.</strong></p>
      <div id="deactivate-error" class="error" style="display:none"></div>
      <div class="license-toolbar">
        <button type="button" class="btn btn-danger btn-sm" id="deactivate-btn" ${deactivated ? 'disabled' : ''}>${deactivated ? '이미 탈퇴 처리됨' : '탈퇴 처리'}</button>
        <button type="button" class="btn btn-danger btn-sm" id="delete-member-btn">회원 삭제</button>
      </div>
      <p class="license-card-meta">"회원 삭제"는 테스트 계정 정리용 완전 삭제입니다 — owner인 회사라면 그 회사의 문서·파이프라인·구독·결제기록까지 전부 지워집니다. <strong>개발/테스트 계정에만 사용하세요.</strong></p>
      <div id="delete-member-error" class="error" style="display:none"></div>
    </div>
  `));

  if (data.companyProfileId) {
    document.getElementById('ai-limit-save-btn').addEventListener('click', async () => {
      const errorBox = document.getElementById('ai-limit-error');
      errorBox.style.display = 'none';
      const rawLimit = document.getElementById('ai-limit-input').value.trim();
      const reason = document.getElementById('ai-limit-reason').value.trim();
      if (rawLimit === '') {
        errorBox.textContent = '한도 값을 입력해주세요(해제하려면 "해제" 버튼을 눌러주세요).';
        errorBox.style.display = 'block';
        return;
      }
      const limit = parseInt(rawLimit, 10);
      if (isNaN(limit) || limit < -1) {
        errorBox.textContent = '한도는 -1 이상의 정수여야 합니다.';
        errorBox.style.display = 'block';
        return;
      }
      if (!reason) {
        errorBox.textContent = '조정 사유를 입력해주세요.';
        errorBox.style.display = 'block';
        return;
      }
      try {
        await apiRequest('PUT', '/api/admin/members/' + encodeURIComponent(id) + '/ai-limit', { limit, reason });
        showToast('적용했습니다.', 'success');
        renderAdminMemberDetail(container, id);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });

  // 계정 정리용). 회사 owner면 회사 데이터까지 함께 삭제된다(백엔드 cascade).
  document.getElementById('delete-member-btn').addEventListener('click', async (e) => {

      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// ---------- 관리자 CMS 3번: 배너 관리(#/admin/banners) ----------
function toDatetimeLocalValue(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fromDatetimeLocalValue(v) {
  return v ? new Date(v).toISOString() : null;
}
function cmsPeriodLabel(startsAt, endsAt) {
  if (!startsAt && !endsAt) return '노출기간 제한 없음';
  const fmt = (d) => d ? new Date(d).toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '무제한';
  return `노출기간: ${fmt(startsAt)} ~ ${fmt(endsAt)}`;
}

// renderAdminIndustryTaxonomy — #/admin/industry-taxonomy. 조달청 업종 중분류
// CMS(Phase 3). 중분류명은 매칭 키라 표시만 하고(수정 불가), 재분류(대분류 변경)·
// 활성/비활성만 조작한다. 삭제는 없다(비활성으로 신규 노출만 차단, 기존 선택 보존).
async function renderAdminIndustryTaxonomy(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));
  let data;
  try {
    data = await apiRequest('GET', '/api/admin/industry-taxonomy');
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';

    return;
  }
  const items = data.items || [];
  const larges = [...new Set(items.map(i => i.largeName))];
  const activeCount = items.filter(i => i.active).length;

  container.innerHTML = '';
  container.appendChild(h(`
    <a href="#/admin" class="back-link">&larr; 관리자 대시보드로</a>
    <h2>업종 분류 관리</h2>
    <p class="license-card-meta">조달청 공공조달분류(중분류)를 관리합니다. 중분류명은 회사 프로필·공고 매칭의 키라 변경할 수 없고, 재분류(대분류 변경)와 활성/비활성만 가능합니다. 비활성 항목은 새 업종 선택 자동완성에서만 빠지고, 이미 그 업종을 고른 회사의 판정에는 영향이 없습니다. 수집기가 새 분류를 저장하면 자동으로 목록에 추가됩니다.</p>
    <div class="detail-card">
      <h3>새 중분류 추가</h3>
      <form id="taxonomy-add-form" class="profile-form">
        <label>중분류명<input type="text" name="midName" required placeholder="예: 정보시스템 감리"></label>
        <label>대분류명<input type="text" name="largeName" required list="taxonomy-large-list" placeholder="예: ICT 서비스"></label>
        <datalist id="taxonomy-large-list">${larges.map(l => `<option value="${escapeAttr(l)}"></option>`).join('')}</datalist>
        <div id="taxonomy-add-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-sm">추가</button>
      </form>
    </div>
    <div class="detail-card">
      <h3>중분류 목록 (활성 ${activeCount} / 전체 ${items.length})</h3>
      <div style="overflow-x:auto">
        <table class="admin-taxonomy-table">
          <thead><tr><th>대분류 (재분류 가능)</th><th>중분류</th><th>상태</th></tr></thead>
          <tbody>${items.map(it => `
            <tr data-id="${it.id}" class="${it.active ? '' : 'is-inactive'}">
              <td><input type="text" class="tax-large-input select-input" value="${escapeAttr(it.largeName)}"></td>
              <td class="mono">${escapeHtml(it.midName)}</td>
              <td><button type="button" class="btn btn-sm ${it.active ? 'btn-secondary' : 'btn-primary'} tax-active-btn">${it.active ? '비활성화' : '활성화'}</button></td>
            </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>
  `));

  const addForm = document.getElementById('taxonomy-add-form');
  const addErr = document.getElementById('taxonomy-add-error');
  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    addErr.style.display = 'none';
    try {
      await apiRequest('POST', '/api/admin/industry-taxonomy', { midName: addForm.midName.value, largeName: addForm.largeName.value });
      showToast('중분류를 추가했습니다.', 'success');
      renderAdminIndustryTaxonomy(container);
    } catch (err) {
      addErr.textContent = err.message;
      addErr.style.display = 'block';
    }
  });
  container.querySelectorAll('tr[data-id]').forEach(tr => {
    const id = tr.dataset.id;
    tr.querySelector('.tax-active-btn').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const activate = btn.textContent.trim() === '활성화';
      btn.disabled = true;
      try {
        await apiRequest('PATCH', '/api/admin/industry-taxonomy/' + encodeURIComponent(id), { active: activate });
        renderAdminIndustryTaxonomy(container);
      } catch (err) { btn.disabled = false; showToast(err.message, 'error'); }
    });
    const largeInput = tr.querySelector('.tax-large-input');
    largeInput.addEventListener('change', async () => {
      try {
        await apiRequest('PATCH', '/api/admin/industry-taxonomy/' + encodeURIComponent(id), { largeName: largeInput.value });
        showToast('재분류했습니다.', 'success');
      } catch (err) { showToast(err.message, 'error'); }
    });
  });
}

function renderBannerListInto(listEl, items, container) {
  if (!items.length) { listEl.innerHTML = '<p class="empty">등록된 배너가 없습니다.</p>'; return; }
  listEl.innerHTML = items.map(b => `
    <div class="cms-row" data-id="${escapeAttr(b.id)}">
      <img class="cms-row-thumb" src="${escapeAttr(b.imageUrl)}" alt="">
      <div class="cms-row-main">
        <div class="cms-row-title">${escapeHtml(b.title)} <span class="badge ${b.isActive ? 'badge--success' : 'badge--gray'}">${b.isActive ? '활성' : '비활성'}</span></div>
        <div class="cms-row-meta">${b.linkUrl ? '연결: ' + escapeHtml(b.linkUrl) : '연결 링크 없음'} · ${cmsPeriodLabel(b.startsAt, b.endsAt)}</div>
      </div>
      <div class="cms-row-actions">
        <button type="button" class="btn btn-secondary btn-sm banner-move-up-btn">&uarr;</button>
        <button type="button" class="btn btn-secondary btn-sm banner-move-down-btn">&darr;</button>
        <button type="button" class="btn btn-secondary btn-sm banner-edit-btn">수정</button>
        <button type="button" class="btn btn-secondary btn-sm banner-delete-btn">삭제</button>
      </div>
    </div>
  `).join('');

  listEl.querySelectorAll('.cms-row').forEach(row => {
    const id = row.dataset.id;
    const banner = items.find(b => b.id === id);
    row.querySelector('.banner-move-up-btn').addEventListener('click', async () => {
      try { await apiRequest('POST', `/api/admin/banners/${encodeURIComponent(id)}/move`, { direction: 'up' }); renderAdminBanners(container); }
      catch (err) { alert(err.message); }
    });
    row.querySelector('.banner-move-down-btn').addEventListener('click', async () => {
      try { await apiRequest('POST', `/api/admin/banners/${encodeURIComponent(id)}/move`, { direction: 'down' }); renderAdminBanners(container); }
      catch (err) { alert(err.message); }
    });

      renderBannerForm(document.getElementById('banner-form-slot'), banner, () => renderAdminBanners(container));

      openConfirmModal({
        title: '배너 삭제', message: '이 배너를 삭제할까요?', confirmLabel: '삭제', tone: 'danger',
        onConfirm: async () => { await apiRequest('DELETE', `/api/admin/banners/${encodeURIComponent(id)}`); renderAdminBanners(container); },

    });
  });
}

function renderPopupListInto(listEl, items, container) {

  listEl.innerHTML = items.map(p => `
    <div class="cms-row" data-id="${escapeAttr(p.id)}">

      errorBox.textContent = '브랜드명은 비워둘 수 없습니다.';
      errorBox.style.display = 'block';
      return;
    }
    const payload = { brandName };
    COMPANY_INFO_FIELDS.forEach(f => {
      payload[f.key] = document.getElementById(`ci-input-${f.key}`).value;
    });
    try {
      await apiRequest('PUT', '/api/admin/company-info', payload);
      applyBrandName(brandName);
      showToast('저장했습니다. 랜딩페이지에 바로 반영됩니다.', 'success');
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// ---------- 관리자 CMS 4번: 회원 알림 메시지(#/admin/broadcast) ----------
const BROADCAST_CHANNEL_LABELS = { email: '이메일', in_app: '인앱 알림함', push: '웹 푸시' };

async function renderAdminBroadcast(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));
  let data;
  try {
    data = await apiRequest('GET', '/api/admin/broadcasts');
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    if (err.status === 403) { container.appendChild(h('<p class="error">관리자 권한이 필요합니다.</p>')); return; }
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  container.innerHTML = '';
  container.appendChild(h(`
    <a href="#/admin" class="back-link">&larr; 관리자 대시보드로</a>
    <h2>회원 알림 메시지</h2>
    <div class="detail-card">
      <h3>새 메시지 작성</h3>
      <p class="license-card-meta">선택한 채널로 대상 회원 전원에게 즉시 발송됩니다. 발송 후에는 취소할 수 없습니다.</p>
      <div class="profile-form">
        <label>대상
          <select id="broadcast-target-input" class="select-input">
            <option value="">전체 회원</option>
            <option value="free">Free 플랜</option>
            <option value="basic">Basic 플랜</option>
            <option value="pro">Pro 플랜</option>
            <option value="business">Business 플랜</option>
          </select>
        </label>
        <label>제목<input type="text" id="broadcast-title-input"></label>
        <label>내용<textarea id="broadcast-content-input" rows="6"></textarea></label>
        <div class="field-group">
          <span class="field-group-label">발송 채널(중복 선택 가능)</span>
          <label class="checkbox-label"><input type="checkbox" class="broadcast-channel-input" value="email"> 이메일</label>
          <label class="checkbox-label"><input type="checkbox" class="broadcast-channel-input" value="in_app" checked> 인앱 알림함</label>
          <label class="checkbox-label"><input type="checkbox" class="broadcast-channel-input" value="push"> 웹 푸시</label>
        </div>
        <div id="broadcast-form-error" class="error" style="display:none"></div>
        <div class="license-toolbar">
          <button type="button" class="btn btn-primary" id="broadcast-send-btn">지금 발송</button>
        </div>
      </div>
    </div>
    <div class="detail-card">
      <h3>발송 이력</h3>
      <div id="broadcast-history"></div>
    </div>
  `));

  renderBroadcastHistoryInto(document.getElementById('broadcast-history'), data.items || []);

  document.getElementById('broadcast-send-btn').addEventListener('click', async () => {
    const errorBox = document.getElementById('broadcast-form-error');
    errorBox.style.display = 'none';
    const title = document.getElementById('broadcast-title-input').value.trim();
    const content = document.getElementById('broadcast-content-input').value.trim();
    const channels = Array.from(document.querySelectorAll('.broadcast-channel-input:checked')).map(el => el.value);
    if (!title || !content) { errorBox.textContent = '제목과 내용을 입력해주세요.'; errorBox.style.display = 'block'; return; }
    if (!channels.length) { errorBox.textContent = '발송 채널을 하나 이상 선택해주세요.'; errorBox.style.display = 'block'; return; }
    if (!confirm('선택한 대상에게 즉시 발송합니다. 계속할까요?')) return;

    const btn = document.getElementById('broadcast-send-btn');
    btn.disabled = true;
    btn.textContent = '발송 중...';
    try {
      const result = await apiRequest('POST', '/api/admin/broadcasts', {
        title, content,
        targetPlan: document.getElementById('broadcast-target-input').value,
        channels,
      });
      showToast(`${result.recipientCount}명에게 발송했습니다.`, 'success');
      document.getElementById('broadcast-title-input').value = '';
      document.getElementById('broadcast-content-input').value = '';
      const refreshed = await apiRequest('GET', '/api/admin/broadcasts');
      renderBroadcastHistoryInto(document.getElementById('broadcast-history'), refreshed.items || []);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = '지금 발송';
    }
  });
}

function renderBroadcastHistoryInto(el, items) {
  if (!items.length) { el.innerHTML = '<p class="empty">발송 이력이 없습니다.</p>'; return; }
  el.innerHTML = `<div class="table-scroll"><table class="report-table">
    <thead><tr><th>제목</th><th>대상</th><th>채널</th><th>수신자</th><th>발송자</th><th>발송일시</th></tr></thead>
    <tbody>${items.map(b => `
      <tr>
        <td>${escapeHtml(b.title)}</td>
        <td>${b.targetPlan ? escapeHtml(PLAN_DISPLAY_NAMES[b.targetPlan] || b.targetPlan) : '전체 회원'}</td>
        <td>${(b.channels || []).map(c => escapeHtml(BROADCAST_CHANNEL_LABELS[c] || c)).join(', ')}</td>
        <td>${b.recipientCount}명</td>
        <td>${escapeHtml(b.createdByEmail)}</td>
        <td>${new Date(b.createdAt).toLocaleString('ko-KR')}</td>
      </tr>
    `).join('')}</tbody>
  </table></div>`;
}

        <button type="submit" class="btn btn-primary">초대 링크 보내기</button>

  container.querySelectorAll('.team-remove-btn').forEach(btn => {

        errorBox.textContent = err.message;
        errorBox.style.display = 'block';

// renderInviteAccept — #/invite?token=... 공개 페이지(로그인 안 해도
// 초대 내용은 볼 수 있음). 이미 로그인 상태면 "참여하기" 버튼으로 바로
// 수락, 아직이면 pendingInviteToken에 담아뒀다가 로그인/가입 성공 시
// acceptPendingInviteIfAny()가 자동으로 처리한다.
async function renderInviteAccept(container) {
  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  const token = params.get('token');
  container.innerHTML = '';
  if (!token) {
    container.appendChild(h('<p class="error">잘못된 초대 링크입니다.</p>'));
    return;
  }
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let inv;
  try {
    inv = await fetchJSON('/api/invitations/' + encodeURIComponent(token));
  } catch (err) {
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  container.innerHTML = '';
  if (inv.status !== 'pending' || inv.expired) {
    container.appendChild(h(`<p class="error">${inv.expired ? '만료된' : '이미 처리된'} 초대 링크입니다.</p>`));
    return;
  }

  const industryText = (inv.companyIndustry || []).join(', ') || '-';
  const introText = `${escapeHtml(inv.inviterEmail)}님이 회사 팀(지역: ${escapeHtml(inv.companyRegion || '-')}, 업종: ${escapeHtml(industryText)})에 초대했습니다.`;

  if (currentUser) {
    container.appendChild(h(`
      <div class="auth-card">
        <h2>팀 초대</h2>
        <p class="auth-step-hint">${introText}</p>
        <div id="invite-accept-error" class="error" style="display:none"></div>
        <button type="button" class="btn btn-primary btn-block" id="invite-accept-btn">참여하기</button>
      </div>
    `));
    document.getElementById('invite-accept-btn').addEventListener('click', async () => {
      const errBox = document.getElementById('invite-accept-error');
      errBox.style.display = 'none';
      try {
        await apiRequest('POST', '/api/invitations/' + encodeURIComponent(token) + '/accept', {});
        await loadMe();
        location.hash = '#/dashboard';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
      }
    });
  } else {
    pendingInviteToken = token;
    container.appendChild(h(`
      <div class="auth-card">
        <h2>팀 초대</h2>
        <p class="auth-step-hint">${introText} ${escapeHtml(inv.email)} 계정으로 로그인하거나 가입하면 자동으로 합류됩니다.</p>
        <a href="#/auth/login" class="official-link">로그인하기 &rarr;</a><br>
        <a href="#/auth/signup" class="official-link">회원가입하기 &rarr;</a>
      </div>
    `));
  }
}

// PUBLIC_ROUTES — 비로그인 상태로 접근 가능한 라우트(요청사항 [1]).
// 이 목록/isPublicRoute에 없는 모든 경로는 currentUser가 없으면 route()가
// #/auth/login으로 즉시 리다이렉트한다(각 render 함수가 API 401을 받고서야
// 뒤늦게 리다이렉트하던 이전 방식과 달리, 렌더 자체를 아예 시작 안 함 —
// 예를 들어 #/notices는 서버(handleListNotices)가 원래 비로그인도 200을
// 주는 옵셔널 인증 설계라 이전엔 그대로 새어나갔다). #/billing/plans(요금
// 비교)와 #/invite(팀 초대 미리보기)는 사용자 확인 후 의도적으로 공개
// 유지 — 전자는 가입 전 가격 비교가 마케팅 퍼널상 필요하고, 후자는 계정
// 없는 사람도 초대 내용을 먼저 봐야 하기 때문(단, "참여하기" 버튼 자체는
// renderInviteAccept가 currentUser 유무로 이미 분기해 로그인 후에만 활성화).
const PUBLIC_ROUTES = new Set([
  '#/', '#/announcements', '#/terms', '#/privacy',
  '#/auth/signup', '#/auth/login', '#/invite',
  '#/auth/find-account', '#/auth/reset-password',
  '#/auth/verify-email',
  '#/billing/plans', '#/billing/fail',
]);
function isPublicRoute(path) {
  return PUBLIC_ROUTES.has(path) || path.startsWith('#/announcements/');
}

function route() {
  const hash = location.hash || '#/';
  const path = hash.split('?')[0];
  if (!isPublicRoute(path) && !currentUser) {
    location.hash = '#/auth/login';
    return;
  }
  // 회원가입/온보딩 단계 게이트 3개(약관동의/이메일인증/사업자등록) 공용
  // 예외 목록. ⚠️2026-08-04 사고 이력: 원래 게이트마다 "자기 화면"만 예외로
  // 뒀었는데(예: 이메일인증 게이트는 오직 verify-email-pending만 예외),
  // 그러면 사용자가 게이트A가 보낸 화면에 도착하자마자 게이트B가 "그 화면은
  // 내 예외 목록에 없다"며 또 다른 화면으로 돌려보내고, 그 화면에서는 다시
  // 게이트A가 돌려보내는 식으로 **두 게이트가 서로를 무한 핑퐁**시켜 —
  // route()가 dispatch 테이블(실제 화면 렌더링)에 영영 도달 못 하고
  // location.hash만 계속 바뀌면서 #app 콘텐츠는 완전히 빈 화면으로 남았다
  // (사이드바는 부팅 시 한 번만 그려져서 정상으로 보이는 게 더 헷갈리게
  // 만들었음). 예: 이메일가입은 onboarded=true·emailVerified=false로
  // 시작 → verify-email-pending으로 보내짐 → 거기서 회사프로필 게이트가
  // "그 경로는 내 예외 아님"이라며 onboarding/business-registration으로
  // 보냄 → 거기서 다시 이메일인증 게이트가 verify-email-pending으로
  // 돌려보냄 → 무한반복. 소셜로그인도 oauth-profile↔business-registration
  // 사이에서 똑같이 발생. 그래서 세 게이트 전부 "온보딩 흐름에 속한 화면
  // 전체"를 하나의 공용 목록으로 공유하도록 고쳤다 — 이러면 사용자가 그
  // 목록 안의 아무 화면에 있든 다른 게이트가 절대 가로채지 않고, 실제
  // 앱 화면(#/notices 등)으로 나가려 할 때만 "아직 안 끝난 단계"의 화면으로
  // 정확히 한 번만 리다이렉트된다.
  const AUTH_ONBOARDING_ROUTES = new Set([
    '#/auth/oauth-profile', '#/auth/verify-email-pending', '#/auth/verify-email',
    '#/onboarding/complete',
    '#/terms', '#/privacy',
  ]);
  // isAuthOnboardingRoute — 네 게이트(온보딩 동의/이메일인증/사업자등록/
  // 커버리지50%) 전부 이 함수로 통일해서 검사해야 한다(공용 예외목록
  // 원칙, feedback-sequential-route-gates-shared-exempt-list 메모리
  // 참고) — 새 게이트를 추가하게 되면 이 함수부터 갱신할 것. ⚠️Phase
  // UX-03~08 때는 모바일 전용 동적 라우트(#/onboarding/complete/register/
  // {fieldKey})가 있어 prefix 매치가 필요했지만, Phase UX-09에서 온보딩
  // 카드 등록을 전부 인라인 렌더링으로 바꾸며 그 라우트 자체가 없어져
  // 이제 단순 Set 조회만으로 충분하다.
  const isAuthOnboardingRoute = (p) => AUTH_ONBOARDING_ROUTES.has(p);
  // 소셜 로그인(구글/네이버/카카오)은 콜백(oauth_login.go)이 계정을 즉시
  // 만들고 세션을 발급하므로, 약관동의(온보딩 화면, renderOAuthOnboardingStep)
  // 를 마치기 전에도 currentUser는 있는 상태가 될 수 있다 — 이 틈을 타
  // 다른 화면으로 새서 "약관동의 없이도 이미 가입된" 상태가 되는 것을
  // 막기 위해, 그 경우 강제로 온보딩 화면으로 돌려보낸다. 2026-08-04부터
  // 이 판단 기준은 currentUser.phoneVerified가 아니라 currentUser.onboarded다
  // — 관리자가 휴대폰 인증을 끌 수 있게 되면서(system_settings.go)
  // phoneVerified만으로는 "온보딩을 마쳤는지"를 판단할 수 없어졌다(서버가
  // terms_agreements 존재 여부로 계산해서 내려줌, auth.go의 handleMe 참고).
  // role==='user'(일반 회원가입 사용자)만 대상이다 — system_admin/operator/
  // analyst 등 내부 운영 계정은 원래부터 이 온보딩을 거치지 않도록 설계됨.
  if (currentUser && currentUser.role === 'user' && !currentUser.onboarded && !isAuthOnboardingRoute(path)) {
    location.hash = '#/auth/oauth-profile';
    return;
  }
  // 이메일 가입 필수 이메일 인증(2026-08-04, email_verification.go) — 계정은
  // 가입 즉시 생성/로그인되지만, 이메일 링크를 클릭하기 전까지는 위
  // 온보딩 가드와 같은 방식으로 대부분의 화면 접근을 막는다. 소셜
  // 로그인은 제공자가 이미 검증한 이메일이라 email_verified가 계정 생성
  // 시점에 바로 true라 이 가드 대상이 아니다.
  if (currentUser && currentUser.role === 'user' && !currentUser.emailVerified && !isAuthOnboardingRoute(path)) {
    location.hash = '#/auth/verify-email-pending';
    return;
  }
  // 3번째 게이트(2026-08-05, 채팅형 온보딩 전면 재설계로 통합) — 예전엔
  // "회사 프로필 없음"(사업자등록증 화면으로)과 "커버리지 50% 미달"
  // (카드 큐 화면으로) 두 개의 별도 게이트였는데, 채팅형에서는 사업자
  // 등록증 유무 자체가 대화의 첫 질문("파일 첨부"/"직접 기재")이 되면서
  // 그 전용 화면(#/onboarding/business-registration)이 사라졌다 — 그래서
  // "프로필이 아예 없음"과 "있지만 아직 완료 안 함"을 하나의 게이트로
  // 합쳤다(renderOnboardingChat이 currentProfile 유무에 따라 인사말부터
  // 시작할지 이어할지 알아서 분기). 기존 회원은 마이그레이션 때
  // onboardingCompletedAt이 일괄 백필돼 있어 대상이 아니다(소급 적용
  // 안 함, 사용자 확인). 위 두 게이트와 마찬가지로 반드시 같은 공용
  // 예외목록(isAuthOnboardingRoute)을 써야 한다 — 게이트마다 자기 화면만
  // 예외로 두면 두 게이트가 서로를 무한 리다이렉트시키는 사고가 이미 한
  // 번 났었다([[feedback-sequential-route-gates-shared-exempt-list]]).
  // ⚠️2026-08-05: "나중에 하기" 이탈 버튼(스누즈 플래그로 이 게이트만
  // 한 세션 건너뛰던 기능)을 완전히 폐지했다 — 이제 이 게이트는 다른
  // 두 게이트와 동일하게 예외 없는 하드 게이트다.
  if (currentUser && currentUser.role === 'user' && (!currentProfile || !currentProfile.onboardingCompletedAt) && !isAuthOnboardingRoute(path)) {
    location.hash = '#/onboarding/complete';
    return;
  }
  updateSidebarActiveState();
  updateTabbarActiveState();
  // 배너/팝업 오버레이(renderHomeOverlay)는 document.body에 직접 붙어
  // #app 밖에 있어 route()가 페이지를 갈아끼워도 저절로 안 없어진다 —
  // "홈"(비로그인 랜딩페이지 #/ + 로그인 대시보드 #/dashboard) 화면이
  // 아닌 다른 화면으로 이동하면(관리자 화면 등) 지난 방문에서 뜬
  // 오버레이가 뒤 화면을 계속 가리는 버그가 있어, 그 밖의 경로로 갈
  // 때는 항상 정리한다. "오늘 하루 보지 않기"로 닫은 게 아니라면 다시
  // 홈으로 돌아왔을 때는 renderHomeOverlay가 새로 판단해서 다시 띄운다.
  // ⚠️2026-08-05: #/dashboard 신설(홈의 랜딩/대시보드 역할 분리) 전에는
  // 이 분기가 path==='#/' 하나만 봤는데, 그대로 두면 로그인 사용자가
  // #/dashboard로 이동할 때마다 이 else 분기를 타서 방금 뜬 배너/팝업이
  // 매번 즉시 지워지는 회귀가 생긴다 — #/dashboard도 "홈" 취급해야 한다.
  // ⚠️2026-08-05(3차 변경): 이용약관/개인정보처리방침/공지사항도 랜딩
  // 헤더/푸터를 공유하게 되면서(renderWithLandingChrome 참고) is-landing이
  // 필요해졌다 — 단, 이 화면들은 renderHomeOverlay를 안 쓰므로 배너/팝업
  // 오버레이 정리는 그대로 필요하다(#/dashboard와 동일하게 "is-landing은
  // 켜되 오버레이는 정리" 취급).
  const LANDING_CHROME_ROUTES = new Set(['#/', '#/terms', '#/privacy', '#/announcements']);
  const usesLandingChrome = LANDING_CHROME_ROUTES.has(path) || path.startsWith('#/announcements/');
  if (path === '#/') {
    // ⚠️2026-08-05(2차 변경, 사용자 확정): "#/는 로그인 상태면 #/dashboard로
    // 자동 리다이렉트"를 다시 뒤집었다 — 이제 #/는 로그인 여부와 무관하게
    // 항상 랜딩페이지다(renderLandingPage가 currentUser 유무에 따라 헤더
    // CTA만 "로그인/회원가입" ↔ "대시보드로 이동"으로 바꿔 보여준다).
    // is-landing도 더 이상 currentUser로 조건분기하지 않고 항상 true.
    document.body.classList.add('is-landing');
  } else if (usesLandingChrome) {
    document.getElementById('banner-layer-overlay')?.remove();
    document.body.style.overflow = '';
    document.body.classList.add('is-landing');
  } else if (path === '#/dashboard') {
    document.body.classList.remove('is-landing');
  } else {
    document.getElementById('banner-layer-overlay')?.remove();
    document.body.style.overflow = '';
    // 랜딩페이지(is-landing)도 같은 이유로 방어적으로 정리한다 —
    // renderOnboardingHero/renderDashboard가 이미 지우지만, 링크 클릭
    // 없이 주소창에 직접 다른 경로를 입력하는 경우처럼 그 함수들을 안
    // 거치는 경로 전환에서도 사이드바가 계속 숨어있지 않도록 이중 안전장치.
    document.body.classList.remove('is-landing');
  }
  // 로그인/가입 화면(is-auth)도 같은 이유로 방어적으로 정리 — renderLogin/
  // renderSignup이 진입 시 추가하지만, 그 두 화면이 아닌 경로로 바로
  // 넘어갈 때(로그인 성공 후 등) 여기서 확실히 지운다. #/auth/oauth-profile은
  // renderOAuthProfileStep이 async(loadMe() 재호출)라, is-auth를 그 함수
  // 내부에서만 붙이면 await 도중 사이드바가 잠깐 보이는 깜빡임이 생길 수
  // 있어 — dispatch 직전 여기서 동기적으로 먼저 붙여둔다.
  if (path !== '#/auth/login' && path !== '#/auth/signup' && path !== '#/auth/oauth-profile') {
    document.body.classList.remove('is-auth');
  }
  // 2026-08-05(2차 변경, 사용자 확정): #/는 로그인 여부와 무관하게 항상
  // 랜딩페이지 — "로그인 상태로 루트 접속 시 자동으로 대시보드로 넘어가
  // 버리는" 이전 동작을 되돌렸다. 실제 대시보드 진입은 (1) 이 랜딩페이지
  // 헤더의 "대시보드로 이동" 버튼(로그인 상태일 때만 노출), (2) 로그인
  // 폼 제출 성공 직후의 리다이렉트(handleLogin 성공 콜백, 아래
  // renderLogin 참고 — 이건 그대로 유지) 두 경로로만 일어난다.
  if (path === '#/') {
    renderLandingPage(app);
    return;
  }
  if (path === '#/dashboard') { renderHome(app); return; }
  if (path === '#/auth/signup') { renderSignup(app); return; }
  if (path === '#/auth/login') { renderLogin(app); return; }
  if (path === '#/auth/find-account') { renderFindAccount(app); return; }
  if (path === '#/auth/reset-password') { renderResetPassword(app); return; }
  if (path === '#/auth/verify-email-pending') { renderEmailVerifyPending(app); return; }
  if (path === '#/auth/verify-email') { renderVerifyEmail(app); return; }
  if (path === '#/auth/oauth-profile') { document.body.classList.add('is-auth'); renderOAuthProfileStep(app); return; }
  if (path === '#/onboarding/complete') { renderOnboardingChat(app); return; }
  // #/me/saved-searches, #/me/saved-searches — 2026-08-06, 기업프로필 메뉴 완전 삭제
  // + 맞춤공고 화면으로 통합(SAVED_SEARCHES_TABS). 옛 북마크/링크가 안
  // 깨지도록 라우트 자체는 남기고 리다이렉트만 한다(renderProfile/
  // renderLicenses는 더 이상 라우트 진입점이 아니지만, 그 안의
  // 렌더 함수들 — renderProfileBasicTab 등 — 은 탭 콘텐츠로 계속 쓰인다).
  // 옛 회사프로필/면허 URL은 이제 회사정보 화면으로(IA 재정리 2026-08-10, 하위호환).
  if (path === '#/me/profile' || path === '#/me/licenses') { location.hash = '#/me/company'; return; }
  if (path === '#/me/company') { renderCompanyInfo(app); return; }
  if (path === '#/me/account') { renderAccountSettings(app); return; }
  // 관심공고(#/me/bookmarks)는 폐지됨(2026-08-08, 참여검토와 기능이 겹쳐 제거) —
  // 옛 링크/북마크는 공고 검색으로 보낸다.
  if (path === '#/me/bookmarks') { location.hash = '#/notices'; return; }
  if (path === '#/me/saved-searches') { renderSavedSearches(app); return; }
  if (path === '#/notifications') { renderNotifications(app); return; }
  if (path === '#/review') { renderReviewQueue(app); return; }
  if (path === '#/notices') { renderList(app); return; }
  if (path === '#/pipeline') { renderPipelineList(app); return; }
  if (path === '#/calendar') { renderCalendarView(app); return; }
  if (path === '#/ai-usage') { renderAIUsage(app); return; }
  if (path === '#/billing/plans') { renderPricingPlans(app); return; }
  if (path === '#/billing/checkout') { renderBillingCheckout(app); return; }
  if (path === '#/billing/success') { renderBillingSuccess(app); return; }
  if (path === '#/billing/fail') { renderBillingFail(app); return; }
  if (path === '#/me/subscription') { renderMySubscription(app); return; }
  if (path === '#/growth') { renderGrowthAnalytics(app); return; }
  if (path === '#/invite') { renderInviteAccept(app); return; }
  if (path === '#/admin') { renderAdminDashboard(app); return; }
  if (path === '#/admin/members') { renderAdminMembers(app); return; }
  if (path === '#/admin/tech-spec') { renderAdminTechSpec(app); return; }
  if (path === '#/admin/integrations') { renderAdminIntegrations(app); return; }
  if (path === '#/admin/industry-taxonomy') { renderAdminIndustryTaxonomy(app); return; }
  if (path === '#/admin/banners') { renderAdminBanners(app); return; }
  if (path === '#/admin/popups') { renderAdminPopups(app); return; }
  if (path === '#/admin/announcements') { renderAdminAnnouncements(app); return; }
  if (path === '#/admin/broadcast') { renderAdminBroadcast(app); return; }
  if (path === '#/admin/company-info') { renderAdminCompanyInfo(app); return; }
  if (path === '#/admin/plan-settings') { renderAdminPlanSettings(app); return; }
  if (path === '#/admin/legal-documents') { renderAdminLegalDocuments(app); return; }
  if (path === '#/announcements') { renderAnnouncementList(app); return; }
  if (path === '#/terms') { renderLegalDocument(app, 'terms'); return; }
  if (path === '#/privacy') { renderLegalDocument(app, 'privacy'); return; }
  const announcementDetailMatch = path.match(/^#\/announcements\/(.+)$/);
  if (announcementDetailMatch) {
    renderAnnouncementDetail(app, decodeURIComponent(announcementDetailMatch[1]));
    return;
  }
  const adminMemberDetailMatch = path.match(/^#\/admin\/members\/(.+)$/);
  if (adminMemberDetailMatch) {
    renderAdminMemberDetail(app, decodeURIComponent(adminMemberDetailMatch[1]));
    return;
  }
  const pipelineDetailMatch = path.match(/^#\/pipeline\/(.+)$/);
  if (pipelineDetailMatch) {
    renderPipelineDetail(app, decodeURIComponent(pipelineDetailMatch[1]));
    return;
  }
  const reportMatch = path.match(/^#\/notices\/(.+)\/report$/);
  if (reportMatch) {
    renderNoticeReport(app, decodeURIComponent(reportMatch[1]));
    return;
  }
  const detailMatch = path.match(/^#\/notices\/(.+)$/);
  if (detailMatch) {
    renderDetail(app, decodeURIComponent(detailMatch[1]));
    return;
  }
  renderHome(app);
}

// 맨 위로 올라가기 — #app 밖에 고정 배치된 버튼이라 route()가 매번
// #app.innerHTML을 갈아끼워도 그대로 살아있다(라우트 변경 시 새로
// 만들 필요 없음). 300px 이상 스크롤됐을 때만 보인다.
const SCROLL_TOP_THRESHOLD = 300;
const scrollTopBtn = document.getElementById('scroll-top-btn');
window.addEventListener('scroll', () => {
  scrollTopBtn.classList.toggle('is-visible', window.scrollY > SCROLL_TOP_THRESHOLD);
});
scrollTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// 모바일 헤더 햄버거 메뉴 — .header-right(전체 공고 + auth-nav)는 900px
// 이상에서는 애초에 .site-header 전체가 안 보이므로(사이드바가 대신함)
// 이 토글은 899px 이하에서만 의미가 있다. #header-right는 route()가
// 절대 다시 그리지 않는 정적 DOM이라(안쪽 #auth-nav만 renderHeader()가
// 갈아끼움) 부트스트랩 시점에 한 번만 이벤트를 걸면 된다.
const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
const headerRight = document.getElementById('header-right');
function closeMobileMenu() {
  headerRight.classList.remove('is-open');
  mobileMenuToggle.setAttribute('aria-expanded', 'false');
}
mobileMenuToggle.addEventListener('click', () => {
  const isOpen = headerRight.classList.toggle('is-open');
  mobileMenuToggle.setAttribute('aria-expanded', String(isOpen));
});
headerRight.addEventListener('click', (e) => {
  if (e.target.tagName === 'A') closeMobileMenu();
});

window.addEventListener('hashchange', () => { closeMobileMenu(); route(); });

// Phase 6(PWA/웹푸시): 서비스워커는 로그인 여부와 무관하게 항상 등록해둔다
// (등록 자체는 알림 권한을 요구하지 않음 — 실제 구독은 #/notifications의
// "알림 받기" 버튼을 눌러야 시작됨). 캐싱은 앱 쉘(정적 파일)만 —
// API 응답은 절대 캐시하지 않는다(service-worker.js 참고).
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js').catch(() => { /* 미지원 브라우저는 조용히 무시 */ });
}

// loadMe()는 async라 await 없이 호출하면 route()가 currentUser 확정 전에
// 먼저 실행돼버린다 — route()의 로그인 필수 라우트 가드(isPublicRoute)는
// currentUser를 동기적으로 읽고 판단하므로, 이 순서가 안 지켜지면 실제로
// 로그인된 사용자도 새로고침할 때마다 한 박자 #/auth/login으로 잘못
// 튕겨나간다. loadBrandName()은 currentUser와 무관해 순서 상관없다.
// route()가 최종 레이아웃 클래스(is-landing/is-auth 등)까지 다 정한 뒤에야
// body.app-booting을 지운다 — 그전에 지우면 route() 실행 전(잘못된 셸
// 상태)이 한 프레임 그대로 페인트될 수 있어 부팅 오버레이를 씌운 의미가
// 없어진다. 같은 동기 실행 틱 안에서 route() 다음 줄로 붙여, 클래스 제거와
// 최종 레이아웃 확정이 분리된 두 페인트로 쪼개지지 않게 한다.
loadBrandName();
(async () => {
  await loadMe();
  route();
  document.body.classList.remove('app-booting');
})();
</script>
</body>
</html>
