      ${gradeHtml ? `<div class="kanban-card-grade">${gradeHtml}</div>` : ''}
    </div>
  `;
}

// 슬림형 카드 — 컬럼에 카드가 많을 때(KANBAN_SLIM_THRESHOLD 이상) 기본으로 쓴다.
// 제목·담당자·D-day·상태만 압축해 보여준다(펼치기로 전체 카드 복귀).
function pipelineKanbanSlimCardHtml(entry) {
  const assignee = entry.assigneeName ? escapeHtml(entry.assigneeName) : '담당자 미지정';
  return `
    <div class="kanban-card kanban-card--slim" draggable="true" data-id="${escapeAttr(entry.id)}">
      <div class="kanban-card-title">${escapeHtml(entry.noticeTitle)}</div>
      <div class="kanban-card-slim-meta">
        <span class="kanban-card-assignee">${assignee}</span>
        <span class="kanban-card-slim-tags">${statusBadgeHtml(entry.noticeStatus)}${ddayBadgeHtml(entry.submissionDeadline)}</span>
      </div>
    </div>
  `;
}

// 카드가 이 개수 이상이면 그 컬럼은 슬림형으로 접어서 보여준다(펼치기 버튼 제공).
const KANBAN_SLIM_THRESHOLD = 5;
// 사용자가 "펼치기"로 펼쳐 둔 컬럼(상태명) — 재렌더 사이에 유지한다.
const kanbanExpandedColumns = new Set();

// attachKanbanDragScroll — 칸반 보드 빈 영역을 마우스로 잡아 좌우로 스크롤한다
// (트랙패드 없이도 컬럼 이동). 카드/펼치기버튼/종결섹션 위에서 시작한 드래그는
// 각자의 동작(카드 이동 HTML5 DnD 등)에 양보하고 패닝하지 않는다. move/up 리스너는
// 드래그 중에만 document에 붙였다 떼서 리스너가 누적되지 않게 한다.
function attachKanbanDragScroll(board) {
  board.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (e.target.closest('.kanban-card, .kanban-col-toggle, .kanban-terminal-section')) return;
    const startX = e.pageX;
    const startScroll = board.scrollLeft;
    board.classList.add('is-panning');
    const onMove = (ev) => { board.scrollLeft = startScroll - (ev.pageX - startX); };
    const onUp = () => {
      board.classList.remove('is-panning');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    e.preventDefault(); // 드래그 중 텍스트 선택 방지
  });
}

// renderPipelineKanban — 자기 자신을 다시 호출해서 다시 그리는 방식으로
// 드래그 낙관적 갱신/롤백을 처리한다(이 프로젝트에 가상 DOM이 없으므로
// 항상 innerHTML 재작성 — 다른 화면들과 같은 패턴). 재호출 전에 열려
//있던 "종결됨" <details>의 open 상태를 읽어와 유지한다.
function renderPipelineKanban(container, items) {
  const existingDetails = container.querySelector('.kanban-terminal-section');
  const terminalWasOpen = existingDetails ? existingDetails.open : false;

  const grouped = {};
  items.forEach(it => { (grouped[it.status] = grouped[it.status] || []).push(it); });
  const terminalItems = PIPELINE_TERMINAL_STATUSES.flatMap(s => grouped[s] || []);

  const columnsHtml = PIPELINE_KANBAN_COLUMNS.map(status => {
    const group = grouped[status] || [];
    // 카드가 많으면(5개 이상) 기본 슬림형 + "펼치기" 버튼. 펼쳐둔 컬럼은 전체 카드.
    const collapsible = group.length >= KANBAN_SLIM_THRESHOLD;
    const expanded = !collapsible || kanbanExpandedColumns.has(status);
    const cardsHtml = group.map(expanded ? pipelineKanbanCardHtml : pipelineKanbanSlimCardHtml).join('');
    const toggleHtml = collapsible
      ? `<button type="button" class="kanban-col-toggle" data-status="${escapeAttr(status)}">${expanded ? '접기 ▲' : `펼치기 ▾`}</button>`
      : '';
    return `
      <div class="kanban-column" data-status="${escapeAttr(status)}">
        <div class="kanban-column-header">${escapeHtml(status)} <span class="kanban-column-count">${group.length}</span>${toggleHtml}</div>
        <div class="kanban-column-body">
          ${cardsHtml}
        </div>
      </div>
    `;
  }).join('');

  const terminalHtml = terminalItems.length ? `
    <details class="kanban-terminal-section"${terminalWasOpen ? ' open' : ''}>
      <summary>종결됨 (${terminalItems.length}건)</summary>
      <div class="notice-list">${terminalItems.map(pipelineListRowHtml).join('')}</div>
    </details>
  ` : '';

  container.innerHTML = `<div class="kanban-board">${columnsHtml}</div>${terminalHtml}`;

  // 보드 빈 영역 마우스 드래그로 좌우 스크롤.
  const board = container.querySelector('.kanban-board');
  if (board) attachKanbanDragScroll(board);

  // "펼치기/접기" — 슬림형 컬럼을 전체 카드로 토글.
  container.querySelectorAll('.kanban-col-toggle').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const st = btn.dataset.status;
      if (kanbanExpandedColumns.has(st)) kanbanExpandedColumns.delete(st);
      else kanbanExpandedColumns.add(st);
      renderPipelineKanban(container, items);
    });
  });

  let suppressClick = false;
  container.querySelectorAll('.kanban-card').forEach(card => {
    card.addEventListener('click', () => {
      if (suppressClick) { suppressClick = false; return; }
      location.hash = '#/pipeline/' + card.dataset.id;
    });
    card.addEventListener('dragstart', (e) => {
      suppressClick = true;
      card.classList.add('is-dragging');
      e.dataTransfer.setData('text/plain', card.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => { card.classList.remove('is-dragging'); });
  });

  // 드롭 대상은 회색 박스 전체(.kanban-column) — 컬럼이 stretch로 늘어난 아래쪽
  // 빈 영역에 놓아도 이동되도록(예전엔 카드가 놓인 .kanban-column-body에만 걸려
  // 빈 회색 공간엔 드롭이 안 됐다). dragleave는 자식으로 이동할 때도 발생하므로
  // relatedTarget이 컬럼 안이면 하이라이트를 유지한다.
  container.querySelectorAll('.kanban-column').forEach(col => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('is-drop-target'); });
    col.addEventListener('dragleave', (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove('is-drop-target'); });
    col.addEventListener('drop', async (e) => {
      e.preventDefault();
      col.classList.remove('is-drop-target');
      const entryId = e.dataTransfer.getData('text/plain');
      const newStatus = col.dataset.status;
      const entry = items.find(it => it.id === entryId);
      if (!entry || entry.status === newStatus) return;
      const prevStatus = entry.status;
      entry.status = newStatus; // 낙관적 갱신 — 자동전환 배치와의 충돌 방지는
      // 하지 않는다(요구사항 확정: 드래그는 항상 허용, 다음 배치 때 마감/
      // 공고마감 조건에 해당하면 다시 자동으로 '제외'로 넘어갈 수 있음).
      renderPipelineKanban(container, items);
      try {
        await apiRequest('PATCH', '/api/pipeline/' + encodeURIComponent(entryId), { status: newStatus });
      } catch (err) {
        entry.status = prevStatus; // 실패 시 원래 컬럼으로 롤백
        renderPipelineKanban(container, items);
        alert('상태 변경에 실패했습니다: ' + err.message);
      }
    });
  });

  container.querySelectorAll('.pipeline-row').forEach(row => {
    row.addEventListener('click', () => { location.hash = '#/pipeline/' + row.dataset.id; });
  });
}

// ---------- 파이프라인 표 뷰(Phase 3) ----------
const PIPELINE_TABLE_COLUMNS = [
  { key: 'noticeTitle', label: '공고명' },
  { key: 'organizationName', label: '발주기관' },
  { key: 'status', label: '상태' },
  { key: 'assigneeName', label: '담당자' },
  { key: 'submissionDeadline', label: '마감일' },
  { key: 'aiGrade', label: 'AI 판정등급' },
  { key: 'incompleteDocumentCount', label: '서류미비' },
  { key: 'updatedAt', label: '최근수정일' },
];

let pipelineTableSort = { key: 'submissionDeadline', dir: 'asc' };
let pipelineTableStatusFilter = '';

function pipelineTableSortValue(entry, key) {
  switch (key) {
    case 'organizationName': return entry.organizationName || '';
    case 'assigneeName': return entry.assigneeName || '';
    case 'submissionDeadline': return entry.submissionDeadline || '9999-99-99';
    case 'aiGrade': return GRADE_LABELS[entry.aiGrade] || entry.aiGrade || '';
    case 'incompleteDocumentCount': return entry.incompleteDocumentCount || 0;
    case 'updatedAt': return entry.updatedAt || '';
    default: return entry[key] || '';
  }
}

function renderPipelineTable(container, items) {
  const filtered = pipelineTableStatusFilter
    ? items.filter(it => it.status === pipelineTableStatusFilter)
    : items;

  const sorted = filtered.slice().sort((a, b) => {
    const av = pipelineTableSortValue(a, pipelineTableSort.key);
    const bv = pipelineTableSortValue(b, pipelineTableSort.key);
    const cmp = (typeof av === 'number' && typeof bv === 'number')
      ? av - bv
      : String(av).localeCompare(String(bv), 'ko');
    return pipelineTableSort.dir === 'asc' ? cmp : -cmp;
  });

  const filterOptionsHtml = ['<option value="">전체 상태</option>']
    .concat(PIPELINE_STATUS_LIST.map(s => `<option value="${escapeAttr(s)}" ${s === pipelineTableStatusFilter ? 'selected' : ''}>${escapeHtml(s)}</option>`))
    .join('');

  const headHtml = PIPELINE_TABLE_COLUMNS.map(col => {
    const isSorted = pipelineTableSort.key === col.key;
    const arrow = isSorted ? (pipelineTableSort.dir === 'asc' ? ' ▲' : ' ▼') : '';
    return `<th class="pipeline-table-th" data-key="${escapeAttr(col.key)}">${escapeHtml(col.label)}${arrow}</th>`;
  }).join('');

  const rowsHtml = sorted.map(entry => {
    const gradeHtml = entry.aiGrade ? gradeBadgeHtml(entry.aiGrade, GRADE_LABELS[entry.aiGrade] || entry.aiGrade) : '-';
    return `
      <tr class="pipeline-table-row" data-id="${escapeAttr(entry.id)}">
        <td>${escapeHtml(entry.noticeTitle)}</td>
        <td>${escapeHtml(entry.organizationName || '-')}</td>
        <td><span class="badge ${PIPELINE_TERMINAL_BADGE_TONE[entry.status] || 'badge--blue'}">${escapeHtml(entry.status)}</span></td>
        <td>${escapeHtml(entry.assigneeName || '미지정')}</td>
        <td>${ddayBadgeHtml(entry.submissionDeadline)}</td>
        <td>${gradeHtml}</td>
        <td>${entry.incompleteDocumentCount || 0}건</td>
        <td>${escapeHtml(formatDate(entry.updatedAt))}</td>
      </tr>
    `;
  }).join('');

  container.innerHTML = `
    <div class="pipeline-table-toolbar">
      <select class="select-input pipeline-table-filter">${filterOptionsHtml}</select>
      <span class="pipeline-table-count">${sorted.length}건</span>
    </div>
    <div class="pipeline-table-wrap">
      <table class="pipeline-table">
        <thead><tr>${headHtml}</tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="${PIPELINE_TABLE_COLUMNS.length}" class="empty">조건에 맞는 사업이 없습니다.</td></tr>`}</tbody>
      </table>
    </div>
  `;

  container.querySelector('.pipeline-table-filter').addEventListener('change', (e) => {
    pipelineTableStatusFilter = e.target.value;
    renderPipelineTable(container, items);
  });
  container.querySelectorAll('.pipeline-table-th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (pipelineTableSort.key === key) pipelineTableSort.dir = pipelineTableSort.dir === 'asc' ? 'desc' : 'asc';
      else pipelineTableSort = { key, dir: 'asc' };
      renderPipelineTable(container, items);
    });
  });
  container.querySelectorAll('.pipeline-table-row').forEach(row => {
    row.addEventListener('click', () => { location.hash = '#/pipeline/' + row.dataset.id; });
  });
}

// pipelineListRowHtml — 2026-08-06, 공고검색 결과 카드(noticeRowHtml)와
// 같은 형식(공고유형배지 발주기관 · 지역 · 업종 · 예산 · 공고상태 ·
// 담당자)으로 통일. 사이드의 pipelineStepIndicatorHtml(검토전/참여검토/
// .../낙찰 등 파이프라인 자체 진행상태)은 noticeRowHtml에는 없는, 이
// 화면만의 핵심 정보라 그대로 유지 — statusBadgeHtml이 보여주는 건
// "공고 자체"의 상태(진행중/마감/취소/재공고)로 서로 다른 개념이다.
function pipelineListRowHtml(entry) {
  const assignee = entry.assigneeName ? `담당자: ${escapeHtml(entry.assigneeName)}` : '담당자 미지정';
  return `
    <div class="row-card pipeline-row" data-id="${escapeAttr(entry.id)}">
      <span class="row-card-icon">${LIST_ROW_ICONS.pipeline}</span>
      <div class="row-card-main">
        <div class="row-card-title">${escapeHtml(entry.noticeTitle)}</div>
        <div class="row-card-subtitle">
          ${noticeTypeBadgeHtml(entry.noticeType)} ${escapeHtml(entry.organizationName || '-')} · ${escapeHtml(entry.region || '-')} · ${escapeHtml(entry.industry || '-')} ·
          <span class="mono">${formatBudget(entry.budgetAmount)}</span> · ${statusBadgeHtml(entry.noticeStatus)} · ${assignee}
        </div>
      </div>
      <div class="row-card-side">
        ${pipelineStepIndicatorHtml(entry.status)}
        <span class="row-card-arrow">›</span>
      </div>
    </div>
  `;
}

// ---------- 캘린더(#/calendar) ----------
// 외부 캘린더 라이브러리(FullCalendar 등) 없이 순수 JS로 만들었다 —
// 이 프로젝트가 프레임워크/무거운 의존성을 피하는 기조(analyzer의
// requirements.txt 주석, notify 패키지의 "최소 외부 의존성" 원칙과
// 동일한 판단)와 맞고, 이벤트 볼륨도 작아(회사 하나가 동시에 진행하는
// 파이프라인 일정이 많아야 수십 건) 250KB+ 라이브러리를 CDN으로 붙일
// 실익이 없다고 판단했다. 이벤트 데이터는 .ics 다운로드(calendar.go)와
// 완전히 같은 소스(GET /api/pipeline/calendar-events)를 쓴다.
const CALENDAR_WEEKDAY_LABELS = ['일', '월', '화', '수', '목', '금', '토'];
const CALENDAR_KIND_LABELS = { submission: '제출마감', qualification: '등록마감', opening: '개찰일시' };
const CALENDAR_KIND_TONES = { submission: 'danger', qualification: 'warn', opening: 'blue' };

let calendarState = { view: 'month', anchor: new Date(), events: [] };

async function renderCalendarView(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/pipeline/calendar-events');
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }
  calendarState.events = data.items || [];
  calendarState.anchor = new Date(); // 화면 진입마다 오늘 기준으로 리셋
  container.innerHTML = '';
  container.appendChild(h('<h2>캘린더</h2><div id="calendar-root"></div>'));
  renderCalendarShell(document.getElementById('calendar-root'));
}

function renderCalendarShell(root) {
  root.innerHTML = `
    <div class="calendar-toolbar">
      <div class="calendar-toolbar-nav">
        <button type="button" id="calendar-prev-btn" class="btn btn-secondary btn-sm" aria-label="이전">&lsaquo;</button>
        <button type="button" id="calendar-today-btn" class="btn btn-secondary btn-sm">오늘</button>
        <button type="button" id="calendar-next-btn" class="btn btn-secondary btn-sm" aria-label="다음">&rsaquo;</button>
        <h2 class="calendar-title" id="calendar-title"></h2>
      </div>
      <div class="calendar-view-switch">
        ${['month', 'week', 'day'].map(v => `<button type="button" class="btn btn-secondary btn-sm calendar-view-btn${calendarState.view === v ? ' is-active' : ''}" data-view="${v}">${v === 'month' ? '월' : v === 'week' ? '주' : '일'}</button>`).join('')}
      </div>
    </div>
    <div class="calendar-legend">
      ${Object.keys(CALENDAR_KIND_LABELS).map(k => `<span class="calendar-legend-item"><span class="calendar-dot calendar-dot--${CALENDAR_KIND_TONES[k]}"></span>${escapeHtml(CALENDAR_KIND_LABELS[k])}</span>`).join('')}
    </div>
    <div id="calendar-body"></div>
  `;
  document.getElementById('calendar-prev-btn').addEventListener('click', () => { shiftCalendarAnchor(-1); renderCalendarShell(root); });
  document.getElementById('calendar-next-btn').addEventListener('click', () => { shiftCalendarAnchor(1); renderCalendarShell(root); });
  document.getElementById('calendar-today-btn').addEventListener('click', () => { calendarState.anchor = new Date(); renderCalendarShell(root); });
  root.querySelectorAll('.calendar-view-btn').forEach(btn => {
    btn.addEventListener('click', () => { calendarState.view = btn.dataset.view; renderCalendarShell(root); });
  });
  renderCalendarBody(document.getElementById('calendar-body'));
}

function shiftCalendarAnchor(dir) {
  const d = new Date(calendarState.anchor);
  if (calendarState.view === 'month') d.setMonth(d.getMonth() + dir);
  else if (calendarState.view === 'week') d.setDate(d.getDate() + dir * 7);
  else d.setDate(d.getDate() + dir);
  calendarState.anchor = d;
}

function calendarDateKey(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function calendarFormatDate(d) {
  return `${d.getMonth() + 1}월 ${d.getDate()}일(${CALENDAR_WEEKDAY_LABELS[d.getDay()]})`;
}

function calendarWeekDays(anchor) {
  const d = new Date(anchor);
  d.setHours(0, 0, 0, 0);
  const start = new Date(d);
  start.setDate(d.getDate() - d.getDay());
  return Array.from({ length: 7 }, (_, i) => {
    const x = new Date(start);
    x.setDate(start.getDate() + i);
    return x;
  });
}

function calendarEventsByDateKey() {
  const map = {};
  calendarState.events.forEach(e => {
    const key = calendarDateKey(new Date(e.start));
    (map[key] = map[key] || []).push(e);
  });
  Object.values(map).forEach(list => list.sort((a, b) => new Date(a.start) - new Date(b.start)));
  return map;
}

function calendarEventChipHtml(e) {
  const tone = CALENDAR_KIND_TONES[e.kind] || '';
  const d = new Date(e.start);
  const time = e.allDay ? '' : `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} `;
  return `<div class="calendar-event calendar-event--${tone}" data-entry-id="${escapeAttr(e.pipelineEntryId)}" title="${escapeAttr(CALENDAR_KIND_LABELS[e.kind] || e.kind)} · ${escapeAttr(e.noticeTitle)}">${time}${escapeHtml(e.noticeTitle)}</div>`;
}

function wireCalendarEventClicks(scopeEl) {
  scopeEl.querySelectorAll('.calendar-event').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      location.hash = '#/pipeline/' + el.dataset.entryId;
    });
  });
}

// CALENDAR_MOBILE_QUERY — 월간 뷰가 텍스트 칩 대신 점(dot)으로 바뀌는
// 기준. week-grid를 1열로 접는 CSS 미디어쿼리(640px)와 같은 값을 써서
// "좁아지는 시점"이 화면 전체에서 일관되게 한다.
const CALENDAR_MOBILE_QUERY = '(max-width: 640px)';

function renderCalendarBody(bodyEl) {
  const titleEl = document.getElementById('calendar-title');
  const byDate = calendarEventsByDateKey();
  if (calendarState.view === 'month') {
    titleEl.textContent = `${calendarState.anchor.getFullYear()}년 ${calendarState.anchor.getMonth() + 1}월`;
    bodyEl.innerHTML = calendarMonthHtml(calendarState.anchor, byDate);
  } else if (calendarState.view === 'week') {
    const days = calendarWeekDays(calendarState.anchor);
    titleEl.textContent = `${calendarFormatDate(days[0])} ~ ${calendarFormatDate(days[6])}`;
    bodyEl.innerHTML = calendarWeekHtml(days, byDate);
  } else {
    titleEl.textContent = calendarFormatDate(calendarState.anchor);
    bodyEl.innerHTML = calendarDayHtml(calendarState.anchor, byDate);
  }
  wireCalendarEventClicks(bodyEl);
  wireCalendarMonthCellTaps(bodyEl);
}

// wireCalendarMonthCellTaps — 모바일 월간 뷰에서만(data-date-key가 있는
// 셀만) 셀 전체를 탭 대상으로 삼는다. 그 날짜로 앵커를 옮기고 일간 뷰로
// 전환해 이벤트 목록을 텍스트로 펼친다 — 이미 검증된 일간 뷰 렌더링을
// 그대로 재사용하는 쪽이 별도 바텀시트 컴포넌트를 새로 만드는 것보다
// 안전하다.
function wireCalendarMonthCellTaps(bodyEl) {
  bodyEl.querySelectorAll('.calendar-month-cell[data-date-key]').forEach(cell => {
    cell.addEventListener('click', () => {
      const [y, m, d] = cell.dataset.dateKey.split('-').map(Number);
      calendarState.anchor = new Date(y, m - 1, d);
      calendarState.view = 'day';
      renderCalendarShell(document.getElementById('calendar-root'));
    });
  });
}

function calendarEventDotsHtml(dayEvents) {
  const maxDots = 4;
  const shown = dayEvents.slice(0, maxDots);
  const overflow = dayEvents.length - shown.length;
  return `
    <div class="calendar-month-cell-dots">
      ${shown.map(e => `<span class="calendar-dot calendar-dot--${CALENDAR_KIND_TONES[e.kind] || ''}"></span>`).join('')}
      ${overflow > 0 ? `<span class="calendar-month-cell-more">+${overflow}</span>` : ''}
    </div>
  `;
}

function calendarMonthHtml(anchor, byDate) {
  const year = anchor.getFullYear();
  const month = anchor.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const gridStart = new Date(year, month, 1 - firstOfMonth.getDay());
  const todayKey = calendarDateKey(new Date());
  // 좁은 화면에서는 텍스트 칩이 다 잘려서 무의미해지므로(실사용 중
  // 발견) 점으로 바꾸고, 대신 셀 탭으로 일간 뷰를 열어 텍스트를 보여준다
  // — 데스크톱은 공간이 충분해 기존 텍스트 칩을 그대로 유지한다.
  const isMobile = window.matchMedia(CALENDAR_MOBILE_QUERY).matches;

  const cells = Array.from({ length: 42 }, (_, i) => {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    const key = calendarDateKey(d);
    const dayEvents = byDate[key] || [];
    const classes = ['calendar-month-cell'];
    if (d.getMonth() !== month) classes.push('is-outside');
    if (key === todayKey) classes.push('is-today');
    const eventsHtml = isMobile ? calendarEventDotsHtml(dayEvents) : dayEvents.map(calendarEventChipHtml).join('');
    return `
      <div class="${classes.join(' ')}" ${isMobile ? `data-date-key="${key}"` : ''}>
        <div class="calendar-month-cell-date">${d.getDate()}</div>
        <div class="calendar-month-cell-events">${eventsHtml}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="calendar-month-grid">
      ${CALENDAR_WEEKDAY_LABELS.map(w => `<div class="calendar-month-headcell">${w}</div>`).join('')}
      ${cells}
    </div>
  `;
}

function calendarWeekHtml(days, byDate) {
  const todayKey = calendarDateKey(new Date());
  return `
    <div class="calendar-week-grid">
      ${days.map(d => {
        const key = calendarDateKey(d);
        const dayEvents = byDate[key] || [];
        return `
          <div class="calendar-week-col${key === todayKey ? ' is-today' : ''}">
            <div class="calendar-week-col-head">${CALENDAR_WEEKDAY_LABELS[d.getDay()]} <span class="calendar-week-col-date">${d.getDate()}</span></div>
            <div class="calendar-week-col-events">${dayEvents.length ? dayEvents.map(calendarEventChipHtml).join('') : '<p class="calendar-empty-hint">일정 없음</p>'}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function calendarDayHtml(anchor, byDate) {
  const dayEvents = byDate[calendarDateKey(anchor)] || [];
  if (!dayEvents.length) {
    return '<p class="empty">이 날은 일정이 없습니다.</p>';
  }
  return `<div class="calendar-day-list">${dayEvents.map(e => {
    const tone = CALENDAR_KIND_TONES[e.kind];
    const iconCls = tone === 'blue' ? '' : ` row-card-icon--${tone}`;
    return `
    <div class="row-card calendar-event calendar-event--row" data-entry-id="${escapeAttr(e.pipelineEntryId)}">
      <span class="row-card-icon${iconCls}">${SIDEBAR_ICONS.calendar}</span>
      <div class="row-card-main">
        <div class="row-card-title">${escapeHtml(e.noticeTitle)}</div>
        <div class="row-card-subtitle">${escapeHtml(CALENDAR_KIND_LABELS[e.kind] || e.kind)}${e.allDay ? '' : ' · ' + formatDateTime(e.start).slice(11)}</div>
      </div>
      <span class="row-card-arrow">›</span>
    </div>
  `;
  }).join('')}</div>`;
}

// ---------- AI 분석 사용내역 (#/ai-usage) ----------
// 대시보드 "AI 분석 N/M건" 카드 클릭 시 이동. company_documents가 곧
// 사용 로그다(billing_ai_usage.go 주석 참고 — 별도 로그 테이블 없음).
// AI_USAGE_RETRY_CONFIRM_FORMS — documentKind별로 재시도 성공 시 바로
// 이어서 보여줄 확인/저장 폼. 함수 선언은 호이스팅되므로 이 맵이 그
// 함수들보다 텍스트상 앞에 있어도 문제없다. employee_verification의
// renderEmployeeCountConfirmForm은 4번째 인자로 "프로필 폼" DOM을 받아
// employeeCount 입력값도 같이 갱신하는데, 이 화면(#/ai-usage)에는 그
// 폼이 없으므로 null을 넘긴다(위 함수가 null-safe하게 처리하도록 이미
// 고쳐둠).
const AI_USAGE_RETRY_CONFIRM_FORMS = {
  license_or_certification: (slot, candidate, documentId, onSaved) => renderLicenseConfirmForm(slot, candidate, documentId, onSaved),
  financial: (slot, candidate, documentId, onSaved) => renderFinancialForm(slot, candidate, documentId, onSaved),
  track_record: (slot, candidate, documentId, onSaved) => renderTrackRecordForm(slot, candidate, documentId, onSaved),
  personnel: (slot, candidate, documentId, onSaved) => renderPersonnelForm(slot, candidate, documentId, onSaved),
  intellectual_property: (slot, candidate, documentId, onSaved) => renderIPConfirmForm(slot, candidate, documentId, onSaved),
  employee_verification: (slot, candidate, documentId, onSaved) => renderEmployeeCountConfirmForm(slot, candidate, documentId, null),
};

function aiUsageStatusBadgeHtml(status) {
  if (status === 'success') return '<span class="badge badge--success">성공</span>';
  if (status === 'failed') return '<span class="badge badge--danger">실패</span>';
  return '<span class="badge badge--gray">처리중</span>';
}

async function renderAIUsage(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/me/ai-usage');
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  const items = data.items || [];
  const limitLabel = data.limit < 0 ? '무제한' : `${data.usedCount}/${data.limit}건`;
  const rowsHtml = items.length
    ? items.map(it => `
        <div class="license-card">
          <div class="license-card-main">
            <div class="license-card-name">${escapeHtml(it.documentKindName)} ${aiUsageStatusBadgeHtml(it.extractionStatus)}</div>
            <div class="license-card-meta">${escapeHtml(it.originalFilename)} · ${escapeHtml(formatDateTime(it.uploadedAt))}</div>
            ${it.extractionStatus === 'failed' && it.failureReason ? `<div class="license-card-meta ai-usage-failure-reason">${escapeHtml(it.failureReason)}</div>` : ''}
            <div id="ai-usage-retry-slot-${escapeAttr(it.id)}"></div>
          </div>
          ${it.canRetry ? `<div class="license-card-side"><button type="button" class="btn btn-secondary btn-sm ai-usage-retry-btn" data-id="${escapeAttr(it.id)}">재시도</button></div>` : ''}
        </div>
      `).join('')
    : '<p class="empty">이번달 분석한 서류가 없습니다.</p>';

  container.innerHTML = '';
  container.appendChild(h(`
    <h2>AI 분석 사용내역</h2>
    <p class="license-card-meta">${glossaryHtml('AI 분석')} 이번달 사용량: ${escapeHtml(limitLabel)}</p>
    <p class="license-card-meta">실패한 항목은 한도가 차감되지 않습니다 — 성공적으로 분석된 건만 이번달 사용량에 잡힙니다. "재시도"를 누르면 다시 분석하며, 이때도 성공해야만 사용량에 반영됩니다. 단, 같은 파일로 짧은 시간 안에 반복 실패하면 비용 남용 방지를 위해 그 파일의 재시도가 잠시 제한될 수 있습니다.</p>
    <div class="license-list">${rowsHtml}</div>
  `));

  container.querySelectorAll('.ai-usage-retry-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const it = items.find(x => x.id === id);
      const retrySlot = document.getElementById(`ai-usage-retry-slot-${id}`);
      // 한 번에 하나의 재시도/확인 폼만 열리게 — 다른 행에서 열려있던
      // 폼(license-confirm-form 등 고정 id를 쓰는 컴포넌트라 동시에 두 개가
      // 떠 있으면 id 충돌 위험)을 먼저 정리한다.
      container.querySelectorAll('[id^="ai-usage-retry-slot-"]').forEach(el => { el.innerHTML = ''; });
      btn.disabled = true;
      retrySlot.innerHTML = '';
      retrySlot.appendChild(h('<div class="loading">재분석 중...</div>'));
      let result;
      try {
        result = await apiRequest('POST', `/api/me/documents/${encodeURIComponent(id)}/retry`);
      } catch (err) {
        if (err.code === 'file_retry_blocked') {
          // 이 경우는 시도 자체가 안 됐다(새 company_documents 행이 안 생김)
          // — 목록을 새로고침해도 아무 변화가 안 보이므로, 왜 막혔는지
          // 여기 바로 보여줘야 한다.
          retrySlot.innerHTML = '';
          retrySlot.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
          btn.disabled = false;
          return;
        }
        // 재시도가 다시 실패한 경우(extraction_failed) — 새 시도 자체가 새
        // 이력이라 목록을 새로 불러오면 이 실패도 별도 행으로 나타난다
        // (원래 실패했던 행은 그대로 남아있고, 그 옆에 새로운 실패 행이
        // 하나 더 생기는 식).
        renderAIUsage(container);
        return;
      }
      const renderConfirm = AI_USAGE_RETRY_CONFIRM_FORMS[it.documentKind];
      if (renderConfirm) {
        renderConfirm(retrySlot, result.candidate, result.documentId, () => renderAIUsage(container));
      } else {
        renderAIUsage(container);
      }
    });
  });
}

// pipelinePrepSummaryHtml — 준비중 사업 상단 "제출 준비" 요약(2026-08-09). 기존
// renderPipelineChecklist의 분류('보유'만 완료, 그 외는 해야 할 일 + 갱신→발급/신규
// →확인 순)를 그대로 재사용해, 사용자가 폼/체크리스트까지 스크롤하지 않고도 "지금
// 할 일 N건 + 상위 항목 + 준비율"을 제목 아래에서 바로 보게 한다. 데이터가 없으면
// (분석 전) 생략 — 체크리스트 섹션의 빈 상태 안내가 이유를 대신 설명한다.
function pipelinePrepSummaryHtml(checklist, entry) {
  const items = checklist || [];
  if (!items.length) return '';
  const done = items.filter(it => it.status === '보유');
  const actionable = items.filter(it => it.status !== '보유');
  const total = items.length;
  const prepPct = total ? Math.round(done.length / total * 100) : 0;
  const order = { '갱신필요': 0, '발급필요': 1, '신규작성': 1, '확인필요': 2 };
  actionable.sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9));
  const shortAction = it => it.status === '갱신필요' ? '갱신 확인' : it.status === '신규작성' ? '양식 작성' : it.status === '발급필요' ? '발급·등록' : '확인';
  const ddayHtml = entry.submissionDeadline ? `${ddayBadgeHtml(entry.submissionDeadline)}<span class="prep-deadline mono">${escapeHtml(entry.submissionDeadline)}</span>` : '';
  // Phase 1(§3): "상태 관리"가 아니라 "다음 행동" 화면. 우선순위 1위 한 건을 히어로로
  // 크게(지금 할 일), 나머지는 아래 목록으로. 우선순위/준비율/마감 로직은 그대로 재사용.
  if (!actionable.length) {
    return `
      <div class="detail-card prep-summary-card prep-summary-card--done">
        <div class="prep-summary-head"><h3>제출 준비</h3><span class="prep-pct">서류 준비 ${prepPct}% <span class="prep-pct-sub">(${done.length}/${total})</span></span></div>
        ${ddayHtml ? `<p class="prep-deadline-row">제출 마감 ${ddayHtml}</p>` : ''}
        <p class="prep-lead prep-lead--done">추가로 준비할 서류가 없어요. 제출 준비가 끝났습니다.</p>
        <button type="button" class="official-link prep-jump" data-scroll-to="pipeline-checklist-section">체크리스트 보기 &rarr;</button>
      </div>`;
  }
  const top = actionable[0];
  const rest = actionable.slice(1, 4);
  return `
    <div class="detail-card prep-summary-card">
      <div class="prep-hero">
        <div class="prep-hero-eyebrow">지금 할 일</div>
        <div class="prep-hero-doc">${escapeHtml(top.documentName)}</div>
        <div class="prep-hero-sub">${escapeHtml(shortAction(top))}</div>
        <div class="prep-hero-meta"><span>제출 준비 <strong>${done.length}/${total}</strong></span>${ddayHtml ? `<span>마감 ${ddayHtml}</span>` : ''}</div>
        <button type="button" class="btn btn-primary prep-jump" data-scroll-to="pipeline-checklist-section">준비 계속하기</button>
      </div>
      ${rest.length ? `<div class="prep-rest">
        <span class="prep-rest-lbl">남은 할 일</span>
        <ul class="prep-todo">${rest.map(it => `<li><span class="prep-doc">${escapeHtml(it.documentName)}</span><span class="prep-act">${escapeHtml(shortAction(it))}</span></li>`).join('')}${actionable.length > 4 ? `<li class="prep-more">외 ${actionable.length - 4}건</li>` : ''}</ul>
      </div>` : ''}
    </div>`;
}

// pipelineActionBarHtml — Phase A(2026-08-09). 사용자가 상태를 직접 고르지 않고
// "행동"을 누르면 상태가 바뀌게 한다. 상태별로 실제로 할 만한 행동만 큰 버튼으로.
//   검토중  → [참여할게요](준비중) [제외]
//   준비중  → [제출했어요](제출완료) [제외]  (제출마감 경과+미확인이면 "제출했나요?" 확인)
//   제외    → [복원]  (마감/미제출 자동제외면 제출완료로, 그 외 검토중으로)
//   제출완료/낙찰/탈락 → 여기선 없음(제출완료는 아래 결과 기록, 낙찰/탈락은 종결)
function pipelineActionBarHtml(entry) {
  const btn = (label, status, reason, cls) =>
    `<button type="button" class="pipeline-action-btn ${cls || ''}" data-action-status="${escapeAttr(status)}"${reason ? ` data-action-reason="${escapeAttr(reason)}"` : ''}>${escapeHtml(label)}</button>`;
  if (entry.status === '검토중') {
    return `<div class="pipeline-action-bar">${btn('참여할게요', '준비중', '', 'pipeline-action-btn--primary')}${btn('제외', '제외', 'USER_EXCLUDED', 'pipeline-action-btn--ghost')}</div>`;
  }
  if (entry.status === '준비중') {
    const today = new Date(new Date().toDateString());
    const deadlinePassed = entry.submissionDeadline && new Date(entry.submissionDeadline) < today;
    if (deadlinePassed && !entry.submissionConfirmedAt) {
      return `<div class="pipeline-action-prompt">
        <p class="pipeline-action-prompt-q">제출 마감이 지났습니다. 나라장터에서 실제로 제출하셨나요?</p>
        <div class="pipeline-action-bar">${btn('제출했어요', '제출완료', '', 'pipeline-action-btn--primary')}${btn('제출하지 않았어요', '제외', 'DEADLINE_PASSED_NOT_SUBMITTED', 'pipeline-action-btn--ghost')}</div>
      </div>`;
    }
    return `<div class="pipeline-action-bar">${btn('제출했어요', '제출완료', '', 'pipeline-action-btn--primary')}${btn('제외', '제외', 'USER_EXCLUDED', 'pipeline-action-btn--ghost')}</div>`;
  }
  if (entry.status === '제외') {
    const restoreTo = (entry.excludeReason === 'DEADLINE_PASSED_UNCONFIRMED' || entry.excludeReason === 'DEADLINE_PASSED_NOT_SUBMITTED') ? '제출완료' : '검토중';
    return `<div class="pipeline-action-bar">${btn('복원', restoreTo, '', 'pipeline-action-btn--primary')}</div>`;
  }
  return '';
}

// pipelineResultBadgeHtml — 우선순위5 후속(2026-08-09). 제출완료 이후 시스템이
// 개찰/낙찰 결과를 자동 확인 중이라는 사실을 알리는 "보조 배지". 새 status가
// 아니라 result_type/opening_at/결과조회 내부값으로 문구만 만든다 — 내부 enum
// (NEEDS_REVIEW/REBID 등)은 절대 그대로 노출하지 않고 한글로 변환한다.
// 낙찰/탈락으로 확정되면 배지를 달지 않는다(그땐 공식 결과 문구를 따로 보여줌).
function pipelineResultBadgeHtml(entry) {
  if (entry.status !== '제출완료') return '';
  const now = new Date();
  const opening = entry.openingAt ? new Date(entry.openingAt) : null;
  let label = '', desc = '';
  if (opening && !isNaN(opening) && opening > now) {
    label = '개찰 예정';
    desc = formatDateTime(entry.openingAt);
  } else if (entry.resultType === 'NEEDS_REVIEW' || entry.resultType === 'NAME_MATCH') {
    label = '결과 확인 필요';
    desc = '자동 확정하기 어려운 결과 유형입니다. 최종 결과를 확인하고 있습니다.';
  } else if (entry.resultType === 'REBID') {
    label = '재입찰 확인 중';
    desc = '재입찰 또는 후속 공고 여부를 확인하고 있습니다.';
  } else if (!entry.resultFinalizedAt && entry.resultCheckAttempts > 0) {
    label = '결과 확인 중';
    desc = entry.lastResultCheckedAt ? '최근 확인 ' + formatDateTime(entry.lastResultCheckedAt) : '';
  } else {
    return ''; // 개찰 전 조회 이력 없음/결과없음 등은 배지 미표시
  }
  return `<span class="pipeline-aux-badge" title="${escapeAttr(desc)}">${escapeHtml(label)}${desc ? `<span class="pipeline-aux-badge-desc">${escapeHtml(desc)}</span>` : ''}</span>`;
}

// pipelineOfficialResultHtml — 낙찰/탈락이 "공식 개찰 결과로 자동 확인"된
// 경우(result_type=WON/LOST)에만 공식 결과 문구를 보여준다. 사용자가 수동으로
// 낙찰/탈락을 기록한 건(result_type 없음)엔 표시하지 않는다.
function pipelineOfficialResultHtml(entry) {
  if (entry.status === '낙찰' && entry.resultType === 'WON') {
    let s = '공식 개찰 결과로 낙찰이 확인됐습니다.';
    if (entry.awardRate != null) s += ` 낙찰률 ${entry.awardRate}%.`;
    return `<div class="pipeline-official-result pipeline-official-result--win">🏆 ${escapeHtml(s)}</div>`;
  }
  if (entry.status === '탈락' && entry.resultType === 'LOST') {
    let s = '공식 개찰 결과로 탈락이 확인됐습니다.';
    if (entry.winnerName) s += ` 낙찰업체: ${entry.winnerName}.`;
    if (entry.awardRate != null) s += ` 낙찰률 ${entry.awardRate}%.`;
    return `<div class="pipeline-official-result pipeline-official-result--lose">${escapeHtml(s)}</div>`;
  }
  return '';
}

async function renderPipelineDetail(container, id) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/pipeline/' + encodeURIComponent(id));
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  const entry = data.entry;
  const checklist = data.checklist || [];

  // 참여판정 요약(2026-08-09): 공고 상세와 동일한 participationJudgment를 진행 중
  // 사업 상세에도 보여준다. 검토중/준비중은 제목 아래 바로(강조), 제출완료/낙찰/
  // 탈락/제외는 접어서(축소) — 그 상태에선 개찰/결과가 더 중요하기 때문(§4).
  const pj = data.participationJudgment;
  const hasJudgment = pj && pj.conditions && pj.conditions.length;
  // 준비중은 "다음 행동(제출 준비)"이 주인공이라 판정 근거를 접는다(Phase 1 §3).
  // 검토중(참여 결정 전)만 판정을 펼쳐 보여준다.
  const judgmentActive = entry.status === '검토중';
  const judgmentSlotHtml = hasJudgment
    ? (judgmentActive
        ? '<div id="pipeline-judgment-section"></div>'
        : '<details class="pipeline-judgment-collapse"><summary>참여판정 보기</summary><div id="pipeline-judgment-section"></div></details>')
    : '';

  container.innerHTML = '';
  container.appendChild(h(`
    <a href="#/pipeline" class="back-link">&larr; 진행 중 사업 목록으로</a>
    <div class="detail-card">
      <p class="detail-eyebrow">${escapeHtml(entry.organizationName || '-')}</p>
      <h2><a href="#/notices/${escapeAttr(entry.noticeId)}">${escapeHtml(entry.noticeTitle)}</a></h2>
      ${judgmentSlotHtml}
      ${entry.status === '준비중' ? pipelinePrepSummaryHtml(checklist, entry) : ''}
      <div class="pipeline-step-summary">${pipelineStepIndicatorHtml(entry.status)}${pipelineResultBadgeHtml(entry)}</div>
      ${pipelineOfficialResultHtml(entry)}
      ${pipelineActionBarHtml(entry)}
      ${entry.status === '제출완료' ? `
      <div class="pipeline-result-record">
        <span class="pipeline-result-record-q">개찰 결과가 나왔나요? 결과를 기록하세요.</span>
        <div class="pipeline-result-record-btns">
          <button type="button" class="pipeline-result-btn pipeline-result-btn--win" data-result="낙찰">🏆 낙찰</button>
          <button type="button" class="pipeline-result-btn pipeline-result-btn--lose" data-result="탈락">탈락</button>
        </div>
      </div>` : ''}
      <a class="calendar-add-link" href="/api/pipeline/${escapeAttr(entry.id)}/calendar.ics" download>&#128197; 캘린더에 추가 (.ics)</a>
      <form id="pipeline-entry-form" class="profile-form">
        <details class="pipeline-status-manual"><summary>상태 직접 변경(고급)</summary>
          <label>상태${pipelineStatusSelectHtml(entry.status)}</label>
        </details>
        <label>낙찰 금액(원)<input type="text" inputmode="numeric" name="awardedAmount" value="${escapeAttr(formatCurrency(entry.awardedAmount))}" placeholder="낙찰된 경우 실제 계약금액을 입력해주세요 (성장분석 ROI에 반영됩니다)"></label>
        <div id="assignee-section">${assigneeSectionHtml(entry)}</div>
        <label>메모<textarea name="memo" rows="3">${escapeHtml(entry.memo || '')}</textarea></label>
        <p class="license-card-meta">제출 마감: ${entry.submissionDeadline ? escapeHtml(entry.submissionDeadline) : '확인 안 됨'}</p>
        <div id="pipeline-entry-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-block">저장</button>
      </form>
      ${entry.status !== '제외' ? `<button type="button" id="pipeline-cancel-btn" class="btn btn-secondary btn-sm pipeline-cancel-btn">참여 취소</button>` : ''}
    </div>
    <h3>제출서류 체크리스트</h3>
    <div id="pipeline-checklist-section"></div>
  `));

  // 공고 상세와 동일한 참여판정 렌더(같은 컴포넌트 재사용 → 판정/순서 일치).
  if (hasJudgment) {
    renderParticipationJudgment(document.getElementById('pipeline-judgment-section'), pj, {
      refetch: async () => (await apiRequest('GET', '/api/pipeline/' + encodeURIComponent(id))).participationJudgment,
    });
  }

  // "준비할 것 자세히 보기" → 같은 화면의 체크리스트 섹션으로 스크롤(해시 라우팅을
  // 건드리지 않도록 href 대신 scrollIntoView 사용).
  const prepJump = container.querySelector('.prep-jump');
  if (prepJump) {
    prepJump.addEventListener('click', () => {
      const target = document.getElementById(prepJump.dataset.scrollTo);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  // ics 다운로드는 일반 <a download> 링크라 완료 이벤트를 JS로 알 방법이
  // 없다(브라우저가 네이티브로 처리) — 클릭 시점에 "다운로드를
  // 시작합니다"로 즉시 안내한다(2026-08-07, UX 경량화 3단계).
  document.querySelector('.calendar-add-link').addEventListener('click', () => {
    showToast('캘린더 파일을 다운로드합니다.', 'info');
  });

  // 행동버튼(Phase A) — 참여할게요/제출했어요/제외/복원. 상태 select 대신 이 버튼이
  // 상태를 바꾼다(제출했어요→제출완료는 submission_confirmed_at 기록, 제외는 reason 동반).
  container.querySelectorAll('.pipeline-action-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const body = { status: btn.dataset.actionStatus };
        if (btn.dataset.actionReason) body.excludeReason = btn.dataset.actionReason;
        await apiRequest('PATCH', '/api/pipeline/' + encodeURIComponent(id), body);
        renderPipelineDetail(container, id);
      } catch (err) {
        btn.disabled = false;
        showToast(err.message || '처리에 실패했습니다.', 'error');
      }
    });
  });

  // 결과 기록(Phase 2) — 제출완료 건에서 낙찰/탈락을 원클릭으로 확정. 상태 select을
  // 열어 고르지 않아도 되게 큰 버튼 2개로. 낙찰 시 실제 계약금액은 저장 폼의
  // "낙찰 금액"에서 이어서 입력하면 성장분석 ROI에 반영된다.
  container.querySelectorAll('.pipeline-result-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const result = btn.dataset.result;
      btn.disabled = true;
      try {
        await apiRequest('PATCH', '/api/pipeline/' + encodeURIComponent(id), { status: result });
        showToast(`결과를 "${result}"(으)로 기록했습니다.`, 'success');
        renderPipelineDetail(container, id);
      } catch (err) {
        btn.disabled = false;
        showToast(err.message || '결과 기록에 실패했습니다.', 'error');
      }
    });
  });

  // 참여 취소 — 진행 중 사업에서 완전 삭제한다(예전엔 "제외"로 남겨 목록에 계속
  // 보였으나, 실수 클릭이 남아 불편하다는 피드백으로 삭제로 전환, 2026-08-08).
  // 삭제 후엔 항목이 사라지므로 진행 중 사업 목록으로 이동한다.
  const cancelBtn = document.getElementById('pipeline-cancel-btn');
  if (cancelBtn) cancelBtn.addEventListener('click', () => {
    openConfirmModal({
      title: '참여 취소',
      message: '이 공고의 참여 검토를 취소하시겠습니까? 진행 중 사업 목록에서 완전히 삭제됩니다.',
      confirmLabel: '참여 취소',
      tone: 'danger',
      onConfirm: async () => {
        await apiRequest('DELETE', '/api/pipeline/' + encodeURIComponent(id));
        showToast('참여 검토를 취소했습니다.', 'success');
        location.hash = '#/pipeline';
      },
    });
  });

  // 담당자가 아직 비어 있고, 등록된 담당자도 하나도 없으면 "미리
  // 등록해두면 편리합니다" 안내 — 매번 두 번째 API 호출을 하긴 하지만
  // 담당자 자체가 비어 있는 경우에만(대부분 이미 채워져 있음) 호출된다.
  if (!entry.assigneeName) {
    apiRequest('GET', '/api/me/contacts').then(data => {
      if ((data.items || []).length === 0) {
        const hintEl = document.getElementById('pipeline-no-contact-hint');
        if (hintEl) {
          hintEl.innerHTML = `<p class="auth-step-hint"><a href="#/pipeline">담당자 관리</a>에서 미리 등록해두면 다음부터 자동으로 채워집니다.</p>`;
        }
      }
    }).catch(() => {});
  }

  wireAssigneeSection(container, entry);

  const form = document.getElementById('pipeline-entry-form');
  attachCurrencyAutoFormat(form.awardedAmount);
  if (form.assigneePhone && form.assigneePhone.type === 'tel') attachPhoneAutoFormat(form.assigneePhone);
  const errorBox = document.getElementById('pipeline-entry-error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    const awardedAmountCleaned = parseCurrencyInput(fd.get('awardedAmount'));
    const payload = {
      status: fd.get('status'),
      awardedAmount: awardedAmountCleaned === null ? null : Number(awardedAmountCleaned),
      assigneeName: fd.get('assigneeName') || '',
      assigneeEmail: fd.get('assigneeEmail') || '',
      assigneePhone: fd.get('assigneePhone') || '',
      assigneeUserId: fd.get('assigneeUserId') || '',
      memo: fd.get('memo') || '',
    };
    try {
      await apiRequest('PATCH', '/api/pipeline/' + encodeURIComponent(id), payload);
      showToast('저장되었습니다.', 'success');
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });

  renderPipelineChecklist(document.getElementById('pipeline-checklist-section'), id, checklist, data.documentAnalysisStatus, entry.noticeId);
}

// assigneeSectionHtml/wireAssigneeSection — 2026-08-06, 담당자-회원계정 FK
// 연결. 담당자는 두 가지 방식 중 하나다: (1) 자유텍스트(이름/이메일/전화,
// 조직에 소속되지 않은 개인사업자·외부 협력자도 지정 가능) (2) 이 회사
// 회원계정(company_members) 중 하나에 연결 — 이 경우 서버가
// assignee_user_id를 저장하고, 상태변경/정정/취소 알림도 그 계정의 실제
// 로그인 이메일로 별도 발송한다(company_contacts 자유텍스트 알림과는
// 별개 경로, notifications.go의 notifyPipelineAssigneeAccount 참고). 두
// 모드는 폼 제출 전까지는 순수 클라이언트 상태로만 전환되고("저장"을
// 눌러야 실제 반영), 회원계정에는 이름 필드가 없어(company_members에
// name 컬럼 없음) 이메일을 표시명으로도 쓴다.
function assigneeSectionHtml(entry) {
  if (entry.assigneeUserId) {
    return `
      <div class="assignee-account-linked">
        <p class="license-card-meta">담당자(회원계정): <b>${escapeHtml(entry.assigneeEmail || entry.assigneeName || '')}</b></p>
        <button type="button" id="unlink-assignee-btn" class="btn btn-secondary btn-sm">연결 해제(자유 입력으로 전환)</button>
      </div>
      <input type="hidden" name="assigneeUserId" value="${escapeAttr(entry.assigneeUserId)}">
      <input type="hidden" name="assigneeName" value="${escapeAttr(entry.assigneeName || '')}">
      <input type="hidden" name="assigneeEmail" value="${escapeAttr(entry.assigneeEmail || '')}">
      <input type="hidden" name="assigneePhone" value="">
    `;
  }
  return `
    <label>담당자<input type="text" name="assigneeName" value="${escapeAttr(entry.assigneeName || '')}" placeholder="담당자 이름"></label>
    <label>담당자 이메일<input type="email" name="assigneeEmail" value="${escapeAttr(entry.assigneeEmail || '')}" placeholder="상태 변경 시 이 주소로 알림이 발송됩니다"></label>
    <label>담당자 전화번호<input type="tel" name="assigneePhone" value="${escapeAttr(entry.assigneePhone || '')}" placeholder="상태 변경 시 이 번호로 SMS가 발송됩니다"></label>
    <input type="hidden" name="assigneeUserId" value="">
    <div class="pipeline-assignee-actions">
      <button type="button" id="load-contact-btn" class="btn btn-secondary btn-sm">담당자 목록에서 불러오기</button>
      <button type="button" id="load-member-btn" class="btn btn-secondary btn-sm">회원 목록에서 선택</button>
      <div id="load-contact-picker"></div>
      <div id="load-member-picker"></div>
    </div>
    <div id="pipeline-no-contact-hint"></div>
  `;
}

function wireAssigneeSection(container, entry) {
  const section = container.querySelector('#assignee-section');
  const form = container.querySelector('#pipeline-entry-form');

  function rerender(nextEntry) {
    section.innerHTML = assigneeSectionHtml(nextEntry);
    if (form.assigneePhone && form.assigneePhone.type === 'tel') attachPhoneAutoFormat(form.assigneePhone);
    wireAssigneeSection(container, nextEntry);
  }

  const unlinkBtn = section.querySelector('#unlink-assignee-btn');
  if (unlinkBtn) {
    unlinkBtn.addEventListener('click', () => {
      rerender({ ...entry, assigneeUserId: null, assigneeName: '', assigneeEmail: '', assigneePhone: '' });
    });
    return;
  }

  wireLoadContactButton(container);

  const memberBtn = section.querySelector('#load-member-btn');
  const memberPicker = section.querySelector('#load-member-picker');
  if (memberBtn) {
    memberBtn.addEventListener('click', async () => {
      memberPicker.innerHTML = '';
      let items = [];
      try {
        const data = await apiRequest('GET', '/api/me/company/members');
        items = data.items || [];
      } catch (err) {
        memberPicker.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
        return;
      }
      if (!items.length) {
        memberPicker.innerHTML = `<p class="auth-step-hint">등록된 회원계정이 없습니다.</p>`;
        return;
      }
      openListPickerModal(
        '회원 선택',
        items,
        (m) => `${m.email}${m.role === 'owner' ? ' (대표)' : ''}`,
        (m) => { rerender({ ...entry, assigneeUserId: m.userId, assigneeName: m.email, assigneeEmail: m.email, assigneePhone: '' }); },
      );
    });
  }
}

// favoriteFirst — 담당자 목록/피커에서 "기본 담당자"(isDefault)를 항상 위로
// 끌어올린다(자주 쓰는 담당자를 매번 찾지 않도록). 그 안에서는 이름 가나다순.
// 원본 배열을 건드리지 않게 복사본을 정렬해 돌려준다.
function favoriteFirst(contacts) {
  return (contacts || []).slice().sort((a, b) =>
    (b.isDefault ? 1 : 0) - (a.isDefault ? 1 : 0) ||
    (a.name || '').localeCompare(b.name || '', 'ko'));
}

// wireLoadContactButton — "담당자 목록에서 불러오기" 버튼. 클릭 시
// company_contacts 목록을 모달 목록으로 보여주고(2026-08-07, 기존
// 인라인 <select>가 "선택 UI가 불명확하다"는 피드백으로 모달로 교체),
// 고르면 그 담당자의 이름/이메일/전화번호로 입력란 3개를 바로 채운다
// (폼 제출은 별도 — "저장" 버튼을 눌러야 실제 반영된다, 실수로
// 덮어써도 저장 전이면 취소 가능).
function wireLoadContactButton(container) {
  const btn = container.querySelector('#load-contact-btn');
  const picker = container.querySelector('#load-contact-picker');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    picker.innerHTML = '';
    let items = [];
    try {
      const data = await apiRequest('GET', '/api/me/contacts');
      items = data.items || [];
    } catch (err) {
      picker.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
      return;
    }
    if (!items.length) {
      picker.innerHTML = `<p class="auth-step-hint">등록된 담당자가 없습니다. <a href="#/pipeline">담당자 관리</a>에서 먼저 등록하세요.</p>`;
      return;
    }
    openListPickerModal(
      '담당자 선택',
      favoriteFirst(items),
      (c) => `${c.name}${c.isDefault ? ' (기본)' : ''}`,
      (c) => {
        const form = container.querySelector('#pipeline-entry-form');
        form.elements['assigneeName'].value = c.name || '';
        form.elements['assigneeEmail'].value = c.email || '';
        form.elements['assigneePhone'].value = c.phone || '';
      },
    );
  });
}

// renderPipelineChecklist — 항목별 select 하나로 바로 PATCH(저장 버튼 없음,
// select 자체가 바뀌는 즉시 반영). 실패하면 select를 원래 값으로 되돌린다
// ("실패 시 조용히 원복" 관례).
//
// 2026-08-07: analysisStatus(server.go computeNoticeDocumentAnalysisStatus)를
// "대기중"(아직 처리 중이라 나중에 채워질 수 있음) vs "정보없음"(분석이
// 끝났거나 애초에 첨부파일이 없어 더 안 채워짐) 2가지로만 단순화해서
// 보여준다 — 참가자격 요건/제출서류 탭의 4단계 세분화와 달리 여기는
// "그래서 지금 뭘 해야 하나"가 중요해 두 갈래면 충분하다는 판단.
function renderPipelineChecklist(container, entryId, items, analysisStatus, noticeId) {
  container.innerHTML = '';
  if (!items.length) {
    const isWaiting = analysisStatus === 'extracting_text' || analysisStatus === 'awaiting_structured_extraction';
    const text = isWaiting
      ? '이 공고는 아직 서류 분석이 진행 중입니다. 완료되면 체크리스트가 자동으로 채워집니다.'
      : '이 공고에는 별도 제출서류 안내가 없습니다.';
    const linkHtml = noticeId
      ? `<a href="#/notices/${escapeAttr(noticeId)}" class="official-link">지금 확인하기 &rarr;</a>`
      : '';
    container.appendChild(h(`<p class="empty">${escapeHtml(text)}</p>${linkHtml}`));
    return;
  }
  // Step 4(2026-08-09): 단순 목록 대신 "남은 일 우선 + 자동확인 접기 + 요약".
  // 목표는 사용자가 이번 공고에서 실제로 추가 준비할 것만 보게 하는 것.
  // '보유'만 완료(자동 확인)로 보고, 나머지는 해야 할 일로 위에 올린다.
  const isDone = s => s === '보유';
  const done = items.filter(it => isDone(it.status));
  const actionable = items.filter(it => !isDone(it.status));
  const total = items.length;
  const autoConfirmed = done.length;
  const renewCount = items.filter(it => it.status === '갱신필요').length;
  const confirmCount = items.filter(it => it.status === '확인필요').length;
  const prepareCount = items.filter(it => it.status === '발급필요' || it.status === '신규작성').length;
  // 준비율은 "서류 보유율"이다(입찰 자격 충족률이 아님) — 과장하지 않기 위해 명시.
  const prepPct = total ? Math.round(autoConfirmed / total * 100) : 0;

  const summaryHtml = `
    <div class="checklist-summary">
      <div class="checklist-summary-top">
        <span class="checklist-prep-pct">서류 준비 ${prepPct}%</span>
        <span class="checklist-total">필요서류 ${total}개</span>
      </div>
      <div class="checklist-summary-counts">
        <span class="ck-count ck-done">✓ 자동 확인 ${autoConfirmed}</span>
        <span class="ck-count ck-warn">! 확인 필요 ${confirmCount + renewCount}</span>
        <span class="ck-count ck-miss">○ 새로 준비 ${prepareCount}</span>
      </div>
      <p class="checklist-summary-msg">기존 회사정보와 등록서류 ${autoConfirmed}개를 자동으로 확인했습니다.${actionable.length ? ` 이번 공고에서는 ${actionable.length}개만 추가로 준비하면 됩니다.` : ' 추가로 준비할 서류가 없습니다.'}</p>
    </div>`;

  // 정렬: 갱신/마감 → 미등록 → 확인 필요(해야 할 일을 위로).
  const order = { '갱신필요': 0, '발급필요': 1, '신규작성': 1, '확인필요': 2 };
  actionable.sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9));

  // 항목당 주 행동 최대 1개(모바일 고려). 내부 enum/match_method는 노출하지 않는다.
  const manualHtml = it => `
    <details class="checklist-manual"><summary>직접 변경</summary>
      <select class="select-input checklist-status-select" data-item-id="${escapeAttr(it.id)}">
        ${CHECKLIST_STATUS_LIST.map(s => `<option value="${escapeAttr(s)}" ${s === it.status ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}
      </select>
    </details>`;

  const actionMeta = it => {
    if (it.status === '갱신필요') return { hint: '등록된 정보가 만료되었습니다. 갱신이 필요합니다.', ctaLabel: '갱신하기', href: '#/me/company', tone: 'ck-tone-warn' };
    if (it.status === '신규작성') return { hint: '이번 공고에서 준비하는 서류입니다.', ctaLabel: noticeId ? '양식 보기' : '준비하기', href: noticeId ? `#/notices/${escapeAttr(noticeId)}` : '#/me/saved-searches', tone: 'ck-tone-form' };
    if (it.status === '발급필요') return { hint: '아직 등록되지 않았습니다.', ctaLabel: '등록하기', href: '#/me/company', tone: 'ck-tone-miss' };
    return { hint: '확인이 필요합니다.', ctaLabel: '확인하기', href: '#/me/company', tone: 'ck-tone-confirm' }; // 확인필요
  };

  const doneHint = it => {
    if (it.evidenceType === 'file') return { main: '✓ 등록된 서류 자동 확인', sub: '공고 세부 조건은 별도 확인이 필요할 수 있어요.' };
    if (it.evidenceType === 'license') return { main: '✓ 등록정보 확인', sub: '' };
    if (it.evidenceType === 'profile') return { main: '✓ 회사정보에서 확인', sub: '제출용 파일이 필요하면 별도 등록이 필요할 수 있어요.' };
    return { main: '✓ 확인됨', sub: '' };
  };

  const actionItemHtml = it => {
    const m = actionMeta(it);
    return `<div class="checklist-item ${m.tone}" data-item-id="${escapeAttr(it.id)}">
      <div class="checklist-item-main">
        <span class="checklist-item-name">${escapeHtml(it.documentName)}</span>
        <span class="checklist-item-hint">${escapeHtml(m.hint)}</span>
      </div>
      <a class="btn btn-secondary btn-sm checklist-item-cta" href="${m.href}">${escapeHtml(m.ctaLabel)}</a>
      ${manualHtml(it)}
    </div>`;
  };
  const doneItemHtml = it => {
    const d = doneHint(it);
    return `<div class="checklist-item checklist-item--done" data-item-id="${escapeAttr(it.id)}">
      <div class="checklist-item-main">
        <span class="checklist-item-name">${escapeHtml(it.documentName)}</span>
        <span class="checklist-item-hint checklist-hint-ok">${escapeHtml(d.main)}${d.sub ? `<span class="checklist-hint-sub"> · ${escapeHtml(d.sub)}</span>` : ''}</span>
      </div>
      ${manualHtml(it)}
    </div>`;
  };

  const actionsHtml = actionable.length
    ? `<h4 class="checklist-group-title">준비해야 할 서류 ${actionable.length}개</h4><div class="checklist-list">${actionable.map(actionItemHtml).join('')}</div>`
    : `<p class="checklist-all-done">✓ 이번 공고에 필요한 서류가 모두 확인되었습니다.</p>`;
  const doneGroupHtml = done.length
    ? `<details class="checklist-done-group"><summary>자동 확인된 서류 ${done.length}개</summary><div class="checklist-list">${done.map(doneItemHtml).join('')}</div></details>`
    : '';

  container.appendChild(h(summaryHtml + actionsHtml + doneGroupHtml));

  container.querySelectorAll('.checklist-status-select').forEach(sel => {
    const originalValue = sel.value;
    sel.addEventListener('change', async () => {
      const itemId = sel.dataset.itemId;
      sel.disabled = true;
      try {
        await apiRequest('PATCH',
          '/api/pipeline/' + encodeURIComponent(entryId) + '/checklist/' + encodeURIComponent(itemId),
          { status: sel.value });
      } catch (err) {
        sel.value = originalValue;
        if (err.status === 401) { location.hash = '#/auth/login'; return; }
      } finally {
        sel.disabled = false;
      }
    });
  });
}

// NOTICE_SORT_OPTIONS — #/notices 정렬 드롭다운. value는 서버
// noticeListSortOrderBy(server.go)의 화이트리스트 키와 그대로 맞춘다.

// REGION_OPTIONS — 대한민국 17개 광역시도 + "전국". notices.region은
// 원문 그대로(자유 텍스트)라 서버 필터는 정확히 일치(=)로 비교한다 —
// 실제 저장된 값도 이 표기 그대로("서울특별시" 등, 로컬 데모데이터로
// 확인)라 select로 바꿔도 기존 자유입력보다 매칭이 더 잘 된다.
