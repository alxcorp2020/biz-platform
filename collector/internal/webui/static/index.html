// donutChartHtml — 외부 차트 라이브러리 없이 순수 SVG로 그리는 도넛
// 차트. stroke-dasharray/dashoffset으로 원 둘레를 segment별 비율만큼
// 나눠 그린다(원 하나를 여러 겹 원호로 겹쳐 그리는 표준 기법). segments
// = [{ label, count, colorVar }]. 합계가 0이면 빈 회색 링만 보여준다.
function donutChartHtml(segments) {
  const total = segments.reduce((sum, s) => sum + s.count, 0);
  const size = 160, strokeWidth = 22, r = (size - strokeWidth) / 2, circumference = 2 * Math.PI * r;
  let offset = 0;
  const arcs = total > 0
    ? segments.filter(s => s.count > 0).map(s => {
        const dash = (s.count / total) * circumference;
        const arc = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(${s.colorVar})" stroke-width="${strokeWidth}" stroke-dasharray="${dash.toFixed(2)} ${(circumference - dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>`;
        offset += dash;
        return arc;
      }).join('')
    : `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${strokeWidth}"/>`;
  return `
    <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="등급 분포 도넛차트">
      ${arcs}
      <text x="${size / 2}" y="${size / 2 - 4}" text-anchor="middle" class="donut-chart-total">${total}</text>
      <text x="${size / 2}" y="${size / 2 + 16}" text-anchor="middle" class="donut-chart-total-label">건</text>
    </svg>
  `;
}

// simpleLineChartHtml — 도넛차트와 같은 원칙(외부 라이브러리 없이 순수
// SVG)으로 그리는 다중 시리즈 선그래프. series = [{colorVar, values}],
// labels는 x축(values와 길이 동일). yMax를 안 주면 데이터 최댓값으로
// 자동 스케일(최소 1 — 0 나눗셈 방지). 성장분석(#/growth)의 완성도·
// 파이프라인·AI등급분포 추이 3곳에서 재사용한다.
function simpleLineChartHtml(labels, series, yMax) {
  const width = 560, height = 190;
  const padding = { top: 12, right: 12, bottom: 22, left: 8 };
  const chartW = width - padding.left - padding.right;
  const chartH = height - padding.top - padding.bottom;
  const n = labels.length;
  const maxVal = yMax != null ? yMax : Math.max(1, ...series.flatMap(s => s.values));
  const xStep = n > 1 ? chartW / (n - 1) : 0;
  const xAt = i => padding.left + (n > 1 ? i * xStep : chartW / 2);
  const yAt = v => padding.top + chartH - (Math.min(v, maxVal) / maxVal) * chartH;

  const gridLines = [0, 0.5, 1].map(f => {
    const y = (padding.top + chartH * (1 - f)).toFixed(1);
    return `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
  }).join('');

  const seriesHtml = series.map(s => {
    const points = s.values.map((v, i) => `${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');
    const dots = s.values.map((v, i) => `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(v).toFixed(1)}" r="3" fill="var(${s.colorVar})"/>`).join('');
    return `<polyline points="${points}" fill="none" stroke="var(${s.colorVar})" stroke-width="2"/>${dots}`;
  }).join('');

  // 라벨이 많으면(주간 데이터 누적 시) 다 그리면 겹치므로 최대 6개만
  // 골라서 보여준다(처음/끝은 항상 포함).
  const labelStep = Math.max(1, Math.ceil(n / 6));
  const xLabels = labels.map((l, i) => {
    if (i % labelStep !== 0 && i !== n - 1) return '';
    return `<text x="${xAt(i).toFixed(1)}" y="${height - 4}" text-anchor="middle" class="growth-chart-axis-label">${escapeHtml(l)}</text>`;
  }).join('');

  return `
    <svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" role="img" aria-label="추이 그래프" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      ${seriesHtml}
      ${xLabels}
    </svg>
  `;
}

// "핵심 요약" — analyzer/ai_summarize.py(claude-sonnet-5)가 배치로 미리
// 생성해둔 3줄 요약을 그대로 보여준다(Go/프론트 어느 쪽도 실시간으로 Claude를
// 호출하지 않음). 2026-08-07: 이 요약은 다른 문서 분석(참가자격 요건 등)과
// 달리 apiserver 안에 자동 배치로 포팅되지 않았다 — ai_summarize.py는
// run_pipeline.sh(자동 cron)에도 안 들어있고, 비용 문제로 항상 사람이
// 견적을 확인한 뒤 수동으로 실행한다(파일 상단 주석 참고). 그래서
// "보통 N시간 이내 자동 생성"처럼 시점을 약속하는 문구를 쓸 근거가
// 없다 — 정확히 그 사실("운영진이 주기적으로 생성 중")만 안내하고,
// 대신 기다리는 동안 원문을 바로 볼 수 있는 링크를 제공한다.
function renderAISummary(container, summary, officialUrl) {
  container.innerHTML = '';
  if (!summary || !summary.lines || !summary.lines.length) {
    const linkHtml = officialUrl
      ? `<a href="${escapeAttr(officialUrl)}" target="_blank" rel="noopener" class="official-link">원문 확인 ${newTabIconHtml()}</a>`
      : '';
    container.appendChild(h(`
      <div class="ai-summary-empty">
        <p class="ai-summary-empty-title">AI 요약 준비 중</p>
        <p class="section-empty">현재 공고 원문은 바로 확인할 수 있습니다.</p>
        ${linkHtml}
      </div>
    `));
    return;
  }
  const items = summary.lines.map(line => `<li>${escapeHtml(line)}</li>`).join('');
  container.appendChild(h(`
    <div class="ai-summary-card">
      <ul class="ai-summary-list">${items}</ul>
      <p class="ai-summary-meta">AI 요약 · ${escapeHtml(summary.model || '')} · ${formatDateTime(summary.generatedAt)}</p>
    </div>
  `));
}

// PARTICIPATION_COND_META — 조건 결과별 아이콘/색. PASS ✓ / REVIEW ! /
// FAIL ✕ / UNKNOWN ?. 근거 기반 판정이라 "왜"를 항상 함께 보여준다.
const PARTICIPATION_COND_META = {
  PASS:    { icon: '✓', cls: 'cond--pass' },
  REVIEW:  { icon: '!', cls: 'cond--review' },
  FAIL:    { icon: '✕', cls: 'cond--fail' },
  UNKNOWN: { icon: '?', cls: 'cond--unknown' },
};
const PARTICIPATION_GRADE_TONE = { ready: 'pj-grade--ready', needsReview: 'pj-grade--review', notRecommended: 'pj-grade--fail' };

// renderParticipationJudgment — 유료화 1단계(2026-08-09). 조건별
// PASS/REVIEW/FAIL/UNKNOWN 판정(participationJudgment)을 근거와 함께 보여준다.
// 입찰 공고 + 로그인 + 회사 프로필이 있을 때만 서버가 채워준다(없으면 null →
// 렌더 생략, 기존 AI 참여 분석만 노출). 긴 원문 근거는 기본으로 펼치지 않는다.
// renderParticipationJudgment — 조건별 판정 + (REVIEW 면허/인증에 한해) 사용자
// 질문형 해소 블록. opts.refetch가 있으면 답변 저장 후 판정을 다시 받아 이 컨테이너를
// 그 자리에서 재렌더한다(새로고침 없이 확인필요 개수 즉시 감소, §6/§7).
function renderParticipationJudgment(container, j, opts) {
  if (!container) return;
  opts = opts || {};
  container.innerHTML = '';
  if (!j || !j.conditions || !j.conditions.length) return;
  const tone = PARTICIPATION_GRADE_TONE[j.grade] || 'pj-grade--review';
  // "확인할 것 먼저" — 사용자가 해야 할 것(FAIL/REVIEW/UNKNOWN)을 위로, 자동확인된
  // PASS는 아래로 정렬한다(판정 로직/데이터는 그대로, 표시 순서만). 공고 상세·
  // 진행중 사업 상세 양쪽에 동일 적용.
  const COND_ORDER = { FAIL: 0, REVIEW: 1, UNKNOWN: 2, PASS: 3 };
  const sortedConds = j.conditions.slice().sort((a, b) => (COND_ORDER[a.result] ?? 4) - (COND_ORDER[b.result] ?? 4));
  const rows = sortedConds.map(c => {
    const meta = PARTICIPATION_COND_META[c.result] || PARTICIPATION_COND_META.UNKNOWN;
    const soft = c.severity === 'SOFT' ? '<span class="cond-soft">우대</span>' : '';
    const evidence = [c.requirementText ? `공고 요구: ${c.requirementText}` : '', c.companyEvidence ? `회사 보유: ${c.companyEvidence}` : '']
      .filter(Boolean).map(escapeHtml).join(' · ');
    return `
      <div class="cond-row ${meta.cls}">
        <span class="cond-icon">${meta.icon}</span>
        <div class="cond-body">
          <div class="cond-head-line"><strong>${escapeHtml(c.conditionType)}</strong>${soft}</div>
          <div class="cond-reason">${escapeHtml(c.reason || '')}</div>
          ${evidence ? `<div class="cond-evidence">${evidence}</div>` : ''}
        </div>
      </div>`;
  }).join('');
  // 사용자 질문형 해소(§2~§7): REVIEW 면허/인증 조건 중 "아직 회사 정보에 답이
  // 없는" 요구명(question.targets)만 짧은 Yes/No 질문으로 노출한다. 답변은 기존
  // 회사 프로필(면허·인증)에 저장돼 다음 공고에서도 재사용된다(§5/§9).
  const questions = [];
  j.conditions.forEach(c => {
    if (c.question && Array.isArray(c.question.targets)) {
      c.question.targets.forEach(name => questions.push({ kind: c.question.kind, category: c.question.category, name, condType: c.conditionType }));
    }
  });
  const kindWord = { license: '면허', certification: '인증' };
  // 목적격 조사: 마지막 글자 받침 유무로 을/를(면허→를, 인증→을).
  const objJosa = (w) => {
    const ch = (w || '').slice(-1).charCodeAt(0);
    if (ch >= 0xAC00 && ch <= 0xD7A3) return ((ch - 0xAC00) % 28) ? '을' : '를';
    return '을(를)';
  };
  const questionsHtml = questions.length ? `
    <div class="pj-questions">
      <div class="pj-questions-title">확인할 항목 ${questions.length}개 <span class="pj-questions-sub">— 답하면 판정이 자동으로 갱신됩니다</span></div>
      ${questions.map((q, i) => `
        <div class="pj-question" data-kind="${escapeAttr(q.kind)}" data-category="${escapeAttr(q.category)}" data-name="${escapeAttr(q.name)}">
          <div class="pj-question-req"><strong>${escapeHtml(q.condType)}</strong> — 공고에서 "${escapeHtml(q.name)}"을(를) 요구합니다.</div>
          <div class="pj-question-ask">회사에서 해당 ${escapeHtml(kindWord[q.kind] || '항목')}${objJosa(kindWord[q.kind] || '항목')} 보유하고 있나요?</div>
          <div class="pj-question-btns">
            <button type="button" class="pj-answer-btn pj-answer-btn--yes" data-answer="보유">보유</button>
            <button type="button" class="pj-answer-btn" data-answer="미보유">미보유</button>
            <button type="button" class="pj-answer-btn pj-answer-btn--skip" data-answer="모름">잘 모르겠음</button>
          </div>
        </div>
      `).join('')}
    </div>` : '';

  container.appendChild(h(`
    <div class="detail-card participation-judgment">
      <div class="pj-head">
        <span class="pj-grade ${tone}">${escapeHtml(j.gradeLabel || '')}</span>
        <span class="pj-summary">자동확인 ${j.passCount} · 확인필요 ${j.reviewCount} · 미충족 ${j.failCount} · 정보부족 ${j.unknownCount}</span>
      </div>
      <div class="cond-list">${rows}</div>
      ${questionsHtml}
      <p class="cond-caveat">지역·업종·기업규모·면허·인증·직접생산확인 기준 자동 판정입니다. 실적·재무 등 그 밖의 참가자격은 공고 원문을 함께 확인해주세요.</p>
    </div>
  `));

  // 질문 답변 배선. 보유/미보유는 기존 POST로 회사 프로필에 저장(§5) 후 판정을
  // 다시 받아 재렌더(§7). "잘 모르겠음"은 저장하지 않고 이 질문만 접는다(REVIEW 유지, §10).
  container.querySelectorAll('.pj-question').forEach(qEl => {
    qEl.querySelectorAll('.pj-answer-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const answer = btn.dataset.answer;
        if (answer === '모름') { qEl.remove(); return; }
        const kind = qEl.dataset.kind, category = qEl.dataset.category, name = qEl.dataset.name;
        qEl.querySelectorAll('.pj-answer-btn').forEach(b => b.disabled = true);
        const endpoint = kind === 'certification' ? '/api/me/certifications' : '/api/me/licenses';
        try {
          await apiRequest('POST', endpoint, { category, name, status: answer });
          showToast(answer === '보유' ? '보유로 저장했습니다 — 판정을 갱신합니다.' : '미보유로 저장했습니다.', 'success');
          if (opts.refetch) {
            const fresh = await opts.refetch();
            renderParticipationJudgment(container, fresh, opts); // 같은 자리 재렌더(확인필요 감소)
          } else {
            qEl.remove();
          }
        } catch (err) {
          qEl.querySelectorAll('.pj-answer-btn').forEach(b => b.disabled = false);
          if (err.code === 'owner_only') { showToast('면허·인증 등록은 대표 계정만 가능합니다.', 'error'); return; }
          if (err.status === 401) { location.hash = '#/auth/login'; return; }
          showToast(err.message || '저장에 실패했습니다.', 'error');
        }
      });
    });
  });
}

// 공고 상세 첫 화면에 자동으로 뜨는 "AI 참여 분석" — data.participationScore
// (handleGetNotice가 로그인+회사 프로필 기준으로 이미 계산해 응답에 포함)를
// 그대로 렌더링한다. 별도 버튼/클릭 없음 — 예전 "우리 회사 적합성 확인" 버튼은
// 이 섹션으로 통합되어 제거되었다. AI는 "가능/불가능"을 단정하지 않고
// "추천/확인 필요/비추천"으로만 표현한다(최종 결정은 사용자 몫).
function renderParticipationSection(container, score, confidenceTier) {
  if (!container) return;
  container.innerHTML = '';

  if (!currentUser) {
    container.appendChild(h(`
      <div class="ai-participation-card ai-participation-card--cta">
        <p class="ai-participation-cta-text">로그인하고 회사 정보를 등록하면 AI가 이 공고의 참여 가능성을 분석해 드립니다.</p>
        <a href="#/auth/login" class="home-cta-primary">로그인하고 확인하기</a>
      </div>
    `));
    return;
  }
  if (!score) {
    container.appendChild(h(`
      <div class="ai-participation-card ai-participation-card--cta">
        <p class="ai-participation-cta-text">회사 정보를 등록하면 AI가 이 공고의 참여 가능성을 분석해 드립니다.</p>
        <a href="#/me/company" class="home-cta-primary">회사 정보 등록하기</a>
      </div>
    `));
    return;
  }

  // 최종 판정과 조건별 결과는 renderParticipationJudgment(참여판정 조건 목록)에서 이미 1회 표시한다.
  // 여기서는 중복 없이 "다음 행동"(회사 정보 보완 → 판정 정확도 향상)만 보여준다(2026-08-12 IA 정리).
  const isPreciseJudgement = confidenceTier === 'precise';
  const hasCompanyGap = score.categories.some(c => c.result === 'insufficient_data' && c.dataGapSide === 'company');
  if (isPreciseJudgement && !hasCompanyGap) {
    return; // 더 채울 회사 정보가 없으면 안내를 띄우지 않는다(빈 CTA 제거)
  }
  const desc = !isPreciseJudgement
    ? '실적·면허·인증 정보를 등록하면 판정을 더 정확하게 할 수 있어요.'
    : '부족한 회사 정보를 등록하면 판정을 더 정확하게 할 수 있어요.';
  container.appendChild(h(`
    <div class="pj-next-action">
      <p class="pj-next-title">다음 행동</p>
      <p class="pj-next-desc">${desc}</p>
      <a href="#/me/company" class="btn btn-secondary btn-sm">회사 정보 등록</a>
    </div>
  `));
}

// renderChangeImpact — 공고에 가장 최근 생긴 변경(region/industry/
// budget_amount 중 참여 가능성에 실제로 영향을 주는 필드)이 우리 회사
// 참여 가능성을 어떻게 바꿨는지 보여준다. data.changeImpact는 해당하는
// 변경이 없거나(다른 필드만 바뀜) 비로그인/프로필 미등록이면 null이라
// 이 경우 섹션 자체를 렌더링하지 않는다(handleGetNotice가 이미 판단).
function renderChangeImpact(container, impact) {
  container.innerHTML = '';
  if (!impact) return;

  const beforeLabel = GRADE_LABELS[impact.before.grade] || impact.before.grade;
  const afterLabel = GRADE_LABELS[impact.after.grade] || impact.after.grade;
  const fieldsHtml = impact.changedFields.map(f => `<li>${escapeHtml(f.summary)}</li>`).join('');

  container.appendChild(h(`
    <div class="ai-participation-card change-impact-card ai-participation-card--${escapeHtml(impact.after.grade)}">
      <p class="ai-participation-subtitle">이번 변경이 우리 회사에 미치는 영향</p>
      <div class="change-impact-transition">
        ${gradeBadgeHtml(impact.before.grade, '변경 전: ' + beforeLabel)}
        <span class="change-impact-arrow">&rarr;</span>
        ${gradeBadgeHtml(impact.after.grade, '변경 후: ' + afterLabel)}
      </div>
      <ul class="change-impact-list">${fieldsHtml}</ul>
      ${impact.after.gradeReason ? `<p class="ai-grade-reason">${escapeHtml(impact.after.gradeReason)}</p>` : ''}
      <p class="ai-disclaimer">⚠ 등록된 회사 정보와 공고 정보만으로 계산한 참고용 분석입니다. 최종 참여 여부는 원문 공고를 직접 확인한 후 결정하세요.</p>
    </div>
  `));
}

// renderAwardHistory — "동일 발주기관 과거 낙찰 이력". count=0(수집기
// 미연동 또는 아직 수집된 이력이 없는 발주기관)이면 조용히 빈 상태
// 문구만 보여준다 — data.organizationAwardHistory가 애초에 null일 수도
// 있다(공고에 발주기관명 자체가 없는 경우).
// AWARD_HISTORY_MIN_SAMPLE — 2026-08-06, "데이터가 적은 초기 플랫폼"
// 원칙(과장 금지, 표본 부족은 정직하게 표시) 적용. 운영 데이터 실측
// 결과 발주기관 172곳 중 5건 이상은 4곳뿐이라(70%가 1건짜리) 이 기준
// 미만이면 평균/추이 같은 "통계"를 아예 안 보여주고 부족 안내만 준다.
const AWARD_HISTORY_MIN_SAMPLE = 5;

function renderAwardHistory(container, history, hasCompetitiveOverlap) {
  if (!container) return;
  container.innerHTML = '';
  if (!history || history.count === 0) {
    container.appendChild(h('<p class="section-empty">확인된 낙찰 데이터가 없습니다.</p>'));
    return;
  }

  // "원천데이터 표시"와 "통계분석 최소표본"을 분리한다(2026-08-11 Phase 1).
  // 개별 낙찰건(items)은 1건이라도 그대로 보여주고, 평균·빈도·추이 같은 통계
  // 분석만 최소표본(AWARD_HISTORY_MIN_SAMPLE) 이상일 때 붙인다. 1건 있는데
  // "부족"으로 전부 숨기던 기존 gate 제거. backend/DTO는 변경하지 않는다.
  const enoughForStats = history.count >= AWARD_HISTORY_MIN_SAMPLE;
  const rows = (history.items || []).map(it => `
    <tr>
      <td>${escapeHtml(it.title || '-')}</td>
      <td>${escapeHtml(it.winnerName || '-')}</td>
      <td class="mono">${it.awardAmount != null ? formatBudget(it.awardAmount) : '-'}</td>
      <td class="mono">${it.awardRate != null ? it.awardRate.toFixed(1) + '%' : '-'}</td>
      <td class="mono">${it.participantCount != null ? it.participantCount + '개사' : '-'}</td>
      <td class="mono">${escapeHtml(it.openedAt || '-')}</td>
    </tr>
  `).join('');

  const itemsTable = `
    <p class="detail-group-title">확인된 낙찰정보 ${history.count}건${history.items && history.items.length < history.count ? ` <span class="detail-sub">(최근 ${history.items.length}건 표시)</span>` : ''}</p>
    <div class="table-scroll"><table>
      <thead><tr><th>공고명</th><th>낙찰자</th><th>낙찰금액</th><th>낙찰률</th><th>참가업체수</th><th>개찰일</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;

  // 표본이 최소기준 미만이면 통계 없이 개별건 + "더 필요" 안내만.
  if (!enoughForStats) {
    container.appendChild(h(`
      ${itemsTable}
      <p class="section-empty">비교 분석(평균 낙찰률·경쟁 강도 등)에는 데이터가 더 필요합니다 — 현재 ${history.count}건 / 권장 ${AWARD_HISTORY_MIN_SAMPLE}건 이상.</p>
    `));
    return;
  }

  // ── 여기부터는 표본 충분(통계 분석) ──
  const avgParts = [];
  avgParts.push(history.averageRate != null
    ? `평균 낙찰률 ${history.averageRate.toFixed(1)}% (표본 ${history.count}건 기준, 신뢰도 참고용)`
    : '평균 낙찰률 정보 없음');
  if (history.averageParticipants != null) avgParts.push(`평균 참가업체 수 ${history.averageParticipants.toFixed(1)}개사`);
  const overlapNote = hasCompetitiveOverlap
    ? '<p class="ai-minimal-profile-notice">우리 회사의 수행실적과 겹치는 발주기관·분야입니다 — 경쟁 강도 참고.</p>'
    : '';

  // 자주 낙찰받는 업체 — 경쟁사 파악용. 1건짜리만 있으면(다들 한 번씩만
  // 이겼다는 뜻) "반복 낙찰"이라는 정보 자체가 없는 것이므로 표시하지 않는다.
  const repeatWinners = (history.frequentWinners || []).filter(w => w.winCount >= 2);
  const frequentWinnersHtml = repeatWinners.length
    ? `
      <p class="growth-chart-title">자주 낙찰받는 업체</p>
      <div class="license-toolbar">
        ${repeatWinners.map(w => `<span class="badge badge--gray">${escapeHtml(w.name)} ${w.winCount}건</span>`).join('')}
      </div>
    `
    : '';

  // 낙찰률 추이 — 성장분석 페이지와 동일 기준(2건 미만이면 그래프 대신
  // 문구, simpleLineChartHtml 재사용).
  const trend = history.rateTrend || [];
  let trendHtml = '';
  if (trend.length >= 2) {
    const labels = trend.map(t => t.date.slice(5));
    const chart = simpleLineChartHtml(labels, [{ colorVar: '--accent-blue', values: trend.map(t => t.rate) }], null);
    trendHtml = `
      <p class="growth-chart-title">낙찰률 추이(최근 ${trend.length}건, 오래된순)</p>
      ${chart}

  `));
}

// 필수 입력 -> 저장 즉시 홈(추천 리스트)으로 이동. 나머지 상세 프로필
// (면허/인증/재무/실적/인력)은 여기서 다루지 않고 "회사 정보" 화면의
// 완성도 카드에서 나중에 채우도록 유도한다(#/me/saved-searches은 그대로 유지).
// pendingInviteToken — 로그인/가입 전에 팀 초대 링크(#/invite?token=...)로
// 들어온 경우 그 토큰을 잠깐 담아둔다. 가입/로그인 성공 직후 이 값이
// 있으면 자동으로 초대를 수락한다("받은 사람이 가입/로그인하면 자동
// 합류" 스펙) — 가입이면 회사 정보 등록(2단계)도 건너뛴다(이미 있는
// 회사에 합류하는 것이지 새로 만드는 게 아니므로).
let pendingInviteToken = null;

async function acceptPendingInviteIfAny() {
  if (!pendingInviteToken) return;
  const token = pendingInviteToken;
  pendingInviteToken = null;
  try {
    await apiRequest('POST', '/api/invitations/' + encodeURIComponent(token) + '/accept', {});
    await loadMe();
  } catch (err) {
    // 실패해도(예: 자리 다 참, 이메일 불일치) 로그인/가입 자체는 이미
    // 성공했으니 홈으로는 보낸다 — 에러는 콘솔에만 남긴다.
    console.error('초대 자동 수락 실패:', err.message);
  }
}

// formatPhoneNumber — 서비스 전체 전화번호 입력 공용 포맷터(2026-08-04
// 전수 적용). 세 갈래로 나뉜다:
//  - 010: 항상 11자리(3-4-4: 010-1234-5678) — 프리픽스만으로 확정 가능.
//  - 011/016/017/018/019(구 통신사 번호): 항상 10자리(3-3-4: 011-123-4567)
//    — 이 두 모바일 분기는 기존 formatMobilePhoneInput과 동일한 로직을
//    그대로 유지한다(이미 검증된 동작, 새로 만들지 않음).
//  - 그 외(서울 02, 031~064 등 지역번호, 070 인터넷전화 등): 지역번호
//    뒤 나머지가 7자리(구형, 10자리 총합)일지 8자리(신형, 11자리 총합)일지
//    타이핑 도중엔 알 수 없다 — 항상 "마지막 4자리"를 고정하고 그 앞을
//    중간 그룹으로 삼는 가변형으로 처리(자릿수가 늘어날수록 중간 그룹이
//    자연스럽게 늘어나 최종적으로 3-3-4 또는 3-4-4/2-3-4 또는 2-4-4로
//    수렴한다).
function formatPhoneNumber(raw) {
  const allDigits = (raw || '').replace(/\D/g, '');
  if (allDigits.slice(0, 3) === '010') {
    const digits = allDigits.slice(0, 11);
    if (digits.length <= 3) return digits;
    if (digits.length <= 7) return `${digits.slice(0, 3)}-${digits.slice(3)}`;
    return `${digits.slice(0, 3)}-${digits.slice(3, 7)}-${digits.slice(7)}`;
  }
  if (/^01[16789]/.test(allDigits)) {
    const digits = allDigits.slice(0, 10);
    if (digits.length <= 3) return digits;
    if (digits.length <= 6) return `${digits.slice(0, 3)}-${digits.slice(3)}`;
    return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6)}`;
  }
  const digits = allDigits.slice(0, 11);
  const areaLen = digits.startsWith('02') ? 2 : 3;
  if (digits.length <= areaLen) return digits;
  const rest = digits.slice(areaLen);
  if (rest.length <= 4) return `${digits.slice(0, areaLen)}-${rest}`;
  const tail = rest.slice(-4);
  const middle = rest.slice(0, rest.length - 4);
  return `${digits.slice(0, areaLen)}-${middle}-${tail}`;
}

// attachPhoneAutoFormat — 위 포맷터를 input에 연결. 값을 통째로 다시
// 쓰는 단순한 방식이라 문자열 중간을 수정할 때 커서가 끝으로 이동할 수
// 있다 — 이 프로젝트의 다른 입력 처리도 커서 위치를 따로 관리하지 않는
// 것과 같은 수준의 단순함을 유지한 것(대부분 끝에서부터 이어 입력하는
// 전화번호 입력 특성상 실사용에 지장은 적다).
function attachPhoneAutoFormat(input) {
  if (!input) return;
  input.addEventListener('input', () => {
    input.value = formatPhoneNumber(input.value);
  });
}

// formatBusinessRegistrationNumber/attachBusinessRegistrationNumberAutoFormat
// — 사업자등록번호(000-00-00000, 3-2-5 고정 10자리) 자동 하이픈. 채팅형
// 온보딩(2026-08-05)의 "직접 기재" 경로에서 신규로 씀 — formatPhoneNumber와

// 분기가 필요 없다.

  if (digits.length <= 3) return digits;

  return `${digits.slice(0, 3)}-${digits.slice(3, 5)}-${digits.slice(5)}`;
}

// formatCurrency — 금액 입력/표시 공용 천단위 쉼표 포맷터(2026-08-04
// 전수 적용). 숫자든 이미 쉼표가 섞인 문자열이든 숫자 아닌 문자를 전부
// 제거한 뒤 다시 그룹핑한다 — "원" 접미사는 안 붙인다(호출부가 필요하면
// 직접 붙임, 기존 formatBudget/fmtMoney처럼 접미사가 필요 없는 입력창
// 표시에도 그대로 재사용할 수 있게).
// 영업이익/당기순이익처럼 손실(음수)이 실제로 존재하는 필드가 있어
// 맨 앞의 "-"는 살려둔다(그 외 문자는 전부 제거) — 나머지 자릿수만
// 쉼표로 묶는다.
function formatCurrency(n) {
  if (n === null || n === undefined || n === '') return '';
  const str = String(n).trim();
  const negative = str.charAt(0) === '-';
  const digits = str.replace(/[^\d]/g, '');
  if (!digits) return negative ? '-' : '';
  return (negative ? '-' : '') + Number(digits).toLocaleString('ko-KR');
}

// parseCurrencyInput — formatCurrency로 화면에 쉼표가 붙은 값을 저장
// 직전에 순수 숫자 문자열로 되돌린다(부호는 유지). 빈 값은 null(선택
// 입력 필드가 비어있는 상태와 "0원"을 구분하기 위해 빈 문자열이 아니라
// null로 통일).
function parseCurrencyInput(v) {
  if (v === null || v === undefined) return null;
  const str = String(v).trim();
  const negative = str.charAt(0) === '-';
  const digits = str.replace(/[^\d]/g, '');
  return digits === '' ? null : (negative ? '-' : '') + digits;
}

// computeBusinessAgeYears — 2026-08-05. 업력을 구간select로 직접 묻는 대신
// 개업일(사업자등록증 OCR 추출 또는 직접 기재)로부터 역산한다 —
// company_profiles.business_age_years는 NUMERIC(4,1)이라 소수점 첫째
// 자리까지 정밀하게 저장 가능(기존 구간 대표값 저장 방식의 근본 원인
// 제거). 미래 날짜/파싱 불가는 null(호출부가 에러 처리).
function computeBusinessAgeYears(dateStr) {
  if (!dateStr) return null;
  const founding = new Date(dateStr + 'T00:00:00');
  if (isNaN(founding.getTime())) return null;
  const days = (Date.now() - founding.getTime()) / 86400000;
  if (days < 0) return null;
  return Math.round((days / 365.25) * 10) / 10;
}

// attachCurrencyAutoFormat — 타이핑 중 실시간으로 쉼표를 삽입하되, 커서가
// 항상 "지나온 숫자 개수" 기준으로 같은 자리에 남도록 재계산한다(쉼표
// 자체는 세지 않음 — 그래야 중간에 숫자를 넣거나 지워도 커서가 엉뚱한
// 곳으로 튀지 않는다).
function attachCurrencyAutoFormat(input) {
  if (!input) return;
  input.addEventListener('input', () => {
    const prevValue = input.value;
    const prevCursor = input.selectionStart == null ? prevValue.length : input.selectionStart;
    const digitsBeforeCursor = prevValue.slice(0, prevCursor).replace(/[^\d]/g, '').length;
    const formatted = formatCurrency(prevValue);
    input.value = formatted;
    if (digitsBeforeCursor === 0) {
      input.setSelectionRange(0, 0);
      return;
    }
    let seen = 0;
    let pos = formatted.length;
    for (let i = 0; i < formatted.length; i++) {
      if (/\d/.test(formatted[i])) {
        seen += 1;
        if (seen === digitsBeforeCursor) { pos = i + 1; break; }
      }
    }
    input.setSelectionRange(pos, pos);
  });
}

// setupPhoneOtpVerification — otpPhoneFieldHtml이 그려낸 블록에 발송/
// 검증 동작을 연결한다. onChange(verified)로 인증 상태 변화를 호출부에
// 알려 제출 버튼 활성화 로직이 반응할 수 있게 한다. 전화번호를 고치면
// 인증 상태를 초기화한다(서버도 정확히 그 번호로만 인증 여부를 확인하므로
// 자연히 다시 인증해야 하지만, 프론트에서도 미리 알려주는 게 자연스럽다).
function setupPhoneOtpVerification(form, onChange) {
  const phoneInput = form.phoneNumber;
  const sendBtn = form.querySelector('#otp-send-btn');
  const codeRow = form.querySelector('#otp-code-row');
  const codeInput = form.querySelector('#otp-code-input');
  const verifyBtn = form.querySelector('#otp-verify-btn');
  const statusEl = form.querySelector('#otp-status');
  let verified = false;
  let cooldownTimer = null;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || 'license-card-meta';
  }
  function setVerified(v) {
    verified = v;
    if (onChange) onChange(v);
  }
  function startCooldown() {
    let remaining = 60;
    sendBtn.disabled = true;
    sendBtn.textContent = `재발송 (${remaining}초)`;
    clearInterval(cooldownTimer);
    cooldownTimer = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(cooldownTimer);
        sendBtn.disabled = false;
        sendBtn.textContent = '인증번호 재발송';
      } else {
        sendBtn.textContent = `재발송 (${remaining}초)`;
      }
    }, 1000);
  }

  sendBtn.addEventListener('click', async () => {
    if (!phoneInput.checkValidity()) {
      phoneInput.reportValidity();
      return;
    }
    setVerified(false);
    sendBtn.disabled = true;
    setStatus('전송 중...');
    try {
      await apiRequest('POST', '/api/auth/phone/send-code', { phoneNumber: phoneInput.value });
      codeRow.style.display = 'flex';
      codeInput.value = '';
      codeInput.focus();
      setStatus('인증번호를 보냈습니다. 5분 이내에 입력해주세요.');
      startCooldown();
    } catch (err) {
      sendBtn.disabled = false;
      setStatus(err.message, 'error');
    }
  });

  verifyBtn.addEventListener('click', async () => {
    const code = codeInput.value.trim();
    if (!code) return;
    verifyBtn.disabled = true;
    try {
      await apiRequest('POST', '/api/auth/phone/verify-code', { phoneNumber: phoneInput.value, code });
      setVerified(true);
      setStatus('✓ 인증 완료', 'success');
      clearInterval(cooldownTimer);
      sendBtn.disabled = true;
      sendBtn.textContent = '인증 완료';
    } catch (err) {
      verifyBtn.disabled = false;
      setStatus(err.message, 'error');
    }
  });

  phoneInput.addEventListener('input', () => {
    if (verified) {
      setVerified(false);
      setStatus('');
      codeRow.style.display = 'none';
      sendBtn.disabled = false;
      sendBtn.textContent = '인증번호 받기';
    }
  });

  return { isVerified: () => verified };
}

// renderSignup — 회원가입 화면(이메일 가입 전용). 2026-08-03 온보딩
// 재설계 이후로는 이 한 화면이 이메일 가입의 전부다(예전엔 계정정보→
// 업체정보 2단계였으나, 업체정보 입력을 가입에서 완전히 분리하면서
// 단일 화면으로 합쳤다) — 휴대폰번호 인증까지 마치고 "회원가입"을
// 누르면 그 즉시 POST /api/auth/signup 한 번으로 계정 생성+휴대폰
// 인증기록+약관동의가 전부 처리된다. 소셜 로그인 가입자는 이 화면을
// 거치지 않는다(renderOAuthProfileStep 참고 — 소셜 로그인 콜백이
// 계정을 이미 만들어버려서 별도의 로그인 후 온보딩 화면이 필요하다).
// 2026-08-04: 관리자가 휴대폰 인증을 껐을 수 있어(system_settings.
// phone_verification_required) GET /api/auth/config를 먼저 읽고서야
// 폼을 그린다 — async로 바뀐 이유. 이메일 가입은 이제부터 필수 이메일
// 인증도 거친다(계정은 즉시 생성되지만, 인증 전엔 route()가
// #/auth/verify-email-pending으로 돌려보낸다 — email_verification.go 참고).
async function renderSignup(container) {
  document.body.classList.add('is-auth');
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));
  let phoneVerificationRequired = true;
  try {
    const cfg = await apiRequest('GET', '/api/auth/config');
    phoneVerificationRequired = cfg.phoneVerificationRequired;
  } catch (err) {
    // 조회 실패 시 기존 동작(휴대폰 인증 필수)으로 안전하게 폴백.
  }

  container.innerHTML = '';
  container.appendChild(h(`
    <div class="auth-card">
      <a href="#/" class="auth-page-logo brand-name-text">${escapeHtml(currentBrandName)}</a>
      <h2>회원가입</h2>
      <form id="signup-form" class="auth-form">
        <label><span>이메일<span class="required-mark">*</span></span><input type="email" name="email" required></label>
        ${phoneVerificationRequired ? otpPhoneFieldHtml('') : plainPhoneFieldHtml('')}
        <label><span>비밀번호 (최소 8자)<span class="required-mark">*</span></span><input type="password" name="password" minlength="8" required></label>
        <label><span>비밀번호 확인<span class="required-mark">*</span></span><input type="password" name="passwordConfirm" minlength="8" required></label>
        <div class="field-group">
          <label class="checkbox-label"><input type="checkbox" id="signup-terms-agree" required> 이용약관에 동의합니다 (필수) <a href="#/terms" target="_blank" rel="noopener">보기</a></label>
          <label class="checkbox-label"><input type="checkbox" id="signup-privacy-agree" required> 개인정보 수집 및 이용에 동의합니다 (필수) <a href="#/privacy" target="_blank" rel="noopener">보기</a></label>
        </div>
        <div id="signup-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-block" id="signup-submit-btn" disabled>회원가입</button>
      </form>
      ${oauthButtonsHtml()}
      <p class="auth-switch">이미 계정이 있으신가요? <a href="#/auth/login">로그인</a></p>
    </div>
  `));
  const form = document.getElementById('signup-form');
  attachPhoneAutoFormat(form.phoneNumber);
  const errorBox = document.getElementById('signup-error');
  const submitBtn = document.getElementById('signup-submit-btn');
  const termsCheckbox = document.getElementById('signup-terms-agree');
  const privacyCheckbox = document.getElementById('signup-privacy-agree');

  let phoneVerified = !phoneVerificationRequired;
  function updateSubmitEnabled() {
    submitBtn.disabled = !(form.checkValidity() && phoneVerified);
  }
  if (phoneVerificationRequired) {
    setupPhoneOtpVerification(form, (verified) => { phoneVerified = verified; updateSubmitEnabled(); });
  }
  form.addEventListener('input', updateSubmitEnabled);
  form.addEventListener('change', updateSubmitEnabled);
  updateSubmitEnabled();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    if (fd.get('password') !== fd.get('passwordConfirm')) {
      errorBox.textContent = '비밀번호가 일치하지 않습니다.';
      errorBox.style.display = 'block';
      return;
    }
    try {
      const data = await apiRequest('POST', '/api/auth/signup', {
        email: fd.get('email'),
        password: fd.get('password'),
        phoneNumber: fd.get('phoneNumber'),
        termsAgreed: termsCheckbox.checked,
        privacyAgreed: privacyCheckbox.checked,
      });
      currentUser = {
        id: data.id, email: data.email, role: 'user', plan: 'free',
        phoneVerified: phoneVerificationRequired, emailVerified: false, onboarded: true,
      };
      currentProfile = null;
      renderHeader();
      if (pendingInviteToken) {
        await acceptPendingInviteIfAny();
      }
      location.hash = '#/dashboard';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// renderOAuthOnboardingStep — 소셜 로그인(구글/네이버/카카오) 가입자
// 전용 온보딩 화면(#/auth/oauth-profile). 소셜 로그인 콜백(oauth_login.go)
// 이 계정을 이미 만들어버려서 이메일 가입처럼 "계정 생성 시점에 함께"
// 처리할 수 없다 — 로그인 이후 이 화면에서 휴대폰번호 인증(+약관동의)만
// 별도로 받는다. 업체정보는 여기서도 받지 않는다(회원가입/온보딩과
// 완전히 분리 — 사업자등록증 온보딩이나 이후 "기업 프로필 수정" 화면에서
// 언제든 입력 가능).
async function renderOAuthOnboardingStep(container) {
  document.body.classList.add('is-auth');
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));
  let phoneVerificationRequired = true;
  try {
    const cfg = await apiRequest('GET', '/api/auth/config');
    phoneVerificationRequired = cfg.phoneVerificationRequired;
  } catch (err) {
    // 조회 실패 시 기존 동작(휴대폰 인증 필수)으로 안전하게 폴백.
  }

  container.innerHTML = '';
  container.appendChild(h(`
    <div class="auth-card">
      <h2>${phoneVerificationRequired ? '휴대폰번호 인증' : '약관 동의'}</h2>
      <p class="auth-step-hint">${phoneVerificationRequired ? '서비스 이용을 위해 휴대폰번호 인증이 필요합니다.' : '서비스 이용을 위해 약관 동의가 필요합니다.'} 확인을 마치면 이어서 사업자등록증을 등록하게 됩니다.</p>
      <form id="oauth-onboarding-form" class="auth-form">
        ${phoneVerificationRequired ? otpPhoneFieldHtml('') : plainPhoneFieldHtml('')}
        <div class="field-group">
          <label class="checkbox-label"><input type="checkbox" id="signup-terms-agree" required> 이용약관에 동의합니다 (필수) <a href="#/terms" target="_blank" rel="noopener">보기</a></label>
          <label class="checkbox-label"><input type="checkbox" id="signup-privacy-agree" required> 개인정보 수집 및 이용에 동의합니다 (필수) <a href="#/privacy" target="_blank" rel="noopener">보기</a></label>
        </div>
        <div id="oauth-onboarding-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-block" id="oauth-onboarding-submit-btn" disabled>확인</button>
      </form>
    </div>
  `));
  const form = document.getElementById('oauth-onboarding-form');
  attachPhoneAutoFormat(form.phoneNumber);
  const errorBox = document.getElementById('oauth-onboarding-error');
  const submitBtn = document.getElementById('oauth-onboarding-submit-btn');
  const termsCheckbox = document.getElementById('signup-terms-agree');
  const privacyCheckbox = document.getElementById('signup-privacy-agree');

  let phoneVerified = !phoneVerificationRequired;
  function updateSubmitEnabled() {
    submitBtn.disabled = !(form.checkValidity() && phoneVerified);
  }
  if (phoneVerificationRequired) {
    setupPhoneOtpVerification(form, (verified) => { phoneVerified = verified; updateSubmitEnabled(); });
  }
  form.addEventListener('input', updateSubmitEnabled);
  form.addEventListener('change', updateSubmitEnabled);
  updateSubmitEnabled();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    try {
      await apiRequest('POST', '/api/me/signup-agreement', {
        phoneNumber: fd.get('phoneNumber'),
        termsAgreed: termsCheckbox.checked,
        privacyAgreed: privacyCheckbox.checked,
      });
      currentUser.phoneVerified = phoneVerificationRequired;
      currentUser.onboarded = true;
      location.hash = '#/dashboard';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// renderOAuthProfileStep — 소셜 로그인(구글/네이버/카카오)으로 새로
// 가입했거나, 예전에 이메일/비번으로 가입만 하고 휴대폰 인증을 안 끝낸
// 계정을 위한 진입점. 서버(oauth_login.go)가 이미 세션 쿠키를 발급한
// 뒤 #/auth/oauth-profile로 리다이렉트하므로, 여기서는 loadMe()로
// currentUser만 채우고 나면 renderOAuthOnboardingStep을 그려 휴대폰
// 인증을 받는다.
async function renderOAuthProfileStep(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));
  await loadMe();
  if (!currentUser) { location.hash = '#/auth/login'; return; }
  await renderOAuthOnboardingStep(container);
}

function renderLogin(container) {
  document.body.classList.add('is-auth');
  container.innerHTML = '';
  // 소셜 로그인 콜백 실패 시 서버가 #/auth/login?oauthError=1로 돌려보낸다
  // (oauth_login.go의 oauthFailureRedirect) — state 위조 시도든 provider
  // 쪽 일시적 오류든 원인을 구분해 보여줄 방법이 없어(사용자에게 원인
  // 상세를 노출할 필요도 없고) 안내 문구 하나로 통일.
  const oauthFailed = location.hash.split('?')[1] === 'oauthError=1';
  container.appendChild(h(`
    <div class="auth-card">
      <a href="#/" class="auth-page-logo brand-name-text">${escapeHtml(currentBrandName)}</a>
      <h2>로그인</h2>
      ${oauthFailed ? '<div class="oauth-error-banner">간편 로그인에 실패했습니다. 다시 시도해주세요.</div>' : ''}
      <form id="login-form" class="auth-form">
        <label>이메일<input type="email" name="email" required></label>
        <label>비밀번호<input type="password" name="password" required></label>
        <div id="login-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
      </form>
      ${oauthButtonsHtml()}
      <p class="auth-switch"><a href="#/auth/find-account">아이디/비밀번호 찾기</a></p>
      <p class="auth-switch">계정이 없으신가요? <a href="#/auth/signup">회원가입</a></p>
    </div>
  `));
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('login-error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    try {
      const data = await apiRequest('POST', '/api/auth/login', {
        email: fd.get('email'), password: fd.get('password'),
      });
      currentUser = { id: data.id, email: data.email };
      renderHeader();
      await loadMe();
      await acceptPendingInviteIfAny();
      location.hash = '#/dashboard';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// renderFindAccount — #/auth/find-account. "아이디/비밀번호 찾기" 단일
// 화면에 이메일(아이디) 찾기/비밀번호 찾기 두 탭을 함께 둔다(요청사항
// [2][3], 2026-08-04). 이메일 찾기는 계정 존재 여부 자체가 결과에
// 드러나는 게 기능 스펙이라(find_email.go) 성공/실패를 그대로 보여주고,
// 비밀번호 찾기는 서버가 항상 동일한 200 응답을 주므로(anti-enumeration,
// password_reset.go) 여기서도 성공 문구 하나로 통일해서 보여준다.
function renderFindAccount(container) {
  document.body.classList.add('is-auth');
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="auth-card">
      <a href="#/" class="auth-page-logo brand-name-text">${escapeHtml(currentBrandName)}</a>
      <h2>아이디/비밀번호 찾기</h2>
      <div class="profile-tabs">
        <button type="button" class="profile-tab-btn is-active" data-tab="find-email">이메일(아이디) 찾기</button>
        <button type="button" class="profile-tab-btn" data-tab="reset-password">비밀번호 찾기</button>
      </div>
      <div id="find-email-panel">
        <p class="auth-step-hint">가입 시 등록한 휴대폰번호를 입력해주세요. 본인 확인을 위해 등록된 연락처로 인증 후 표시합니다.</p>
        <form id="find-email-form" class="auth-form">
          <label>휴대폰번호<input type="tel" name="phoneNumber" placeholder="010-1234-5678" required></label>
          <div id="find-email-error" class="error" style="display:none"></div>
          <p id="find-email-result" class="success" style="display:none"></p>
          <button type="submit" class="btn btn-primary btn-block">이메일 찾기</button>
        </form>
      </div>
      <div id="reset-password-panel" style="display:none">
        <p class="auth-step-hint">가입 시 등록한 이메일을 입력하면 비밀번호 재설정 링크를 보내드립니다.</p>
        <form id="reset-password-request-form" class="auth-form">
          <label>이메일<input type="email" name="email" required></label>
          <div id="reset-password-request-error" class="error" style="display:none"></div>
          <p id="reset-password-request-result" class="success" style="display:none"></p>
          <button type="submit" class="btn btn-primary btn-block">재설정 링크 받기</button>
        </form>
      </div>
      <p class="auth-switch"><a href="#/auth/login">로그인으로 돌아가기</a></p>
    </div>
  `));

  const findEmailPanel = document.getElementById('find-email-panel');
  const resetPasswordPanel = document.getElementById('reset-password-panel');
  container.querySelectorAll('.profile-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.profile-tab-btn').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      const isFindEmail = btn.dataset.tab === 'find-email';
      findEmailPanel.style.display = isFindEmail ? '' : 'none';
      resetPasswordPanel.style.display = isFindEmail ? 'none' : '';
    });
  });

  const findEmailForm = document.getElementById('find-email-form');
  attachPhoneAutoFormat(findEmailForm.phoneNumber);
  const findEmailErrorBox = document.getElementById('find-email-error');
  const findEmailResultBox = document.getElementById('find-email-result');
  findEmailForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    findEmailErrorBox.style.display = 'none';
    findEmailResultBox.style.display = 'none';
    const fd = new FormData(findEmailForm);
    try {
      const data = await apiRequest('POST', '/api/auth/find-email', { phoneNumber: fd.get('phoneNumber') });
      findEmailResultBox.textContent = `가입하신 이메일은 ${data.email} 입니다.`;
      findEmailResultBox.style.display = 'block';
    } catch (err) {
      findEmailErrorBox.textContent = err.message;
      findEmailErrorBox.style.display = 'block';
    }
  });

  const resetForm = document.getElementById('reset-password-request-form');
  const resetErrorBox = document.getElementById('reset-password-request-error');
  const resetResultBox = document.getElementById('reset-password-request-result');
  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    resetErrorBox.style.display = 'none';
    resetResultBox.style.display = 'none';
    const fd = new FormData(resetForm);
    try {
      await apiRequest('POST', '/api/auth/reset-password-request', { email: fd.get('email') });
      resetResultBox.textContent = '입력하신 이메일로 비밀번호 재설정 링크를 발송했습니다. (가입 시 비밀번호를 설정하지 않은 소셜 로그인 전용 계정이거나 등록되지 않은 이메일이라면 메일이 오지 않을 수 있습니다)';
      resetResultBox.style.display = 'block';
      resetForm.reset();
    } catch (err) {
      resetErrorBox.textContent = err.message;
      resetErrorBox.style.display = 'block';
    }
  });
}

// renderResetPassword — #/auth/reset-password?token=... 비밀번호 찾기
// 이메일의 링크로 도달하는 화면(로그인 여부와 무관하게 접근 가능해야
// 해서 PUBLIC_ROUTES에 등록돼있다). successBox를 form 밖에 둬서, 성공 시
// form 자체를 숨겨도 완료 메시지는 계속 보이게 한다.
function renderResetPassword(container) {
  document.body.classList.add('is-auth');
  container.innerHTML = '';
  const query = new URLSearchParams(location.hash.split('?')[1] || '');
  const token = query.get('token') || '';
  container.appendChild(h(`
    <div class="auth-card">
      <a href="#/" class="auth-page-logo brand-name-text">${escapeHtml(currentBrandName)}</a>
      <h2>새 비밀번호 설정</h2>
      ${token ? '' : '<div class="oauth-error-banner">유효하지 않은 링크입니다. 비밀번호 찾기를 다시 요청해주세요.</div>'}
      <form id="reset-password-form" class="auth-form">
        <label>새 비밀번호 (최소 8자)<input type="password" name="password" minlength="8" required></label>
        <label>비밀번호 확인<input type="password" name="passwordConfirm" minlength="8" required></label>
        <div id="reset-password-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-block" ${token ? '' : 'disabled'}>비밀번호 변경</button>
      </form>
      <p id="reset-password-success" class="success" style="display:none"></p>
      <p class="auth-switch"><a href="#/auth/login">로그인으로 돌아가기</a></p>
    </div>
  `));
  const form = document.getElementById('reset-password-form');
  const errorBox = document.getElementById('reset-password-error');
  const successBox = document.getElementById('reset-password-success');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!token) return;
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    if (fd.get('password') !== fd.get('passwordConfirm')) {
      errorBox.textContent = '비밀번호가 일치하지 않습니다.';
      errorBox.style.display = 'block';
      return;
    }
    try {
      await apiRequest('POST', '/api/auth/reset-password', { token, password: fd.get('password') });
      form.style.display = 'none';
      successBox.textContent = '비밀번호가 변경되었습니다. 새 비밀번호로 로그인해주세요.';
      successBox.style.display = 'block';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// renderEmailVerifyPending — #/auth/verify-email-pending. 이메일 가입
// 필수 이메일 인증(2026-08-04, email_verification.go)이 끝나기 전까지
// route()의 게이트가 로그인된(그러나 미인증) 사용자를 강제로 이 화면에
// 붙잡아둔다. 소셜 로그인 사용자는 애초에 emailVerified가 true라 이
// 화면에 올 일이 없다.
function renderEmailVerifyPending(container) {
  document.body.classList.add('is-auth');
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="auth-card">
      <a href="#/" class="auth-page-logo brand-name-text">${escapeHtml(currentBrandName)}</a>
      <h2>이메일 인증 대기</h2>

// ---------- 웹 푸시(Phase 6) ----------
// urlBase64ToUint8Array — PushManager.subscribe()의 applicationServerKey는
// Uint8Array를 요구하는데 서버는 base64url 문자열로 공개키를 내려주므로
// (webpush-go 관례) 표준 변환 보일러플레이트가 필요하다.
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

// isIOSInstallNeeded — iOS Safari는 16.4+에서도 "홈 화면에 추가"로 설치된
// PWA 안에서만 웹 푸시가 동작한다(요구사항 확정 사항). standalone 모드가
// 아니면 구독 시도 자체가 의미 없으므로 안내만 보여준다.
function isIOSInstallNeeded() {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  return isIOS && !isStandalone;
}

async function renderPushBanner(container) {
  if (!container) return;
  if (isIOSInstallNeeded()) {
    container.innerHTML = `
      <div class="pipeline-filter-banner">
        <span>iOS에서 알림을 받으려면 먼저 홈 화면에 추가하세요 — 공유 아이콘 → "홈 화면에 추가"</span>
      </div>
    `;
    return;
  }
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;

  let registration, subscription;
  try {
    registration = await navigator.serviceWorker.ready;
    subscription = await registration.pushManager.getSubscription();
  } catch (e) {
    // 2026-08-06: 예전엔 여기서 그냥 조용히 return해서 배너 자체가
    // 흔적도 없이 사라졌다 — "알림 받기 배너가 안 보인다"는 신고를
    // 받고서야 원인을 알 방법이 없다는 걸 알게 됨. 콘솔 로그 + 최소한의
    // 화면 안내를 남겨서 다음엔 바로 원인이 보이게 한다.
    console.error('push banner: registration/getSubscription failed', e);
    container.innerHTML = `
      <div class="pipeline-filter-banner">
        <span class="error">알림 상태를 확인하지 못했습니다(${escapeHtml(e && e.message || String(e))}). 페이지를 새로고침해보시고, 계속되면 브라우저 콘솔(F12)의 에러 메시지를 알려주세요.</span>
      </div>
    `;
    return;
  }

  const subscribed = !!subscription;
  container.innerHTML = `
    <div class="pipeline-filter-banner">
      <span>${subscribed ? '이 기기에서 알림이 켜져 있습니다.' : '이 기기에서도 알림을 받아보세요.'}</span>
      <button type="button" class="btn btn-secondary btn-sm" id="push-toggle-btn">${subscribed ? '끄기' : '알림 받기'}</button>
    </div>
  `;
  document.getElementById('push-toggle-btn').addEventListener('click', async () => {
    if (subscribed) {
      await unsubscribeFromPush(registration);
    } else {
      await subscribeToPush(registration);
    }
    renderPushBanner(container);
  });
}

async function subscribeToPush(registration) {
  try {
    if (Notification.permission === 'denied') {
      alert('브라우저 알림 권한이 차단되어 있습니다. 브라우저 설정에서 알림 권한을 허용해주세요.');
      return;
    }
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;
    const { publicKey } = await apiRequest('GET', '/api/push/vapid-public-key');
    const sub = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey),
    });
    const json = sub.toJSON();
    await apiRequest('POST', '/api/me/push-subscriptions', { endpoint: json.endpoint, keys: json.keys });
  } catch (err) {
    console.error('push subscribe failed', err);
  }
}

async function unsubscribeFromPush(registration) {
  try {
    const sub = await registration.pushManager.getSubscription();
    if (!sub) return;
    const endpoint = sub.endpoint;
    await sub.unsubscribe();
    await apiRequest('DELETE', '/api/me/push-subscriptions', { endpoint });
  } catch (err) {
    console.error('push unsubscribe failed', err);
  }
}

  });

  function startNotificationList(root, unreadOnly) {

    loadMoreNotifications(root.querySelector('#notif-list-body'));

async function loadMoreNotifications(listBody) {
  const state = notificationListState;
  if (!state || state.loading || !state.hasMore) return;
  state.loading = true;
  renderNotificationControl(listBody);

  const params = new URLSearchParams();
  params.set('offset', String(state.offset));
  params.set('limit', String(state.limit));
  if (state.unreadOnly) params.set('unreadOnly', 'true');

  try {
    const data = await fetchJSON('/api/me/notifications?' + params.toString());
    if (notificationListState !== state) return; // 그 사이 필터가 바뀜 — 결과 버림
    const items = data.items || [];
    if (items.length) state.batches.push(items);
    state.offset += items.length;
    state.total = data.total || 0;
    state.hasMore = !!data.hasMore;
    state.loading = false;
    renderNotificationItems(listBody, state.batches);
  } catch (err) {
    state.loading = false;
    if (!state.batches.length) {
      listBody.className = 'error';
      listBody.innerHTML = '';
      listBody.textContent = err.message;
    } else {
      renderNotificationControl(listBody);
    }
  }
}

function notificationRowHtml(n) {
  const target = n.pipelineEntryId ? '#/pipeline/' + n.pipelineEntryId
    : n.noticeId ? '#/notices/' + n.noticeId : '#/notices';
  return `
    <div class="row-card notification-row${n.read ? '' : ' notification-row--unread'}" data-id="${escapeAttr(n.id)}" data-target="${escapeAttr(target)}">
      <span class="row-card-icon">${notificationIconHtml(n.eventType)}</span>
      <div class="row-card-main">
        <div class="row-card-title">${n.read ? '' : '<span class="notification-unread-dot"></span>'}${escapeHtml(n.title)}</div>
        <div class="row-card-subtitle">${escapeHtml(n.body)} · ${escapeHtml(formatDateTime(n.createdAt))}</div>
      </div>
      <span class="row-card-arrow">›</span>
    </div>
  `;
}

function renderNotificationItems(listBody, batches) {
  const totalCount = batches.reduce((sum, b) => sum + b.length, 0);
  if (!totalCount) {
    listBody.className = 'empty';
    listBody.innerHTML = '';
    listBody.textContent = '받은 알림이 없습니다.';
    return;
  }
  const batchesHtml = batches.map(batch => `
    <div class="notice-batch-header"><span class="notice-batch-count">${batch.length}건</span><span class="notice-batch-rule"></span></div>
    <div class="notice-list">${batch.map(notificationRowHtml).join('')}</div>
  `).join('');
  listBody.className = '';
  listBody.innerHTML = '';
  listBody.appendChild(h(`${batchesHtml}<div id="notif-list-more-control"></div>`));
  renderNotificationControl(listBody);
  listBody.querySelectorAll('.notification-row').forEach(row => {
    row.addEventListener('click', async () => {
      const id = row.dataset.id;
      if (row.classList.contains('notification-row--unread')) {
        row.classList.remove('notification-row--unread');
        const dot = row.querySelector('.notification-unread-dot');
        if (dot) dot.remove();
        try { await apiRequest('POST', '/api/me/notifications/' + encodeURIComponent(id) + '/read'); } catch (err) { /* 무시 */ }
        refreshUnreadNotificationCount();
      }
      location.hash = row.dataset.target;
    });
  });
}

function renderNotificationControl(listBody) {
  const control = listBody.querySelector('#notif-list-more-control');
  if (!control || !notificationListState) return;
  const state = notificationListState;
  if (state.loading) {
    control.innerHTML = `<p class="notice-list-sentinel">불러오는 중...</p>`;
    return;
  }
  if (!state.hasMore) {
    control.innerHTML = state.batches.length ? `<p class="notice-list-sentinel">모든 알림을 불러왔습니다.</p>` : '';
    return;
  }
  control.innerHTML = `<button type="button" class="btn btn-secondary btn-block" id="notif-list-more-btn">더보기</button>`;
  control.querySelector('#notif-list-more-btn').addEventListener('click', () => loadMoreNotifications(listBody));
}

// renderAccountSettings — #/me/account(2026-08-05 신설). 사이드바 하단
// 이메일 클릭 시 진입하는 계정 설정 화면. 이메일은 조회만(변경은 본인인증이
// 추가로 필요할 수 있어 이번 범위 밖 — 문의 안내로 대체), 휴대폰번호는
// 수정 가능, 비밀번호는 소셜전용 계정이면 아예 폼을 안 보여주고 안내
// 문구로 대체, 연결된 소셜 계정은 조회+연결 해제(비밀번호도 없고 다른
// 연결도 없는 마지막 로그인 수단은 서버가 거부 — last_login_method).
// 회원 탈퇴는 account_settings.go의 handleSelfDeactivateAccount(admin_member_actions.go의
// deactivateUserAccount 공용 헬퍼 재사용)를 그대로 호출한다.
async function renderAccountSettings(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/me/account');
  } catch (err) {
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  // renderProvidersSection — 연결된 소셜 계정 목록만 별도로 다시 그릴 수
  // 있게 분리(연결 해제 성공 시 화면 전체를 다시 불러오지 않고 이 부분만
  // 갱신하기 위함). data.connectedProviders/data.hasPassword를 그대로
  // 참조하는 클로저라 disconnect 성공 시 그 배열만 갱신하면 된다.
  function renderProvidersSection() {
    const slot = document.getElementById('account-providers-slot');
    if (!slot) return;
    slot.innerHTML = data.connectedProviders.length
      ? `<ul class="profile-summary-list">${data.connectedProviders.map(p => `
          <li class="profile-summary-row">
            <span>${escapeHtml(OAUTH_PROVIDER_LABELS[p] || p)}</span>
            <button type="button" class="link-btn account-provider-disconnect-btn" data-provider="${escapeAttr(p)}">연결 해제</button>
          </li>
        `).join('')}</ul>`
      : '<p style="color:var(--ink-soft);font-size:0.9rem">연결된 소셜 계정이 없습니다.</p>';
    slot.querySelectorAll('.account-provider-disconnect-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const provider = btn.dataset.provider;
        openConfirmModal({
          title: '소셜 계정 연결 해제',
          message: `${OAUTH_PROVIDER_LABELS[provider] || provider} 연결을 해제하시겠습니까?`,
          confirmLabel: '연결 해제',
          tone: 'danger',
          onConfirm: async () => {
            await apiRequest('DELETE', `/api/me/account/oauth/${encodeURIComponent(provider)}`);
            data.connectedProviders = data.connectedProviders.filter(p => p !== provider);
            renderProvidersSection();
          },
        });
      });
    });
  }

  const passwordSectionHtml = data.hasPassword ? `
    <form id="account-password-form" class="profile-form">
      <label>현재 비밀번호<input type="password" name="currentPassword" required></label>
      <label>새 비밀번호 (최소 8자)<input type="password" name="newPassword" minlength="8" required></label>
      <label>새 비밀번호 확인<input type="password" name="newPasswordConfirm" minlength="8" required></label>
      <div id="account-password-error" class="error" style="display:none"></div>
      <button type="submit" class="btn btn-primary">비밀번호 변경</button>
    </form>
  ` : '<p style="color:var(--ink-soft);font-size:0.9rem">소셜 로그인 계정은 비밀번호가 없습니다.</p>';

  container.innerHTML = '';
  container.appendChild(h(`
    <h2>계정 정보</h2>

    <div class="detail-card">
      <h3>이메일</h3>
      <p>${escapeHtml(data.email)}</p>
      <p style="color:var(--ink-soft);font-size:0.85rem">이메일 변경을 원하시면 고객센터로 문의해주세요.</p>
    </div>

    <div class="detail-card">
      <h3>화면 설정</h3>
      <label class="theme-toggle-row">
        <span>다크 모드</span>
        <span class="switch">
          <input type="checkbox" id="theme-toggle-input" ${getStoredTheme() === 'dark' ? 'checked' : ''}>
          <span class="switch-slider" aria-hidden="true"></span>
        </span>
      </label>
      <p style="color:var(--ink-soft);font-size:0.85rem">어두운 화면으로 전환합니다. 이 브라우저에 저장됩니다.</p>
    </div>

    <div class="detail-card">
      <h3>휴대폰번호</h3>
      <form id="account-phone-form" class="profile-form">
        <label>휴대폰번호<input type="tel" name="phoneNumber" value="${escapeAttr(data.phoneNumber || '')}" placeholder="010-1234-5678"></label>
        <div id="account-phone-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-primary">저장</button>
      </form>
    </div>

    <div class="detail-card">
      <h3>비밀번호 변경</h3>
      ${passwordSectionHtml}
    </div>

    <div class="detail-card">
      <h3>연결된 소셜 계정</h3>
      <div id="account-providers-slot"></div>
    </div>

    <div class="detail-card">
      <h3>회원 탈퇴</h3>
      <p style="color:var(--ink-soft);font-size:0.9rem">탈퇴 시 계정을 다시 사용할 수 없습니다.</p>
      <button type="button" id="account-deactivate-btn" class="btn btn-danger">회원 탈퇴</button>
    </div>
  `));
  renderProvidersSection();

  const themeToggle = document.getElementById('theme-toggle-input');
  if (themeToggle) themeToggle.addEventListener('change', () => applyTheme(themeToggle.checked ? 'dark' : 'light'));

  const phoneForm = document.getElementById('account-phone-form');
  attachPhoneAutoFormat(phoneForm.phoneNumber);
  const phoneError = document.getElementById('account-phone-error');
  phoneForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    phoneError.style.display = 'none';
    try {
      await apiRequest('PATCH', '/api/me/account', { phoneNumber: phoneForm.phoneNumber.value });
      showToast('저장되었습니다.', 'success');
    } catch (err) {
      phoneError.textContent = err.message;
      phoneError.style.display = 'block';
    }
  });

  const passwordForm = document.getElementById('account-password-form');
  if (passwordForm) {
    const pwError = document.getElementById('account-password-error');
    passwordForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      pwError.style.display = 'none';
      const fd = new FormData(passwordForm);
      if (fd.get('newPassword') !== fd.get('newPasswordConfirm')) {
        pwError.textContent = '새 비밀번호가 일치하지 않습니다.';
        pwError.style.display = 'block';
        return;
      }
      try {
        await apiRequest('POST', '/api/me/account/change-password', {
          currentPassword: fd.get('currentPassword'),
          newPassword: fd.get('newPassword'),
        });
        showToast('비밀번호가 변경되었습니다.', 'success');
        passwordForm.reset();
      } catch (err) {
        pwError.textContent = err.message;
        pwError.style.display = 'block';
      }
    });
  }

  document.getElementById('account-deactivate-btn').addEventListener('click', () => {
    openConfirmModal({
      title: '회원 탈퇴',
      message: '탈퇴 시 계정을 다시 사용할 수 없습니다. 정말 탈퇴하시겠습니까?',
      confirmLabel: '탈퇴',
      tone: 'danger',
      onConfirm: async () => {
        try {
          await apiRequest('POST', '/api/me/account/deactivate', {});
        } catch (err) {
          // owner_has_other_members는 관리자 화면 문구("이 회원은...")가
          // 본인 시점과 안 맞아 여기서만 직접 문구를 바꾼다.
          if (err.code === 'owner_has_other_members') {
            throw new Error('회원님은 조직의 소유자이고 다른 팀원이 남아있어 탈퇴할 수 없습니다. 먼저 팀원을 내보내거나 소유권을 이전해주세요.');
          }
          throw err;
        }
        currentUser = null;
        currentProfile = null;
        renderHeader();
        location.hash = '#/';
      },
    });
  });
}

// NOTIFICATION_DAYS_BEFORE_OPTIONS — 실제로 배치가 도는 오프셋만
// (notifications.go의 notificationDaysBeforeAllowed와 정확히 같은 값).
const NOTIFICATION_DAYS_BEFORE_OPTIONS = [7, 3, 1];

// 알림 설정 재설계: 마감 리마인더/담당자 상태변경 알림의 수신 여부는
// 이제 조직 공용(휴대폰 번호+SMS 토글)이 아니라 "담당자 관리" 탭의
// 담당자 개인별 설정이다 — 여기 남는 건 (1) 추천 공고 다이제스트
// 이메일 on/off, (2) 제출마감 리마인더를 D-N 중 어느 시점에 보낼지
// 뿐이다. owner만 바꿀 수 있어 member면 읽기 전용으로 보여준다(서버도
// owner_only로 막지만, 프론트에서 미리 disabled 처리해 "저장 눌렀다가
// 403 보는" 경험을 없앤다).
function renderProfileBasicTab(container) {
  const p = currentProfile || {};
  const isOwner = p.role === 'owner';
  const disabledAttr = isOwner ? '' : 'disabled';
  const orgNote = isOwner ? '' : '<p class="license-card-meta">알림 설정은 팀 관리자만 변경할 수 있습니다.</p>';
  const daysBefore = p.notificationDaysBefore || [];

  container.innerHTML = '';
  container.appendChild(h(`
    <div class="detail-card">
      <label class="checkbox-label">
        <input type="checkbox" id="email-notifications-toggle" ${p.emailNotificationsEnabled ? 'checked' : ''} ${disabledAttr}>
        추천 공고 다이제스트 이메일 받기
      </label>
      <span id="email-notifications-status" class="license-card-meta"></span>
    </div>
    <div class="detail-card">
      <p class="license-card-meta" style="margin-bottom:0.5rem">제출마감 리마인더를 언제 받을지 선택하세요. 실제 수신자는 "담당자 관리" 탭에서 담당자별로 설정합니다.</p>
      ${NOTIFICATION_DAYS_BEFORE_OPTIONS.map(d => `
        <label class="checkbox-label">
          <input type="checkbox" name="notification-days-before" value="${d}" ${daysBefore.includes(d) ? 'checked' : ''} ${disabledAttr}>
          마감 D-${d}
        </label>
      `).join('')}
      <span id="notification-days-before-status" class="license-card-meta"></span>
      ${orgNote}
    </div>
    <div id="profile-summary-section"></div>
  `));

  const notificationsToggle = document.getElementById('email-notifications-toggle');
  const notificationsStatus = document.getElementById('email-notifications-status');
  if (isOwner) {
    notificationsToggle.addEventListener('change', async () => {
      const enabled = notificationsToggle.checked;
      notificationsToggle.disabled = true;
      try {
        await apiRequest('PATCH', '/api/me/notification-settings', { emailNotificationsEnabled: enabled });
        currentProfile.emailNotificationsEnabled = enabled;
        notificationsStatus.textContent = '저장되었습니다.';
      } catch (err) {
        notificationsToggle.checked = !enabled;
        notificationsStatus.textContent = err.message;
      } finally {
        notificationsToggle.disabled = false;
      }
    });

    const daysStatus = document.getElementById('notification-days-before-status');
    container.querySelectorAll('input[name="notification-days-before"]').forEach(cb => {
      cb.addEventListener('change', async () => {
        const selected = Array.from(container.querySelectorAll('input[name="notification-days-before"]:checked'))
          .map(el => Number(el.value));
        container.querySelectorAll('input[name="notification-days-before"]').forEach(el => { el.disabled = true; });
        try {
          await apiRequest('PATCH', '/api/me/notification-settings', { notificationDaysBefore: selected });
          currentProfile.notificationDaysBefore = selected;
          daysStatus.textContent = '저장되었습니다.';
        } catch (err) {
          cb.checked = !cb.checked;
          daysStatus.textContent = err.message;
        } finally {
          container.querySelectorAll('input[name="notification-days-before"]').forEach(el => { el.disabled = false; });
        }
      });
    });
  }

  renderProfileSummaryCard(document.getElementById('profile-summary-section'));
}

// renderProfileSummaryCard — 12개 필드를 한 화면에 몰아두던 기존 폼을
// 읽기 전용 요약(제목:값 목록) + 강조 버튼 1개("정보 수정")로 바꾼다.
// 실제 수정은 openProfileEditModal의 3단계 모달 폼에서 이뤄진다.
function renderProfileSummaryCard(container) {
  const p = currentProfile || {};
  const fmtMoney = (v) => (v == null ? '-' : `${Number(v).toLocaleString()}원`);
  const fmtList = (v) => ((v || []).length ? v.join(', ') : '-');
  const rows = [
    ['업태', fmtList(p.businessType)],
    ['지역', p.region || '-'],
    ['업종', fmtList(p.industry)],
    ['업력', p.businessAgeYears != null ? `${p.businessAgeYears}년` : '-'],
    ['기업 규모', p.companySize || '-'],
    ['사업자 대표전화번호', p.phoneNumber || '-'],
    ['매출액', fmtMoney(p.revenueAmount)],
    ['직원 수', p.employeeCount != null ? `${p.employeeCount}명` : '-'],
    ['최근 3년 최대 실적', fmtMoney(p.maxPerformanceAmount)],
    ['신용등급', p.creditRating || '-'],
    ['보유 면허', fmtList(p.licenses)],
    ['보유 인증', fmtList(p.certifications)],
    ['직접생산확인', p.directProductionCert ? '보유' : '-'],
  ];
  const isOwner = p.role === 'owner';
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="detail-card">
      <div class="profile-summary-list">
        ${rows.map(([label, value]) => `
          <div class="profile-summary-row">
            <span class="profile-summary-label">${escapeHtml(label)}</span>
            <span class="profile-summary-value">${escapeHtml(value)}</span>
          </div>
        `).join('')}
      </div>
      ${isOwner
        ? '<button type="button" class="btn btn-primary btn-block" id="profile-edit-btn">정보 수정</button>'
        : '<p class="license-card-meta">기업 정보 수정은 팀 관리자만 할 수 있습니다.</p>'}
    </div>
  `));
  if (isOwner) {
    document.getElementById('profile-edit-btn').addEventListener('click', () => openProfileEditModal(container));
  }
}

// openProfileEditModal — 12개 필드를 3단계(기본정보/재무·실적/면허·인증)로
// 쪼갠 모달 폼. 필드는 전부 같은 <form> 안에 있고 wizard-step으로 보이는
// 것만 CSS로 바꾸므로(display:none), FormData는 어느 단계에 있든 항상
// 전체 값을 담는다 — 기존 제출 로직을 그대로 재사용할 수 있는 이유.
function openProfileEditModal(summaryContainer) {
  const stepLabels = ['기본 정보', '재무·실적정보', '면허·인증'];
  const bodyHtml = `
    <div id="wizard-step-indicator" class="wizard-step-indicator"></div>
    <form id="profile-form" class="profile-form">
      <div class="wizard-step" data-step="0">
        <label>업태 (쉼표로 구분, 겸업 시 여러 개 등록 가능)<input type="text" name="businessType"></label>
        <label>지역<input type="text" name="region"></label>
        <div class="field-group">
          <span class="field-group-label">업종 (겸업 시 여러 개 선택 가능 — 하나라도 일치하면 적합 판정)</span>
          <div id="profile-modal-industry-picker"></div>
        </div>
        <label>개업일 <span style="font-weight:400;color:var(--ink-soft);font-size:0.85em">(업력을 자동으로 계산해요)</span>
          <input type="date" name="foundingDate" max="${new Date().toISOString().slice(0, 10)}">
        </label>
        ${currentProfile && currentProfile.businessAgeYears != null ? `<p style="color:var(--ink-soft);font-size:0.85em;margin:-0.5rem 0 0.75rem">현재 업력: 약 ${currentProfile.businessAgeYears}년</p>` : ''}
        <label>기업 규모
          <select name="companySize" class="select-input">
            <option value="">선택 안 함</option>
            ${COMPANY_SIZE_OPTIONS.map(sz => `<option value="${escapeAttr(sz)}">${escapeHtml(sz)}</option>`).join('')}
          </select>
        </label>
        <label>연락처(사업자 대표전화번호)<input type="tel" name="businessPhone" placeholder="02-1234-5678"></label>
      </div>
      <div class="wizard-step" data-step="1">
        <label>연매출액(원)<input type="text" inputmode="numeric" name="revenueAmount"></label>
        <label>직원 수<input type="number" name="employeeCount"></label>
        <div class="field-verify-row">
          <button type="button" id="employee-count-verify-btn" class="field-verify-btn">4대보험 가입자명부로 확인</button>
          <span id="employee-count-confidence-badge"></span>
        </div>
        <input type="file" id="employee-count-file-input" accept=".pdf,.jpg,.jpeg,.png" style="display:none">
        <div id="employee-count-confirm-slot"></div>
        <label>최근 3년 최대 실적(원)<input type="text" inputmode="numeric" name="maxPerformanceAmount"></label>
        <label>신용등급<input type="text" name="creditRating"></label>
      </div>
      <div class="wizard-step" data-step="2">
        <label>보유 면허 (쉼표로 구분)<input type="text" name="licenses"></label>
        <label>보유 인증 (쉼표로 구분)<input type="text" name="certifications"></label>
        <label class="checkbox-label"><input type="checkbox" name="directProductionCert"> ${glossaryHtml('직접생산확인', '직접생산확인증명 보유')}</label>
        <div id="profile-error" class="error" style="display:none"></div>
      </div>
      <div class="wizard-nav">
        <button type="button" class="btn btn-secondary" id="wizard-prev">이전</button>
        <button type="button" class="btn btn-primary" id="wizard-next">다음</button>
        <button type="submit" class="btn btn-primary" id="wizard-submit" style="display:none">저장</button>
      </div>
    </form>
  `;
  openModal('기업 프로필 수정', bodyHtml);

  const form = document.getElementById('profile-form');
  fillProfileForm(form, currentProfile);
  renderEmployeeCountBadge();
  attachPhoneAutoFormat(form.businessPhone);
  attachCurrencyAutoFormat(form.revenueAmount);
  attachCurrencyAutoFormat(form.maxPerformanceAmount);

  let wizardStep = 0;
  const steps = Array.from(form.querySelectorAll('.wizard-step'));
  const indicatorEl = document.getElementById('wizard-step-indicator');
  const prevBtn = document.getElementById('wizard-prev');
  const nextBtn = document.getElementById('wizard-next');
  const submitBtn = document.getElementById('wizard-submit');

  function updateWizardStep() {
    steps.forEach((el, i) => { el.style.display = i === wizardStep ? '' : 'none'; });
    indicatorEl.innerHTML = stepIndicatorHtml(wizardStep, steps.length, stepLabels[wizardStep]);
    prevBtn.style.display = wizardStep === 0 ? 'none' : '';
    nextBtn.style.display = wizardStep === steps.length - 1 ? 'none' : '';
    submitBtn.style.display = wizardStep === steps.length - 1 ? '' : 'none';
  }
  prevBtn.addEventListener('click', () => { wizardStep -= 1; updateWizardStep(); });
  nextBtn.addEventListener('click', () => { wizardStep += 1; updateWizardStep(); });
  updateWizardStep();

  const employeeCountFileInput = document.getElementById('employee-count-file-input');
  const employeeCountConfirmSlot = document.getElementById('employee-count-confirm-slot');
  document.getElementById('employee-count-verify-btn').addEventListener('click', () => employeeCountFileInput.click());
  employeeCountFileInput.addEventListener('change', async () => {
    const file = employeeCountFileInput.files[0];
    employeeCountFileInput.value = '';
    if (!file) return;
    employeeCountConfirmSlot.innerHTML = '';
    employeeCountConfirmSlot.appendChild(h('<div class="loading">문서를 분석하는 중...</div>'));
    let uploadData;
    try {
      uploadData = await uploadCompanyRecordDocument('/api/me/company-profile/employee-verification/documents', file);
    } catch (err) {
      employeeCountConfirmSlot.innerHTML = '';
      employeeCountConfirmSlot.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
      return;
    }
    renderEmployeeCountConfirmForm(employeeCountConfirmSlot, uploadData.candidate, uploadData.documentId, form);
  });

  const errorBox = document.getElementById('profile-error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    // parseCurrencyInput으로 쉼표를 먼저 걷어낸 뒤 숫자로 변환한다 —
    // employeeCount처럼 쉼표가 안 붙는 필드도 그냥 통과되니(쉼표 없으면
    // 원래 문자열 그대로) toNum 하나로 공용 처리해도 안전하다.
    const toNum = (v) => {
      const cleaned = parseCurrencyInput(v);
      return cleaned === null ? null : Number(cleaned);
    };
    const toList = (v) => (v || '').split(',').map(s => s.trim()).filter(Boolean);
    // foundingDate — 2026-08-06부터 founding_date 컬럼에 그대로 저장되고
    // (더 이상 여기서 클라이언트가 businessAgeYears를 미리 계산해 보내지
    // 않는다), 서버가 매 조회마다 이 값 기준으로 업력을 다시 계산한다
    // (getCompanyProfile 참고). 폼이 이미 현재 값으로 프리필돼 있으므로
    // (fillProfileForm) 사용자가 그대로 두면 그대로 재전송되고, 지우면
    // null이 저장돼 다음부턴 예전 저장값으로 폴백한다.
    const foundingDateVal = fd.get('foundingDate') || null;
    if (foundingDateVal && computeBusinessAgeYears(foundingDateVal) == null) {
      errorBox.textContent = '올바른 개업일을 입력해주세요.';
      errorBox.style.display = 'block';
      return;
    }
    const payload = {
      businessType: toList(fd.get('businessType')),
      region: fd.get('region') || null,
      industry: fd.getAll('industry'),
      foundingDate: foundingDateVal,
      revenueAmount: toNum(fd.get('revenueAmount')),

// uploadCompanyRecordDocument는 면허·인증 업로드와 같은 raw fetch(멀티파트라
// apiRequest의 JSON 강제 인코딩을 못 씀) 패턴을 재무/실적/인력 3곳이 공유한다.
async function uploadCompanyRecordDocument(uploadPath, file) {
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch(uploadPath, { method: 'POST', body: fd });
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const code = data && data.error;
    const err = new Error((code && ERROR_MESSAGES[code]) || ('요청 실패 (' + res.status + ')'));
    err.status = res.status;
    throw err;
  }
  return data;
}

// plainSelectHtml — 값 목록 하나로 <select>를 만드는 공용 헬퍼(증빙서류
// 종류처럼 "선택 안 함" + 고정 값 목록만 있으면 되는 경우). withEmpty가
// true면 맨 앞에 빈 옵션을 추가한다(값 목록 자체엔 넣지 않아도 됨).
function plainSelectHtml(name, options, selected, withEmpty) {
  const opts = withEmpty ? ['', ...options] : options;
  return `<select name="${name}" class="select-input">${opts.map(v =>
    `<option value="${escapeAttr(v)}" ${v === (selected || '') ? 'selected' : ''}>${escapeHtml(v || '선택 안 함')}</option>`
  ).join('')}</select>`;
}

// 업로드 실패) 사용자가 정확한 금액을 모를 때 쓰는 구간 select. 값은 각

// 실제 저장 시 confidence='D'로 낮춰서 이 값이 추정치임을 표시한다.

// 찾았거나(직접 입력 진입 포함) 값이 비어있으면 구간 select로 대체한다.
function revenueFieldHtml(c) {

  }
  return `

      <select name="revenueRange" class="select-input">

        ${REVENUE_RANGE_OPTIONS.map(o => `<option value="${escapeAttr(o.value)}">${escapeHtml(o.label)}</option>`).join('')}

}

function personnelCardHtml(item) {
  const parts = [];
  if (item.techField) parts.push(escapeHtml(item.techField));
  if (item.careerYears != null) parts.push('경력 ' + item.careerYears + '년');
  if (item.techGrade) parts.push(escapeHtml(item.techGrade));
  if (item.qualifications && item.qualifications.length) parts.push(item.qualifications.map(escapeHtml).join(', '));
  return `
    <div class="license-card">
      <div class="license-card-main">
        <div class="license-card-name">${escapeHtml(item.role || '직무 미상')}</div>
        <div class="license-card-meta">${parts.join(' · ')}</div>
      </div>
      <div class="license-card-side">${confidenceBadgeHtml(item.confidence)}</div>
    </div>
  `;
}

// ---------- 담당자 관리 ----------
// 참여 검토(파이프라인 생성) 시 assignee_name/email/phone을 자동으로
// 채우는 데 쓰이는 기본 담당자를 여기서 지정한다. member는 읽기 전용으로
// 본다(disableOwnerOnlyButtons가 추가/수정/삭제/기본지정 버튼을 막는다).
async function renderContactsTab(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/me/contacts');
  } catch (err) {
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }
  const items = data.items || [];

  container.innerHTML = '';
  container.appendChild(h(`
    <p class="license-card-meta">여기 등록해두면 "참여 검토" 시 담당자 정보가 자동으로 채워집니다. 기본 담당자 1명을 지정할 수 있습니다.</p>
    <div class="license-toolbar">
      <button type="button" id="contact-add-btn" class="btn btn-secondary btn-sm">담당자 추가</button>
    </div>
    <div id="contact-form-slot"></div>
    <div class="license-list" id="contact-list"></div>
  `));

  const listEl = document.getElementById('contact-list');
  if (!items.length) {
    listEl.appendChild(h('<p class="empty">아직 등록한 담당자가 없습니다. 등록해두면 참여 검토 시 자동으로 채워집니다.</p>'));
  } else {
    favoriteFirst(items).forEach(item => listEl.appendChild(h(contactCardHtml(item))));
  }

  const formSlot = document.getElementById('contact-form-slot');
  document.getElementById('contact-add-btn').addEventListener('click', () => {
    renderContactForm(formSlot, null, () => renderContactsTab(container));
  });

  listEl.querySelectorAll('.contact-edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = items.find(i => i.id === btn.dataset.id);
      renderContactForm(formSlot, item, () => renderContactsTab(container));
    });
  });
  listEl.querySelectorAll('.contact-delete-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      openConfirmModal({
        title: '담당자 삭제',
        message: '이 담당자를 삭제하시겠습니까?',
        confirmLabel: '삭제',
        tone: 'danger',
        onConfirm: async () => {
          await apiRequest('DELETE', '/api/me/contacts/' + encodeURIComponent(btn.dataset.id));
          renderContactsTab(container);
        },
      });
    });
  });
  listEl.querySelectorAll('.contact-set-default-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const item = items.find(i => i.id === btn.dataset.id);
      if (!item) return;
      try {
        await apiRequest('PATCH', '/api/me/contacts/' + encodeURIComponent(item.id), {
          name: item.name, email: item.email, phone: item.phone, isDefault: true,
          emailNotificationsEnabled: item.emailNotificationsEnabled, smsNotificationsEnabled: item.smsNotificationsEnabled,
        });
        renderContactsTab(container);
      } catch (err) {
        alert(err.message);
      }
    });
  });
  disableOwnerOnlyButtons(container);
}

function contactCardHtml(item) {
  const metaParts = [];
  if (item.email) metaParts.push(escapeHtml(item.email));
  if (item.phone) metaParts.push(escapeHtml(item.phone));
  const channelParts = [];
  if (item.emailNotificationsEnabled) channelParts.push('이메일 수신');
  if (item.smsNotificationsEnabled) channelParts.push('SMS 수신');
  return `
    <div class="license-card">
      <div class="license-card-main">
        <div class="license-card-name">${escapeHtml(item.name)} ${item.isDefault ? '<span class="badge badge--success">기본</span>' : ''}</div>
        <div class="license-card-meta">${metaParts.join(' · ') || '-'}</div>
        <div class="license-card-meta">${channelParts.length ? channelParts.join(' · ') : '알림 수신 안 함'}</div>
      </div>
      <div class="license-card-side">
        ${!item.isDefault ? `<button type="button" class="btn btn-secondary btn-sm contact-set-default-btn" data-id="${escapeAttr(item.id)}">기본으로 지정</button>` : ''}
        <button type="button" class="btn btn-secondary btn-sm contact-edit-btn" data-id="${escapeAttr(item.id)}">수정</button>
        <button type="button" class="btn btn-secondary btn-sm contact-delete-btn" data-id="${escapeAttr(item.id)}">삭제</button>
      </div>
    </div>
  `;
}

function renderContactForm(formSlot, item, onSaved) {
  const c = item || {};
  // SMS 알림은 유료 플랜 전용(백엔드 smsAllowedForPlan이 발송 직전에 최종
  // 차단한다). Free에서는 토글을 disabled로 두고 이유를 안내한다 — disabled
  // 입력은 FormData에서 빠져 저장 시 자동으로 false가 되므로(발송 안 됨과
  // 일치) 별도 처리가 필요 없다. currentUser.plan은 /api/me가 내려주는 값.
  const isFreePlan = !currentUser || currentUser.plan === 'free';
  const smsFieldHtml = isFreePlan
    ? `<label class="checkbox-label" title="SMS 알림은 유료 플랜에서 이용할 수 있습니다"><input type="checkbox" name="smsNotificationsEnabled" disabled> SMS 알림 받기 (제출마감 리마인더, 상태변경) <span style="color: var(--ink-soft); font-size: 0.8rem; margin-left: 0.3rem;">· 유료 플랜에서 이용 가능</span></label>`
    : `<label class="checkbox-label"><input type="checkbox" name="smsNotificationsEnabled" ${c.smsNotificationsEnabled ? 'checked' : ''}> SMS 알림 받기 (제출마감 리마인더, 상태변경)</label>`;
  formSlot.innerHTML = '';
  formSlot.appendChild(h(`
    <div class="license-confirm-form">
      <h4>${item ? '담당자 수정' : '담당자 추가'}</h4>
      <form id="contact-form" class="profile-form">
        <label>이름<input type="text" name="name" required value="${escapeAttr(c.name || '')}"></label>
        <label>이메일<input type="email" name="email" value="${escapeAttr(c.email || '')}"></label>
        <label>전화번호<input type="tel" name="phone" value="${escapeAttr(c.phone || '')}" placeholder="010-0000-0000"></label>
        <label><input type="checkbox" name="isDefault" ${c.isDefault ? 'checked' : ''}> 기본 담당자로 지정</label>
        <label class="checkbox-label"><input type="checkbox" name="emailNotificationsEnabled" ${c.id ? (c.emailNotificationsEnabled ? 'checked' : '') : 'checked'}> 이메일 알림 받기 (제출마감 리마인더, 상태변경)</label>
        ${smsFieldHtml}
        <div id="contact-form-error" class="error" style="display:none"></div>
        <div class="license-toolbar">
          <button type="submit" class="btn btn-primary btn-sm">저장</button>
          <button type="button" id="contact-form-cancel" class="btn btn-secondary btn-sm">취소</button>
        </div>
      </form>
    </div>
  `));

  const form = document.getElementById('contact-form');
  attachPhoneAutoFormat(form.phone);
  const errorBox = document.getElementById('contact-form-error');
  document.getElementById('contact-form-cancel').addEventListener('click', () => { formSlot.innerHTML = ''; });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    const payload = {
      name: fd.get('name'),
      email: fd.get('email') || null,
      phone: fd.get('phone') || null,
      isDefault: fd.get('isDefault') === 'on',
      emailNotificationsEnabled: fd.get('emailNotificationsEnabled') === 'on',
      smsNotificationsEnabled: fd.get('smsNotificationsEnabled') === 'on',
    };
    try {
      if (item) {
        await apiRequest('PATCH', '/api/me/contacts/' + encodeURIComponent(item.id), payload);
      } else {
        await apiRequest('POST', '/api/me/contacts', payload);
      }
      formSlot.innerHTML = '';
      onSaved();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}
