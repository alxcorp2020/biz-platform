function renderSavedSearchForm(formSlot, item, contacts, onSaved) {
  const c = item || {};
  const isDefault = isDefaultSavedSearchCard(item);
  const currentNoticeType = c.noticeType || '';
  const currentReminderDays = c.reminderDaysBefore || [];
  const currentRecipientIds = c.recipientContactIds || [];
  const contactsCheckboxesHtml = contacts.length
    ? favoriteFirst(contacts).map(ct => `
        <label class="checkbox-label"><input type="checkbox" name="recipientContactIds" value="${escapeAttr(ct.id)}" ${currentRecipientIds.includes(ct.id) ? 'checked' : ''}> ${escapeHtml(ct.name)}${ct.email ? ` (${escapeHtml(ct.email)})` : ''}</label>
      `).join('')
    : `<p class="license-card-meta">등록된 담당자가 없습니다. 위 "담당자 관리"에서 먼저 등록해주세요.</p>`;
  formSlot.innerHTML = '';
  formSlot.appendChild(h(`
    <div class="license-confirm-form">
      <h4>${item ? '맞춤공고 조건 수정' : '새 맞춤공고 조건'}</h4>
      <form id="saved-search-form" class="profile-form">
        <label>조건 이름<input type="text" name="name" required placeholder="예: 서울·경기 정보통신공사" value="${escapeAttr(c.name || '')}"></label>
        <label>공고 종류
          <select name="noticeType" class="select-input">
            ${SAVED_SEARCH_NOTICE_TYPE_OPTIONS.map(o => `<option value="${escapeAttr(o.value)}" ${o.value === currentNoticeType ? 'selected' : ''}>${escapeHtml(o.label)}</option>`).join('')}
          </select>
        </label>
        ${regionIndustryCompanySizeFieldsHtml(item, isDefault)}
        <details class="saved-search-advanced">
          <summary>상세 조건 (발주기관 · 금액 · 키워드)</summary>
          <label>발주기관<input type="text" name="organizationName" placeholder="예: 서울특별시" value="${escapeAttr(c.organizationName || '')}"></label>
          <div class="field-group">
            <span class="field-group-label">예산 범위</span>
            <div id="saved-search-budget-slider"></div>
            <div class="budget-number-inputs">
              <label>최소 금액(원)<input type="text" inputmode="numeric" name="budgetMin" placeholder="예: 10,000,000" value="${c.budgetMin != null ? escapeAttr(formatCurrency(c.budgetMin)) : ''}"></label>
              <label>최대 금액(원)<input type="text" inputmode="numeric" name="budgetMax" placeholder="예: 500,000,000" value="${c.budgetMax != null ? escapeAttr(formatCurrency(c.budgetMax)) : ''}"></label>
            </div>
          </div>
          <label>포함 키워드
            <div id="saved-search-keywords-include-tags" class="tag-input"></div>
          </label>
          <label>제외 키워드
            <div id="saved-search-keywords-exclude-tags" class="tag-input"></div>
          </label>
        </details>
        <fieldset class="saved-search-notify-section">
          <legend>알림 설정</legend>
          <label class="checkbox-label"><input type="checkbox" name="alertEnabled" ${item ? (c.alertEnabled ? 'checked' : '') : 'checked'}> 추천공고 다이제스트 이메일 받기</label>
          <label class="checkbox-label"><input type="checkbox" name="reminderEnabled" id="saved-search-reminder-enabled" ${c.reminderEnabled ? 'checked' : ''}> 제출마감 리마인더 받기</label>
          <div id="saved-search-reminder-days" class="saved-search-reminder-days" style="${c.reminderEnabled ? '' : 'display:none'}">
            ${SAVED_SEARCH_REMINDER_DAY_OPTIONS.map(d => `
              <label class="checkbox-label"><input type="checkbox" name="reminderDaysBefore" value="${d}" ${currentReminderDays.includes(d) ? 'checked' : ''}> D-${d}</label>
            `).join('')}
          </div>
          <p class="license-card-meta">이 알림을 받을 담당자</p>
          ${contactsCheckboxesHtml}
          <p class="license-card-meta">실제 수신자는 담당자 관리 탭에서 담당자별로 설정합니다(이메일/SMS/웹푸시 개별 채널 설정과 연동됨). 담당자를 선택하지 않으면 내 계정 이메일로 발송됩니다.</p>
        </fieldset>
        <div id="saved-search-form-error" class="error" style="display:none"></div>
        <div class="license-toolbar">
          <button type="submit" class="btn btn-primary btn-sm">저장</button>
          <button type="button" id="saved-search-form-cancel" class="btn btn-secondary btn-sm">취소</button>
        </div>
      </form>
    </div>
  `));

  const form = document.getElementById('saved-search-form');
  const defaultCardIndustryMount = document.getElementById('default-card-industry-picker');
  if (defaultCardIndustryMount) attachIndustryPicker(defaultCardIndustryMount, (currentProfile || {}).industry, 'defaultCardIndustry');
  attachCurrencyAutoFormat(form.budgetMin);
  attachCurrencyAutoFormat(form.budgetMax);
  renderBudgetRangeSlider(document.getElementById('saved-search-budget-slider'), form.budgetMin, form.budgetMax);
  renderKeywordTagInput(document.getElementById('saved-search-keywords-include-tags'), c.keywordsInclude || [], 'include');
  renderKeywordTagInput(document.getElementById('saved-search-keywords-exclude-tags'), c.keywordsExclude || [], 'exclude');
  const errorBox = document.getElementById('saved-search-form-error');
  document.getElementById('saved-search-form-cancel').addEventListener('click', () => { formSlot.innerHTML = ''; });
  document.getElementById('saved-search-reminder-enabled').addEventListener('change', (e) => {
    document.getElementById('saved-search-reminder-days').style.display = e.target.checked ? '' : 'none';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    const budgetMinRaw = parseCurrencyInput(fd.get('budgetMin'));
    const budgetMaxRaw = parseCurrencyInput(fd.get('budgetMax'));

    let regionVal = fd.get('region') || null;
    let industryVal = fd.get('industry') || null; // 일반 조건(자유 텍스트 업종)

    if (isDefault) {
      // "내 기본 조건" — 지역/업종/기업규모는 기업정보(company_profiles)가
      // 원본이라 거기부터 저장한다. handleUpsertCompanyProfile이 이
      // 요청 안에서 이미 saved_searches(origin='onboarding')의 지역/업종도
      // 같은 값으로 동기화해주지만(2026-08-06 도입), 이 폼이 그 뒤에 이어서
      // 저장하는 나머지 필드(알림설정 등)의 payload에도 방금 확정된 값을
      // 그대로 실어 보내 응답 순서와 무관하게 항상 일치하도록 한다.
      const industryList = fd.getAll('defaultCardIndustry');
      const companySizeVal = fd.get('defaultCardCompanySize') || null;
      const foundingDateVal = fd.get('defaultCardFoundingDate') || null;
      if (foundingDateVal && computeBusinessAgeYears(foundingDateVal) == null) {
        errorBox.textContent = '올바른 개업일을 입력해주세요.';
        errorBox.style.display = 'block';
        return;
      }
      try {
        const profileData = await apiRequest('PUT', '/api/me/company-profile', companyProfileUpdatePayload({
          region: regionVal, industry: industryList, companySize: companySizeVal, foundingDate: foundingDateVal,
        }));
        currentProfile = profileData.companyProfile;
        regionVal = currentProfile.region || null;
        industryVal = (currentProfile.industry && currentProfile.industry.length) ? currentProfile.industry[0] : null;
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        return;
      }
    }

    const payload = {
      name: fd.get('name'),
      noticeType: fd.get('noticeType') || null,
      region: regionVal,
      industry: industryVal,
      organizationName: fd.get('organizationName') || null,
      budgetMin: budgetMinRaw ? Number(budgetMinRaw) : null,
      budgetMax: budgetMaxRaw ? Number(budgetMaxRaw) : null,
      keywordsInclude: getTagInputValues(document.getElementById('saved-search-keywords-include-tags')),
      keywordsExclude: getTagInputValues(document.getElementById('saved-search-keywords-exclude-tags')),
      alertEnabled: fd.get('alertEnabled') === 'on',
      reminderEnabled: fd.get('reminderEnabled') === 'on',
      reminderDaysBefore: fd.getAll('reminderDaysBefore').map(Number),
      recipientContactIds: fd.getAll('recipientContactIds'),
    };
    try {
      if (item) {
        await apiRequest('PATCH', '/api/me/saved-searches/' + encodeURIComponent(item.id), payload);
      } else {
        await apiRequest('POST', '/api/me/saved-searches', payload);
      }
      formSlot.innerHTML = '';
      onSaved();
    } catch (err) {
      // duplicate_saved_search — 서버가 기존 조건 이름(existingName)을
      // 같이 내려주므로(err.data) ERROR_MESSAGES의 정적 문구 대신 그
      // 이름을 넣은 정확한 안내문을 조립한다(already_used/usage와 같은
      // 기존 관례, apiRequest 참고).
      if (err.code === 'duplicate_saved_search' && err.data && err.data.existingName) {
        errorBox.textContent = `이미 동일한 조건의 맞춤공고가 있습니다 ('${err.data.existingName}'). 조건을 다르게 설정하거나, 기존 조건을 사용해주세요.`;
      } else {
        errorBox.textContent = err.message;
      }
      errorBox.style.display = 'block';
    }
  });
}

function renderDetail(container, id) {
  container.innerHTML = '';
  container.appendChild(h(`
    <a href="#/notices" class="back-link">&larr; 목록으로</a>
    <div id="detail-body">${skeletonDetailHtml()}</div>
  `));
  const body = document.getElementById('detail-body');

  fetchJSON('/api/notices/' + encodeURIComponent(id))
    .then(data => {
      const n = data.notice;
      const changes = data.changes || [];
      const changeRows = changes.length
        ? changes.map(c => `
            <tr>
              <td>${escapeHtml(NOTICE_CHANGE_FIELD_LABELS[c.field] || c.field)}</td>
              <td class="mono">${escapeHtml(c.oldValue || '-')}</td>
              <td class="mono">${escapeHtml(c.newValue || '-')}</td>
              <td class="importance-${escapeHtml(c.importance || 'minor')}">${escapeHtml(c.importance || '-')}</td>
              <td class="mono">${formatDate(c.createdAt)}</td>
            </tr>
          `).join('')
        : '';

      // 데이터 신뢰성 노출(2026-08-06) — 없는 값은 그 항목만 통째로
      // 생략한다(빈 값을 억지로 채우지 않는다는 기존 원칙 그대로).
      // HERO metadata는 한 줄 small text로 간결화(2026-08-12): 게시일 + 출처만. 수집시각/변경확인은
      // 상세 데이터 신뢰용이라 표시하되 짧게 — 출처명은 긴 공식명 대신 짧은 이름으로.
      const sourceShort = n.sourceName ? (n.sourceName.includes('나라장터') ? '나라장터' : (n.sourceName.includes('기업마당') ? '기업마당' : escapeHtml(n.sourceName))) : '';
      const trustParts = [];
      if (n.publishedAt) trustParts.push('게시 ' + formatKoreanDate(n.publishedAt));
      if (sourceShort) trustParts.push('출처 ' + sourceShort);
      const trustLine = trustParts.join(' · ');

      const extractionBannerHtml = `
        <div class="extraction-banner">
          <span aria-hidden="true">ℹ</span>
          아래 내용은 첨부문서에서 자동으로 추출되었습니다. 원문과 다를 수 있으니 반드시 대조 확인하세요.
        </div>
      `;

      // 지원사업(support_program)은 입찰과 성격이 달라 상세 탭을 재구성한다
      // (B-1, UI만/백엔드·데이터 무변경): 판정·낙찰이력 탭 숨김, 참가조건→
      // "신청 안내"·제출서류→"첨부·서류" 라벨, "신청 안내"를 기본 탭으로.
      // applicationStartAt/departmentName은 상세 DTO에 없어 현재 보유 필드만
      // 쓰고, 신청 시작일·지원대상·신청서류 등은 원문 공고 링크로 안내한다.
      const isSupport = n.noticeType === 'support_program';
      // V3(2026-08-11): 탭형 → 단일 스크롤 상세 + sticky anchor nav. 콘텐츠를 모두 한 페이지에
      // 연속 렌더하고, 상단 nav 클릭은 콘텐츠 교체가 아니라 해당 섹션으로 smooth scroll한다.
      // 기존 render 함수/데이터/컨테이너 id를 그대로 재사용(추가 API 호출 없음).
      // ── 참가조건 섹션 본문(핵심조건 → 진행정보 → 상세정보 → 참가자격 → 계산기) ──
      const condBody = isSupport ? `
          <dl class="detail-meta">
            <div><dt>소관기관</dt><dd>${escapeHtml(n.organizationName || '-')}</dd></div>
            <div><dt>지원분야</dt><dd>${escapeHtml(n.industry || '-')}</dd></div>
            <div><dt>신청 마감</dt><dd>${ddayBadgeHtml(n.applicationEndAt, 'dday-badge--inline')}<span class="mono">${formatDate(n.applicationEndAt)}</span></dd></div>
            <div><dt>상태</dt><dd>${statusBadgeHtml(n.status)}</dd></div>
            <div><dt>공고 게시</dt><dd class="mono">${n.publishedAt ? formatDate(n.publishedAt) : '-'}</dd></div>
          </dl>
          <div id="support-detail-section"></div>
          <div id="support-conditions-section"></div>
        ` : `
          <div class="cond-essentials">
            <span class="cond-essential cond-essential--status">${statusBadgeHtml(n.status)}</span>
            <span class="cond-essential-sep" aria-hidden="true"></span>
            <span class="cond-essential"><span class="cond-essential-label">마감</span>${ddayBadgeHtml(n.applicationEndAt, 'dday-badge--inline')}<span class="cond-essential-val">${formatKoreanDate(n.applicationEndAt)}</span></span>
            <span class="cond-essential-sep" aria-hidden="true"></span>
            <span class="cond-essential"><span class="cond-essential-label">예산</span><span class="cond-essential-val">${formatBudget(n.budgetAmount)}</span></span>
          </div>
          <div class="cond-blocks">
            <section class="cond-block">
              ${sectionHeadHtml('clipboard-check', '핵심 참가조건')}
              <div id="core-conditions-section"></div>
            </section>
            <div id="bid-timeline-section" class="cond-block"></div>
            <section class="cond-block">
              ${sectionHeadHtml('file-text', '공고 상세정보')}
              <div id="notice-detail-info-section"></div>
            </section>
            <section class="cond-block">
              ${sectionHeadHtml('shield-check', '참가자격 요건')}
              ${extractionBannerHtml}
              <div id="eligibility-conditions-section"></div>
            </section>
            <section class="cond-block cond-block--tool">
              ${sectionHeadHtml('calculator', '적격심사 계산기', { right: '<span class="badge-soft">자체 참고용</span>' })}
              <div id="bid-calculator-section"></div>
            </section>
          </div>
        `;
      // ── 제출서류 섹션 본문 ──
      const docBody = isSupport ? `
          <div id="attachments-section"></div>
        ` : `
          ${extractionBannerHtml}
          <div id="required-documents-section"></div>
          <h4 class="cond-subgroup-title">첨부파일</h4>
          <div id="attachments-section"></div>
        `;
      // ── 변경이력 섹션 본문 ──
      const changesBody = `
          ${changeRows
            ? `<div class="table-scroll"><table>
                <thead><tr><th>항목</th><th>이전 값</th><th>변경 값</th><th>중요도</th><th>일시</th></tr></thead>
                <tbody>${changeRows}</tbody>
              </table></div>`
            : '<p class="section-empty">확인된 변경이력이 없습니다.</p>'}
          <div id="change-impact-section"></div>`;
      // ── AI 요약 섹션 본문 ──
      const summaryBody = `${isSupport ? '<p class="detail-sub">이 지원사업의 핵심 안내는 위 "신청 안내"와 원문 공고를 확인해주세요.</p>' : ''}<div id="ai-summary-section"></div>`;

      const sectionDefs = isSupport
        ? [
            ['conditions', 'clipboard-check', '신청 안내', '신청 전 확인해야 할 핵심 조건입니다.', condBody],
            ['documents', 'file-text', '첨부·서류', '신청 시 확인해야 할 서류입니다.', docBody],
            ['changes', 'repeat', '변경이력', '공고 변경사항을 확인합니다.', changesBody],
            ['summary', 'info', '요약', 'AI가 정리한 공고 핵심내용입니다.', summaryBody],

        : [

            ['documents', 'file-text', '제출서류', '참여를 위해 확인해야 할 서류입니다.', docBody],
            ['awards', 'award', '낙찰정보', '확인된 낙찰 데이터를 보여줍니다.', '<div id="award-history-section"></div>'],
            ['changes', 'repeat', '변경이력', '공고 변경사항을 확인합니다.', changesBody],
            ['summary', 'info', 'AI 요약', 'AI가 정리한 공고 핵심내용입니다.', summaryBody],
          ];
      const navHtml = sectionDefs.map(([id, , label], i) =>

      renderParticipationSection(document.getElementById('ai-participation-section'), data.participationScore, data.confidenceTier);
      renderChangeImpact(document.getElementById('change-impact-section'), data.changeImpact);
      renderBidTimeline(document.getElementById('bid-timeline-section'), data.detail, n);
      renderCoreConditions(document.getElementById('core-conditions-section'), data.detail, data.participationRegions, data.licenseLimits, n, data.participationRegionStatus);
      renderNoticeDetailInfo(document.getElementById('notice-detail-info-section'), data.detail, data.participationRegions, data.licenseLimits, data.participationRegionStatus);
      renderBidCalculator(document.getElementById('bid-calculator-section'), data.detail);

        // "사업 신청하기" CTA를 "신청 안내" 탭에, 첨부는 공고문/별첨자료로 나눠 표시.
        renderSupportProgramDetail(document.getElementById('support-detail-section'), data.supportDetail, n);
        renderSupportConditions(document.getElementById('support-conditions-section'), data.supportConditions, n);
        renderSupportAttachments(document.getElementById('attachments-section'), data.attachments || []);
      } else {
        renderAttachments(document.getElementById('attachments-section'), data.attachments || []);
        renderRequiredDocuments(document.getElementById('required-documents-section'), data.requiredDocuments || [], id, data.documentReadiness, data.documentAnalysisStatus, n.officialUrl);
      }
      renderEligibilityConditions(document.getElementById('eligibility-conditions-section'), data.eligibilityConditions || [], data.documentAnalysisStatus, n.officialUrl);
      // 면허·인증 요건 확인(회사 보유 여부=적합성)은 참여판정 영역에서만 표시한다(참가조건 중복 제거, 2026-08-12).
      renderAwardHistory(document.getElementById('award-history-section'), data.organizationAwardHistory, data.hasCompetitiveOverlap);
      renderPipelineReviewAction(document.getElementById('pipeline-review-action'), id, data.existingPipelineEntryId);
      wireDetailTabs(body);
    })
    .catch(err => {
      body.className = 'error';
      body.textContent = err.message;
    });
}

// wireDetailTabs — 2026-08-06, 공고상세 스크롤형→탭 구조 전환. 각 탭
// 패널 안의 서브 렌더 함수(renderAISummary 등)는 컨테이너 id만 보고
// DOM 어디에 있는지 신경 안 쓰므로, 이 함수는 순수하게 탭 버튼 클릭 →
// 해당 패널만 보이기(hidden 토글) + 스크롤 위치 초기화만 담당한다.
// wireDetailTabs — V3(2026-08-11): 탭 콘텐츠 교체 → sticky anchor nav. nav 클릭 시 해당 섹션으로
// smooth scroll하고, 사용자가 직접 스크롤할 땐 IntersectionObserver로 현재 섹션을 active로 갱신(scroll
// spy). 모든 섹션은 항상 렌더돼 있으므로 show/hide가 없다. prefers-reduced-motion 시 즉시 이동.
function wireDetailTabs(body) {
  const nav = body.querySelector('.detail-nav');
  if (!nav) return;
  const items = [...nav.querySelectorAll('.detail-nav-item')];
  const sections = items.map(a => body.querySelector('#section-' + a.dataset.section)).filter(Boolean);
  let navLock = 0; // 클릭 스크롤 중 scroll spy가 덮어쓰지 않게 하는 시간 잠금

  const setActive = (id) => {
    items.forEach(a => {
      const on = a.dataset.section === id;
      a.classList.toggle('is-active', on);
      a.setAttribute('aria-current', on ? 'true' : 'false');
    });
  };

  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  items.forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const sec = body.querySelector('#section-' + a.dataset.section);
      if (!sec) return;
      setActive(a.dataset.section);
      navLock = Date.now();
      sec.scrollIntoView({ behavior: prefersReduced ? 'auto' : 'smooth', block: 'start' });
      // 활성 nav 항목이 가로 스크롤 밖이면 보이게(모바일)
      a.scrollIntoView({ block: 'nearest', inline: 'center' });
    });
  });

  // scroll spy — sticky nav 아래 상단 밴드에 들어온 섹션을 active로.
  if ('IntersectionObserver' in window && sections.length) {
    const io = new IntersectionObserver((entries) => {
      if (Date.now() - navLock < 700) return; // 클릭 스크롤 애니메이션 중엔 무시
      const visible = entries.filter(en => en.isIntersecting)
        .sort((x, y) => x.boundingClientRect.top - y.boundingClientRect.top);
      if (visible.length) setActive(visible[0].target.dataset.section);
    }, { rootMargin: '-100px 0px -62% 0px', threshold: 0 });
    sections.forEach(s => io.observe(s));
    // HERO만 보이는 최상단에선 어떤 섹션도 active 밴드에 없어 stale해질 수 있어, 첫 섹션으로 고정.
    window.addEventListener('scroll', () => {
      if (Date.now() - navLock < 700) return;
      if (sections[0].getBoundingClientRect().top > 140) setActive(sections[0].dataset.section);
    }, { passive: true });
  }
}

// renderPipelineReviewAction — 원클릭 참여검토(Phase 1)의 공고 상세 상단
// 액션 3종: "참여 검토 시작" / "제외" / "담당자에게 전달". 서버가 미리
// 알려주는 existingPipelineEntryId로 재방문 시 상태를 바로 인지한다(이미
// 파이프라인에 있으면 버튼 대신 "진행 중 → 이동" 링크).
function renderPipelineReviewAction(container, noticeId, existingPipelineEntryId) {
  container.innerHTML = '';
  if (!currentUser) return;

  if (existingPipelineEntryId) {
    renderAlreadyInPipeline(container, noticeId, existingPipelineEntryId);
    return;
  }
  renderPipelineReviewButtons(container, noticeId);
}

function renderAlreadyInPipeline(container, noticeId, entryId) {
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="notice-action-bar">
      <a href="#/pipeline/${escapeAttr(entryId)}" class="pipeline-review-btn" style="text-decoration:none;display:inline-block">진행 중 &middot; 워크스페이스로 이동 &rarr;</a>
      <button type="button" id="notice-cancel-review-btn" class="btn btn-secondary btn-sm pipeline-cancel-btn">참여 취소</button>
      <button type="button" id="share-notice-btn" class="btn btn-secondary btn-sm">담당자에게 전달</button>
    </div>
    <div id="cancel-review-result"></div>
    <div id="share-notice-form-slot"></div>
  `));
  wireShareNoticeButton(container, noticeId);

  // 참여 취소 — 공고 상세에서도 바로 취소. 진행 중 사업에서 "제외"로 남기지 않고
  // 완전 삭제한다(실수 클릭이 목록에 계속 남는 불편 제거). 삭제 후엔 다시
  // "참여 검토 시작"을 눌러 언제든 재검토할 수 있게 검토 버튼으로 되돌린다.
  const cancelBtn = document.getElementById('notice-cancel-review-btn');
  cancelBtn.addEventListener('click', () => {
    openConfirmModal({
      title: '참여 취소',
      message: '이 공고의 참여 검토를 취소하시겠습니까? 진행 중 사업 목록에서 완전히 삭제됩니다.',
      confirmLabel: '참여 취소',
      tone: 'danger',
      onConfirm: async () => {
        await apiRequest('DELETE', '/api/pipeline/' + encodeURIComponent(entryId));
        showToast('참여 검토를 취소했습니다.', 'success');
        renderPipelineReviewButtons(container, noticeId);
      },
    });
  });
}

function renderPipelineReviewButtons(container, noticeId) {
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="notice-action-bar">
      <button type="button" id="pipeline-review-btn" class="pipeline-review-btn">참여할게요</button>
      <button type="button" id="exclude-notice-btn" class="btn btn-secondary btn-sm">제외</button>
      <button type="button" id="share-notice-btn" class="btn btn-secondary btn-sm">담당자에게 전달</button>
    </div>
    <p id="pipeline-review-error" class="error" style="display:none"></p>
    <div id="exclude-notice-result"></div>
    <div id="share-notice-form-slot"></div>
  `));

  // "참여할게요" — 참여 흐름 2클릭화(2026-08-10). 검토중을 거치지 않고 한 번의
  // 요청으로 곧바로 "준비중"(제출 준비 단계)으로 담고 워크스페이스로 이동한다.
  document.getElementById('pipeline-review-btn').addEventListener('click', async () => {
    const btn = document.getElementById('pipeline-review-btn');
    const errEl = document.getElementById('pipeline-review-error');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = '담는 중...';
    try {
      const entry = await apiRequest('POST', '/api/notices/' + encodeURIComponent(noticeId) + '/pipeline', { targetStatus: '준비중' });
      // 완료 기준: 자동으로 진행 화면(워크스페이스)까지 이동한다 —
      // 링크를 보여주고 한 번 더 클릭하게 하지 않는다.
      location.hash = '#/pipeline/' + entry.id;
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '참여할게요';
      if (err.status === 401) { location.hash = '#/auth/login'; return; }
      if (err.status === 400 && err.code === 'company_profile_required') {
        errEl.innerHTML = '회사 정보를 등록하면 참여할 수 있습니다. <a href="#/me/company">기업 프로필 등록하기 →</a>';
      } else if (err.code === 'pipeline_quota_exceeded') {
        const limit = err.data && err.data.limit;
        const base = limit ? '현재 플랜의 파이프라인 등록 한도(' + limit + '건)에 도달했습니다.' : ERROR_MESSAGES.pipeline_quota_exceeded;
        errEl.innerHTML = base + ' 진행 중인 건을 정리하거나 <a href="#/billing/plans">플랜을 업그레이드</a>해주세요.';
      } else {
        errEl.textContent = err.message;
      }
      errEl.style.display = 'block';
    }
  });

  wireExcludeNoticeButton(container, noticeId);
  wireShareNoticeButton(container, noticeId);
}

// wireExcludeNoticeButton — "제외" 클릭 시 바로 실행(확인창 없음 — 원복
// 가능하니 별도 확인 절차로 흐름을 끊지 않는다). 실행 후 되돌리기 버튼을
// 보여주고, 되돌리기는 PATCH /api/pipeline/{id}(status='검토중')로 되살린다
// (오류 시 원복 가능 요건).
function wireExcludeNoticeButton(container, noticeId) {
  const btn = container.querySelector('#exclude-notice-btn');
  const resultEl = container.querySelector('#exclude-notice-result');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      const res = await apiRequest('POST', '/api/notices/' + encodeURIComponent(noticeId) + '/exclude', {});
      if (res.alreadyExists) {
        resultEl.innerHTML = `<p class="auth-step-hint">이미 파이프라인에 있는 공고입니다. <a href="#/pipeline/${escapeAttr(res.id)}">진행 화면으로 이동 &rarr;</a></p>`;
        return;
      }
      container.querySelector('.notice-action-bar').style.display = 'none';
      resultEl.innerHTML = `<p class="auth-step-hint">이 공고를 제외했습니다. <button type="button" id="undo-exclude-btn" class="link-btn">되돌리기</button></p>`;
      resultEl.querySelector('#undo-exclude-btn').addEventListener('click', async () => {
        try {
          await apiRequest('PATCH', '/api/pipeline/' + encodeURIComponent(res.id), { status: '검토중' });
          renderPipelineReviewButtons(container, noticeId);
        } catch (err) {
          resultEl.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
        }
      });
    } catch (err) {
      btn.disabled = false;
      if (err.status === 401) { location.hash = '#/auth/login'; return; }
      resultEl.innerHTML = `<p class="error">${escapeHtml(err.status === 400 && err.code === 'company_profile_required'
        ? '회사 정보를 등록하면 제외 처리를 할 수 있습니다.' : err.message)}</p>`;
    }
  });
}

// wireShareNoticeButton — "담당자에게 전달" 클릭 시 이메일 입력 폼을
// 펼친다(별도 화면 이동 없이 그 자리에서). 등록된 담당자가 있으면
// datalist로 추천해 매번 새로 입력하지 않게 한다.
function wireShareNoticeButton(container, noticeId) {
  const btn = container.querySelector('#share-notice-btn');
  const slot = container.querySelector('#share-notice-form-slot');
  btn.addEventListener('click', async () => {
    if (slot.querySelector('form')) { slot.innerHTML = ''; return; }
    let contactOptions = '';
    try {
      const data = await apiRequest('GET', '/api/me/contacts');
      contactOptions = (data.items || []).filter(c => c.email).map(c => `<option value="${escapeAttr(c.email)}">`).join('');
    } catch (err) { /* 담당자 목록은 편의용 — 실패해도 직접 입력은 가능하므로 조용히 무시 */ }

    slot.innerHTML = `
      <form id="share-notice-form" class="profile-form" style="flex-direction:row;flex-wrap:wrap;gap:0.5rem;align-items:flex-end;margin-top:0.75rem">
        <label style="flex:1;min-width:220px">전달받을 이메일
          <input type="email" name="email" list="share-contact-emails" placeholder="example@company.com" required>
          <datalist id="share-contact-emails">${contactOptions}</datalist>
        </label>
        <button type="submit" class="btn btn-primary btn-sm">보내기</button>
      </form>
      <div id="share-notice-result"></div>
    `;
    const form = slot.querySelector('#share-notice-form');
    const resultEl = slot.querySelector('#share-notice-result');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      resultEl.innerHTML = '';
      try {
        await apiRequest('POST', '/api/notices/' + encodeURIComponent(noticeId) + '/share', {
          email: new FormData(form).get('email'),
        });
        showToast('전달했습니다.', 'success');
        form.reset();
      } catch (err) {
        resultEl.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
      }
      submitBtn.disabled = false;
    });
  });
}

// renderNoticeReport — 등급/AI 요약/자격조건처럼 이미 계산·저장되어 있는
// 데이터를 인쇄용 한 페이지로 조합한 "참여판단 보고서". 새로 계산하는
// 값은 없다 — GET /api/notices/{id}가 이미 내려주는 것을 재구성만 한다.
// PDF 파일 자체는 서버가 만들지 않고 브라우저 인쇄 대화상자의 "PDF로
// 저장"을 이용한다(@media print로 사이드바/탭바/버튼만 숨김) — 새 Go
// 의존성이나 한글 폰트 임베딩 없이 화면과 동일한 결과물을 얻기 위함.
async function renderNoticeReport(container, id) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/notices/' + encodeURIComponent(id));
  } catch (err) {
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  const n = data.notice;
  const score = data.participationScore;
  const summary = data.aiSummary;
  const conditions = data.eligibilityConditions || [];

  const gradeSectionHtml = score ? `
    <section class="report-section">
      <h3 class="report-section-title">종합 판정</h3>
      <div class="report-grade-head">
        ${gradeBadgeHtml(score.grade, GRADE_LABELS[score.grade] || score.grade)}
        <span class="report-grade-score">${score.totalCount}개 중 ${score.metCount}개 충족</span>
      </div>
      ${score.gradeReason ? `<p class="report-grade-reason">${escapeHtml(score.gradeReason)}</p>` : ''}
      <table class="report-table">
        <thead><tr><th>항목</th><th>결과</th><th>사유</th></tr></thead>
        <tbody>
          ${score.categories.map(c => `
            <tr>
              <td>${escapeHtml(c.category)}</td>
              <td>${escapeHtml(ELIGIBILITY_RESULT_LABELS[c.result] || c.result)}</td>
              <td>${escapeHtml(c.reason)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </section>
  ` : `
    <section class="report-section">
      <h3 class="report-section-title">종합 판정</h3>
      <p class="section-empty">로그인 후 회사 프로필을 등록하면 이 공고에 대한 등급 분석이 포함됩니다.</p>
    </section>
  `;

  const summaryHtml = (summary && summary.lines && summary.lines.length) ? `
    <section class="report-section">
      <h3 class="report-section-title">핵심 요약</h3>
      <ul class="report-summary-list">${summary.lines.map(l => `<li>${escapeHtml(l)}</li>`).join('')}</ul>
      <p class="report-meta-caption">AI 요약 · ${escapeHtml(summary.model || '')} · ${formatDateTime(summary.generatedAt)}</p>
    </section>
  ` : `
    <section class="report-section">
      <h3 class="report-section-title">핵심 요약</h3>
      <p class="section-empty">아직 요약이 생성되지 않았습니다.</p>
    </section>
  `;

  const conditionsHtml = conditions.length ? `
    <section class="report-section">
      <h3 class="report-section-title">참가자격 요건 (문서 기반)</h3>
      <ul class="report-condition-list">
        ${conditions.map(it => `
          <li class="report-condition-item">
            <p class="report-condition-name"><strong>${escapeHtml(CONDITION_CATEGORY_LABELS[it.category] || it.category)}</strong> — ${escapeHtml(it.conditionName)}</p>
            <blockquote class="source-quote">${escapeHtml(it.sourceText)}</blockquote>
          </li>
        `).join('')}
      </ul>
    </section>
  ` : `
    <section class="report-section">
      <h3 class="report-section-title">참가자격 요건 (문서 기반)</h3>
      <p class="section-empty">문서에서 추출된 참가자격 요건이 없습니다.</p>
    </section>
  `;

  container.innerHTML = '';
  container.appendChild(h(`
    <div class="no-print report-actions">
      <a href="#/notices/${escapeAttr(id)}" class="back-link">&larr; 공고 상세로 돌아가기</a>
      <button type="button" class="btn btn-primary" id="report-print-btn">인쇄 / PDF로 저장</button>
    </div>
    <div class="report-page">
      <p class="report-doc-title">참여판단 보고서</p>
      <h2 class="report-notice-title">${escapeHtml(n.title)}</h2>
      <dl class="detail-meta">
        <div><dt>발주기관</dt><dd>${escapeHtml(n.organizationName || '-')}</dd></div>
        <div><dt>지역</dt><dd>${escapeHtml(n.region || '-')}</dd></div>
        <div><dt>업종</dt><dd>${escapeHtml(n.industry || '-')}</dd></div>
        <div><dt>예산</dt><dd class="mono">${formatBudget(n.budgetAmount)}</dd></div>
        <div><dt>마감일</dt><dd class="mono">${formatDate(n.applicationEndAt)}</dd></div>
      </dl>
      ${gradeSectionHtml}
      ${summaryHtml}
      ${conditionsHtml}
      <p class="report-footer-note">⚠ 이 보고서는 등록된 회사 정보와 공고 정보만으로 계산한 참고용 자료입니다. 최종 참여 여부는 원문 공고를 직접 확인한 후 결정하세요. 생성일시: ${formatDateTime(new Date().toISOString())}</p>
    </div>
  `));

  document.getElementById('report-print-btn').addEventListener('click', () => window.print());
}

// g2b 원문 JSON(raw_documents.raw_content)에서 그때그때 파싱한 상세 필드.
// 지역제한은 이 데이터 소스(목록조회 API)에 판단기준 텍스트만 있고 구체적인
// 지역명 목록 자체가 없어, 표로 꾸미지 않고 있는 그대로(판단기준 문구 또는
// "확인 불가")를 보여준다 — 없는 데이터를 있는 것처럼 표로 만들지 않는다.
// bidTimelineStage — 공식 일정 + 현재시각만으로 입찰 진행단계를 deterministic 계산(AI 없음).
// 취소/재공고 status가 최우선, 그다음 시각 비교. 필요한 일정(제출시작/마감)이 없으면 계산 보류.
// 없는 날짜는 추정하지 않는다.
function bidTimelineStage(detail, status, nowMs) {
  if (status === 'cancelled') return { key: 'cancelled', label: '취소됨', tone: 'fail' };
  if (status === 'reannounced') return { key: 'reannounced', label: '재공고', tone: 'warn' };
  const ms = v => { const t = v ? Date.parse(v) : NaN; return isNaN(t) ? null : t; };
  const S = ms(detail.applicationStartAt), E = ms(detail.applicationEndAt), O = ms(detail.bidOpeningAt);
  if (S == null || E == null) return { key: 'unknown', label: '일정 확인 필요', tone: 'muted' };
  if (nowMs < S) return { key: 'before', label: '접수 준비', tone: 'muted' };
  if (nowMs < E) return { key: 'receiving', label: '입찰서 접수중', tone: 'active' };
  if (O != null && nowMs < O) return { key: 'awaiting', label: '개찰 대기', tone: 'warn' };
  if (O != null && nowMs >= O) return { key: 'opened', label: '개찰 완료', tone: 'done' };
  return { key: 'closed', label: '제출 마감', tone: 'muted' };
}

// renderBidTimeline — 공고 상세 "입찰 진행정보" 세로 타임라인 + 현재 단계 강조(2026-08-11).
// 기존 Detail DTO 값만 사용(신규 API/DB/계산 데이터 없음). 값 없는 단계는 렌더하지 않는다.
function renderBidTimeline(container, detail, notice) {
  if (!container) return;
  container.innerHTML = '';
  if (!detail) return;
  const esc = escapeHtml;
  const nowMs = Date.now();
  const status = notice && notice.status;

  // 단계 노드 — 값 있는 것만, 시각순 정렬.
  const nodes = [];
  const add = (label, iso, place) => { const t = iso ? Date.parse(iso) : NaN; if (!isNaN(t)) nodes.push({ label, iso, ms: t, place: place || '' }); };
  add('공고 게시', detail.publishedAt);
  add('입찰서 제출 시작', detail.applicationStartAt);
  add('현장설명회', detail.briefingAt, detail.briefingPlace);
  add('참가자격 등록 마감', detail.qualificationDeadlineAt);
  add('입찰서 제출 마감', detail.applicationEndAt);
  add('개찰', detail.bidOpeningAt, detail.openingPlace);
  // 재입찰 개찰 — 실제로 존재하고 개찰과 다른 시각일 때만(같은 값이면 개찰과 중복이라 숨김,
  // 재입찰 허용이라는 이유만으로 가짜 단계를 만들지 않는다).
  if (detail.rebidOpeningAt && !isNaN(Date.parse(detail.rebidOpeningAt)) && detail.rebidOpeningAt !== detail.bidOpeningAt) {
    add('재입찰 개찰', detail.rebidOpeningAt);
  }
  if (!nodes.length) return; // 표시할 일정이 전혀 없으면 섹션 숨김
  nodes.sort((a, b) => a.ms - b.ms);

  // 다음 예정 노드(가장 이른 미래) 하나만 "다음 일정"으로 강조.
  const nextIdx = nodes.findIndex(nd => nd.ms >= nowMs);

  const stage = bidTimelineStage(detail, status, nowMs);
  const stageToneCls = { active: 'bts--active', warn: 'bts--warn', done: 'bts--done', fail: 'bts--fail', muted: 'bts--muted' }[stage.tone] || 'bts--muted';

  const badges = [];
  if (detail.bidMethod) badges.push(esc(detail.bidMethod));
  if (detail.jointContractMethod) badges.push(esc(detail.jointContractMethod));
  if (detail.rebidAllowed === true) badges.push('재입찰 허용');
  else if (detail.rebidAllowed === false) badges.push('재입찰 불허');
  const badgeHtml = badges.map(b => `<span class="bt-badge">${b}</span>`).join('');

  // 단계 상태: 완료(past·muted+체크) / 현재=다음 예정(next·blue) / 예정(future·gray).
  // 위험/마감초과 같은 실제 위험이 아닌 일반 단계엔 red를 쓰지 않는다.
  const checkIcon = '<svg class="bt-check" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';
  const nodesHtml = nodes.map((nd, i) => {
    let cls = 'bt-node';
    let tag = '';
    let dotInner = '';
    if (i === nextIdx) {
      cls += ' bt-node--next';
      // "다음 일정" + 기존 D-day 계산값(D-14/오늘/내일)을 작은 badge로.
      tag = `<span class="bt-node-tag">다음 일정</span>${ddayBadgeHtml(nd.iso, 'dday-badge--inline')}`;
    } else if (nd.ms < nowMs) { cls += ' bt-node--past'; dotInner = checkIcon; }
    else { cls += ' bt-node--future'; }
    return `<li class="${cls}">
      <span class="bt-dot">${dotInner}</span>
      <div class="bt-node-body">
        <div class="bt-node-main">
          <div class="bt-node-label">${esc(nd.label)}${tag}</div>
          <div class="bt-node-when"><span class="bt-node-date">${formatKoreanDate(nd.iso)}</span><span class="bt-node-clock">${formatKoreanTime(nd.iso)}</span></div>
        </div>
        ${nd.place ? `<div class="bt-node-place">${esc(nd.place)}</div>` : ''}
      </div>
    </li>`;
  }).join('');

  container.appendChild(h(`
    <section class="bid-timeline">
      ${sectionHeadHtml('clock', '입찰 진행정보', { right: `<span class="bt-stage ${stageToneCls}">${esc(stage.label)}</span>` })}
      ${badgeHtml ? `<div class="bt-badges">${badgeHtml}</div>` : ''}
      <ul class="bt-list">${nodesHtml}</ul>
    </section>
  `));
}

// renderCoreConditions — 참가조건 탭 최상단 "핵심 참가조건"(2026-08-11 Phase 1). 실무자가
// 5초 안에 판단할 수 있게 지역·업종·면허·공동수급·국제입찰·재입찰 6개만 grid로 보여준다.
// 값은 전부 기존 DTO(detail) + Phase C 공식 보강(participationRegions/licenseLimits)에서 오고,
// 값이 없으면 "확인 필요"로 표시할 뿐 지어내지 않는다. 카드로 만들지 않고 label/value 계층만 준다.
function renderCoreConditions(container, detail, participationRegions, licenseLimits, notice, participationRegionStatus) {
  if (!container) return;
  container.innerHTML = '';
  const esc = escapeHtml;
  const d = detail || {};
  const regions = Array.isArray(participationRegions) ? participationRegions : [];
  const licenses = Array.isArray(licenseLimits) ? licenseLimits : [];
  const ynLabel = (b, yes, no) => b === true ? yes : b === false ? no : null;

  // 지역: 공식 참가가능지역(authoritative)만 확정값으로 표시한다. 추론값(notices.region)은
  // 신뢰할 수 없어 확정처럼 쓰지 않는다 — 미수집(unknown)이면 '확인 필요'로 둔다.
  //   restricted    → 공식 제한지역 목록
  //   confirmed_all → 전국(공식 확인)
  //   unknown       → 확인 필요(값 null)
  const regionStatus = participationRegionStatus || (regions.length ? 'restricted' : 'unknown');
  let regionVal = null, regionOfficial = false;
  if (regions.length) { regionVal = regions.map(esc).join(' · '); regionOfficial = true; }
  else if (regionStatus === 'confirmed_all') { regionVal = '전국'; regionOfficial = true; }
  const industryVal = (notice && notice.industry) ? esc(notice.industry) : null;
  const licenseVal = licenses.length ? licenses.map(l => esc(l.name)).join(', ') : null;
  const jointVal = d.jointContractMethod ? esc(d.jointContractMethod) : null;
  const intlVal = ynLabel(d.internationalBid, '대상', '비대상');
  const rebidVal = ynLabel(d.rebidAllowed, '허용', '불허');

  // [아이콘, 라벨, 값(null이면 '확인 필요'), 공식배지여부] — 아이콘/라벨/값 3단계 위계.
  const items = [
    ['map-pin', '지역', regionVal, regionOfficial],
    ['briefcase', '업종', industryVal, false],
    ['award', '면허·자격', licenseVal, licenses.length > 0],
    ['users', '공동수급', jointVal, false],
    ['globe', '국제입찰', intlVal, false],
    ['repeat', '재입찰', rebidVal, false],
  ];
  const cells = items.map(([, label, val, official]) => `
    <div class="core-cond-cell">
      <dt class="core-cond-label">${esc(label)}${official ? ' <span class="detail-source-badge">공식</span>' : ''}</dt>
      <dd class="core-cond-value${val ? '' : ' core-cond-value--muted'}">${val || '확인 필요'}</dd>
    </div>`).join('');

  container.appendChild(h(`<dl class="core-conditions">${cells}</dl>`));
}

// renderNoticeDetailInfo — 공고 상세정보를 나라장터 정보구조에 가깝게 그룹별로 보여준다
// (Phase B, 2026-08-11). 모든 값은 나라장터 공식 API(raw_content)에서 온 것이고, 값이 없는
// 행/그룹은 아예 만들지 않는다(빈 행 금지). 참가가능지역·허용업종/면허·기초금액은 Phase C.
function renderNoticeDetailInfo(container, detail, participationRegions, licenseLimits, participationRegionStatus) {
  if (!container) return;
  container.innerHTML = '';
  if (!detail) {
    container.appendChild(h('<p class="section-empty">원문 상세 데이터를 확인할 수 없습니다.</p>'));
    return;
  }
  const regions = Array.isArray(participationRegions) ? participationRegions : [];
  const licenses = Array.isArray(licenseLimits) ? licenseLimits : [];
  const esc = escapeHtml;
  const won = v => `<span class="mono">${formatBudget(v)}</span>`;
  const dt = v => `<span>${formatKoreanDateTime(v)}</span>`;
  const has = v => v !== null && v !== undefined && v !== '';

  const noticeNoVal = has(detail.noticeNo)
    ? esc(detail.noticeNo) + (has(detail.noticeOrd) ? ` <span class="detail-sub">차수 ${esc(detail.noticeOrd)}</span>` : '')
    : null;
  const awardVal = has(detail.awardMethod)
    ? esc(detail.awardMethod) + (has(detail.awardMethodDetail) ? `<span class="detail-sub">${esc(detail.awardMethodDetail)}</span>` : '')
    : null;
  // 담당자 개인정보 마스킹 — 서버가 표시값(officerName/Phone/Email)을 이미 마스킹/원본으로 내려준다.
  // officerMasked면 (?) 안내, officerCanReveal(참여검토 시작)이면 [공개] 버튼을 띄우고 클릭 시
  // data-full(원본)로 즉시 전환한다(페이지 이동 없음). 마스킹 안 됐으면(운영자) 그대로 표시.
  const maskSpan = (v, full) => `<span class="officer-maskable" data-full="${escapeAttr(full || '')}">${esc(v)}</span>`;
  const officerControls = detail.officerMasked
    ? `<span class="officer-controls">${tooltipIconHtml('?', '개인정보보호를 위해 담당자 정보는 일부만 표시됩니다. 참여를 검토 중인 공고는 전체 정보를 확인할 수 있습니다.', '담당자 정보 마스킹 안내', '')}${detail.officerCanReveal ? '<button type="button" class="btn btn-secondary btn-sm officer-reveal-btn" data-officer-reveal>공개</button>' : ''}</span>`
    : '';
  const officerVal = has(detail.officerName)
    ? (detail.officerMasked
        ? `${maskSpan(detail.officerName, detail.officerFullName)}${has(detail.officerPhone) ? ' ' + maskSpan(detail.officerPhone, detail.officerFullPhone) : ''}${officerControls}`
        : esc(detail.officerName) + (has(detail.officerPhone) ? ` <span class="mono">${esc(detail.officerPhone)}</span>` : ''))
    : null;
  const officerEmailVal = has(detail.officerEmail)
    ? (detail.officerMasked ? maskSpan(detail.officerEmail, detail.officerFullEmail) : esc(detail.officerEmail))
    : null;
  const priceCountVal = (detail.priceDrawCount != null || detail.priceTotalCount != null)
    ? `<span class="mono">추첨 ${detail.priceDrawCount != null ? detail.priceDrawCount : '-'} / 전체 ${detail.priceTotalCount != null ? detail.priceTotalCount : '-'}</span>`
    : null;
  const briefingVal = has(detail.briefingAt)
    ? dt(detail.briefingAt) + (has(detail.briefingPlace) ? ` <span class="detail-sub">${esc(detail.briefingPlace)}</span>` : '')
    : (has(detail.briefingPlace) ? esc(detail.briefingPlace) : null);
  const ynLabel = (b, yes, no) => b === true ? yes : b === false ? no : null;

  // [그룹명, [[라벨, 값(null이면 생략)], ...]]
  // 그룹 배치(2026-08-11 Phase 1) — 기본/기관/입찰·낙찰/가격/참가자격. 입찰방식·계약방법·
  // 국제입찰·재입찰은 [입찰·낙찰정보]로, 예정가격 결정방법·예비가격 개수는 [가격정보]로 이관.
  const groups = [
    ['info', '기본정보', [
      ['공고번호', noticeNoVal],
      ['공고종류', has(detail.noticeKind) ? esc(detail.noticeKind) : null],
      ['용역구분', has(detail.serviceDivision) ? esc(detail.serviceDivision) : null],
      ['게시일시', has(detail.publishedAt) ? dt(detail.publishedAt) : null],
      ['참조번호', has(detail.referenceNo) ? esc(detail.referenceNo) : null],
      ['통합공고번호', has(detail.unifiedNoticeNo) ? esc(detail.unifiedNoticeNo) : null],
    ]],
    ['building', '기관정보', [
      ['공고기관', has(detail.noticeInstitution) ? esc(detail.noticeInstitution) : null],
      ['수요기관', has(detail.demandInstitution) ? esc(detail.demandInstitution) : null],
      ['담당자', officerVal],
      ['이메일', officerEmailVal],
    ]],
    ['gavel', '입찰·낙찰정보', [
      ['입찰방식', has(detail.bidMethod) ? esc(detail.bidMethod) : null],
      ['계약방법', has(detail.contractMethod) ? esc(detail.contractMethod) : null],
      ['낙찰방법', awardVal],
      ['낙찰하한율', has(detail.awardLowerLimitRate) ? `<span class="mono">${esc(detail.awardLowerLimitRate)}%</span>` : null],
      ['국제입찰', ynLabel(detail.internationalBid, '대상', '비대상')],
      ['재입찰', ynLabel(detail.rebidAllowed, '허용', '불허')],
      ['공동수급', has(detail.jointContractMethod) ? esc(detail.jointContractMethod) : null],
      ['개찰장소', has(detail.openingPlace) ? esc(detail.openingPlace) : null],
    ]],
    ['won', '가격정보', [
      ['배정예산', detail.assignedBudget != null ? won(detail.assignedBudget) : null],
      ['추정가격', detail.estimatedPrice != null ? won(detail.estimatedPrice) : null],
      ['부가가치세', detail.vat != null ? won(detail.vat) : null],
      ['입찰참가수수료', detail.participationFee != null ? won(detail.participationFee) : null],
      ['예정가격 결정방법', has(detail.prearrangedPriceMethod) ? esc(detail.prearrangedPriceMethod) : null],
      ['예비가격 개수', priceCountVal],
    ]],
    // [일정] 그룹은 상단 "입찰 진행정보" 타임라인으로 이관(중복 제거). 데이터(DTO)는 그대로 유지.
  ];

  const groupHtml = (icon, title, rows, extra) => {
    const dl = rows.filter(([, v]) => v != null).map(([label, v]) => `<div><dt>${esc(label)}</dt><dd>${v}</dd></div>`).join('');
    if (!dl) return '';
    return `<div class="detail-group"><h4 class="detail-group-title">${esc(title)}</h4><dl class="detail-meta">${dl}</dl>${extra || ''}</div>`;
  };

  // 참가자격 그룹 — 제한 플래그 + Phase C 공식 보강(참가가능지역/허용면허). 공식 API 값엔 [공식] 배지.
  const officialBadge = '<span class="detail-source-badge">공식</span>';
  // 데이터 "없음"과 "미수집"을 구분 — 공식 참가가능지역/면허 API 결과가 없으면 "정보 없음"이 아니라
  // "수집 전 / 확인 필요"로 상태를 정확히 표시한다(값을 지어내지 않는다). 지역제한/업종제한 플래그
  // 판단 로직은 이번 UI 패스에서 변경하지 않는다(공식지역 우선순위 이슈는 BUG로 별도 보고).
  const statusVal = (t) => `<span class="detail-data-status">${esc(t)}</span>`;
  const qualRowsHtml = [];
  const industryText = ynLabel(detail.industryRestricted, '있음', '없음');
  if (industryText) qualRowsHtml.push(`<div><dt>업종제한</dt><dd>${industryText}</dd></div>`);
  if (has(detail.regionRestrictionBasis)) qualRowsHtml.push(`<div><dt>지역제한</dt><dd>있음 <span class="detail-sub">판단기준: ${esc(detail.regionRestrictionBasis)}</span></dd></div>`);
  // 참가가능지역 — 공식 API가 authoritative. restricted=목록, confirmed_all=전국(공식확인), unknown=수집 전.
  const regionStatus = participationRegionStatus || (regions.length ? 'restricted' : 'unknown');
  if (regions.length) {
    qualRowsHtml.push(`<div><dt>참가가능지역 ${officialBadge}</dt><dd><div class="notice-chips">${regions.map(r => `<span class="notice-chip">${esc(r)}</span>`).join('')}</div></dd></div>`);
  } else if (regionStatus === 'confirmed_all') {
    qualRowsHtml.push(`<div><dt>참가가능지역 ${officialBadge}</dt><dd>전국 <span class="detail-sub">지역제한 없음(공식 확인)</span></dd></div>`);
  } else {
    qualRowsHtml.push(`<div><dt>참가가능지역</dt><dd>${statusVal('공식 참가가능지역 정보 수집 전')}</dd></div>`);
  }
  // 허용업종·면허 — 공식 API 값 우선, 없으면 "확인 필요" 상태.
  qualRowsHtml.push(licenses.length
    ? `<div><dt>허용업종·면허 ${officialBadge}</dt><dd><ul class="notice-license-list">${licenses.map(l => `<li>${esc(l.name)}${has(l.groupNo) ? ` <span class="detail-sub">그룹 ${esc(l.groupNo)}</span>` : ''}</li>`).join('')}</ul></dd></div>`
    : `<div><dt>허용업종·면허</dt><dd>${statusVal('면허·자격 세부조건 확인 필요')}</dd></div>`);
  const qualGroup = `<div class="detail-group"><h4 class="detail-group-title">참가자격</h4><dl class="detail-meta">${qualRowsHtml.join('')}</dl></div>`;

  const body = groups.map(([icon, t, r]) => groupHtml(icon, t, r)).join('') + qualGroup;

  container.appendChild(h(`
    <div class="detail-info-groups">${body || '<p class="section-empty">표시할 상세 정보가 없습니다.</p>'}</div>
  `));

  // [공개] — 참여검토 시작 사용자에게만 노출. 클릭 시 마스킹 span을 원본(data-full)으로 즉시
  // 전환하고 안내(?)·버튼을 없앤다(페이지 이동 없이 같은 화면에서 전환).
  const revealBtn = container.querySelector('[data-officer-reveal]');
  if (revealBtn) {
    revealBtn.addEventListener('click', () => {
      container.querySelectorAll('.officer-maskable').forEach(sp => {
        if (sp.dataset.full) { sp.textContent = sp.dataset.full; sp.classList.remove('officer-maskable'); }
      });
      const controls = container.querySelector('.officer-controls');
      if (controls) controls.remove();
    });
  }
}

// renderBidCalculator — 적격심사 참고용 계산기(2026-08-06). AI/서버 호출
// 없이 순수 클라이언트 산수만 한다: 투찰율 = 투찰금액/기준금액*100, 이
// 공고에 낙찰하한율이 있으면 그 값과 비교해 이상/미만만 보여준다.
// detail.estimatedPrice는 g2b 원문의 "추정가격"이라 발주기관이 사전에
// 산정하는 "예정가격"과 개념이 다를 수 있음(이 API는 예정가격 자체를
// 제공하지 않음) — 그래서 자동 채움은 시작값일 뿐이고, 실제 예정가격을
// 알면 사용자가 직접 고쳐 입력하는 걸 전제로 한다. 적격심사 통과 여부는
// 발주기관마다 세부기준(등급/신인도 등)이 달라 이 계산만으로 확정할 수
// 없으므로 "참고용" 문구를 반드시 함께 보여준다.
function renderBidCalculator(container, detail) {
  if (!container) return;
  container.innerHTML = '';
  const lowerLimitRate = detail && detail.awardLowerLimitRate ? parseFloat(detail.awardLowerLimitRate) : null;
  const estimatedPrice = detail && detail.estimatedPrice != null ? detail.estimatedPrice : null;
  container.appendChild(h(`
    <div class="calc-form">
      <p class="calc-note">참고용 계산입니다. 적격심사 통과 여부는 발주기관 기준에 따라 다를 수 있어 최종 판단은 공고문을 확인하세요.</p>
      <form id="bid-calculator-form" class="profile-form" onsubmit="return false;">
        <label>기준금액(예정가격, 원)<input type="text" inputmode="numeric" id="calc-base-price" value="${estimatedPrice != null ? escapeAttr(formatCurrency(estimatedPrice)) : ''}" placeholder="예: 100,000,000"></label>
        <label>투찰금액(원)<input type="text" inputmode="numeric" id="calc-bid-price" placeholder="예: 89,000,000"></label>
      </form>
      ${estimatedPrice != null ? '<p class="calc-note">기준금액은 공고의 "추정가격"으로 미리 채워졌습니다. 실제 예정가격과 다를 수 있어요.</p>' : ''}
      <div id="bid-calculator-result"></div>
    </div>
  `));

  const baseInput = document.getElementById('calc-base-price');
  const bidInput = document.getElementById('calc-bid-price');
  attachCurrencyAutoFormat(baseInput);
  attachCurrencyAutoFormat(bidInput);
  const resultEl = document.getElementById('bid-calculator-result');

  function recompute() {
    const base = Number(parseCurrencyInput(baseInput.value));
    const bid = Number(parseCurrencyInput(bidInput.value));
    if (!base || !bid) { resultEl.innerHTML = ''; return; }
    const rate = (bid / base) * 100;
    let judgmentHtml = '';
    if (lowerLimitRate != null && !isNaN(lowerLimitRate)) {
      const pass = rate >= lowerLimitRate;
      judgmentHtml = `<div><span class="restriction-label">낙찰하한율(${lowerLimitRate}%) 대비</span><span class="restriction-value">${pass ? '이상 ✓' : '미만 ✗'}</span></div>`;
    }
    resultEl.innerHTML = `
      <div class="restriction-summary">
        <div><span class="restriction-label">투찰율</span><span class="restriction-value mono">${rate.toFixed(3)}%</span></div>
        ${judgmentHtml}
      </div>
    `;
  }
  baseInput.addEventListener('input', recompute);
  bidInput.addEventListener('input', recompute);
  recompute();
}

// attachmentRowHtml — 첨부 한 줄 마크업. renderAttachments/renderSupportAttachments
// 공용. downloadUrl 없으면 파일명만(죽은 링크 안 만듦).
function attachmentRowHtml(it) {
  const sizeText = formatFileSize(it.fileSizeBytes);
  const typeText = escapeHtml((it.fileType || '').toUpperCase());
  const statusBadge = it.downloadStatus !== 'completed'
    ? `<span class="status-badge status-badge--muted">${escapeHtml(it.downloadStatus)}</span>`
    : '';
  const nameHtml = it.downloadUrl
    ? `<a href="${escapeAttr(it.downloadUrl)}" target="_blank" rel="noopener">${escapeHtml(it.originalFilename)} ${newTabIconHtml()}</a>`
    : escapeHtml(it.originalFilename);
  // 미리보기 돋보기 아이콘 — 파일명 바로 옆(2026-08-11 Phase 1, 큰 [미리보기] 버튼 대체).
  // 서버 프록시 미리보기(PDF는 즉시, 변환대상은 변환 API 설정 시). id·downloadUrl이 있고,
  // 서버가 미리보기를 시도할 수 있는 문서 형식(PDF/HWP/HWPX/DOC/DOCX/XLS/XLSX)일 때만 노출한다
  // — ZIP·이미지 등 지원 불가 형식엔 돋보기를 붙이지 않는다(변환 가능여부 최종 판단은 서버).
  const previewBtn = (it.id && it.downloadUrl && isPreviewableAttachment(it))
    ? `<button type="button" class="attachment-preview-btn" data-id="${escapeAttr(it.id)}" data-name="${escapeAttr(it.originalFilename)}" data-url="${escapeAttr(it.downloadUrl)}" aria-label="미리보기" title="미리보기">${searchIconHtml()}</button>`
    : '';
  // 파일명이 가장 넓고(왼쪽), 크기→형식 순으로 오른쪽 정렬. 형식은 맨 오른쪽.
  return `
      <li class="attachment-item">
        <span class="attachment-name">${nameHtml}${previewBtn}</span>
        <span class="attachment-file-meta">
          ${statusBadge}
          ${sizeText ? `<span class="attachment-size mono">${sizeText}</span>` : ''}
          ${typeText ? `<span class="attachment-type">${typeText}</span>` : ''}
        </span>
      </li>`;
}

// isPreviewableAttachment — 서버 미리보기(PDF 변환)를 시도할 수 있는 문서 형식인지.
// 확장자/파일형식 기준 대략 판별(최종 변환 가능여부는 서버가 판단, 안 되면 다운로드 폴백).
const PREVIEWABLE_ATTACHMENT_EXTS = new Set(['pdf', 'hwp', 'hwpx', 'doc', 'docx', 'xls', 'xlsx']);
function isPreviewableAttachment(it) {
  let ext = (it.fileType || '').toLowerCase().replace(/^\./, '');
  if (!PREVIEWABLE_ATTACHMENT_EXTS.has(ext)) {
    const name = it.originalFilename || '';
    const dot = name.lastIndexOf('.');
    if (dot >= 0) ext = name.slice(dot + 1).toLowerCase();
  }
  return PREVIEWABLE_ATTACHMENT_EXTS.has(ext);
}

// searchIconHtml — 미리보기용 돋보기 SVG(팔레트 통일: 흰/회/파랑, 이모지 미사용).
function searchIconHtml() {
  return '<svg class="attachment-preview-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
}

// wireAttachmentPreview — 첨부 목록의 [미리보기] 버튼을 미리보기 모달에 연결한다
// (renderAttachments/renderSupportAttachments 공용).
function wireAttachmentPreview(container) {
  container.querySelectorAll('.attachment-preview-btn').forEach(btn => {
    btn.addEventListener('click', () => openAttachmentPreview(btn.dataset.id, btn.dataset.name, btn.dataset.url));
  });
}

// openAttachmentPreview — 서버 프록시(/api/attachments/{id}/preview)로 PDF를 받아
// 모달 안 iframe으로 보여준다. PDF가 아니거나 변환이 안 되면(415/변환 미설정 등) 서버가
// JSON 코드를 주고, 그때는 "다운로드로 열기" 안내로 폴백한다(기존 다운로드 링크는 유지).
async function openAttachmentPreview(id, name, downloadUrl) {
  const safeName = name || '첨부파일';
  const body = openModal(safeName, `
    <div class="attachment-preview">
      <div class="attachment-preview-loading" id="attachment-preview-loading">
        <div class="spinner"></div>
        <p>문서를 불러오는 중이에요…</p>
        <p class="attachment-preview-hint">외부 파일을 서버가 가져와 변환하는 중입니다. 잠시만요.</p>
      </div>
    </div>
  `, { onClose: () => { if (window.__attachmentPreviewURL) { URL.revokeObjectURL(window.__attachmentPreviewURL); window.__attachmentPreviewURL = null; } } });

  const wrap = body.querySelector('.attachment-preview');
  const fallback = (msg) => {
    const dl = downloadUrl
      ? `<a class="btn btn-primary" href="${escapeAttr(downloadUrl)}" target="_blank" rel="noopener">파일 다운로드 ${newTabIconHtml()}</a>`
      : '';
    wrap.innerHTML = `<div class="attachment-preview-fallback"><p>${escapeHtml(msg)}</p>${dl}</div>`;
  };

  try {
    const res = await fetch('/api/attachments/' + encodeURIComponent(id) + '/preview', { credentials: 'same-origin' });
    if (!res.ok) {
      let code = '';
      try { code = (await res.json()).error || ''; } catch (e) { /* non-json */ }
      fallback(ATTACHMENT_PREVIEW_MESSAGES[code] || '이 파일은 미리보기를 지원하지 않아요. 다운로드해서 확인해주세요.');
      return;
    }
    const blob = await res.blob();
    if (window.__attachmentPreviewURL) URL.revokeObjectURL(window.__attachmentPreviewURL);
    const objUrl = URL.createObjectURL(blob);
    window.__attachmentPreviewURL = objUrl;
    // 모달이 이미 닫혔으면(사용자가 로딩 중 X) 렌더하지 않는다.
    if (!document.getElementById('active-modal-overlay')) { URL.revokeObjectURL(objUrl); window.__attachmentPreviewURL = null; return; }
    wrap.innerHTML = `<iframe class="attachment-preview-frame" src="${objUrl}" title="${escapeAttr(safeName)}"></iframe>`;
  } catch (err) {
    fallback('문서를 불러오지 못했어요. 잠시 후 다시 시도하거나 다운로드해주세요.');
  }
}

  host_not_allowed: '이 파일 출처는 미리보기가 허용되지 않아요. 다운로드해서 확인해주세요.',
  bad_url: '파일 주소가 올바르지 않아 미리보기를 만들 수 없어요.',

  conversion_failed: '문서를 PDF로 변환하지 못했어요. 다운로드해서 확인해주세요.',
  fetch_failed: '원본 파일을 가져오지 못했어요. 잠시 후 다시 시도하거나 다운로드해주세요.',
};

// renderSupportProgramDetail — B-2. 지원사업 "신청 안내" 탭에 기업마당 공식
// 데이터(지원대상·사업개요·신청방법·문의처·지원분야)를 표시하고 "사업
// 신청하기"(application_url) CTA를 우선 노출한다. detail이 없으면(미수집)
// 원문 공고 링크로 안내한다. 사업개요는 서버가 평문(businessSummaryText)으로
// 내려준 값만 escapeHtml로 출력한다 — 원본 HTML은 절대 innerHTML하지 않는다.
function renderSupportProgramDetail(container, detail, notice) {
  if (!container) return;
  container.innerHTML = '';

  const officialUrl = safeExternalHttpUrl(notice && notice.officialUrl);
  const applyUrl = detail ? safeExternalHttpUrl(detail.applicationUrl) : null;

  const rows = [];
  const addRow = (label, value) => {
    const v = (value == null ? '' : String(value)).trim();
    if (!v) return;
    rows.push(`<div><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(v)}</dd></div>`);
  };
  if (detail) {
    addRow('지원대상', detail.supportTarget);
    const category = [detail.categoryMajor, detail.categoryMiddle].filter(Boolean).join(' > ');
    addRow('지원분야', category);
    addRow('신청방법', detail.applicationMethod);
    addRow('문의처', detail.referenceContact);
  }

  const summary = detail && detail.businessSummaryText ? String(detail.businessSummaryText).trim() : '';
  const summaryHtml = summary
    ? `<div class="support-summary"><h3>사업 개요</h3><p>${escapeHtml(summary)}</p></div>`
    : '';

  const metaHtml = rows.length
    ? `<dl class="detail-meta">${rows.join('')}</dl>`
    : '';

  // CTA: 신청 링크가 있으면 "사업 신청하기"를 주 버튼으로, 원문 공고를 보조로.
  // 신청 링크가 없으면 원문 공고 보기를 주 버튼으로 노출한다.
  const ctas = [];
  if (applyUrl) {
    ctas.push(`<a class="btn btn-primary" href="${escapeAttr(applyUrl)}" target="_blank" rel="noopener">사업 신청하기 ${newTabIconHtml()}</a>`);
    if (officialUrl) ctas.push(`<a class="btn btn-secondary" href="${escapeAttr(officialUrl)}" target="_blank" rel="noopener">공고 원문 보기 ${newTabIconHtml()}</a>`);
  } else if (officialUrl) {
    ctas.push(`<a class="btn btn-primary" href="${escapeAttr(officialUrl)}" target="_blank" rel="noopener">공고 원문 보기 ${newTabIconHtml()}</a>`);
  }
  const ctaHtml = ctas.length ? `<div class="support-cta">${ctas.join('')}</div>` : '';

  // 공식 데이터가 아직 없을 때(입찰이 아닌데 미수집)의 안내.
  const noteHtml = (!metaHtml && !summaryHtml)
    ? '<p class="detail-sub">지원대상·신청 방법 등 상세 정보는 원문 공고에서 확인해주세요.</p>'
    : '<p class="detail-sub">신청 자격·제출 서류 등 세부 조건은 원문 공고와 첨부 공고문에서 반드시 확인해주세요.</p>';

  container.appendChild(h(`<div>${metaHtml}${summaryHtml}${noteHtml}${ctaHtml}</div>`));
}

// renderSupportConditions — B-3. 지원사업 공고문에서 규칙 기반으로 뽑은 '상세
// 신청조건'을 보여준다. 공식 분류(renderSupportProgramDetail)와 구분되는 블록.
// LOW 신뢰도는 자동확정처럼 보이지 않게 "원문 확인 필요"로 표시한다. 아직 추출
// 전이면(conditions 없음) 안내만 짧게 노출한다.
function renderSupportConditions(container, c, notice) {
  if (!container) return;
  container.innerHTML = '';
  if (!c) {
    container.appendChild(h('<div class="support-conditions"><h3>상세 신청조건</h3><p class="detail-sub">공고문 상세조건 분석이 아직 준비되지 않았습니다. 첨부 공고문과 원문을 확인해주세요.</p></div>'));
    return;
  }
  const conf = (c.confidence || '').toUpperCase();
  const confLabel = { HIGH: '신뢰도 높음', MEDIUM: '신뢰도 보통', LOW: '원문 확인 필요' }[conf] || '';
  const confBadge = conf ? `<span class="cond-badge cond-badge--${conf.toLowerCase()}">${confLabel}</span>` : '';

  const rows = [];
  const textRow = (label, val) => {
    const v = (val == null ? '' : String(val)).trim();
    if (v) rows.push(`<div><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(v)}</dd></div>`);
  };
  textRow('신청자격', c.eligibilityText);
  textRow('업력 조건', c.businessAgeCondition);
  textRow('지역 조건', c.regionCondition);
  textRow('매출 조건', c.revenueCondition);
  // 지원내용(금액/한도/비율): 원문 텍스트 우선, 숫자는 참고로만
  textRow('지원 금액', c.supportAmountText);
  let limitVal = (c.supportLimitText || '').trim();
  if (c.supportLimitAmount) limitVal = (limitVal ? limitVal + ' ' : '') + `(약 ${formatCurrency(c.supportLimitAmount)}원)`;
  if (limitVal) rows.push(`<div><dt>지원 한도</dt><dd>${escapeHtml(limitVal)}</dd></div>`);
  textRow('지원 비율/자부담', c.supportRateText);
  textRow('선정 절차', c.selectionProcess);
  const metaHtml = rows.length ? `<dl class="detail-meta">${rows.join('')}</dl>` : '';

  const listBlock = (title, items) => {
    if (!items || !items.length) return '';
    const lis = items.map(x => `<li>${escapeHtml(String(x))}</li>`).join('');
    return `<div class="cond-list"><h4>${escapeHtml(title)}</h4><ul>${lis}</ul></div>`;
  };
  const docs = (c.requiredDocuments || []).map(d => d && d.name ? d.name : '').filter(Boolean);
  const docsBlock = listBlock('제출서류', docs);
  const exclBlock = listBlock('지원 제외', c.exclusionConditions);
  const prefBlock = listBlock('우대사항', c.preferenceConditions);

  const empty = !metaHtml && !docsBlock && !exclBlock && !prefBlock;
  const body = empty
    ? '<p class="detail-sub">공고문에서 구조화 가능한 상세조건을 찾지 못했습니다. 원문 공고문을 확인해주세요.</p>'
    : `${metaHtml}${docsBlock}${exclBlock}${prefBlock}`;

  // 근거/한계 안내 — 규칙 자동추출이라 부정확할 수 있음을 항상 명시(공식 분류는 상단).
  const caveat = '<p class="cond-caveat">공고문을 자동 분석한 참고 정보입니다. 정확한 신청 조건은 원문 공고문을 반드시 확인하세요.</p>';

  container.appendChild(h(`
    <div class="support-conditions">
      <div class="cond-head"><h3>상세 신청조건</h3>${confBadge}</div>
      ${body}
      ${caveat}
    </div>`));
}

// renderSupportAttachments — B-2. 지원사업 첨부를 역할별로 나눠 보여준다:
// 공고문(SUPPORT_PRINT_DOCUMENT) / 별첨자료(SUPPORT_ATTACHMENT) / 기타(역할 미상).
function renderSupportAttachments(container, items) {
  if (!container) return;
  container.innerHTML = '';
  if (!items.length) {
    container.appendChild(h('<p class="section-empty">첨부파일이 없습니다.</p>'));
    return;
  }
  const groups = [
    { role: 'SUPPORT_PRINT_DOCUMENT', label: '공고문', items: [] },
    { role: 'SUPPORT_ATTACHMENT', label: '별첨자료', items: [] },
    { role: '', label: '기타 첨부', items: [] },
  ];
  items.forEach(it => {

    .filter(g => g.items.length)
    .map(g => `<h4 class="support-attachment-group">${escapeHtml(g.label)}</h4><ul class="attachment-list">${g.items.map(attachmentRowHtml).join('')}</ul>`)
    .join('');
  container.appendChild(h(blocks));
  wireAttachmentPreview(container);
}

// documentAnalysisEmptyHtml — 2026-08-07, "아직 분석되지 않았습니다"류
// 빈 상태 문구 개선. server.go의 computeNoticeDocumentAnalysisStatus가
// attachments 테이블 실제 진행 단계(첨부없음/텍스트추출 중/구조화추출
// 대기~1시간 이내/분석완료했지만 정보없음)를 구분해서 내려주는 값을
// 그대로 문구로 옮긴다 — "왜 비어있는지" 이유 없이 그냥 "없다"고만
// 하던 걸 정확한 원인+다음 행동으로 대체한다.
//
// objectPhrase는 "참가자격 요건을"/"제출서류를"처럼 조사까지 포함한
// 목적어 — 한국어 조사(을/를)가 명사 받침 유무에 따라 달라 문구 템플릿
// 안에 하드코딩할 수 없어 호출부가 정확한 형태로 넘긴다.
//
// officialUrl이 없으면 "지금 확인하기" 링크 자체를 아예 안 만든다 —
// 죽은 링크를 절대 보여주지 않는다는 원칙(사용자 명시 요구사항).
function documentAnalysisEmptyHtml(status, officialUrl, objectPhrase) {
  // backend가 내려준 실제 상태값(computeNoticeDocumentAnalysisStatus)만 사용 — 없는 상태를
  // 프론트에서 지어내지 않는다. 상태별 badge(tone) + 설명 + 원문 링크로 구조화해 보여준다.
  const meta = {
    no_attachments: { label: '첨부 없음', tone: 'muted', desc: `이 공고에는 첨부파일이 없어 ${objectPhrase} 자동으로 확인할 수 없습니다. 공고 원문에서 직접 확인해주세요.` },
    extracting_text: { label: '분석 중', tone: 'active', desc: `첨부 공고문에서 ${objectPhrase} 확인하고 있습니다. 처리가 끝나면 자동으로 표시됩니다.` },
    awaiting_structured_extraction: { label: '분석 중', tone: 'active', desc: `첨부 공고문 처리가 거의 끝났습니다. 보통 1시간 이내 자동으로 표시됩니다.` },
    analyzed_empty: { label: '확인 필요', tone: 'warn', desc: `공고문을 분석했지만 ${objectPhrase} 찾지 못했습니다. 공고 원문에서 직접 확인해주세요.` },
  };
  const m = meta[status] || { label: '확인 필요', tone: 'warn', desc: '아직 분석되지 않았습니다. 공고 원문을 확인해주세요.' };
  const linkHtml = officialUrl
    ? `<a href="${escapeAttr(officialUrl)}" target="_blank" rel="noopener" class="official-link">원문에서 확인하기 ${newTabIconHtml()}</a>`
    : '';
  return `<div class="data-status">
      <span class="data-status-badge data-status-badge--${m.tone}">${escapeHtml(m.label)}</span>
      <p class="data-status-desc">${escapeHtml(m.desc)}</p>
      ${linkHtml}
    </div>`;
}

// readiness는 handleGetNotice가 함께 내려주는 {total, checked} 집계 — 로그인/
// 프로필 여부와 무관하게 항상 값이 온다(비로그인이면 checked는 전부 false).
// 체크박스 토글은 PUT /api/notices/{id}/documents/{id}/checklist를 호출하고,
// 진행률 숫자는 서버 재조회 없이 로컬에서 +1/-1로 갱신한다(리스트에 포함된
// "본문에 목록 없음" 참조행은 total에는 잡히지만 체크 대상이 아니라 DOM
// 재계산과 어긋날 수 있어, 서버가 준 total을 고정값으로 쓴다).
function renderRequiredDocuments(container, items, noticeId, readiness, analysisStatus, officialUrl) {
  container.innerHTML = '';
  if (!items.length) {
    container.appendChild(h(documentAnalysisEmptyHtml(analysisStatus, officialUrl, '제출서류를')));
    return;
  }

  const hasReadiness = !!readiness && readiness.total > 0;
  let checkedCount = hasReadiness ? readiness.checked : 0;
  const total = hasReadiness ? readiness.total : 0;
  const progressHtml = hasReadiness ? `
    <div class="doc-progress">
      <div class="doc-progress-bar"><div class="doc-progress-fill" id="doc-progress-fill" style="width:${Math.round((checkedCount / total) * 100)}%"></div></div>
      <span class="doc-progress-label" id="doc-progress-label">서류 준비 ${checkedCount}/${total}</span>
    </div>` : '';

  const rows = items.map(it => {
    if (it.documentName === NO_DOCUMENT_LIST_LABEL) {
      return `
        <li class="document-item document-item--reference">
          <div class="document-head">${extractionMethodBadgeHtml(it.extractionMethod)}</div>
          <p class="document-reference-note">☞ 원문 확인 필요 — 본문에 서류 목록이 없어 별첨/타 문서를 참조해야 합니다.</p>
        </li>`;
    }
    return `
      <li class="document-item">
        <div class="document-head">${extractionMethodBadgeHtml(it.extractionMethod)}</div>
        <label class="document-check">
          <input type="checkbox" data-document-id="${escapeAttr(it.id)}" ${it.checked ? 'checked' : ''}>
          <span class="document-name">${escapeHtml(it.documentName)}</span>
        </label>
      </li>`;
  }).join('');

  container.appendChild(h(`${progressHtml}<p class="error doc-checklist-error" style="display:none"></p><ul class="document-list">${rows}</ul>`));

  const errBox = container.querySelector('.doc-checklist-error');
  container.querySelectorAll('input[data-document-id]').forEach(cb => {
    cb.addEventListener('change', async () => {
      const documentId = cb.dataset.documentId;
      const checked = cb.checked;
      cb.disabled = true;
      if (errBox) errBox.style.display = 'none';
      try {
        await apiRequest('PUT', '/api/notices/' + encodeURIComponent(noticeId) + '/documents/' + encodeURIComponent(documentId) + '/checklist', { checked });
        checkedCount += checked ? 1 : -1;
        const fill = document.getElementById('doc-progress-fill');
        const label = document.getElementById('doc-progress-label');
        if (fill) fill.style.width = Math.round((checkedCount / total) * 100) + '%';
        if (label) label.textContent = `서류 준비 ${checkedCount}/${total}`;
      } catch (err) {
        cb.checked = !checked;
        if (err.status === 401) {
          location.hash = '#/auth/login';
        } else if (errBox) {
          errBox.textContent = err.message;
          errBox.style.display = '';
        }
      } finally {
        cb.disabled = false;
      }
    });
  });
}
