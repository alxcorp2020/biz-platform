  '대전광역시', '울산광역시', '세종특별자치시', '경기도', '강원특별자치도',
  '충청북도', '충청남도', '전북특별자치도', '전라남도', '경상북도', '경상남도', '제주특별자치도',
];

// noticeListState — #/notices 무한스크롤 상태 캐시(모듈 레벨 변수, 서버/
// sessionStorage 아님). 해시 라우팅 SPA라 상세 화면으로 이동했다가 브라우저
// "뒤로가기"로 돌아와도 페이지 전체가 리로드되지 않고 location.hash만
// 바뀐다 — 그래서 이 변수가 JS 메모리에 그대로 남아있는 것만으로 "지금까지
// 불러온 항목 + 스크롤 위치"를 그대로 복원할 수 있다. key가 현재 검색
// 조건(q/region/industry/sort)과 다르면 새 검색으로 보고 캐시를 버린다.
let noticeListState = null;

// searchTopRecoCache — 공고검색 상단 "내 회사에 맞는 입찰공고" strip이 재사용하는
// GET /api/dashboard.recommendations의 세션 캐시(모듈 레벨). 검색/필터/정렬을 바꿀
// 때마다 renderList가 다시 도는데, 그때마다 /api/dashboard를 새로 부르면 낭비라
// 한 번 받아두고 재사용한다(추천은 "먼저 볼 힌트"라 세션 내 약간의 staleness 허용).
// N+1 아님: strip은 이 배열만 쓰고 공고별 상세 API를 절대 부르지 않는다.
let searchTopRecoCache = null; // null=미조회, 배열=조회완료(0건 포함)

// renderSearchTopReco — 공고검색 전체 목록 위에 "내 회사에 맞는 입찰공고"를 최대 6건
// 노출하는 compact strip(2026-08-11). Dashboard V1 / 맞춤공고 V1은 건드리지 않고,
// 이미 있는 GET /api/dashboard.recommendations(전부 procurement — scoring.go에서
// support_program은 gradeNeedsConfirmation이라 추천에서 구조적으로 제외됨)를 재사용한다.
// 정렬은 홈 HERO와 동일한 recommendationHeroTier(Tier ASC, 동Tier 마감순 유지)를 그대로
// 쓴다. 노출 게이트: 로그인+회사프로필 있고, noticeType 필터가 support_program이 아니고,
// 추천이 1건 이상일 때만. 그 외엔 영역 전체 숨김(거대한 빈 카드 없음). strip은 탐색용이라
// REVIEW 인라인 질문([보유]/[미보유]/[모름])이나 맞춤조건 관리 UI를 넣지 않는다.
// searchRecoCardMeta — 추천 카드의 판정별 표시값(배지/이유/CTA). recommendationHeroTier와
// 같은 Tier 구분을 쓰되(판정 로직 신설 없음), 카드에 보여줄 라벨만 정한다. 분석대기(Tier3)는
// 사용자가 해결할 수 없으므로 CTA를 "상세 보기"로 두고 "확인하기"류를 절대 쓰지 않는다.
function searchRecoCardMeta(item) {
  const j = item.judgment || {};
  const reasons = j.reasons || [];
  const qs = j.questions || [];
  switch (recommendationHeroTier(item)) {
    case 0: return { badge: '참여 가능', tone: 'pj-grade--ready', rLbl: '왜 추천됐나요?', rText: reasons[0] || '지역·업종·기업규모 조건 충족', cta: '상세 보기' };
    case 1: return { badge: '확인 필요', tone: 'pj-grade--review', rLbl: '확인할 조건', rText: (qs[0] && qs[0].reason) || reasons[0] || '', cta: '조건 확인' };
    case 2: return { badge: '확인 필요', tone: 'pj-grade--review', rLbl: '확인할 조건', rText: reasons[0] || '', cta: '조건 확인' };
    case 3: return { badge: '분석 중', tone: 'pj-grade--review', rLbl: '', rText: '공고문을 분석하고 있어요.', cta: '상세 보기' };
    default: return { badge: j.gradeLabel || '참여 어려움', tone: 'pj-grade--fail', rLbl: '참여 어려움 사유', rText: reasons[0] || '', cta: '상세 보기' };
  }
}

// searchRecoCardHtml — 일반 공고 목록 row와 다른 "추천 카드"(세로 카드). 판정 배지 상단 →
// 공고명 → 기관·마감 → 이유 1줄 → CTA. 카드 전체가 상세로 이동하는 클릭 영역.
function searchRecoCardHtml(item) {
  const m = searchRecoCardMeta(item);
  const href = item.ctaHref || ('#/notices/' + item.noticeId);
  const reasonHtml = m.rText
    ? `<div class="str-card-reason">${m.rLbl ? `<div class="str-card-reason-lbl">${escapeHtml(m.rLbl)}</div>` : ''}<div class="str-card-reason-text">${escapeHtml(m.rText)}</div></div>`
    : '';
  return `
    <article class="str-card" data-cta-href="${escapeAttr(href)}">
      <span class="pj-mini ${m.tone} str-card-badge">${escapeHtml(m.badge)}</span>
      <h4 class="str-card-title">${escapeHtml(item.title)}</h4>
      <div class="str-card-meta">${escapeHtml(item.organizationName || '-')} &middot; ${ddayBadgeHtml(item.applicationEndAt)}</div>
      ${reasonHtml}
      <div class="str-card-actions"><button type="button" class="btn btn-secondary btn-sm str-card-cta" tabindex="-1">${escapeHtml(m.cta)}</button></div>
    </article>`;
}

async function renderSearchTopReco(container, noticeType) {
  if (!container) return;
  container.innerHTML = '';
  const allHeading = document.getElementById('notice-all-heading');
  const hideAll = () => { if (allHeading) allHeading.hidden = true; }; // 추천 없으면 "전체 공고" 구분 heading도 숨김
  hideAll();
  // 게이트: 미로그인/프로필 없음 → 숨김. 지원사업 필터 → 숨김(추천 데이터 자체가 없음).
  if (!currentUser || !currentProfile) return;
  if (noticeType === 'support_program') return;

  // 추천 데이터는 세션 캐시 재사용(없을 때 1회만 /api/dashboard 조회). 실패는 조용히 숨김.
  // 실패 시 캐시에 []를 굳히지 않는다 — 부팅 순간의 일시적 401/네트워크 오류가 세션 내내
  // section을 숨겨버리지 않도록, 오류면 캐시를 null로 두고 이번에는 숨기기만 한다(다음 진입에 재시도).
  let recs = searchTopRecoCache;
  if (recs === null) {
    try {
      const data = await apiRequest('GET', '/api/dashboard');
      recs = (data && data.recommendations) || [];
      searchTopRecoCache = recs; // 성공(0건 포함)만 캐시 확정
    } catch (e) {
      return; // 조회 실패 → 이번엔 숨김, 캐시는 null 유지(다음 renderList에서 재시도)
    }
  }
  if (!recs.length) return; // 0건 → section 전체 숨김(전체 공고 heading도 숨김 유지)

  // Tier ASC로 안정정렬(동Tier는 원래 순서=서버 마감순 유지) 후 상위 6건.
  // 2열 grid라 6건이면 3행이 꽉 찬다(6=2+2+2). 추천이 6건 미만이면 있는 만큼만(가짜 카드 없음).
  const top = recs
    .map((r, i) => ({ r, i }))
    .sort((a, b) => (recommendationHeroTier(a.r) - recommendationHeroTier(b.r)) || (a.i - b.i))
    .slice(0, 6)
    .map(x => x.r);
  if (!top.length) return;

  // 제목 회사명: 확실할 때만 "OO회사에 맞는", 아니면 추측 없이 "내 회사에 맞는"(§6/§12).
  const companyName = (currentProfile && currentProfile.companyName || '').trim();
  const heading = companyName ? `${escapeHtml(companyName)}에 맞는 입찰공고` : '내 회사에 맞는 입찰공고';

  container.appendChild(h(`
    <section class="search-top-reco">
      <div class="search-top-reco-head">
        <div class="search-top-reco-titles">
          <h3 class="search-top-reco-title">${heading}</h3>
          <p class="search-top-reco-sub">회사정보와 맞춤조건을 기준으로 먼저 확인할 공고예요.</p>
        </div>
        <a href="#/me/saved-searches" class="official-link search-top-reco-all">맞춤공고 전체보기 &rarr;</a>
      </div>
      <div class="search-top-reco-grid">${top.map(searchRecoCardHtml).join('')}</div>
    </section>
  `));
  // 카드 전체 클릭 → 상세 이동(홈 목록과 동일 패턴, 새 판정/조회 로직 없음).
  container.querySelectorAll('.str-card').forEach(card => {
    card.addEventListener('click', () => { if (card.dataset.ctaHref) location.hash = card.dataset.ctaHref; });
  });
  if (allHeading) allHeading.hidden = false; // 추천 노출 시에만 "전체 공고" 구분 heading 표시
}

// SAVED_SEARCH_ONLY_PARAMS — "맞춤공고"(#/me/saved-searches) 결과보기가
// #/notices로 넘기는, 화면에는 노출 필드가 없는 추가 필터. 검색 화면
// 자체를 복잡하게 만들지 않으려 이 필드들의 입력 UI는 따로 안 만들고
// (사용자 원칙: 화면 단순화 우선), URL 쿼리스트링으로만 실려 있으면 API
// 요청/정렬 재제출 양쪽에서 그대로 유지되게만 한다.
// 2026-08-08: noticeType은 공고 검색 폼에 정식 드롭다운으로 추가돼 더 이상
// "맞춤공고 전용(폼 필드 없음)"이 아니다 — 이 목록에서 빼야 폼에서 '전체'로
// 바꿔 해제할 수 있다(남겨두면 이전 hash 값이 강제 보존돼 해제 불가).
const SAVED_SEARCH_ONLY_PARAMS = ['organizationName', 'budgetMin', 'budgetMax', 'keywordsInclude', 'keywordsExclude'];

function noticeListKey(params) {
  return params.toString();
}

function noticeListApiParams(filterParams) {
  const apiParams = new URLSearchParams();
  if (filterParams.get('q')) apiParams.set('q', filterParams.get('q'));
  if (filterParams.get('region')) apiParams.set('region', filterParams.get('region'));
  if (filterParams.get('industry')) apiParams.set('industry', filterParams.get('industry'));
  if (filterParams.get('sort')) apiParams.set('sort', filterParams.get('sort'));
  // 2026-08-06: 기본은 진행중 공고만(백엔드 기본값과 동일) — 체크박스를
  // 켰을 때만 마감된 공고까지 포함해서 보여준다.
  if (filterParams.get('includeClosed')) apiParams.set('includeClosed', filterParams.get('includeClosed'));
  // noticeType은 이제 공고 검색 폼의 정식 필드다(입찰공고/지원사업 필터) — 명시 전달.
  if (filterParams.get('noticeType')) apiParams.set('noticeType', filterParams.get('noticeType'));
  SAVED_SEARCH_ONLY_PARAMS.forEach(key => {
    if (filterParams.get(key)) apiParams.set(key, filterParams.get(key));
  });
  return apiParams;
}

// 최근 검색어 — 검색창 포커스 시 드롭다운으로 최근 키워드 최대 5개를 보여준다.
// artifact가 아닌 일반 서비스라 localStorage 사용에 제약 없음(팝업/배너 dismiss와 동일 패턴).
const RECENT_SEARCHES_KEY = 'recent_notice_searches';
function getRecentSearches() {
  try {
    const a = JSON.parse(localStorage.getItem(RECENT_SEARCHES_KEY) || '[]');
    return Array.isArray(a) ? a.filter(x => typeof x === 'string') : [];
  } catch { return []; }
}
function addRecentSearch(q) {
  q = (q || '').trim();
  if (!q) return;
  const list = getRecentSearches().filter(x => x !== q);
  list.unshift(q);
  try { localStorage.setItem(RECENT_SEARCHES_KEY, JSON.stringify(list.slice(0, 5))); } catch { /* 저장 실패해도 검색 자체엔 영향 없음 */ }
}

// 검색 자동완성/최근검색 공용 드롭다운 — openDropdown은 같은 트리거 재클릭 시
// 토글로 닫혀 "타이핑 중 실시간 갱신"엔 부적합하므로, 자유롭게 다시 그릴 수 있는
// 전용 메뉴를 직접 관리한다. .dropdown-menu 스타일(position:fixed, 다크 대응)을 재사용.
// showGlobalSpinner/hideGlobalSpinner — fixed 정중앙 로딩 스피너(2026-08-08).
// 무한스크롤 다음 페이지 로드 등 "목록이 이미 있는데 잠깐 기다릴 때" 하단
// 텍스트 대신 화면 정중앙에 스피너 하나만 띄운다. 부팅 오버레이의 스피너
// (.app-boot-spinner)와 같은 모양을 재사용한다. 중첩 호출은 카운트로 안전 처리.
let globalSpinnerCount = 0;
let globalSpinnerEl = null;
function showGlobalSpinner() {
  globalSpinnerCount++;
  if (globalSpinnerEl) return;
  globalSpinnerEl = document.createElement('div');
  globalSpinnerEl.className = 'global-spinner-overlay';
  globalSpinnerEl.innerHTML = '<div class="app-boot-spinner"></div>';
  document.body.appendChild(globalSpinnerEl);
}
function hideGlobalSpinner() {
  globalSpinnerCount = Math.max(0, globalSpinnerCount - 1);
  if (globalSpinnerCount === 0 && globalSpinnerEl) {
    globalSpinnerEl.remove();
    globalSpinnerEl = null;
  }
}

let searchSuggestEl = null;
let searchSuggestInput = null;
function searchSuggestOutside(e) {
  if (searchSuggestEl && !searchSuggestEl.contains(e.target) && e.target !== searchSuggestInput) hideSearchSuggest();
}
function hideSearchSuggest() {
  if (searchSuggestEl) { searchSuggestEl.remove(); searchSuggestEl = null; }
  searchSuggestInput = null;
  document.removeEventListener('click', searchSuggestOutside, true);
}
function showSearchSuggest(inputEl, items, onPick) {
  hideSearchSuggest();
  if (!items || !items.length) return;
  // 2026-08-08: body에 append + getBoundingClientRect로 좌표를 잡던 방식은
  // 재검색 후 위치가 틀어지는 버그가 있었다. 입력창을 감싼 .search-input-wrap
  // (position:relative)의 자식으로 넣고 CSS로 top:100%/left:0/right:0 앵커해
  // 항상 입력창 바로 아래에 폭까지 맞춰 정렬되게 한다.
  const wrap = inputEl.closest('.search-input-wrap') || inputEl.parentElement;
  const menu = document.createElement('div');
  menu.className = 'dropdown-menu search-suggest-menu';
  menu.innerHTML = items.map(it =>
    `<button type="button" class="dropdown-menu-item" data-v="${escapeAttr(it.value)}">${it.html}</button>`
  ).join('');
  wrap.appendChild(menu);
  menu.querySelectorAll('.dropdown-menu-item').forEach(b => {
    // mousedown + preventDefault: 입력창 blur보다 먼저 실행돼 포커스를 잃지 않고 선택된다.
    b.addEventListener('mousedown', (e) => { e.preventDefault(); onPick(b.dataset.v); });
  });
  searchSuggestEl = menu;
  searchSuggestInput = inputEl;
  setTimeout(() => document.addEventListener('click', searchSuggestOutside, true), 0);
}
// highlightMatch — 후보 제목에서 입력어와 일치하는 부분을 굵게(escape 후 처리).
function highlightMatch(text, q) {
  const esc = escapeHtml(text);
  const escQ = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  if (!escQ) return esc;
  try { return esc.replace(new RegExp('(' + escQ + ')', 'gi'), '<strong>$1</strong>'); }
  catch { return esc; }
}

function renderList(container) {
  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  const key = noticeListKey(params);
  const currentSort = params.get('sort') || 'new';
  const currentRegion = params.get('region') || '';
  const currentNoticeType = params.get('noticeType') || '';
  const savedSearchName = params.get('savedSearchName') || '';
  // 상세 검색 필드 프리필값(맞춤공고 "결과 보기"로 들어오면 이 값들이 채워진다).
  const currentIndustry = params.get('industry') || '';
  const currentOrg = params.get('organizationName') || '';
  const currentBudgetMin = params.get('budgetMin') || '';
  const currentBudgetMax = params.get('budgetMax') || '';
  const currentKwInclude = params.get('keywordsInclude') || '';
  const currentKwExclude = params.get('keywordsExclude') || '';
  const currentIncludeClosed = params.get('includeClosed') === '1';
  // 상세 조건이 하나라도 걸려 있으면 상세 검색 패널을 펼친 채로 시작한다.
  const advancedActive = !!(currentRegion || currentIndustry || currentNoticeType || currentOrg ||
    currentBudgetMin || currentBudgetMax || currentKwInclude || currentKwExclude || currentIncludeClosed);
  const sortLabel = (NOTICE_SORT_OPTIONS.find(o => o.value === currentSort) || {}).label || '신규순';

  container.innerHTML = '';
  container.appendChild(h(`
    ${savedSearchName ? `<div class="extraction-banner"><span aria-hidden="true">🔖</span> 맞춤공고 "${escapeHtml(savedSearchName)}" 조건 결과입니다 — <a href="#/me/saved-searches">맞춤공고 관리로 돌아가기</a></div>` : ''}
    <form class="search-form" id="filter-form">
      <div class="search-bar">
        <div class="search-input-wrap">
          <svg class="search-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" name="q" class="search-input" placeholder="공고명으로 검색" value="${escapeAttr(params.get('q') || '')}" autocomplete="off">
        </div>
        <button type="submit" class="search-submit">검색</button>
      </div>
      <div class="search-toolbar">
        <button type="button" id="search-adv-toggle" class="search-adv-toggle" aria-expanded="${advancedActive ? 'true' : 'false'}" aria-controls="search-advanced">
          <svg class="search-adv-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          상세 검색
        </button>
        <input type="hidden" name="sort" value="${escapeAttr(currentSort)}">
        <button type="button" id="notice-sort-trigger" class="search-sort-trigger">${escapeHtml(sortLabel)} ▾</button>
      </div>
      <div class="search-advanced" id="search-advanced" ${advancedActive ? '' : 'hidden'}>
        <div class="search-adv-grid">
          <label class="search-adv-field">지역
            <select name="region" class="select-input">
              <option value="">지역 전체</option>
              ${REGION_OPTIONS.map(r => `<option value="${escapeAttr(r)}" ${r === currentRegion ? 'selected' : ''}>${escapeHtml(r)}</option>`).join('')}
            </select>
          </label>
          <label class="search-adv-field">공고 종류
            <select name="noticeType" class="select-input">
              ${SAVED_SEARCH_NOTICE_TYPE_OPTIONS.map(o => `<option value="${escapeAttr(o.value)}" ${o.value === currentNoticeType ? 'selected' : ''}>${o.value === '' ? '공고 종류 전체' : escapeHtml(o.label)}</option>`).join('')}
            </select>
          </label>
          <label class="search-adv-field">업종
            <input type="text" name="industry" placeholder="예: 설계, 청소, 시스템" value="${escapeAttr(currentIndustry)}">
          </label>
          <label class="search-adv-field">발주기관
            <input type="text" name="organizationName" placeholder="기관명 일부" value="${escapeAttr(currentOrg)}">
          </label>
          <label class="search-adv-field">예산 최소(원)
            <input type="text" name="budgetMin" inputmode="numeric" placeholder="예: 10,000,000" value="${escapeAttr(currentBudgetMin ? formatCurrency(Number(currentBudgetMin)) : '')}">
          </label>
          <label class="search-adv-field">예산 최대(원)
            <input type="text" name="budgetMax" inputmode="numeric" placeholder="예: 500,000,000" value="${escapeAttr(currentBudgetMax ? formatCurrency(Number(currentBudgetMax)) : '')}">
          </label>
          <label class="search-adv-field search-adv-field--wide">포함 키워드 (OR)
            <input type="text" name="keywordsInclude" placeholder="쉼표로 여러 개 = 하나라도 포함 (예: 환경, 설계, 유지관리)" value="${escapeAttr(currentKwInclude)}">
          </label>
          <label class="search-adv-field search-adv-field--wide">제외 키워드
            <input type="text" name="keywordsExclude" placeholder="쉼표로 여러 개 = 모두 제외 (예: 공사, 물품)" value="${escapeAttr(currentKwExclude)}">
          </label>
        </div>
        <div class="search-adv-footer">
          <label class="checkbox-label"><input type="checkbox" name="includeClosed" value="1" ${currentIncludeClosed ? 'checked' : ''}> 지난(마감) 공고도 포함</label>
          <div class="search-adv-actions">
            <button type="button" id="search-adv-reset" class="search-adv-reset">상세조건 초기화</button>
            <button type="submit" class="search-submit search-submit--sm">이 조건으로 검색</button>
          </div>
        </div>
      </div>
    </form>
    <div id="search-top-reco"></div>
    <h3 class="notice-all-heading" id="notice-all-heading" hidden>전체 공고</h3>
    <div id="list-body">${skeletonListHtml(6)}</div>
  `));

  // 맞춤 추천공고 section — 검색폼 바로 아래(검색폼 → 추천 → 전체 목록). 목록 로드와
  // 병렬(await 안 함). 게이트/숨김·"전체 공고" heading 토글은 renderSearchTopReco가 처리
  // (미로그인/지원사업/0건 → section 숨김 + heading 숨김).
  renderSearchTopReco(document.getElementById('search-top-reco'), currentNoticeType);

  const filterForm = document.getElementById('filter-form');
  // 예산 입력은 통화 자동포맷(쉼표) — 제출 시 숫자만 뽑아 URL에 넣는다.
  attachCurrencyAutoFormat(filterForm.budgetMin);
  attachCurrencyAutoFormat(filterForm.budgetMax);
  const submitFilterForm = () => {
    const fd = new FormData(filterForm);
    const p = new URLSearchParams();
    // 예산은 포맷된 문자열이라 숫자로 파싱해 담는다(빈 값은 생략).
    const budgetKeys = { budgetMin: true, budgetMax: true };
    for (const [k, v] of fd.entries()) {
      if (!v) continue;
      if (budgetKeys[k]) {
        const num = parseCurrencyInput(v);
        if (num != null && num !== '') p.set(k, String(num));
        continue;
      }
      p.set(k, v);
    }
    // savedSearchName(표시용 배지)만 이전 params에서 이어붙인다 — 나머지 검색
    // 조건은 이제 전부 폼 필드라 FormData로 정확히 수집된다.
    if (params.get('savedSearchName')) p.set('savedSearchName', params.get('savedSearchName'));
    addRecentSearch(fd.get('q')); // 검색어가 있으면 최근 검색어로 저장(빈 값은 무시)
    hideSearchSuggest();
    noticeListState = null; // 새 검색/정렬 — 이전 무한스크롤 캐시는 폐기
    location.hash = '#/notices?' + p.toString();
  };
  filterForm.addEventListener('submit', (e) => { e.preventDefault(); submitFilterForm(); });

  // 상세 검색 펼치기/접기.
  const advToggle = document.getElementById('search-adv-toggle');
  const advPanel = document.getElementById('search-advanced');
  advToggle.addEventListener('click', () => {
    const open = advPanel.hasAttribute('hidden');
    if (open) advPanel.removeAttribute('hidden'); else advPanel.setAttribute('hidden', '');
    advToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  // 상세조건 초기화 — 검색어(q)·정렬은 두고 상세 필드만 비운 뒤 즉시 재검색.
  document.getElementById('search-adv-reset').addEventListener('click', () => {
    ['region', 'noticeType', 'industry', 'organizationName', 'budgetMin', 'budgetMax', 'keywordsInclude', 'keywordsExclude'].forEach(name => {
      if (filterForm[name]) filterForm[name].value = '';
    });
    if (filterForm.includeClosed) filterForm.includeClosed.checked = false;
    submitFilterForm();
  });

  // 검색창 드롭다운: 빈 입력(포커스) → 최근 검색어 / 타이핑(2글자+) → 공고명 자동완성.
  const searchInput = filterForm.querySelector('input[name="q"]');
  const pickSearch = (v) => { searchInput.value = v; hideSearchSuggest(); submitFilterForm(); };
  const showRecents = () => {
    showSearchSuggest(searchInput, getRecentSearches().map(q => ({ value: q, html: '🕘 ' + escapeHtml(q) })), pickSearch);
  };
  let suggestTimer = null, suggestSeq = 0;
  searchInput.addEventListener('focus', () => { if (!searchInput.value.trim()) showRecents(); });
  searchInput.addEventListener('input', () => {
    const qv = searchInput.value.trim();
    clearTimeout(suggestTimer);
    if (!qv) { showRecents(); return; }
    if ([...qv].length < 2) { hideSearchSuggest(); return; }
    suggestTimer = setTimeout(async () => {
      const seq = ++suggestSeq;
      try {
        const data = await fetchJSON('/api/notices/suggest?q=' + encodeURIComponent(qv));
        if (seq !== suggestSeq || searchInput.value.trim() !== qv) return; // 낡은 응답/입력 변경 무시
        showSearchSuggest(searchInput, (data.suggestions || []).map(t => ({ value: t, html: highlightMatch(t, qv) })), pickSearch);
      } catch (e) { /* 자동완성 실패는 조용히 무시 — 검색 자체엔 영향 없음 */ }
    }, 180);
  });
  searchInput.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideSearchSuggest(); });
  // 정렬은 검색 버튼을 따로 안 눌러도 바로 반영 — 목록 순서를 바꾸는
  // 것뿐이라 "검색 조건 확정" 성격의 다른 입력들과 달리 즉시 적용이 자연스럽다.
  // 2026-08-07: <select>를 openDropdown() 기반 버튼으로 교체(UX 경량화
  // 4단계) — 선택값은 hidden input(name="sort")에 담아 기존 FormData
  // 수집 로직을 그대로 재사용한다. 클릭 즉시 submitFilterForm()이
  // location.hash를 바꿔 renderList() 전체가 다시 그려지므로, 트리거
  // 버튼 라벨을 따로 갱신할 필요는 없다.
  document.getElementById('notice-sort-trigger').addEventListener('click', (e) => {
    const menu = openDropdown(e.currentTarget, NOTICE_SORT_OPTIONS.map(o => `
      <button type="button" class="dropdown-menu-item" data-value="${escapeAttr(o.value)}">${escapeHtml(o.label)}</button>
    `).join(''));
    if (!menu) return; // 같은 트리거를 다시 클릭 — 토글로 닫기만 하고 끝
    menu.querySelectorAll('.dropdown-menu-item').forEach(item => {
      item.addEventListener('click', () => {
        filterForm.sort.value = item.dataset.value;
        submitFilterForm();
      });
    });
  });

  const listBody = document.getElementById('list-body');

  // 캐시 적중 = 같은 검색 조건으로 돌아온 것(전형적으로 상세→뒤로가기).
  // 새로 fetch하지 않고 이미 불러온 항목을 그대로 다시 그린 뒤 저장해둔
  // 스크롤 위치로 복원한다.
  if (noticeListState && noticeListState.key === key) {
    renderNoticeListItems(listBody, noticeListState.items, noticeListState.total, !!params.get('savedSearchName'));
    wireNoticeListLoadMore(listBody, key);
    const savedScrollY = noticeListState.scrollY || 0;
    requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, savedScrollY)));
    return;
  }

  noticeListState = { key, items: [], offset: 0, limit: 20, total: 0, hasMore: true, loading: false, scrollY: 0 };
  loadMoreNotices(listBody, key, params, true);
}

// loadMoreNotices fetches the next page(offset=noticeListState.offset)and
// appends to the cached item list. isFirstPage만 실패 시 전체 에러 화면으로
// 바꾸고, 이후 페이지 실패는 sentinel에 에러 문구만 남겨 이미 불러온 목록은
// 그대로 유지한다.
async function loadMoreNotices(listBody, key, filterParams, isFirstPage) {
  if (!noticeListState || noticeListState.key !== key || noticeListState.loading || !noticeListState.hasMore) return;
  noticeListState.loading = true;
  // 무한스크롤 다음 페이지 로드는 하단 텍스트 대신 fixed 정중앙 스피너로 표시한다
  // (첫 페이지는 스켈레톤이 이미 있으니 스피너 생략).
  if (!isFirstPage) showGlobalSpinner();

  const apiParams = noticeListApiParams(filterParams);
  apiParams.set('offset', String(noticeListState.offset));
  apiParams.set('limit', String(noticeListState.limit));

  try {
    const data = await fetchJSON('/api/notices?' + apiParams.toString());
    if (!noticeListState || noticeListState.key !== key) return; // 그 사이 다른 검색으로 전환됨 — 결과 버림
    noticeListState.items = noticeListState.items.concat(data.items || []);
    noticeListState.offset = noticeListState.offset + (data.items ? data.items.length : 0);
    noticeListState.total = data.total || 0;
    noticeListState.hasMore = !!data.hasMore;
    noticeListState.loading = false;
    renderNoticeListItems(listBody, noticeListState.items, noticeListState.total, !!filterParams.get('savedSearchName'));
    wireNoticeListLoadMore(listBody, key);
  } catch (err) {
    if (noticeListState) noticeListState.loading = false;
    if (isFirstPage) {
      listBody.className = 'error';
      listBody.innerHTML = '';
      listBody.textContent = err.message;
    } else {
      const sentinel = listBody.querySelector('#notice-list-sentinel');
      if (sentinel) sentinel.textContent = '더 불러오지 못했습니다: ' + err.message;
    }
  } finally {
    if (!isFirstPage) hideGlobalSpinner();
  }
}

// noticeRowHtml — 공고 검색 결과 목록의 행 카드 마크업. showMatchReasons는 맞춤공고 "결과
// 보기" 화면에서만 true — 평소 검색 화면은 원칙대로 단순하게 유지하고
// (보이는 필터값과 중복이라 배지가 굳이 필요 없음), 맞춤공고 결과에서만
// "왜 이 공고가 뽑혔는지"(2026-08-06, 비드큐 P1 9번)를 보여준다.
// n.grade/n.gradeReason은 반대로 화면 구분 없이 항상 보인다(2026-08-06,
// 브랜딩/UX 현황점검 4번 "추천공고 왜 목록단계 노출") — 이전엔 공고
// 상세 페이지(AI 참여분석 탭)를 열어야만 보이던 등급판정을 검색
// 목록에서 공고를 열기 전에 먼저 보여준다. 로그인+회사 프로필이 없으면
// 서버가 아예 grade를 안 내려주므로(server.go 참고) 그때는 자연히 빈
// 문자열이라 배지가 안 뜬다 — 프론트에서 로그인 여부를 따로 안 봐도 됨.
function noticeRowHtml(n, showMatchReasons) {
  const matchReasonsHtml = showMatchReasons && n.matchReasons && n.matchReasons.length
    ? `<div class="row-card-match-reasons">${n.matchReasons.map(r => `<span class="badge badge--blue">${escapeHtml(r)}</span>`).join('')}</div>`
    : '';
  const gradeHtml = n.grade ? gradeBadgeHtml(n.grade, GRADE_LABELS[n.grade] || n.grade) : '';
  // 공동수급 검토 서브태그(배지). 등급/공동수급의 "사유 텍스트 줄"은 목록을 심플하게
  // 유지하려고 2026-08-08 카드에서 제거했다(사유는 공고 상세에서 확인).
  const jointVentureBadgeHtml = n.jointVentureRecommended
    ? '<span class="badge badge--warn" title="실적 규모가 이 공고 예산 대비 작아 보입니다 — 참고용 신호일 뿐 메인 등급은 그대로입니다">공동수급 검토 권장</span>'
    : '';
  // 목록에서 바로 "참여 검토"에 담기/취소(토글). 로그인 + 회사 프로필이 있을 때만
  // 노출. n.pipelineStatus(서버가 내려줌)로 새로고침 후에도 담김 상태를 반영한다 —
  // "제외"(취소됨)와 미담김은 참여검토로, 그 외 담긴 상태는 담김으로 본다.
  const inPipeline = !!(n.pipelineStatus && n.pipelineStatus !== '제외');
  const pipelineBtnHtml = (currentUser && currentProfile)
    ? `<button type="button" class="btn btn-secondary btn-sm notice-row-pipeline-btn${inPipeline ? ' notice-row-pipeline-btn--active' : ''}" data-id="${escapeAttr(n.id)}" data-entry-id="${escapeAttr(n.pipelineEntryId || '')}" data-in-pipeline="${inPipeline ? 'true' : 'false'}" title="${inPipeline ? '담김 — 클릭하면 참여검토 취소' : '진행 중 사업(참여 검토)에 담기'}">${inPipeline ? '담김 ✓' : '참여검토'}</button>`
    : '';
  return `
    <div class="row-card notice-row" data-id="${escapeAttr(n.id)}">
      <div class="row-card-main">
        <div class="row-card-title">${escapeHtml(n.title)}</div>
        <div class="row-card-subtitle">
          ${noticeTypeBadgeHtml(n.noticeType)} ${gradeHtml} ${jointVentureBadgeHtml} ${escapeHtml(n.organizationName || '-')} · ${escapeHtml(n.region || '-')} · ${escapeHtml(n.industry || '-')} ·
          <span class="mono">${formatBudget(n.budgetAmount)}</span> · ${statusBadgeHtml(n.status)}
          ${n.recentlyChanged ? '<span class="status-badge status-badge--warn" title="최근 7일 내 공고 내용이 변경되었습니다">정정</span>' : ''}
          ${n.regionRestricted === true ? '<span class="row-card-region-restricted" title="지역제한 있음">📍제한</span>' : ''}
        </div>
      </div>
      <div class="row-card-side">
        ${ddayBadgeHtml(n.applicationEndAt)}
        ${pipelineBtnHtml}
        <span class="row-card-arrow">›</span>
      </div>
      ${matchReasonsHtml}
    </div>
  `;
}

// setNoticeRowPipelineBtn — 목록 "참여검토/담김" 버튼의 표시·데이터 상태를
// 토글 결과에 맞춰 갱신한다(라벨/툴팁/클래스/data-in-pipeline/data-entry-id).
function setNoticeRowPipelineBtn(btn, inPipeline, entryId) {
  btn.dataset.inPipeline = inPipeline ? 'true' : 'false';
  if (entryId) btn.dataset.entryId = entryId;
  btn.textContent = inPipeline ? '담김 ✓' : '참여검토';
  btn.classList.toggle('notice-row-pipeline-btn--active', inPipeline);
  btn.title = inPipeline ? '담김 — 클릭하면 참여검토 취소' : '진행 중 사업(참여 검토)에 담기';
}

// renderNoticeListItems — 상단에 "지금까지 몇 건 로드됐는지"를 보여주는
// 카운터 한 줄(#notice-list-counter) + 목록. 무한스크롤로 새 페이지를
// 불러올 때마다(loadMoreNotices) 이 함수가 통째로 다시 그리면서 카운터도
// 같이 갱신된다.
// NOTICE_LIST_BATCH_SIZE — loadMoreNotices가 한 번에 불러오는 페이지
// 크기(20건)와 반드시 같은 값. 무한스크롤 중 "20건 표시 중" 구분 표기를
// 몇 건마다 끼워 넣을지 여기서 결정한다.
const NOTICE_LIST_BATCH_SIZE = 20;

// noticeListCounterText — "N건 / 전체 M건 표시 중" 문구. 목록 맨 위 고정
// 카운터와, 20건 묶음마다 목록 중간에 끼는 구분 표기가 이 함수를 공유한다.
function noticeListCounterText(count, total) {
  return total > count
    ? `${count.toLocaleString()}건 / 전체 ${total.toLocaleString()}건 표시 중`
    : `${count.toLocaleString()}건 표시 중`;
}

function renderNoticeListItems(listBody, items, total, showMatchReasons) {
  if (!items.length) {
    listBody.className = 'empty';
    listBody.innerHTML = '';
    listBody.textContent = '조건에 맞는 공고가 없습니다.';
    return;
  }
  // 20건 묶음이 끝날 때마다(NOTICE_LIST_BATCH_SIZE 단위) 그 시점까지의
  // 누적 건수를 목록 중간에 구분 표기로 끼워 넣는다 — 스크롤이 길어져도
  // "지금까지 몇 건 봤는지"를 계속 확인할 수 있게.
  const rows = items.map((item, idx) => {
    const shown = idx + 1;
    const row = noticeRowHtml(item, showMatchReasons);
    if (shown % NOTICE_LIST_BATCH_SIZE === 0) {
      return row + `<p class="notice-list-batch-divider">${escapeHtml(noticeListCounterText(shown, total))}</p>`;
    }
    return row;
  }).join('');
  listBody.className = '';
  listBody.innerHTML = '';
  listBody.appendChild(h(`
    <div class="notice-list notice-list--cards">${rows}</div>
    <p id="notice-list-sentinel" class="notice-list-sentinel"></p>
  `));
  listBody.querySelectorAll('.notice-row').forEach(row => {
    row.addEventListener('click', () => {
      // 상세로 이동하기 직전 스크롤 위치를 저장 — "뒤로가기" 시 이 값으로 복원.
      if (noticeListState) noticeListState.scrollY = window.scrollY;
      location.hash = '#/notices/' + row.dataset.id;
    });
  });
  // 목록 카드의 "참여검토/담김" 버튼 — 카드 클릭(상세 이동)과 겹치지 않게 전파를
  // 막고 토글한다: 미담김이면 담기(POST, 제외였으면 서버가 검토전으로 재활성),
  // 담긴 상태면 참여검토 취소(PATCH status='제외'). 상태 전환은 백엔드가 값
  // 유효성만 검사하고 전환 규칙을 강제하지 않아 오류 없이 안전하다.
  listBody.querySelectorAll('.notice-row-pipeline-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      btn.disabled = true;
      try {
        if (btn.dataset.inPipeline === 'true') {
          // 참여 취소 = 진행 중 사업에서 완전 삭제(제외 상태로 남기지 않는다).
          await apiRequest('DELETE', '/api/pipeline/' + encodeURIComponent(btn.dataset.entryId));
          setNoticeRowPipelineBtn(btn, false);
          showToast('참여 검토를 취소했습니다.', 'success');
        } else {
          const entry = await apiRequest('POST', '/api/notices/' + encodeURIComponent(btn.dataset.id) + '/pipeline', {});
          setNoticeRowPipelineBtn(btn, true, entry && entry.id);
          showToast('진행 중 사업(참여 검토)에 담았습니다.', 'success');
        }
      } catch (err) {
        showToast(err.message || '처리에 실패했습니다.', 'error');
      } finally {
        btn.disabled = false;
      }
    });
  });
}

// wireNoticeListLoadMore — IntersectionObserver로 목록 끝의 sentinel이
// 화면에 걸리면(rootMargin만큼 미리) 자동으로 다음 페이지를 불러온다.
// renderNoticeListItems가 매번 sentinel을 새로 만들기 때문에, 이 함수도
// 호출될 때마다 새 Observer를 그 새 sentinel에 건다(이전 Observer는 옛
// sentinel이 DOM에서 떨어져 나가면서 자연히 무의미해짐).
function wireNoticeListLoadMore(listBody, key) {
  const sentinel = listBody.querySelector('#notice-list-sentinel');
  if (!sentinel || !noticeListState) return;
  if (!noticeListState.hasMore) {
    sentinel.textContent = noticeListState.items.length ? '모든 공고를 불러왔습니다.' : '';
    return;
  }
  // 로딩 텍스트를 하단에 두지 않는다 — 실제 로딩 표시는 fixed 정중앙 스피너
  // (loadMoreNotices의 showGlobalSpinner). 센티넬은 관측 대상으로만 비워둔다.
  sentinel.textContent = '';
  const filterParams = new URLSearchParams(location.hash.split('?')[1] || '');
  const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) {
      observer.disconnect();
      loadMoreNotices(listBody, key, filterParams, false);
    }
  }, { rootMargin: '400px' });
  observer.observe(sentinel);
}

// 맞춤공고 추천 히어로(2026-08-09) — "회사정보 보는 화면"을 "골라준 공고 보는 화면"
// 으로. /api/dashboard의 recommendations(이미 participationJudgment 포함)와
// homeListRowHtml(판정 배지 카드)·wireHomeListNav를 그대로 재사용한다 — 신규 추천
// 엔진·API·판정 로직 없음. 판정은 대시보드/공고상세/파이프라인 상세와 동일.
// cta는 그룹별 버튼 문구(§12/§6). ready(참여 가능)만 "참여할게요"로 곧바로
// 준비중에 담는 직접 참여 CTA(participate:true) — 나머지는 상세로 이동만 한다.
const SS_RECO_GROUPS = [
  { key: 'ready', label: '참여 가능', tone: 'pj-grade--ready', cta: '참여할게요', participate: true },
  { key: 'review', label: '확인 필요', tone: 'pj-grade--review', cta: '확인하기' },
  { key: 'pending', label: '분석 대기', tone: 'pj-grade--review', cta: '상세 보기' },
  { key: 'fail', label: '참여 어려움', tone: 'pj-grade--fail', cta: '이유 보기' },
];

// savedSearchRecoGroup — 추천 항목을 판정(judgment)으로 4그룹 분류. recommendationJudgment
// DTO는 grade/gradeLabel/reasons만 담으므로, "분석 대기"는 needsReview 중 사유가
// "공고문 분석 대기" 하나뿐인 경우로 구분한다(가짜 값 만들지 않음).
function savedSearchRecoGroup(item) {
  const j = item.judgment;
  if (!j) return 'pending';
  if (j.grade === 'ready') return 'ready';
  if (j.grade === 'notRecommended') return 'fail';
  const reasons = j.reasons || [];
  if (reasons.length === 1 && reasons[0] === '공고문 분석 대기') return 'pending';
  return 'review';
}

function renderSavedSearchRecommendations(container, recommendations) {
  if (!container) return;
  const recs = (recommendations || []).slice();
  container.innerHTML = '';
  if (!recs.length) {
    container.appendChild(h('<div class="detail-card"><h3>오늘의 맞춤공고</h3><p class="empty">지금 조건에 맞는 새 추천 공고가 없어요. 회사정보를 더 등록하거나 아래 맞춤공고 조건을 넓혀보세요.</p></div>'));
    return;
  }
  recs.forEach(it => { it._grp = savedSearchRecoGroup(it); });
  const counts = {};
  SS_RECO_GROUPS.forEach(g => { counts[g.key] = recs.filter(it => it._grp === g.key).length; });
  const nonEmpty = SS_RECO_GROUPS.filter(g => counts[g.key] > 0); // 0건 그룹은 숨김(§11)
  const summaryChips = nonEmpty.map(g =>
    `<span class="ss-reco-chip"><span class="pj-mini ${g.tone}">${escapeHtml(g.label)}</span> <strong>${counts[g.key]}</strong></span>`).join('');
  const filters = ['전체', ...nonEmpty.map(g => g.label)];
  // 정렬: 참여 가능 → 확인 필요 → 분석 대기 → 참여 어려움 (그룹 내부는 기존 마감순 유지)
  const gOrder = { ready: 0, review: 1, pending: 2, fail: 3 };
  recs.sort((a, b) => gOrder[a._grp] - gOrder[b._grp]);
  const metaByKey = {}; SS_RECO_GROUPS.forEach(g => { metaByKey[g.key] = g; });
  const listHtml = recs.map(it => {
    const g = metaByKey[it._grp];
    // CTA는 그룹별(§12), 배지 라벨도 그룹 라벨로 통일(분석 대기 등) — tone은 grade 기준 유지.
    const copy = Object.assign({}, it, { ctaLabel: g.cta, judgment: Object.assign({}, it.judgment, { gradeLabel: g.label }) });
    // 참여 가능(ready)은 CTA에서 곧바로 참여하도록 noticeId를 심고 참여 플래그를 단다.
    const extra = g.participate ? ` data-participate="1" data-notice-id="${escapeAttr(it.noticeId || '')}"` : '';
    return `<div class="ss-reco-item" data-group="${it._grp}"${extra}>${homeListRowHtml(copy)}</div>`;
  }).join('');
  container.appendChild(h(`
    <div class="detail-card ss-reco-card">
      <div class="ss-reco-head"><h3>오늘의 맞춤공고</h3><span class="ss-reco-total">${recs.length}건</span></div>
      <div class="ss-reco-summary">${summaryChips}</div>
      <div class="ss-reco-filters">${filters.map((f, i) => `<button type="button" class="ss-reco-filter${i === 0 ? ' is-active' : ''}" data-filter="${escapeAttr(f)}">${escapeHtml(f)}</button>`).join('')}</div>
      <div class="home-list ss-reco-list">${listHtml}</div>
    </div>
  `));
  const labelToKey = {}; SS_RECO_GROUPS.forEach(g => { labelToKey[g.label] = g.key; });
  container.querySelectorAll('.ss-reco-filter').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.ss-reco-filter').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      const f = btn.dataset.filter, key = labelToKey[f];
      container.querySelectorAll('.ss-reco-item').forEach(item => {
        item.style.display = (f === '전체' || item.dataset.group === key) ? '' : 'none';
      });
    });
  });
  // 참여 가능(ready) 카드의 "참여할게요" CTA — 카드 클릭(상세 이동)과 겹치지 않게
  // 전파를 막고, 검토중을 거치지 않고 곧바로 준비중에 담은 뒤 워크스페이스로 이동한다
  // (참여 흐름 2클릭화, 2026-08-10). 되돌리기는 워크스페이스의 "참여 취소".
  container.querySelectorAll('.ss-reco-item[data-participate="1"] .home-list-cta').forEach(btn => {
    btn.tabIndex = 0; // homeListRowHtml이 -1로 두므로 직접 참여 CTA는 포커스 가능하게 되돌림
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const item = btn.closest('.ss-reco-item');
      const noticeId = item && item.dataset.noticeId;
      if (!noticeId) return;
      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = '담는 중...';
      try {
        const entry = await apiRequest('POST', '/api/notices/' + encodeURIComponent(noticeId) + '/pipeline', { targetStatus: '준비중' });
        location.hash = '#/pipeline/' + entry.id;
      } catch (err) {
        btn.disabled = false;
        btn.textContent = orig;
        if (err.status === 401) { location.hash = '#/auth/login'; return; }
        if (err.code === 'company_profile_required') { showToast('회사 정보를 먼저 등록해주세요.', 'error'); return; }
        if (err.code === 'pipeline_quota_exceeded') { showToast('진행 중 사업 등록 한도에 도달했습니다.', 'error'); return; }
        showToast(err.message || '참여 처리에 실패했습니다.', 'error');
      }
    });
  });
  wireHomeListNav(container); // 카드 클릭(CTA 외 영역) → ctaHref 상세 이동(재사용)
}

// renderProfileTabsScreen — .profile-tabs 패턴 공용 껍데기. 회사정보 화면과
// (필요 시) 다른 다중탭 화면이 같은 UI/이벤트 배선을 재사용한다. 각 탭 render는
// (container)만 받는 기존 자족 함수라 새로 만들지 않는다.
function renderProfileTabsScreen(container, tabs, opts) {
  opts = opts || {};
  const headerHtml = opts.title ? `<h2>${escapeHtml(opts.title)}</h2>` : '';
  const introHtml = opts.intro ? `<p class="license-card-meta">${opts.intro}</p>` : '';
  container.innerHTML = '';
  container.appendChild(h(`
    ${headerHtml}
    ${introHtml}
    <div class="profile-tabs">
      ${tabs.map((t, i) => `<button type="button" class="profile-tab-btn${i === 0 ? ' is-active' : ''}" data-tab="${t.key}">${escapeHtml(t.label)}</button>`).join('')}
    </div>
    <div id="profile-tabs-content"></div>
  `));
  const tabContent = document.getElementById('profile-tabs-content');
  const tabRenderers = {};
  tabs.forEach(t => { tabRenderers[t.key] = () => t.render(tabContent); });
  tabRenderers[tabs[0].key]();
  container.querySelectorAll('.profile-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.profile-tab-btn').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      tabRenderers[btn.dataset.tab]();
    });
  });
}

// renderCompanyInfo — 회사정보 화면(#/me/company, IA 재정리 2026-08-10). 예전
// 맞춤공고 화면에 섞여 있던 기업정보/재무/실적/인력/면허·인증 5개 탭을 그대로
// 옮겨 재사용한다(새 CRUD/API 없음, 저장 데이터 유실 없음). 판정에 쓰이는 회사
// 프로필 자료를 한 곳에서 관리한다.
async function renderCompanyInfo(container) {
  // renderProfileBasicTab 등이 currentProfile 전역을 읽으므로 진입 시 최신화.
  try {
    const me = await apiRequest('GET', '/api/me');
    currentUser = me.user;
    currentProfile = me.companyProfile;
    renderHeader();
  } catch (err) {
    location.hash = '#/auth/login';
    return;
  }
  renderProfileTabsScreen(container, COMPANY_INFO_TABS, {

    intro: '참여 판정에 쓰이는 회사 자료를 관리합니다. 면허·인증은 공고 참여 판정에 바로 반영됩니다.',
  });
}

// renderSavedSearches — 맞춤공고 화면(IA 재정리 2026-08-10). 이제 "추천공고를 보고
// 참여를 결정하는 화면"에 집중한다: 추천 리스트(판정 그룹/필터) + 추천 조건 설정.
// 회사정보 관리(기업정보/재무/실적/인력/면허·인증)는 #/me/company로, 담당자 관리는
// 진행 중 사업으로 분리했다(각 render 함수는 그대로 재사용, 데이터/저장 API 무변경).
async function renderSavedSearches(container) {
  let me;
  try {
    me = await apiRequest('GET', '/api/me');
  } catch (err) {
    location.hash = '#/auth/login';
    return;
  }
  currentUser = me.user;
  currentProfile = me.companyProfile;
  renderHeader();

  // 추천 공고는 대시보드 데이터를 재사용한다(신규 API 없음). best-effort.
  let dashData = null;
  try { dashData = await apiRequest('GET', '/api/dashboard'); } catch (e) { dashData = null; }
  const recommendations = (dashData && dashData.recommendations) || [];

  container.innerHTML = '';
  // §10/§14: "추천을 보는 것"(오늘의 맞춤공고)과 "추천 기준을 관리하는 것"(내 맞춤조건)을
  // 명확한 섹션 구분선으로 분리한다.
  // 레이아웃 마감(2026-08-11): 페이지 본문 전체를 하나의 콘텐츠 그리드(.saved-search-page)로
  // 감싼다. 예전엔 각 섹션이 main>*로 개별 가운데정렬됐는데, 일부 요소의 `margin: x 0 y`
  // 축약형이 main>*의 margin-left/right:auto를 덮어써 넓은 화면(≥~1384px)에서 좌우 기준선이
  // 28px씩 틀어졌다. 이제 그리드 하나만 정렬되고 내부는 flex column + gap으로 좌우 edge와
  // 세로 간격을 단일 기준으로 통일한다(중복 margin/gap 이중간격 없음).
  container.appendChild(h(`
    <div class="saved-search-page">
      <h2>맞춤공고</h2>
      <div id="saved-search-reco-section"></div>
      <details class="ss-profile-collapse">
        <summary>더 정확한 추천을 위해 — 회사정보 등록</summary>
        <div id="profile-completeness-section"></div>
        <a href="#/me/company" class="official-link">회사정보 관리로 이동 &rarr;</a>
      </details>
      <div class="ss-section-divider">
        <h3 class="ss-section-divider-title">내 맞춤조건</h3>
        <p class="ss-section-divider-desc">AI가 어떤 사업을 찾아볼지 관리해요.</p>
      </div>
      <div id="saved-searches-list-section"></div>
    </div>
  `));
  renderSavedSearchRecommendations(document.getElementById('saved-search-reco-section'), recommendations);
  renderProfileCompletenessCard(document.getElementById('profile-completeness-section'));
  renderSavedSearchesListTab(document.getElementById('saved-searches-list-section'));
}

// renderSavedSearchesListTab — 맞춤공고 조건 목록+생성/수정 폼(예전
// renderSavedSearches의 본문). 담당자 목록은 "이 알림을 받을 담당자"
// 체크박스/카드 요약에 계속 필요해 그대로 불러온다 — 관리 UI 자체는
// "담당자 관리" 탭으로 옮겨갔다.
// autoEditId(2026-08-07, "복제" 버튼) — 값이 있으면 목록을 새로 그린
// 직후 그 id 항목의 수정 폼을 자동으로 열고 그쪽으로 스크롤한다. "복제
// 클릭 → 생성 즉시 그 새 조건의 수정 화면으로 이동"을 이 화면은 별도
// URL 라우트 없이 인라인 폼으로 구현하므로, "이동"은 목록 재조회 후
// 해당 카드의 수정 폼을 여는 것으로 표현한다.
function nextDuplicateNameClientSide(existingNames, base) {
  if (!existingNames.has(base)) return base;
  for (let n = 2; ; n++) {
    const candidate = `${base} ${n}`;
    if (!existingNames.has(candidate)) return candidate;
  }
}
async function renderSavedSearchesListTab(container, autoEditId) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data, contactsData;
  try {
    [data, contactsData] = await Promise.all([
      apiRequest('GET', '/api/me/saved-searches'),
      apiRequest('GET', '/api/me/contacts'),
    ]);
  } catch (err) {
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }
  const items = data.items || [];
  const contacts = contactsData.items || [];

  container.innerHTML = '';
  // 기본 조건(항상 1개) 먼저, 추가 조건은 그 아래(§15). 정책은 백엔드 그대로.
  const defaultItem = items.find(isDefaultSavedSearchCard) || null;
  const additional = items.filter(i => !isDefaultSavedSearchCard(i));
  // 비활성 추가 조건이 "다른 활성 조건과 같은 업종"이라 활성화가 막히는지(백엔드
  // findActiveSavedSearchIndustryConflict와 동일한 판단) — 왜 비활성인지 안내에 사용.
  const activeIndustries = new Set(items.filter(i => i.isActive && i.industry).map(i => i.industry));
  const isConflict = i => !i.isActive && !!i.industry && activeIndustries.has(i.industry);

  // 기본 조건이 없을 때: 백엔드가 업종 충돌로 자동 생성을 건너뛴 경우(A안)엔 그 이유를
  // 정직하게 안내하고 현재 조건을 그대로 쓰게 한다(사용자 데이터 자동 변경 없음).
  const defaultHtml = defaultItem
    ? savedSearchCardHtml(defaultItem, contacts)
    : (data.defaultSkippedConflict
        ? `<div class="ss-cond-card"><div class="ss-cond-conflict"><p>현재 활성 중인 맞춤조건${data.defaultConflictName ? ` ('${escapeHtml(data.defaultConflictName)}')` : ''}이 회사 기본 업종과 같아, 중복 추천을 방지하기 위해 <strong>기본 맞춤조건을 자동 생성하지 않았어요</strong>. 지금 조건을 그대로 사용하시면 돼요.</p></div></div>`
        : '<p class="ss-cond-empty">기본 맞춤조건이 없어요. 회사정보(지역·업종)를 등록하면 자동으로 만들어져요.</p>');
  const additionalHtml = additional.length
    ? additional.map(i => savedSearchCardHtml(i, contacts, { conflict: isConflict(i) })).join('')
    : '<p class="ss-cond-empty">아직 추가한 맞춤조건이 없어요. 다른 업종의 공고도 받고 싶다면 추가해보세요.</p>';

  container.appendChild(h(`
    <div class="ss-cond-section">
      <h3 class="ss-cond-section-title">기본 맞춤조건</h3>
      <div class="ss-cond-list">${defaultHtml}</div>
    </div>
    <div class="ss-cond-section">
      <div class="ss-cond-section-head">
        <h3 class="ss-cond-section-title">추가 맞춤조건</h3>
        <button type="button" id="saved-search-add-btn" class="btn btn-primary btn-sm">+ 맞춤조건 추가</button>
      </div>
      <p class="ss-cond-section-desc">다른 업종의 공고도 받아보고 싶다면 맞춤조건을 추가할 수 있어요. 매일 아침 새 공고가 이메일로 도착합니다.</p>
      <div id="saved-search-form-slot"></div>
      <div class="ss-cond-list" id="saved-search-list">${additionalHtml}</div>
    </div>
  `));

  const formSlot = document.getElementById('saved-search-form-slot');
  const byId = idv => items.find(i => i.id === idv);
  // 공용 액션(기본 카드의 인라인 버튼 + 추가 카드의 ⋮ 오버플로우가 함께 쓴다).
  const openEdit = idv => { const it = byId(idv); if (it) renderSavedSearchForm(formSlot, it, contacts, () => renderSavedSearchesListTab(container)); };
  const openDuplicate = idv => {
    const source = byId(idv); if (!source) return;
    const existingNames = new Set(items.map(i => i.name));
    const suggestedName = nextDuplicateNameClientSide(existingNames, source.name + ' 복제');
    const body = openModal('맞춤조건 복제', `
      <p class="modal-message">복제한 조건의 이름을 확인하거나 수정해주세요. 복제본은 중복 추천 방지를 위해 <strong>비활성 상태</strong>로 시작해요.</p>
      <form id="duplicate-name-form" class="profile-form">
        <label>조건 이름<input type="text" name="name" required value="${escapeAttr(suggestedName)}"></label>
        <div id="duplicate-name-error" class="error" style="display:none"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="duplicate-name-cancel-btn">취소</button>
          <button type="submit" class="btn btn-primary">복제</button>
        </div>
      </form>
    `);
    body.querySelector('#duplicate-name-cancel-btn').addEventListener('click', closeModal);
    const form = body.querySelector('#duplicate-name-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = body.querySelector('#duplicate-name-error');
      errorBox.style.display = 'none';
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      try {
        const res = await apiRequest('POST', '/api/me/saved-searches/' + encodeURIComponent(idv) + '/duplicate', { name: form.elements['name'].value });
        closeModal();
        showToast('맞춤조건을 복제했어요. 같은 업종이라 비활성 상태예요 — 다른 업종으로 바꾸면 활성화할 수 있어요.', 'success');
        renderSavedSearchesListTab(container, res.id, { focusDuplicate: true }); // 복제본으로 이동
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
      }
    });
  };
  const confirmDelete = idv => {
    const it = byId(idv);
    openConfirmModal({
      title: '맞춤조건 삭제',
      message: it ? `'${it.name}' 맞춤조건을 삭제할까요? 이 조건으로 더 이상 새로운 공고를 추천하지 않습니다.` : '이 맞춤조건을 삭제하시겠습니까?',
      confirmLabel: '삭제',
      tone: 'danger',
      onConfirm: async () => {
        await apiRequest('DELETE', '/api/me/saved-searches/' + encodeURIComponent(idv));
        renderSavedSearchesListTab(container);
      },
    });
  };

  document.getElementById('saved-search-add-btn').addEventListener('click', () => {
    renderSavedSearchForm(formSlot, null, contacts, () => renderSavedSearchesListTab(container));
  });
  // 기본 카드 인라인 버튼(조건 수정/복제) + 업종 변경하기(비활성 사유 해소용).
  container.querySelectorAll('.saved-search-edit-btn, .saved-search-change-industry-btn').forEach(btn => {
    btn.addEventListener('click', () => openEdit(btn.dataset.id));
  });
  container.querySelectorAll('.saved-search-duplicate-btn').forEach(btn => {
    btn.addEventListener('click', () => openDuplicate(btn.dataset.id));
  });
  // 추가 카드 ⋮ 오버플로우 — 수정/복제/삭제를 접어 버튼 밀도를 낮춘다(§16).
  container.querySelectorAll('.saved-search-more-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idv = btn.dataset.id;
      const menu = openDropdown(e.currentTarget, `
        <button type="button" class="dropdown-menu-item" data-act="edit">수정</button>
        <button type="button" class="dropdown-menu-item" data-act="duplicate">복제</button>
        <hr class="dropdown-divider">
        <button type="button" class="dropdown-menu-item dropdown-menu-item--danger" data-act="delete">삭제</button>
      `, { align: 'right' });
      if (!menu) return;
      menu.querySelectorAll('.dropdown-menu-item').forEach(mi => mi.addEventListener('click', () => {
        closeActiveDropdown();
        const act = mi.dataset.act;
        if (act === 'edit') openEdit(idv);
        else if (act === 'duplicate') openDuplicate(idv);
        else if (act === 'delete') confirmDelete(idv);
      }));
    });
  });
  container.querySelectorAll('.saved-search-results-link').forEach(a => {
    a.addEventListener('click', () => { noticeListState = null; }); // 새 조건 결과이므로 무한스크롤 캐시 폐기
  });
  container.querySelectorAll('.saved-search-active-toggle').forEach(toggle => {
    toggle.addEventListener('change', async () => {
      const nextValue = toggle.checked;
      const idv = toggle.dataset.id;
      toggle.disabled = true;
      try {
        await apiRequest('PUT', '/api/me/saved-searches/' + encodeURIComponent(idv) + '/active', { isActive: nextValue });
        renderSavedSearchesListTab(container);
      } catch (err) {
        toggle.checked = !nextValue; // 실패 시 원상복구
        toggle.disabled = false;
        if (err.status === 401) { location.hash = '#/auth/login'; return; }
        // industry_overlap — 오류가 아니라 "다음 행동을 알려주는 안내"로(§8). 겹치는
        // 조건 이름 + [업종 변경하기] CTA를 함께 준다.
        if (err.code === 'industry_overlap') {
          const conflictName = err.data && err.data.conflictName;
          const message = conflictName
            ? `'${conflictName}' 조건과 <strong>같은 업종</strong>이에요. 같은 공고가 중복 추천되지 않도록, 업종이 겹치지 않는 조건만 동시에 활성화할 수 있어요.`
            : escapeHtml(err.message);
          const body = openModal('아직 활성화할 수 없어요', `
            <p class="modal-message">${message} 다른 업종으로 변경한 후 활성화해주세요.</p>
            <div class="modal-actions">
              <button type="button" class="btn btn-secondary" id="industry-overlap-cancel-btn">닫기</button>
              <button type="button" class="btn btn-primary" id="industry-overlap-change-btn">업종 변경하기</button>
            </div>
          `);
          body.querySelector('#industry-overlap-cancel-btn').addEventListener('click', closeModal);
          body.querySelector('#industry-overlap-change-btn').addEventListener('click', () => { closeModal(); openEdit(idv); });
        }
      }
    });
  });

  // 복제 직후(§20): 복제본 카드로 스크롤 + 잠깐 강조. 카드 자체가 "같은 업종이라 비활성 ·
  // 업종 변경하기" 안내를 담고 있어, 폼을 바로 열지 않고 사용자가 상황을 먼저 보게 한다.
  if (autoEditId) {
    const toggle = container.querySelector(`.saved-search-active-toggle[data-id="${autoEditId}"]`);
    const card = toggle && toggle.closest('.ss-cond-card');
    if (card) {
      card.classList.add('ss-cond-card--highlight');
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => card.classList.remove('ss-cond-card--highlight'), 2400);
    }
  }
}

function savedSearchResultsHash(item) {
  const p = new URLSearchParams();
  if (item.region) p.set('region', item.region);
  if (item.industry) p.set('industry', item.industry);
  if (item.noticeType) p.set('noticeType', item.noticeType);
  if (item.organizationName) p.set('organizationName', item.organizationName);
  if (item.budgetMin != null) p.set('budgetMin', String(item.budgetMin));
  if (item.budgetMax != null) p.set('budgetMax', String(item.budgetMax));
  if (item.keywordsInclude && item.keywordsInclude.length) p.set('keywordsInclude', item.keywordsInclude.join(','));
  if (item.keywordsExclude && item.keywordsExclude.length) p.set('keywordsExclude', item.keywordsExclude.join(','));
  p.set('savedSearchName', item.name);
  return '#/notices?' + p.toString();
}

// savedSearchNotificationSummary — 카드에 보여줄 "알림 설정" 요약 줄.
// 상세 편집(다중선택 D-day/담당자 체크박스)은 renderSavedSearchForm에서만
// 하고, 카드에는 지금 어떻게 설정돼있는지만 한 줄로 보여준다(다른
// 조건 항목들과 같은 요약형 표시 관례).
function savedSearchNotificationSummary(item, contacts) {
  const parts = [];
  parts.push(item.alertEnabled ? '추천공고 다이제스트 켜짐' : '추천공고 다이제스트 꺼짐');
  if (item.reminderEnabled) {
    const days = (item.reminderDaysBefore || []).slice().sort((a, b) => b - a).map(d => `D-${d}`).join(', ');
    parts.push(`제출마감 리마인더 켜짐(${days || '시점 미선택'})`);
  }
  const ids = item.recipientContactIds || [];
  if (ids.length) {
    const names = ids.map(id => (contacts.find(c => c.id === id) || {}).name).filter(Boolean);
    parts.push('수신 담당자: ' + (names.length ? names.join(', ') : `${ids.length}명`));
  } else {
    parts.push('수신 담당자: 미지정(계정 이메일로 발송)');
  }
  return parts.join(' · ');
}

// 개업일/업력 입력은 목록 카드가 아니라 "수정" 클릭 시 열리는 편집
// 폼(regionIndustryCompanySizeFieldsHtml의 isDefault 분기)에만 있다 —
// 2026-08-07, 목록 화면에 바로 노출돼 있던 걸 편집 화면 안으로 이동.

// savedSearchConditionParts — 카드에 보여줄 조건 요약(지역·업종·유형·금액·키워드).
function savedSearchConditionParts(item) {
  const parts = [];
  const noticeTypeLabel = (SAVED_SEARCH_NOTICE_TYPE_OPTIONS.find(o => o.value === (item.noticeType || '')) || {}).label;
  if (noticeTypeLabel && item.noticeType) parts.push(noticeTypeLabel);
  if (item.region) parts.push(escapeHtml(item.region));
  if (item.industry) parts.push(escapeHtml(item.industry));
  // 기업규모는 saved_searches에 컬럼이 없어 기본 조건 카드에만 currentProfile 값을 참고 표시.
  if (item.origin === 'onboarding' && currentProfile && currentProfile.companySize) parts.push(escapeHtml(currentProfile.companySize));
  if (item.organizationName) parts.push('발주기관: ' + escapeHtml(item.organizationName));
  if (item.budgetMin != null || item.budgetMax != null) {
    parts.push(`${item.budgetMin != null ? formatBudget(item.budgetMin) : '제한없음'} ~ ${item.budgetMax != null ? formatBudget(item.budgetMax) : '제한없음'}`);
  }
  if (item.keywordsInclude && item.keywordsInclude.length) parts.push('포함: ' + item.keywordsInclude.map(escapeHtml).join(', '));
  if (item.keywordsExclude && item.keywordsExclude.length) parts.push('제외: ' + item.keywordsExclude.map(escapeHtml).join(', '));
  return parts;
}

// savedSearchCardHtml — 맞춤조건 카드(2026-08-10 재설계). 기본 조건(origin='onboarding')과
// 추가 조건을 시각적으로 구분한다. 정책은 전부 기존 백엔드 그대로(기본=삭제/비활성 불가,
// 복제본=비활성 시작, 동일 업종 활성화 금지). opts.conflict=이 비활성 카드의 업종이 다른
// "활성" 조건과 겹쳐 활성화가 막히는 상태(왜 비활성인지 안내 + 업종 변경 CTA).
function savedSearchCardHtml(item, contacts, opts) {
  opts = opts || {};
  const conditionParts = savedSearchConditionParts(item);
  const metaHtml = `<div class="ss-cond-meta">${conditionParts.length ? conditionParts.join(' · ') : '조건 없음(전체 공고)'}</div>`;
  const id = escapeAttr(item.id);

  if (isDefaultSavedSearchCard(item)) {
    // 기본 조건 — [기본][항상 활성] 비조작 표시, 삭제/토글 없음. 결과 보기·조건 수정·복제만.
    return `
      <div class="ss-cond-card ss-cond-card--default">
        <div class="ss-cond-head">
          <div class="ss-cond-name">내 기본 맞춤조건</div>
          <div class="ss-cond-badges"><span class="ss-badge ss-badge--primary">기본</span><span class="ss-badge ss-badge--active">● 항상 활성</span></div>
        </div>
        ${metaHtml}
        <p class="ss-cond-desc">회원가입 때 설정한 사업정보를 기준으로 맞춤공고를 자동으로 찾고 있어요.</p>
        <div class="ss-cond-actions">
          <a class="btn btn-secondary btn-sm saved-search-results-link" href="${escapeAttr(savedSearchResultsHash(item))}">결과 보기</a>
          <button type="button" class="btn btn-secondary btn-sm saved-search-edit-btn" data-id="${id}">조건 수정</button>
          <button type="button" class="btn btn-secondary btn-sm saved-search-duplicate-btn" data-id="${id}">복제</button>
        </div>
      </div>`;
  }

  // 추가 조건 — 활성 토글 직접 노출 + 보조 액션(수정/복제/삭제)은 ⋮ 오버플로우로.
  const alertBadge = item.alertEnabled ? '<span class="ss-badge ss-badge--ok">알림 켜짐</span>' : '<span class="ss-badge ss-badge--muted">알림 꺼짐</span>';
  const resultsBtn = item.isActive
    ? `<a class="btn btn-secondary btn-sm saved-search-results-link" href="${escapeAttr(savedSearchResultsHash(item))}">결과 보기</a>`
    : `<button type="button" class="btn btn-secondary btn-sm" disabled title="비활성 상태라 결과 보기를 사용할 수 없어요. 활성화하면 확인할 수 있어요.">결과 보기</button>`;
  const conflictHtml = opts.conflict
    ? `<div class="ss-cond-conflict">
        <p>다른 활성 맞춤조건과 <strong>같은 업종</strong>이에요. 같은 공고가 중복 추천되지 않도록, <strong>다른 업종으로 변경</strong>해야 활성화할 수 있어요.</p>
        <button type="button" class="btn btn-primary btn-sm saved-search-change-industry-btn" data-id="${id}">업종 변경하기</button>

    : '';
  return `
    <div class="ss-cond-card${item.isActive ? '' : ' ss-cond-card--inactive'}">

        <div class="ss-cond-side-top">
          <label class="toggle-switch" title="꺼두면 검색 매칭·알림·결과 보기가 모두 중단됩니다. 켜려면 다른 활성 조건과 업종이 겹치지 않아야 해요.">
            <input type="checkbox" class="saved-search-active-toggle" data-id="${id}" ${item.isActive ? 'checked' : ''}>
            <span class="toggle-switch-track"><span class="toggle-switch-thumb"></span></span>
            <span class="toggle-switch-label">${item.isActive ? '활성' : '비활성'}</span>
          </label>
          <button type="button" class="ss-cond-more saved-search-more-btn" data-id="${id}" aria-label="더보기">⋮</button>
        </div>
      </div>
      ${metaHtml}
      <div class="ss-cond-notify">${escapeHtml(savedSearchNotificationSummary(item, contacts))}</div>
      ${conflictHtml}

  `;
}

// SAVED_SEARCH_REMINDER_DAY_OPTIONS — 제출마감 리마인더 다중선택
// (D-7/D-3/D-1), sendSavedSearchDeadlineReminders가 스케줄하는 오프셋과
// 정확히 같은 값(validSavedSearchReminderDays도 이 3개만 허용).
const SAVED_SEARCH_REMINDER_DAY_OPTIONS = [7, 3, 1];

// ---------- 맞춤공고 예산 슬라이더(2026-08-07) ----------
// BUDGET_SLIDER_BREAKPOINTS — 슬라이더 위치(0~1000)를 금액(원)으로
// 매핑하는 구간별 선형보간표. 순수 로그공식 대신 손으로 구간을 잡은
// 이유: 로컬 운영 데이터 실측(열린 공고 775건, budget_amount>0 기준
// 중앙값 약 7천만원 · 90번째 백분위수 약 5억원 · 99번째 백분위수 약
// 59억원 · 최댓값 약 938억원)에 맞춰 "실제 공고가 몰려있는 0~5억원
// 구간은 촘촘하게, 그 이상 드문 구간은 넓게" 배분하기 위함 — 순수
// 로그스케일보다 실데이터 분포를 더 정확히 반영한다. 100억원을 상한으로
// 잡음(사용자 스펙).
const BUDGET_SLIDER_MAX_POS = 1000;
const BUDGET_SLIDER_BREAKPOINTS = [
  { pos: 0, amount: 0 },
  { pos: 100, amount: 10000000 },      // 1천만원
  { pos: 250, amount: 50000000 },      // 5천만원 (실측 중앙값 부근)
  { pos: 400, amount: 100000000 },     // 1억원
  { pos: 550, amount: 300000000 },     // 3억원
  { pos: 700, amount: 1000000000 },    // 10억원 (실측 90번째 백분위수 부근)
  { pos: 850, amount: 3000000000 },    // 30억원
  { pos: 1000, amount: 10000000000 },  // 100억원
];

function budgetSliderPosToAmount(pos) {
  const bps = BUDGET_SLIDER_BREAKPOINTS;
  const p = Math.max(0, Math.min(BUDGET_SLIDER_MAX_POS, pos));
  for (let i = 1; i < bps.length; i++) {
    if (p <= bps[i].pos) {
      const a = bps[i - 1], b = bps[i];
      const ratio = (p - a.pos) / (b.pos - a.pos);
      return Math.round(a.amount + (b.amount - a.amount) * ratio);
    }
  }
  return bps[bps.length - 1].amount;
}

function budgetAmountToSliderPos(amount) {
  const bps = BUDGET_SLIDER_BREAKPOINTS;
  const amt = Math.max(0, Math.min(bps[bps.length - 1].amount, amount));
  for (let i = 1; i < bps.length; i++) {
    if (amt <= bps[i].amount) {
      const a = bps[i - 1], b = bps[i];
      if (b.amount === a.amount) return b.pos;
      const ratio = (amt - a.amount) / (b.amount - a.amount);
      return Math.round(a.pos + (b.pos - a.pos) * ratio);
    }
  }
  return bps[bps.length - 1].pos;
}

// renderBudgetRangeSlider — 듀얼 핸들 range slider. 라이브러리 없이
// <input type="range"> 두 개를 같은 자리에 겹쳐서 구현하는 관례적
// 방법(트랙 배경은 투명 처리하고 CSS로 핸들에만 pointer-events를
// 살려서 각각 독립적으로 잡을 수 있게 함 — .budget-slider-input CSS
// 참고). minInput/maxInput은 실제 폼 제출에 쓰이는 기존 텍스트
// 필드(name="budgetMin"/"budgetMax")를 그대로 받아 양방향으로 동기화
// 한다 — 슬라이더를 움직이면 텍스트도 바뀌고, 텍스트를 직접 입력해도
// 슬라이더가 그 위치로 따라간다(정밀 조정 병행 지원).
function renderBudgetRangeSlider(container, minInput, maxInput) {
  const initialMinAmount = parseCurrencyInput(minInput.value);
  const initialMaxAmount = parseCurrencyInput(maxInput.value);
  const initialMinPos = initialMinAmount != null ? budgetAmountToSliderPos(Number(initialMinAmount)) : 0;
  const initialMaxPos = initialMaxAmount != null ? budgetAmountToSliderPos(Number(initialMaxAmount)) : BUDGET_SLIDER_MAX_POS;

  container.innerHTML = `
    <div class="budget-slider-values">
      <span id="budget-slider-min-label"></span>
      <span id="budget-slider-max-label"></span>
    </div>
    <div class="budget-slider">
      <div class="budget-slider-track"></div>
      <div class="budget-slider-range" id="budget-slider-range"></div>
      <input type="range" class="budget-slider-input budget-slider-input--min" id="budget-slider-min" min="0" max="${BUDGET_SLIDER_MAX_POS}" value="${initialMinPos}">
      <input type="range" class="budget-slider-input budget-slider-input--max" id="budget-slider-max" min="0" max="${BUDGET_SLIDER_MAX_POS}" value="${initialMaxPos}">
    </div>
  `;

  const rangeEl = container.querySelector('#budget-slider-range');
  const minRangeInput = container.querySelector('#budget-slider-min');
  const maxRangeInput = container.querySelector('#budget-slider-max');
  const minLabel = container.querySelector('#budget-slider-min-label');
  const maxLabel = container.querySelector('#budget-slider-max-label');

  function updateVisual() {
    const minP = Number(minRangeInput.value);
    const maxP = Number(maxRangeInput.value);
    rangeEl.style.left = (minP / BUDGET_SLIDER_MAX_POS * 100) + '%';
    rangeEl.style.width = ((maxP - minP) / BUDGET_SLIDER_MAX_POS * 100) + '%';
    minLabel.textContent = minP > 0 ? formatCurrency(budgetSliderPosToAmount(minP)) + '원' : '제한없음';
    maxLabel.textContent = maxP < BUDGET_SLIDER_MAX_POS ? formatCurrency(budgetSliderPosToAmount(maxP)) + '원' : '제한없음';
  }

  function syncFromSlider(movedInput) {
    let minP = Number(minRangeInput.value);
    let maxP = Number(maxRangeInput.value);
    if (minP > maxP) {
      // 핸들이 서로 교차하지 못하게 고정 — 방금 움직인 쪽에 상대편을 붙인다.
      if (movedInput === minRangeInput) { maxP = minP; maxRangeInput.value = maxP; }
      else { minP = maxP; minRangeInput.value = minP; }
    }
    minInput.value = minP > 0 ? formatCurrency(budgetSliderPosToAmount(minP)) : '';
    maxInput.value = maxP < BUDGET_SLIDER_MAX_POS ? formatCurrency(budgetSliderPosToAmount(maxP)) : '';
    updateVisual();
  }

  minRangeInput.addEventListener('input', () => syncFromSlider(minRangeInput));
  maxRangeInput.addEventListener('input', () => syncFromSlider(maxRangeInput));

  minInput.addEventListener('change', () => {
    const amount = parseCurrencyInput(minInput.value);
    minRangeInput.value = amount != null ? budgetAmountToSliderPos(Number(amount)) : 0;
    updateVisual();
  });
  maxInput.addEventListener('change', () => {
    const amount = parseCurrencyInput(maxInput.value);
    maxRangeInput.value = amount != null ? budgetAmountToSliderPos(Number(amount)) : BUDGET_SLIDER_MAX_POS;
    updateVisual();
  });

  updateVisual();
}

// ---------- 맞춤공고 키워드 태그(칩) 입력(2026-08-07, 전면 재작성) ----------
// renderKeywordTagInput — 라이브러리 없는 순수 JS 태그 입력.
//
// 태그 생성 규칙은 정확히 이 두 지점, 이 두 지점에서만 일어난다:
//   (1) input 이벤트에서 값이 쉼표(,)로 끝나는 걸 감지했을 때
//   (2) keydown 이벤트에서 Enter가 눌렸고, 그 시점에 한글 등 조합형
//       입력이 진행 중이 아닐 때(isComposing === false)
// 그 외의 어떤 코드 경로도 태그를 만들지 않는다 — 이전 버전이
// compositionend/blur에서도 태그를 만들다가, 조합 확정용 Enter가
// keydown을 브라우저에 따라 한 번 또는 두 번 발생시키는 것과 겹쳐
// "고구마" 입력 시 "고구마"+"마" 두 태그가 생기는 버그로 실제 나타났다
// (2026-08-07 실사용 재보고). 이번엔 그 원인 자체(여러 지점에서 각자
// 판단해 태그를 만드는 구조)를 없앤다 — 조합 상태(isComposing)는
// "언제 태그를 만들지"의 판단 조건일 뿐, 별도의 생성 경로가 아니다.
//
// 4개 이벤트 핸들러의 역할은 이것만 한다:
//   compositionstart → isComposing = true (그 외 아무 동작 없음)
//   compositionend   → isComposing = false (그 외 아무 동작 없음, 태그 생성 없음)
//   input            → 값이 ','로 끝나면 그 앞부분을 커밋하고 입력창을 비움(그 외엔 아무 동작 없음)
//   keydown(Enter)   → isComposing이면 아무 동작 없음, 아니면 전체 값을 커밋하고 입력창을 비움
//
// tone('include'|'exclude')은 CSS 색상 구분에만 쓰인다.
function renderKeywordTagInput(container, initialValues, tone) {
  container._tags = (initialValues || []).slice();
  container.classList.add(`tag-input--${tone}`);
  // 입력창(.tag-input-field) 자체는 처음 한 번만 만들고 다시 안 지운다 —
  // 태그를 추가할 때마다 container.innerHTML을 통째로 갈아치우면, 그
  // 순간 포커스를 갖고 있던 input 자신이 DOM에서 제거되며 브라우저가
  // 즉시 blur를 발생시키고, 그 핸들러가 재진입 호출돼 예외가 나는
  // 문제가 실제로 있었다(이전 버전에서 재현). pills 영역만 따로 둬서
  // input은 항상 살아있게 한다.
  container.innerHTML = `<div class="tag-pills"></div><input type="text" class="tag-input-field" placeholder="입력 후 Enter 또는 쉼표">`;
  const pillsEl = container.querySelector('.tag-pills');
  const field = container.querySelector('.tag-input-field');
  let isComposing = false;

  function renderPills() {
    pillsEl.innerHTML = container._tags.map((tag, i) => `
      <span class="tag-pill">${escapeHtml(tag)}<button type="button" class="tag-pill-remove" data-index="${i}" aria-label="'${escapeAttr(tag)}' 삭제">×</button></span>
    `).join('');
    pillsEl.querySelectorAll('.tag-pill-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        container._tags.splice(Number(btn.dataset.index), 1);
        renderPills();
      });
    });
  }

  // commitTag — 유일한 태그 생성 지점. input(쉼표 감지)과 keydown(Enter,
  // 비조합)만 이 함수를 호출한다.
  function commitTag(rawValue) {
    const val = rawValue.trim();
    if (val && !container._tags.includes(val)) container._tags.push(val);
    field.value = '';
    renderPills();
  }

  field.addEventListener('compositionstart', () => {
    isComposing = true;
  });
  field.addEventListener('compositionend', () => {
    isComposing = false;
  });
  field.addEventListener('input', () => {
    if (field.value.endsWith(',')) {
      commitTag(field.value.slice(0, -1));
    }
  });
  field.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (isComposing) return; // 조합 확정용 Enter — 아무 동작도 하지 않는다
      e.preventDefault(); // 태그 생성으로 처리하는 Enter라 폼 제출은 막는다
      commitTag(field.value);
    } else if (e.key === 'Backspace' && field.value === '' && container._tags.length) {
      // 태그 생성과 무관한 삭제 동작(기존 UX 유지) — commitTag를 호출하지 않는다.
      container._tags.pop();
      renderPills();
    }
  });
  renderPills();
}

// getTagInputValues — 제출 시점에 태그 배열을 그대로 읽기만 한다.
// ⚠️입력창에 남아있는(Enter/쉼표로 아직 확정 안 된) 텍스트는 포함하지
// 않는다 — 태그 생성 지점을 input(쉼표)/keydown(Enter) 두 곳으로
// 한정하는 규칙을 여기서 다시 깨지 않기 위함(사용자 확정, 2026-08-07).
// 확정 안 된 텍스트가 있으면 저장 시 조용히 버려진다.
function getTagInputValues(container) {
  return (container._tags || []).slice();
}

// isDefaultSavedSearchCard — "내 기본 조건"(온보딩 자동생성) 여부. 이
// 카드만 지역/업종/기업규모의 원본이 saved_searches가 아니라
// company_profiles다(2026-08-07, 기업정보 탭과의 필드 중복 정리) —
// 사용자가 직접 만든 다른 조건들은 그냥 독립적인 검색 필터일 뿐이라
// 회사 프로필과 엮지 않는다(예: 우리 회사는 서울인데 "부산 공고도
// 모니터링하고 싶다"는 조건이 있을 수 있음).
function isDefaultSavedSearchCard(item) {
  return !!(item && item.origin === 'onboarding');
}

// regionIndustryCompanySizeFieldsHtml — 지역/업종/기업규모 입력 UI.

      <label>개업일 <span style="font-weight:400;color:var(--ink-soft);font-size:0.85em">(업력을 자동으로 계산해요)</span>
        <input type="date" name="defaultCardFoundingDate" max="${new Date().toISOString().slice(0, 10)}" value="${escapeAttr(p.foundingDate || '')}">
      </label>
      ${p.businessAgeYears != null ? `<p class="license-card-meta">현재 업력: 약 ${p.businessAgeYears}년</p>` : ''}

  const currentRegion = item ? (item.region || '') : '';
