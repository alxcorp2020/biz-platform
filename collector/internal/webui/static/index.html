// setupPhoneOtpVerification — otpPhoneFieldHtml이 그려낸 블록에 발송/
// 검증 동작을 연결한다. onChange(verified)로 인증 상태 변화를 호출부에
// 알려 제출 버튼 활성화 로직이 반응할 수 있게 한다. 전화번호를 고치면
// 인증 상태를 초기화한다(서버도 정확히 그 번호로만 인증 여부를 확인하므로
// 자연히 다시 인증해야 하지만, 프론트에서도 미리 알려주는 게 자연스럽다).
function setupPhoneOtpVerification(form, onChange) {
  const phoneInput = form.phoneNumber;
  const sendBtn = form.querySelector('#otp-send-btn');
  const codeRow = form.querySelector('#otp-code-row');
  const codeInput = form.querySelector('#otp-code-input');
  const verifyBtn = form.querySelector('#otp-verify-btn');
  const statusEl = form.querySelector('#otp-status');
  let verified = false;
  let cooldownTimer = null;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || 'license-card-meta';
  }
  function setVerified(v) {
    verified = v;
    if (onChange) onChange(v);
  }
  function startCooldown() {
    let remaining = 60;
    sendBtn.disabled = true;
    sendBtn.textContent = `재발송 (${remaining}초)`;
    clearInterval(cooldownTimer);
    cooldownTimer = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(cooldownTimer);
        sendBtn.disabled = false;
        sendBtn.textContent = '인증번호 재발송';
      } else {
        sendBtn.textContent = `재발송 (${remaining}초)`;
      }
    }, 1000);
  }

  sendBtn.addEventListener('click', async () => {
    if (!phoneInput.checkValidity()) {
      phoneInput.reportValidity();
      return;
    }
    setVerified(false);
    sendBtn.disabled = true;
    setStatus('전송 중...');
    try {
      await apiRequest('POST', '/api/auth/phone/send-code', { phoneNumber: phoneInput.value });
      codeRow.style.display = 'flex';
      codeInput.value = '';
      codeInput.focus();
      setStatus('인증번호를 보냈습니다. 5분 이내에 입력해주세요.');
      startCooldown();
    } catch (err) {
      sendBtn.disabled = false;
      setStatus(err.message, 'error');
    }
  });

  verifyBtn.addEventListener('click', async () => {
    const code = codeInput.value.trim();
    if (!code) return;
    verifyBtn.disabled = true;
    try {
      await apiRequest('POST', '/api/auth/phone/verify-code', { phoneNumber: phoneInput.value, code });
      setVerified(true);
      setStatus('✓ 인증 완료', 'success');
      clearInterval(cooldownTimer);
      sendBtn.disabled = true;
      sendBtn.textContent = '인증 완료';
    } catch (err) {
      verifyBtn.disabled = false;
      setStatus(err.message, 'error');
    }
  });

  phoneInput.addEventListener('input', () => {
    if (verified) {
      setVerified(false);
      setStatus('');
      codeRow.style.display = 'none';
      sendBtn.disabled = false;
      sendBtn.textContent = '인증번호 받기';
    }
  });

  return { isVerified: () => verified };
}

// renderSignup — 회원가입 화면(이메일 가입 전용). 2026-08-03 온보딩
// 재설계 이후로는 이 한 화면이 이메일 가입의 전부다(예전엔 계정정보→
// 업체정보 2단계였으나, 업체정보 입력을 가입에서 완전히 분리하면서
// 단일 화면으로 합쳤다) — 휴대폰번호 인증까지 마치고 "회원가입"을
// 누르면 그 즉시 POST /api/auth/signup 한 번으로 계정 생성+휴대폰
// 인증기록+약관동의가 전부 처리된다. 소셜 로그인 가입자는 이 화면을
// 거치지 않는다(renderOAuthProfileStep 참고 — 소셜 로그인 콜백이
// 계정을 이미 만들어버려서 별도의 로그인 후 온보딩 화면이 필요하다).
// 2026-08-04: 관리자가 휴대폰 인증을 껐을 수 있어(system_settings.
// phone_verification_required) GET /api/auth/config를 먼저 읽고서야
// 폼을 그린다 — async로 바뀐 이유. 이메일 가입은 이제부터 필수 이메일
// 인증도 거친다(계정은 즉시 생성되지만, 인증 전엔 route()가
// #/auth/verify-email-pending으로 돌려보낸다 — email_verification.go 참고).
async function renderSignup(container) {
  document.body.classList.add('is-auth');
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));
  let phoneVerificationRequired = true;
  try {
    const cfg = await apiRequest('GET', '/api/auth/config');
    phoneVerificationRequired = cfg.phoneVerificationRequired;
  } catch (err) {
    // 조회 실패 시 기존 동작(휴대폰 인증 필수)으로 안전하게 폴백.
  }

  container.innerHTML = '';
  container.appendChild(h(`
    <div class="auth-card">
      <a href="#/" class="auth-page-logo brand-name-text">${escapeHtml(currentBrandName)}</a>
      <h2>회원가입</h2>
      <form id="signup-form" class="auth-form">
        <label><span>이메일<span class="required-mark">*</span></span><input type="email" name="email" required></label>
        ${phoneVerificationRequired ? otpPhoneFieldHtml('') : plainPhoneFieldHtml('')}
        <label><span>비밀번호 (최소 8자)<span class="required-mark">*</span></span><input type="password" name="password" minlength="8" required></label>
        <label><span>비밀번호 확인<span class="required-mark">*</span></span><input type="password" name="passwordConfirm" minlength="8" required></label>
        <div class="field-group">
          <label class="checkbox-label"><input type="checkbox" id="signup-terms-agree" required> 이용약관에 동의합니다 (필수) <a href="#/terms" target="_blank" rel="noopener">보기</a></label>
          <label class="checkbox-label"><input type="checkbox" id="signup-privacy-agree" required> 개인정보 수집 및 이용에 동의합니다 (필수) <a href="#/privacy" target="_blank" rel="noopener">보기</a></label>
        </div>
        <div id="signup-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-block" id="signup-submit-btn" disabled>회원가입</button>
      </form>
      ${oauthButtonsHtml()}
      <p class="auth-switch">이미 계정이 있으신가요? <a href="#/auth/login">로그인</a></p>
    </div>
  `));
  const form = document.getElementById('signup-form');
  attachPhoneAutoFormat(form.phoneNumber);
  const errorBox = document.getElementById('signup-error');
  const submitBtn = document.getElementById('signup-submit-btn');
  const termsCheckbox = document.getElementById('signup-terms-agree');
  const privacyCheckbox = document.getElementById('signup-privacy-agree');

  let phoneVerified = !phoneVerificationRequired;
  function updateSubmitEnabled() {
    submitBtn.disabled = !(form.checkValidity() && phoneVerified);
  }
  if (phoneVerificationRequired) {
    setupPhoneOtpVerification(form, (verified) => { phoneVerified = verified; updateSubmitEnabled(); });
  }
  form.addEventListener('input', updateSubmitEnabled);
  form.addEventListener('change', updateSubmitEnabled);
  updateSubmitEnabled();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    if (fd.get('password') !== fd.get('passwordConfirm')) {
      errorBox.textContent = '비밀번호가 일치하지 않습니다.';
      errorBox.style.display = 'block';
      return;
    }
    try {
      const data = await apiRequest('POST', '/api/auth/signup', {
        email: fd.get('email'),
        password: fd.get('password'),
        phoneNumber: fd.get('phoneNumber'),
        termsAgreed: termsCheckbox.checked,
        privacyAgreed: privacyCheckbox.checked,
      });
      currentUser = {
        id: data.id, email: data.email, role: 'user', plan: 'free',
        phoneVerified: phoneVerificationRequired, emailVerified: false, onboarded: true,
      };
      currentProfile = null;
      renderHeader();
      if (pendingInviteToken) {
        await acceptPendingInviteIfAny();
      }
      location.hash = '#/';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// renderOAuthProfileStep — 소셜 로그인(구글/네이버/카카오)으로 새로
// 가입했거나, 예전에 이메일/비번으로 가입만 하고 휴대폰 인증을 안 끝낸
// 계정을 위한 진입점. 서버(oauth_login.go)가 이미 세션 쿠키를 발급한
// 뒤 #/auth/oauth-profile로 리다이렉트하므로, 여기서는 loadMe()로
// currentUser만 채우고 나면 renderOAuthOnboardingStep을 그려 휴대폰
// 인증을 받는다.
async function renderOAuthProfileStep(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));
  await loadMe();
  if (!currentUser) { location.hash = '#/auth/login'; return; }
  await renderOAuthOnboardingStep(container);
}

function renderLogin(container) {
  document.body.classList.add('is-auth');
  container.innerHTML = '';
  // 소셜 로그인 콜백 실패 시 서버가 #/auth/login?oauthError=1로 돌려보낸다
  // (oauth_login.go의 oauthFailureRedirect) — state 위조 시도든 provider
  // 쪽 일시적 오류든 원인을 구분해 보여줄 방법이 없어(사용자에게 원인
  // 상세를 노출할 필요도 없고) 안내 문구 하나로 통일.
  const oauthFailed = location.hash.split('?')[1] === 'oauthError=1';
  container.appendChild(h(`
    <div class="auth-card">
      <a href="#/" class="auth-page-logo brand-name-text">${escapeHtml(currentBrandName)}</a>
      <h2>로그인</h2>
      ${oauthFailed ? '<div class="oauth-error-banner">간편 로그인에 실패했습니다. 다시 시도해주세요.</div>' : ''}
      <form id="login-form" class="auth-form">
        <label>이메일<input type="email" name="email" required></label>
        <label>비밀번호<input type="password" name="password" required></label>
        <div id="login-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
      </form>
      ${oauthButtonsHtml()}
      <p class="auth-switch"><a href="#/auth/find-account">아이디/비밀번호 찾기</a></p>
      <p class="auth-switch">계정이 없으신가요? <a href="#/auth/signup">회원가입</a></p>
    </div>
  `));
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('login-error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    try {
      const data = await apiRequest('POST', '/api/auth/login', {
        email: fd.get('email'), password: fd.get('password'),
      });
      currentUser = { id: data.id, email: data.email };
      renderHeader();
      await loadMe();
      await acceptPendingInviteIfAny();
      location.hash = '#/';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// renderFindAccount — #/auth/find-account. "아이디/비밀번호 찾기" 단일
// 화면에 이메일(아이디) 찾기/비밀번호 찾기 두 탭을 함께 둔다(요청사항
// [2][3], 2026-08-04). 이메일 찾기는 계정 존재 여부 자체가 결과에
// 드러나는 게 기능 스펙이라(find_email.go) 성공/실패를 그대로 보여주고,
// 비밀번호 찾기는 서버가 항상 동일한 200 응답을 주므로(anti-enumeration,
// password_reset.go) 여기서도 성공 문구 하나로 통일해서 보여준다.
function renderFindAccount(container) {
  document.body.classList.add('is-auth');
  container.innerHTML = '';

    <div class="auth-card">
      <a href="#/" class="auth-page-logo brand-name-text">${escapeHtml(currentBrandName)}</a>
      <h2>아이디/비밀번호 찾기</h2>

          <button type="submit" class="btn btn-primary btn-block">이메일 찾기</button>

      <div id="reset-password-panel" style="display:none">
        <p class="auth-step-hint">가입 시 등록한 이메일을 입력하면 비밀번호 재설정 링크를 보내드립니다.</p>
        <form id="reset-password-request-form" class="auth-form">
          <label>이메일<input type="email" name="email" required></label>

  const findEmailErrorBox = document.getElementById('find-email-error');

      findEmailResultBox.style.display = 'block';

      findEmailErrorBox.textContent = err.message;
      findEmailErrorBox.style.display = 'block';
    }

  const resetErrorBox = document.getElementById('reset-password-request-error');
  const resetResultBox = document.getElementById('reset-password-request-result');
  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    resetErrorBox.style.display = 'none';

// renderResetPassword — #/auth/reset-password?token=... 비밀번호 찾기
// 이메일의 링크로 도달하는 화면(로그인 여부와 무관하게 접근 가능해야
// 해서 PUBLIC_ROUTES에 등록돼있다). successBox를 form 밖에 둬서, 성공 시
// form 자체를 숨겨도 완료 메시지는 계속 보이게 한다.
function renderResetPassword(container) {
  document.body.classList.add('is-auth');
  container.innerHTML = '';
  const query = new URLSearchParams(location.hash.split('?')[1] || '');
  const token = query.get('token') || '';
  container.appendChild(h(`
    <div class="auth-card">
      <a href="#/" class="auth-page-logo brand-name-text">${escapeHtml(currentBrandName)}</a>
      <h2>새 비밀번호 설정</h2>
      ${token ? '' : '<div class="oauth-error-banner">유효하지 않은 링크입니다. 비밀번호 찾기를 다시 요청해주세요.</div>'}
      <form id="reset-password-form" class="auth-form">
        <label>새 비밀번호 (최소 8자)<input type="password" name="password" minlength="8" required></label>
        <label>비밀번호 확인<input type="password" name="passwordConfirm" minlength="8" required></label>
        <div id="reset-password-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-block" ${token ? '' : 'disabled'}>비밀번호 변경</button>
      </form>
      <p id="reset-password-success" class="success" style="display:none"></p>
      <p class="auth-switch"><a href="#/auth/login">로그인으로 돌아가기</a></p>
    </div>
  `));
  const form = document.getElementById('reset-password-form');
  const errorBox = document.getElementById('reset-password-error');
  const successBox = document.getElementById('reset-password-success');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!token) return;
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    if (fd.get('password') !== fd.get('passwordConfirm')) {
      errorBox.textContent = '비밀번호가 일치하지 않습니다.';
      errorBox.style.display = 'block';
      return;
    }
    try {
      await apiRequest('POST', '/api/auth/reset-password', { token, password: fd.get('password') });
      form.style.display = 'none';
      successBox.textContent = '비밀번호가 변경되었습니다. 새 비밀번호로 로그인해주세요.';
      successBox.style.display = 'block';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// renderVerifyEmail — #/auth/verify-email?token=... 인증 메일의 링크로
// 도달하는 화면(공개 라우트 — 가입할 때와 다른 브라우저/기기에서 열 수도
// 있어 로그인 여부와 무관하게 접근 가능해야 한다). 현재 세션이 마침 그
// 계정으로 로그인돼있다면(가장 흔한 경우) currentUser.emailVerified를
// 바로 갱신해 route()의 이메일 인증 게이트를 통과하게 해준다.
async function renderVerifyEmail(container) {
  document.body.classList.add('is-auth');
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">확인 중...</div>'));
  const query = new URLSearchParams(location.hash.split('?')[1] || '');
  const token = query.get('token') || '';

  let resultHtml;
  if (!token) {
    resultHtml = '<div class="oauth-error-banner">유효하지 않은 링크입니다.</div>';
  } else {
    try {
      await apiRequest('POST', '/api/auth/verify-email', { token });
      if (currentUser) currentUser.emailVerified = true;
      resultHtml = '<p class="success">이메일 인증이 완료되었습니다.</p>';
    } catch (err) {
      resultHtml = `<p class="error">${escapeHtml(err.message)}</p>`;
    }
  }

  container.innerHTML = '';
  container.appendChild(h(`
    <div class="auth-card">
      <a href="#/" class="auth-page-logo brand-name-text">${escapeHtml(currentBrandName)}</a>
      <h2>이메일 인증</h2>
      ${resultHtml}
      <p class="auth-switch"><a href="#/${currentUser ? '' : 'auth/login'}">${currentUser ? '홈으로 이동' : '로그인하러 가기'}</a></p>
    </div>
  `));
}

function fillProfileForm(form, profile) {
  if (!profile) return;
  form.businessType.value = (profile.businessType || []).join(', ');
  form.region.value = profile.region || '';
  const selectedIndustry = new Set(profile.industry || []);
  form.querySelectorAll('input[name="industry"]').forEach(cb => {
    cb.checked = selectedIndustry.has(cb.value);
  });
  form.businessAgeYears.value = profile.businessAgeYears ?? '';
  form.revenueAmount.value = formatCurrency(profile.revenueAmount);
  form.employeeCount.value = profile.employeeCount ?? '';
  form.companySize.value = profile.companySize || '';
  form.businessPhone.value = profile.phoneNumber || '';
  form.licenses.value = (profile.licenses || []).join(', ');
  form.certifications.value = (profile.certifications || []).join(', ');
  form.directProductionCert.checked = !!profile.directProductionCert;
  form.maxPerformanceAmount.value = formatCurrency(profile.maxPerformanceAmount);
  form.creditRating.value = profile.creditRating || '';
}

// NOTIFICATION_ICONS — event_type 접두어별 원형 아이콘. deadline_d7/d3/d1은
// 전부 "deadline_"로 시작해서 접두어 매칭 하나로 묶는다.
const NOTIFICATION_ICON_MAP = [
  ['deadline_', LIST_ROW_ICONS.pipeline],
  ['assignee_status_change', LIST_ROW_ICONS.notice_change],
  ['recommendation_digest', LIST_ROW_ICONS.license_expiring],
  ['weekly_report', SIDEBAR_ICONS.chart],
  ['monthly_report', SIDEBAR_ICONS.chart],
  ['team_invite_accepted', SIDEBAR_ICONS.user],
];
function notificationIconHtml(eventType) {
  const found = NOTIFICATION_ICON_MAP.find(([prefix]) => eventType.startsWith(prefix));
  return found ? found[1] : LIST_ROW_ICONS.pipeline;
}

let notificationListState = null; // { batches, offset, limit, total, hasMore, loading, unreadOnly }

// ---------- 웹 푸시(Phase 6) ----------
// urlBase64ToUint8Array — PushManager.subscribe()의 applicationServerKey는
// Uint8Array를 요구하는데 서버는 base64url 문자열로 공개키를 내려주므로
// (webpush-go 관례) 표준 변환 보일러플레이트가 필요하다.
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

// isIOSInstallNeeded — iOS Safari는 16.4+에서도 "홈 화면에 추가"로 설치된
// PWA 안에서만 웹 푸시가 동작한다(요구사항 확정 사항). standalone 모드가
// 아니면 구독 시도 자체가 의미 없으므로 안내만 보여준다.
function isIOSInstallNeeded() {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  return isIOS && !isStandalone;
}

async function renderPushBanner(container) {
  if (!container) return;
  if (isIOSInstallNeeded()) {
    container.innerHTML = `
      <div class="pipeline-filter-banner">
        <span>iOS에서 알림을 받으려면 먼저 홈 화면에 추가하세요 — 공유 아이콘 → "홈 화면에 추가"</span>
      </div>
    `;
    return;
  }
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;

  let registration, subscription;
  try {
    registration = await navigator.serviceWorker.ready;
    subscription = await registration.pushManager.getSubscription();
  } catch (e) {
    return;
  }

  const subscribed = !!subscription;
  container.innerHTML = `
    <div class="pipeline-filter-banner">
      <span>${subscribed ? '이 기기에서 알림이 켜져 있습니다.' : '이 기기에서도 알림을 받아보세요.'}</span>
      <button type="button" class="btn btn-secondary btn-sm" id="push-toggle-btn">${subscribed ? '끄기' : '알림 받기'}</button>
    </div>
  `;
  document.getElementById('push-toggle-btn').addEventListener('click', async () => {
    if (subscribed) {
      await unsubscribeFromPush(registration);
    } else {
      await subscribeToPush(registration);
    }
    renderPushBanner(container);
  });
}

async function subscribeToPush(registration) {
  try {
    if (Notification.permission === 'denied') {
      alert('브라우저 알림 권한이 차단되어 있습니다. 브라우저 설정에서 알림 권한을 허용해주세요.');
      return;
    }
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;
    const { publicKey } = await apiRequest('GET', '/api/push/vapid-public-key');
    const sub = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey),
    });
    const json = sub.toJSON();
    await apiRequest('POST', '/api/me/push-subscriptions', { endpoint: json.endpoint, keys: json.keys });
  } catch (err) {
    console.error('push subscribe failed', err);
  }
}

async function unsubscribeFromPush(registration) {
  try {
    const sub = await registration.pushManager.getSubscription();
    if (!sub) return;
    const endpoint = sub.endpoint;
    await sub.unsubscribe();
    await apiRequest('DELETE', '/api/me/push-subscriptions', { endpoint });
  } catch (err) {
    console.error('push unsubscribe failed', err);
  }
}

async function loadMoreNotifications(listBody) {
  const state = notificationListState;
  if (!state || state.loading || !state.hasMore) return;
  state.loading = true;
  renderNotificationControl(listBody);

  const params = new URLSearchParams();
  params.set('offset', String(state.offset));
  params.set('limit', String(state.limit));
  if (state.unreadOnly) params.set('unreadOnly', 'true');

  try {
    const data = await fetchJSON('/api/me/notifications?' + params.toString());
    if (notificationListState !== state) return; // 그 사이 필터가 바뀜 — 결과 버림
    const items = data.items || [];
    if (items.length) state.batches.push(items);
    state.offset += items.length;
    state.total = data.total || 0;
    state.hasMore = !!data.hasMore;
    state.loading = false;
    renderNotificationItems(listBody, state.batches);
  } catch (err) {
    state.loading = false;
    if (!state.batches.length) {
      listBody.className = 'error';
      listBody.innerHTML = '';
      listBody.textContent = err.message;
    } else {
      renderNotificationControl(listBody);
    }
  }
}

function notificationRowHtml(n) {
  const target = n.pipelineEntryId ? '#/pipeline/' + n.pipelineEntryId
    : n.noticeId ? '#/notices/' + n.noticeId : '#/notices';
  return `
    <div class="row-card notification-row${n.read ? '' : ' notification-row--unread'}" data-id="${escapeAttr(n.id)}" data-target="${escapeAttr(target)}">
      <span class="row-card-icon">${notificationIconHtml(n.eventType)}</span>
      <div class="row-card-main">
        <div class="row-card-title">${n.read ? '' : '<span class="notification-unread-dot"></span>'}${escapeHtml(n.title)}</div>
        <div class="row-card-subtitle">${escapeHtml(n.body)} · ${escapeHtml(formatDateTime(n.createdAt))}</div>
      </div>
      <span class="row-card-arrow">›</span>
    </div>
  `;
}

function renderNotificationItems(listBody, batches) {
  const totalCount = batches.reduce((sum, b) => sum + b.length, 0);
  if (!totalCount) {
    listBody.className = 'empty';
    listBody.innerHTML = '';
    listBody.textContent = '받은 알림이 없습니다.';
    return;
  }
  const batchesHtml = batches.map(batch => `
    <div class="notice-batch-header"><span class="notice-batch-count">${batch.length}건</span><span class="notice-batch-rule"></span></div>
    <div class="notice-list">${batch.map(notificationRowHtml).join('')}</div>
  `).join('');
  listBody.className = '';
  listBody.innerHTML = '';
  listBody.appendChild(h(`${batchesHtml}<div id="notif-list-more-control"></div>`));
  renderNotificationControl(listBody);
  listBody.querySelectorAll('.notification-row').forEach(row => {
    row.addEventListener('click', async () => {
      const id = row.dataset.id;
      if (row.classList.contains('notification-row--unread')) {
        row.classList.remove('notification-row--unread');
        const dot = row.querySelector('.notification-unread-dot');
        if (dot) dot.remove();
        try { await apiRequest('POST', '/api/me/notifications/' + encodeURIComponent(id) + '/read'); } catch (err) { /* 무시 */ }
        refreshUnreadNotificationCount();
      }
      location.hash = row.dataset.target;
    });
  });
}

function renderNotificationControl(listBody) {
  const control = listBody.querySelector('#notif-list-more-control');
  if (!control || !notificationListState) return;
  const state = notificationListState;
  if (state.loading) {
    control.innerHTML = `<p class="notice-list-sentinel">불러오는 중...</p>`;
    return;
  }
  if (!state.hasMore) {
    control.innerHTML = state.batches.length ? `<p class="notice-list-sentinel">모든 알림을 불러왔습니다.</p>` : '';
    return;
  }
  control.innerHTML = `<button type="button" class="btn btn-secondary btn-block" id="notif-list-more-btn">더보기</button>`;
  control.querySelector('#notif-list-more-btn').addEventListener('click', () => loadMoreNotifications(listBody));
}

// NOTIFICATION_DAYS_BEFORE_OPTIONS — 실제로 배치가 도는 오프셋만
// (notifications.go의 notificationDaysBeforeAllowed와 정확히 같은 값).
const NOTIFICATION_DAYS_BEFORE_OPTIONS = [7, 3, 1];

// 알림 설정 재설계: 마감 리마인더/담당자 상태변경 알림의 수신 여부는
// 이제 조직 공용(휴대폰 번호+SMS 토글)이 아니라 "담당자 관리" 탭의
// 담당자 개인별 설정이다 — 여기 남는 건 (1) 추천 공고 다이제스트
// 이메일 on/off, (2) 제출마감 리마인더를 D-N 중 어느 시점에 보낼지
// 뿐이다. owner만 바꿀 수 있어 member면 읽기 전용으로 보여준다(서버도
// owner_only로 막지만, 프론트에서 미리 disabled 처리해 "저장 눌렀다가
// 403 보는" 경험을 없앤다).
function renderProfileBasicTab(container) {
  const p = currentProfile || {};
  const isOwner = p.role === 'owner';
  const disabledAttr = isOwner ? '' : 'disabled';
  const orgNote = isOwner ? '' : '<p class="license-card-meta">알림 설정은 팀 관리자만 변경할 수 있습니다.</p>';
  const daysBefore = p.notificationDaysBefore || [];

  container.innerHTML = '';
  container.appendChild(h(`
    <div class="detail-card">
      <label class="checkbox-label">
        <input type="checkbox" id="email-notifications-toggle" ${p.emailNotificationsEnabled ? 'checked' : ''} ${disabledAttr}>
        추천 공고 다이제스트 이메일 받기
      </label>
      <span id="email-notifications-status" class="license-card-meta"></span>
    </div>
    <div class="detail-card">
      <p class="license-card-meta" style="margin-bottom:0.5rem">제출마감 리마인더를 언제 받을지 선택하세요. 실제 수신자는 "담당자 관리" 탭에서 담당자별로 설정합니다.</p>
      ${NOTIFICATION_DAYS_BEFORE_OPTIONS.map(d => `
        <label class="checkbox-label">
          <input type="checkbox" name="notification-days-before" value="${d}" ${daysBefore.includes(d) ? 'checked' : ''} ${disabledAttr}>
          마감 D-${d}
        </label>
      `).join('')}
      <span id="notification-days-before-status" class="license-card-meta"></span>
      ${orgNote}
    </div>
    <div id="profile-summary-section"></div>
  `));

  const notificationsToggle = document.getElementById('email-notifications-toggle');
  const notificationsStatus = document.getElementById('email-notifications-status');
  if (isOwner) {
    notificationsToggle.addEventListener('change', async () => {
      const enabled = notificationsToggle.checked;
      notificationsToggle.disabled = true;
      try {
        await apiRequest('PATCH', '/api/me/notification-settings', { emailNotificationsEnabled: enabled });
        currentProfile.emailNotificationsEnabled = enabled;
        notificationsStatus.textContent = '저장되었습니다.';
      } catch (err) {
        notificationsToggle.checked = !enabled;
        notificationsStatus.textContent = err.message;
      } finally {
        notificationsToggle.disabled = false;
      }
    });

    const daysStatus = document.getElementById('notification-days-before-status');
    container.querySelectorAll('input[name="notification-days-before"]').forEach(cb => {
      cb.addEventListener('change', async () => {
        const selected = Array.from(container.querySelectorAll('input[name="notification-days-before"]:checked'))
          .map(el => Number(el.value));
        container.querySelectorAll('input[name="notification-days-before"]').forEach(el => { el.disabled = true; });
        try {
          await apiRequest('PATCH', '/api/me/notification-settings', { notificationDaysBefore: selected });
          currentProfile.notificationDaysBefore = selected;
          daysStatus.textContent = '저장되었습니다.';
        } catch (err) {
          cb.checked = !cb.checked;
          daysStatus.textContent = err.message;
        } finally {
          container.querySelectorAll('input[name="notification-days-before"]').forEach(el => { el.disabled = false; });
        }
      });
    });
  }

  renderProfileSummaryCard(document.getElementById('profile-summary-section'));
}

// openProfileEditModal — 12개 필드를 3단계(기본정보/재무·실적/면허·인증)로
// 쪼갠 모달 폼. 필드는 전부 같은 <form> 안에 있고 wizard-step으로 보이는
// 것만 CSS로 바꾸므로(display:none), FormData는 어느 단계에 있든 항상
// 전체 값을 담는다 — 기존 제출 로직을 그대로 재사용할 수 있는 이유.
function openProfileEditModal(summaryContainer) {
  const stepLabels = ['기본 정보', '재무·실적정보', '면허·인증'];
  const bodyHtml = `
    <div id="wizard-step-indicator" class="wizard-step-indicator"></div>
    <form id="profile-form" class="profile-form">
      <div class="wizard-step" data-step="0">
        <label>업태 (쉼표로 구분, 겸업 시 여러 개 등록 가능)<input type="text" name="businessType"></label>
        <label>지역<input type="text" name="region"></label>
        <div class="field-group">
          <span class="field-group-label">업종 (겸업 시 여러 개 선택 가능 — 하나라도 일치하면 적합 판정)</span>
          <div class="checkbox-grid">
            ${INDUSTRY_GROUPS.map(g => `
              <label class="checkbox-label"><input type="checkbox" name="industry" value="${escapeAttr(g)}"> ${escapeHtml(g)}</label>
            `).join('')}
          </div>
        </div>
        <label>업력
          <select name="businessAgeYears" class="select-input">
            <option value="">선택 안 함</option>
            ${BUSINESS_AGE_RANGE_OPTIONS.map(o => `<option value="${escapeAttr(o.value)}">${escapeHtml(o.label)}</option>`).join('')}
          </select>
        </label>
        <label>기업 규모
          <select name="companySize" class="select-input">
            <option value="">선택 안 함</option>
            ${COMPANY_SIZE_OPTIONS.map(sz => `<option value="${escapeAttr(sz)}">${escapeHtml(sz)}</option>`).join('')}
          </select>
        </label>
        <label>연락처(사업자 대표전화번호)<input type="tel" name="businessPhone" placeholder="02-1234-5678"></label>
      </div>
      <div class="wizard-step" data-step="1">
        <label>매출액(원)<input type="text" inputmode="numeric" name="revenueAmount"></label>
        <label>직원 수<input type="number" name="employeeCount"></label>
        <div class="field-verify-row">
          <button type="button" id="employee-count-verify-btn" class="field-verify-btn">4대보험 가입자명부로 확인</button>
          <span id="employee-count-confidence-badge"></span>
        </div>
        <input type="file" id="employee-count-file-input" accept=".pdf,.jpg,.jpeg,.png" style="display:none">
        <div id="employee-count-confirm-slot"></div>
        <label>최근 3년 최대 실적(원)<input type="text" inputmode="numeric" name="maxPerformanceAmount"></label>
        <label>신용등급<input type="text" name="creditRating"></label>
      </div>
      <div class="wizard-step" data-step="2">
        <label>보유 면허 (쉼표로 구분)<input type="text" name="licenses"></label>
        <label>보유 인증 (쉼표로 구분)<input type="text" name="certifications"></label>
        <label class="checkbox-label"><input type="checkbox" name="directProductionCert"> ${glossaryHtml('직접생산확인', '직접생산확인증명 보유')}</label>
        <div id="profile-error" class="error" style="display:none"></div>
        <div id="profile-success" class="success" style="display:none"></div>
      </div>
      <div class="wizard-nav">
        <button type="button" class="btn btn-secondary" id="wizard-prev">이전</button>
        <button type="button" class="btn btn-primary" id="wizard-next">다음</button>
        <button type="submit" class="btn btn-primary" id="wizard-submit" style="display:none">저장</button>
      </div>
    </form>
  `;
  openModal('기업 프로필 수정', bodyHtml);

  const form = document.getElementById('profile-form');
  fillProfileForm(form, currentProfile);
  renderEmployeeCountBadge();
  attachPhoneAutoFormat(form.businessPhone);
  attachCurrencyAutoFormat(form.revenueAmount);
  attachCurrencyAutoFormat(form.maxPerformanceAmount);

  let wizardStep = 0;
  const steps = Array.from(form.querySelectorAll('.wizard-step'));
  const indicatorEl = document.getElementById('wizard-step-indicator');
  const prevBtn = document.getElementById('wizard-prev');
  const nextBtn = document.getElementById('wizard-next');
  const submitBtn = document.getElementById('wizard-submit');

  function updateWizardStep() {
    steps.forEach((el, i) => { el.style.display = i === wizardStep ? '' : 'none'; });
    indicatorEl.innerHTML = stepIndicatorHtml(wizardStep, steps.length, stepLabels[wizardStep]);
    prevBtn.style.display = wizardStep === 0 ? 'none' : '';
    nextBtn.style.display = wizardStep === steps.length - 1 ? 'none' : '';
    submitBtn.style.display = wizardStep === steps.length - 1 ? '' : 'none';
  }
  prevBtn.addEventListener('click', () => { wizardStep -= 1; updateWizardStep(); });
  nextBtn.addEventListener('click', () => { wizardStep += 1; updateWizardStep(); });
  updateWizardStep();

  const employeeCountFileInput = document.getElementById('employee-count-file-input');
  const employeeCountConfirmSlot = document.getElementById('employee-count-confirm-slot');
  document.getElementById('employee-count-verify-btn').addEventListener('click', () => employeeCountFileInput.click());
  employeeCountFileInput.addEventListener('change', async () => {
    const file = employeeCountFileInput.files[0];
    employeeCountFileInput.value = '';
    if (!file) return;
    employeeCountConfirmSlot.innerHTML = '';
    employeeCountConfirmSlot.appendChild(h('<div class="loading">문서를 분석하는 중...</div>'));
    let uploadData;
    try {
      uploadData = await uploadCompanyRecordDocument('/api/me/company-profile/employee-verification/documents', file);
    } catch (err) {
      employeeCountConfirmSlot.innerHTML = '';
      employeeCountConfirmSlot.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
      return;
    }
    renderEmployeeCountConfirmForm(employeeCountConfirmSlot, uploadData.candidate, uploadData.documentId, form);
  });

  const errorBox = document.getElementById('profile-error');
  const successBox = document.getElementById('profile-success');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    successBox.style.display = 'none';
    const fd = new FormData(form);
    // parseCurrencyInput으로 쉼표를 먼저 걷어낸 뒤 숫자로 변환한다 —
    // employeeCount처럼 쉼표가 안 붙는 필드도 그냥 통과되니(쉼표 없으면
    // 원래 문자열 그대로) toNum 하나로 공용 처리해도 안전하다.
    const toNum = (v) => {
      const cleaned = parseCurrencyInput(v);
      return cleaned === null ? null : Number(cleaned);
    };
    const toList = (v) => (v || '').split(',').map(s => s.trim()).filter(Boolean);
    const payload = {
      businessType: toList(fd.get('businessType')),
      region: fd.get('region') || null,
      industry: fd.getAll('industry'),
      businessAgeYears: toNum(fd.get('businessAgeYears')),
      revenueAmount: toNum(fd.get('revenueAmount')),
      employeeCount: toNum(fd.get('employeeCount')),
      companySize: fd.get('companySize') || null,
      licenses: toList(fd.get('licenses')),
      certifications: toList(fd.get('certifications')),
      directProductionCert: fd.get('directProductionCert') === 'on',
      maxPerformanceAmount: toNum(fd.get('maxPerformanceAmount')),
      creditRating: fd.get('creditRating') || null,
      phoneNumber: fd.get('businessPhone') || null,
    };
    try {
      const data = await apiRequest('PUT', '/api/me/company-profile', payload);
      currentProfile = data.companyProfile;
      closeModal();
      renderProfileSummaryCard(summaryContainer);
      renderGlobalProfileBanner();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// renderEmployeeCountBadge — currentProfile.employeeCountConfidence가 있을
// 때만(4대보험 가입자명부로 확인한 적 있음) confidenceBadgeHtml(면허·인증
// 때 만든 A~D 배지 재사용)을 보여준다.
function renderEmployeeCountBadge() {
  const badge = document.getElementById('employee-count-confidence-badge');
  if (!badge) return;
  badge.innerHTML = currentProfile && currentProfile.employeeCountConfidence
    ? confidenceBadgeHtml(currentProfile.employeeCountConfidence)
    : '';
}

// renderEmployeeCountConfirmForm — 4대보험 가입자명부에서 AI가 읽은 총
// 가입자 수 하나만 확인하는 최소 폼. 확인 즉시 저장되고(별도 "직원 수"
// 저장 버튼을 또 누를 필요 없음) 기본정보 폼의 employeeCount 입력값도
// 함께 갱신한다 — 개인명단은 애초에 응답에 없다(백엔드가 추출 안 함).
function renderEmployeeCountConfirmForm(slot, candidate, documentId, profileForm) {
  const c = candidate || {};
  slot.innerHTML = '';
  slot.appendChild(h(`
    <div class="license-confirm-form">
      <h4>AI가 읽은 총 가입자 수를 확인해주세요</h4>
      <form id="employee-count-confirm-form" class="profile-form">
        <label>총 가입자 수<input type="text" name="totalSubscriberCount" value="${escapeAttr(c.totalSubscriberCount || '')}" required></label>
        <div id="employee-count-confirm-error" class="error" style="display:none"></div>
        <div class="license-toolbar">
          <button type="submit">확인 및 저장</button>
          <button type="button" id="employee-count-confirm-cancel" class="secondary">취소</button>
        </div>
      </form>
    </div>
  `));

  const form = document.getElementById('employee-count-confirm-form');
  const errorBox = document.getElementById('employee-count-confirm-error');
  document.getElementById('employee-count-confirm-cancel').addEventListener('click', () => { slot.innerHTML = ''; });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const fd = new FormData(form);
    const payload = {
      totalSubscriberCount: fd.get('totalSubscriberCount'),
      sourceDocumentId: documentId || null,
    };
    try {
      const data = await apiRequest('POST', '/api/me/company-profile/employee-verification', payload);
      currentProfile.employeeCountConfidence = data.confidence;
      currentProfile.employeeCountVerifiedAt = new Date().toISOString();
      // profileForm은 프로필 편집 화면에서 호출될 때만 있다(그 화면에 이미
      // 열려있는 employeeCount 입력값도 같이 갱신하기 위함) — #/ai-usage
      // 화면의 재시도 흐름처럼 그 폼이 없는 곳에서 호출될 때는 null.
      const employeeCountInput = profileForm && profileForm.querySelector('input[name="employeeCount"]');
      if (employeeCountInput) employeeCountInput.value = data.employeeCount;
      slot.innerHTML = '';
      renderEmployeeCountBadge();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
}

// uploadCompanyRecordDocument는 면허·인증 업로드와 같은 raw fetch(멀티파트라
// apiRequest의 JSON 강제 인코딩을 못 씀) 패턴을 재무/실적/인력 3곳이 공유한다.
async function uploadCompanyRecordDocument(uploadPath, file) {
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch(uploadPath, { method: 'POST', body: fd });
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const code = data && data.error;
    const err = new Error((code && ERROR_MESSAGES[code]) || ('요청 실패 (' + res.status + ')'));
    err.status = res.status;
    throw err;
  }
  return data;
}

// ---------- 재무정보 ----------
const FINANCIAL_DOCUMENT_TYPES = ['재무제표', '신용평가서', '표준재무제표증명', '부가가치세과세표준증명', '기타'];

function financialCardHtml(item) {
  const parts = [];
  if (item.documentType) parts.push(escapeHtml(item.documentType));
  if (item.revenue != null) parts.push('매출액 ' + formatBudget(item.revenue));
  if (item.operatingProfit != null) parts.push('영업이익 ' + formatBudget(item.operatingProfit));
  if (item.creditRating) parts.push('신용등급 ' + escapeHtml(item.creditRating));
  if (item.taxDelinquent === true) parts.push('<span class="status-badge status-badge--warn">세금체납 있음</span>');
  if (item.capitalImpairment === true) parts.push('<span class="status-badge status-badge--warn">자본잠식 있음</span>');
  return `
    <div class="license-card">
      <div class="license-card-main">
        <div class="license-card-name">${escapeHtml(String(item.fiscalYear))}년도 재무정보</div>
        <div class="license-card-meta">${parts.join(' · ')}</div>
      </div>
      <div class="license-card-side">${confidenceBadgeHtml(item.confidence)}</div>
    </div>
  `;
}

async function renderFinancialsTab(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/me/financials');
  } catch (err) {
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  container.innerHTML = '';
  container.appendChild(h(`
    <p class="license-card-meta">연도별 재무정보를 등록합니다.</p>
    ${uploadGuideHtml('재무상태표, 손익계산서, 신용평가서, 표준재무제표증명원, 부가가치세 과세표준증명원 등을 올려주세요.')}
    <div class="license-toolbar">
      <button type="button" id="financial-upload-btn">증빙서류 업로드(재무제표 등)</button>
      <button type="button" id="financial-manual-btn" class="secondary">직접 입력</button>
    </div>
    <input type="file" id="financial-file-input" accept=".pdf,.jpg,.jpeg,.png" style="display:none">
    <div id="financial-form-slot"></div>
    <div class="license-list" id="financial-list"></div>
  `));

  renderLicenseListInto(document.getElementById('financial-list'), data.items, '아직 등록한 재무정보가 없습니다.', financialCardHtml);

  const formSlot = document.getElementById('financial-form-slot');
  const fileInput = document.getElementById('financial-file-input');
  document.getElementById('financial-upload-btn').addEventListener('click', () => fileInput.click());
  document.getElementById('financial-manual-btn').addEventListener('click', () => {
    renderFinancialForm(formSlot, null, null, () => renderFinancialsTab(container));
  });
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    formSlot.innerHTML = '';
    formSlot.appendChild(h('<div class="loading">문서를 분석하는 중...</div>'));
    let uploadData;
    try {
      uploadData = await uploadCompanyRecordDocument('/api/me/financials/documents', file);
    } catch (err) {
      formSlot.innerHTML = '';
      formSlot.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
      return;
    }
    formSlot.innerHTML = '';
    renderFinancialForm(formSlot, uploadData.candidate, uploadData.documentId, () => renderFinancialsTab(container));
  });
  disableOwnerOnlyButtons(container);
}

const TRI_STATE_OPTIONS = [
  { value: '', label: '선택 안 함' },
  { value: '예', label: '예' },
  { value: '아니오', label: '아니오' },
  { value: '확인불가', label: '확인불가' },
];

function triStateSelectHtml(name, selected) {
  return `<select name="${name}" class="select-input">${TRI_STATE_OPTIONS.map(o =>
    `<option value="${escapeAttr(o.value)}" ${o.value === (selected || '') ? 'selected' : ''}>${escapeHtml(o.label)}</option>`
  ).join('')}</select>`;
}

// disableOwnerOnlyButtons — 팀기능: member는 재무/실적/인력/면허/지식재산권
// 탭에서 읽기만 가능(쓰기는 서버가 이미 owner_only로 막지만, "눌렀다가
// 403 보는" 경험을 피하려고 버튼 자체를 비활성화하고 이유를 title로
// 알려준다). 각 탭 렌더 함수 끝에서 한 줄로 호출한다.
function disableOwnerOnlyButtons(container) {
  if (currentProfile && currentProfile.role === 'owner') return;
  container.querySelectorAll(
    'button[id$="-upload-btn"], button[id$="-manual-btn"], button[id$="-add-btn"], ' +
    '.contact-edit-btn, .contact-delete-btn, .contact-set-default-btn'
  ).forEach(btn => {
    btn.disabled = true;
    btn.title = '팀 관리자만 등록/수정할 수 있습니다.';
  });
}

// plainSelectHtml — 값 목록 하나로 <select>를 만드는 공용 헬퍼(증빙서류
// 종류처럼 "선택 안 함" + 고정 값 목록만 있으면 되는 경우). withEmpty가
// true면 맨 앞에 빈 옵션을 추가한다(값 목록 자체엔 넣지 않아도 됨).
function plainSelectHtml(name, options, selected, withEmpty) {
  const opts = withEmpty ? ['', ...options] : options;
  return `<select name="${name}" class="select-input">${opts.map(v =>
    `<option value="${escapeAttr(v)}" ${v === (selected || '') ? 'selected' : ''}>${escapeHtml(v || '선택 안 함')}</option>`
  ).join('')}</select>`;
}

// REVENUE_RANGE_OPTIONS — 2026-08-04. AI가 매출액을 못 찾았거나(문서
// 업로드 실패) 사용자가 정확한 금액을 모를 때 쓰는 구간 select. 값은 각
// 구간의 대표치(대략 상한, 마지막 "100억원 이상"만 그 아래 구간과 안
// 겹치게 임의로 더 큰 값)로, 정밀 수치가 아니라는 걸 전제로 한다 —
// 실제 저장 시 confidence='D'로 낮춰서 이 값이 추정치임을 표시한다.
const REVENUE_RANGE_OPTIONS = [
  { value: '30000000', label: '3천만원 이하' },
  { value: '100000000', label: '3천만원~1억원' },
  { value: '500000000', label: '1억원~5억원' },
  { value: '1000000000', label: '5억원~10억원' },
  { value: '5000000000', label: '10억원~50억원' },
  { value: '10000000000', label: '50억원~100억원' },
  { value: '15000000000', label: '100억원 이상' },
];

// revenueFieldHtml — AI가 매출액을 실제로 찾았으면(candidate.revenue 값
// 있음) 기존처럼 정밀 숫자를 확인/수정하는 입력을 그대로 보여주고, 못
// 찾았거나(직접 입력 진입 포함) 값이 비어있으면 구간 select로 대체한다.
function revenueFieldHtml(c) {
  const hasValue = c.revenue !== undefined && c.revenue !== null && c.revenue !== '';
  if (hasValue) {
    return `<label>매출액(원)<input type="text" inputmode="numeric" name="revenue" value="${escapeAttr(formatCurrency(c.revenue))}"></label>`;
  }
  return `
    <label>매출액(정확한 금액을 모르면 구간으로 선택해주세요)
      <select name="revenueRange" class="select-input">
        <option value="">선택 안 함</option>
        ${REVENUE_RANGE_OPTIONS.map(o => `<option value="${escapeAttr(o.value)}">${escapeHtml(o.label)}</option>`).join('')}
      </select>
    </label>
  `;
}

// 참여 검토(파이프라인 생성) 시 assignee_name/email/phone을 자동으로
// 채우는 데 쓰이는 기본 담당자를 여기서 지정한다. member는 읽기 전용으로
// 본다(disableOwnerOnlyButtons가 추가/수정/삭제/기본지정 버튼을 막는다).
async function renderContactsTab(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/me/contacts');
  } catch (err) {
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }
  const items = data.items || [];

  container.innerHTML = '';
  container.appendChild(h(`
    <p class="license-card-meta">여기 등록해두면 "참여 검토" 시 담당자 정보가 자동으로 채워집니다. 기본 담당자 1명을 지정할 수 있습니다.</p>
    <div class="license-toolbar">
      <button type="button" id="contact-add-btn" class="btn btn-secondary btn-sm">담당자 추가</button>
    </div>
    <div id="contact-form-slot"></div>
    <div class="license-list" id="contact-list"></div>
  `));

  const listEl = document.getElementById('contact-list');
  if (!items.length) {
    listEl.appendChild(h('<p class="empty">아직 등록한 담당자가 없습니다. 등록해두면 참여 검토 시 자동으로 채워집니다.</p>'));
  } else {
    items.forEach(item => listEl.appendChild(h(contactCardHtml(item))));
  }

  const formSlot = document.getElementById('contact-form-slot');
  document.getElementById('contact-add-btn').addEventListener('click', () => {
    renderContactForm(formSlot, null, () => renderContactsTab(container));
  });

  listEl.querySelectorAll('.contact-edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = items.find(i => i.id === btn.dataset.id);
      renderContactForm(formSlot, item, () => renderContactsTab(container));
    });
  });
  listEl.querySelectorAll('.contact-delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('이 담당자를 삭제하시겠습니까?')) return;
      try {
        await apiRequest('DELETE', '/api/me/contacts/' + encodeURIComponent(btn.dataset.id));
        renderContactsTab(container);
      } catch (err) {
        alert(err.message);
      }
    });
  });
  listEl.querySelectorAll('.contact-set-default-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const item = items.find(i => i.id === btn.dataset.id);
      if (!item) return;
      try {
        await apiRequest('PATCH', '/api/me/contacts/' + encodeURIComponent(item.id), {
          name: item.name, email: item.email, phone: item.phone, isDefault: true,
          emailNotificationsEnabled: item.emailNotificationsEnabled, smsNotificationsEnabled: item.smsNotificationsEnabled,
        });
        renderContactsTab(container);
      } catch (err) {
        alert(err.message);
      }
    });
  });
  disableOwnerOnlyButtons(container);
}

const CONFIDENCE_LABELS = { A: 'A · 공식확인', B: 'B · 서류검증', C: 'C · 직접입력', D: 'D · AI추출' };

function confidenceBadgeHtml(confidence) {

  return `<span class="confidence-badge confidence-badge--${escapeAttr((confidence || '').toLowerCase())}">${escapeHtml(label)}</span>`;

function licenseCardHtml(item) {

  if (item.issuingAuthority) metaParts.push(escapeHtml(item.issuingAuthority));

function renderReviewList(listEl, items) {
  listEl.innerHTML = '';
  if (!items.length) {
    listEl.appendChild(h('<p class="empty">검토 대기 항목이 없습니다.</p>'));
    return;
  }
  const rows = items.map(it => `
    <div class="review-item" data-id="${escapeAttr(it.id)}" data-type="${escapeAttr(it.type)}">
      <div class="review-item-head">
        <span class="review-type-badge">${escapeHtml(REVIEW_TYPE_LABELS[it.type] || it.type)}</span>
        <a class="review-notice-link" href="#/notices/${escapeAttr(it.noticeId)}" target="_blank" rel="noopener">${escapeHtml(it.noticeTitle)} &rarr;</a>
      </div>
      <p class="condition-name">${escapeHtml(it.conditionName || it.documentName || '')}</p>
      <blockquote class="source-quote">${escapeHtml(it.sourceText || '(원문 없음)')}</blockquote>
      <div class="review-actions">
        <button type="button" class="review-btn review-btn--confirm" data-action="confirm">승인</button>
        <button type="button" class="review-btn review-btn--reject" data-action="reject">반려</button>
      </div>
    </div>
  `).join('');
  listEl.appendChild(h(rows));

  listEl.querySelectorAll('.review-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const card = btn.closest('.review-item');
      const id = card.dataset.id;
      const type = card.dataset.type;
      const action = btn.dataset.action;
      const endpoint = type === 'eligibility_condition'
        ? '/api/review/eligibility-conditions/' + encodeURIComponent(id)
        : '/api/review/required-documents/' + encodeURIComponent(id);

      card.querySelectorAll('.review-btn').forEach(b => b.disabled = true);
      try {
        await apiRequest('POST', endpoint, { action });
        card.remove();
        const countEl = document.getElementById('review-count');
        const remaining = listEl.querySelectorAll('.review-item').length;
        if (countEl) countEl.textContent = remaining + '건';
        if (remaining === 0) {
          listEl.appendChild(h('<p class="empty">검토 대기 항목이 없습니다.</p>'));
        }
      } catch (err) {
        card.querySelectorAll('.review-btn').forEach(b => b.disabled = false);
        let errEl = card.querySelector('.review-item-error');
        if (!errEl) {
          errEl = document.createElement('p');
          errEl.className = 'review-item-error';
          card.appendChild(errEl);
        }
        errEl.textContent = err.message;
      }
    });
  });
}

    if (isCurrent) {

      actionHtml = currentUser ? '' : '<a href="#/auth/signup" class="home-cta-secondary">무료로 시작하기</a>';
    } else {
      actionHtml = `<button type="button" class="plan-subscribe-btn" data-plan="${escapeAttr(p.plan)}">구독하기</button>`;
    }
    return `
      <div class="plan-card${isCurrent ? ' plan-card--current' : ''}">
        <h3 class="plan-card-name">${escapeHtml(p.name)}</h3>
        <p class="plan-card-price">${p.amount > 0 ? formatBudget(p.amount) + '/월' : '무료'}</p>
        <ul class="plan-card-features">${features}</ul>
        ${actionHtml}
      </div>
    `;
  }).join('');

  container.innerHTML = '';
  container.appendChild(h(`<h2>요금제</h2><div class="plan-grid">${cards}</div>`));

  container.querySelectorAll('.plan-subscribe-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!currentUser) { location.hash = '#/auth/login'; return; }
      location.hash = '#/billing/checkout?plan=' + encodeURIComponent(btn.dataset.plan);
    });
  });
}

async function renderBillingCheckout(container) {
  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  const plan = params.get('plan');

  if (!currentUser) { location.hash = '#/auth/login'; return; }
  if (!['basic', 'pro', 'business'].includes(plan)) {
    container.innerHTML = '';
    container.appendChild(h('<p class="error">잘못된 요금제입니다. <a href="#/billing/plans">요금제로 돌아가기</a></p>'));
    return;
  }

  container.innerHTML = '';
  container.appendChild(h('<div class="loading">결제 준비 중...</div>'));

  let config, checkout;
  try {
    config = await apiRequest('GET', '/api/billing/config');
    checkout = await apiRequest('POST', '/api/billing/checkout', { plan });
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  if (!config.tossClientKey) {
    container.innerHTML = '';
    container.appendChild(h('<p class="error">결제 기능은 테스트 키 발급 후 이용 가능합니다.</p>'));
    return;
  }

  container.innerHTML = '';
  container.appendChild(h(`
    <a href="#/billing/plans" class="back-link">&larr; 요금제로 돌아가기</a>
    <div class="detail-card">
      <p class="detail-eyebrow">${escapeHtml(checkout.orderName)}</p>
      <h2>${formatBudget(checkout.amount)} / 월</h2>
      <div id="checkout-error" class="error" style="display:none"></div>
      <button type="button" id="checkout-pay-btn" class="home-cta-primary">결제하기</button>
    </div>
  `));

  const errorBox = document.getElementById('checkout-error');
  const payBtn = document.getElementById('checkout-pay-btn');
  // API 개별 연동(결제창) — 결제위젯 연동 키가 나오기 전까지는 이 방식을
  // 쓴다. tossPayments 자체엔 requestPayment가 없고, .payment({customerKey})가
  // 반환하는 객체에 있다(공식 샘플: tosspayments/tosspayments-sample,
  // go-react/frontend/src/pages/payment/PaymentCheckout.jsx 확인).
  // customerKey는 이메일처럼 유추 가능한 값이면 안 되므로 불투명 UUID(회사
  // 프로필 id)를 쓴다 — checkout 응답에 이미 포함되어 있음.
  const tossPayments = TossPayments(config.tossClientKey);
  const payment = tossPayments.payment({ customerKey: checkout.customerKey });

  payBtn.addEventListener('click', async () => {
    errorBox.style.display = 'none';
    payBtn.disabled = true;
    try {
      // 승인 절차(서버가 paymentKey/orderId/amount로 confirm 호출)는 위젯
      // 방식과 완전히 동일 — POST /v1/payments/confirm 하나뿐이라 백엔드는
      // 그대로 재사용.
      //
      // 토스가 successUrl/failUrl에 쿼리를 붙일 때 이미 우리 URL에 '#'이
      // 있으면(해시 라우팅) 그 쿼리는 location.search가 아니라
      // location.hash 뒤에 붙는다 — renderBillingSuccess/Fail이 그렇게
      // 파싱한다(route()의 hash.split('?') 관례와 동일).
      await payment.requestPayment({
        method: 'CARD',
        amount: { currency: 'KRW', value: checkout.amount },
        orderId: checkout.orderId,
        orderName: checkout.orderName,
        customerName: currentUser.email,
        customerEmail: currentUser.email,
        successUrl: location.origin + location.pathname + '#/billing/success',
        failUrl: location.origin + location.pathname + '#/billing/fail',
        card: { useEscrow: false, flowMode: 'DEFAULT', useCardPoint: false, useAppCardOnly: false },
      });
    } catch (err) {
      payBtn.disabled = false;
      errorBox.textContent = err.message || '결제 요청 중 오류가 발생했습니다.';
      errorBox.style.display = 'block';
    }
  });
}

// parseRedirectParams — 토스 결제창 successUrl/failUrl 리다이렉트 파라미터를
// 읽는다. 실제로 어디에 붙어 돌아오는지 구현체마다 다를 수 있어(URL 스펙대로
// '#' 앞 쿼리스트링(location.search)에 넣을 수도, 우리 URL에 이미 '#'이 있어
// 그 뒤에 이어붙일 수도 있음 — 실사용에서 전자로 확인됨) 둘 다 확인한다.
// location.search를 우선하고, hash 뒤에 붙은 값으로 못 찾은 키만 보충한다.
function parseRedirectParams() {
  const params = new URLSearchParams(location.search);
  const hashQuery = location.hash.split('?')[1];
  if (hashQuery) {
    new URLSearchParams(hashQuery).forEach((v, k) => {
      if (!params.has(k)) params.set(k, v);
    });
  }
  return params;
}

async function renderBillingSuccess(container) {
  const params = parseRedirectParams();
  const paymentKey = params.get('paymentKey');
  const orderId = params.get('orderId');
  const amount = params.get('amount');

  container.innerHTML = '';
  if (!paymentKey || !orderId || !amount) {
    container.appendChild(h('<p class="error">결제 정보가 올바르지 않습니다. <a href="#/billing/plans">요금제로 돌아가기</a></p>'));
    return;
  }
  container.appendChild(h('<div class="loading">결제 승인 처리 중...</div>'));

  try {
    const result = await apiRequest('POST', '/api/billing/confirm', { paymentKey, orderId, amount: Number(amount) });
    container.innerHTML = '';
    if (result.scheduled) {
      // 다운그레이드는 즉시 적용되지 않는다 — 결제는 완료됐지만 지금
      // 이용 중인 상위 플랜 혜택을 현재 만료일까지 그대로 유지하고,
      // 그 이후 새 플랜으로 자동 전환된다.
      container.appendChild(h(`
        <div class="detail-card" style="text-align:center">
          <p class="detail-eyebrow">결제 완료 (예약됨)</p>
          <h2>${escapeHtml(PLAN_DISPLAY_NAMES[result.pendingPlan] || result.pendingPlan)} 플랜으로 전환 예약되었습니다</h2>
          <p class="ai-participation-subtitle">
            현재 이용 중인 ${escapeHtml(PLAN_DISPLAY_NAMES[result.currentPlan] || result.currentPlan)} 플랜 혜택은
            ${result.effectiveAt ? escapeHtml(formatDateTime(result.effectiveAt)) : '만료일'}까지 그대로 유지되고,
            그 이후 자동으로 전환됩니다.
          </p>
          <a href="#/me/subscription" class="home-cta-primary">내 구독 확인하기</a>
        </div>
      `));
      return;
    }
    container.appendChild(h(`
      <div class="detail-card" style="text-align:center">
        <p class="detail-eyebrow">결제 완료</p>
        <h2>${escapeHtml(PLAN_DISPLAY_NAMES[result.plan] || result.plan)} 플랜 구독이 시작되었습니다</h2>
        <p class="ai-participation-subtitle">다음 결제 예정일: ${escapeHtml(formatDateTime(result.expiresAt))}</p>
        <a href="#/me/subscription" class="home-cta-primary">내 구독 확인하기</a>
      </div>
    `));
  } catch (err) {
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">결제 승인에 실패했습니다: ${escapeHtml(err.message)}</p><a href="#/billing/plans">요금제로 돌아가기</a>`));
  }
}

async function renderMySubscription(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/me/subscription');
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    if (err.status === 400) {
      container.appendChild(h('<p class="empty">회사 프로필을 먼저 등록해주세요. <a href="#/me/profile">프로필 등록하기</a></p>'));
      return;
    }
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  const statusLabel = PLAN_STATUS_LABELS[data.status] || data.status;
  const planName = PLAN_DISPLAY_NAMES[data.plan] || data.plan;
  // status가 active가 아니면(결제 대기/해지/만료) 아래 한도는 이미 Free
  // 기준으로 내려온다(백엔드가 effective plan으로 계산) — 그런데 heading엔
  // 여전히 선택했던(또는 예전) plan 이름이 나오므로, 착각하지 않도록
  // 상태별로 정확한 안내를 붙인다("결제 대기"와 "만료"는 원인이 다르므로
  // 문구도 다르게).
  const notActiveReason = {
    pending: '아직 결제가 완료되지 않아',
    expired: '구독 기간이 만료되어',
    cancelled: '구독이 해지되어',
  }[data.status];
  const notActiveNote = notActiveReason
    ? `<p class="ai-minimal-profile-notice">${escapeHtml(notActiveReason)} 적용되지 않았습니다 — 아래 한도는 현재 실제로 적용 중인 Free 기준입니다.</p>`
    : '';
  // 예약된 다운그레이드 — 즉시 업그레이드/예약 다운그레이드 정책. 결제는
  // 이미 완료됐지만 지금 플랜 혜택은 만료일까지 유지되고 그 이후 자동 전환.
  const pendingDowngradeNote = data.pendingPlan ? `
    <div class="ai-minimal-profile-notice">
      <p>${escapeHtml(data.pendingPlanName || data.pendingPlan)} 플랜으로 전환이 예약되어 있습니다
        (${data.expiresAt ? escapeHtml(formatDateTime(data.expiresAt)) : '만료일'}부터 적용).
        그 전까지는 현재 ${escapeHtml(planName)} 플랜 혜택을 그대로 이용할 수 있습니다.</p>
      <button type="button" id="cancel-downgrade-btn" class="btn btn-secondary btn-sm" style="margin-top:0.5rem">전환 예약 취소</button>
    </div>
  ` : '';

  // 환불/해지 — 결제 주기 동안 서비스 사용 이력이 있는지(백엔드
  // refundEligible)에 따라 "환불 요청" 또는 "해지 신청" 중 하나만 보여준다.
  // 이미 해지가 신청된 상태(cancelAtPeriodEnd)면 그 안내 + 취소 버튼으로
  // 대체.
  let refundCancelSection = '';
  if (data.cancelAtPeriodEnd) {
    refundCancelSection = `
      <div class="ai-minimal-profile-notice">
        <p>해지가 신청되어 ${data.expiresAt ? escapeHtml(formatDateTime(data.expiresAt)) : '만료일'}까지 이용 후 자동으로 무료 플랜으로 전환됩니다.</p>
        <button type="button" id="resume-renewal-btn" class="btn btn-secondary btn-sm" style="margin-top:0.5rem">해지 취소</button>
      </div>
    `;
  } else if (data.plan !== 'free' && data.status === 'active') {
    if (data.refundEligible) {
      refundCancelSection = `
        <div style="margin-top:1rem">
          <button type="button" id="refund-request-btn" class="btn btn-secondary btn-sm">환불 요청</button>
        </div>
      `;
    } else {
      const until = data.expiresAt ? formatDateTime(data.expiresAt) : '만료일';
      refundCancelSection = `
        <div class="ai-minimal-profile-notice">
          <p>이미 서비스를 이용하셔서 환불은 어려우며, 해지 시 ${escapeHtml(until)}까지 이용 후 자동으로 무료 플랜으로 전환됩니다.</p>
          <button type="button" id="cancel-renewal-btn" class="btn btn-secondary btn-sm" style="margin-top:0.5rem">해지 신청</button>
        </div>
      `;
    }
  }

  container.innerHTML = '';
  container.appendChild(h(`
    <h2>내 구독</h2>
    <div class="detail-card">
      <span class="badge ${PLAN_STATUS_BADGE_TONE[data.status] || 'badge--gray'}">${escapeHtml(statusLabel)}</span>
      <h2>${escapeHtml(planName)} 플랜</h2>
      ${notActiveNote}
      ${pendingDowngradeNote}
      ${refundCancelSection}
      <dl class="detail-meta">
        <div><dt>시작일</dt><dd>${data.startedAt ? escapeHtml(formatDateTime(data.startedAt)) : '-'}</dd></div>
        <div><dt>다음 결제/만료일</dt><dd>${data.expiresAt ? escapeHtml(formatDateTime(data.expiresAt)) : '-'}</dd></div>
        <div><dt>파이프라인 한도</dt><dd>${data.maxPipelineEntries < 0 ? '무제한' : data.maxPipelineEntries + '건'}</dd></div>
        <div><dt>AI 분석 월 한도</dt><dd>${data.maxAIAnalysisPerMonth < 0 ? '무제한' : data.maxAIAnalysisPerMonth + '건'}</dd></div>
      </dl>
      <a href="#/billing/plans" class="home-cta-secondary" style="margin-top:1rem;display:inline-block">요금제 변경</a>
    </div>
    <div class="detail-card" id="team-section"></div>
    <div class="detail-card" id="payment-history-section"></div>
    <div class="detail-card" id="reports-section"></div>
  `));

  const cancelDowngradeBtn = document.getElementById('cancel-downgrade-btn');
  if (cancelDowngradeBtn) {
    cancelDowngradeBtn.addEventListener('click', async () => {
      if (!confirm('예약된 플랜 전환을 취소하시겠습니까?')) return;
      try {
        await apiRequest('POST', '/api/billing/cancel-downgrade', {});
        renderMySubscription(container);
      } catch (err) {
        alert(err.message);
      }
    });
  }

  const refundBtn = document.getElementById('refund-request-btn');
  if (refundBtn) {
    refundBtn.addEventListener('click', async () => {
      if (!confirm('결제 후 서비스를 이용하지 않으셨습니다. 전액 환불 처리됩니다. 진행하시겠습니까?')) return;
      refundBtn.disabled = true;
      try {
        await apiRequest('POST', '/api/billing/refund-request', {});
        alert('환불이 완료되었습니다.');
        renderMySubscription(container);
      } catch (err) {
        // already_used는 서버가 사용 이력 요약(usage)도 같이 내려준다 —
        // "왜 안 되는지" 숫자로 납득할 수 있게 메시지에 그대로 붙인다.
        let msg = err.message;
        if (err.code === 'already_used' && err.data && err.data.usage) {
          const u = err.data.usage;
          msg += `\n(이번 결제 주기 중 AI 분석 ${u.aiAnalysisCount}건, 신규 파이프라인 ${u.pipelineCreatedCount}건 이용)`;
        }
        alert(msg);
        refundBtn.disabled = false;
      }
    });
  }
  const cancelRenewalBtn = document.getElementById('cancel-renewal-btn');
  if (cancelRenewalBtn) {
    cancelRenewalBtn.addEventListener('click', async () => {
      if (!confirm('해지를 신청하시겠습니까?')) return;
      cancelRenewalBtn.disabled = true;
      try {
        await apiRequest('POST', '/api/billing/cancel-renewal', {});
        renderMySubscription(container);
      } catch (err) {
        alert(err.message);
        cancelRenewalBtn.disabled = false;
      }
    });
  }
  const resumeRenewalBtn = document.getElementById('resume-renewal-btn');
  if (resumeRenewalBtn) {
    resumeRenewalBtn.addEventListener('click', async () => {
      if (!confirm('해지 신청을 취소하시겠습니까?')) return;
      try {
        await apiRequest('POST', '/api/billing/resume-renewal', {});
        renderMySubscription(container);
      } catch (err) {
        alert(err.message);
      }
    });
  }

  // effectivePlanFromRow와 같은 판단: status가 active이고 plan이 business일
  // 때만 팀 3명 — 그 외(pending/expired/cancelled 또는 다른 플랜)는 본인 1명뿐.
  const isEffectiveBusiness = data.plan === 'business' && data.status === 'active';
  renderTeamSection(document.getElementById('team-section'), isEffectiveBusiness ? 3 : 1);
  renderPaymentHistorySection(document.getElementById('payment-history-section'));
  renderReportsSection(document.getElementById('reports-section'));
}

// paymentStatusToneClass — payment_log.status('승인'/'실패'/'취소'/'환불')를
// 배지 톤으로. 결제내역(내 구독)/관리자 대시보드/관리자 회원상세 3곳이
// 전부 이 함수를 쓴다 — 예전엔 3곳에 각각 복붙돼 있었음.
function paymentStatusToneClass(status) {
  if (status === '승인') return 'badge--success';
  if (status === '취소' || status === '환불') return 'badge--gray';
  return 'badge--danger'; // 실패
}

// renderPaymentHistorySection — 결제 내역(payment_log) 최신순 목록. 팀
// 관리/리포트와 같은 이유로 구독 관리 화면에 임베드했다.
async function renderPaymentHistorySection(container) {
  container.innerHTML = '<div class="loading">불러오는 중...</div>';
  let data;
  try {
    data = await apiRequest('GET', '/api/me/payment-history');
  } catch (err) {
    container.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
    return;
  }
  const items = data.items || [];
  if (!items.length) {
    container.innerHTML = '<h3>결제 내역</h3><p class="empty">아직 결제 이력이 없습니다.</p>';
    return;
  }
  const rows = items.map(it => {
    const statusTone = paymentStatusToneClass(it.status);
    const methodPart = it.paymentMethodLabel ? ` · ${escapeHtml(it.paymentMethodLabel)}` : '';
    const refundPart = it.status === '환불' && it.refundedAt
      ? `<div class="license-card-meta">환불 처리: ${escapeHtml(formatDateTime(it.refundedAt))}${it.refundReason ? ' · ' + escapeHtml(it.refundReason) : ''}</div>`
      : '';
    return `
      <div class="license-card">
        <div class="license-card-main">
          <div class="license-card-name">${escapeHtml(it.planName || it.plan || '-')} <span class="badge ${statusTone}">${escapeHtml(it.status)}</span></div>
          <div class="license-card-meta">${escapeHtml(formatDateTime(it.requestedAt))} · <span class="mono">${formatBudget(it.amount)}</span>${methodPart}</div>
          ${refundPart}
        </div>
      </div>
    `;
  }).join('');
  container.innerHTML = `<h3>결제 내역</h3><div class="license-list">${rows}</div>`;
}

// renderReportsSection — 주간/월간 자동 리포트 목록. renderTeamSection과
// 같은 이유로 새 최상위 메뉴 대신 구독 관리 화면에 임베드했다(사이드바/
// 탭바 5개 고정 제약 유지).
async function renderReportsSection(container) {
  container.innerHTML = '<div class="loading">불러오는 중...</div>';
  let data;
  try {
    data = await apiRequest('GET', '/api/reports');
  } catch (err) {
    container.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
    return;
  }
  const items = data.items || [];
  if (!items.length) {
    container.innerHTML = '<h3>리포트</h3><p class="empty">아직 생성된 리포트가 없습니다(매주 월요일/매월 1일 09:00에 자동 생성됩니다).</p>';
    return;
  }
  container.innerHTML = `<h3>리포트</h3><div class="license-list">${items.map(reportCardHtml).join('')}</div>`;
}

function reportCardHtml(item) {
  const label = item.periodType === 'monthly' ? '월간' : '주간';
  const s = item.summary;
  const teamHtml = (s.teamActivity || []).length
    ? `<div class="license-card-meta">${s.teamActivity.map(t => `${escapeHtml(t.assigneeName)} ${t.processedCount}건`).join(' · ')}</div>`
    : '';
  return `
    <div class="license-card">
      <div class="license-card-main">
        <div class="license-card-name">${label} 리포트 · ${escapeHtml(item.periodStart)} ~ ${escapeHtml(item.periodEnd)}</div>
        <div class="license-card-meta">
          신규추천 ${s.newRecommendedCount}건 · 참여검토시작 ${s.pipelineStartedCount}건 · 제출완료 ${s.pipelineCompletedCount}건 ·
          종료 ${s.pipelineClosedCount}건 · 마감임박 ${s.deadlineSoonCount}건 · 마감경과 ${s.deadlinePassedCount}건 · AI분석 ${s.aiAnalysisUsedCount}건
        </div>
        ${teamHtml}
      </div>
    </div>
  `;
}

// ---------- 성장분석(#/growth) ----------
// 완성도·파이프라인 성과 추이는 새 스냅샷 없이 reports 테이블(주간/월간
// 배치가 이미 채움)을 그대로 시간순으로 보여준다 — 리포트 기능 이전에
// 가입한 회사는 리포트가 쌓이기 전까지 이 표가 비어 있을 수 있다(정상,
// 배치가 돌면서 자연히 채워짐).
// growthTrendFilter — Phase 7 2단계: 추이 차트 기간 필터(전체/6개월/3개월).
// 데이터는 이미 한 번에 다 받아오므로(재요청 없음) 필터 전환은 순수
// 프론트 재렌더링이다 — #/pipeline 뷰 토글과 같은 패턴.
let growthTrendFilter = 'all';
const GROWTH_TREND_FILTERS = [['all', '전체'], ['6m', '6개월'], ['3m', '3개월']];

function filterTrendPointsByPeriod(points, filter) {
  if (filter === 'all') return points;
  const months = filter === '3m' ? 3 : 6;
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - months);
  return points.filter(p => new Date(p.periodStart) >= cutoff);
}

async function renderGrowthAnalytics(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/growth-analytics');
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    if (err.status === 400) {
      container.appendChild(h('<p class="empty">기업 프로필을 먼저 등록해주세요. <a href="#/me/profile">프로필 등록하기</a></p>'));
      return;
    }
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  const gradeSegments = (data.gradeDistribution || []).map(g => ({
    label: GRADE_LABELS[g.grade] || g.grade,
    count: g.count,
    colorVar: GRADE_TONE_COLOR_VAR[GRADE_BADGE_TONE[g.grade]] || '--ink-soft',
  }));
  const gradeDistributionHtml = gradeSegments.length ? `
    <div class="donut-chart-wrap">
      ${donutChartHtml(gradeSegments)}
      <div class="donut-legend">${gradeSegments.map(s => `
        <div class="donut-legend-row">
          <span class="donut-legend-dot" style="background:var(${s.colorVar})"></span>
          <span class="donut-legend-label">${escapeHtml(s.label)}</span>
          <span class="donut-legend-value">${s.count}건</span>
        </div>
      `).join('')}</div>
    </div>
  ` : '<p class="empty">채점할 공고가 없습니다.</p>';

  const roi = data.roi || {};
  const ratioLabel = roi.ratio != null ? (roi.ratio * 100).toFixed(0) + '%' : '계산 불가';

  container.innerHTML = '';
  container.appendChild(h(`
    <h2>성장분석</h2>
    <div id="growth-trend-section"></div>
    <div class="detail-card">
      <h3>AI 참여판정 등급 분포</h3>
      <p class="license-card-meta">현재 열려있는 공고 전체를 지금 기준으로 다시 채점한 결과입니다(실시간 스냅샷).</p>
      ${gradeDistributionHtml}
      <div id="growth-grade-trend-section"></div>
    </div>
    <div id="growth-benchmark-section"></div>
    <div class="detail-card">
      <h3>ROI (낙찰금액 대비 비용)</h3>
      <p class="license-card-meta">낙찰 시 직접 입력한 금액과 실제 결제한 구독료를 비교합니다. 공고 예산액이 아니라 실제 계약금액 기준입니다.</p>
      <div class="growth-roi-grid">
        <div class="growth-roi-tile">
          <div class="growth-roi-tile-value mono">${formatBudget(roi.totalAwardedAmount)}</div>
          <div class="growth-roi-tile-label">총 낙찰금액 (${roi.awardedCount || 0}건)</div>
        </div>
        <div class="growth-roi-tile">
          <div class="growth-roi-tile-value mono">${formatBudget(roi.totalPaidAmount)}</div>
          <div class="growth-roi-tile-label">총 결제금액</div>
        </div>
        <div class="growth-roi-tile">
          <div class="growth-roi-tile-value mono">${escapeHtml(ratioLabel)}</div>
          <div class="growth-roi-tile-label">낙찰금액 / 결제금액</div>
        </div>
      </div>
      ${roi.awardedCount === 0 ? '<p class="license-card-meta">낙찰 건에 금액을 입력하지 않으면 계산되지 않습니다 — 진행 중 사업 상세에서 상태를 "낙찰"로 바꿀 때 낙찰 금액을 입력해주세요.</p>' : ''}
    </div>
  `));

  const allTrendPoints = data.trend || [];
  renderGrowthTrendSections(
    document.getElementById('growth-trend-section'),
    document.getElementById('growth-grade-trend-section'),
    allTrendPoints
  );
  renderGrowthBenchmarkSection(document.getElementById('growth-benchmark-section'), data.benchmark);
}

function renderGrowthTrendSections(trendContainer, gradeTrendContainer, allTrendPoints) {
  const trendPoints = filterTrendPointsByPeriod(allTrendPoints, growthTrendFilter);
  const filterHtml = `
    <div class="license-toolbar" style="margin-bottom:0.6rem">
      ${GROWTH_TREND_FILTERS.map(([v, label]) =>
        `<button type="button" class="btn btn-secondary btn-sm growth-filter-btn${v === growthTrendFilter ? ' btn-primary' : ''}" data-filter="${v}">${label}</button>`
      ).join('')}
    </div>
  `;

  let trendHtml;
  if (trendPoints.length >= 2) {
    const labels = trendPoints.map(t => t.periodStart.slice(5));
    const completenessChart = simpleLineChartHtml(labels, [
      { colorVar: '--accent-blue', values: trendPoints.map(t => t.profileCompletenessScore) },
    ], 100);
    const pipelineChart = simpleLineChartHtml(labels, [
      { colorVar: '--accent-blue', values: trendPoints.map(t => t.pipelineStartedCount) },
      { colorVar: '--success', values: trendPoints.map(t => t.pipelineCompletedCount) },
      { colorVar: '--ink-soft', values: trendPoints.map(t => t.pipelineClosedCount) },
    ]);
    trendHtml = `
      <div class="detail-card">
        <h3>AI 분석 커버리지·파이프라인 성과 추이</h3>
        <p class="license-card-meta">매주 월요일/매월 1일 생성되는 리포트를 시간순으로 모은 값입니다.</p>
        ${filterHtml}
        <p class="growth-chart-title">AI 분석 커버리지(%)</p>
        ${completenessChart}
        <p class="growth-chart-title">파이프라인 성과(건)</p>
        ${pipelineChart}
        <div class="growth-chart-legend">
          <span class="growth-chart-legend-item"><span class="donut-legend-dot" style="background:var(--accent-blue)"></span>참여검토 시작</span>
          <span class="growth-chart-legend-item"><span class="donut-legend-dot" style="background:var(--success)"></span>제출완료</span>
          <span class="growth-chart-legend-item"><span class="donut-legend-dot" style="background:var(--ink-soft)"></span>종료</span>
        </div>
      </div>
    `;
  } else if (allTrendPoints.length >= 1 && trendPoints.length < 2) {
    trendHtml = `
      <div class="detail-card">
        <h3>AI 분석 커버리지·파이프라인 성과 추이</h3>
        ${filterHtml}
        <p class="empty">선택한 기간에는 그래프를 그릴 만큼 리포트가 쌓이지 않았습니다 — 기간을 넓혀보세요.</p>
      </div>
    `;
  } else {
    trendHtml = `
      <div class="detail-card">
        <h3>AI 분석 커버리지·파이프라인 성과 추이</h3>
        <p class="empty">아직 쌓인 리포트가 없습니다. 매주 월요일/매월 1일 자동 생성되면 여기 표시됩니다.</p>
      </div>
    `;
  }
  trendContainer.innerHTML = trendHtml;

  // AI등급분포 추이 — reports.summary에 gradeDistribution을 저장하기
  // 시작한 이후의 리포트에만 값이 있다(그 전 리포트는 빈 배열/누락).
  const gradeTrendPoints = trendPoints.filter(t => t.gradeDistribution && t.gradeDistribution.length);
  let gradeTrendHtml = '<p class="license-card-meta" style="margin-top:0.75rem">등급분포 추이는 선택한 기간에 리포트가 2건 이상 쌓이면 그래프로 표시됩니다.</p>';
  if (gradeTrendPoints.length >= 2) {
    const labels = gradeTrendPoints.map(t => t.periodStart.slice(5));
    const grades = Object.keys(GRADE_LABELS);
    const series = grades.map(g => ({
      colorVar: GRADE_TONE_COLOR_VAR[GRADE_BADGE_TONE[g]] || '--ink-soft',
      values: gradeTrendPoints.map(t => (t.gradeDistribution.find(d => d.grade === g) || {}).count || 0),
    }));
    gradeTrendHtml = `
      <p class="growth-chart-title">등급분포 추이(건)</p>
      ${simpleLineChartHtml(labels, series)}
      <div class="growth-chart-legend">
        ${grades.map(g => `<span class="growth-chart-legend-item"><span class="donut-legend-dot" style="background:var(${GRADE_TONE_COLOR_VAR[GRADE_BADGE_TONE[g]] || '--ink-soft'})"></span>${escapeHtml(GRADE_LABELS[g])}</span>`).join('')}
      </div>
    `;
  }
  gradeTrendContainer.innerHTML = gradeTrendHtml;

  trendContainer.querySelectorAll('.growth-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      growthTrendFilter = btn.dataset.filter;
      renderGrowthTrendSections(trendContainer, gradeTrendContainer, allTrendPoints);
    });
  });
}

// renderGrowthBenchmarkSection — Phase 7 2단계: 전체 사용자 평균 대비 우리
// 회사 위치. 익명성 보호를 위해 지표별로 비교 대상 회사가 최소 5개
// 이상일 때만 평균을 보여준다(growth_analytics.go의 minBenchmarkCompanies와
// 동일 기준) — 회사 수가 적으면 "평균"이 사실상 특정 경쟁사 데이터를
// 노출할 수 있어서다.
function renderGrowthBenchmarkSection(container, benchmark) {
  if (!container || !benchmark) return;
  const metrics = [
    { key: 'profileCompleteness', label: 'AI 분석 커버리지', unit: '%', fmt: v => Math.round(v) },
    { key: 'pipelineConversion', label: '파이프라인 전환율(참여검토 → 제출완료)', unit: '%', fmt: v => Math.round(v * 100) },
  ];
  const rowsHtml = metrics.map(m => {
    const metric = benchmark[m.key];
    if (!metric) return '';
    const ourText = metric.ourValue != null ? `${m.fmt(metric.ourValue)}${m.unit}` : '데이터 없음';
    if (!metric.available) {
      return `
        <div class="growth-benchmark-row">
          <div class="growth-benchmark-label">${escapeHtml(m.label)}</div>
          <div class="growth-benchmark-our">우리 회사 ${ourText}</div>
          <p class="license-card-meta">비교 가능한 다른 회사가 아직 부족합니다(현재 ${metric.companyCount}개 · 최소 ${benchmark.minCompanyCount}개 필요) — 회원이 늘면 자동으로 표시됩니다.</p>
        </div>
      `;
    }
    const avgText = `${m.fmt(metric.averageValue)}${m.unit}`;
    const diff = metric.ourValue - metric.averageValue;
    const diffLabel = diff > 0 ? `평균보다 ${m.fmt(Math.abs(diff))}${m.unit} 높음` : diff < 0 ? `평균보다 ${m.fmt(Math.abs(diff))}${m.unit} 낮음` : '평균과 동일';
    const diffTone = diff > 0 ? 'badge--success' : diff < 0 ? 'badge--warn' : 'badge--gray';
    return `
      <div class="growth-benchmark-row">
        <div class="growth-benchmark-label">${escapeHtml(m.label)}</div>
        <div class="growth-benchmark-bars">
          <div class="growth-bar-row"><span class="growth-bar-label">우리 회사</span><span class="growth-bar-track"><span class="growth-bar-fill" style="width:${Math.min(100, m.fmt(metric.ourValue))}%;background:var(--accent-blue)"></span></span><span class="growth-bar-value">${ourText}</span></div>
          <div class="growth-bar-row"><span class="growth-bar-label">전체 평균</span><span class="growth-bar-track"><span class="growth-bar-fill" style="width:${Math.min(100, m.fmt(metric.averageValue))}%;background:var(--ink-soft)"></span></span><span class="growth-bar-value">${avgText}</span></div>
        </div>
        <span class="badge ${diffTone}">${escapeHtml(diffLabel)}</span>
        <p class="license-card-meta">비교 대상 ${metric.companyCount}개 회사(익명 집계, 개별 데이터는 노출하지 않습니다)</p>
      </div>
    `;
  }).join('');

  container.innerHTML = `
    <div class="detail-card">
      <h3>벤치마킹</h3>
      <p class="license-card-meta">전체 가입 회사의 익명 집계 평균과 우리 회사를 비교합니다. 개별 회사 데이터는 절대 노출하지 않습니다.</p>
      ${rowsHtml || '<p class="empty">비교할 수 있는 지표가 아직 없습니다.</p>'}
    </div>
  `;
}
