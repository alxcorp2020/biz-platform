// wireHomeListNav — 행 클릭 시 서버가 정해준 ctaHref로 이동(kind별로
// 다른 이동 규칙을 프론트가 다시 판단하지 않는다 — license_expiring/
// notice_change처럼 파이프라인 엔트리가 없는 항목도 이걸로 그대로 처리됨).
function wireHomeListNav(container) {
  container.querySelectorAll('.home-list-row').forEach(row => {
    row.addEventListener('click', () => {
      if (row.dataset.ctaHref) location.hash = row.dataset.ctaHref;
    });
  });
}

// ---------- 진행 중 사업 (#/pipeline) ----------
// PIPELINE_LIST_FILTERS — 대시보드 요약 카드(dashboard.go의 summary 집계와
// 정확히 같은 정의)에서 "#/pipeline?filter=키"로 들어왔을 때 적용할
// 조건. 전부 "종결되지 않은"(PIPELINE_ACTIVE_STATUSES) 항목만 대상으로
// 한다 — dashboard.go도 이 4개 카드 전부 active 상태만 센다.
const PIPELINE_LIST_FILTERS = {
  reviewPending: {
    label: '참여검토 대기',
    test: it => ['검토전', '참여검토', '승인대기'].includes(it.status),
  },
  deadlineSoon: {
    label: '마감임박',
    test: it => {
      if (!PIPELINE_ACTIVE_STATUSES.includes(it.status)) return false;
      const d = diffDaysFromToday(it.submissionDeadline);
      return d >= 0 && d <= 7;
    },
  },
  needsDocument: {
    label: '서류확인필요',
    test: it => PIPELINE_ACTIVE_STATUSES.includes(it.status) && (it.incompleteDocumentCount || 0) > 0,
  },
  unassigned: {
    label: '담당자미지정',
    test: it => PIPELINE_ACTIVE_STATUSES.includes(it.status) && !it.assigneeName,
  },
};

function diffDaysFromToday(iso) {
  if (!iso) return Infinity;
  const d = new Date(iso);
  if (isNaN(d)) return Infinity;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const target = new Date(d); target.setHours(0, 0, 0, 0);
  return Math.round((target - today) / 86400000);
}

async function renderPipelineList(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/pipeline');
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  const items = data.items || [];
  container.innerHTML = '';

  const filterKey = new URLSearchParams(location.hash.split('?')[1] || '').get('filter');
  const filter = PIPELINE_LIST_FILTERS[filterKey];

  if (filter) {
    const filtered = items.filter(filter.test);
    const bannerHtml = `
      <div class="pipeline-filter-banner">
        <span>필터: ${escapeHtml(filter.label)} (${filtered.length}건)</span>
        <a href="#/pipeline" class="official-link">전체보기 &rarr;</a>
      </div>
    `;
    container.appendChild(h(`<h2>진행 중 사업</h2>${bannerHtml}`));
    if (!filtered.length) {
      container.appendChild(h('<p class="empty">조건에 맞는 사업이 없습니다.</p>'));
      return;
    }
    container.appendChild(h(`<div class="notice-list">${filtered.map(pipelineListRowHtml).join('')}</div>`));
    container.querySelectorAll('.pipeline-row').forEach(row => {
      row.addEventListener('click', () => { location.hash = '#/pipeline/' + row.dataset.id; });
    });
    return;
  }

  if (!items.length) {
    container.appendChild(h(`
      <h2>진행 중 사업</h2>
      <p class="empty">아직 참여 검토 중인 사업이 없습니다. 공고 상세에서 "참여 검토"를 눌러 시작하세요.</p>
    `));
    return;
  }

  renderPipelineViews(container, items);
}

// renderPipelineViews — Phase 3: 리스트/칸반/표 뷰 토글의 공용 껍데기.
// items는 GET /api/pipeline 한 번으로 받은 걸 그대로 재사용하고(뷰를
// 바꿔도 재요청 없음), 모바일(≤640px)에서는 칸반/표가 쓸모없어(가로
// 공간 부족) 토글 자체를 숨기고 항상 리스트로 강제한다.
let pipelineViewMode = 'list';
let pipelineViewsLastIsMobile = null;

// 이 SPA는 라우트 전환마다 #app.innerHTML을 통째로 새로 그리는 방식이라
// (route() 참고) 화면 대부분은 리사이즈에 반응할 필요가 없다(모바일
// 진입 시 매번 새로 렌더링되므로 window.innerWidth를 그때 한 번만 읽으면
// 충분). 다만 칸반/표 뷰는 "이미 데스크톱 폭에서 그려진 화면을 그대로
// 좁혀도" 강제로 리스트로 안 바뀌는 게 이상하므로, 이 화면만 예외적으로
// 브레이크포인트를 넘을 때 다시 그리는 전역 리스너를 한 번 등록해둔다.
window.addEventListener('resize', () => {
  if ((location.hash || '#/').split('?')[0] !== '#/pipeline') return;
  const nowMobile = window.innerWidth <= 640;
  if (nowMobile === pipelineViewsLastIsMobile) return;
  renderPipelineList(app);
});

function renderPipelineViews(container, items) {
  container.innerHTML = '';
  const isMobile = window.innerWidth <= 640;
  pipelineViewsLastIsMobile = isMobile;
  const mode = isMobile ? 'list' : pipelineViewMode;

  container.appendChild(h(`
    <div class="pipeline-view-header">
      <h2>진행 중 사업</h2>
      ${isMobile ? '' : pipelineViewSwitchHtml(mode)}
    </div>
  `));

  const body = document.createElement('div');
  container.appendChild(body);

  if (mode === 'kanban') renderPipelineKanban(body, items);
  else if (mode === 'table') renderPipelineTable(body, items);
  else renderPipelineListView(body, items);

  container.querySelectorAll('.pipeline-view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      pipelineViewMode = btn.dataset.view;
      renderPipelineViews(container, items);
    });
  });
}

function pipelineViewSwitchHtml(mode) {
  const views = [['list', '리스트'], ['kanban', '칸반'], ['table', '표']];
  return `<div class="pipeline-view-switch">${views.map(([v, label]) =>
    `<button type="button" class="btn btn-secondary pipeline-view-btn${v === mode ? ' is-active' : ''}" data-view="${v}">${label}</button>`
  ).join('')}</div>`;
}

function renderPipelineListView(container, items) {
  const grouped = {};
  items.forEach(it => { (grouped[it.status] = grouped[it.status] || []).push(it); });

  const sectionsHtml = PIPELINE_STATUS_LIST.map(status => {
    const group = grouped[status] || [];
    if (!group.length) return '';
    return `
      <div class="pipeline-status-section">
        <h3 class="pipeline-status-section-title">${escapeHtml(status)} <span class="pipeline-status-section-count">${group.length}건</span></h3>
        <div class="notice-list">${group.map(pipelineListRowHtml).join('')}</div>
      </div>
    `;
  }).join('');

  container.innerHTML = sectionsHtml;

  container.querySelectorAll('.pipeline-row').forEach(row => {
    row.addEventListener('click', () => { location.hash = '#/pipeline/' + row.dataset.id; });
  });
}

// ---------- 파이프라인 칸반 뷰(Phase 3) ----------
// 진행중 4개 상태만 컬럼으로 쓰고, 종결 5개는 칸반 아래 접이식 섹션에
// 모아둔다(제출완료~제외까지 컬럼으로 늘어놓으면 폭이 9개라 실사용성이
// 떨어진다고 판단 — 요구사항 확정 시 사용자와 합의된 내용).
const PIPELINE_TERMINAL_STATUSES = PIPELINE_STATUS_LIST.filter(s => !PIPELINE_ACTIVE_STATUSES.includes(s));

function pipelineKanbanCardHtml(entry) {
  const assignee = entry.assigneeName ? escapeHtml(entry.assigneeName) : '담당자 미지정';
  const gradeHtml = entry.aiGrade ? gradeBadgeHtml(entry.aiGrade, GRADE_LABELS[entry.aiGrade] || entry.aiGrade) : '';
  return `
    <div class="kanban-card" draggable="true" data-id="${escapeAttr(entry.id)}">
      <div class="kanban-card-title">${escapeHtml(entry.noticeTitle)}</div>
      <div class="kanban-card-org">${escapeHtml(entry.organizationName || '-')}</div>
      <div class="kanban-card-meta">
        <span class="kanban-card-assignee">${assignee}</span>
        ${ddayBadgeHtml(entry.submissionDeadline)}
      </div>
      ${gradeHtml ? `<div class="kanban-card-grade">${gradeHtml}</div>` : ''}
    </div>
  `;
}

// renderPipelineKanban — 자기 자신을 다시 호출해서 다시 그리는 방식으로
// 드래그 낙관적 갱신/롤백을 처리한다(이 프로젝트에 가상 DOM이 없으므로
// 항상 innerHTML 재작성 — 다른 화면들과 같은 패턴). 재호출 전에 열려
//있던 "종결됨" <details>의 open 상태를 읽어와 유지한다.
function renderPipelineKanban(container, items) {
  const existingDetails = container.querySelector('.kanban-terminal-section');
  const terminalWasOpen = existingDetails ? existingDetails.open : false;

  const grouped = {};
  items.forEach(it => { (grouped[it.status] = grouped[it.status] || []).push(it); });
  const terminalItems = PIPELINE_TERMINAL_STATUSES.flatMap(s => grouped[s] || []);

  const columnsHtml = PIPELINE_ACTIVE_STATUSES.map(status => {
    const group = grouped[status] || [];
    return `
      <div class="kanban-column">
        <div class="kanban-column-header">${escapeHtml(status)} <span class="kanban-column-count">${group.length}</span></div>
        <div class="kanban-column-body" data-status="${escapeAttr(status)}">
          ${group.map(pipelineKanbanCardHtml).join('')}
        </div>
      </div>
    `;
  }).join('');

  const terminalHtml = terminalItems.length ? `
    <details class="kanban-terminal-section"${terminalWasOpen ? ' open' : ''}>
      <summary>종결됨 (${terminalItems.length}건)</summary>
      <div class="notice-list">${terminalItems.map(pipelineListRowHtml).join('')}</div>
    </details>
  ` : '';

  container.innerHTML = `<div class="kanban-board">${columnsHtml}</div>${terminalHtml}`;

  let suppressClick = false;
  container.querySelectorAll('.kanban-card').forEach(card => {
    card.addEventListener('click', () => {
      if (suppressClick) { suppressClick = false; return; }
      location.hash = '#/pipeline/' + card.dataset.id;
    });
    card.addEventListener('dragstart', (e) => {
      suppressClick = true;
      card.classList.add('is-dragging');
      e.dataTransfer.setData('text/plain', card.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => { card.classList.remove('is-dragging'); });
  });

  container.querySelectorAll('.kanban-column-body').forEach(col => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('is-drop-target'); });
    col.addEventListener('dragleave', () => { col.classList.remove('is-drop-target'); });
    col.addEventListener('drop', async (e) => {
      e.preventDefault();
      col.classList.remove('is-drop-target');
      const entryId = e.dataTransfer.getData('text/plain');
      const newStatus = col.dataset.status;
      const entry = items.find(it => it.id === entryId);
      if (!entry || entry.status === newStatus) return;
      const prevStatus = entry.status;
      entry.status = newStatus; // 낙관적 갱신 — 자동전환 배치와의 충돌 방지는
      // 하지 않는다(요구사항 확정: 드래그는 항상 허용, 다음 배치 때 마감/
      // 공고마감 조건에 해당하면 다시 자동으로 '제외'로 넘어갈 수 있음).
      renderPipelineKanban(container, items);
      try {
        await apiRequest('PATCH', '/api/pipeline/' + encodeURIComponent(entryId), { status: newStatus });
      } catch (err) {
        entry.status = prevStatus; // 실패 시 원래 컬럼으로 롤백
        renderPipelineKanban(container, items);
        alert('상태 변경에 실패했습니다: ' + err.message);
      }
    });
  });

  container.querySelectorAll('.pipeline-row').forEach(row => {
    row.addEventListener('click', () => { location.hash = '#/pipeline/' + row.dataset.id; });
  });
}

// ---------- 파이프라인 표 뷰(Phase 3) ----------
const PIPELINE_TABLE_COLUMNS = [
  { key: 'noticeTitle', label: '공고명' },
  { key: 'organizationName', label: '발주기관' },
  { key: 'status', label: '상태' },
  { key: 'assigneeName', label: '담당자' },
  { key: 'submissionDeadline', label: '마감일' },
  { key: 'aiGrade', label: 'AI판정등급' },
  { key: 'incompleteDocumentCount', label: '서류미비' },
  { key: 'updatedAt', label: '최근수정일' },
];

let pipelineTableSort = { key: 'submissionDeadline', dir: 'asc' };
let pipelineTableStatusFilter = '';

function pipelineTableSortValue(entry, key) {
  switch (key) {
    case 'organizationName': return entry.organizationName || '';
    case 'assigneeName': return entry.assigneeName || '';
    case 'submissionDeadline': return entry.submissionDeadline || '9999-99-99';
    case 'aiGrade': return GRADE_LABELS[entry.aiGrade] || entry.aiGrade || '';
    case 'incompleteDocumentCount': return entry.incompleteDocumentCount || 0;
    case 'updatedAt': return entry.updatedAt || '';
    default: return entry[key] || '';
  }
}

function renderPipelineTable(container, items) {
  const filtered = pipelineTableStatusFilter
    ? items.filter(it => it.status === pipelineTableStatusFilter)
    : items;

  const sorted = filtered.slice().sort((a, b) => {
    const av = pipelineTableSortValue(a, pipelineTableSort.key);
    const bv = pipelineTableSortValue(b, pipelineTableSort.key);
    const cmp = (typeof av === 'number' && typeof bv === 'number')
      ? av - bv
      : String(av).localeCompare(String(bv), 'ko');
    return pipelineTableSort.dir === 'asc' ? cmp : -cmp;
  });

  const filterOptionsHtml = ['<option value="">전체 상태</option>']
    .concat(PIPELINE_STATUS_LIST.map(s => `<option value="${escapeAttr(s)}" ${s === pipelineTableStatusFilter ? 'selected' : ''}>${escapeHtml(s)}</option>`))
    .join('');

  const headHtml = PIPELINE_TABLE_COLUMNS.map(col => {
    const isSorted = pipelineTableSort.key === col.key;
    const arrow = isSorted ? (pipelineTableSort.dir === 'asc' ? ' ▲' : ' ▼') : '';
    return `<th class="pipeline-table-th" data-key="${escapeAttr(col.key)}">${escapeHtml(col.label)}${arrow}</th>`;
  }).join('');

  const rowsHtml = sorted.map(entry => {
    const gradeHtml = entry.aiGrade ? gradeBadgeHtml(entry.aiGrade, GRADE_LABELS[entry.aiGrade] || entry.aiGrade) : '-';
    return `
      <tr class="pipeline-table-row" data-id="${escapeAttr(entry.id)}">
        <td>${escapeHtml(entry.noticeTitle)}</td>
        <td>${escapeHtml(entry.organizationName || '-')}</td>
        <td><span class="badge ${PIPELINE_TERMINAL_BADGE_TONE[entry.status] || 'badge--blue'}">${escapeHtml(entry.status)}</span></td>
        <td>${escapeHtml(entry.assigneeName || '미지정')}</td>
        <td>${ddayBadgeHtml(entry.submissionDeadline)}</td>
        <td>${gradeHtml}</td>
        <td>${entry.incompleteDocumentCount || 0}건</td>
        <td>${escapeHtml(formatDate(entry.updatedAt))}</td>
      </tr>
    `;
  }).join('');

  container.innerHTML = `
    <div class="pipeline-table-toolbar">
      <select class="select-input pipeline-table-filter">${filterOptionsHtml}</select>
      <span class="pipeline-table-count">${sorted.length}건</span>
    </div>
    <div class="pipeline-table-wrap">
      <table class="pipeline-table">
        <thead><tr>${headHtml}</tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="${PIPELINE_TABLE_COLUMNS.length}" class="empty">조건에 맞는 사업이 없습니다.</td></tr>`}</tbody>
      </table>
    </div>
  `;

  container.querySelector('.pipeline-table-filter').addEventListener('change', (e) => {
    pipelineTableStatusFilter = e.target.value;
    renderPipelineTable(container, items);
  });
  container.querySelectorAll('.pipeline-table-th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (pipelineTableSort.key === key) pipelineTableSort.dir = pipelineTableSort.dir === 'asc' ? 'desc' : 'asc';
      else pipelineTableSort = { key, dir: 'asc' };
      renderPipelineTable(container, items);
    });
  });
  container.querySelectorAll('.pipeline-table-row').forEach(row => {
    row.addEventListener('click', () => { location.hash = '#/pipeline/' + row.dataset.id; });
  });
}

function pipelineListRowHtml(entry) {
  const assignee = entry.assigneeName ? `담당: ${escapeHtml(entry.assigneeName)}` : '담당자 미지정';
  return `
    <div class="row-card pipeline-row" data-id="${escapeAttr(entry.id)}">
      <span class="row-card-icon">${LIST_ROW_ICONS.pipeline}</span>
      <div class="row-card-main">
        <div class="row-card-title">${escapeHtml(entry.noticeTitle)}</div>
        <div class="row-card-subtitle">${escapeHtml(entry.organizationName || '-')} · ${assignee}</div>
      </div>
      <div class="row-card-side">
        ${pipelineStepIndicatorHtml(entry.status)}
        <span class="row-card-arrow">›</span>
      </div>
    </div>
  `;
}

// ---------- 캘린더(#/calendar) ----------
// 외부 캘린더 라이브러리(FullCalendar 등) 없이 순수 JS로 만들었다 —
// 이 프로젝트가 프레임워크/무거운 의존성을 피하는 기조(analyzer의
// requirements.txt 주석, notify 패키지의 "최소 외부 의존성" 원칙과
// 동일한 판단)와 맞고, 이벤트 볼륨도 작아(회사 하나가 동시에 진행하는
// 파이프라인 일정이 많아야 수십 건) 250KB+ 라이브러리를 CDN으로 붙일
// 실익이 없다고 판단했다. 이벤트 데이터는 .ics 다운로드(calendar.go)와
// 완전히 같은 소스(GET /api/pipeline/calendar-events)를 쓴다.
const CALENDAR_WEEKDAY_LABELS = ['일', '월', '화', '수', '목', '금', '토'];
const CALENDAR_KIND_LABELS = { submission: '제출마감', qualification: '등록마감', opening: '개찰일시' };
const CALENDAR_KIND_TONES = { submission: 'danger', qualification: 'warn', opening: 'blue' };

let calendarState = { view: 'month', anchor: new Date(), events: [] };

async function renderCalendarView(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/pipeline/calendar-events');
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }
  calendarState.events = data.items || [];
  calendarState.anchor = new Date(); // 화면 진입마다 오늘 기준으로 리셋
  container.innerHTML = '';
  container.appendChild(h('<h2>캘린더</h2><div id="calendar-root"></div>'));
  renderCalendarShell(document.getElementById('calendar-root'));
}

function renderCalendarShell(root) {
  root.innerHTML = `
    <div class="calendar-toolbar">
      <div class="calendar-toolbar-nav">
        <button type="button" id="calendar-prev-btn" class="btn btn-secondary btn-sm" aria-label="이전">&lsaquo;</button>
        <button type="button" id="calendar-today-btn" class="btn btn-secondary btn-sm">오늘</button>
        <button type="button" id="calendar-next-btn" class="btn btn-secondary btn-sm" aria-label="다음">&rsaquo;</button>
        <h2 class="calendar-title" id="calendar-title"></h2>
      </div>
      <div class="calendar-view-switch">
        ${['month', 'week', 'day'].map(v => `<button type="button" class="btn btn-secondary btn-sm calendar-view-btn${calendarState.view === v ? ' is-active' : ''}" data-view="${v}">${v === 'month' ? '월' : v === 'week' ? '주' : '일'}</button>`).join('')}
      </div>
    </div>
    <div class="calendar-legend">
      ${Object.keys(CALENDAR_KIND_LABELS).map(k => `<span class="calendar-legend-item"><span class="calendar-dot calendar-dot--${CALENDAR_KIND_TONES[k]}"></span>${escapeHtml(CALENDAR_KIND_LABELS[k])}</span>`).join('')}
    </div>
    <div id="calendar-body"></div>
  `;
  document.getElementById('calendar-prev-btn').addEventListener('click', () => { shiftCalendarAnchor(-1); renderCalendarShell(root); });
  document.getElementById('calendar-next-btn').addEventListener('click', () => { shiftCalendarAnchor(1); renderCalendarShell(root); });
  document.getElementById('calendar-today-btn').addEventListener('click', () => { calendarState.anchor = new Date(); renderCalendarShell(root); });
  root.querySelectorAll('.calendar-view-btn').forEach(btn => {
    btn.addEventListener('click', () => { calendarState.view = btn.dataset.view; renderCalendarShell(root); });
  });
  renderCalendarBody(document.getElementById('calendar-body'));
}

function shiftCalendarAnchor(dir) {
  const d = new Date(calendarState.anchor);
  if (calendarState.view === 'month') d.setMonth(d.getMonth() + dir);
  else if (calendarState.view === 'week') d.setDate(d.getDate() + dir * 7);
  else d.setDate(d.getDate() + dir);
  calendarState.anchor = d;
}

function calendarDateKey(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function calendarFormatDate(d) {
  return `${d.getMonth() + 1}월 ${d.getDate()}일(${CALENDAR_WEEKDAY_LABELS[d.getDay()]})`;
}

function calendarWeekDays(anchor) {
  const d = new Date(anchor);
  d.setHours(0, 0, 0, 0);
  const start = new Date(d);
  start.setDate(d.getDate() - d.getDay());
  return Array.from({ length: 7 }, (_, i) => {
    const x = new Date(start);
    x.setDate(start.getDate() + i);
    return x;
  });
}

function calendarEventsByDateKey() {
  const map = {};
  calendarState.events.forEach(e => {
    const key = calendarDateKey(new Date(e.start));
    (map[key] = map[key] || []).push(e);
  });
  Object.values(map).forEach(list => list.sort((a, b) => new Date(a.start) - new Date(b.start)));
  return map;
}

function calendarEventChipHtml(e) {
  const tone = CALENDAR_KIND_TONES[e.kind] || '';
  const d = new Date(e.start);
  const time = e.allDay ? '' : `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} `;
  return `<div class="calendar-event calendar-event--${tone}" data-entry-id="${escapeAttr(e.pipelineEntryId)}" title="${escapeAttr(CALENDAR_KIND_LABELS[e.kind] || e.kind)} · ${escapeAttr(e.noticeTitle)}">${time}${escapeHtml(e.noticeTitle)}</div>`;
}

function wireCalendarEventClicks(scopeEl) {
  scopeEl.querySelectorAll('.calendar-event').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      location.hash = '#/pipeline/' + el.dataset.entryId;
    });
  });
}

// CALENDAR_MOBILE_QUERY — 월간 뷰가 텍스트 칩 대신 점(dot)으로 바뀌는
// 기준. week-grid를 1열로 접는 CSS 미디어쿼리(640px)와 같은 값을 써서
// "좁아지는 시점"이 화면 전체에서 일관되게 한다.
const CALENDAR_MOBILE_QUERY = '(max-width: 640px)';

function renderCalendarBody(bodyEl) {
  const titleEl = document.getElementById('calendar-title');
  const byDate = calendarEventsByDateKey();
  if (calendarState.view === 'month') {
    titleEl.textContent = `${calendarState.anchor.getFullYear()}년 ${calendarState.anchor.getMonth() + 1}월`;
    bodyEl.innerHTML = calendarMonthHtml(calendarState.anchor, byDate);
  } else if (calendarState.view === 'week') {
    const days = calendarWeekDays(calendarState.anchor);
    titleEl.textContent = `${calendarFormatDate(days[0])} ~ ${calendarFormatDate(days[6])}`;
    bodyEl.innerHTML = calendarWeekHtml(days, byDate);
  } else {
    titleEl.textContent = calendarFormatDate(calendarState.anchor);
    bodyEl.innerHTML = calendarDayHtml(calendarState.anchor, byDate);
  }
  wireCalendarEventClicks(bodyEl);
  wireCalendarMonthCellTaps(bodyEl);
}

// wireCalendarMonthCellTaps — 모바일 월간 뷰에서만(data-date-key가 있는
// 셀만) 셀 전체를 탭 대상으로 삼는다. 그 날짜로 앵커를 옮기고 일간 뷰로
// 전환해 이벤트 목록을 텍스트로 펼친다 — 이미 검증된 일간 뷰 렌더링을
// 그대로 재사용하는 쪽이 별도 바텀시트 컴포넌트를 새로 만드는 것보다
// 안전하다.
function wireCalendarMonthCellTaps(bodyEl) {
  bodyEl.querySelectorAll('.calendar-month-cell[data-date-key]').forEach(cell => {
    cell.addEventListener('click', () => {
      const [y, m, d] = cell.dataset.dateKey.split('-').map(Number);
      calendarState.anchor = new Date(y, m - 1, d);
      calendarState.view = 'day';
      renderCalendarShell(document.getElementById('calendar-root'));
    });
  });
}

function calendarEventDotsHtml(dayEvents) {
  const maxDots = 4;
  const shown = dayEvents.slice(0, maxDots);
  const overflow = dayEvents.length - shown.length;
  return `
    <div class="calendar-month-cell-dots">
      ${shown.map(e => `<span class="calendar-dot calendar-dot--${CALENDAR_KIND_TONES[e.kind] || ''}"></span>`).join('')}
      ${overflow > 0 ? `<span class="calendar-month-cell-more">+${overflow}</span>` : ''}
    </div>
  `;
}

function calendarMonthHtml(anchor, byDate) {
  const year = anchor.getFullYear();
  const month = anchor.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const gridStart = new Date(year, month, 1 - firstOfMonth.getDay());
  const todayKey = calendarDateKey(new Date());
  // 좁은 화면에서는 텍스트 칩이 다 잘려서 무의미해지므로(실사용 중
  // 발견) 점으로 바꾸고, 대신 셀 탭으로 일간 뷰를 열어 텍스트를 보여준다
  // — 데스크톱은 공간이 충분해 기존 텍스트 칩을 그대로 유지한다.
  const isMobile = window.matchMedia(CALENDAR_MOBILE_QUERY).matches;

  const cells = Array.from({ length: 42 }, (_, i) => {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    const key = calendarDateKey(d);
    const dayEvents = byDate[key] || [];
    const classes = ['calendar-month-cell'];
    if (d.getMonth() !== month) classes.push('is-outside');
    if (key === todayKey) classes.push('is-today');
    const eventsHtml = isMobile ? calendarEventDotsHtml(dayEvents) : dayEvents.map(calendarEventChipHtml).join('');
    return `
      <div class="${classes.join(' ')}" ${isMobile ? `data-date-key="${key}"` : ''}>
        <div class="calendar-month-cell-date">${d.getDate()}</div>
        <div class="calendar-month-cell-events">${eventsHtml}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="calendar-month-grid">
      ${CALENDAR_WEEKDAY_LABELS.map(w => `<div class="calendar-month-headcell">${w}</div>`).join('')}
      ${cells}
    </div>
  `;
}

function calendarWeekHtml(days, byDate) {
  const todayKey = calendarDateKey(new Date());
  return `
    <div class="calendar-week-grid">
      ${days.map(d => {
        const key = calendarDateKey(d);
        const dayEvents = byDate[key] || [];
        return `
          <div class="calendar-week-col${key === todayKey ? ' is-today' : ''}">
            <div class="calendar-week-col-head">${CALENDAR_WEEKDAY_LABELS[d.getDay()]} <span class="calendar-week-col-date">${d.getDate()}</span></div>
            <div class="calendar-week-col-events">${dayEvents.length ? dayEvents.map(calendarEventChipHtml).join('') : '<p class="calendar-empty-hint">일정 없음</p>'}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function calendarDayHtml(anchor, byDate) {
  const dayEvents = byDate[calendarDateKey(anchor)] || [];
  if (!dayEvents.length) {
    return '<p class="empty">이 날은 일정이 없습니다.</p>';
  }
  return `<div class="calendar-day-list">${dayEvents.map(e => {
    const tone = CALENDAR_KIND_TONES[e.kind];
    const iconCls = tone === 'blue' ? '' : ` row-card-icon--${tone}`;
    return `
    <div class="row-card calendar-event calendar-event--row" data-entry-id="${escapeAttr(e.pipelineEntryId)}">
      <span class="row-card-icon${iconCls}">${SIDEBAR_ICONS.calendar}</span>
      <div class="row-card-main">
        <div class="row-card-title">${escapeHtml(e.noticeTitle)}</div>
        <div class="row-card-subtitle">${escapeHtml(CALENDAR_KIND_LABELS[e.kind] || e.kind)}${e.allDay ? '' : ' · ' + formatDateTime(e.start).slice(11)}</div>
      </div>
      <span class="row-card-arrow">›</span>
    </div>
  `;
  }).join('')}</div>`;
}

// ---------- AI 분석 사용내역 (#/ai-usage) ----------
// 대시보드 "AI 분석 N/M건" 카드 클릭 시 이동. company_documents가 곧
// 사용 로그다(billing_ai_usage.go 주석 참고 — 별도 로그 테이블 없음).
// AI_USAGE_RETRY_CONFIRM_FORMS — documentKind별로 재시도 성공 시 바로
// 이어서 보여줄 확인/저장 폼. 함수 선언은 호이스팅되므로 이 맵이 그
// 함수들보다 텍스트상 앞에 있어도 문제없다. employee_verification의
// renderEmployeeCountConfirmForm은 4번째 인자로 "프로필 폼" DOM을 받아
// employeeCount 입력값도 같이 갱신하는데, 이 화면(#/ai-usage)에는 그
// 폼이 없으므로 null을 넘긴다(위 함수가 null-safe하게 처리하도록 이미
// 고쳐둠).
const AI_USAGE_RETRY_CONFIRM_FORMS = {
  license_or_certification: (slot, candidate, documentId, onSaved) => renderLicenseConfirmForm(slot, candidate, documentId, onSaved),
  financial: (slot, candidate, documentId, onSaved) => renderFinancialForm(slot, candidate, documentId, onSaved),
  track_record: (slot, candidate, documentId, onSaved) => renderTrackRecordForm(slot, candidate, documentId, onSaved),
  personnel: (slot, candidate, documentId, onSaved) => renderPersonnelForm(slot, candidate, documentId, onSaved),
  intellectual_property: (slot, candidate, documentId, onSaved) => renderIPConfirmForm(slot, candidate, documentId, onSaved),
  employee_verification: (slot, candidate, documentId, onSaved) => renderEmployeeCountConfirmForm(slot, candidate, documentId, null),
};

function aiUsageStatusBadgeHtml(status) {
  if (status === 'success') return '<span class="badge badge--success">성공</span>';
  if (status === 'failed') return '<span class="badge badge--danger">실패</span>';
  return '<span class="badge badge--gray">처리중</span>';
}

async function renderAIUsage(container) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/me/ai-usage');
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  const items = data.items || [];
  const limitLabel = data.limit < 0 ? '무제한' : `${data.usedCount}/${data.limit}건`;
  const rowsHtml = items.length
    ? items.map(it => `
        <div class="license-card">
          <div class="license-card-main">
            <div class="license-card-name">${escapeHtml(it.documentKindName)} ${aiUsageStatusBadgeHtml(it.extractionStatus)}</div>
            <div class="license-card-meta">${escapeHtml(it.originalFilename)} · ${escapeHtml(formatDateTime(it.uploadedAt))}</div>
            ${it.extractionStatus === 'failed' && it.failureReason ? `<div class="license-card-meta ai-usage-failure-reason">${escapeHtml(it.failureReason)}</div>` : ''}
            <div id="ai-usage-retry-slot-${escapeAttr(it.id)}"></div>
          </div>
          ${it.canRetry ? `<div class="license-card-side"><button type="button" class="btn btn-secondary btn-sm ai-usage-retry-btn" data-id="${escapeAttr(it.id)}">재시도</button></div>` : ''}
        </div>
      `).join('')
    : '<p class="empty">이번달 분석한 서류가 없습니다.</p>';

  container.innerHTML = '';
  container.appendChild(h(`
    <h2>AI 분석 사용내역</h2>
    <p class="license-card-meta">${glossaryHtml('AI 분석')} 이번달 사용량: ${escapeHtml(limitLabel)}</p>
    <p class="license-card-meta">실패한 항목은 한도가 차감되지 않습니다 — 성공적으로 분석된 건만 이번달 사용량에 잡힙니다. "재시도"를 누르면 다시 분석하며, 이때도 성공해야만 사용량에 반영됩니다. 단, 같은 파일로 짧은 시간 안에 반복 실패하면 비용 남용 방지를 위해 그 파일의 재시도가 잠시 제한될 수 있습니다.</p>
    <div class="license-list">${rowsHtml}</div>
  `));

  container.querySelectorAll('.ai-usage-retry-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const it = items.find(x => x.id === id);
      const retrySlot = document.getElementById(`ai-usage-retry-slot-${id}`);
      // 한 번에 하나의 재시도/확인 폼만 열리게 — 다른 행에서 열려있던
      // 폼(license-confirm-form 등 고정 id를 쓰는 컴포넌트라 동시에 두 개가
      // 떠 있으면 id 충돌 위험)을 먼저 정리한다.
      container.querySelectorAll('[id^="ai-usage-retry-slot-"]').forEach(el => { el.innerHTML = ''; });
      btn.disabled = true;
      retrySlot.innerHTML = '';
      retrySlot.appendChild(h('<div class="loading">재분석 중...</div>'));
      let result;
      try {
        result = await apiRequest('POST', `/api/me/documents/${encodeURIComponent(id)}/retry`);
      } catch (err) {
        if (err.code === 'file_retry_blocked') {
          // 이 경우는 시도 자체가 안 됐다(새 company_documents 행이 안 생김)
          // — 목록을 새로고침해도 아무 변화가 안 보이므로, 왜 막혔는지
          // 여기 바로 보여줘야 한다.
          retrySlot.innerHTML = '';
          retrySlot.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
          btn.disabled = false;
          return;
        }
        // 재시도가 다시 실패한 경우(extraction_failed) — 새 시도 자체가 새
        // 이력이라 목록을 새로 불러오면 이 실패도 별도 행으로 나타난다
        // (원래 실패했던 행은 그대로 남아있고, 그 옆에 새로운 실패 행이
        // 하나 더 생기는 식).
        renderAIUsage(container);
        return;
      }
      const renderConfirm = AI_USAGE_RETRY_CONFIRM_FORMS[it.documentKind];
      if (renderConfirm) {
        renderConfirm(retrySlot, result.candidate, result.documentId, () => renderAIUsage(container));
      } else {
        renderAIUsage(container);
      }
    });
  });
}

async function renderPipelineDetail(container, id) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/pipeline/' + encodeURIComponent(id));
  } catch (err) {
    if (err.status === 401) { location.hash = '#/auth/login'; return; }
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  const entry = data.entry;
  const checklist = data.checklist || [];

  container.innerHTML = '';
  container.appendChild(h(`
    <a href="#/pipeline" class="back-link">&larr; 진행 중 사업 목록으로</a>
    <div class="detail-card">
      <p class="detail-eyebrow">${escapeHtml(entry.organizationName || '-')}</p>
      <h2><a href="#/notices/${escapeAttr(entry.noticeId)}">${escapeHtml(entry.noticeTitle)}</a></h2>
      <div class="pipeline-step-summary">${pipelineStepIndicatorHtml(entry.status)}</div>
      <a class="calendar-add-link" href="/api/pipeline/${escapeAttr(entry.id)}/calendar.ics" download>&#128197; 캘린더에 추가 (.ics)</a>
      <form id="pipeline-entry-form" class="profile-form">
        <label>상태${pipelineStatusSelectHtml(entry.status)}</label>
        <label>낙찰 금액(원)<input type="text" inputmode="numeric" name="awardedAmount" value="${escapeAttr(formatCurrency(entry.awardedAmount))}" placeholder="낙찰된 경우 실제 계약금액을 입력해주세요 (성장분석 ROI에 반영됩니다)"></label>
        <label>담당자<input type="text" name="assigneeName" value="${escapeAttr(entry.assigneeName || '')}" placeholder="담당자 이름"></label>
        <label>담당자 이메일<input type="email" name="assigneeEmail" value="${escapeAttr(entry.assigneeEmail || '')}" placeholder="상태 변경 시 이 주소로 알림이 발송됩니다"></label>
        <label>담당자 전화번호<input type="tel" name="assigneePhone" value="${escapeAttr(entry.assigneePhone || '')}" placeholder="상태 변경 시 이 번호로 SMS가 발송됩니다"></label>
        <div>
          <button type="button" id="load-contact-btn" class="btn btn-secondary btn-sm">담당자 목록에서 불러오기</button>
          <div id="load-contact-picker"></div>
        </div>
        <div id="pipeline-no-contact-hint"></div>
        <label>메모<textarea name="memo" rows="3">${escapeHtml(entry.memo || '')}</textarea></label>
        <p class="license-card-meta">제출 마감: ${entry.submissionDeadline ? escapeHtml(entry.submissionDeadline) : '확인 안 됨'}</p>
        <div id="pipeline-entry-error" class="error" style="display:none"></div>
        <div id="pipeline-entry-success" class="success" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-block">저장</button>
      </form>
    </div>
    <h3>제출서류 체크리스트</h3>
    <div id="pipeline-checklist-section"></div>
  `));

  // 담당자가 아직 비어 있고, 등록된 담당자도 하나도 없으면 "미리
  // 등록해두면 편리합니다" 안내 — 매번 두 번째 API 호출을 하긴 하지만
  // 담당자 자체가 비어 있는 경우에만(대부분 이미 채워져 있음) 호출된다.
  if (!entry.assigneeName) {
    apiRequest('GET', '/api/me/contacts').then(data => {
      if ((data.items || []).length === 0) {
        const hintEl = document.getElementById('pipeline-no-contact-hint');
        if (hintEl) {
          hintEl.innerHTML = `<p class="auth-step-hint"><a href="#/me/profile">담당자 관리</a>에서 미리 등록해두면 다음부터 자동으로 채워집니다.</p>`;
        }
      }
    }).catch(() => {});
  }

  wireLoadContactButton(container);

  const form = document.getElementById('pipeline-entry-form');
  attachCurrencyAutoFormat(form.awardedAmount);
  attachPhoneAutoFormat(form.assigneePhone);
  const errorBox = document.getElementById('pipeline-entry-error');
  const successBox = document.getElementById('pipeline-entry-success');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    successBox.style.display = 'none';
    const fd = new FormData(form);
    const awardedAmountCleaned = parseCurrencyInput(fd.get('awardedAmount'));
    const payload = {
      status: fd.get('status'),
      awardedAmount: awardedAmountCleaned === null ? null : Number(awardedAmountCleaned),
      assigneeName: fd.get('assigneeName') || '',
      assigneeEmail: fd.get('assigneeEmail') || '',
      assigneePhone: fd.get('assigneePhone') || '',
      memo: fd.get('memo') || '',
    };
    try {
      await apiRequest('PATCH', '/api/pipeline/' + encodeURIComponent(id), payload);
      successBox.textContent = '저장되었습니다.';
      successBox.style.display = 'block';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });

  renderPipelineChecklist(document.getElementById('pipeline-checklist-section'), id, checklist);
}

// wireLoadContactButton — "담당자 목록에서 불러오기" 버튼. 클릭 시
// company_contacts 목록을 select로 펼치고, 고르면 그 담당자의 이름/이메일/
// 전화번호로 입력란 3개를 바로 채운다(폼 제출은 별도 — "저장" 버튼을
// 눌러야 실제 반영된다, 실수로 덮어써도 저장 전이면 취소 가능).
function wireLoadContactButton(container) {
  const btn = container.querySelector('#load-contact-btn');
  const picker = container.querySelector('#load-contact-picker');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    if (picker.querySelector('select')) { picker.innerHTML = ''; return; }
    let items = [];
    try {
      const data = await apiRequest('GET', '/api/me/contacts');
      items = data.items || [];
    } catch (err) {
      picker.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
      return;
    }
    if (!items.length) {
      picker.innerHTML = `<p class="auth-step-hint">등록된 담당자가 없습니다. <a href="#/me/profile">담당자 관리</a>에서 먼저 등록하세요.</p>`;
      return;
    }
    picker.innerHTML = `
      <select id="load-contact-select" class="select-input" style="margin-top:0.5rem">
        <option value="">담당자 선택...</option>
        ${items.map(c => `<option value="${escapeAttr(c.id)}">${escapeHtml(c.name)}${c.isDefault ? ' (기본)' : ''}</option>`).join('')}
      </select>
    `;
    picker.querySelector('#load-contact-select').addEventListener('change', (e) => {
      const c = items.find(i => i.id === e.target.value);
      if (!c) return;
      const form = container.querySelector('#pipeline-entry-form');
      form.elements['assigneeName'].value = c.name || '';
      form.elements['assigneeEmail'].value = c.email || '';
      form.elements['assigneePhone'].value = c.phone || '';
      picker.innerHTML = '';
    });
  });
}

// renderPipelineChecklist — 항목별 select 하나로 바로 PATCH(저장 버튼 없음,
// select 자체가 바뀌는 즉시 반영). 실패하면 select를 원래 값으로 되돌린다
// (wireBookmarkButtons와 같은 "실패 시 조용히 원복" 관례).
function renderPipelineChecklist(container, entryId, items) {
  container.innerHTML = '';
  if (!items.length) {
    container.appendChild(h('<p class="empty">체크리스트 항목이 없습니다(공고에 분석된 제출서류가 없거나 아직 분석되지 않았습니다).</p>'));
    return;
  }
  const rows = items.map(it => `
    <div class="checklist-row" data-item-id="${escapeAttr(it.id)}">
      <span class="checklist-doc-name">${escapeHtml(it.documentName)}</span>
      <select class="select-input checklist-status-select">
        ${CHECKLIST_STATUS_LIST.map(s => `<option value="${escapeAttr(s)}" ${s === it.status ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}
      </select>
    </div>
  `).join('');
  container.appendChild(h(`<div class="checklist-list">${rows}</div>`));

  container.querySelectorAll('.checklist-status-select').forEach(sel => {
    const originalValue = sel.value;
    sel.addEventListener('change', async () => {
      const row = sel.closest('.checklist-row');
      const itemId = row.dataset.itemId;
      sel.disabled = true;
      try {
        await apiRequest('PATCH',
          '/api/pipeline/' + encodeURIComponent(entryId) + '/checklist/' + encodeURIComponent(itemId),
          { status: sel.value });
      } catch (err) {
        sel.value = originalValue;
        if (err.status === 401) { location.hash = '#/auth/login'; return; }
      } finally {
        sel.disabled = false;
      }
    });
  });
}

  '충청북도', '충청남도', '전북특별자치도', '전라남도', '경상북도', '경상남도', '제주특별자치도',
];

// noticeListState — #/notices 무한스크롤 상태 캐시(모듈 레벨 변수, 서버/
// sessionStorage 아님). 해시 라우팅 SPA라 상세 화면으로 이동했다가 브라우저
// "뒤로가기"로 돌아와도 페이지 전체가 리로드되지 않고 location.hash만
// 바뀐다 — 그래서 이 변수가 JS 메모리에 그대로 남아있는 것만으로 "지금까지
// 불러온 항목 + 스크롤 위치"를 그대로 복원할 수 있다. key가 현재 검색
// 조건(q/region/industry/sort)과 다르면 새 검색으로 보고 캐시를 버린다.
let noticeListState = null;

function noticeListKey(params) {
  return [params.get('q') || '', params.get('region') || '', params.get('industry') || '', params.get('sort') || ''].join('|');
}

function noticeListApiParams(filterParams) {
  const apiParams = new URLSearchParams();
  if (filterParams.get('q')) apiParams.set('q', filterParams.get('q'));
  if (filterParams.get('region')) apiParams.set('region', filterParams.get('region'));
  if (filterParams.get('industry')) apiParams.set('industry', filterParams.get('industry'));
  if (filterParams.get('sort')) apiParams.set('sort', filterParams.get('sort'));
  return apiParams;
}

function renderList(container) {
  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  const key = noticeListKey(params);
  const currentSort = params.get('sort') || 'new';
  const currentRegion = params.get('region') || '';

  container.innerHTML = '';
  container.appendChild(h(`
    <form class="filters" id="filter-form">
      <input type="text" name="q" placeholder="공고명 검색" value="${params.get('q') || ''}">
      <select name="region" class="select-input">
        <option value="">지역 전체</option>
        ${REGION_OPTIONS.map(r => `<option value="${escapeAttr(r)}" ${r === currentRegion ? 'selected' : ''}>${escapeHtml(r)}</option>`).join('')}
      </select>
      <input type="text" name="industry" placeholder="업종" value="${params.get('industry') || ''}">
      <select name="sort" class="select-input">
        ${NOTICE_SORT_OPTIONS.map(o => `<option value="${o.value}" ${o.value === currentSort ? 'selected' : ''}>${escapeHtml(o.label)}</option>`).join('')}
      </select>
      <button type="submit">검색</button>
    </form>
    <div id="list-body">${skeletonListHtml(6)}</div>
  `));

  const filterForm = document.getElementById('filter-form');
  const submitFilterForm = () => {
    const fd = new FormData(filterForm);
    const p = new URLSearchParams();
    for (const [k, v] of fd.entries()) if (v) p.set(k, v);
    noticeListState = null; // 새 검색/정렬 — 이전 무한스크롤 캐시는 폐기
    location.hash = '#/notices?' + p.toString();
  };
  filterForm.addEventListener('submit', (e) => { e.preventDefault(); submitFilterForm(); });
  // 정렬은 검색 버튼을 따로 안 눌러도 바로 반영 — 목록 순서를 바꾸는
  // 것뿐이라 "검색 조건 확정" 성격의 다른 입력들과 달리 즉시 적용이 자연스럽다.
  filterForm.querySelector('select[name="sort"]').addEventListener('change', submitFilterForm);

  const listBody = document.getElementById('list-body');

  // 캐시 적중 = 같은 검색 조건으로 돌아온 것(전형적으로 상세→뒤로가기).
  // 새로 fetch하지 않고 이미 불러온 항목을 그대로 다시 그린 뒤 저장해둔
  // 스크롤 위치로 복원한다.
  if (noticeListState && noticeListState.key === key) {
    renderNoticeListItems(listBody, noticeListState.items, noticeListState.total);
    wireNoticeListLoadMore(listBody, key);
    const savedScrollY = noticeListState.scrollY || 0;
    requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, savedScrollY)));
    return;
  }

  noticeListState = { key, items: [], offset: 0, limit: 20, total: 0, hasMore: true, loading: false, scrollY: 0 };
  loadMoreNotices(listBody, key, params, true);
}

// loadMoreNotices fetches the next page(offset=noticeListState.offset)and
// appends to the cached item list. isFirstPage만 실패 시 전체 에러 화면으로
// 바꾸고, 이후 페이지 실패는 sentinel에 에러 문구만 남겨 이미 불러온 목록은
// 그대로 유지한다.
async function loadMoreNotices(listBody, key, filterParams, isFirstPage) {
  if (!noticeListState || noticeListState.key !== key || noticeListState.loading || !noticeListState.hasMore) return;
  noticeListState.loading = true;

  const apiParams = noticeListApiParams(filterParams);
  apiParams.set('offset', String(noticeListState.offset));
  apiParams.set('limit', String(noticeListState.limit));

  try {
    const data = await fetchJSON('/api/notices?' + apiParams.toString());
    if (!noticeListState || noticeListState.key !== key) return; // 그 사이 다른 검색으로 전환됨 — 결과 버림
    noticeListState.items = noticeListState.items.concat(data.items || []);
    noticeListState.offset = noticeListState.offset + (data.items ? data.items.length : 0);
    noticeListState.total = data.total || 0;
    noticeListState.hasMore = !!data.hasMore;
    noticeListState.loading = false;
    renderNoticeListItems(listBody, noticeListState.items, noticeListState.total);
    wireNoticeListLoadMore(listBody, key);
  } catch (err) {
    if (noticeListState) noticeListState.loading = false;
    if (isFirstPage) {
      listBody.className = 'error';
      listBody.innerHTML = '';
      listBody.textContent = err.message;
    } else {
      const sentinel = listBody.querySelector('#notice-list-sentinel');
      if (sentinel) sentinel.textContent = '더 불러오지 못했습니다: ' + err.message;
    }
  }
}

// noticeRowHtml — 검색 결과 전체 화면과 관심공고(#/me/bookmarks)가 같은
// 행 카드 마크업을 쓰므로 공유한다.
function noticeRowHtml(n) {
  return `
    <div class="row-card notice-row" data-id="${escapeAttr(n.id)}">
      <div class="row-card-main">
        <div class="row-card-title">${escapeHtml(n.title)}</div>
        <div class="row-card-subtitle">
          ${noticeTypeBadgeHtml(n.noticeType)} ${escapeHtml(n.organizationName || '-')} · ${escapeHtml(n.region || '-')} · ${escapeHtml(n.industry || '-')} ·
          <span class="mono">${formatBudget(n.budgetAmount)}</span> · ${statusBadgeHtml(n.status)}
        </div>
      </div>
      <div class="row-card-side">
        ${bookmarkButtonHtml(n.id, n.isBookmarked)}
        ${ddayBadgeHtml(n.applicationEndAt)}
        <span class="row-card-arrow">›</span>
      </div>
    </div>
  `;
}

// renderNoticeListItems — 상단에 "지금까지 몇 건 로드됐는지"를 보여주는
// 카운터 한 줄(#notice-list-counter) + 목록. 무한스크롤로 새 페이지를
// 불러올 때마다(loadMoreNotices) 이 함수가 통째로 다시 그리면서 카운터도
// 같이 갱신된다.
// NOTICE_LIST_BATCH_SIZE — loadMoreNotices가 한 번에 불러오는 페이지
// 크기(20건)와 반드시 같은 값. 무한스크롤 중 "20건 표시 중" 구분 표기를
// 몇 건마다 끼워 넣을지 여기서 결정한다.
const NOTICE_LIST_BATCH_SIZE = 20;

// noticeListCounterText — "N건 / 전체 M건 표시 중" 문구. 목록 맨 위 고정
// 카운터와, 20건 묶음마다 목록 중간에 끼는 구분 표기가 이 함수를 공유한다.
function noticeListCounterText(count, total) {
  return total > count
    ? `${count.toLocaleString()}건 / 전체 ${total.toLocaleString()}건 표시 중`
    : `${count.toLocaleString()}건 표시 중`;
}

function renderNoticeListItems(listBody, items, total) {
  if (!items.length) {
    listBody.className = 'empty';
    listBody.innerHTML = '';
    listBody.textContent = '조건에 맞는 공고가 없습니다.';
    return;
  }
  // 20건 묶음이 끝날 때마다(NOTICE_LIST_BATCH_SIZE 단위) 그 시점까지의
  // 누적 건수를 목록 중간에 구분 표기로 끼워 넣는다 — 스크롤이 길어져도
  // "지금까지 몇 건 봤는지"를 계속 확인할 수 있게.
  const rows = items.map((item, idx) => {
    const shown = idx + 1;
    const row = noticeRowHtml(item);
    if (shown % NOTICE_LIST_BATCH_SIZE === 0) {
      return row + `<p class="notice-list-batch-divider">${escapeHtml(noticeListCounterText(shown, total))}</p>`;
    }
    return row;
  }).join('');
  listBody.className = '';
  listBody.innerHTML = '';
  listBody.appendChild(h(`
    <p class="notice-list-counter">${escapeHtml(noticeListCounterText(items.length, total))}</p>
    <div class="notice-list">${rows}</div>
    <p id="notice-list-sentinel" class="notice-list-sentinel"></p>
  `));
  listBody.querySelectorAll('.notice-row').forEach(row => {
    row.addEventListener('click', () => {
      // 상세로 이동하기 직전 스크롤 위치를 저장 — "뒤로가기" 시 이 값으로 복원.
      if (noticeListState) noticeListState.scrollY = window.scrollY;
      location.hash = '#/notices/' + row.dataset.id;
    });
  });
  wireBookmarkButtons(listBody);
}

// wireNoticeListLoadMore — IntersectionObserver로 목록 끝의 sentinel이
// 화면에 걸리면(rootMargin만큼 미리) 자동으로 다음 페이지를 불러온다.
// renderNoticeListItems가 매번 sentinel을 새로 만들기 때문에, 이 함수도
// 호출될 때마다 새 Observer를 그 새 sentinel에 건다(이전 Observer는 옛
// sentinel이 DOM에서 떨어져 나가면서 자연히 무의미해짐).
function wireNoticeListLoadMore(listBody, key) {
  const sentinel = listBody.querySelector('#notice-list-sentinel');
  if (!sentinel || !noticeListState) return;
  if (!noticeListState.hasMore) {
    sentinel.textContent = noticeListState.items.length ? '모든 공고를 불러왔습니다.' : '';
    return;
  }
  sentinel.textContent = '불러오는 중...';
  const filterParams = new URLSearchParams(location.hash.split('?')[1] || '');
  const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) {
      observer.disconnect();
      loadMoreNotices(listBody, key, filterParams, false);
    }
  }, { rootMargin: '400px' });
  observer.observe(sentinel);
}

            <div><dt>마감일</dt><dd>${ddayBadgeHtml(n.applicationEndAt, 'dday-badge--inline')}<span class="mono">${formatDate(n.applicationEndAt)}</span></dd></div>
            <div><dt>예산</dt><dd class="mono">${formatBudget(n.budgetAmount)}</dd></div>

// renderPipelineReviewAction — 원클릭 참여검토(Phase 1)의 공고 상세 상단
// 액션 3종: "참여 검토 시작" / "제외" / "담당자에게 전달". 서버가 미리
// 알려주는 existingPipelineEntryId로 재방문 시 상태를 바로 인지한다(이미
// 파이프라인에 있으면 버튼 대신 "진행 중 → 이동" 링크).
function renderPipelineReviewAction(container, noticeId, existingPipelineEntryId) {
  container.innerHTML = '';
  if (!currentUser) return;

  if (existingPipelineEntryId) {
    renderAlreadyInPipeline(container, noticeId, existingPipelineEntryId);
    return;
  }
  renderPipelineReviewButtons(container, noticeId);
}

function renderAlreadyInPipeline(container, noticeId, entryId) {
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="notice-action-bar">
      <a href="#/pipeline/${escapeAttr(entryId)}" class="pipeline-review-btn" style="text-decoration:none;display:inline-block">진행 중 &middot; 워크스페이스로 이동 &rarr;</a>
      <button type="button" id="share-notice-btn" class="btn btn-secondary btn-sm">담당자에게 전달</button>
    </div>
    <div id="share-notice-form-slot"></div>
  `));
  wireShareNoticeButton(container, noticeId);
}

function renderPipelineReviewButtons(container, noticeId) {
  container.innerHTML = '';
  container.appendChild(h(`
    <div class="notice-action-bar">
      <button type="button" id="pipeline-review-btn" class="pipeline-review-btn">참여 검토 시작</button>
      <button type="button" id="exclude-notice-btn" class="btn btn-secondary btn-sm">제외</button>
      <button type="button" id="share-notice-btn" class="btn btn-secondary btn-sm">담당자에게 전달</button>
    </div>
    <p id="pipeline-review-error" class="error" style="display:none"></p>
    <div id="exclude-notice-result"></div>
    <div id="share-notice-form-slot"></div>
  `));

  document.getElementById('pipeline-review-btn').addEventListener('click', async () => {
    const btn = document.getElementById('pipeline-review-btn');
    const errEl = document.getElementById('pipeline-review-error');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = '시작하는 중...';
    try {
      const entry = await apiRequest('POST', '/api/notices/' + encodeURIComponent(noticeId) + '/pipeline', {});
      // 완료 기준: 자동으로 진행 화면(워크스페이스)까지 이동한다 —
      // 링크를 보여주고 한 번 더 클릭하게 하지 않는다.
      location.hash = '#/pipeline/' + entry.id;
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '참여 검토 시작';
      if (err.status === 401) { location.hash = '#/auth/login'; return; }
      if (err.status === 400 && err.code === 'company_profile_required') {
        errEl.innerHTML = '회사 정보를 등록하면 참여 검토를 시작할 수 있습니다. <a href="#/me/profile">기업 프로필 등록하기 →</a>';
      } else {
        errEl.textContent = err.message;
      }
      errEl.style.display = 'block';
    }
  });

  wireExcludeNoticeButton(container, noticeId);
  wireShareNoticeButton(container, noticeId);
}

// wireExcludeNoticeButton — "제외" 클릭 시 바로 실행(확인창 없음 — 원복
// 가능하니 별도 확인 절차로 흐름을 끊지 않는다). 실행 후 되돌리기 버튼을
// 보여주고, 되돌리기는 기존 PATCH /api/pipeline/{id}(status='검토전')를
// 그대로 재사용한다(오류 시 원복 가능 요건).
function wireExcludeNoticeButton(container, noticeId) {
  const btn = container.querySelector('#exclude-notice-btn');
  const resultEl = container.querySelector('#exclude-notice-result');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      const res = await apiRequest('POST', '/api/notices/' + encodeURIComponent(noticeId) + '/exclude', {});
      if (res.alreadyExists) {
        resultEl.innerHTML = `<p class="auth-step-hint">이미 파이프라인에 있는 공고입니다. <a href="#/pipeline/${escapeAttr(res.id)}">진행 화면으로 이동 &rarr;</a></p>`;
        return;
      }
      container.querySelector('.notice-action-bar').style.display = 'none';
      resultEl.innerHTML = `<p class="auth-step-hint">이 공고를 제외했습니다. <button type="button" id="undo-exclude-btn" class="link-btn">되돌리기</button></p>`;
      resultEl.querySelector('#undo-exclude-btn').addEventListener('click', async () => {
        try {
          await apiRequest('PATCH', '/api/pipeline/' + encodeURIComponent(res.id), { status: '검토전' });
          renderPipelineReviewButtons(container, noticeId);
        } catch (err) {
          resultEl.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
        }
      });
    } catch (err) {
      btn.disabled = false;
      if (err.status === 401) { location.hash = '#/auth/login'; return; }
      resultEl.innerHTML = `<p class="error">${escapeHtml(err.status === 400 && err.code === 'company_profile_required'
        ? '회사 정보를 등록하면 제외 처리를 할 수 있습니다.' : err.message)}</p>`;
    }
  });
}

// wireShareNoticeButton — "담당자에게 전달" 클릭 시 이메일 입력 폼을
// 펼친다(별도 화면 이동 없이 그 자리에서). 등록된 담당자가 있으면
// datalist로 추천해 매번 새로 입력하지 않게 한다.
function wireShareNoticeButton(container, noticeId) {
  const btn = container.querySelector('#share-notice-btn');
  const slot = container.querySelector('#share-notice-form-slot');
  btn.addEventListener('click', async () => {
    if (slot.querySelector('form')) { slot.innerHTML = ''; return; }
    let contactOptions = '';
    try {
      const data = await apiRequest('GET', '/api/me/contacts');
      contactOptions = (data.items || []).filter(c => c.email).map(c => `<option value="${escapeAttr(c.email)}">`).join('');
    } catch (err) { /* 담당자 목록은 편의용 — 실패해도 직접 입력은 가능하므로 조용히 무시 */ }

    slot.innerHTML = `
      <form id="share-notice-form" class="profile-form" style="flex-direction:row;flex-wrap:wrap;gap:0.5rem;align-items:flex-end;margin-top:0.75rem">
        <label style="flex:1;min-width:220px">전달받을 이메일
          <input type="email" name="email" list="share-contact-emails" placeholder="example@company.com" required>
          <datalist id="share-contact-emails">${contactOptions}</datalist>
        </label>
        <button type="submit" class="btn btn-primary btn-sm">보내기</button>
      </form>
      <div id="share-notice-result"></div>
    `;
    const form = slot.querySelector('#share-notice-form');
    const resultEl = slot.querySelector('#share-notice-result');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      resultEl.innerHTML = '';
      try {
        await apiRequest('POST', '/api/notices/' + encodeURIComponent(noticeId) + '/share', {
          email: new FormData(form).get('email'),
        });
        resultEl.innerHTML = '<p class="success">전달했습니다.</p>';
        form.reset();
      } catch (err) {
        resultEl.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
      }
      submitBtn.disabled = false;
    });
  });
}

// renderNoticeReport — 등급/AI 요약/자격조건처럼 이미 계산·저장되어 있는
// 데이터를 인쇄용 한 페이지로 조합한 "참여판단 보고서". 새로 계산하는
// 값은 없다 — GET /api/notices/{id}가 이미 내려주는 것을 재구성만 한다.
// PDF 파일 자체는 서버가 만들지 않고 브라우저 인쇄 대화상자의 "PDF로
// 저장"을 이용한다(@media print로 사이드바/탭바/버튼만 숨김) — 새 Go
// 의존성이나 한글 폰트 임베딩 없이 화면과 동일한 결과물을 얻기 위함.
async function renderNoticeReport(container, id) {
  container.innerHTML = '';
  container.appendChild(h('<div class="loading">불러오는 중...</div>'));

  let data;
  try {
    data = await apiRequest('GET', '/api/notices/' + encodeURIComponent(id));
  } catch (err) {
    container.innerHTML = '';
    container.appendChild(h(`<p class="error">${escapeHtml(err.message)}</p>`));
    return;
  }

  const n = data.notice;
  const score = data.participationScore;
  const summary = data.aiSummary;
  const conditions = data.eligibilityConditions || [];

  const gradeSectionHtml = score ? `
    <section class="report-section">
      <h3 class="report-section-title">종합 판정</h3>
      <div class="report-grade-head">
        ${gradeBadgeHtml(score.grade, GRADE_LABELS[score.grade] || score.grade)}
        <span class="report-grade-score">${score.totalCount}개 중 ${score.metCount}개 충족</span>
      </div>
      ${score.gradeReason ? `<p class="report-grade-reason">${escapeHtml(score.gradeReason)}</p>` : ''}
      <table class="report-table">
        <thead><tr><th>항목</th><th>결과</th><th>사유</th></tr></thead>
        <tbody>
          ${score.categories.map(c => `
            <tr>
              <td>${escapeHtml(c.category)}</td>
              <td>${escapeHtml(ELIGIBILITY_RESULT_LABELS[c.result] || c.result)}</td>
              <td>${escapeHtml(c.reason)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </section>
  ` : `
    <section class="report-section">
      <h3 class="report-section-title">종합 판정</h3>
      <p class="section-empty">로그인 후 회사 프로필을 등록하면 이 공고에 대한 등급 분석이 포함됩니다.</p>
    </section>
  `;

  const summaryHtml = (summary && summary.lines && summary.lines.length) ? `
    <section class="report-section">
      <h3 class="report-section-title">핵심 요약</h3>
      <ul class="report-summary-list">${summary.lines.map(l => `<li>${escapeHtml(l)}</li>`).join('')}</ul>
      <p class="report-meta-caption">AI 요약 · ${escapeHtml(summary.model || '')} · ${formatDateTime(summary.generatedAt)}</p>
    </section>
  ` : `
    <section class="report-section">
      <h3 class="report-section-title">핵심 요약</h3>
      <p class="section-empty">아직 요약이 생성되지 않았습니다.</p>
    </section>
  `;

  const conditionsHtml = conditions.length ? `
    <section class="report-section">
      <h3 class="report-section-title">참가자격 요건 (문서 기반)</h3>
      <ul class="report-condition-list">
        ${conditions.map(it => `
          <li class="report-condition-item">
            <p class="report-condition-name"><strong>${escapeHtml(CONDITION_CATEGORY_LABELS[it.category] || it.category)}</strong> — ${escapeHtml(it.conditionName)}</p>
            <blockquote class="source-quote">${escapeHtml(it.sourceText)}</blockquote>
          </li>
        `).join('')}
      </ul>
    </section>
  ` : `
    <section class="report-section">
      <h3 class="report-section-title">참가자격 요건 (문서 기반)</h3>
      <p class="section-empty">문서에서 추출된 참가자격 요건이 없습니다.</p>
    </section>
  `;

  container.innerHTML = '';
  container.appendChild(h(`
    <div class="no-print report-actions">
      <a href="#/notices/${escapeAttr(id)}" class="back-link">&larr; 공고 상세로 돌아가기</a>
      <button type="button" class="btn btn-primary" id="report-print-btn">인쇄 / PDF로 저장</button>
    </div>
    <div class="report-page">
      <p class="report-doc-title">참여판단 보고서</p>
      <h2 class="report-notice-title">${escapeHtml(n.title)}</h2>
      <dl class="detail-meta">
        <div><dt>발주기관</dt><dd>${escapeHtml(n.organizationName || '-')}</dd></div>
        <div><dt>지역</dt><dd>${escapeHtml(n.region || '-')}</dd></div>
        <div><dt>업종</dt><dd>${escapeHtml(n.industry || '-')}</dd></div>
        <div><dt>예산</dt><dd class="mono">${formatBudget(n.budgetAmount)}</dd></div>
        <div><dt>마감일</dt><dd class="mono">${formatDate(n.applicationEndAt)}</dd></div>
      </dl>
      ${gradeSectionHtml}
      ${summaryHtml}
      ${conditionsHtml}
      <p class="report-footer-note">⚠ 이 보고서는 등록된 회사 정보와 공고 정보만으로 계산한 참고용 자료입니다. 최종 참여 여부는 원문 공고를 직접 확인한 후 결정하세요. 생성일시: ${formatDateTime(new Date().toISOString())}</p>
    </div>
  `));

  document.getElementById('report-print-btn').addEventListener('click', () => window.print());

// g2b 원문 JSON(raw_documents.raw_content)에서 그때그때 파싱한 상세 필드.
// 지역제한은 이 데이터 소스(목록조회 API)에 판단기준 텍스트만 있고 구체적인
// 지역명 목록 자체가 없어, 표로 꾸미지 않고 있는 그대로(판단기준 문구 또는
// "확인 불가")를 보여준다 — 없는 데이터를 있는 것처럼 표로 만들지 않는다.
function renderNoticeDetailInfo(container, detail) {
  container.innerHTML = '';
  if (!detail) {
    container.appendChild(h('<p class="section-empty">원문 상세 데이터를 확인할 수 없습니다.</p>'));
    return;
  }
  const rows = [];
  if (detail.noticeKind) rows.push(['공고종류', escapeHtml(detail.noticeKind)]);
  if (detail.contractMethod) rows.push(['계약방법', escapeHtml(detail.contractMethod)]);
  if (detail.awardMethod) {
    let v = escapeHtml(detail.awardMethod);
    if (detail.awardMethodDetail) v += `<span class="detail-sub">${escapeHtml(detail.awardMethodDetail)}</span>`;
    rows.push(['낙찰방법', v]);
  }
  if (detail.awardLowerLimitRate) rows.push(['낙찰하한율', `<span class="mono">${escapeHtml(detail.awardLowerLimitRate)}%</span>`]);
  if (detail.rebidAllowed !== null && detail.rebidAllowed !== undefined) {
    rows.push(['재입찰 허용', detail.rebidAllowed ? '허용' : '불허']);
  }
  if (detail.estimatedPrice != null) rows.push(['추정가격', `<span class="mono">${formatBudget(detail.estimatedPrice)}</span>`]);
  if (detail.vat != null) rows.push(['부가가치세', `<span class="mono">${formatBudget(detail.vat)}</span>`]);
  if (detail.officerName) {
    let v = escapeHtml(detail.officerName);
    if (detail.officerPhone) v += ` <span class="mono">${escapeHtml(detail.officerPhone)}</span>`;
    rows.push(['담당자', v]);
  }
  if (detail.qualificationDeadlineAt) rows.push(['입찰참가자격등록 마감', `<span class="mono">${formatDateTime(detail.qualificationDeadlineAt)}</span>`]);
  if (detail.applicationStartAt) rows.push(['입찰서 제출 시작', `<span class="mono">${formatDateTime(detail.applicationStartAt)}</span>`]);
  if (detail.applicationEndAt) rows.push(['입찰서 제출 마감', `<span class="mono">${formatDateTime(detail.applicationEndAt)}</span>`]);
  if (detail.bidOpeningAt) rows.push(['개찰일시', `<span class="mono">${formatDateTime(detail.bidOpeningAt)}</span>`]);

  const dl = rows.map(([label, value]) => `<div><dt>${escapeHtml(label)}</dt><dd>${value}</dd></div>`).join('');

  const industryText = detail.industryRestricted === true ? '있음'
    : detail.industryRestricted === false ? '없음' : '정보 없음';
  const regionText = detail.regionRestrictionBasis
    ? `있음 (판단기준: ${escapeHtml(detail.regionRestrictionBasis)})`
    : '이 데이터만으로는 확인 불가 — 원문 공고 확인 필요';

  container.appendChild(h(`
    <dl class="detail-meta">${dl}</dl>
    <div class="restriction-summary">
      <div><span class="restriction-label">업종제한</span><span class="restriction-value">${industryText}</span></div>
      <div><span class="restriction-label">지역제한</span><span class="restriction-value">${regionText}</span></div>
    </div>
  `));
}

function renderAttachments(container, items) {
  container.innerHTML = '';
  if (!items.length) {
    container.appendChild(h('<p class="section-empty">첨부파일이 없습니다.</p>'));
    return;
  }
  const rows = items.map(it => {
    const sizeText = formatFileSize(it.fileSizeBytes);
    const statusBadge = it.downloadStatus !== 'completed'
      ? `<span class="status-badge status-badge--muted">${escapeHtml(it.downloadStatus)}</span>`
      : '';
    const nameHtml = it.downloadUrl
      ? `<a href="${escapeAttr(it.downloadUrl)}" target="_blank" rel="noopener">${escapeHtml(it.originalFilename)}</a>`
      : escapeHtml(it.originalFilename);
    return `
      <li class="attachment-item">
        <span class="attachment-name">${nameHtml}</span>
        <span class="attachment-meta mono">${escapeHtml((it.fileType || '').toUpperCase())} ${sizeText}</span>
        ${statusBadge}
      </li>`;
  }).join('');
  container.appendChild(h(`<ul class="attachment-list">${rows}</ul>`));
}

const CONDITION_CATEGORY_LABELS = { general: '일반' };
const NO_DOCUMENT_LIST_LABEL = '(본문에 목록 없음 - 별첨/타 문서 참조)';

// 규칙 기반(1차)과 AI 보완(2차) 결과를 한 목록에 같이 보여준다 — AI 보완이
// 있다고 규칙 기반 원본(특히 review_required)을 화면에서 지우면 정보를
// 숨기는 셈이라, 대신 배지로 출처를 구분한다.
function extractionMethodBadgeHtml(method) {
  if (method === 'ai') {
    return '<span class="extraction-method-badge extraction-method-badge--ai">AI 보완</span>';
  }
  return '<span class="extraction-method-badge extraction-method-badge--rule">규칙 기반</span>';
}

// 첨부문서 분석이 아직 안 된 공고(신규 수집 공고 대부분)에는 목록 자체가
// 없다는 사실을 숨기지 않고 그대로 보여준다 — 섹션을 숨기면 이 기능이
// 있는지조차 모르게 되므로, 안내 문구로 상태를 알린다.
function renderEligibilityConditions(container, items) {
  container.innerHTML = '';
  if (!items.length) {
    container.appendChild(h('<p class="section-empty">아직 분석되지 않았습니다.</p>'));
    return;
  }
  const rows = items.map(it => `
    <li class="condition-item">
      <div class="condition-head">
        <span class="condition-category">${escapeHtml(CONDITION_CATEGORY_LABELS[it.category] || it.category)}</span>
        ${extractionMethodBadgeHtml(it.extractionMethod)}
        ${it.reviewStatus === 'review_required' ? reviewRequiredWarningHtml() : ''}
      </div>
      <p class="condition-name">${escapeHtml(it.conditionName)}</p>
      <blockquote class="source-quote">${escapeHtml(it.sourceText)}</blockquote>
    </li>
  `).join('');
  container.appendChild(h(`<ul class="condition-list">${rows}</ul>`));
}

// readiness는 handleGetNotice가 함께 내려주는 {total, checked} 집계 — 로그인/
// 프로필 여부와 무관하게 항상 값이 온다(비로그인이면 checked는 전부 false).
// 체크박스 토글은 PUT /api/notices/{id}/documents/{id}/checklist를 호출하고,
// 진행률 숫자는 서버 재조회 없이 로컬에서 +1/-1로 갱신한다(리스트에 포함된
// "본문에 목록 없음" 참조행은 total에는 잡히지만 체크 대상이 아니라 DOM
// 재계산과 어긋날 수 있어, 서버가 준 total을 고정값으로 쓴다).
function renderRequiredDocuments(container, items, noticeId, readiness) {
  container.innerHTML = '';
  if (!items.length) {
    container.appendChild(h('<p class="section-empty">아직 분석되지 않았습니다.</p>'));
    return;
  }

  const hasReadiness = !!readiness && readiness.total > 0;
  let checkedCount = hasReadiness ? readiness.checked : 0;
  const total = hasReadiness ? readiness.total : 0;
  const progressHtml = hasReadiness ? `
    <div class="doc-progress">
      <div class="doc-progress-bar"><div class="doc-progress-fill" id="doc-progress-fill" style="width:${Math.round((checkedCount / total) * 100)}%"></div></div>
      <span class="doc-progress-label" id="doc-progress-label">서류 준비 ${checkedCount}/${total}</span>
    </div>` : '';

  const rows = items.map(it => {
    if (it.documentName === NO_DOCUMENT_LIST_LABEL) {
      return `
        <li class="document-item document-item--reference">
          <div class="document-head">${extractionMethodBadgeHtml(it.extractionMethod)}</div>
          <p class="document-reference-note">☞ 원문 확인 필요 — 본문에 서류 목록이 없어 별첨/타 문서를 참조해야 합니다.</p>
        </li>`;
    }
    return `
      <li class="document-item">
        <div class="document-head">${extractionMethodBadgeHtml(it.extractionMethod)}</div>
        <label class="document-check">
          <input type="checkbox" data-document-id="${escapeAttr(it.id)}" ${it.checked ? 'checked' : ''}>
          <span class="document-name">${escapeHtml(it.documentName)}</span>
        </label>
      </li>`;
  }).join('');

  container.appendChild(h(`${progressHtml}<p class="error doc-checklist-error" style="display:none"></p><ul class="document-list">${rows}</ul>`));

  const errBox = container.querySelector('.doc-checklist-error');
  container.querySelectorAll('input[data-document-id]').forEach(cb => {
    cb.addEventListener('change', async () => {
      const documentId = cb.dataset.documentId;
      const checked = cb.checked;
      cb.disabled = true;
      if (errBox) errBox.style.display = 'none';
      try {
        await apiRequest('PUT', '/api/notices/' + encodeURIComponent(noticeId) + '/documents/' + encodeURIComponent(documentId) + '/checklist', { checked });
        checkedCount += checked ? 1 : -1;
        const fill = document.getElementById('doc-progress-fill');
        const label = document.getElementById('doc-progress-label');
        if (fill) fill.style.width = Math.round((checkedCount / total) * 100) + '%';
        if (label) label.textContent = `서류 준비 ${checkedCount}/${total}`;
      } catch (err) {
        cb.checked = !checked;
        if (err.status === 401) {
          location.hash = '#/auth/login';
        } else if (errBox) {
          errBox.textContent = err.message;
          errBox.style.display = '';
        }
      } finally {
        cb.disabled = false;
      }
    });
  });
}

const PARTICIPATION_BUCKET_LABELS = {
  ready: '참여 추천',
  needs_review: '확인 필요',
  not_recommended: '참여 비추천',
};

// GRADE_LABELS — 5단계 종합판정(participationScore.grade). 기존 3단계
// bucket을 대체하지 않고 보완하는 세분화 등급이다.
const GRADE_LABELS = {
  recommended: '참여 권장',
  conditional: '조건부 참여 가능',
  joint_venture_review: '공동수급 검토',

};
// GRADE_BADGE_TONE — .ai-bucket-badge(크기)와 조합해서 쓰는 공용 배지
// 색상 톤(Phase 1의 .badge--*). ready/needs_review는 예전 3버킷 값도
// 함께 들어올 수 있어 매핑에 남겨둔다.

function gradeBadgeHtml(grade, label) {

// GRADE_TONE_COLOR_VAR — GRADE_BADGE_TONE(배지 톤 클래스)을 도넛차트에
// 쓸 CSS 변수 이름으로 매핑. 등급 배지와 같은 색으로 통일.
const GRADE_TONE_COLOR_VAR = {
  'badge--success': '--success',
  'badge--blue': '--accent-blue',
  'badge--warn': '--warn',
  'badge--danger': '--danger',
  'badge--gray': '--ink-soft',
};

// donutChartHtml — 외부 차트 라이브러리 없이 순수 SVG로 그리는 도넛
// 차트. stroke-dasharray/dashoffset으로 원 둘레를 segment별 비율만큼
// 나눠 그린다(원 하나를 여러 겹 원호로 겹쳐 그리는 표준 기법). segments
// = [{ label, count, colorVar }]. 합계가 0이면 빈 회색 링만 보여준다.
function donutChartHtml(segments) {
  const total = segments.reduce((sum, s) => sum + s.count, 0);
  const size = 160, strokeWidth = 22, r = (size - strokeWidth) / 2, circumference = 2 * Math.PI * r;
  let offset = 0;
  const arcs = total > 0
    ? segments.filter(s => s.count > 0).map(s => {
        const dash = (s.count / total) * circumference;
        const arc = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(${s.colorVar})" stroke-width="${strokeWidth}" stroke-dasharray="${dash.toFixed(2)} ${(circumference - dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>`;
        offset += dash;
        return arc;
      }).join('')
    : `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${strokeWidth}"/>`;
  return `
    <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="등급 분포 도넛차트">
      ${arcs}
      <text x="${size / 2}" y="${size / 2 - 4}" text-anchor="middle" class="donut-chart-total">${total}</text>
      <text x="${size / 2}" y="${size / 2 + 16}" text-anchor="middle" class="donut-chart-total-label">건</text>
    </svg>
  `;
}

// simpleLineChartHtml — 도넛차트와 같은 원칙(외부 라이브러리 없이 순수
// SVG)으로 그리는 다중 시리즈 선그래프. series = [{colorVar, values}],
// labels는 x축(values와 길이 동일). yMax를 안 주면 데이터 최댓값으로
// 자동 스케일(최소 1 — 0 나눗셈 방지). 성장분석(#/growth)의 완성도·
// 파이프라인·AI등급분포 추이 3곳에서 재사용한다.
function simpleLineChartHtml(labels, series, yMax) {
  const width = 560, height = 190;
  const padding = { top: 12, right: 12, bottom: 22, left: 8 };
  const chartW = width - padding.left - padding.right;
  const chartH = height - padding.top - padding.bottom;
  const n = labels.length;
  const maxVal = yMax != null ? yMax : Math.max(1, ...series.flatMap(s => s.values));
  const xStep = n > 1 ? chartW / (n - 1) : 0;
  const xAt = i => padding.left + (n > 1 ? i * xStep : chartW / 2);
  const yAt = v => padding.top + chartH - (Math.min(v, maxVal) / maxVal) * chartH;

  const gridLines = [0, 0.5, 1].map(f => {
    const y = (padding.top + chartH * (1 - f)).toFixed(1);
    return `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
  }).join('');

  const seriesHtml = series.map(s => {
    const points = s.values.map((v, i) => `${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');
    const dots = s.values.map((v, i) => `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(v).toFixed(1)}" r="3" fill="var(${s.colorVar})"/>`).join('');
    return `<polyline points="${points}" fill="none" stroke="var(${s.colorVar})" stroke-width="2"/>${dots}`;
  }).join('');

  // 라벨이 많으면(주간 데이터 누적 시) 다 그리면 겹치므로 최대 6개만
  // 골라서 보여준다(처음/끝은 항상 포함).
  const labelStep = Math.max(1, Math.ceil(n / 6));
  const xLabels = labels.map((l, i) => {
    if (i % labelStep !== 0 && i !== n - 1) return '';
    return `<text x="${xAt(i).toFixed(1)}" y="${height - 4}" text-anchor="middle" class="growth-chart-axis-label">${escapeHtml(l)}</text>`;
  }).join('');

  return `
    <svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" role="img" aria-label="추이 그래프" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      ${seriesHtml}
      ${xLabels}
    </svg>
  `;
}

// "핵심 요약" — analyzer/ai_summarize.py(claude-sonnet-5)가 배치로 미리
// 생성해둔 3줄 요약을 그대로 보여준다(Go/프론트 어느 쪽도 실시간으로 Claude를

// 섹션들과 같은 톤("아직 분석되지 않았습니다")으로 그 상태를 그대로 알린다.
function renderAISummary(container, summary) {

// 공고 상세 첫 화면에 자동으로 뜨는 "AI 참여 분석" — data.participationScore
// (handleGetNotice가 로그인+회사 프로필 기준으로 이미 계산해 응답에 포함)를
// 그대로 렌더링한다. 별도 버튼/클릭 없음 — 예전 "우리 회사 적합성 확인" 버튼은
// 이 섹션으로 통합되어 제거되었다. AI는 "가능/불가능"을 단정하지 않고
// "추천/확인 필요/비추천"으로만 표현한다(최종 결정은 사용자 몫).

  if (!currentUser) {
    container.appendChild(h(`
      <div class="ai-participation-card ai-participation-card--cta">
        <p class="ai-participation-cta-text">로그인하고 회사 정보를 등록하면 AI가 이 공고의 참여 가능성을 분석해 드립니다.</p>
        <a href="#/auth/login" class="home-cta-primary">로그인하고 확인하기</a>
      </div>

    return;
  }
  if (!score) {
    container.appendChild(h(`
      <div class="ai-participation-card ai-participation-card--cta">
        <p class="ai-participation-cta-text">회사 정보를 등록하면 AI가 이 공고의 참여 가능성을 분석해 드립니다.</p>
        <a href="#/me/profile" class="home-cta-primary">회사 정보 등록하기</a>
      </div>

    return;
  }

  const gradeLabel = GRADE_LABELS[score.grade] || score.grade;
  const missing = score.categories.filter(c => c.result !== 'met');
  // dataGapSide === 'notice'는 공고 자체에 데이터가 없는 경우(사용자가 고칠 수
  // 없음 — g2b 수집 데이터의 구조적 한계)라 "자료 부족"이 아니라 "정보 없음"으로
  // 구분해서 보여준다. 'company'는 기업 프로필을 채우면 해결되는 경우다.
  const missingHtml = missing.length
    ? `<ul class="ai-missing-list">${missing.map(c => {
        const isNoticeGap = c.dataGapSide === 'notice';
        const resultLabel = isNoticeGap ? '정보 없음' : eligResultHtml(c.result);
        // 동적 질문 힌트(최소 버전): 회사 쪽 정보 공백(dataGapSide==='company')이라
        // 판정이 애매한 경우에만 "채우면 해결됨" 안내+링크를 붙인다 — 공고 쪽
        // 데이터 공백(notice)은 프로필을 채워도 해결되지 않으므로 보여주지 않는다.
        const hintHtml = c.result === 'insufficient_data' && c.dataGapSide === 'company'
          ? '<p class="elig-hint">이 정보가 있으면 더 정확히 판정됩니다. <a href="#/me/profile">기업 프로필에서 채우기 &rarr;</a></p>'
          : '';
        return `
        <li class="elig-item${isNoticeGap ? ' elig-item--notice-gap' : ''}">
          <div class="elig-head">
            <span class="elig-category">${eligCategoryHtml(c.category)}</span>
            <span class="elig-result elig-result--${escapeHtml(c.result)}">${resultLabel}</span>
          </div>
          <p class="elig-reason">${escapeHtml(c.reason)}</p>
          ${hintHtml}
        </li>`;
      }).join('')}</ul>`
    : '<p class="ai-missing-empty">확인된 조건이 모두 충족되었습니다.</p>';

  // "회사 정보 보완하기"는 기업 프로필을 채우면 실제로 해결되는 경우에만
  // 보여준다 — 공고 쪽 데이터 공백(dataGapSide==='notice')은 프로필을 채워도
  // 해결되지 않으므로 이 링크를 보여주면 잘못된 안내가 된다.
  const nextAction = missing.some(c => c.dataGapSide === 'company')
    ? '<a href="#/me/profile" class="ai-next-action">회사 정보 보완하기 &rarr;</a>'
    : '';

  container.appendChild(h(`
    <div class="ai-participation-card ai-participation-card--${escapeHtml(score.grade)}">
      <div class="ai-participation-head">
        ${gradeBadgeHtml(score.grade, gradeLabel)}
        <span class="ai-participation-score">${score.totalCount}개 중 ${score.metCount}개 충족</span>
      </div>
      ${score.gradeReason ? `<p class="ai-grade-reason">${escapeHtml(score.gradeReason)}</p>` : ''}
      ${isMinimalProfile ? `<p class="ai-minimal-profile-notice">간이 판정입니다 — 정확도를 높이려면 <a href="#/me/profile">프로필을 더 채워주세요</a>.</p>` : ''}
      <p class="ai-participation-subtitle">부족한 조건</p>
      ${missingHtml}
      ${nextAction}
      <p class="ai-disclaimer">⚠ 등록된 회사 정보와 공고 정보만으로 계산한 참고용 분석입니다. 최종 참여 여부는 원문 공고를 직접 확인한 후 결정하세요.</p>
    </div>
  `));
}

  container.appendChild(h(`

// renderSignup — 2단계 온보딩(CTO 평가 TOP10 3번, 3분 이내 가입 목표).
// 1단계: 이메일/비번 -> 계정 생성. 2단계: 지역/업종/기업규모 3개만
// 필수 입력 -> 저장 즉시 홈(추천 리스트)으로 이동. 나머지 상세 프로필
// (면허/인증/재무/실적/인력)은 여기서 다루지 않고 "회사 정보" 화면의
// 완성도 카드에서 나중에 채우도록 유도한다(#/me/profile은 그대로 유지).
// pendingInviteToken — 로그인/가입 전에 팀 초대 링크(#/invite?token=...)로
// 들어온 경우 그 토큰을 잠깐 담아둔다. 가입/로그인 성공 직후 이 값이
// 있으면 자동으로 초대를 수락한다("받은 사람이 가입/로그인하면 자동
// 합류" 스펙) — 가입이면 회사 정보 등록(2단계)도 건너뛴다(이미 있는
// 회사에 합류하는 것이지 새로 만드는 게 아니므로).
let pendingInviteToken = null;

async function acceptPendingInviteIfAny() {
  if (!pendingInviteToken) return;
  const token = pendingInviteToken;
  pendingInviteToken = null;
  try {
    await apiRequest('POST', '/api/invitations/' + encodeURIComponent(token) + '/accept', {});
    await loadMe();
  } catch (err) {
    // 실패해도(예: 자리 다 참, 이메일 불일치) 로그인/가입 자체는 이미
    // 성공했으니 홈으로는 보낸다 — 에러는 콘솔에만 남긴다.
    console.error('초대 자동 수락 실패:', err.message);
  }
}

// formatPhoneNumber — 서비스 전체 전화번호 입력 공용 포맷터(2026-08-04
// 전수 적용). 세 갈래로 나뉜다:
//  - 010: 항상 11자리(3-4-4: 010-1234-5678) — 프리픽스만으로 확정 가능.
//  - 011/016/017/018/019(구 통신사 번호): 항상 10자리(3-3-4: 011-123-4567)
//    — 이 두 모바일 분기는 기존 formatMobilePhoneInput과 동일한 로직을
//    그대로 유지한다(이미 검증된 동작, 새로 만들지 않음).
//  - 그 외(서울 02, 031~064 등 지역번호, 070 인터넷전화 등): 지역번호
//    뒤 나머지가 7자리(구형, 10자리 총합)일지 8자리(신형, 11자리 총합)일지
//    타이핑 도중엔 알 수 없다 — 항상 "마지막 4자리"를 고정하고 그 앞을
//    중간 그룹으로 삼는 가변형으로 처리(자릿수가 늘어날수록 중간 그룹이
//    자연스럽게 늘어나 최종적으로 3-3-4 또는 3-4-4/2-3-4 또는 2-4-4로
//    수렴한다).
function formatPhoneNumber(raw) {
  const allDigits = (raw || '').replace(/\D/g, '');
  if (allDigits.slice(0, 3) === '010') {
    const digits = allDigits.slice(0, 11);
    if (digits.length <= 3) return digits;
    if (digits.length <= 7) return `${digits.slice(0, 3)}-${digits.slice(3)}`;
    return `${digits.slice(0, 3)}-${digits.slice(3, 7)}-${digits.slice(7)}`;
  }
  if (/^01[16789]/.test(allDigits)) {
    const digits = allDigits.slice(0, 10);
    if (digits.length <= 3) return digits;
    if (digits.length <= 6) return `${digits.slice(0, 3)}-${digits.slice(3)}`;
    return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6)}`;
  }
  const digits = allDigits.slice(0, 11);
  const areaLen = digits.startsWith('02') ? 2 : 3;
  if (digits.length <= areaLen) return digits;
  const rest = digits.slice(areaLen);
  if (rest.length <= 4) return `${digits.slice(0, areaLen)}-${rest}`;
  const tail = rest.slice(-4);
  const middle = rest.slice(0, rest.length - 4);
  return `${digits.slice(0, areaLen)}-${middle}-${tail}`;
}

// attachPhoneAutoFormat — 위 포맷터를 input에 연결. 값을 통째로 다시
// 쓰는 단순한 방식이라 문자열 중간을 수정할 때 커서가 끝으로 이동할 수
// 있다 — 이 프로젝트의 다른 입력 처리도 커서 위치를 따로 관리하지 않는
// 것과 같은 수준의 단순함을 유지한 것(대부분 끝에서부터 이어 입력하는
// 전화번호 입력 특성상 실사용에 지장은 적다).
function attachPhoneAutoFormat(input) {
  if (!input) return;
  input.addEventListener('input', () => {
    input.value = formatPhoneNumber(input.value);
  });
}

// formatCurrency — 금액 입력/표시 공용 천단위 쉼표 포맷터(2026-08-04
// 전수 적용). 숫자든 이미 쉼표가 섞인 문자열이든 숫자 아닌 문자를 전부
// 제거한 뒤 다시 그룹핑한다 — "원" 접미사는 안 붙인다(호출부가 필요하면
// 직접 붙임, 기존 formatBudget/fmtMoney처럼 접미사가 필요 없는 입력창
// 표시에도 그대로 재사용할 수 있게).
// 영업이익/당기순이익처럼 손실(음수)이 실제로 존재하는 필드가 있어
// 맨 앞의 "-"는 살려둔다(그 외 문자는 전부 제거) — 나머지 자릿수만
// 쉼표로 묶는다.
function formatCurrency(n) {
  if (n === null || n === undefined || n === '') return '';
  const str = String(n).trim();
  const negative = str.charAt(0) === '-';
  const digits = str.replace(/[^\d]/g, '');
  if (!digits) return negative ? '-' : '';
  return (negative ? '-' : '') + Number(digits).toLocaleString('ko-KR');
}

// parseCurrencyInput — formatCurrency로 화면에 쉼표가 붙은 값을 저장
// 직전에 순수 숫자 문자열로 되돌린다(부호는 유지). 빈 값은 null(선택
// 입력 필드가 비어있는 상태와 "0원"을 구분하기 위해 빈 문자열이 아니라
// null로 통일).
function parseCurrencyInput(v) {
  if (v === null || v === undefined) return null;
  const str = String(v).trim();
  const negative = str.charAt(0) === '-';
  const digits = str.replace(/[^\d]/g, '');
  return digits === '' ? null : (negative ? '-' : '') + digits;
}

// attachCurrencyAutoFormat — 타이핑 중 실시간으로 쉼표를 삽입하되, 커서가
// 항상 "지나온 숫자 개수" 기준으로 같은 자리에 남도록 재계산한다(쉼표
// 자체는 세지 않음 — 그래야 중간에 숫자를 넣거나 지워도 커서가 엉뚱한
// 곳으로 튀지 않는다).
function attachCurrencyAutoFormat(input) {
  if (!input) return;
  input.addEventListener('input', () => {
    const prevValue = input.value;
    const prevCursor = input.selectionStart == null ? prevValue.length : input.selectionStart;
    const digitsBeforeCursor = prevValue.slice(0, prevCursor).replace(/[^\d]/g, '').length;
    const formatted = formatCurrency(prevValue);
    input.value = formatted;
    if (digitsBeforeCursor === 0) {
      input.setSelectionRange(0, 0);
      return;
    }
    let seen = 0;
    let pos = formatted.length;
    for (let i = 0; i < formatted.length; i++) {
      if (/\d/.test(formatted[i])) {
        seen += 1;
        if (seen === digitsBeforeCursor) { pos = i + 1; break; }
      }
    }
    input.setSelectionRange(pos, pos);
  });
}
