# Render Blueprint (https://render.com/docs/blueprint-spec)
# 배포 방법: Render 대시보드 -> New -> Blueprint -> 이 저장소 선택
# 무료 티어: web plan free, Postgres는 90일 무료 후 유료 전환 필요 (Render 정책,
# 배포 시점에 https://render.com/docs/free 에서 최신 조건 재확인 권장)
#
# 참고: Render 무료 플랜은 Background Worker 서비스 타입을 지원하지 않아,
# 수집 파이프라인은 별도 워커가 아니라 API 서버 프로세스 안에서 함께 실행됩니다
# (collector/cmd/apiserver/main.go의 startBackgroundCollection). 유료 플랜으로
# 전환 시 아래 worker 서비스 블록을 다시 추가하고 apiserver의 백그라운드 수집
# 호출을 제거하는 것을 권장합니다.

databases:
  - name: biz-platform-db
    plan: free
    databaseName: biz_platform
    user: biz

services:
  - type: web
    name: biz-platform-api
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile.apiserver
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biz-platform-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: G2B_SERVICE_KEY
        sync: false
      - key: BIZINFO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ALIGO_API_KEY
        sync: false
      - key: ALIGO_USER_ID
        sync: false
      - key: ALIGO_SENDER
        sync: false
      - key: TOSS_CLIENT_KEY
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # 첨부파일 미리보기(PDF 변환) — CloudConvert API 키(Bearer). 미설정이면 PDF는 그대로
      # 미리보기되고, HWP/HWPX/워드/엑셀 등 변환 대상은 "다운로드"로 폴백된다(서버는 죽지 않음).
      # CloudConvert는 HWP·HWPX·DOC·DOCX·XLS·XLSX→PDF를 공식 지원. CONVERT_API_BASE는
      # 기본 https://api.cloudconvert.com/v2 (샌드박스: https://api.sandbox.cloudconvert.com/v2).
      - key: CONVERT_API_KEY
        sync: false
      - key: CONVERT_API_BASE
        sync: false
    healthCheckPath: /healthz

  # 첨부파일 텍스트 추출 워커(analyzer/worker.py, Dockerfile.extractor) — 2026-08-16.
  # 운영에 이 consumer가 없어 모든 첨부가 extraction_status='pending'("텍스트 추출 중")으로
  # 영원히 남던 장애의 복구. apiserver와 별도 프로세스/이미지(Python). 입력은 DATABASE_URL뿐.
  # ⚠️ Render 무료 플랜은 Background Worker 타입을 지원하지 않는다(파일 상단 참고) — 이 블록을
  #    적용하려면 워커 서비스가 가능한 플랜/비용을 먼저 확인해야 하며, 대안은 같은 이미지를
  #    다른 플랫폼(Railway/Fly/VM 등)에서 DATABASE_URL만 주고 실행하는 것.
  # ⚠️ apiserver가 먼저 배포돼 ensureAttachmentExtractionWorkerColumns 마이그레이션이 적용된
  #    뒤 워커를 띄울 것(워커는 컬럼이 없으면 시작 시 명확히 종료).
  # 기본은 "워커 시작 이후 새로 수집된 첨부만" 처리(EXTRACTOR_PROCESS_EXISTING=false).
  # 과거 pending 백필은 `python worker.py --notice-id ...|--created-after ...|--limit N`으로 명시 실행.
  - type: worker
    name: biz-platform-extractor
    plan: starter
    runtime: docker
    dockerfilePath: ./Dockerfile.extractor
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biz-platform-db
          property: connectionString
      - key: EXTRACTOR_PROCESS_EXISTING
        value: "false"
      - key: EXTRACTOR_POLL_SECONDS
        value: "10"
