# Render Blueprint (https://render.com/docs/blueprint-spec)
# 배포 방법: Render 대시보드 -> New -> Blueprint -> 이 저장소 선택
# 무료 티어: web plan free, Postgres는 90일 무료 후 유료 전환 필요 (Render 정책,
# 배포 시점에 https://render.com/docs/free 에서 최신 조건 재확인 권장)
#
# 참고: Render 무료 플랜은 Background Worker 서비스 타입을 지원하지 않아,
# 수집 파이프라인은 별도 워커가 아니라 API 서버 프로세스 안에서 함께 실행됩니다
# (collector/cmd/apiserver/main.go의 startBackgroundCollection). 유료 플랜으로
# 전환 시 아래 worker 서비스 블록을 다시 추가하고 apiserver의 백그라운드 수집
# 호출을 제거하는 것을 권장합니다.

databases:
  - name: biz-platform-db
    plan: free
    databaseName: biz_platform
    user: biz

services:
  - type: web
    name: biz-platform-api
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile.apiserver
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biz-platform-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: G2B_SERVICE_KEY
        sync: false
      - key: BIZINFO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ALIGO_API_KEY
        sync: false
      - key: ALIGO_USER_ID
        sync: false
      - key: ALIGO_SENDER
        sync: false
      - key: TOSS_CLIENT_KEY
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # 첨부파일 미리보기(PDF 변환) — CloudConvert API 키(Bearer). 미설정이면 PDF는 그대로
      # 미리보기되고, HWP/HWPX/워드/엑셀 등 변환 대상은 "다운로드"로 폴백된다(서버는 죽지 않음).
      # CloudConvert는 HWP·HWPX·DOC·DOCX·XLS·XLSX→PDF를 공식 지원. CONVERT_API_BASE는
      # 기본 https://api.cloudconvert.com/v2 (샌드박스: https://api.sandbox.cloudconvert.com/v2).
      - key: CONVERT_API_KEY
        sync: false
      - key: CONVERT_API_BASE
        sync: false
    healthCheckPath: /healthz

  # 첨부파일 텍스트 추출 Cron Job(analyzer/worker.py --cron, Dockerfile.extractor) — 2026-08-17.
  # 운영에 이 consumer가 없어 모든 첨부가 extraction_status='pending'("텍스트 추출 중")으로
  # 영원히 남던 장애의 복구. apiserver와 별도 이미지(Python). 상시 Background Worker 대신
  # 15분 주기 Cron으로 "컷오버 이후 pending을 상한 안에서 처리하고 exit 0"(수집이 60분 주기라 충분).
  # ⚠️ Render cron schedule은 UTC. 한 서비스의 run은 동시에 1개만(겹치면 다음 run 지연) — DB claim은
  #    그와 별개로 FOR UPDATE SKIP LOCKED라 다른 플랫폼/수동 백필과 동시 실행해도 안전.
  # ⚠️ EXTRACTOR_CREATED_AFTER(고정 컷오버, ISO8601 UTC)는 생성 시 반드시 값 지정 — 미설정이면 워커가
  #    FAIL CLOSED로 종료(과거 12,000+ pending 전체 처리 방지). 컷오버 이전 첨부는 백필 CLI
  #    (`python worker.py --attachment-id|--notice-id|--limit|--created-after`)로만 명시 처리.
  # ⚠️ apiserver(ensureAttachmentExtractionWorkerColumns 포함 468f6d5+)가 먼저 배포돼 있어야 함.
  # 비용: 실행시간 초 단위 비례 + cron job당 월 최소요금(Render 정책, 금액은 대시보드 확인).
  - type: cron
    name: biz-platform-extractor
    plan: starter
    runtime: docker
    dockerfilePath: ./Dockerfile.extractor
    schedule: "*/15 * * * *"
    dockerCommand: python worker.py --cron
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biz-platform-db
          property: connectionString
      # 고정 컷오버(예: "2026-08-17T00:00:00Z"). 값은 생성 시 대시보드에서 입력(sync: false).
      - key: EXTRACTOR_CREATED_AFTER
        sync: false
      - key: EXTRACTOR_CRON_MAX_ITEMS
        value: "30"
      - key: EXTRACTOR_CRON_MAX_RUNTIME_SECONDS
        value: "600"
